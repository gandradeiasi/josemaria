lho e ao Espírito Santo, e à tua Mãe, que te façam conhecer-te e chorar por esse montão de coisas sujas que passaram por ti, deixando - ai! - tanto resíduo... E ao mesmo tempo, sem quereres afastar-te dessa consideração, diz-Lhe: - Dá-me, Jesus, um Amor qual fogueira de purificação, onde a minha pobre carne, o meu pobre coração, a minha pobre alma, o meu pobre corpo se consumam, limpando-se de todas as misérias terrenas... E, já vazio todo o meu eu, enche-o de Ti: que não me apegue a nada daqui de baixo; que sempre me sustente o Amor."}, {"n": 42, "chapter": "Deslumbramento", "text": "Não desejes nada para ti, nem bom nem mau: tens de querer para ti somente o que Deus quiser. Seja o que for, vindo da sua mão - de Deus -, por ruim que pareça aos olhos dos homens, a ti parecer-te-á bom, e muito bom!, e dirás, com uma convicção sempre maior: “Et in tribulatione mea dilatasti me..., et calix tuus inebrians, quam praeclarus est!” - encontrei alegria na tribulação..., como é maravilhoso o teu cálice, que embriaga todo o meu ser!"}, {"n": 43, "chapter": "Deslumbramento", "text": "É preciso oferecer ao Senhor o sacrifício de Abel. Um sacrifício de carne jovem e formosa, o melhor do rebanho: de carne sadia e santa; de corações que só tenham um amor: Tu, meu Deus!; de inteligências trabalhadas pelo estudo profundo, que se renderão perante a tua Sabedoria; de almas infantis, que só pensarão em agradar-Te. - Recebe desde agora, Senhor, este sacrifício em odor de suavidade."}, {"n": 44, "chapter": "Deslumbramento", "text": "É preciso saber entregar-se, arder diante de Deus, como essa luz que se coloca sobre o candelabro para iluminar os homens que andam em trevas; como essas lamparinas que se queimam junto do altar, e se consomem alumiando até se gastarem."}, {"n": 45, "chapter": "Deslumbramento", "text": "O Senhor - Mestre de Amor - é um amante ciumento que pede tudo o que é nosso, todo o nosso querer. Ele espera que Lhe ofereçamos o que temos, seguindo o caminho que nos marcou a cada um."}, {"n": 46, "chapter": "Deslumbramento", "text": "Meu Deus, vejo que não te aceitarei como meu Salvador, se não te reconhecer ao mesmo tempo como Modelo. - Já que quiseste ser pobre, dá-me amor à Santa Pobreza. O meu propósito, com a tua ajuda, é viver e morrer pobre, ainda que tenha milhões à minha disposição."}, {"n": 47, "chapter": "Deslumbramento", "text": "Ficaste muito sério quando te confiei: para o Senhor, a mim tudo me parece pouco."}, {"n": 48, "chapter": "Deslumbramento", "text": "Oxalá se possa dizer que a característica que define a tua vida é: “amar a Vontade de Deus”."}, {"n": 49, "chapter": "Deslumbramento", "text": "Qualquer trabalho, mesmo o mais escondido, mesmo o mais insignificante, oferecido ao Senhor, traz a força da vida de Deus!"}, {"n": 50, "chapter": "Deslumbramento", "text": "Tens de sentir a responsabilidade da tua missão: contempla-te o Céu inteiro!"}, {"n": 51, "chapter": "Deslumbramento", "text": "Deus espera-te! - Por isso, aí onde estás, tens de comprometer-te a imitá - Lo, a unir-te a Ele, com alegria, com amor, com entusiasmo, ainda que se apresente a circunstância - ou uma situação permanente - de teres de caminhar a contragosto. Deus espera-te..., e te necessita fiel!"}, {"n": 52, "chapter": "Deslumbramento", "text": "Escrevias: “Eu te ouço clamar, meu Rei, com viva voz, que ainda vibra: “Ignem veni mittere in terram, et quid volo nisi ut accendatur?” - vim trazer fogo à terra, e que quero senão que arda?”. Depois acrescentavas: “Senhor, eu te respondo - eu inteiro - com os meus sentidos e potências: “Ecce ego quia vocasti me!” - aqui me tens porque me chamaste!”. - Que esta tua resposta seja uma realidade cotidiana."}, {"n": 53, "chapter": "Deslumbramento", "text": "Deves ter o comedimento, a fortaleza, o senso de responsabilidade que muitos adquirem com o passar dos anos, com a velhice. Alcançarás tudo isso, sendo jovem, se não perdes o sentido sobrenatural de filho de Deus: porque Ele te dará, mais que aos anciãos, essas condições convenientes para realizares o teu trabalho de apóstolo."}, {"n": 54, "chapter": "Deslumbramento", "text": "Experimentas uma alegria interior e uma paz que não trocarias por nada. Deus está aqui: não há coisa melhor do que contar-Lhe as penas, para que deixem de ser penas."}, {"n": 55, "chapter": "Deslumbramento", "text": "Como é possível que Cristo venha atuando na terra há tantos anos - vinte séculos -, e que o mundo esteja assim?, perguntavas-me. Como é possível que ainda haja gente que não conhece o Senhor?, insistias. - E eu te respondi, convicto: - Temos a culpa nós!, que fomos chamados para ser corredentores, e às vezes - talvez muitas! - não correspondemos a essa Vontade de Deus."}, {"n": 56, "chapter": "Deslumbramento", "text": "Humildade de Jesus: que vergonha, por contraste, para mim - pó de esterco -, que tantas vezes disfarcei a minha soberba sob a capa da dignidade, da justiça!... - E assim, quantas ocasiões de seguir o Mestre não perdi, ou desaproveitei, por não as sobrenaturalizar!"}, {"n": 57, "chapter": "Deslumbramento", "text": "Doce Mãe..., leva-nos até uma loucura que faça, dos outros, loucos pelo nosso Cristo. Maria, doce Senhora: que o Amor não seja em nós falso incêndio de fogos fátuos, produto às vezes de cadáveres decompostos...; que seja verdadeiro incêndio voraz, que ateie e queime tudo quanto toque."}, {"n": 58, "chapter": "Luta", "text": "Escolha divina significa - e exige! - santidade pessoal."}, {"n": 59, "chapter": "Luta", "text": "Se corresponderes à chamada que o Senhor te fez, a tua vida - a tua pobre vida! - deixará na história da humanidade um sulco profundo e largo, luminoso e fecundo, eterno e divino."}, {"n": 60, "chapter": "Luta", "text": "Deves sentir cada dia a obrigação de ser santo. - Santo!, que não é fazer coisas esquisitas: é lutar na vida interior e no cumprimento heróico, acabado, do dever."}, {"n": 61, "chapter": "Luta", "text": "A santidade não consiste em grandes ocupações. - Consiste em lutar para que a tua vida não se apague no terreno sobrenatural; em te deixares queimar até à última fibra, servindo a Deus no último lugar... ou no primeiro: onde o Senhor te chamar."}, {"n": 62, "chapter": "Luta", "text": "O Senhor não se limitou a dizer-nos que nos ama: demonstrou-nos esse amor com as suas obras, com a vida inteira. - E tu?"}, {"n": 63, "chapter": "Luta", "text": "Se amas o Senhor, tens de notar “necessariamente” o bendito peso das almas, para levá-las a Deus."}, {"n": 64, "chapter": "Luta", "text": "Para quem quer viver de Amor com maiúscula, o meio-termo é muito pouco, é mesquinhez, cálculo ruim."}, {"n": 65, "chapter": "Luta", "text": "Esta é a receita para o teu caminho de cristão: oração, penitência, trabalho sem descanso, com um cumprimento amoroso do dever."}, {"n": 66, "chapter": "Luta", "text": "Meu Deus, ensina-me a amar! - Meu Deus, ensina-me a orar!"}, {"n": 67, "chapter": "Luta", "text": "Devemos pedir a Deus a fé, a esperança e a caridade - com humildade, com oração perseverante, com uma conduta honrada e com costumes limpos."}, {"n": 68, "chapter": "Luta", "text": "Disseste-me que não sabias como pagar-me o zelo santo que te inundava a alma. - Apressei-me a responder-te: - Eu não te dou nenhuma vibração; é o Espírito Santo quem a concede. - Ama-O, trata-O de perto. - Assim irás amando-O mais e melhor, e agradecendo-Lhe que seja Ele quem se instale na tua alma, para que tenhas vida interior."}, {"n": 69, "chapter": "Luta", "text": "Deves lutar por conseguir que o Santo Sacrifício do Altar seja o centro e a raiz da tua vida interior, de modo que todo o teu dia se converta num ato de culto - prolongamento da Missa a que assististe e preparação para a seguinte -, que vai transbordando em jaculatórias, em visitas ao Santíssimo Sacramento, em oferecimento do teu trabalho profissional e da tua vida familiar..."}, {"n": 70, "chapter": "Luta", "text": "Procura dar graças a Jesus na Eucaristia, cantando louvores a Nossa Senhora, a Virgem pura, a sem mancha, aquela que trouxe ao mundo o Senhor. - E, com audácia de criança, atreve-te a dizer a Jesus: - Meu lindo Amor, bendita seja a Mãe que te trouxe ao mundo! Com certeza que Lhe agradas, e Ele porá na tua alma ainda mais amor."}, {"n": 71, "chapter": "Luta", "text": "Conta o Evangelista São Lucas que Jesus orava... Como seria a oração de Jesus! Contempla devagar esta realidade: os discípulos convivem com Jesus Cristo e, nas suas conversas, o Senhor ensina-lhes - também com as ações - como devem orar, e o grande portento da misericórdia divina: que somos filhos de Deus, e que podemos dirigir-nos a Ele, como um filho fala com seu Pai."}, {"n": 72, "chapter": "Luta", "text": "Ao empreenderes cada jornada para trabalhar junto de Cristo e atender tantas almas que O procuram, convence-te de que não há senão um caminho: recorrer ao Senhor. - Somente na oração, e com a oração, aprendemos a servir os outros!"}, {"n": 73, "chapter": "Luta", "text": "A oração - lembra-te disto - não consiste em pronunciar discursos bonitos, frases grandiloqflentes ou que consolem... Oração é às vezes um olhar a uma imagem do Senhor ou de sua Mãe; outras, um pedido, com palavras; outras, o oferecimento das boas obras, dos resultados da fidelidade... Como o soldado que está de guarda, assim temos nós que estar à porta de Deus Nosso Senhor: e isso é oração. Ou como o cachorrinho que se deita aos pés do seu amo. - Não te importes de Lhe dizer: - Senhor, aqui me tens como um cão fiel; ou melhor, como um jumentinho, que não dará coices a quem lhe quer bem."}, {"n": 74, "chapter": "Luta", "text": "Todos temos de ser “ipse Christus” - o próprio Cristo. Assim no-lo manda São Paulo em nome de Deus: “Induimini Dominum Iesum Christum” - revesti-vos de Jesus Cristo. Cada um de nós - tu! - tem que ver como veste essa roupa de que nos fala o Apóstolo; cada um, pessoalmente, deve dialogar sem interrupção com o Senhor."}, {"n": 75, "chapter": "Luta", "text": "A tua oração não pode ficar em meras palavras: deve ter realidades e conseqflências práticas."}, {"n": 76, "chapter": "Luta", "text": "Orar é o caminho para atalhar todos os males que sofremos."}, {"n": 77, "chapter": "Luta", "text": "Dar-te-ei um conselho que não me cansarei de repetir às almas: que ames com loucura a Mãe de Deus, que é Mãe nossa."}, {"n": 78, "chapter": "Luta", "text": "O heroísmo, a santidade, a audácia, requerem uma constante preparação espiritual. Aos outros, sempre darás somente aquilo que tiveres; e, para lhes dar Deus, tens de cultivar o trato com Ele, viver a sua Vida, servi-Lo."}, {"n": 79, "chapter": "Luta", "text": "Não deixarei de insistir contigo, para que se grave bem na tua alma: piedade!, piedade!, piedade! Já que, se faltas à caridade, será por escassa vida interior; não por teres mau caráter."}, {"n": 80, "chapter": "Luta", "text": "Se és bom filho de Deus, do mesmo modo que a criança necessita da presença de seus pais ao levantar e ao deitar-se, o teu primeiro e o teu último pensamento de cada dia serão para Ele."}, {"n": 81, "chapter": "Luta", "text": "Tens de ser constante e exigente nas tuas normas de piedade, também quando estás cansado ou quando se tornam áridas para ti. Persevera! Esses momentos são como as estacas altas, pintadas de vermelho, que, nas estradas de montanha, quando chega a neve, servem de ponto de referência e indicam - sempre! - onde está o caminho seguro."}, {"n": 82, "chapter": "Luta", "text": "Esforça-te por corresponder, em cada instante, ao que Deus te pede: deves ter vontade de amá-Lo com obras. - Com obras pequenas, mas sem deixar nem uma."}, {"n": 83, "chapter": "Luta", "text": "A vida interior se robustece pela luta nas práticas diárias de piedade, que deves cumprir - mais: que deves viver! - amorosamente, porque o nosso caminho de filhos de Deus é de Amor."}, {"n": 84, "chapter": "Luta", "text": "Procura a Deus no fundo do teu coração limpo, puro; no fundo da tua alma quando Lhe és fiel. E não percas nunca essa intimidade! - E, se alguma vez não sabes como falar-Lhe nem o que dizer, ou não te atreves a buscar Jesus dentro de ti, recorre a Maria, “tota pulchra” - toda pura, maravilhosa -, para confiar-lhe: - Senhora, Mãe nossa, o Senhor quis que fosses tu, com as tuas mãos, quem cuidasse de Deus: ensina-me - ensina-nos a todos - a tratar o teu Filho!"}, {"n": 85, "chapter": "Luta", "text": "Inculcai nas almas o heroísmo de fazer com perfeição as pequenas coisas de cada dia: como se de cada uma dessas ações dependesse a salvação do mundo."}, {"n": 86, "chapter": "Luta", "text": "Com a tua vida de piedade, aprenderás a praticar as virtudes próprias da tua condição de filho de Deus, de cristão. - E, juntamente com essas virtudes, adquirirás toda essa gama de valores espirituais, que parecem pequenos e são grandes; pedras preciosas que brilham, que temos de apanhar pelo caminho, para levá-las aos pés do Trono de Deus, a serviço dos homens: a simplicidade, a alegria, a lealdade, a paz, as pequenas renúncias, os serviços que passam despercebidos, o fiel cumprimento do dever, a amabilidade..."}, {"n": 87, "chapter": "Luta", "text": "Não cries para ti mais obrigações do que... a glória de Deus, o seu Amor, o seu Apostolado."}, {"n": 88, "chapter": "Luta", "text": "O Senhor te fez ver claramente o teu caminho de cristão no meio do mundo. No entanto, asseguras-me que muitas vezes consideraste, com inveja - disseste-me que no fundo era comodismo -, a felicidade de ser um desconhecido, trabalhando, ignorado de todos, no último canto... Deus e tu! - Agora, à parte a idéia de missionar no Japão, vem-te à cabeça o pensamento dessa vida oculta e sofrida... Mas se, ao ficares livre de outras santas obrigações naturais, tratasses de “esconder-te” numa instituição religiosa qualquer, sem ser essa a tua vocação, não serias feliz. - Faltar-te-ia a paz, porque terias feito a tua vontade, não a de Deus. - A tua “vocação”, nesse caso, teria outro nome: defecção, produto não de divina inspiração, mas de puro medo humano à luta que se avizinha. E isso... não!"}, {"n": 89, "chapter": "Luta", "text": "Contra a vida limpa, a pureza santa, levanta-se uma grande dificuldade a que todos estamos expostos: o perigo do aburguesamento, na vida espiritual ou na vida profissional; o perigo - também para os chamados por Deus ao matrimônio - de nos sentirmos solteirões, egoístas, pessoas sem amor. - Tens de lutar na raiz contra esse risco, sem concessões de nenhum gênero."}, {"n": 90, "chapter": "Luta", "text": "Para venceres a sensualidade - porque carregaremos sempre às costas este burriquinho do nosso corpo -, tens de viver generosamente, diariamente, as pequenas mortificações - e, em algumas ocasiões, as grandes -; e tens de manter-te na presença de Deus, que nunca deixa de olhar-te."}, {"n": 91, "chapter": "Luta", "text": "A tua castidade não pode limitar-se a evitar a queda, a ocasião... Não pode ser de maneira alguma uma negação fria e matemática. - Já percebeste que a castidade é uma virtude e que, como tal, deve crescer e aperfeiçoar-se? - Não te basta, pois, ser continente - dentro do teu estado de vida -, mas casto, com virtude heróica."}, {"n": 92, "chapter": "Luta", "text": "O “bonus odor Christi” - o bom odor de Cristo - é também o da nossa vida limpa, o da castidade - cada um no seu estado de vida, repito -, o da santa pureza, que é afirmação gozosa: algo inteiriço e delicado ao mesmo tempo, fino, que evita até manifestações de palavras inconvenientes, porque não podem agradar a Deus."}, {"n": 93, "chapter": "Luta", "text": "Acostuma-te a dar graças antecipadas aos Anjos da Guarda..., para obrigá - los mais."}, {"n": 94, "chapter": "Luta", "text": "A todo o cristão deveria poder aplicar-se a expressão que se usou nos primeiros tempos: “portador de Deus”. - Deves atuar de tal modo que possam atribuir-te “com verdade” esse admirável qualificativo."}, {"n": 95, "chapter": "Luta", "text": "Considera o que aconteceria se nós, os cristãos, não quiséssemos viver como tais... E retifica a tua conduta!"}, {"n": 96, "chapter": "Luta", "text": "Contempla o Senhor por trás de cada acontecimento, de cada circunstância, e assim saberás extrair de tudo o que sucede mais amor de Deus, e mais desejos de correspondência, porque Ele nos espera sempre, e nos oferece a possibilidade de cumprirmos continuamente esse propósito que fizemos: “Serviam!”, eu Te servirei!"}, {"n": 97, "chapter": "Luta", "text": "Renova em cada dia o desejo eficaz de aniquilar-te, de abnegar-te, de esquecer-te de ti mesmo, de caminhar “in novitate sensus”, com uma vida nova, trocando esta nossa miséria por toda a grandeza oculta e eterna de Deus."}, {"n": 98, "chapter": "Luta", "text": "Senhor! Concede-me que eu seja tão teu que não entrem em meu coração nem sequer os afetos mais santos, se não for através do teu Coração chagado."}, {"n": 99, "chapter": "Luta", "text": "Procura ser delicado, pessoa de boas maneiras. Não sejas grosseiro! - Delicado sempre, o que não quer dizer amaneirado."}, {"n": 100, "chapter": "Luta", "text": "A caridade tudo alcança. Sem caridade, nada se pode fazer. Amor!, portanto; é o segredo da tua vida... Ama! Sofre com alegria. Enrijece a tua alma. Viriliza a tua vontade. Assegura a tua entrega ao querer de Deus e, com isso, virá a eficácia."}, {"n": 101, "chapter": "Luta", "text": "Sê simples e piedoso como uma criança, e rijo e forte como um líder."}, {"n": 102, "chapter": "Luta", "text": "A paz, que traz consigo a alegria, o mundo não a pode dar. - Os homens estão sempre fazendo pazes, e andam sempre enredados em guerras, porque esqueceram o conselho de lutar por dentro, de recorrer ao auxílio de Deus, para que Ele vença, e assim consigam a paz no seu próprio eu, no seu próprio lar, na sociedade e no mundo. - Se nos comportarmos deste modo, a alegria será tua e minha, porque é propriedade dos que vencem. E com a graça de Deus - que não perde batalhas - chamar-nos-emos vencedores, se formos humildes."}, {"n": 103, "chapter": "Luta", "text": "A tua vida, o teu trabalho, não deve ser ação negativa, não deve ser “anti - nada”. É - deve ser! - afirmação, otimismo, juventude, alegria e paz."}, {"n": 104, "chapter": "Luta", "text": "Há dois pontos capitais na vida dos povos: as leis sobre o matrimônio e as leis sobre o ensino. E aí os filhos de Deus têm de permanecer firmes, lutar bem e com nobreza, por amor a todas as criaturas."}, {"n": 105, "chapter": "Luta", "text": "A alegria é um bem cristão, que possuímos enquanto lutamos, porque é conseqflência da paz. A paz é fruto de se ter vencido a guerra, e a vida do homem sobre a terra - lemos na Escritura Santa - é luta."}, {"n": 106, "chapter": "Luta", "text": "A nossa guerra divina é uma maravilhosa semeadura de paz."}, {"n": 107, "chapter": "Luta", "text": "Aquele que deixa de lutar causa um mal à Igreja, ao seu empreendimento sobrenatural, aos seus irmãos, a todas as almas. - Examina-te: não podes pôr mais vibração de amor a Deus na tua luta espiritual? - Eu rezo por ti... e por todos. Faz tu o mesmo."}, {"n": 108, "chapter": "Luta", "text": "Jesus, se há em mim alguma coisa que te desagrade, dize-o, para que a arranquemos."}, {"n": 109, "chapter": "Luta", "text": "Há um inimigo da vida interior, pequeno, bobo; mas muito eficaz, infelizmente: o pouco empenho no exame de consciência."}, {"n": 110, "chapter": "Luta", "text": "Na ascética cristã, o exame de consciência corresponde a uma necessidade de amor, de sensibilidade."}, {"n": 111, "chapter": "Luta", "text": "Se alguma coisa não estiver de acordo com o espírito de Deus, deixa-a imediatamente! Pensa nos Apóstolos: eles não valiam nada, mas no nome do Senhor fazem milagres. Somente Judas, que talvez também tivesse feito milagres, se extraviou, por se ter afastado voluntariamente de Cristo, por não ter cortado, violenta e valentemente, com o que não estava de acordo com o espírito de Deus."}, {"n": 112, "chapter": "Luta", "text": "Meu Deus, quando é que me vou converter?"}, {"n": 113, "chapter": "Luta", "text": "Não esperes pela velhice para ser santo: seria um grande equívoco! - Começa agora, seriamente, gozosamente, alegremente, através das tuas obrigações, do teu trabalho, da vida cotidiana... Não esperes pela velhice para ser santo, porque, além de ser um grande equívoco - insisto -, não sabes se chegará para ti."}, {"n": 114, "chapter": "Luta", "text": "Suplica ao Senhor que te conceda toda a sensibilidade necessária para perceberes a maldade do pecado venial; para o considerares como autêntico e radical inimigo da tua alma; e para o evitares com a graça de Deus."}, {"n": 115, "chapter": "Luta", "text": "Com serenidade, sem escrúpulos, tens de pensar na tua vida, e pedir perdão, e fazer o propósito firme, concreto e bem determinado de melhorar neste ponto e naquele outro: nesse detalhe que te custa, e naquele que habitualmente não cumpres como deves, e o sabes."}, {"n": 116, "chapter": "Luta", "text": "Enche-te de bons desejos, que é uma coisa santa, e que Deus louva. Mas não fiques nisso! Tens de ser alma - homem, mulher - de realidades. Para levares a cabo esses bons desejos, necessitas de formular propósitos claros, precisos. - E depois, meu filho, toca a lutar, para os pôr em prática com a ajuda de Deus!"}, {"n": 117, "chapter": "Luta", "text": "Como hei de fazer para que o meu amor ao Senhor continue, para que aumente? - perguntas-me com ardor. - Filho, ir deixando o homem velho, também com a entrega prazerosa daquelas coisas, boas em si mesmas, mas que impedem o desprendimento do teu eu... É dizer ao Senhor, com obras e continuamente: “Aqui me tens, para o que quiseres”."}, {"n": 118, "chapter": "Luta", "text": "Santo! O filho de Deus deverá exagerar na virtude, se é que nisto é possível o exagero..., porque os outros hão de contemplar-se nele, como num espelho, e só apontando muito alto é que chegarão ao ponto médio."}, {"n": 119, "chapter": "Luta", "text": "Não te cause vergonha descobrir que tens no coração o “fomes peccati” - a inclinação para o mal -, que te acompanhará enquanto viveres, porque ninguém está livre dessa carga. Não te envergonhes, porque o Senhor, que é onipotente e misericordioso, nos deu todos os meios idôneos para superar essa inclinação: os Sacramentos, a vida de piedade, o trabalho santificado. - Emprega-os com perseverança, disposto a começar e recomeçar, sem desânimo."}, {"n": 120, "chapter": "Luta", "text": "Senhor, livra-me de mim mesmo!"}, {"n": 121, "chapter": "Luta", "text": "O apóstolo sem oração habitual e metódica cai necessariamente na tibieza..., e deixa de ser apóstolo."}, {"n": 122, "chapter": "Luta", "text": "Senhor, que a partir de agora eu seja outro: que não seja “eu”, mas “aquele” que Tu desejas. - Que não te negue nada do que me peças. Que saiba orar. Que saiba sofrer. Que nada me preocupe, a não ser a tua glória. Que sinta a tua presença continuamente. - Que ame o Pai. Que te deseje a Ti, meu Jesus, numa permanente Comunhão. Que o Espírito Santo me inflame."}, {"n": 123, "chapter": "Luta", "text": "Meus es tu - tu és meu. Foi o que o Senhor te manifestou. - Que esse Deus, que é toda a formosura e toda a sabedoria, toda a grandeza e toda a bondade, te diga a ti que és seu!... E que tu não Lhe saibas corresponder!"}, {"n": 124, "chapter": "Luta", "text": "Não podes espantar-te se, na tua vida, sentes aquele peso de que falava São Paulo: “Vejo que há outra lei nos meus membros que é contrária à lei do meu espírito”. - Lembra-te então de que és de Cristo, e vai ter com a Mãe de Deus, que é tua Mãe: eles não te abandonarão."}, {"n": 125, "chapter": "Luta", "text": "Tens de receber os conselhos que te dêem na direção espiritual como se viessem do próprio Jesus Cristo."}, {"n": 126, "chapter": "Luta", "text": "Pediste-me uma sugestão para venceres nas tuas batalhas diárias, e eu te respondi: - Ao abrires a tua alma, conta em primeiro lugar o que não quererias que se soubesse. Assim o diabo sai sempre vencido. - Abre a tua alma com clareza e simplicidade, de par em par, para que entre - até o último recanto - o sol do Amor de Deus!"}, {"n": 127, "chapter": "Luta", "text": "Se o demônio mudo - de que nos fala o Evangelho - se mete na tua alma, põe tudo a perder. Mas se é expulso imediatamente, tudo corre bem, caminha-se feliz, tudo anda. - Propósito firme: “sinceridade selvagem” na direção espiritual, unida a uma delicada educação... E que essa sinceridade seja imediata."}, {"n": 128, "chapter": "Luta", "text": "Tens de amar e procurar a ajuda de quem orienta a tua alma. Na direção espiritual, põe a descoberto o teu coração, por inteiro - podre, se estiver podre! -, com sinceridade, com ânsias de curar-te; senão, essa podridão não desaparecerá nunca. Se recorres a uma pessoa que só pode limpar a ferida superficialmente..., és um covarde, porque no fundo vais ocultar a verdade, com prejuízo para ti próprio."}, {"n": 129, "chapter": "Luta", "text": "Nunca tenhas medo de dizer a verdade, sem esquecer que algumas vezes é melhor calar-se, por caridade para com o próximo. Mas nunca te cales por desídia, por comodismo ou por covardia."}, {"n": 130, "chapter": "Luta", "text": "O mundo vive da mentira. E há vinte séculos que a Verdade veio aos homens. - É preciso dizer a verdade!, e é isso que temos de propor-nos os filhos de Deus. Quando os homens se acostumarem a proclamá-la e a ouvi-la, haverá mais compreensão nesta nossa terra."}, {"n": 131, "chapter": "Luta", "text": "Seria uma falsa caridade, diabólica, mentirosa caridade, ceder em questões de fé. “Fortes in fide” - fortes na fé, firmes, como exige São Pedro. - Não é fanatismo, mas simplesmente viver a fé: não significa desamor para com ninguém. Cedemos em tudo o que é acidental, mas na fé não é possível ceder: não podemos dar o azeite das nossas lâmpadas, porque depois vem o Esposo e as encontra apagadas."}, {"n": 132, "chapter": "Luta", "text": "Humildade e obediência são condições indispensáveis para recebermos a boa doutrina."}, {"n": 133, "chapter": "Luta", "text": "Tens de acolher a palavra do Papa com uma adesão religiosa, humilde, interna e eficaz: serve-lhe de eco!"}, {"n": 134, "chapter": "Luta", "text": "Ama, venera, reza, mortifica-te - cada dia com mais carinho - pelo Romano Pontífice, pedra basilar da Igreja, que prolonga entre todos os homens, ao longo dos séculos e até o fim dos tempos, aquela tarefa de santificação e de governo que Jesus confiou a Pedro."}, {"n": 135, "chapter": "Luta", "text": "O teu maior amor, a tua maior estima, a tua mais profunda veneração, a tua obediência mais rendida, o teu maior afeto hão de ser também para o Vice-Cristo na terra, para o Papa. Nós, os católicos, temos de pensar que, depois de Deus e da nossa Mãe a Virgem Santíssima, na hierarquia do amor e da autoridade, vem o Santo Padre."}, {"n": 136, "chapter": "Luta", "text": "Que a consideração diária do duro fardo que pesa sobre o Papa e sobre os bispos, te inste a venerá-los, a estimá-los com verdadeiro afeto, a ajudá-los com a tua oração."}, {"n": 137, "chapter": "Luta", "text": "Deves tornar o teu amor pela Santíssima Virgem mais vivo, mais sobrenatural. - Não vás a Santa Maria só para pedir. Vai também para dar!: para dar-lhe afeto; para dar-lhe amor para o seu Filho divino; para manifestar-lhe esse carinho com obras de serviço no trato com os outros, que são também filhos dEla."}, {"n": 138, "chapter": "Luta", "text": "Jesus é o modelo: imitemo-Lo! - Imitemo-Lo servindo a Igreja Santa e todas as almas."}, {"n": 139, "chapter": "Luta", "text": "Ao contemplares a cena da Encarnação, reforça na tua alma a decisão de uma “humildade prática”. Olha que Ele se abaixou, assumindo a nossa pobre natureza. - Por isso, em cada dia, tens de reagir - imediatamente! -, com a graça de Deus, aceitando - querendo - as humilhações que o Senhor te deparar."}, {"n": 140, "chapter": "Luta", "text": "Vive a vida cristã com naturalidade! Insisto: dá a conhecer Cristo na tua conduta, tal como um espelho normal reproduz a imagem, sem deformá - la, sem fazer caricatura. - Se fores normal, como esse espelho, refletirás a vida de Cristo, e a mostrarás aos outros."}, {"n": 141, "chapter": "Luta", "text": "Se és fátuo, se te preocupas somente com a tua comodidade pessoal, se centras a existência dos outros e até a do mundo em ti mesmo, não tens o direito de chamar-te cristão, nem de considerar-te discípulo de Cristo: porque Ele fixou, como limite do exigir-se, que se ofereça por cada um “et animam suam”, a própria alma, a vida inteira."}, {"n": 142, "chapter": "Luta", "text": "Procura que a “humildade de entendimento” seja, para ti, um axioma. Pensa nisso devagar e... não é verdade que não se compreende como possa haver “soberbos de entendimento”? Bem o explicava aquele santo doutor da Igreja: “É uma desordem detestável que, vendo a Deus feito criança, o homem queira continuar a parecer grande sobre a terra”."}, {"n": 143, "chapter": "Luta", "text": "Sempre que tenhas alguém a teu lado - seja quem for -, procura, sem fazer coisas estranhas, o modo de contagiar-lhe a tua alegria de ser e de viver como filho de Deus."}, {"n": 144, "chapter": "Luta", "text": "Grande e bela é a missão de servir que o Divino Mestre nos confiou. - Por isso, este bom espírito - de grande senhor! - compagina-se perfeitamente com o amor pela liberdade que deve impregnar o trabalho dos cristãos."}, {"n": 145, "chapter": "Luta", "text": "Tu não podes tratar ninguém com falta de misericórdia; e, se te parecer que uma pessoa não é digna dessa misericórdia, tens de pensar que tu também não mereces nada. - Não mereces ter sido criado, nem ser cristão, nem ser filho de Deus, nem pertencer à tua família..."}, {"n": 146, "chapter": "Luta", "text": "Não descures a prática da correção fraterna, manifestação clara da virtude sobrenatural da caridade. Custa; é mais cômodo inibir-se; mais cômodo!, mas não é sobrenatural. - E destas omissões terás de prestar contas a Deus."}, {"n": 147, "chapter": "Luta", "text": "A correção fraterna, sempre que devas fazê-la, há de estar cheia de delicadeza - de caridade! - na forma e no fundo, pois naquele momento és instrumento de Deus."}, {"n": 148, "chapter": "Luta", "text": "Se souberes amar os outros e difundires esse carinho - caridade de Cristo, fina, delicada - entre todos, apoiar-vos-eis uns aos outros; e aquele que estiver para cair sentir-se-á sustentado - e urgido - por essa fortaleza fraterna, para ser fiel a Deus."}, {"n": 149, "chapter": "Luta", "text": "Fomenta o teu espírito de mortificação nos detalhes de caridade, com ânsias de tornar amável a todos o caminho de santidade no meio do mundo: às vezes, um sorriso pode ser a melhor prova do espírito de penitência."}, {"n": 150, "chapter": "Luta", "text": "Oxalá saibas - todos os dias e com generosidade - sacrificar-te alegre e discretamente para servir e para tornar agradável a vida aos outros. - Este modo de proceder é verdadeira caridade de Jesus Cristo."}, {"n": 151, "chapter": "Luta", "text": "Tens de procurar que, estejas onde estiveres, haja esse “bom humor” - essa alegria - que é fruto da vida interior."}, {"n": 152, "chapter": "Luta", "text": "Cuida de praticar uma mortificação muito interessante: que as tuas conversas não girem à volta de ti mesmo."}, {"n": 153, "chapter": "Luta", "text": "Um bom modo de fazer exame de consciência: - Recebi como expiação, neste dia, as contrariedades vindas da mão de Deus? As que me proporcionaram, com o seu caráter, os meus colegas? As da minha própria miséria? - Soube oferecer ao Senhor, como expiação, a própria dor que sinto de tê - Lo ofendido, tantas vezes!? Ofereci-Lhe a vergonha dos meus rubores e humilhações interiores, ao considerar como avanço pouco no caminho das virtudes?"}, {"n": 154, "chapter": "Luta", "text": "Mortificações habituais, costumeiras: sim! Mas não sejas monomaníaco. - Não devem consistir necessariamente nas mesmas: o que deve ser constante, habitual, costumeiro - sem “acostumação” - é o espírito de mortificação."}, {"n": 155, "chapter": "Luta", "text": "Tu queres pisar sobre as pegadas de Cristo, vestir-te com as suas vestes, identificar-te com Jesus. Pois bem, que a tua fé seja operativa e sacrificada, com atos de serviço, lançando fora o que estorva."}, {"n": 156, "chapter": "Luta", "text": "A santidade tem a flexibilidade dos músculos soltos. Quem quer ser santo sabe comportar-se de tal maneira que, ao mesmo tempo que faz uma coisa que o mortifica, omite - se não é ofensa a Deus - outra que também lhe custa, e dá graças ao Senhor por essa comodidade. Se nós, os cristãos, atuássemos de outro modo, correríamos o risco de tornar-nos rígidos, sem vida, como uma boneca de trapos. A santidade não tem a rigidez do cartão: sabe sorrir, ceder, esperar. É vida: vida sobrenatural."}, {"n": 157, "chapter": "Luta", "text": "Não me abandones, Mãe! Faz que eu procure o teu Filho; faz que eu encontre o teu Filho; faz que eu ame o teu Filho... com todo o meu ser! - Lembra-te, Senhora, lembra-te."}, {"n": 158, "chapter": "Derrota", "text": "Quando temos a vista turvada, quando os olhos perdem claridade, precisamos ir à luz. E Jesus Cristo disse-nos que Ele é a luz do mundo e que veio curar os enfermos. - Por isso, que as tuas enfermidades, as tuas quedas - se o Senhor as permite -, não te afastem de Cristo: que te aproximem dEle!"}, {"n": 159, "chapter": "Derrota", "text": "Devido à minha miséria, queixava-me eu a um amigo de que parecia que Jesus estava de passagem... e me deixava sozinho. Reagi imediatamente com dor, cheio de confiança: - Não é assim, meu Amor; fui eu, sem dúvida, quem se afastou de Ti. Nunca mais!"}, {"n": 160, "chapter": "Derrota", "text": "Tens de suplicar ao Senhor a sua graça, para te purificares com Amor... e com a penitência constante."}, {"n": 161, "chapter": "Derrota", "text": "Dirige-te a Nossa Senhora e pede-lhe que te faça a dádiva - prova do seu carinho por ti - da contrição, da compunção pelos teus pecados, e pelos pecados de todos os homens e mulheres de todos os tempos, com dor de Amor. E, com essa disposição, atreve-te a acrescentar: - Mãe, Vida, Esperança minha, guiai-me com a vossa mão..., e se há agora em mim alguma coisa que desagrade a meu Pai-Deus, concedei-me que o perceba e que, os dois juntos, a arranquemos. Continua sem medo: - Ó clementíssima, ó piedosa, ó doce Virgem Santa Maria!, rogai por mim, para que, cumprindo a amabilíssima Vontade do vosso Filho, seja digno de alcançar e gozar das promessas de Nosso Senhor Jesus Cristo."}, {"n": 162, "chapter": "Derrota", "text": "Minha Mãe do Céu: faz que eu volte ao fervor, à entrega, à abnegação - numa palavra, ao Amor."}, {"n": 163, "chapter": "Derrota", "text": "Não sejas comodista! Não esperes pelo Ano Novo para tomar resoluções: todos os dias são bons para as decisões boas. “Hodie, nunc!” - Hoje, agora! Costumam ser uns pobres derrotistas aqueles que esperam pelo Ano Novo para começar, porque, além disso, depois... não começam!"}, {"n": 164, "chapter": "Derrota", "text": "De acordo, agiste mal por fraqueza. - Mas não entendo como não reages com clara consciência: não podes fazer coisas más e depois dizer - ou pensar - que são santas ou que não têm importância."}, {"n": 165, "chapter": "Derrota", "text": "Lembra-te sempre disto: as potências espirituais nutrem-se daquilo que os sentidos lhes proporcionam. - Guarda-os bem!"}, {"n": 166, "chapter": "Derrota", "text": "Perdes a paz - bem o sabes, aliás! - quando consentes em pontos que trazem consigo o descaminho. - Decide-te a ser coerente e responsável!"}, {"n": 167, "chapter": "Derrota", "text": "A recordação, inesquecível, dos favores recebidos de Deus deve ser sempre impulso vigoroso; e muito mais na hora da tribulação."}, {"n": 168, "chapter": "Derrota", "text": "Há uma única doença mortal, um único erro funesto: conformar-se com a derrota, não saber lutar com espírito de filhos de Deus. Se falta esse esforço pessoal, a alma fica paralisada e jaz sozinha, incapaz de dar frutos... - Com essa covardia, a criatura obriga o Senhor a pronunciar as palavras que Ele ouviu do paralítico, na piscina probática: “Hominem non habeo!” - não tenho homem! - Que vergonha se Jesus não encontrasse em ti o homem, a mulher, que espera!"}, {"n": 169, "chapter": "Derrota", "text": "A luta ascética não é algo de negativo nem, portanto, odioso, mas afirmação alegre. É um esporte. O bom esportista não luta para alcançar uma só vitória, e à primeira tentativa. Prepara-se, treina durante muito tempo, com confiança e serenidade: tenta uma vez e outra e, ainda que a princípio não triunfe, insiste tenazmente, até ultrapassar o obstáculo."}, {"n": 170, "chapter": "Derrota", "text": "Tudo espero de Ti, meu Jesus: converte-me!"}, {"n": 171, "chapter": "Derrota", "text": "Quando aquele sacerdote, nosso amigo, assinava “o pecador”, fazia-o convencido de escrever a verdade. - Meu Deus, purifica-me também a mim!"}, {"n": 172, "chapter": "Derrota", "text": "Se cometeste um erro, pequeno ou grande, volta correndo para Deus! - Saboreia as palavras do salmo: “Cor contritum et humiliatum, Deus, non despicies” - o Senhor jamais desprezará nem se desinteressará de um coração contrito e humilhado."}, {"n": 173, "chapter": "Derrota", "text": "Tens que dar voltas, na tua cabeça e na tua alma, a este pensamento: - Senhor, quantas vezes, caído, me levantaste e, perdoado, me abraçaste contra o teu Coração! Dá voltas a isso..., e não te separes dEle nunca jamais."}, {"n": 174, "chapter": "Derrota", "text": "Vês-te como um pobrezinho a quem o seu amo tirou a libré - somente pecador! -, e entendes a nudez experimentada pelos nossos primeiros pais. - Deverias estar sempre chorando. E muito choraste, muito sofreste. No entanto, és muito feliz. Não te trocarias por ninguém. Não perdes há muitos anos o teu “gaudium cum pace” - a tua alegria serena. Estás agradecido a Deus por ela, e quererias levar a todos o segredo da felicidade. - Sim. Compreende-se que tenham dito muitas vezes - embora nada te importe o “que vão dizer” - que és “homem de paz”."}, {"n": 175, "chapter": "Derrota", "text": "Alguns fazem apenas o que está ao alcance de umas pobres criaturas, e perdem o tempo. Repete-se ao pé da letra a experiência de Pedro: “Praeceptor, per totam noctem laborantes nihil cepimus!” - Mestre, trabalhamos toda a noite, e não pescamos nada. Se trabalham por conta própria, sem unidade com a Igreja, sem a Igreja, que eficácia terá esse apostolado? Nenhuma! - Têm de persuadir-se de que, por conta própria!, nada poderão. Tu tens de ajudá-los a continuar escutando o relato evangélico: “In verbo autem tuo laxabo rete” - fiado na tua palavra, lançarei a rede. Então a pesca será abundante e eficaz. - Como é bonito retificar quando, por qualquer razão, se fez um apostolado por conta própria!"}, {"n": 176, "chapter": "Derrota", "text": "Escreves e copio: ““Domine, tu scis quia amo te!” - Senhor, Tu sabes que eu te amo! Quantas vezes, Jesus, repito e volto a repetir, como uma ladainha agridoce, essas palavras do teu Cefas"}, {"n": 177, "chapter": "Derrota", "text": "Repete confiadamente: - Senhor, se as minhas lágrimas tivessem sido contrição!... - Pede-Lhe com humildade que te conceda a dor que desejas."}, {"n": 178, "chapter": "Derrota", "text": "Quanta vilania na minha conduta, e quanta infidelidade à graça! - Minha Mãe, Refúgio de pecadores, rogai por mim; que eu nunca mais dificulte a obra de Deus na minha alma."}, {"n": 179, "chapter": "Derrota", "text": "Tão perto de Cristo, tantos anos, e... tão pecador! - A intimidade de Jesus contigo não te arranca soluços?"}, {"n": 180, "chapter": "Derrota", "text": "Não me falta a verdadeira alegria, pelo contrário... E, contudo, perante o conhecimento da minha baixeza, é lógico que clame com São Paulo: “Infeliz de mim!”. - Assim crescem as ânsias de arrancar pela raiz a barreira que levanta o eu."}, {"n": 181, "chapter": "Derrota", "text": "Não te assustes nem desanimes ao descobrir que tens erros..., e que erros! - Luta por arrancá-los. E, desde que lutes, convence-te de que é bom que sintas todas essas fraquezas, porque, de outro modo, serias um soberbo: e a soberba afasta de Deus."}, {"n": 182, "chapter": "Derrota", "text": "Admira-te perante a bondade de Deus, porque Cristo quer viver em ti..., também quando percebes todo o peso da pobre miséria, desta pobre carne, desta vileza, deste pobre barro. - Sim, também então, tem presente essa chamada de Deus: Jesus Cristo, que é Deus, que é Homem, entende-me e atende-me porque é meu Irmão e meu Amigo."}, {"n": 183, "chapter": "Derrota", "text": "Vives contente, muito feliz, ainda que em algumas ocasiões notes a farpada da tristeza, e até apalpes quase habitualmente um sedimento real de pesadume. - Essa alegria e essa aflição podem coexistir, cada uma no seu “homem”: aquela, no novo; a outra, no velho."}, {"n": 184, "chapter": "Derrota", "text": "A humildade nasce como fruto de conhecermos a Deus e de nos conhecermos a nós mesmos."}, {"n": 185, "chapter": "Derrota", "text": "Senhor, peço-te um presente: Amor..., um Amor que me deixe limpo. - E outro presente ainda: conhecimento próprio, para me encher de humildade."}, {"n": 186, "chapter": "Derrota", "text": "São santos os que lutam até o fim da vida: os que sempre sabem levantar - se depois de cada tropeço, de cada queda, para prosseguir valentemente o caminho com humildade, com amor, com esperança."}, {"n": 187, "chapter": "Derrota", "text": "Se os teus erros te fazem mais humilde, se te levam a procurar com mais força o esteio da mão divina, são caminho de santidade: “Felix culpa!”"}, {"n": 188, "chapter": "Derrota", "text": "A oração - mesmo a minha! - é onipotente."}, {"n": 189, "chapter": "Derrota", "text": "A humildade leva cada alma a não desanimar perante os seus erros. - A verdadeira humildade leva... a pedir perdão!"}, {"n": 190, "chapter": "Derrota", "text": "Se eu fosse leproso, minha mãe me abraçaria. Sem medo nem repugnância alguma, beijar-me-ia as chagas. - Pois bem, e a Virgem Santíssima? Ao sentir que temos lepra, que estamos chagados, temos de gritar: Mãe! E a proteção da nossa Mãe é como um beijo nas feridas, que nos obtém a cura."}, {"n": 191, "chapter": "Derrota", "text": "No sacramento da Penitência, Jesus perdoa-nos. - São-nos aplicados aí os méritos de Cristo, que por amor de nós está na Cruz, com os braços estendidos, e costurado ao madeiro - mais do que com os ferros - com o Amor que nos tem."}, {"n": 192, "chapter": "Derrota", "text": "Se alguma vez cais, filho, acode prontamente à Confissão e à direção espiritual: mostra a ferida!, para que te curem a fundo, para que te tirem todas as possibilidades de infecção, mesmo que te doa como numa operação cirúrgica."}, {"n": 193, "chapter": "Derrota", "text": "A sinceridade é indispensável para progredir na união com Deus. - Se dentro de ti, meu filho, há um “sapo”, solta-o! Diz primeiro, como te aconselho sempre, o que não quererias que se soubesse. Depois que se soltou o “sapo” na Confissão, que bem se está!"}, {"n": 194, "chapter": "Derrota", "text": "“Nam, et si ambulavero in medio umbrae mortis, non timebo mala” - mesmo que ande por entre as sombras da morte, não terei temor algum. Nem as minhas misérias nem as tentações do inimigo hão de preocupar - me, “quoniam tu mecum es” - porque o Senhor está comigo."}, {"n": 195, "chapter": "Derrota", "text": "Ao considerar agora mesmo as minhas misérias, Jesus, eu te disse: - Deixa-te enganar pelo teu filho, como esses pais bons, hiper-pais, que põem nas mãos do seu menino o presente que deles querem receber..., porque muito bem sabem que as crianças nada têm. - E que alvoroço o do pai e o do filho, mesmo que os dois estejam por dentro do segredo!"}, {"n": 196, "chapter": "Derrota", "text": "Jesus, Amor, pensar que posso voltar a ofender-te!... “Tuus sum ego..., salvum me fac!” - sou teu: salva-me!"}, {"n": 197, "chapter": "Derrota", "text": "Tu, que te vês tão falto de virtudes, de talento, de condições..., não tens ânsias de clamar como Bartimeu, o cego: - Jesus, filho de Davi, tem compaixão de mim!? - Ele te ouvirá e te atenderá."}, {"n": 198, "chapter": "Derrota", "text": "Alimenta na tua alma a ânsia de reparação, para conseguires cada dia uma contrição maior."}, {"n": 199, "chapter": "Derrota", "text": "Se fores fiel, poderás chamar-te vencedor. - Na tua vida, mesmo que percas alguns combates, não conhecerás derrotas. Não existem fracassos - convence-te -, se atuas com intenção reta e com ânsias de cumprir a Vontade de Deus. - Então, com êxito ou sem êxito, triunfarás sempre, porque terás feito o trabalho com Amor."}, {"n": 200, "chapter": "Derrota", "text": "Tenho a certeza de que Ele acolheu a tua súplica humilde e inflamada: - Õ meu Deus!, não me importa o “que vão dizer”: perdão pela minha vida infame; que eu seja santo!... Mas só para Ti."}, {"n": 201, "chapter": "Derrota", "text": "Na vida do cristão, “tudo” tem que ser para Deus: também as fraquezas pessoais - retificadas! -, que o Senhor compreende e perdoa."}, {"n": 202, "chapter": "Derrota", "text": "Que foi que te fiz, Jesus, para que me queiras assim? Ofender-te... e amar-te. - Amar-te: a isto é que se vai reduzir a minha vida."}, {"n": 203, "chapter": "Derrota", "text": "Todos esses consolos do Amo, não serão para que eu esteja pendente dEle, servindo-O nas coisas pequenas, e possa assim servi-Lo nas grandes? - Propósito: dar gosto ao bom Jesus nos detalhes minúsculos da vida cotidiana."}, {"n": 204, "chapter": "Derrota", "text": "É preciso amar a Deus, porque o coração foi feito para amar. Por isso, se não o pomos em Deus, na Virgem, nossa Mãe, nas almas..., com um afeto limpo, o coração vinga-se..., e converte-se em um ninho de vermes."}, {"n": 205, "chapter": "Derrota", "text": "Diz ao Senhor, com todas as veras da tua alma: - Apesar de todas as minhas misérias, estou louco de Amor!, estou bêbado de Amor!"}, {"n": 206, "chapter": "Derrota", "text": "Doído de tanta queda, daqui em diante - com a ajuda de Deus - estarei sempre na Cruz."}, {"n": 207, "chapter": "Derrota", "text": "O que a carne perdeu, que o pague a carne: faz penitência generosa."}, {"n": 208, "chapter": "Derrota", "text": "Invoca o Senhor, suplicando-Lhe o espírito de penitência próprio daquele que todos os dias sabe vencer-se, oferecendo-Lhe caladamente e com abnegação esse vencimento constante."}, {"n": 209, "chapter": "Derrota", "text": "Repete na tua oração pessoal, quando sentires a fraqueza da carne: - Senhor, Cruz para este meu pobre corpo, que se cansa e se revolta!"}, {"n": 210, "chapter": "Derrota", "text": "Que boa razão a daquele sacerdote, quando pregava assim: “Jesus perdoou-me toda a multidão dos meus pecados - quanta generosidade! -, apesar da minha ingratidão. E se a Maria Madalena foram perdoados muitos pecados, porque muito amou, a mim, a quem me perdoou muito mais, que grande dívida de amor me fica!”. Jesus, até à loucura e ao heroísmo! Com a tua graça, Senhor, ainda que seja preciso morrer por Ti, já não te abandonarei."}, {"n": 211, "chapter": "Derrota", "text": "Lázaro ressuscitou porque ouviu a voz de Deus; e imediatamente quis sair daquele estado. Se não tivesse “querido” mexer-se, teria morrido de novo. Propósito sincero: ter sempre fé em Deus; ter sempre esperança em Deus; amar sempre a Deus..., que nunca nos abandona, ainda que estejamos podres como Lázaro."}, {"n": 212, "chapter": "Derrota", "text": "Admira este paradoxo amável da condição de cristão: a nossa própria miséria é a que nos leva a refugiar-nos em Deus, a “endeusar-nos”, e com Ele podemos tudo."}, {"n": 213, "chapter": "Derrota", "text": "Quando tiveres caído, ou te encontrares oprimido pelo fardo das tuas misérias, repete com segura esperança: - Senhor, olha que estou doente; Senhor, Tu, que por amor morreste na Cruz por mim, vem curar-me. Confia, insisto: persevera chamando pelo seu Coração amantíssimo. Como aos leprosos do Evangelho, Ele te dará a saúde."}, {"n": 214, "chapter": "Derrota", "text": "Deves encher-te de confiança e ter um grande desejo, cada dia mais profundo, de nunca fugir dEle."}, {"n": 215, "chapter": "Derrota", "text": "Virgem Imaculada, Mãe!, não me abandones: olha como se enche de lágrimas o meu pobre coração. - Não quero ofender o meu Deus! Já sei - e penso que não o esquecerei nunca - que não valho nada: quanto me pesa a minha pouquidão, a minha solidão! Mas... não estou só: tu, Doce Senhora, e meu Pai-Deus não me largais. Ante a rebelião da minha carne e ante as razões diabólicas contra a minha Fé, amo Jesus e creio: Amo e Creio."}, {"n": 216, "chapter": "Pessimismo", "text": "Com a graça de Deus, tens de acometer e realizar o impossível..., porque o possível o faz qualquer um."}, {"n": 217, "chapter": "Pessimismo", "text": "Rejeita o teu pessimismo e não consintas pessimistas a teu lado. - É preciso servir a Deus com alegria e descontração."}, {"n": 218, "chapter": "Pessimismo", "text": "Afasta de ti essa prudência humana que te faz tão precavido - perdoa-me! -, tão covarde. - Não sejamos pessoas de bitola estreita, homens ou mulheres menores de idade, de vistas curtas, sem horizonte sobrenatural...! Por acaso trabalhamos para nós? Não! Pois então, digamos sem medo: - Jesus da minha alma, nós trabalhamos para Ti, e Tu... vais negar-nos os meios materiais? Bem sabes como somos ruins; não obstante, eu não me comportaria assim com um criado que me servisse... Por isso esperamos, estamos certos de que nos darás o necessário para servir-Te."}, {"n": 219, "chapter": "Pessimismo", "text": "Ato de fé: contra Ele, nada se pode! Nem contra os seus! - Não o esqueças."}, {"n": 220, "chapter": "Pessimismo", "text": "Não desanimes. Para a frente!, para a frente com uma teimosia que é santa e que se chama, no terreno espiritual, perseverança."}, {"n": 221, "chapter": "Pessimismo", "text": "Meu Deus: sempre acodes às necessidades verdadeiras."}, {"n": 222, "chapter": "Pessimismo", "text": "Não pioraste. - É que agora tens mais luzes para te conheceres: evita até o menor assomo de desânimo!"}, {"n": 223, "chapter": "Pessimismo", "text": "No caminho da santificação pessoal, podemos às vezes ter a impressão de que, em vez de avançar, retrocedemos; de que, em vez de melhorar, pioramos. Enquanto houver luta interior, esse pensamento pessimista será apenas uma falsa impressão, um engano, que convém repelir. - Persevera tranquilo: se lutas com tenacidade, progrides no teu caminho e te santificas."}, {"n": 224, "chapter": "Pessimismo", "text": "Aridez interior não é tibieza. No homem tíbio, a água da graça não impregna, resvala... Pelo contrário, há terras de sertão aparentemente áridas que, com poucas gotas de chuva, se cumulam no seu devido tempo de flores e de saborosos frutos. Por isso - quando nos convenceremos? -, como é importante a docilidade às chamadas divinas de cada instante! Porque Deus nos espera precisamente aí!"}, {"n": 225, "chapter": "Pessimismo", "text": "Deves ter esperteza santa: não esperes que o Senhor te envie contrariedades; adianta-te tu, mediante a expiação voluntária. - E então não as acolherás com resignação - que é palavra velha -, mas com Amor: palavra eternamente jovem."}, {"n": 226, "chapter": "Pessimismo", "text": "Hoje, pela primeira vez, tiveste a sensação de que tudo se tornava mais simples, de que tudo se “descomplicava” para ti: viste finalmente eliminados problemas que te preocupavam. E compreendeste que estariam mais e melhor resolvidos quanto mais te abandonasses nos braços de teu Pai-Deus. Que estás esperando para te comportares sempre - este há de ser o motivo do teu viver! - como um filho de Deus?"}, {"n": 227, "chapter": "Pessimismo", "text": "Dirige-te à Virgem Maria - Mãe, Filha, Esposa de Deus, Mãe nossa -, e pede-lhe que te obtenha da Trindade Santíssima mais graças: a graça da fé, da esperança, do amor, da contrição, para que, quando na vida parecer que sopra um vento forte, seco, capaz de estiolar essas flores da alma, não estiole as tuas..., nem as dos teus irmãos."}, {"n": 228, "chapter": "Pessimismo", "text": "Enche-te de fé, de segurança! - Assim o diz o Senhor por boca de Jeremias: “Orabitis me, et ego exaudiam vos” - sempre que recorrerdes a Mim - sempre que fizerdes oração! -, Eu vos escutarei."}, {"n": 229, "chapter": "Pessimismo", "text": "Tudo refiro a Ti, meu Deus. Sem Ti - que és meu Pai -, que seria de mim?"}, {"n": 230, "chapter": "Pessimismo", "text": "Deixa que te dê um conselho de alma experimentada: a tua oração - a tua vida há de ser orar sempre - deve ter a confiança da “oração de uma criança”."}, {"n": 231, "chapter": "Pessimismo", "text": "Apresentam a Jesus um enfermo, e Ele olha-o. - Deves contemplar bem a cena e meditar as suas palavras: “Confide, fili” - tem confiança, filho. Isso é o que te diz o Senhor, quando sentes o peso dos erros: fé! A fé, em primeiro lugar; depois, deixar-se guiar como o paralítico: obediência interior e submissa!"}, {"n": 232, "chapter": "Pessimismo", "text": "Filho, pelas tuas próprias forças, não podes nada no terreno sobrenatural. Mas, sendo instrumento de Deus, poderás tudo: “Omnia possum in eo qui me confortat!” - posso tudo nAquele que me conforta!, pois Ele quer, pela sua bondade, utilizar instrumentos ineptos, como tu e como eu."}, {"n": 233, "chapter": "Pessimismo", "text": "Sempre que fizeres oração, esforça-te por ter a fé dos enfermos do Evangelho. Deves ter a certeza de que Jesus te escuta."}, {"n": 234, "chapter": "Pessimismo", "text": "Minha Mãe! As mães da terra olham com maior predileção para o filho mais fraco, para o mais doente, para o mais curto de cabeça, para o pobre aleijado... - Senhora! Eu sei que tu és mais Mãe que todas as mães juntas... - E como eu sou teu filho... E como sou fraco, e doente... e aleijado... e feio..."}, {"n": 235, "chapter": "Pessimismo", "text": "Falta-nos fé. No dia em que vivermos esta virtude - confiando em Deus e na sua Mãe -, seremos valentes e leais. Deus, que é o Deus de sempre, fará milagres por nossas mãos. - Dá-me, ó Jesus, essa fé, que de verdade desejo! Minha Mãe e Senhora minha, Maria Santíssima, faz que eu creia!"}, {"n": 236, "chapter": "Pessimismo", "text": "Uma firme resolução: abandonar-me em Jesus Cristo, com todas as minhas misérias. E o que Ele quiser, em cada instante, “fiat!” - seja!"}, {"n": 237, "chapter": "Pessimismo", "text": "Nunca desanimes, porque o Senhor está sempre disposto a dar-te a graça necessária para essa nova conversão de que precisas, para essa ascensão no terreno sobrenatural."}, {"n": 238, "chapter": "Pessimismo", "text": "Deus seja louvado!, dizias de ti para ti depois de terminares a tua Confissão sacramental. E pensavas: é como se tivesse voltado a nascer. Depois, prosseguiste com serenidade: “Domine, quid me vis facere?” - Senhor, que queres que eu faça? - E tu mesmo te deste a resposta: - Com a tua graça, por cima de tudo e de todos, cumprirei a tua Santíssima Vontade: Serviam! - eu te servirei sem condições!"}, {"n": 239, "chapter": "Pessimismo", "text": "Narra o Evangelista que os Magos, “videntes stellam” - ao verem de novo a estrela -, ficaram cheios de uma grande alegria. - Alegram-se, filho, com esse júbilo imenso, porque fizeram o que deviam; e alegram-se porque têm a certeza de que chegarão até o Rei, que nunca abandona aqueles que O procuram."}, {"n": 240, "chapter": "Pessimismo", "text": "Quando amares de verdade a Vontade de Deus, não deixarás de ver, mesmo nos momentos de maior trepidação, que o nosso Pai do Céu está sempre perto, muito perto, a teu lado, com o seu Amor eterno, com o seu carinho infinito."}, {"n": 241, "chapter": "Pessimismo", "text": "Se porventura o panorama da tua vida interior, da tua alma, está obscurecido, deixa-te conduzir pela mão, como faz um cego. - O Senhor, com o passar do tempo, premia esta humilhação de rendermos a cabeça, dando-nos claridade."}, {"n": 242, "chapter": "Pessimismo", "text": "Ter medo de alguma coisa ou de alguém, mas especialmente de quem dirige a nossa alma, é impróprio de um filho de Deus."}, {"n": 243, "chapter": "Pessimismo", "text": "Não te comove ouvir uma palavra de carinho dirigida à tua mãe? - Pois bem, com o Senhor acontece o mesmo. Não podemos separar Jesus de sua Mãe."}, {"n": 244, "chapter": "Pessimismo", "text": "Em momentos de esgotamento, de fastio, recorre confiadamente ao Senhor, dizendo-Lhe, como aquele amigo nosso: “Jesus, vê lá o que fazes...; antes de começar a luta, já estou cansado”. - Ele te dará a sua força."}, {"n": 245, "chapter": "Pessimismo", "text": "Se não existem dificuldades, as tarefas não têm graça humana... nem sobrenatural. - Se, ao pregares um prego na parede, não encontras resistência, o que é que poderás pendurar ali?"}, {"n": 246, "chapter": "Pessimismo", "text": "Parece mentira que um homem como tu - que, segundo dizes, te sabes nada - se atreva a levantar obstáculos à graça de Deus. Isso é o que fazes com a tua falsa humildade, com a tua “objetividade”, com o teu pessimismo."}, {"n": 247, "chapter": "Pessimismo", "text": "Senhor, dá-me graça para largar tudo o que se refira à minha pessoa. Eu não devo ter outras preocupações exceto a tua Glória..., numa palavra, o teu Amor. - Tudo por Amor!"}, {"n": 248, "chapter": "Pessimismo", "text": "“Ouvindo isso - que o Rei tinha vindo à terra -, Herodes perturbou-se, e com ele toda Jerusalém”. É a vida cotidiana! A mesma coisa acontece agora: ante a grandeza de Deus, que se manifesta de mil modos, não faltam pessoas - até mesmo constituídas em autoridade - que se perturbam. Porque... não amam totalmente a Deus; porque não são pessoas que de verdade desejem encontrá-Lo; porque não querem seguir as suas inspirações, e se convertem em obstáculo no caminho divino. - Fica de sobreaviso, continua trabalhando, não te preocupes, procura o Senhor, reza..., e Ele triunfará."}, {"n": 249, "chapter": "Pessimismo", "text": "Não estás só. - Nem tu nem eu podemos encontrar-nos sós. E menos ainda se vamos a Jesus por Maria, pois é uma Mãe que nunca nos abandonará."}, {"n": 250, "chapter": "Pessimismo", "text": "Quando te parecer que o Senhor te abandona, não te entristeças; procura-O com mais empenho! Ele, o Amor, não te deixa só. - Convence-te de que é por Amor que te “deixa só”, para que vejas com clareza na tua vida o que é dEle e o que é teu."}, {"n": 251, "chapter": "Pessimismo", "text": "Dizias-me: “Vejo-me, não somente incapaz de andar para a frente no caminho, mas incapaz de salvar-me - pobre da minha alma! - sem um milagre da graça. Estou frio e - o que é pior - como que indiferente: exatamente como se fosse um espectador do “meu caso”, que não se importasse nada com o que contempla. Serão estéreis estes dias? “E, no entanto, a minha Mãe é minha Mãe, e Jesus é - atrevo-me? - o meu Jesus! E há almas santas, agora mesmo, pedindo por mim”. - Continua a andar pela mão da tua Mãe - repliquei-te -, e “atreve-te” a dizer a Jesus que é teu. Pela sua bondade, Ele porá luzes claras na tua alma."}, {"n": 252, "chapter": "Pessimismo", "text": "Dá-me, Jesus, uma Cruz sem cireneus. Digo mal: a tua graça, a tua ajuda far-me-á falta, como para tudo o mais; sê Tu o meu Cireneu. Contigo, meu Deus, não há prova que me assuste... - Mas, e se a Cruz fosse o tédio, a tristeza? - Eu te digo, Senhor, que, Contigo, estaria alegremente triste."}, {"n": 253, "chapter": "Pessimismo", "text": "Se eu não Te perco, Senhor, para mim não haverá pena que seja pena."}, {"n": 254, "chapter": "Pessimismo", "text": "Jesus não nega a ninguém a sua palavra, e é uma palavra que sara, que consola, que ilumina. - Para que tu e eu nos lembremos disso sempre, também quando nos encontremos fatigados pelo peso do trabalho ou da contradição."}, {"n": 255, "chapter": "Pessimismo", "text": "Não esperes o aplauso dos outros pelo teu trabalho. - Mais ainda! Não esperes sequer, às vezes, que te compreendam outras pessoas e instituições que também trabalham por Cristo. - Procura somente a glória de Deus e, amando a todos, não te preocupes se alguns não te entendem."}, {"n": 256, "chapter": "Pessimismo", "text": "Se há montanhas, obstáculos, incompreensões, enredos, que satanás quer e o Senhor permite, precisas ter fé, fé com obras, fé com sacrifício, fé com humildade."}, {"n": 257, "chapter": "Pessimismo", "text": "Ante a aparente esterilidade do apostolado, assaltam-te as vanguardas de uma onda de desalento, que a tua fé repele com firmeza... - Mas percebes que necessitas de mais fé, humilde, viva e operativa. Tu, que desejas a saúde das almas, grita como o pai daquele rapaz enfermo, possuído pelo diabo: “Domine, adiuva incredulitatem meam!” - Senhor, ajuda a minha incredulidade! Não duvides: repetir-se-á o milagre."}, {"n": 258, "chapter": "Pessimismo", "text": "Que bonita oração - para que a repitas com freqflência - a daquele amigo que rezava assim por um sacerdote encarcerado por ódio à religião: “Meu Deus, consola-o, porque sofre perseguição por Ti. Quantos não sofrem, porque te servem!”. - Que alegria dá a Comunhão dos Santos!"}, {"n": 259, "chapter": "Pessimismo", "text": "Essas medidas, que alguns governos tomam para garantir a morte da fé em seus países, recordam os selos do Sinédrio no Sepulcro de Jesus. - Ele, que não estava sujeito a nada nem a ninguém, apesar desses entraves, ressuscitou!"}, {"n": 260, "chapter": "Pessimismo", "text": "A solução é amar. O Apóstolo São João escreve umas palavras que me tocam muito: “Qui autem timet, non est perfectus in caritate”. Eu o traduzo assim, quase ao pé da letra: quem tem medo não sabe amar. - Portanto tu, que tens amor e sabes amar, não podes ter medo de nada! - Para a frente!"}, {"n": 261, "chapter": "Pessimismo", "text": "Deus está contigo. Na tua alma em graça habita a Santíssima Trindade. - Por isso, tu, apesar das tuas misérias, podes e deves estar em contínuo diálogo com o Senhor."}, {"n": 262, "chapter": "Pessimismo", "text": "Tens de orar sempre, sempre. - Tens de sentir a necessidade de recorrer a Deus, depois de cada êxito e de cada fracasso na vida interior."}, {"n": 263, "chapter": "Pessimismo", "text": "Que a tua oração seja sempre um sincero e real ato de adoração a Deus."}, {"n": 264, "chapter": "Pessimismo", "text": "Ao trazer-te à Igreja, o Senhor pôs na tua alma um selo indelével, por meio do Batismo: és filho de Deus. - Não o esqueças."}, {"n": 265, "chapter": "Pessimismo", "text": "Dá muitas graças a Jesus, porque por Ele, com Ele e nEle, tu podes chamar-te filho de Deus."}, {"n": 266, "chapter": "Pessimismo", "text": "Se nos sentimos filhos prediletos do nosso Pai dos Céus - que é o que somos! -, como não havemos de estar alegres sempre? - Pensa bem nisto."}, {"n": 267, "chapter": "Pessimismo", "text": "Quando dava a Sagrada Comunhão, aquele sacerdote sentia ímpetos de gritar: aí te entrego a Felicidade!"}, {"n": 268, "chapter": "Pessimismo", "text": "Agiganta a tua fé na Sagrada Eucaristia. - Pasma-te diante dessa realidade inefável! Temos Deus conosco, podemos recebê-Lo diariamente e, se quisermos, falamos intimamente com Ele, como se fala com o amigo, como se fala com o irmão, como se fala com o pai, como se fala com o Amor."}, {"n": 269, "chapter": "Pessimismo", "text": "Como é formosa a nossa vocação de cristãos - de filhos de Deus! -, que nos traz na terra a alegria e a paz que o mundo não pode dar!"}, {"n": 270, "chapter": "Pessimismo", "text": "Dá-me, Senhor, o amor com que queres que eu te ame."}, {"n": 271, "chapter": "Pessimismo", "text": "Naquela manhã - para venceres a sombra de pessimismo que te assaltava -, voltaste a insistir com o teu Anjo da Guarda, como fazes diariamente..., mas te “meteste” mais com ele. Dirigiste-lhe elogios e disseste-lhe que te ensinasse a amar Jesus, pelo menos, pelo menos, como ele O ama... E ficaste tranqflilo."}, {"n": 272, "chapter": "Pessimismo", "text": "Pede à tua Mãe, Maria, a São José, ao teu Anjo da Guarda..., pede-lhes que falem com o Senhor, dizendo-Lhe aquilo que, pela tua rudeza, não sabes expressar."}, {"n": 273, "chapter": "Pessimismo", "text": "Enche-te de segurança: nós temos por Mãe a Mãe de Deus, a Santíssima Virgem Maria, Rainha do Céu e do Mundo."}, {"n": 274, "chapter": "Pessimismo", "text": "Jesus nasceu numa gruta de Belém, diz a Escritura, “porque não havia lugar para eles na estalagem”. - Não me afasto da verdade teológica, se te digo que Jesus continua ainda procurando pousada em teu coração."}, {"n": 275, "chapter": "Pessimismo", "text": "O Senhor está na Cruz, dizendo: - Eu padeço para que os meus irmãos os homens sejam felizes, não só no Céu, mas também - na medida do possível - na terra, se acatarem a Santíssima Vontade de meu Pai celestial."}, {"n": 276, "chapter": "Pessimismo", "text": "É verdade que tu não contribuis com nada, que na tua alma é Deus quem faz tudo. - Mas que não seja assim, do ponto de vista da tua correspondência."}, {"n": 277, "chapter": "Pessimismo", "text": "Exercita-te na virtude da esperança, perseverando - por Deus, e ainda que te custe - no teu trabalho bem acabado, persuadido de que o teu esforço não é inútil diante do Senhor."}, {"n": 278, "chapter": "Pessimismo", "text": "Quando na tua luta diária, composta geralmente de muitos poucos, há desejos e realidades de agradar a Deus a todo o instante, asseguro-te: nada se perde!"}, {"n": 279, "chapter": "Pessimismo", "text": "Pensa, porque de fato é assim: que bom é o Senhor, que me procurou, que me fez conhecer este caminho santo para ser eficaz, para amar as criaturas todas e dar-lhes a paz e a alegria! - Este pensamento deve concretizar-se depois em propósitos."}, {"n": 280, "chapter": "Pessimismo", "text": "Sabes que não te faltará a graça de Deus, porque Ele te escolheu desde a eternidade. E se te tratou assim, conceder-te-á todos os auxílios, para que Lhe sejas fiel, como filho seu. - Caminha, pois, com segurança e com uma correspondência atual."}, {"n": 281, "chapter": "Pessimismo", "text": "Peço à Mãe de Deus que nos saiba, que nos queira sorrir..., e Ela nos sorrirá. E, além disso, premiará na terra a nossa generosidade com mil por um: mil por um, é o que lhe peço!"}, {"n": 282, "chapter": "Pessimismo", "text": "Tens de praticar uma caridade alegre, doce e rija, humana e sobrenatural; caridade afetuosa, que saiba acolher a todos com um sincero sorriso habitual; que saiba compreender as idéias e os sentimentos dos outros. - Assim, suavemente e fortemente, sem cederes na conduta pessoal nem na doutrina, a caridade de Cristo - bem vivida - dar-te-á o espírito de conquista: terás cada dia mais fome de trabalho pelas almas."}, {"n": 283, "chapter": "Pessimismo", "text": "Filho, dizia-te com segurança: para pegarmos a nossa “loucura” a outros apóstolos, não se me ocultam os “obstáculos” que encontraremos. Alguns poderão parecer insuperáveis..., mas “inter medium montium pertransibunt aquae” - as águas passarão através das montanhas: o espírito sobrenatural e o ímpeto do nosso zelo furarão os montes, e superaremos esses obstáculos."}, {"n": 284, "chapter": "Pessimismo", "text": "“Meu Deus, meu Deus! Todos me são igualmente queridos, por Ti, em Ti e Contigo; e agora, todos estão dispersos”, queixavas-te, ao te veres de novo sozinho e sem meios humanos. - Mas imediatamente o Senhor pôs na tua alma a certeza de que Ele resolveria a situação. E disseste-Lhe: - Tu a arrumarás! - Efetivamente, o Senhor arrumou tudo antes, mais e melhor do que tu esperavas."}, {"n": 285, "chapter": "Pessimismo", "text": "É justo que o Pai e o Filho e o Espírito Santo coroem a Virgem Santíssima como Rainha e Senhora de toda a criação. - Aproveita-te desse poder e, com atrevimento filial, une-te a essa festa do Céu. - Eu corôo a Mãe de Deus e minha Mãe com as minhas misérias purificadas, porque não tenho pedras preciosas nem virtudes. - Anima-te!"}, {"n": 286, "chapter": "Podes!", "text": "Quero prevenir-te a respeito de uma dificuldade que talvez possa apresentar-se: a tentação do cansaço, do desalento. - Não está ainda fresca na tua memória uma vida - a tua - sem rumo, sem meta, sem sal, que a luz de Deus e a tua entrega endireitaram e encheram de alegria? - Não troques bobamente isto por aquilo."}, {"n": 287, "chapter": "Podes!", "text": "Se notas que não és capaz - seja por que motivo for -, diz-Lhe, abandonando-te nEle: - Senhor, confio em Ti, abandono-me em Ti, mas ajuda a minha fraqueza! E, cheio de confiança, repete-Lhe: - Olha para mim, Jesus, sou um trapo sujo; a experiência da minha vida é tão triste, não mereço ser teu filho. Diz-Lhe isso..., e dize-o muitas vezes. - Não tardarás em ouvir a sua voz: “Ne timeas!” - não temas! Ou também: “Surge et ambula!” - levanta-te e anda!"}, {"n": 288, "chapter": "Podes!", "text": "Comentavas-me, ainda indeciso: - Como se notam esses tempos em que o Senhor me pede mais! Só me ocorreu recordar-te: - Garantias-me que a única coisa que querias era identificar-te com Ele; então, por que resistes?"}, {"n": 289, "chapter": "Podes!", "text": "Oxalá saibas cumprir esse propósito que fizeste: “Morrer um pouco para mim mesmo, em cada dia”."}, {"n": 290, "chapter": "Podes!", "text": "A alegria, o otimismo sobrenatural e humano, são compatíveis com o cansaço físico, com a dor, com as lágrimas - porque temos coração -, com as dificuldades na nossa vida interior ou na tarefa apostólica. Ele, “perfectus Deus, perfectus Homo” - perfeito Deus e perfeito Homem -, que tinha toda a felicidade do Céu, quis experimentar a fadiga e o cansaço, o pranto e a dor..., para que entendêssemos que ser sobrenatural pressupõe ser muito humano."}, {"n": 291, "chapter": "Podes!", "text": "Jesus te pede oração... Vês isso claramente. - No entanto, quanta falta de correspondência! Tudo te custa muito: és como a criança que tem preguiça de aprender a andar. Mas, no teu caso, não é só preguiça. É também medo, falta de generosidade."}, {"n": 292, "chapter": "Podes!", "text": "Repete com freqflência: - Jesus, se alguma vez se insinuar na minha alma a dúvida entre fazer o que Tu me pedes e seguir outras ambições nobres, digo-te desde já que prefiro o teu caminho, custe o que custar. Não me largues!"}, {"n": 293, "chapter": "Podes!", "text": "Procura a união com Deus e enche-te de esperança - virtude segura! -, porque Jesus te iluminará com as luzes da sua misericórdia, mesmo na noite mais escura."}, {"n": 294, "chapter": "Podes!", "text": "Assim discorria a tua oração: “Pesam-me as minhas misérias, mas não me esmagam porque sou filho de Deus. Expiar. Amar... E - acrescentavas - desejo servir-me da minha fraqueza, como São Paulo, persuadido de que o Senhor não abandona os que nEle confiam”. - Continua assim, confirmei-te, porque - com a graça de Deus - conseguirás, e vencerás as tuas misérias e as tuas pequenezes."}, {"n": 295, "chapter": "Podes!", "text": "Qualquer momento é propício para fazer um propósito eficaz, para dizer “creio”, para dizer “espero”, para dizer “amo”."}, {"n": 296, "chapter": "Podes!", "text": "Aprende a louvar o Pai e o Filho e o Espírito Santo. Aprende a ter uma especial devoção pela Santíssima Trindade: creio em Deus Pai, creio em Deus Filho, creio em Deus Espírito Santo; espero em Deus Pai, espero em Deus Filho, espero em Deus Espírito Santo; amo a Deus Pai, amo a Deus Filho, amo a Deus Espírito Santo. Creio, espero e amo a Trindade Santíssima. - Faz-nos falta esta devoção como um exercício sobrenatural da alma, que se traduz em atos do coração, ainda que nem sempre se verta em palavras."}, {"n": 297, "chapter": "Podes!", "text": "O sistema, o método, o procedimento, a única maneira de termos vida - abundante e fecunda em frutos sobrenaturais - é seguir o conselho do Espírito Santo, que nos chega através dos Atos dos Apóstolos: “Omnes erant perseverantes unanimiter in oratione” - todos perseveravam unanimemente na oração. - Sem oração, nada!"}, {"n": 298, "chapter": "Podes!", "text": "O meu Senhor Jesus tem um Coração mais sensível que todos os corações de todos os homens bons juntos. Se um homem bom (medianamente bom) sabe que determinada pessoa o ama, sem esperar satisfação ou prêmio algum (ama por amar); e sabe também que essa pessoa só deseja que ele não se oponha a ser amado, nem que seja só de longe..., não tardará em corresponder a um amor tão desinteressado. - Se o Amado é tão poderoso que pode tudo, estou certo de que, além de acabar por render-se ao amor fiel da criatura (apesar das misérias dessa pobre alma), dar-lhe-á a formosura, a ciência e o poder sobrehumanos que forem necessários para que os olhos de Jesus não se manchem, ao pousarem no pobre coração que O adora. - Menino, ama: ama e espera."}, {"n": 299, "chapter": "Podes!", "text": "Se com sacrifício semeias Amor, também colherás Amor."}, {"n": 300, "chapter": "Podes!", "text": "Menino: não te inflamas em desejos de fazer que todos O amem?"}, {"n": 301, "chapter": "Podes!", "text": "Jesus-menino, Jesus-adolescente: gosto de ver-te assim, Senhor, porque... me torno mais atrevido. Gosto de ver-te pequenino, como que desamparado, para embalar-me na ilusão de que precisas de mim."}, {"n": 302, "chapter": "Podes!", "text": "Sempre que entro no oratório, digo ao Senhor - pois voltei a ser criança - que O amo mais do que ninguém."}, {"n": 303, "chapter": "Podes!", "text": "Como é maravilhosa a eficácia da Sagrada Eucaristia, na ação - e, antes, no espírito - das pessoas que a recebem com freqflência e piedosamente."}, {"n": 304, "chapter": "Podes!", "text": "Senhor, se aqueles homens, por um pedaço de pão - embora o milagre da multiplicação tenha sido muito grande -, se entusiasmam e te aclamam, que não deveremos nós fazer pelos muitos dons que nos concedeste, e especialmente porque te entregas a nós sem reservas na Eucaristia?"}, {"n": 305, "chapter": "Podes!", "text": "Menino bom: os apaixonados desta terra, como beijam as flores, a carta, uma lembrança da pessoa que amam!... - E tu? Poderás esquecer-te alguma vez de que O tens a teu lado..., a Ele!? - Esquecerás... que O podes comer?"}, {"n": 306, "chapter": "Podes!", "text": "Tens de assomar muitas vezes a cabeça ao oratório, para dizer a Jesus: - Abandono-me nos teus braços. - Deixa a seus pés o que tens: as tuas misérias! - Deste modo, apesar da turbamulta de coisas que arrastas atrás de ti, nunca perderás a paz."}, {"n": 307, "chapter": "Podes!", "text": "Reza com toda a segurança com o Salmista: “Senhor, Tu és o meu refúgio e a minha fortaleza, confio em Ti!”. Eu te garanto que Ele te preservará das insídias do “demônio meridiano”"}, {"n": 308, "chapter": "Podes!", "text": "Achas que na vida se agradece um serviço prestado de má vontade? É evidente que não. E até se chega a concluir: seria melhor que não o tivesse feito. - E pensas que podes servir a Deus de cara fechada? Não! - Tens de servi-Lo com alegria, apesar das tuas misérias, que as iremos tirando com a ajuda divina."}, {"n": 309, "chapter": "Podes!", "text": "Assaltam-te dúvidas e tentações com pinta elegante. - Gosto de ouvir-te: vê-se que o demônio te considera seu inimigo, e que a graça de Deus não te desampara. Continua a lutar!"}, {"n": 310, "chapter": "Podes!", "text": "A maior parte dos que têm problemas pessoais, “têm-nos” pelo egoísmo de pensar em si próprios."}, {"n": 311, "chapter": "Podes!", "text": "Parece que há calma. Mas o inimigo de Deus não dorme... - Também o Coração de Jesus vela! Essa é a minha esperança."}, {"n": 312, "chapter": "Podes!", "text": "A santidade está na luta, em saber que temos defeitos e em tratar heroicamente de evitá-los. A santidade - insisto - está em vencer esses defeitos..., mas morreremos com defeitos: senão, já te disse, seríamos uns soberbos."}, {"n": 313, "chapter": "Podes!", "text": "Obrigado, Senhor, porque - ao permitires a tentação - nos dás também a formosura e a fortaleza da tua graça, para que sejamos vencedores! Obrigado, Senhor, pelas tentações, que Tu permites para que sejamos humildes!"}, {"n": 314, "chapter": "Podes!", "text": "Não me abandones, meu Senhor: não vês a que abismo sem fundo iria parar este teu pobre filho? - Minha Mãe: sou teu filho também."}, {"n": 315, "chapter": "Podes!", "text": "Não se pode ter uma vida limpa sem a ajuda divina. Deus quer a nossa humildade, quer que Lhe peçamos a sua ajuda, através da nossa Mãe e sua Mãe. Tens que dizer a Nossa Senhora, agora mesmo, na solidão acompanhada do teu coração, falando sem ruído de palavras: - Minha Mãe, este meu pobre coração rebela-se algumas vezes... Mas se tu me ajudas... - E Ela te ajudará, para que o guardes limpo e continues pelo caminho a que Deus te chamou: a Virgem te facilitará sempre o cumprimento da Vontade de Deus."}, {"n": 316, "chapter": "Podes!", "text": "Para guardar a santa pureza, a limpeza de vida, tens de amar e praticar a mortificação diária."}, {"n": 317, "chapter": "Podes!", "text": "Quando sentires o aguilhão da pobre carne, que às vezes ataca com violência, beija o Crucifixo, beija-o muitas vezes!, com eficácia de vontade, mesmo que te pareça que o fazes sem amor."}, {"n": 318, "chapter": "Podes!", "text": "Coloca-te cada dia diante do Senhor e, como aquele homem necessitado do Evangelho, diz-Lhe devagar, com todo o empenho do teu coração: “Domine, ut videam!” - Senhor, que eu veja! Que veja o que Tu esperas de mim e lute por ser-te fiel."}, {"n": 319, "chapter": "Podes!", "text": "Meu Deus, como é fácil perseverar, sabendo que Tu és o Bom Pastor, e nós - tu e eu... - ovelhas do teu rebanho! - Porque estamos bem cientes de que o Bom Pastor dá a sua vida inteira por cada uma das suas ovelhas."}, {"n": 320, "chapter": "Podes!", "text": "Hoje, na tua oração, confirmaste o propósito de fazer-te santo. Bem te entendo quando acrescentas, concretizando: - Sei que o conseguirei, não por estar seguro de mim, Jesus, mas porque... estou seguro de Ti."}, {"n": 321, "chapter": "Podes!", "text": "Tu, sozinho, sem contar com a graça, não conseguirás nada de proveito, porque terás cortado o caminho das relações com Deus. - Com a graça, porém, podes tudo."}, {"n": 322, "chapter": "Podes!", "text": "Queres aprender de Cristo e tomar exemplo da sua vida? - Abre o Santo Evangelho e escuta o diálogo de Deus com os homens..., contigo."}, {"n": 323, "chapter": "Podes!", "text": "Jesus sabe muito bem o que nos convém..., e eu amo e amarei sempre a sua Vontade. É Ele quem maneja os “bonecos” e, se for um meio para o nosso fim, apesar desses homens sem Deus que se empenham em levantar obstáculos, dar-me-á o que Lhe peço."}, {"n": 324, "chapter": "Podes!", "text": "A fé verdadeira revela-se pela humildade. “Dicebat enim intra se” - dizia aquela pobre mulher dentro de si: “Si tetigero tantum vestimentum eius, salva ero” - basta-me tocar a orla das suas vestes, e ficarei curada. - Que humildade a dela, fruto e sinal da sua fé!"}, {"n": 325, "chapter": "Podes!", "text": "Se Deus te dá a carga, Deus te dará a força."}, {"n": 326, "chapter": "Podes!", "text": "Invoca o Espírito Santo no exame de consciência, para conheceres mais a Deus, para te conheceres a ti mesmo, e assim poderes converter-te em cada dia."}, {"n": 327, "chapter": "Podes!", "text": "Direção espiritual. Não te oponhas a que revolvam a tua alma, com sentido sobrenatural e com santa desvergonha, para verificarem até que ponto podes - e queres! - dar glória a Deus."}, {"n": 328, "chapter": "Podes!", "text": "“Quomodo fiet istud quoniam virum non cognosco?” - como poderá realizar-se este prodígio, se não conheço varão? Pergunta de Maria ao Anjo, que é reflexo do seu Coração sincero. Olhando para a Virgem Santa, confirmei-me numa norma clara: para termos paz e vivermos em paz, temos de ser muito sinceros com Deus, com os que dirigem a nossa alma e conosco próprios."}, {"n": 329, "chapter": "Podes!", "text": "O menino bobo chora e esperneia, quando a mãe carinhosa lhe espeta um alfinete no dedo para lhe tirar o espinho que se cravou... O menino ajuizado, talvez com os olhos cheios de lágrimas - porque a carne é fraca -, olha agradecido para a sua boa mãe, que o faz sofrer um pouco para evitar maiores males. - Jesus, que eu seja menino ajuizado."}, {"n": 330, "chapter": "Podes!", "text": "Menino, pobre burrico: se, com Amor, o Senhor limpou as tuas negras costas, habituadas ao esterco, e te carrega com arreios de seda, e sobre eles coloca jóias
