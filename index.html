tubo digestivo, como se aquilo fosse “um fim”?"}, {"n": 680, "chapter": "Outras virtudes", "text": "À mesa, não fales de comida; isso é uma grosseria, imprópria de ti. - Fala de coisas nobres - da alma ou do entendimento -, e terás enaltecido esse dever."}, {"n": 681, "chapter": "Outras virtudes", "text": "No dia em que te levantares da mesa sem teres feito uma pequena mortificação, comeste como um pagão."}, {"n": 682, "chapter": "Outras virtudes", "text": "Habitualmente, comes mais do que precisas. - E essa fartura, que muitas vezes te produz lassidão e mal-estar físico, torna-te incapaz de saborear os bens sobrenaturais e entorpece o teu entendimento. Que boa virtude, mesmo para a terra, é a temperança!"}, {"n": 683, "chapter": "Outras virtudes", "text": "Vejo-te, cavalheiro cristão (dizes que o és), beijando uma imagem, mascando entre dentes uma oração vocal, clamando contra os que atacam a Igreja de Deus..., e até freqflentando os Santos Sacramentos. Mas não te vejo fazer um sacrifício, nem prescindir de certas conversas... mundanas (podia, com razão, aplicar-lhes outro qualificativo), nem ser generoso com os inferiores... - nem com a Igreja de Cristo! -, nem suportar uma fraqueza do teu irmão, nem abater a tua soberba pelo bem comum, nem desfazer-te do teu forte invólucro de egoísmo, nem... tantas coisas mais! Vejo-te... Não te vejo... - E tu... dizes que és um cavalheiro cristão? - Que pobre conceito fazes de Cristo!"}, {"n": 684, "chapter": "Outras virtudes", "text": "O teu talento, a tua simpatia, as tuas condições... perdem-se; não te deixam aproveitá-los. - Pensa bem nestas palavras de um autor espiritual: “Não se perde o incenso que se oferece a Deus. - Mais se honra o Senhor com o abatimento dos teus talentos do que com o seu uso vão”."}, {"n": 685, "chapter": "Tribulações", "text": "O vendaval da perseguição é bom. - O que é que se perde?... Não se perde o que está perdido. Quando não se arranca a árvore pela raiz - e a árvore da Igreja, não há vento nem furacão que a possam arrancar -, apenas caem os ramos secos... E esses, bom é que caiam."}, {"n": 686, "chapter": "Tribulações", "text": "De acordo: essa pessoa tem sido má contigo. - Mas não tens sido tu pior com Deus?"}, {"n": 687, "chapter": "Tribulações", "text": "Jesus: por onde quer que tenhas passado, não ficou um coração indiferente. - Ou Te amam ou Te odeiam. Quando um homem-apóstolo Te segue, cumprindo o seu dever, poderá surpreender-me - se é outro Cristo! - que levante parecidos murmúrios de aversão ou de afeto?"}, {"n": 688, "chapter": "Tribulações", "text": "Outra vez!... Falaram, escreveram..., a favor, contra...; com boa e com menos boa vontade...; reticências e calúnias, panegíricos e exaltações..., sandices e verdades... - Bobo! Grandessíssimo bobo! Se vais direito ao teu fim, com a cabeça e o coração bêbados de Deus, que te importa a ti o clamor do vento ou o cantar da cigarra, ou o mugido, ou o grunhido, ou o relincho?... Além disso..., é inevitável; não pretendas tapar o sol com a peneira."}, {"n": 689, "chapter": "Tribulações", "text": "Soltaram-se as línguas e sofreste desfeitas que te feriram mais porque não as esperavas. A tua reação sobrenatural deve ser a de perdoar - e mesmo pedir perdão - e aproveitar a experiência para desapegar-te das criaturas."}, {"n": 690, "chapter": "Tribulações", "text": "Quando vier o sofrimento, o desprezo..., a Cruz, deves considerar: - Que é isto, comparado com o que eu mereço?"}, {"n": 691, "chapter": "Tribulações", "text": "Estás sofrendo uma grande tribulação? Tens contrariedades? - Diz, muito devagar, como que saboreando, esta oração forte e viril: “Faça-se, cumpra-se, seja louvada e eternamente glorificada a justíssima e amabilíssima Vontade de Deus sobre todas as coisas. - Assim seja. - Assim seja.” Eu te garanto que alcançarás a paz."}, {"n": 692, "chapter": "Tribulações", "text": "Sofres nesta vida de cá, que é um sonho... breve. - Alegra-te, porque teu Pai-Deus te ama muito e, se não levantares obstáculos, após este sonho ruim, te dará um bom despertar."}, {"n": 693, "chapter": "Tribulações", "text": "Dói-te que não te agradeçam aquele favor. - Responde-me a estas duas perguntas: - És tu assim agradecido com Jesus Cristo? - Foste capaz de fazer esse favor, procurando o agradecimento na terra?"}, {"n": 694, "chapter": "Tribulações", "text": "Não sei por que te assustas. - Sempre foram pouco razoáveis os inimigos de Cristo. Ressuscitado Lázaro, deveriam render-se e confessar a divindade de Jesus. - Mas não! Matemos Aquele que dá a vida!, disseram. E hoje como ontem."}, {"n": 695, "chapter": "Tribulações", "text": "Nas horas de luta e contradição, quando talvez “os bons” encham de obstáculos o teu caminho, levanta o teu coração de apóstolo; ouve Jesus que fala do grão de mostarda e do fermento. - E diz-Lhe: “Edissere nobis parabolam” - explica-me a parábola. E sentirás a alegria de contemplar a vitória futura: aves do céu à sombra do teu apostolado, agora incipiente; e toda a massa fermentada."}, {"n": 696, "chapter": "Tribulações", "text": "Se recebes a tribulação de ânimo encolhido, perdes a alegria e a paz, e te expões a não tirar proveito espiritual desse transe."}, {"n": 697, "chapter": "Tribulações", "text": "Os acontecimentos públicos levaram-te a um encerramento voluntário, pior talvez, pelas suas circunstâncias, do que o encerramento numa prisão. - Sofreste um eclipse da tua personalidade. Não encontras ambiente; só egoísmo, curiosidade, incompreensões e murmuração. - Está certo. E daí? Esqueces a tua vontade libérrima e o teu poder de “criança”? - A falta de folhas e de flores (de ação externa) não exclui a multiplicação e a atividade das raízes (vida interior). Trabalha; há de mudar o rumo das coisas, e darás mais frutos do que antes, e mais saborosos."}, {"n": 698, "chapter": "Tribulações", "text": "Ralham contigo? - Não te zangues, como te aconselha a soberba. - Pensa: que caridade têm comigo! Quanto não terão calado!"}, {"n": 699, "chapter": "Tribulações", "text": "Cruz, trabalhos, tribulações: tê-los-ás enquanto viveres. - Por esse caminho foi Cristo, e não é o discípulo mais que o Mestre."}, {"n": 700, "chapter": "Tribulações", "text": "Certo: há muita luta de fora, e isso te desculpa, em parte. - Mas também há cumplicidade dentro - repara devagar -, e aí não vejo desculpa."}, {"n": 701, "chapter": "Tribulações", "text": "Não ouviste dos lábios do Mestre a parábola da videira e dos ramos? - Consola-te. Ele exige muito de ti porque és ramo que dá fruto... E te poda, “ut fructum plus afferas” - para que dês mais fruto. É claro!: dói esse cortar, esse arrancar. Mas, depois, que louçania nos frutos, que maturidade nas obras!"}, {"n": 702, "chapter": "Tribulações", "text": "Estás intranqflilo. - Olha: aconteça o que acontecer na tua vida interior ou no mundo que te rodeia, nunca te esqueças de que a importância dos acontecimentos ou das pessoas é muito relativa. - Calma! Deixa correr o tempo; e, depois, olhando de longe e sem paixão os fatos e as pessoas, adquirirás a perspectiva, porás cada coisa no seu lugar e de acordo com o seu verdadeiro tamanho. Se assim fizeres, serás mais justo e evitarás muitas preocupações."}, {"n": 703, "chapter": "Tribulações", "text": "Uma noite ruim, numa ruim pousada. - Assim dizem que definiu esta vida terrena a Madre Teresa de Jesus. É uma comparação certeira, não é mesmo?"}, {"n": 704, "chapter": "Tribulações", "text": "Uma visita ao famoso mosteiro. - Aquela senhora estrangeira sentiu apiedar-se o coração, ao considerar a pobreza do edifício: “Os senhores devem ter uma vida muito dura, não é?” E o monge, satisfeito, limitou-se a responder: “Tú lo quisiste, fraile mostén; tú lo quisiste, tú te lo ten”"}, {"n": 705, "chapter": "Tribulações", "text": "Inquietar-se? - Nunca! Porque é perder a paz."}, {"n": 706, "chapter": "Tribulações", "text": "Abatimento físico. Estás... arrasado. - Descansa. Pára com essa atividade exterior. - Consulta o médico. Obedece e despreocupa-te. Em breve regressarás à tua vida e melhorarás, se fores fiel, os teus trabalhos de apostolado."}, {"n": 707, "chapter": "Luta interior", "text": "Não te perturbes se, ao considerar as maravilhas do mundo sobrenatural, sentes a outra voz - íntima, insinuante - do “homem velho”. É “o corpo de morte” que clama por seus foros perdidos... Basta-te a graça; sê fiel e vencerás."}, {"n": 708, "chapter": "Luta interior", "text": "O mundo, o demônio e a carne são uns aventureiros que, aproveitando-se da fraqueza do selvagem que trazes dentro de ti, querem que, em troca do fictício brilho de um prazer - que nada vale -, lhes entregues o ouro fino e as pérolas e os brilhantes e os rubis embebidos no sangue vivo e redentor do teu Deus, que são o preço e o tesouro da tua eternidade."}, {"n": 709, "chapter": "Luta interior", "text": "Estás ouvindo? - Em outro estado, em outro lugar, em outro grau e ofício farias um bem muito maior. - Para fazer o que estás fazendo, não é preciso talento! Pois eu te digo: - Onde te puseram agradas a Deus..., e isso que andavas pensando é claramente uma sugestão infernal."}, {"n": 710, "chapter": "Luta interior", "text": "Ficas apoquentado e triste porque as tuas Comunhões são frias, cheias de aridez. - Quando vais ao Sacramento, diz-me uma coisa: procuras-te a ti ou procuras Jesus? - Se te procuras a ti, motivo tens para entristecer-te... Mas se - como deves - procuras Cristo, queres sinal mais certo do que a Cruz para saber que O encontraste?"}, {"n": 711, "chapter": "Luta interior", "text": "Outra queda..., e que queda!... Desesperar-te? Não: humilhar-te e recorrer, por Maria, tua Mãe, ao Amor Misericordioso de Jesus. - Um “miserere” e... coração ao alto! - Vamos!, começa de novo."}, {"n": 712, "chapter": "Luta interior", "text": "Bem fundo caíste! - Começa os alicerces daí de baixo. - Sê humilde. - “Cor contritum et humiliatum, Deus, non despicies”. - Não desprezará Deus um coração contrito e humilhado."}, {"n": 713, "chapter": "Luta interior", "text": "Tu não vais contra Deus. - As tuas quedas são de fragilidade. - De acordo. Mas são tão freqflentes essas fragilidades (não sabes evitá-las) que, se não queres que te tenha por mau, me verei obrigado a ter-te por mau e por tolo."}, {"n": 714, "chapter": "Luta interior", "text": "Um querer sem querer é o teu, enquanto não afastares decididamente a ocasião. - Não queiras iludir-te dizendo-me que és fraco. És... covarde, o que não é o mesmo."}, {"n": 715, "chapter": "Luta interior", "text": "Essa trepidação do teu espírito, a tentação que te envolve, é como uma venda sobre os olhos da tua alma. Estás às escuras. - Não te empenhes em andar só, porque, sozinho, cairás. - Vai ter com o teu Diretor - com o teu superior -, e ele te fará ouvir aquelas palavras do Arcanjo Rafael a Tobias: “Forti animo esto, in proximo est ut a Deo cureris”. - Tem coragem, que em breve te curará Deus. - Sê obediente, e cairão as escamas, cairá a venda dos teus olhos, e Deus te encherá de graça e de paz."}, {"n": 716, "chapter": "Luta interior", "text": "“Não sei vencer-me!”, escreves-me com desalento. - E te respondo: Mas já tentaste, por acaso, empregar os meios?"}, {"n": 717, "chapter": "Luta interior", "text": "Bem-aventuradas desventuras da terra! - Pobreza, lágrimas, ódios, injustiça, desonra... Tudo poderás nAquele que te confortará."}, {"n": 718, "chapter": "Luta interior", "text": "Sofres... e não quererias queixar-te. - Não faz mal que te queixes - é a reação natural da nossa pobre carne -, enquanto a tua vontade quiser em ti, agora e sempre, o que Deus quer."}, {"n": 719, "chapter": "Luta interior", "text": "Nunca desesperes. Morto e corrompido estava Lázaro: “Jam foetet, quatriduanus est enim” - já fede, porque há quatro dias que está enterrado, diz Marta a Jesus. Se ouvires a inspiração de Deus e a seguires (“Lazare, veni foras!” - Lázaro, vem para fora!), voltarás à Vida."}, {"n": 720, "chapter": "Luta interior", "text": "Como custa! - Já sei. Mas, para a frente! Só será premiado - e que prêmio! - aquele que pelejar com bravura."}, {"n": 721, "chapter": "Luta interior", "text": "Se cambaleia o teu edifício espiritual, se tens a impressão de que tudo está no ar..., apóia-te na confiança filial em Jesus e em Maria, pedra firme e segura sobre a qual devias ter edificado desde o princípio."}, {"n": 722, "chapter": "Luta interior", "text": "A provação desta vez é longa. - Talvez - e mesmo sem “talvez” - não a tenhas aceitado bem até agora... porque ainda procuravas consolos humanos. - E teu Pai-Deus os arrancou pela raiz, para que não tenhas outro arrimo fora dEle."}, {"n": 723, "chapter": "Luta interior", "text": "Dizes que para ti tudo é indiferente? - Não queiras iludir-te. Agora mesmo, se eu te perguntasse por pessoas e por atividades em que por Deus empenhaste a tua alma, sei que me responderias - briosamente! - com o interesse de quem fala de coisa própria. Não, para ti não é tudo indiferente. É que não és incansável..., e necessitas de mais tempo para ti; tempo que será também para as tuas obras, porque, no fim das contas, tu és o instrumento."}, {"n": 724, "chapter": "Luta interior", "text": "Vens dizer-me que tens no teu peito fogo e água, frio e calor, paixõezinhas e Deus..., uma vela acesa a São Miguel e outra ao diabo. Sossega; enquanto quiseres lutar, não haverá duas velas acesas no teu peito, mas uma só - a do Arcanjo."}, {"n": 725, "chapter": "Luta interior", "text": "O inimigo quase sempre procede assim com as almas que lhe vão resistir: hipocritamente, suavemente; motivos... espirituais!: não chamar a atenção... - E depois, quando parece não haver remédio (que há), descaradamente..., para ver se consegue um desespero como o de Judas, sem arrependimento."}, {"n": 726, "chapter": "Luta interior", "text": "Ao perderes aqueles consolos humanos, ficaste com uma sensação de solidão, como que suspenso por um fiozinho sobre o vazio de negro abismo. - E teu clamor, teus gritos de socorro, parece que ninguém os escuta. É bem merecido esse desamparo. - Sê humilde. Não te procures a ti nem procures a tua comodidade; ama a Cruz - suportá-la é pouco - e o Senhor ouvirá a tua oração. - E hão de acalmar-se os teus sentidos. - E voltará a cicatrizar o teu coração. - E terás paz."}, {"n": 727, "chapter": "Luta interior", "text": "Em carne viva. - É assim que te encontras. Tudo te faz sofrer nas potências da alma e nos sentidos. E tudo para ti é tentação... Sê humilde, insisto. Verás como em breve te tiram desse estado. E a dor se transformará em alegria; e a tentação, em segura firmeza. Mas, enquanto isso, aviva a tua fé; enche-te de esperança; e faz contínuos atos de Amor, embora penses que são só da boca para fora."}, {"n": 728, "chapter": "Luta interior", "text": "Toda a nossa fortaleza é emprestada."}, {"n": 729, "chapter": "Luta interior", "text": "Ó meu Deus: cada dia me sinto menos seguro de mim e mais seguro de Ti!"}, {"n": 730, "chapter": "Luta interior", "text": "Se não O abandonas, Ele não te abandonará."}, {"n": 731, "chapter": "Luta interior", "text": "Espera tudo de Jesus; tu nada tens, nada vales, nada podes. - Ele agirá, se nEle te abandonares."}, {"n": 732, "chapter": "Luta interior", "text": "Ó Jesus! - Descanso em Ti."}, {"n": 733, "chapter": "Luta interior", "text": "Confia sempre no teu Deus. - Ele não perde batalhas."}, {"n": 734, "chapter": "Novíssimos", "text": "“Esta é a vossa hora, e o poder das trevas”. - Quer dizer que... o homem pecador tem a sua hora? - Tem, sim... E Deus, a sua eternidade!"}, {"n": 735, "chapter": "Novíssimos", "text": "Se és apóstolo, a morte será para ti uma boa amiga que te facilita o caminho."}, {"n": 736, "chapter": "Novíssimos", "text": "Já viste, numa tarde triste de outono, caírem as folhas mortas? Assim caem todos os dias as almas na eternidade. Um dia, a folha caída serás tu."}, {"n": 737, "chapter": "Novíssimos", "text": "Não tens ouvido com que tom de tristeza se lamentam os mundanos de que “cada dia que passa é morrer um pouco”? Pois eu te digo: - Alegra-te, alma de apóstolo, porque cada dia que passa te aproxima da Vida."}, {"n": 738, "chapter": "Novíssimos", "text": "Aos “outros”, a morte os paralisa e assusta. A nós, a morte - a Vida - dá - nos coragem e impulso. Para eles, é o fim; para nós, o princípio."}, {"n": 739, "chapter": "Novíssimos", "text": "Não tenhas medo da morte. - Aceita-a desde agora, generosamente..., quando Deus quiser..., como Deus quiser..., onde Deus quiser. - Não duvides; virá no tempo, no lugar e do modo que mais convier..., enviada por teu Pai-Deus. - Bem-vinda seja a nossa irmã, a morte!"}, {"n": 740, "chapter": "Novíssimos", "text": "Que peça do mundo se desengonçará se eu faltar, se morrer?"}, {"n": 741, "chapter": "Novíssimos", "text": "Vês como se desfaz materialmente, em humores pestilentos, o cadáver da pessoa amada? - Pois isso é um corpo formoso! - Contempla-o e tira conclusões."}, {"n": 742, "chapter": "Novíssimos", "text": "Aqueles quadros de Valdés Leal"}, {"n": 743, "chapter": "Novíssimos", "text": "Falas-me em morrer “heroicamente”. - Não achas que é mais “heróico” morrer despercebido, numa boa cama, como um burguês..., mas de mal de Amor?"}, {"n": 744, "chapter": "Novíssimos", "text": "Tu - se és apóstolo - não hás de morrer. - Mudarás de casa, e é só."}, {"n": 745, "chapter": "Novíssimos", "text": "“Há de vir julgar os vivos e os mortos”, rezamos no Credo. - Oxalá não percas de vista esse julgamento e essa justiça e... esse Juiz."}, {"n": 746, "chapter": "Novíssimos", "text": "Será que não brilha na tua alma o desejo de que teu Pai-Deus fique contente quando tiver que julgar-te?"}, {"n": 747, "chapter": "Novíssimos", "text": "Há uma grande propensão nas almas mundanas para recordar a Misericórdia do Senhor. - E assim se animam a continuar em seus desvarios. É verdade que Deus Nosso Senhor é infinitamente misericordioso, mas também é infinitamente justo. E há um julgamento, e Ele é o Juiz."}, {"n": 748, "chapter": "Novíssimos", "text": "Anima-te. - Não sabes que São Paulo diz aos de Corinto que “cada um receberá o seu salário na medida do seu próprio trabalho”?"}, {"n": 749, "chapter": "Novíssimos", "text": "Há inferno. - Uma afirmação que para ti é sem dúvida um lugar-comum. - Vou-te repetir: há inferno! Vê se me serves de eco, oportunamente, ao ouvido daquele companheiro... e daquele outro."}, {"n": 750, "chapter": "Novíssimos", "text": "Escuta-me bem, homem metido na ciência até a ponta dos cabelos: a tua ciência não me pode negar a verdade das atividades diabólicas. Durante muitos anos - e ainda hoje é uma louvável devoção privada -, minha Mãe, a Santa Igreja, fez que os Sacerdotes ao pé do altar invocassem todos os dias São Miguel, “contra nequitiam et insidias diaboli”, contra a maldade e ciladas do inimigo."}, {"n": 751, "chapter": "Novíssimos", "text": "O Céu. “Nem olho algum viu, nem ouvido algum ouviu, nem jamais passou pela cabeça do homem o que Deus preparou para os que O amam”. Não te incitam à luta estas revelações do Apóstolo?"}, {"n": 752, "chapter": "Novíssimos", "text": "Sempre. - Para sempre! - Palavras muito manuseadas pelo esforço humano de prolongar - de eternizar - o que é gostoso. Palavras mentirosas na terra, onde tudo se acaba."}, {"n": 753, "chapter": "Novíssimos", "text": "Isto daqui é um contínuo acabar-se; ainda não começou o prazer, e já termina."}, {"n": 754, "chapter": "A Vontade de Deus", "text": "Esta é a chave para abrir a porta e entrar no Reino dos Céus: “Qui facit voluntatem Patris mei qui in coelis est, ipse intrabit in regnum coelorum” - quem faz a vontade de meu Pai..., esse entrará!"}, {"n": 755, "chapter": "A Vontade de Deus", "text": "De que tu e eu nos portemos como Deus quer - não o esqueças - dependem muitas coisas grandes."}, {"n": 756, "chapter": "A Vontade de Deus", "text": "Nós somos pedras, silhares, que se movem, que sentem, que têm uma libérrima vontade. O próprio Deus é o canteiro que nos tira as arestas, arranjando-nos, modificando-nos, conforme deseja, a golpes de martelo e de cinzel. Não queiramos afastar-nos, não queiramos esquivar-nos à sua Vontade, porque, de qualquer maneira, não poderemos evitar os golpes. - Sofreremos mais e inutilmente, e, em lugar de pedra polida e apta para edificar, seremos um montão informe de cascalho que os homens pisarão com desprezo."}, {"n": 757, "chapter": "A Vontade de Deus", "text": "Resignação?... Conformidade?... Querer a Vontade de Deus!"}, {"n": 758, "chapter": "A Vontade de Deus", "text": "A aceitação rendida da Vontade de Deus traz necessariamente a alegria e a paz: a felicidade na Cruz. - Então se vê que o jugo de Cristo é suave e que o seu fardo não é pesado."}, {"n": 759, "chapter": "A Vontade de Deus", "text": "Paz, paz!, dizes-me. - A paz é... para os homens de “boa” vontade."}, {"n": 760, "chapter": "A Vontade de Deus", "text": "Um raciocínio que conduz à paz e que o Espírito Santo oferece pronto aos que querem a Vontade de Deus: “Dominus regit me, et nihil mihi deerit” - o Senhor é quem me governa; nada me faltará. Que há que possa inquietar uma alma que repita seriamente essas palavras?"}, {"n": 761, "chapter": "A Vontade de Deus", "text": "Homem livre, sujeita-te a uma voluntária servidão, para que Jesus não tenha que dizer por tua causa aquilo que contam ter dito, a propósito de outros, à Madre Teresa: “Teresa, Eu quis..., mas os homens não quiseram”."}, {"n": 762, "chapter": "A Vontade de Deus", "text": "Ato de identificação com a Vontade de Deus: - Tu o queres, Senhor?... Eu também o quero!"}, {"n": 763, "chapter": "A Vontade de Deus", "text": "Não duvides; deixa que suba do coração aos lábios um “fiat” - faça-se!... - que seja o coroamento do sacrifício."}, {"n": 764, "chapter": "A Vontade de Deus", "text": "Quanto mais perto de Deus está o apóstolo, mais universal se sente; dilata-se o seu coração para que caibam todos e tudo no desejo de pôr o universo aos pés de Jesus."}, {"n": 765, "chapter": "A Vontade de Deus", "text": "Meu Deus, antes quero a tua Vontade, do que - se fosse possível tal disparate - alcançar o próprio Céu, deixando de cumpri-la."}, {"n": 766, "chapter": "A Vontade de Deus", "text": "O abandono à Vontade de Deus é o segredo para sermos felizes na terra. Então, diz: “Meus cibus est, ut faciam voluntatem ejus” - meu alimento é fazer a sua Vontade."}, {"n": 767, "chapter": "A Vontade de Deus", "text": "Esse abandono é precisamente a condição que te falta para não perderes, daqui por diante, a tua paz."}, {"n": 768, "chapter": "A Vontade de Deus", "text": "O “gaudium cum pace” - alegria e paz - é fruto certo e saboroso do abandono."}, {"n": 769, "chapter": "A Vontade de Deus", "text": "O desprendimento não é ter o coração seco..., como Jesus não o teve."}, {"n": 770, "chapter": "A Vontade de Deus", "text": "Não és menos feliz por te faltar do que serias se te sobrasse."}, {"n": 771, "chapter": "A Vontade de Deus", "text": "Deus exalta os que cumprem a sua Vontade nas mesmas coisas em que os humilhou."}, {"n": 772, "chapter": "A Vontade de Deus", "text": "Pergunta-te a ti mesmo, muitas vezes ao dia: - Estou fazendo neste momento o que devo fazer?"}, {"n": 773, "chapter": "A Vontade de Deus", "text": "Jesus, o que Tu “quiseres”..., eu o amo."}, {"n": 774, "chapter": "A Vontade de Deus", "text": "Gradação: resignar-se com a Vontade de Deus; conformar-se com a Vontade de Deus; querer a Vontade de Deus; amar a Vontade de Deus."}, {"n": 775, "chapter": "A Vontade de Deus", "text": "Senhor, se é a tua Vontade, faz da minha pobre carne um Crucifixo."}, {"n": 776, "chapter": "A Vontade de Deus", "text": "Não caias num círculo vicioso. Tu pensas: - Quando isto se resolver desta ou daquela maneira, então serei muito generoso com o meu Deus. Não será que Jesus está esperando que sejas generoso sem reservas, para resolver Ele as coisas melhor do que imaginas? Propósito firme, lógica conseqflência: em cada instante de cada dia, tratarei de cumprir com generosidade a Vontade de Deus."}, {"n": 777, "chapter": "A Vontade de Deus", "text": "A tua própria vontade, a tua própria opinião: é isso o que te inquieta."}, {"n": 778, "chapter": "A Vontade de Deus", "text": "É uma questão de segundos... Pensa antes de começar qualquer trabalho: - Que quer Deus de mim neste assunto? E, com a graça divina, faze-o!"}, {"n": 779, "chapter": "A Glória de Deus", "text": "É bom dar glória a Deus sem buscar antecipações - mulher, filhos, honras... - dessa glória de que gozaremos plenamente com Ele na Vida... Além disso, Ele é generoso... Dá cem por um; e isso é verdade, mesmo nos filhos. - Muitos se privam deles pela glória de Deus, e têm milhares de filhos do seu espírito. - Filhos, como nós o somos do nosso Pai que está nos céus."}, {"n": 780, "chapter": "A Glória de Deus", "text": "“Deo omnis gloria”. - Para Deus toda a glória. - É uma confissão categórica do nosso nada. Ele, Jesus, é tudo. Nós, sem Ele, nada valemos: nada. A nossa vanglória seria isso precisamente: glória vã. Seria um roubo sacrílego. O “eu” não deve aparecer em parte nenhuma."}, {"n": 781, "chapter": "A Glória de Deus", "text": "“Sem Mim nada podeis fazer”, disse o Senhor. - E disse-o para que tu e eu não consideremos como nossos, êxitos que são dEle. - “Sine me nihil!...”"}, {"n": 782, "chapter": "A Glória de Deus", "text": "Como te atreves a empregar essa centelha do entendimento divino, que é a tua razão, em outra coisa que não seja dar glória ao teu Senhor?"}, {"n": 783, "chapter": "A Glória de Deus", "text": "Se a vida não tivesse por fim dar glória a Deus, seria desprezível; mais ainda, detestável."}, {"n": 784, "chapter": "A Glória de Deus", "text": "Dá “toda” a glória a Deus. - “Espreme” com a tua vontade, ajudado pela graça, cada uma de tuas ações, para que nelas não fique nada que cheire a humana soberba, a complacência do teu “eu”."}, {"n": 785, "chapter": "A Glória de Deus", "text": "“Deus meus es tu, et confitebor tibi: Deus meus es tu, et exaltabo te” - Tu és o meu Deus, eu Te confessarei; Tu és o meu Deus, eu Te glorificarei. - Belo programa..., para um apóstolo da tua têmpera."}, {"n": 786, "chapter": "A Glória de Deus", "text": "Nenhum afeto te prenda à terra, fora o desejo diviníssimo de dar glória a Cristo e, por Ele e com Ele e nEle, ao Pai e ao Espírito Santo."}, {"n": 787, "chapter": "A Glória de Deus", "text": "Retifica, retifica. - Seria tão pouco engraçado que essa vitória fosse estéril por te haveres guiado por motivos humanos!"}, {"n": 788, "chapter": "A Glória de Deus", "text": "Pureza de intenção. - As sugestões da soberba e os ímpetos da carne, logo os conheces..., e lutas, e, com a graça, vences. Mas os motivos que te levam a agir, mesmo nas ações mais santas, não te parecem claros... e sentes uma voz lá dentro que te faz ver intuitos humanos..., com tal sutileza que se infiltra na tua alma a intranqflilidade de pensar que não estás trabalhando como deves - por puro Amor, única e exclusivamente para dar a Deus toda a sua glória. Reage logo, de cada vez, e diz: “Senhor, para mim nada quero. - Tudo para a tua glória e por Amor”."}, {"n": 789, "chapter": "A Glória de Deus", "text": "Não há dúvida de que purificaste bem a tua intenção quando disseste: - Renuncio desde agora a toda a gratidão e recompensa humanas."}, {"n": 790, "chapter": "Proselitismo", "text": "Não desejaríeis gritar à juventude que fervilha à vossa volta: - Loucos!, largai essas coisas mundanas que amesquinham o coração... e muitas vezes o aviltam..., largai isso e vinde conosco atrás do Amor?"}, {"n": 791, "chapter": "Proselitismo", "text": "Falta-te “vibração”. - Essa é a causa de que arrastes tão poucos. - É como se não estivesses muito persuadido do que ganhas ao deixar por Cristo essas coisas da terra. Compara: cem por um e a vida eterna! - Parece-te pequeno o “negócio”?"}, {"n": 792, "chapter": "Proselitismo", "text": "“Duc in altum” - Mar adentro! - Repele o pessimismo que te faz covarde. “Et laxate retia vestra in capturam” - e lança as redes para pescar. Não vês que podes dizer, como Pedro: “In nomine tuo, laxabo rete” - Jesus, em teu nome procurarei almas?"}, {"n": 793, "chapter": "Proselitismo", "text": "Proselitismo. - É o sinal certo do zelo verdadeiro."}, {"n": 794, "chapter": "Proselitismo", "text": "Semear. - Saiu o semeador... - Semeia a mãos cheias, alma de apóstolo. - O vento da graça arrastará a tua semente, se o sulco onde caiu não for digno... Semeia, e fica certo de que a semente vingará e dará o seu fruto."}, {"n": 795, "chapter": "Proselitismo", "text": "Com o bom exemplo semeia-se boa semente; e a caridade obriga todos a semear."}, {"n": 796, "chapter": "Proselitismo", "text": "Pequeno amor é o teu se não sentes zelo pela salvação de todas as almas. - Pobre amor é o teu se não tens ânsias de pegar a tua loucura a outros apóstolos."}, {"n": 797, "chapter": "Proselitismo", "text": "Sabes que o teu caminho não é claro. - E que não o é porque, não seguindo Jesus de perto, ficas nas trevas. - Que esperas para decidir-te?"}, {"n": 798, "chapter": "Proselitismo", "text": "Razões?... Que razões daria o pobre Inácio ao sábio Xavier?"}, {"n": 799, "chapter": "Proselitismo", "text": "O que a ti te maravilha, a mim parece-me razoável. - Por que foi Deus procurar-te no exercício da tua profissão? Assim procurou os primeiros: Pedro, André, João e Tiago, junto às redes; Mateus, sentado à mesa dos impostos... E - admira-te! - Paulo, na sua ânsia de acabar com a semente dos cristãos."}, {"n": 800, "chapter": "Proselitismo", "text": "A messe é grande e poucos os operários. - “Rogate ergo!” - Rogai, pois, ao Senhor da messe que envie operários ao seu campo. A oração é o meio mais eficaz de proselitismo."}, {"n": 801, "chapter": "Proselitismo", "text": "Ainda ressoa no mundo aquele clamor divino: “Vim trazer fogo à terra, e que quero senão que arda?” - E bem vês: quase tudo está apagado... Não te animas a propagar o incêndio?"}, {"n": 802, "chapter": "Proselitismo", "text": "Quererias atrair ao teu apostolado aquele homem sábio, aquele outro poderoso, e aquele cheio de prudência e virtudes. Pede por eles, oferece sacrifícios e prepara-os com o teu exemplo e com a tua palavra. - Não vêm! - Não percas a paz; é que não fazem falta. Julgas que não havia contemporâneos de Pedro, sábios, e poderosos, e prudentes, e virtuosos, fora do apostolado dos primeiros doze?"}, {"n": 803, "chapter": "Proselitismo", "text": "Disseram-me que tens “graça”, “jeito”, para atrair almas ao teu caminho. Agradece a Deus esse dom: ser instrumento para procurar instrumentos!"}, {"n": 804, "chapter": "Proselitismo", "text": "Ajuda-me a clamar: - Jesus, almas!... Almas de apóstolo! São para Ti, para a tua glória. Verás como acaba por escutar-nos."}, {"n": 805, "chapter": "Proselitismo", "text": "Escuta: aí... não haverá um... ou dois, que nos entendam bem?"}, {"n": 806, "chapter": "Proselitismo", "text": "Diz, a... esse, que preciso de cinqflenta homens que amem a Jesus Cristo sobre todas as coisas."}, {"n": 807, "chapter": "Proselitismo", "text": "Dizes, desse teu amigo, que freqflenta os Sacramentos, que é de vida limpa e bom estudante, mas que não “entrosa”; se lhe falas de sacrifício e apostolado, fica triste e vai-se embora. Não te preocupes. - Não é um fracasso do teu zelo; é, à letra, a cena que narra o Evangelista: “Se queres ser perfeito, vai e vende tudo o que tens e dá-o aos pobres” (sacrifício)... “e vem depois e segue-me” (apostolado). O adolescente “abiit tristis” - também se retirou entristecido; não quis corresponder à graça."}, {"n": 808, "chapter": "Proselitismo", "text": "“Uma boa notícia: mais um doido..., para o manicômio”. - E tudo é alvoroço na carta do “pescador”. Que Deus encha de eficácia as tuas redes!"}, {"n": 809, "chapter": "Proselitismo", "text": "Proselitismo. - Quem é que não tem fome de perpetuar o seu apostolado?"}, {"n": 810, "chapter": "Proselitismo", "text": "Essas ânsias de proselitismo, que te roem as entranhas, são sinal certo da tua entrega."}, {"n": 811, "chapter": "Proselitismo", "text": "Lembras-te? - Fazíamos tu e eu a nossa oração, quando caía a tarde. Perto, ouvia-se o rumor da água. - E, na quietude da cidade castelhana, ouvíamos também vozes diferentes que falavam em cem línguas, gritando-nos angustiosamente que ainda não conhecem Cristo. Beijaste o Crucifixo, sem te recatares, e Lhe pediste que te fizesse apóstolo de apóstolos."}, {"n": 812, "chapter": "Proselitismo", "text": "Compreendo que ames tanto a tua Pátria e os teus, e que, apesar desses vínculos, aguardes com impaciência o momento de cruzar terras e mares - ir longe! - porque te consome o afã de messe."}, {"n": 813, "chapter": "Pequenas coisas", "text": "Fazei tudo por Amor. - Assim não há coisas pequenas: tudo é grande. - A perseverança nas pequenas coisas, por Amor, é heroísmo."}, {"n": 814, "chapter": "Pequenas coisas", "text": "Um pequeno ato, feito por Amor, quanto não vale!"}, {"n": 815, "chapter": "Pequenas coisas", "text": "Queres de verdade ser santo? - Cumpre o pequeno dever de cada momento; faz o que deves e está no que fazes."}, {"n": 816, "chapter": "Pequenas coisas", "text": "Erraste o caminho se desprezas as coisas pequenas."}, {"n": 817, "chapter": "Pequenas coisas", "text": "A santidade “grande” está em cumprir os “deveres pequenos” de cada instante."}, {"n": 818, "chapter": "Pequenas coisas", "text": "As almas grandes têm muito em conta as coisas pequenas."}, {"n": 819, "chapter": "Pequenas coisas", "text": "Porque foste “in pauca fidelis” - fiel no pouco -, entra no gozo do teu Senhor. - São palavras de Cristo. - “In pauca fidelis!...” - Será que vais desdenhar agora as pequenas coisas, se se promete a Glória a quem as guarda?"}, {"n": 820, "chapter": "Pequenas coisas", "text": "Não julgues nada pela pequenez dos começos. Uma vez fizeram-me notar que não se distinguem pelo tamanho as sementes que darão ervas anuais das que vão produzir árvores centenárias."}, {"n": 821, "chapter": "Pequenas coisas", "text": "Não esqueças que, na terra, tudo o que é grande começou por ser pequeno. - O que nasce grande é monstruoso e morre."}, {"n": 822, "chapter": "Pequenas coisas", "text": "Dizes-me: - Quando se apresentar a ocasião de fazer algo de grande... então, sim! - Será? Pretendes fazer-me acreditar, e acreditar tu seriamente, que poderás vencer na Olimpíada sobrenatural sem a preparação diária, sem treino?"}, {"n": 823, "chapter": "Pequenas coisas", "text": "Viste como levantaram aquele edifício de grandeza imponente? - Um tijolo, e outro. Milhares. Mas, um a um. - E sacos de cimento, um a um. E blocos de pedra, que são bem pouco ante a mole do conjunto. - E pedaços de ferro. - E operários trabalhando, dia após dia, as mesmas horas... Viste como levantaram aquele edifício de grandeza imponente?... À força de pequenas coisas!"}, {"n": 824, "chapter": "Pequenas coisas", "text": "Não tens reparado em que “ninharias” está o amor humano? - Pois também em “ninharias” está o Amor divino."}, {"n": 825, "chapter": "Pequenas coisas", "text": "Persevera no cumprimento exato das obrigações de agora. - Esse trabalho - humilde, monótono, pequeno - é oração plasmada em obras que te preparam para receber a graça do outro trabalho - grande, vasto e profundo - com que sonhas."}, {"n": 826, "chapter": "Pequenas coisas", "text": "Tudo aquilo em que intervimos os pobrezinhos dos homens - mesmo a santidade - é um tecido de pequenas insignificâncias que, conforme a intenção com que se fazem, podem formar uma tapeçaria esplêndida de heroísmo ou de baixeza, de virtudes ou de pecados. As gestas relatam sempre aventuras gigantescas, mas misturadas com pormenores caseiros do herói. - Oxalá tenhas sempre em muito apreço - é a linha reta! - as coisas pequenas."}, {"n": 827, "chapter": "Pequenas coisas", "text": "Já paraste a considerar a enorme soma que podem vir a dar “muitos poucos”?"}, {"n": 828, "chapter": "Pequenas coisas", "text": "Foi dura a experiência; não esqueças a lição. - As tuas grandes covardias de agora são - é evidente - paralelas às tuas pequenas covardias diárias. “Não pudeste” vencer nas coisas grandes, porque “não quiseste” vencer nas coisas pequenas."}, {"n": 829, "chapter": "Pequenas coisas", "text": "Não viste os fulgores do olhar de Jesus quando a pobre viúva deixou no templo a sua pequena esmola? - Dá-Lhe tu o que puderes dar; não está o mérito no pouco nem no muito, mas na vontade com que o deres."}, {"n": 830, "chapter": "Pequenas coisas", "text": "Não sejas... bobo. É verdade que fazes o papel - quando muito - de um pequeno parafuso nessa grande empresa de Cristo. Mas sabes o que significa o parafuso não apertar o suficiente ou saltar fora do seu lugar? Cederão as peças de maior tamanho ou cairão sem dentes as rodas. Ter-se-á dificultado o trabalho. - Talvez se inutilize toda a maquinaria. Que grande coisa é ser um pequeno parafuso!"}, {"n": 831, "chapter": "Tática", "text": "És, entre os teus, alma de apóstolo, a pedra caída no lago. - Provoca, com o teu exemplo e com a tua palavra, um primeiro círculo...; e este, outro... e outro, e outro... Cada vez mais largo. Compreendes agora a grandeza da tua missão?"}, {"n": 832, "chapter": "Tática", "text": "Que preocupação há no mundo por mudar de lugar! - Que aconteceria se cada osso, se cada músculo do corpo humano quisesse ocupar um posto diferente do que lhe compete? Não é outra a razão do mal-estar do mundo. - Persevera no teu lugar, meu filho; daí, quanto poderás trabalhar pelo reinado efetivo de Nosso Senhor!"}, {"n": 833, "chapter": "Tática", "text": "Líderes!... Viriliza a tua vontade, para que Deus te faça líder. Não vês como procedem as malditas sociedades secretas? Nunca conquistam as massas. - Em seus antros, formam alguns homens-demônios que se agitam e movimentam as multidões, tresloucando-as, para fazê-las ir atrás deles, ao precipício de todas as desordens... e ao inferno. - Eles levam uma semente amaldiçoada. Se tu quiseres..., levarás a palavra de Deus, mil e mil vezes bendita, que não pode falhar. Se fores generoso..., se corresponderes com a tua santificação pessoal, obterás a dos outros: o reinado de Cristo. - “Omnes cum Petro ad Jesum per Mariam”"}, {"n": 834, "chapter": "Tática", "text": "Há maior loucura do que lançar aos quatro ventos o trigo dourado na terra, para que apodreça? - Sem essa generosa loucura, não haveria safra. Filho, como andamos de generosidade?"}, {"n": 835, "chapter": "Tática", "text": "Brilhar como uma estrela?... Ânsia de altura e de luz acesa no céu? Melhor ainda: queimar como uma tocha, escondido, pegando o teu fogo a tudo o que tocas. - Este é o teu apostolado; para isso estás na terra."}, {"n": 836, "chapter": "Tática", "text": "Servir de alto-falante ao inimigo é uma idiotice soberana; e se o inimigo é inimigo de Deus, é um grande pecado. - Por isso, no terreno profissional, nunca louvarei a ciência de quem se serve dela como cátedra para atacar a Igreja."}, {"n": 837, "chapter": "Tática", "text": "Galopar, galopar!... Fazer, fazer!... Febre, loucura de mexer-se... Maravilhosos edifícios materiais... Espiritualmente: tábuas de caixote, percalinas, cartões pintalgados... galopar!, fazer! - E muita gente correndo; ir e vir. É que trabalham com vistas àquele momento; “estão” sempre “em presente”. - Tu... hás de ver as coisas com olhos de eternidade, “tendo em presente” o final e o passado... Quietude. - Paz. - Vida intensa dentro de ti. Sem galopar, sem a loucura de mudar de lugar, no posto que na vida te corresponde, como um poderoso gerador de eletricidade espiritual, a quantos não darás luz e energia!..., sem perderes o teu vigor e a tua luz."}, {"n": 838, "chapter": "Tática", "text": "Não tenhas inimigos. - Tem apenas amigos... da direita - se te fizeram ou quiseram fazer-te bem - e... da esquerda - se te prejudicaram ou tentaram prejudicar-te."}, {"n": 839, "chapter": "Tática", "text": "Não contes episódios do “teu” apostolado, a não ser para proveito do próximo."}, {"n": 840, "chapter": "Tática", "text": "Que passe despercebida a vossa condição como passou a de Jesus durante trinta anos."}, {"n": 841, "chapter": "Tática", "text": "José de Arimatéia e Nicodemos visitam Jesus ocultamente, à hora normal e à hora do triunfo. Mas são valentes, declarando perante a autoridade o seu amor a Cristo - “audacter” - com audácia, na hora da covardia. - Aprende."}, {"n": 842, "chapter": "Tática", "text": "Não vos preocupeis se por vossas obras “vos conhecem”. - É o bom odor de Cristo. - Além disso, trabalhando sempre exclusivamente por Ele, alegrai-vos de que se cumpram aquelas palavras da Escritura: “Que, vendo as vossas boas obras, glorifiquem o vosso Pai que está nos céus”."}, {"n": 843, "chapter": "Tática", "text": "“Non manifeste, sed quasi in occulto” - não com publicidade, mas ocultamente. Assim vai Jesus à festa dos Tabernáculos. Assim irá, a caminho de Emaús, com Cléofas e seu companheiro. - Assim O vê, ressuscitado, Maria de Magdala. E assim - “non tamen cognoverunt discipuli quia Jesus est”, os discípulos não perceberam que era Ele -, assim foi à pesca milagrosa que nos conta São João. E mais oculto ainda, por Amor aos homens, está na Hóstia."}, {"n": 844, "chapter": "Tática", "text": "Levantar magníficos edifícios?... Construir palácios suntuosos?... Que os levantem... Que os construam... Almas! - Vivificar almas..., para aqueles edifícios... e para estes palácios! Que belas casas nos preparam!"}, {"n": 845, "chapter": "Tática", "text": "Como me fizeste rir e como me fizeste pensar quando me disseste esta verdade de senso comum: - Eu... espeto sempre os pregos pela ponta."}, {"n": 846, "chapter": "Tática", "text": "Certo: fazes melhor trabalho com essa conversa familiar ou com aquela confidência isolada, do que discursando - espetáculo, espetáculo! - em lugar público, perante milhares de pessoas. Contudo, quando for preciso discursar, discursa."}, {"n": 847, "chapter": "Tática", "text": "O esforço de cada um de vós, isolado, é ineficaz. - Se vos unir a caridade de Cristo, ficareis maravilhados com a eficácia."}, {"n": 848, "chapter": "Tática", "text": "Queres ser mártir. - Eu te indicarei um martírio ao alcance da mão: ser apóstolo e não te dizeres apóstolo; ser missionário - com missão - e não te dizeres missionário; ser homem de Deus e pareceres homem do mundo. Passar oculto!"}, {"n": 849, "chapter": "Tática", "text": "Essa é boa! Mete-o a ridículo! - Diz-lhe que está fora de moda; parece mentira que ainda haja gente obstinada em pensar que é bom meio de locomoção a diligência... - Isto, para os que renovam voltairianismos de peruca empoada, ou liberalismos desacreditados do século XIX."}, {"n": 850, "chapter": "Tática", "text": "Que conversas! Que baixeza e que... nojo! - E tens de conviver com eles, no escritório, na universidade, no consultório..., no mundo. Se pedes por favor que se calem, ficam caçoando de ti. - Se fazes má cara, insistem. - Se te vais embora, continuam. A solução é esta: primeiro, pedir a Deus por eles e desagravar; depois..., ir de frente, varonilmente, e empregar “o apostolado dos palavrões”. - Quando te vir, hei de dizer-te ao ouvido um bom repertório."}, {"n": 851, "chapter": "Tática", "text": "Orientemos as “providenciais imprudências” da juventude."}, {"n": 852, "chapter": "Infância espiritual", "text": "Procura conhecer a “via de infância espiritual”, sem “te forçares” a seguir esse caminho. - Deixa agir o Espírito Santo."}, {"n": 853, "chapter": "Infância espiritual", "text": "Caminho de infância. - Abandono. - Infância espiritual. - Nada disto é ingenuidade, mas forte e sólida vida cristã."}, {"n": 854, "chapter": "Infância espiritual", "text": "Na vida espiritual de infância, as coisas que as “crianças” dizem ou fazem nunca são criancices nem puerilidades."}, {"n": 855, "chapter": "Infância espiritual", "text": "A infância espiritual não é idiotice espiritual nem moleza piegas; é caminho sensato e vigoroso que, por sua difícil facilidade, a alma tem que empreender e prosseguir, guiada pela mão de Deus."}, {"n": 856, "chapter": "Infância espiritual", "text": "A infância espiritual exige a submissão do entendimento, mais difícil que a submissão da vontade. - Para submeter o entendimento, precisa-se, além da graça de Deus, de um contínuo exercício da vontade, que se nega ao entendimento como se nega à carne, uma e outra vez e sempre; dando-se como conseqflência o paradoxo de que quem segue o “pequeno caminho de infância”, para se tornar criança, necessita de robustecer e virilizar a sua vontade."}, {"n": 857, "chapter": "Infância espiritual", "text": "Ser pequeno. As grandes audácias são sempre das crianças. - Quem pede... a lua? - Quem não repara nos perigos, ao tratar de conseguir o seu desejo? “Colocai” numa criança “dessas” muita graça de Deus, o desejo de fazer a Vontade dEle, muito amor a Jesus, toda a ciência humana que a sua capacidade lhe permita adquirir... e tereis retratado o caráter dos apóstolos de hoje, tal como indubitavelmente Deus os quer."}, {"n": 858, "chapter": "Infância espiritual", "text": "Faz-te criança. - Ainda mais. - Mas não fiques na “idade do buço”. Já viste coisa mais ridícula do que um moleque bancando “o homem” ou um homem “amolecado”? Criança para com Deus; e, por conseqflência, homem muito viril em tudo o mais. - Ah!... e larga essas manhas de cachorrinho de colo."}, {"n": 859, "chapter": "Infância espiritual", "text": "Às vezes, sentimo-nos inclinados a fazer pequenas criancices. - São pequenas obras-primas diante de Deus, e, enquanto não se introduzir a rotina, serão fecundas sem dúvida essas obras, como fecundo é sempre o Amor."}, {"n": 860, "chapter": "Infância espiritual", "text": "Diante de Deus, que é Eterno, tu és uma criança menor do que, diante de ti, um garotinho de dois anos. E, além de criança, és filho de Deus. - Não o esqueças."}, {"n": 861, "chapter": "Infância espiritual", "text": "Menino: inflama-te em desejos de reparar as enormidades da tua vida de adulto."}, {"n": 862, "chapter": "Infância espiritual", "text": "Menino bobo: no dia em que ocultares alguma coisa da tua alma ao Diretor, deixaste de ser criança, porque perdeste a simplicidade."}, {"n": 863, "chapter": "Infância espiritual", "text": "Menino: quando o fores de verdade, serás onipotente."}, {"n": 864, "chapter": "Infância espiritual", "text": "Sendo crianças, não tereis mágoas; as crianças esquecem depressa os desgostos para voltarem aos seus divertimentos habituais. - Por isso, com esse “abandono”, não tereis que vos preocupar, pois descansareis no Pai."}, {"n": 865, "chapter": "Infância espiritual", "text": "Menino: oferece-Lhe todos os dias... até as tuas fragilidades."}, {"n": 866, "chapter": "Infância espiritual", "text": "Menino bom: oferece-Lhe o trabalho daqueles operários que não O conhecem; oferece-Lhe a alegria natural dos pobres garotinhos que freqflentam as escolas malvadas..."}, {"n": 867, "chapter": "Infância espiritual", "text": "As crianças não têm nada de seu; tudo é de seus pais... E teu Pai sabe sempre muito bem como administra o patrimônio."}, {"n": 868, "chapter": "Infância espiritual", "text": "Faz-te pequeno, bem pequeno. - Não tenhas mais de dois anos, ou três quando muito. - Porque os meninos mais velhos são uns espertalhões que já querem enganar os seus pais com mentiras inverossímeis. É que têm a maldade, o “fomes”"}, {"n": 869, "chapter": "Infância espiritual", "text": "Mas, menino!, por que te empenhas em andar com pernas de pau?"}, {"n": 870, "chapter": "Infância espiritual", "text": "Não queiras ser grande. - Criança, criança sempre, ainda que morras de velho. Quando uma criança tropeça e cai, ninguém estranha...; seu pai se apressa a levantá-la. Quando quem tropeça e cai é adulto, o primeiro movimento é de riso. - Às vezes, passado esse primeiro ímpeto, o ridículo cede o lugar à piedade. - Mas os adultos têm que se levantar sozinhos. A tua triste experiência quotidiana está cheia de tropeços e quedas. Que seria de ti se não fosses cada vez mais criança? Não queiras ser grande, mas menino. Para que, quando tropeçares, te levante a mão de teu Pai-Deus."}, {"n": 871, "chapter": "Infância espiritual", "text": "Menino: o abandono exige docilidade."}, {"n": 872, "chapter": "Infância espiritual", "text": "Não te esqueças de que o Senhor tem predileção pelas crianças e pelos que se fazem como elas."}, {"n": 873, "chapter": "Infância espiritual", "text": "Paradoxos de uma pequena alma. - Quando Jesus te enviar acontecimentos que o mundo chama bons, chora em teu coração, considerando a bondade dEle e a tua malícia; quando Jesus te enviar acontecimentos que o mundo qualifica de ruins, alegra-te em teu coração, porque Ele te dá sempre o que convém, e então é o belo momento de amar a Cruz."}, {"n": 874, "chapter": "Infância espiritual", "text": "Menino audaz, grita: - Que amor o de Teresa! - Que zelo o de Xavier! - Que homem tão admirável São Paulo! - Ah, Jesus, pois eu... Te amo mais do que Paulo, Xavier e Teresa!"}, {"n": 875, "chapter": "Vida de infância", "text": "Não te esqueças, menino bobo, de que o Amor te fez onipotente."}, {"n": 876, "chapter": "Vida de infância", "text": "Menino: não percas o teu amoroso costume de “assaltar” Sacrários."}, {"n": 877, "chapter": "Vida de infância", "text": "Quando te chamo “menino bom”, não penses que te imagino encolhido, acanhado. - Se não és varonil e... normal, em lugar de seres um apóstolo, serás uma caricatura que provoca riso."}, {"n": 878, "chapter": "Vida de infância", "text": "Menino bom, diz a Jesus muitas vezes ao dia: eu Te amo, eu Te amo, eu Te amo..."}, {"n": 879, "chapter": "Vida de infância", "text": "Quando te afligirem as tuas misérias, não fiques triste. - Gloria-te nas tuas fraquezas, como São Paulo, porque às crianças é permitido, sem temor do ridículo, imitar os grandes."}, {"n": 880, "chapter": "Vida de infância", "text": "Que as tuas faltas e imperfeições, e mesmo as tuas quedas graves, não te afastem de Deus. - A criança débil, se é sensata, procura estar perto de seu pai."}, {"n": 881, "chapter": "Vida de infância", "text": "Não te preocupes se te aborreces quando fazes essas pequenas coisas que Ele te pede. - Ainda chegarás a sorrir... Não vês com que pouca vontade dá o menino simples a seu pai, que o experimenta, a guloseima que tinha nas mãos? - Mas dá; venceu o amor."}, {"n": 882, "chapter": "Vida de infância", "text": "Quando queres fazer as coisas bem, muito bem, é que as fazes pior. - Humilha-te diante de Jesus, dizendo-lhe: - Viste como faço tudo mal? Pois olha: se não me ajudas muito, ainda farei pior! Tem compaixão do teu menino; olha que quero escrever todos os dias uma página grande no livro da minha vida... Mas sou tão rude!, que se o Mestre não me pega na mão, em vez de letras esbeltas, saem da minha pena coisas tortas e borrões, que não se podem mostrar a ninguém. De agora em diante, Jesus, escreveremos sempre juntos os dois."}, {"n": 883, "chapter": "Vida de infância", "text": "Reconheço a minha rudeza, meu Amor, que é tanta..., tanta, que até quando quero acariciar, machuco. - Suaviza as maneiras da minha alma; dá-me, quero que me dês, dentro da firme virilidade da vida de infância, aquela delicadeza e meiguice que as crianças têm para tratar, com íntima efusão de amor, os seus pais."}, {"n": 884, "chapter": "Vida de infância", "text": "Estás cheio de misérias. - Cada dia as vês mais claramente. - Mas que não te assustem. - Ele bem sabe que não podes dar mais fruto. As tuas quedas involuntárias - quedas de criança - fazem com que teu Pai - Deus tenha mais cuidado, e que tua Mãe, Maria, não te largue da sua mão amorosa. Aproveita-te disso e, quando diariamente o Senhor te levantar do chão, abraça-O com todas as tuas forças e encosta a tua cabeça miserável no seu peito aberto, para que acabem de enlouquecer-te os latejos do seu Coração amabilíssimo."}, {"n": 885, "chapter": "Vida de infância", "text": "Uma picadela. - E outra. E outra. - Agflenta-as, faz favor! Não vês que és tão pequeno que só podes oferecer na tua vida - no teu pequeno caminho - essas pequenas cruzes? Além disso, repara: uma cruz sobre outra - uma picadela... e outra..., que grande montão! No fim, menino, soubeste fazer uma coisa muito grande: Amar."}, {"n": 886, "chapter": "Vida de infância", "text": "Quando uma alma de criança apresenta ao Senhor os seus desejos de indulto, deve ter a certeza de que em breve verá cumpridos esses desejos. Jesus arrancará da alma a cauda imunda que arrasta pelas suas misérias passadas; tirará o peso morto, resto de todas as impurezas, que a faz prender-se ao chão; jogará para longe do menino todo o lastro terreno do seu coração, para que suba até à Majestade de Deus, a fundir-se na labareda viva de Amor que Ele é."}, {"n": 887, "chapter": "Vida de infância", "text": "Esse desânimo que te produzem as tuas faltas de generosidade, as tuas quedas, os teus retrocessos - talvez só aparentes -, dá-te muitas vezes a impressão de teres quebrado alguma coisa de grande valor - a tua santificação. Não te aflijas; aplica à vida sobrenatural o modo sensato que, para resolver conflito semelhante, empregam as crianças simples. Quebraram - por fragilidade, quase sempre - um objeto muito estimado de seu pai. - Sentem-no, e talvez chorem, mas... vão desabafar a sua mágoa com o dono da coisa inutilizada pela sua inépcia... E o pai esquece o valor - ainda que seja grande - do objeto destruído e, cheio de ternura, não só perdoa, mas até consola e anima o garotinho. - Aprende."}, {"n": 888, "chapter": "Vida de infância", "text": "Que a vossa oração seja viril. - Ser criança não é ser efeminado."}, {"n": 889, "chapter": "Vida de infância", "text": "Para quem ama Jesus, a oração, mesmo a oração com aridez, é a doçura que põe sempre fim às mágoas; vai-se à oração com a ânsia com que o menino vai ao açúcar, depois de tomar o remédio amargo."}, {"n": 890, "chapter": "Vida de infância", "text": "Sei que te distrais na oração. - Procura evitar as distrações, mas não te preocupes se, apesar de tudo, continuas distraído. Não vês como, na vida natural, até as crianças mais sossegadas se entretêm e divertem com o que as rodeia, sem atender muitas vezes às palavras de seu pai? - Isso não implica falta de amor nem de respeito; é a miséria e pequenez própria do filho. Pois olha: tu és uma criança diante de Deus."}, {"n": 891, "chapter": "Vida de infância", "text": "Quando estiveres em oração, faz circular as idéias inoportunas, como se fosses um guarda de trânsito. Para isso tens a vontade enérgica que é própria da tua vida de criança. - Detém, de vez em quando, algum desses pensamentos para pedir pelos protagonistas da recordação inoportuna. - E depois, para a frente!... Assim, até chegar a hora. - Quando a tua oração, feita deste jeito, te parecer inútil, alegra-te e acredita que soubeste agradar a Jesus."}, {"n": 892, "chapter": "Vida de infância", "text": "Como é bom ser criança! - Quando um homem solicita um favor, é preciso que ao requerimento junte a folha dos seus méritos. Quando quem pede é um menininho, como as crianças não têm méritos, basta-lhe dizer: - Sou filho de Fulano. Ah, Senhor - diz-Lhe com toda a tua alma! -, eu sou... filho de Deus."}, {"n": 893, "chapter": "Vida de infância", "text": "Perseverar. - Uma criança que bate a uma porta, bate uma e duas vezes, e muitas vezes..., com força e demoradamente, sem se envergonhar! E quem vai abrir, ofendido, é desarmado pela simplicidade da criaturinha inoportuna... - Assim tu com Deus."}, {"n": 894, "chapter": "Vida de infância", "text": "Já viste como agradecem as crianças? - Imita-as dizendo, como elas, a Jesus, diante do favorável e diante do adverso: “Que bom que és! Que bom!...” Esta frase, bem sentida, é caminho de infância, que te levará à paz, com peso e medida de risos e prantos, e sem peso e medida de Amor."}, {"n": 895, "chapter": "Vida de infância", "text": "O trabalho esgota o teu corpo, e não consegues fazer oração. - Estás sempre na presença de teu Pai. Se não falas com Ele, olha-O de vez em quando, como uma criancinha..., e Ele te sorrirá."}, {"n": 896, "chapter": "Vida de infância", "text": "Dizes que na ação de graças, depois da Comunhão, a primeira coisa que te vem aos lábios, sem o poderes evitar, é a petição: - Jesus, dá-me isto!; Jesus, aquela alma; Jesus, aquela atividade... Não te preocupes nem te violentes; não vês que, sendo o pai bom e o filho criança simples e audaz, o garotinho mete as mãos no bolso do pai, à procura de guloseimas, antes de lhe dar o beijo de boas-vindas? - Então..."}, {"n": 897, "chapter": "Vida de infância", "text": "A nossa vontade, com a graça, é onipotente diante de Deus. - Assim, à vista de tantas ofensas ao Senhor, se dissermos a Jesus, com vontade eficaz, indo no ônibus por exemplo: “Meu Deus, quereria fazer tantos atos de amor e desagravo quantas as voltas de cada roda deste carro”, naquele mesmo instante, diante de Jesus, tê-Lo-emos realmente amado e desagravado conforme o nosso desejo. Esta “ingenuidade” não está fora da infância espiritual; é o eterno diálogo entre a criança inocente e o pai, doido por seu filho: - Quanto me queres?... Fala! - E o garotinho diz, marcando as sílabas: - Mui-tos mi-lhões!"}, {"n": 898, "chapter": "Vida de infância", "text": "Se tens “vida de infância”, por seres criança, hás de ser espiritualmente guloso. - Lembra-te, como os da tua idade, das coisas boas que a tua Mãe tem guardadas. E isto, muitas vezes ao dia. - É uma questão de segundos: Maria... Jesus... o Sacrário... a Comunhão... o Amor... o sofrimento... as benditas almas do purgatório... os que lutam: o Papa, os sacerdotes... os fiéis... a tua alma... as almas dos teus... os Anjos da Guarda... os pecadores..."}, {"n": 899, "chapter": "Vida de infância", "text": "Como te custa essa pequena mortificação! Estás lutando. É como se te dissessem: - Por que hás de ser tão fiel ao plano de vida, ao relógio? - Olha: já reparaste com que facilidade são enganados os garotinhos? - Não querem tomar o remédio amargo, mas... “vamos lá!” - dizem-lhes -, “esta colherzinha pelo papai; outra pela vovó...” E assim até tomarem toda a dose. O mesmo deves tu fazer: quinze minutos mais de cilício pelas almas do purgatório; cinco minutos mais pelos teus pais; outros cinco pelos teus irmãos de apostolado... Até passar o tempo marcado no teu horário. Feita deste modo a tua mortificação, quanto não vale!"}, {"n": 900, "chapter": "Vida de infância", "text": "Não estás só. - Aceita com alegria a tribulação. - Não sentes na tua mão, pobre criança, a mão da tua Mãe: é verdade. - Mas... não tens visto as mães da terra, de braços estendidos, seguirem os seus meninos quando se aventuram, temerosos, a dar os primeiros passos sem ajuda de ninguém? - Não estás só; Maria está junto de ti."}, {"n": 901, "chapter": "Vida de infância", "text": "Jesus: nunca Te pagarei, ainda que morra de Amor, a graça que tens esbanjado para me tornares pequeno."}, {"n": 902, "chapter": "Chamamento", "text": "Por que não te entregas a Deus de uma vez..., de verdade..., agora!?"}, {"n": 903, "chapter": "Chamamento", "text": "Se vês claramente o teu caminho, segue-o. - Por que não repeles a covardia que te detém?"}, {"n": 904, "chapter": "Chamamento", "text": "“Ide, pregai o Evangelho... Eu estarei convosco...” - Isto disse Jesus... e disse-o a ti."}, {"n": 905, "chapter": "Chamamento", "text": "O fervor patriótico - louvável - leva muitos homens a fazer da sua vida um “serviço”, uma “milícia”. - Não esqueças que Cristo tem também “milícias” e gente escolhida ao seu “serviço”."}, {"n": 906, "chapter": "Chamamento", "text": "“Et regni ejus non erit finis”. - O seu Reino não terá fim! Não te dá alegria trabalhar por um reinado assim?"}, {"n": 907, "chapter": "Chamamento", "text": "“Nesciebatis quia in his quae Patris mei sunt oportet me esse?” - Não sabíeis que Eu devo ocupar-me nas coisas que dizem respeito ao serviço de meu Pai? Resposta de Jesus adolescente. E resposta a uma mãe como a sua Mãe, que há três dias anda à sua procura, julgando-O perdido. - Resposta que tem por complemento aquelas palavras de Cristo que São Mateus transcreve: “Quem ama seu pai ou sua mãe mais do que a Mim, não é digno de Mim”."}, {"n": 908, "chapter": "Chamamento", "text": "É demasiada a tua simplicidade quando medes o valor das obras de apostolado por aquilo que delas se vê. - Com esse critério, terias de preferir um monte de carvão a um punhado de diamantes."}, {"n": 909, "chapter": "Chamamento", "text": "Agora que te entregaste, pede-Lhe uma vida nova, um “novo cunho”, para dar firmeza à autenticidade da tua missão de homem de Deus."}, {"n": 910, "chapter": "Chamamento", "text": "Isso - o teu ideal, a tua vocação - é... uma loucura. - E os outros - os teus amigos, os teus irmãos -, uns loucos... Não tens ouvido, por vezes, esse grito bem dentro de ti? - Responde, com decisão, que agradeces a Deus a honra de pertencer ao “manicômio”."}, {"n": 911, "chapter": "Chamamento", "text": "Escreves-me: “O desejo tão grande que todos temos de que “isto” avance e se dilate, parece que vai converter-se em impaciência. Quando salta, quando irrompe..., quando veremos nosso o mundo?” E acrescentas: “O desejo não será inútil se o empregarmos em “coagir”, em importunar o Senhor; assim teremos ganho um tempo formidável!”"}, {"n": 912, "chapter": "Chamamento", "text": "Compreendo o teu sofrimento quando, no meio da tua forçosa inatividade, consideras a tarefa que está por fazer. - Não te cabe o coração no planeta, e tem de se amoldar... a um minúsculo trabalho burocrático. Mas para quando deixamos o “fiat”"}, {"n": 913, "chapter": "Chamamento", "text": "Não duvides: a tua vocação é a maior graça que o Senhor te pôde conceder. - Agradece-Lhe."}, {"n": 914, "chapter": "Chamamento", "text": "Que pena causam essas multidões - altas e baixas e do meio - sem ideal! - Dão a impressão de não saber que têm alma; são... manada, rebanho..., vara. Jesus: nós, com a ajuda do teu Amor Misericordioso, converteremos a manada em mesnada, o rebanho em exército..., e da vara extrairemos, purificados, os que não mais quiserem ser imundos."}, {"n": 915, "chapter": "Chamamento", "text": "As obras de Deus não são alavanca nem degrau."}, {"n": 916, "chapter": "Chamamento", "text": "Senhor, torna-nos loucos, com uma loucura contagiosa que atraia muitos ao teu apostolado."}, {"n": 917, "chapter": "Chamamento", "text": "“Nonne cor nostrum ardens erat in nobis dum loqueretur in via?” - Não ardia o nosso coração dentro de nós, enquanto nos falava pelo caminho? Se és apóstolo, estas palavras dos discípulos de Emaús deviam sair espontaneamente dos lábios dos teus companheiros de profissão, depois de te encontrarem no caminho da sua vida."}, {"n": 918, "chapter": "Chamamento", "text": "Vai ao apostolado disposto a dar tudo, e não a procurar algo de terreno."}, {"n": 919, "chapter": "Chamamento", "text": "Querendo-te apóstolo, o Senhor te lembrou, para que nunca o esqueças, que és “filho de Deus”."}, {"n": 920, "chapter": "Chamamento", "text": "Cada um de vós deve procurar ser um apóstolo de apóstolos."}, {"n": 921, "chapter": "Chamamento", "text": "Tu és sal, alma de apóstolo. - “Bonum est sal” - o sal é bom, lê-se no Santo Evangelho; “si autem sal evanuerit” - mas se o sal se desvirtua..., de nada serve, nem para a terra, nem para o esterco; joga-se fora como inútil. Tu és sal, alma de apóstolo. - Mas se te desvirtuas..."}, {"n": 922, "chapter": "Chamamento", "text": "Meu filho: se amas o teu apostolado, fica certo de que amas a Deus."}, {"n": 923, "chapter": "Chamamento", "text": "No dia em que “sentires” bem o teu apostolado, esse apostolado será para ti uma couraça em que se embotarão todas as ciladas dos teus inimigos da terra e do inferno."}, {"n": 924, "chapter": "Chamamento", "text": "Pede sempre a tua perseverança e a dos teus companheiros de apostolado, porque o nosso adversário, o demônio, sabe perfeitamente que sois os seus grandes inimigos..., e uma queda em vossas fileiras, quanto o satisfaz!"}, {"n": 925, "chapter": "Chamamento", "text": "Assim como os bons religiosos se empenham em conhecer a maneira como viviam os primeiros da sua ordem ou congregação, para se ajustarem àquela conduta, assim tu - cavalheiro cristão - procura conhecer e imitar a vida dos discípulos de Jesus, que conviveram com Pedro e com Paulo e com João, e quase foram testemunhas da Morte e da Ressurreição do Mestre."}, {"n": 926, "chapter": "Chamamento", "text": "Perguntas-me..., e te respondo: - A tua perfeição consiste em viveres perfeitamente naquele lugar, ofício e grau em que Deus, por meio da autoridade, te colocar."}, {"n": 927, "chapter": "Chamamento", "text": "Orai uns pelos outros. - Está fraquejando aquele?... - E aquele outro?... Continuai orando, sem perder a paz. - Vão-se embora? Perdem-se?... O Senhor vos tem contados desde a eternidade!"}, {"n": 928, "chapter": "Chamamento", "text": "Tens razão. - Do alto do cume - escreves-me -, em tudo o que se divisa (e é um raio de muitos quilômetros), não se enxerga uma única planície; por detrás de cada montanha, outra ainda. Se em algum lugar a paisagem parece suavizar-se, mal se levanta o nevoeiro, aparece uma serra que estava oculta. Assim é, assim tem que ser o horizonte do teu apostolado: é preciso atravessar o mundo. - Mas não há caminhos feitos para vós... Tereis de fazê-los, através das montanhas, à força das vossas passadas."}, {"n": 929, "chapter": "O Apóstolo", "text": "A Cruz sobre o teu peito?... - Está bem. Mas... a Cruz sobre os teus ombros, a Cruz na tua carne, a Cruz na tua inteligência. - Assim viverás por Cristo, com Cristo e em Cristo; só assim serás apóstolo."}, {"n": 930, "chapter": "O Apóstolo", "text": "Alma de apóstolo: primeiro, tu. - Disse o Senhor por São Mateus: “Muitos me dirão no dia do juízo: Senhor!, Senhor!, não profetizamos nós em teu nome, e em teu nome não expulsamos os demônios, e em teu nome não fizemos muitos milagres? Então Eu lhes direi: Nunca vos conheci por meus; apartai-vos de mim, obreiros da iniqflidade”. Não suceda - diz São Paulo - que, tendo pregado aos outros, venha eu a ser reprovado."}, {"n": 931, "chapter": "O Apóstolo", "text": "O gênio militar de Santo Inácio apresenta-nos o demônio chamando inúmeros diabos e espalhando-os pelos países, estados, cidades e aldeias, depois de lhes ter feito “um sermão” em que os admoesta a lançar ferros e cadeias, não deixando ninguém em particular sem algemas... Disseste-me que querias ser líder; e... para que serve um líder algemado?"}, {"n": 932, "chapter": "O Apóstolo", "text": "Repara: os apóstolos, com todas as suas misérias patentes e inegáveis, eram sinceros, simples..., transparentes. Tu também tens misérias patentes e inegáveis. - Oxalá não te falte simplicidade."}, {"n": 933, "chapter": "O Apóstolo", "text": "Contam de uma alma que, ao dizer ao Senhor na oração: “Jesus, eu Te amo”, ouviu esta resposta do Céu: “Obras é que são amores, não as boas palavras”. Pensa se por acaso não merecerás tu também esta carinhosa censura."}, {"n": 934, "chapter": "O Apóstolo", "text": "O zelo é uma loucura divina de apóstolo, que te desejo, e que tem estes sintomas: fome de intimidade com o Mestre; preocupação constante pelas almas; perseverança que nada faz desfalecer."}, {"n": 935, "chapter": "O Apóstolo", "text": "Não fiques dormindo sobre os louros. - Se, humanamente falando, essa posição já é incômoda e pouco galharda, quanto mais quando os louros - como neste caso - não forem teus, mas de Deus!"}, {"n": 936, "chapter": "O Apóstolo", "text": "No apostolado, estás para submeter-te, para aniquilar-te; não para impor o teu critério pessoal."}, {"n": 937, "chapter": "O Apóstolo", "text": "Nunca sejais homens ou mulheres de ação longa e oração curta."}, {"n": 938, "chapter": "O Apóstolo", "text": "Procura viver de tal maneira que saibas privar-te voluntariamente da comodidade e bem-estar que acharias mal nos costumes de outro homem de Deus. Olha que és o grão de trigo de que nos fala o Evangelho. - Se não te enterras e morres, não haverá fruto."}, {"n": 939, "chapter": "O Apóstolo", "text": "Sede homens e mulheres do mundo, mas não sejais homens ou mulheres mundanos."}, {"n": 940, "chapter": "O Apóstolo", "text": "Não esqueças que a unidade é sintoma de vida: desunir-se é putrefação, sinal certo de ser um cadáver."}, {"n": 941, "chapter": "O Apóstolo", "text": "Obedecer..., caminho seguro. - Obedecer cegamente ao superior..., caminho de santidade. - Obedecer no teu apostolado..., o único caminho, porque, numa obra de Deus, o espírito há de ser este: obedecer ou ir-se embora."}, {"n": 942, "chapter": "O Apóstolo", "text": "Lembra-te, meu filho, de que não és somente uma alma que se une a outras almas para fazer uma coisa boa. Isso é muito..., mas é pouco. - És o Apóstolo que cumpre um mandato imperativo de Cristo."}, {"n": 943, "chapter": "O Apóstolo", "text": "Oxalá que, convivendo contigo, não se possa exclamar o que, com bastante razão, gritava determinada pessoa: “De honrados estou até aqui...” E tocava no cocuruto da cabeça."}, {"n": 944, "chapter": "O Apóstolo", "text": "Tens de comunicar a outros Amor de Deus e zelo pelas almas, para que esses, por sua vez, peguem fogo a muitos mais que estão num terceiro plano, e cada um destes últimos aos seus companheiros de profissão. De quantas calorias espirituais não precisas! - E que responsabilidade tão grande, se esfrias! E (nem o quero pensar) que crime tão horroroso, se desses mau exemplo!"}, {"n": 945, "chapter": "O Apóstolo", "text": "É má disposição ouvir a palavra de Deus com espírito crítico."}, {"n": 946, "chapter": "O Apóstolo", "text": "Se quereis entregar-vos a Deus no mundo, mais do que sábios (quanto a elas, não é preciso serem sábias; basta que sejam sensatas), tendes que ser espirituais, muito unidos ao Senhor pela oração; deveis trazer um manto invisível que cubra todos e cada um dos vossos sentidos e potências - orar, orar e orar; expiar, expiar e expiar."}, {"n": 947, "chapter": "O Apóstolo", "text": "Ficavas espantado por eu aprovar a falta de “uniformidade” nesse apostolado em que trabalhas. E te disse: Unidade e variedade. - Deveis ser tão diferentes como diferentes são os santos do Céu, que têm cada um as suas notas pessoais e especialíssimas. - E também tão parecidos uns com os outros como os santos, que não seriam santos se cada um deles não se tivesse identificado com Cristo."}, {"n": 948, "chapter": "O Apóstolo", "text": "Tu, filho predileto de Deus, sente e vive a fraternidade, mas sem familiaridades."}, {"n": 949, "chapter": "O Apóstolo", "text": "Aspirar a ter cargos nas obras de apostolado é coisa inútil nesta vida, e para a outra Vida é um perigo. Se Deus o quiser, hão de chamar-te. - E então deves aceitar. - Mas não esqueças que em todos os lugares podes e deves santificar-te, porque para isso vieste."}, {"n": 950, "chapter": "O Apóstolo", "text": "Se pensas que, ao trabalhar por Cristo, os cargos são algo mais do que cargas, quantas amarguras te esperam!"}, {"n": 951, "chapter": "O Apóstolo", "text": "Estar à frente de uma obra de apostolado é o mesmo que estar disposto a sofrer tudo de todos, com infinita caridade."}, {"n": 952, "chapter": "O Apóstolo", "text": "No trabalho apostólico, não se pode perdoar a desobediência nem a duplicidade. - Tem em conta que simplicidade não é imprudência nem indiscrição."}, {"n": 953, "chapter": "O Apóstolo", "text": "Tens obrigação de pedir e sacrificar-te pela pessoa e intenções de quem dirige a tua obra de apostolado. - Se és remisso no cumprimento deste dever, fazes-me pensar que te falta entusiasmo pelo teu caminho."}, {"n": 954, "chapter": "O Apóstolo", "text": "Leva ao extremo o respeito pelo superior quando te consultar e tiveres de contradizer as suas opiniões. - E nunca o contradigas diante dos que lhe estão sujeitos, mesmo que não tenha razão."}, {"n": 955, "chapter": "O Apóstolo", "text": "Na tua obra de apostolado, não temas os inimigos de fora, por maior que seja o seu poder. - Este é o inimigo terrível: a tua falta de “filiação” e a tua falta de “fraternidade”."}, {"n": 956, "chapter": "O Apóstolo", "text": "Compreendo bem que te divirtam os desprezos - mesmo que venham de inimigos poderosos -, desde que sintas a união com o teu Deus e com os teus irmãos de apostolado. - Para ti, que importância tem isso?"}, {"n": 957, "chapter": "O Apóstolo", "text": "Comparo com freqflência o trabalho de apostolado a uma máquina: rodas dentadas, êmbolos, válvulas, parafusos... Pois bem, a caridade - a tua caridade - é o lubrificante."}, {"n": 958, "chapter": "O Apóstolo", "text": "Acaba com esse “ar de auto-suficiência” que isola da tua as almas que se aproximam de ti. - Procura escutar. E fala com simplicidade. Só assim crescerá em extensão e fecundidade o teu trabalho de apóstolo."}, {"n": 959, "chapter": "O Apóstolo", "text": "O desprezo e a perseguição são benditas provas de predileção divina, mas não há prova e sinal de predileção mais belo do que este: passar oculto."}, {"n": 960, "chapter": "O Apostolado", "text": "Assim como o rumor do oceano se compõe do ruído de cada uma das ondas, assim a santidade do vosso apostolado se compõe das virtudes pessoais de cada um de vós."}, {"n": 961, "chapter": "O Apostolado", "text": "É preciso que sejas “homem de Deus”, homem de vida interior, homem de oração e de sacrifício. - O teu apostolado deve ser uma superabundância da tua vida “para dentro”."}, {"n": 962, "chapter": "O Apostolado", "text": "Unidade. - Unidade e sujeição. Para que quero eu as peças soltas de um relógio, mesmo que sejam primorosas, se não me marcam as horas?"}, {"n": 963, "chapter": "O Apostolado", "text": "Não façais “igrejinhas” dentro do vosso trabalho. - Seria tornar mesquinhos os trabalhos de apostolado, porque, se a “igrejinha” chega - por fim! - ao governo de uma obra universal..., com que rapidez se transforma a obra universal em igrejinha!"}, {"n": 964, "chapter": "O Apostolado", "text": "Dizias-me, com desconsolo: - Há muitos caminhos! - Tem que haver: para que todas as almas possam encontrar o seu, nessa variedade admirável. Confusionismo? - Escolhe de uma vez para sempre; e a confusão se converterá em certeza."}, {"n": 965, "chapter": "O Apostolado", "text": "Alegra-te quando vires que outros trabalham em bons campos de apostolado. - E pede, para eles, graça de Deus abundante e correspondência a essa graça. Depois, tu... segue o teu caminho; convence-te de que não tens outro."}, {"n": 966, "chapter": "O Apostolado", "text": "É mau espírito o teu, se te dói que ou-tros trabalhem por Cristo sem contarem com o teu apostolado. - Lembra-te desta passagem de São Marcos: “Mestre, vimos um que em teu nome expulsava os demônios, e que não está conosco; e nós lho proibimos. Disse Jesus: Não lho proibais, pois ninguém que faça um milagre em meu nome falará depois mal de mim. Quem não está contra vós está convosco”."}, {"n": 967, "chapter": "O Apostolado", "text": "É inútil que te afadigues em tantas obras exteriores, se te falta Amor. - É como costurar com agulha sem linha. Que pena se, afinal, tivesses feito o “teu” apostolado, e não o “seu” Apostolado!"}, {"n": 968, "chapter": "O Apostolado", "text": "Com alegria te abençôo, meu filho, por essa fé na tua missão de apóstolo que te levou a escrever: “Não há dúvida; o futuro é garantido, apesar de nós talvez. Mas é preciso que formemos uma só coisa com a Cabeça - “ut omnes unum sint”! -, pela oração e pelo sacrifício”."}, {"n": 969, "chapter": "O Apostolado", "text": "Os que, deixando a ação para os outros, oram e sofrem, não brilharão aqui, mas como luzirá a sua coroa no Reino da Vida! - Bendito seja o “apostolado do sofrimento”!"}, {"n": 970, "chapter": "O Apostolado", "text": "É verdade que chamei o teu apostolado discreto de “silenciosa e operativa missão”. - E não tenho nada que retificar."}, {"n": 971, "chapter": "O Apostolado", "text": "Parece-me tão bem a tua devoção pelos primeiros cristãos, que farei o possível por fomentá-la, para que pratiques - como eles -, cada dia com mais entusiasmo, esse Apostolado eficaz de discrição e de confidência."}, {"n": 972, "chapter": "O Apostolado", "text": "Quando puseres em prática o teu “apostolado de discrição e de confidência”, não me digas que não sabes o que hás de dizer. - Porque te direi com o salmo: “Dominus dabit verbum evangelizantibus virtute multa” - o Senhor põe na boca dos seus apóstolos palavras cheias de eficácia."}, {"n": 973, "chapter": "O Apostolado", "text": "Essas palavras que tão a tempo deixas cair ao ouvido do amigo que vacila; a conversa orientadora que soubeste provocar oportunamente; e o conselho profissional que melhora o seu trabalho universitário; e a discreta indiscrição que te faz sugerir-lhe imprevistos horizontes de zelo... Tudo isso é “apostolado da confidência”."}, {"n": 974, "chapter": "O Apostolado", "text": "“Apostolado do almoço”. É a velha hospitalidade dos Patriarcas, com o calor fraternal de Betânia. - Quando se pratica, parece que se entrevê Jesus presidindo, como em casa de Lázaro."}, {"n": 975, "chapter": "O Apostolado", "text": "Urge recristianizar as festas e os costumes populares. - Urge evitar que os espetáculos públicos se vejam nesta disjuntiva: ou piegas ou pagãos. Pede ao Senhor que haja quem trabalhe nessa tarefa urgente, a que podemos chamar “apostolado da diversão”."}, {"n": 976, "chapter": "O Apostolado", "text": "Do “apostolado epistolar” me fazes um bom panegírico. - Escreves: “Não sei como encher o papel falando de coisas que possam ser úteis a quem recebe a carta. Quando começo, digo ao meu Anjo da Guarda que, se escrevo, é com o fim de que sirva para alguma coisa. E mesmo que só diga bobagens, ninguém me pode tirar - nem tirar a ele - o tempo que passei pedindo o que sei que mais necessita a alma daquele a quem vai dirigida a minha carta”."}, {"n": 977, "chapter": "O Apostolado", "text": "“A carta apanhou-me nuns dias tristes, sem motivo algum, e ao lê-la animei-me extraordinariamente, sentindo como trabalham os outros”. - E outro: “As suas cartas e as notícias dos meus irmãos ajudam-me como um sonho feliz diante da realidade de tudo o que apalpamos...” - E outro: “Que alegria receber essas cartas e saber-me amigo desses amigos!” - E outro, e mil: “Recebi a carta de X., e me envergonho ao pensar na minha falta de espírito, comparado com eles”. Não é verdade que é eficaz o “apostolado epistolar”?"}, {"n": 978, "chapter": "O Apostolado", "text": "“Venite post me, et faciam vos fieri piscatores hominum” - vinde atrás de Mim, e farei de vós pescadores de homens. - Não sem mistério emprega o Senhor estas palavras: os homens - como os peixes - têm de ser apanhados pela cabeça. Que profundidade evangélica não encerra o “apostolado da inteligência”!"}, {"n": 979, "chapter": "O Apostolado", "text": "É condição humana ter em pouco o que pouco custa. - Esta é a razão por que te aconselho o “apostolado de não-dar”. Nunca deixes de cobrar o que for eqflitativo e razoável pelo exercício da tua profissão, se a tua profissão é o instrumento do teu apostolado."}, {"n": 980, "chapter": "O Apostolado", "text": "“Não temos o direito de fazer-nos acompanhar nas viagens por uma mulher, irmã em Jesus Cristo, para que nos assista, como fazem os demais apóstolos, e os parentes do Senhor, e o próprio Pedro?” É o que diz São Paulo na sua primeira Epístola aos Coríntios. - Não é possível desdenhar a colaboração da “mulher no apostolado”."}, {"n": 981, "chapter": "O Apostolado", "text": "“Indo Ele, logo depois, por cidades e aldeias - lê-se no capítulo VIII de São Lucas -, pregava e evangelizava o reino de Deus. Acompanhavam-no os doze e algumas mulheres que tinham sido libertadas de espíritos malignos e curadas de enfermidades: Maria, chamada Madalena, da qual expulsara sete demônios; Joana, mulher de Cusa, administrador de Herodes; e Susana, e outras muitas, que o serviam com os seus bens”. Copio. E peço a Deus que, se alguma mulher me ler, se encha de uma santa inveja, cheia de eficácia."}, {"n": 982, "chapter": "O Apostolado", "text": "Mais forte a mulher do que o homem, e mais fiel na hora da dor. - Maria de Magdala, e
