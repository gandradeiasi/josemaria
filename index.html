 afobes. Deus quer e conta com a tua decisão de te preparares seriamente, durante os anos ou meses necessários. - Não faltava razão àquele imperador: “O tempo e eu contra outros dois”."}, {"n": 784, "chapter": "Vontade", "text": "Assim resumia o ciúme ou a inveja um homem reto: “Devem ter muito má vontade, para turvarem uma água tão clara”."}, {"n": 785, "chapter": "Vontade", "text": "Perguntas se deves manter-te silencioso e inativo... - Perante a agressão injusta à lei justa, não!"}, {"n": 786, "chapter": "Vontade", "text": "Cada dia vais “enlouquecendo” mais... - Nota-se nessa segurança e nesse aprumo formidável que te dá o saberes-te trabalhando por Cristo. - Já o proclamou a Escritura Santa: “Vir fidelis, multum laudabitur” - o varão fiel merece louvores de todos."}, {"n": 787, "chapter": "Vontade", "text": "Nunca te havias sentido mais absolutamente livre do que agora, que a tua liberdade está tecida de amor e de desprendimento, de segurança e de insegurança: porque nada fias de ti mesmo e tudo de Deus."}, {"n": 788, "chapter": "Vontade", "text": "Viste como se represam as águas nos açudes, para os tempos de seca?... Do mesmo modo, para conseguires essa igualdade de caráter de que necessitas no tempo de dificuldade, tens de represar a alegria, as razões claras e as luzes que o Senhor te manda."}, {"n": 789, "chapter": "Vontade", "text": "Quando se extinguem as labaredas do primeiro entusiasmo, avançar às escuras torna-se penoso. - Mas esse progresso, que custa, é o mais firme. E depois, quando menos o esperas, cessará a escuridão e voltarão o entusiasmo e o fogo. - Persevera!"}, {"n": 790, "chapter": "Vontade", "text": "Deus quer os seus filhos como forças de ataque. - Não podemos ficar na expectativa: próprio de nós é lutar, onde quer que nos encontremos sem pausa, ao passo de Deus."}, {"n": 791, "chapter": "Vontade", "text": "Não se trata de que realizes as tuas obrigações apressadamente, mas de que as leves a termo sem pausa, ao passo de Deus."}, {"n": 792, "chapter": "Vontade", "text": "Não te falta o trato agradável de conversador inteligente... Mas também és muito apático. - “Se não me procuram...”, desculpas-te. - Se não mudas - esclareço - e não vais ao encontro dos que te esperam, nunca poderás ser um apóstolo eficaz."}, {"n": 793, "chapter": "Vontade", "text": "Três pontos importantíssimos para arrastar as almas para o Senhor: que te esqueças de ti, e penses somente na glória de teu Pai-Deus: que submetas filialmente a tua vontade à Vontade do Céu, como Jesus Cristo te ensinou; que secundes docilmente as luzes do Espírito Santo."}, {"n": 794, "chapter": "Vontade", "text": "Durante três dias e três noites Maria busca o Filho que se perdeu. Oxalá possamos tu e eu dizer que a nossa vontade de encontrar Jesus também não conhece descanso."}, {"n": 795, "chapter": "Coração", "text": "O que é preciso para conseguir a felicidade não é uma vida cômoda, mas um coração enamorado."}, {"n": 796, "chapter": "Coração", "text": "Depois de vinte séculos, temos de apregoar com plena segurança que o espírito de Cristo não perdeu a sua força redentora, a única que sacia os anelos do coração humano. - Começa por meter essa verdade no teu, que estará em perpétua inquietação - como escreveu Santo Agostinho - enquanto não o colocares inteiramente em Deus."}, {"n": 797, "chapter": "Coração", "text": "Amar é... não albergar senão um único pensamento, viver para a pessoa amada, não se pertencer, estar submetido venturosa e livremente, com a alma e o coração, a uma vontade alheia... e ao mesmo tempo própria."}, {"n": 798, "chapter": "Coração", "text": "Ainda não queres ao Senhor como o avaro às suas riquezas, como uma mãe a seu filho..., ainda te preocupas demasiado contigo mesmo e com as tuas ninharias! Não obstante, notas que Jesus já se tornou indispensável na tua vida... - Pois bem, logo que corresponderes por completo à sua chamada, Ele te será indispensável também em cada um dos teus atos."}, {"n": 799, "chapter": "Coração", "text": "Grita-Lhe com força, porque esse grito é loucura de apaixonado!: - Senhor, embora eu te ame..., não te fies de mim! Ata-me a Ti, cada dia mais!"}, {"n": 800, "chapter": "Coração", "text": "Não duvides: o coração foi criado para amar. Metamos pois Jesus Cristo em todos os nossos amores. Caso contrário, o coração vazio se vinga, e se enche das baixezas mais desprezíveis."}, {"n": 801, "chapter": "Coração", "text": "Não existe coração mais humano que o de uma criatura que transborda de sentido sobrenatural. Pensa em Santa Maria, a cheia de graça, Filha de Deus Pai, Mãe de Deus Filho, Esposa de Deus Espírito Santo: no seu Coração, cabe a humanidade inteira sem diferenças nem discriminações. - Cada um é seu filho, sua filha."}, {"n": 802, "chapter": "Coração", "text": "As pessoas, quando têm o coração muito pequeno, parece que guardam os seus anseios numa gaveta pobre e fora de mão."}, {"n": 803, "chapter": "Coração", "text": "Nas relações com os que te cercam, tens de conduzir-te cada dia com muita compreensão, com muito carinho, juntamente - é claro - com toda a energia necessária: de outro modo, a compreensão e o carinho se convertem em cumplicidade e egoísmo."}, {"n": 804, "chapter": "Coração", "text": "Dizia - sem humildade de fachada - aquele nosso amigo: “Não precisei aprender a perdoar, porque o Senhor me ensinou a amar”."}, {"n": 805, "chapter": "Coração", "text": "Perdoar. Perdoar com toda a alma e sem resquício de rancor! Atitude sempre grande e fecunda. - Esse foi o gesto de Cristo ao ser pregado na Cruz: “Pai, perdoa-os, porque não sabem o que fazem”. E daí veio a tua salvação e a minha."}, {"n": 806, "chapter": "Coração", "text": "Causou-te uma grande pena o comentário bem pouco cristão daquela pessoa: “Perdoa os teus inimigos - dizia-te -; não imaginas como isso os deixa furiosos!”. - Não te pudeste conter, e replicaste com paz: “Não quero abaratar o amor com a humilhação do próximo. Perdôo, porque amo, com fome de imitar o Mestre”."}, {"n": 807, "chapter": "Coração", "text": "Evita com delicadeza tudo o que possa ferir o coração dos outros."}, {"n": 808, "chapter": "Coração", "text": "Por que motivo, entre dez maneiras de dizer “não”, hás de escolher sempre a mais antipática? - A virtude não deseja ferir."}, {"n": 809, "chapter": "Coração", "text": "Olha: temos que amar a Deus não somente com o nosso coração, mas com o “dEle”, e com o de toda a humanidade de todos os tempos...: senão, ficaremos abaixo das medidas para correspondermos ao seu Amor."}, {"n": 810, "chapter": "Coração", "text": "Dói-me que aqueles que se entregaram a Deus apresentem a imagem ou dêem pé para que os tomem por solteirões, quando têm o Amor por excelência! - Serão solteirões se não souberem amar Aquele que tanto ama."}, {"n": 811, "chapter": "Coração", "text": "Alguém comparou o coração a um moinho que se move pelo vento do amor, da paixão... Efetivamente esse “moinho” pode moer trigo, cevada, esterco... - Depende de nós!"}, {"n": 812, "chapter": "Coração", "text": "O demônio - pai da mentira e vítima da sua soberba - tenta arremedar o Senhor até no modo de fazer prosélitos. Reparaste? Assim como Deus se vale dos homens para salvar almas e levá-las à santidade, satanás serve-se de outras pessoas para dificultar esse trabalho e até para as perder. E - não te assustes -, da mesma maneira que Jesus busca, como instrumentos, os mais próximos - parentes, amigos, colegas etc. -, o demônio também tenta, com freqflência, mover esses seres mais queridos, para induzir ao mal. Por isso, se os laços do sangue se convertem em amarras, que te impedem de seguir os caminhos de Deus, corta-os com decisão. E talvez a tua determinação desamarre também os que estavam enredados nas malhas de Lúcifer."}, {"n": 813, "chapter": "Coração", "text": "Obrigado, meu Jesus!, por que quiseste fazer-te perfeito Homem, com um Coração amante e amabilíssimo, que ama até a morte e sofre; que se enche de gozo e de dor; que se entusiasma com os caminhos dos homens, e nos mostra aquele que conduz ao Céu; que se submete heroicamente ao dever, e se guia pela misericórdia; que vela pelos pobres e pelos ricos; que cuida dos pecadores e dos justos... - Obrigado, meu Jesus, e dá-nos um coração à medida do teu!"}, {"n": 814, "chapter": "Coração", "text": "Pede a Jesus que te conceda um Amor qual fogueira de purificação, onde a tua pobre carne - o teu pobre coração - se consuma, limpando-se de todas as misérias terrenas... E vazio de ti mesmo, se cumule dEle. Pede-Lhe que te conceda uma aversão radical ao que é mundano: que só o Amor te sustente."}, {"n": 815, "chapter": "Coração", "text": "Viste com muita clareza a tua vocação - amar a Deus -, mas só com a cabeça. Garantes que puseste o coração no teu caminho..., mas às vezes te distrais e até tentas voltar o olhar para trás: sinal de que não o puseste por inteiro. - Esmera-te!"}, {"n": 816, "chapter": "Coração", "text": "“Eu vim - assim se exprime o Mestre - para separar o homem de seu pai, a filha de sua mãe e a nora de sua sogra...”. Cumprindo o que Ele te exige, demonstrarás que os amas verdadeiramente. Por isso, não te escudes no carinho que lhes tens - deve ser total -, à hora do teu sacrifício pessoal. Senão, acredita-me antepões ao amor de Deus o de teus pais; e ao de teus pais, o teu amor próprio. - Entendeste agora, com amis profundidade, a congruência das palavras evangélicas?"}, {"n": 817, "chapter": "Coração", "text": "O coração! De vez em quando, sem o poderes evitar, projeta-se uma sombra de luz humana, uma recordação torpe, triste, “provinciana”... - Corre logo ao Sacrário, física ou espiritualmente: e tornarás à luz, à alegria, à Vida."}, {"n": 818, "chapter": "Coração", "text": "A freqflência com que visitamos o Senhor está em função de dois fatores: fé e coração; ver a verdade e amá-la."}, {"n": 819, "chapter": "Coração", "text": "O amor se robustece também com negação e mortificação."}, {"n": 820, "chapter": "Coração", "text": "Se tivesses um coração grande e um pouco mais de sinceridade não te deterias a mortificar, nem te sentirias mortificado... por minúcias."}, {"n": 821, "chapter": "Coração", "text": "Se te zangas - em certas ocasiões é um dever; em outras, uma fraqueza -, que a zanga dure somente uns minutos. E, além disso, sempre com caridade: carinho!"}, {"n": 822, "chapter": "Coração", "text": "Repreender?... Muitas vezes é necessário. Mas ensinando a corrigir o defeito. Nunca por um desabafo do teu mau caráter."}, {"n": 823, "chapter": "Coração", "text": "Quando é preciso corrigir, deve-se atuar com clareza e amabilidade; sem excluir um sorriso nos lábios, se for oportuno. Nunca - ou muito raras vezes - aos berros."}, {"n": 824, "chapter": "Coração", "text": "Sentes-te depositário do bem e da verdade absoluta e, portanto, investido de um título pessoal ou de um direito a desarraigar o mal a todo o custo? - Por esse caminho não consertarás nada: só por Amor e com amor!, recordando que o Amor te perdoou e te perdoa tanto."}, {"n": 825, "chapter": "Coração", "text": "Ama os bons, porque amam a Cristo... - E ama também os que não O amam, porque têm essa infelicidade..., e especialmente porque Ele ama uns e outros."}, {"n": 826, "chapter": "Coração", "text": "A gente daquela terra - tão afastada de Deus, tão desorientada - recordou-te as palavras do Mestre: “Andam como ovelhas sem pastor”. - E sentiste que tu também ficavas com as entranhas cheias de compaixão... Decide-te, no lugar que ocupas, a dar a vida em holocausto por todos."}, {"n": 827, "chapter": "Coração", "text": "Os pobres - dizia aquele amigo nosso - são o meu melhor livro espiritual e o principal motivo de minhas orações. Doem-me eles, e Cristo me dói com eles. E, porque me dói, compreendo que O amo e que os amo."}, {"n": 828, "chapter": "Coração", "text": "Quando se coloca o amor de Deus no meio da amizade, este afeto se depura, se engrandece, se espiritualiza; porque se queimam as escórias, os pontos de vista egoístas, as considerações excessivamente carnais. Não o esqueças: o amor de Deus ordena melhor os nossos afetos, torna-os mais puros, sem diminuí-los."}, {"n": 829, "chapter": "Coração", "text": "Esta situação abrasa-te: Cristo aproximou-se de ti quando não passavas de um miserável leproso! Até esse momento, só cultivavas uma qualidade boa: um generoso interesse pelos outros. Depois desse encontro, alcançaste a graça de ver Jesus neles, e te enamoraste dEle, e agora o amas neles..., e parece-te muito pobre - tens razão! - o altruísmo que antes te impelia a prestar uns serviços ao próximo."}, {"n": 830, "chapter": "Coração", "text": "Acostuma-te a colocar o teu pobre coração no Doce e Imaculado Coração de Maria, para que o purifique de tanta escória, e te leve ao Coração Sacratíssimo e Misericordioso de Jesus."}, {"n": 831, "chapter": "Pureza", "text": "A castidade - a de cada um no seu estado: solteiro, casado, viúvo, sacerdote - é uma triunfante afirmação do amor."}, {"n": 832, "chapter": "Pureza", "text": "O “milagre” da pureza tem como pontos de apoio a oração e a mortificação."}, {"n": 833, "chapter": "Pureza", "text": "A tentação contra a castidade demonstra-se tanto mais perigosa quanto mais dissimulada: por se apresentar insidiosamente, engana melhor. - Não transijas, nem sequer com a desculpa de não “parecer estranho”!"}, {"n": 834, "chapter": "Pureza", "text": "A santa pureza: humildade da carne! Senhor - pedias-Lhe -, sete chaves para o meu coração. E aconselhei-te que Lhe pedisses sete chaves para o teu coração e, também, oitenta anos de gravidade para a tua juventude... Além disso, vigia..., porque mais depressa se apaga uma fagulha do que um incêndio; foge..., porque aqui é uma vil covardia ser “valente”; não andes com os olhos esparramados..., porque isso não indica ânimo desperto, mas insídia de satanás. Mas toda essa diligência humana, junto com a mortificação, o cilício, a disciplina e o jejum, que pouco valem sem Ti, meu Deus!"}, {"n": 835, "chapter": "Pureza", "text": "Assim matou aquele confessor a concupiscência de uma alma delicada, que se acusou de certas curiosidades: - “Ora! Instintos de machos e de fêmeas!”."}, {"n": 836, "chapter": "Pureza", "text": "Tão logo se admite voluntariamente esse diálogo, a tentação tira paz à alma, do mesmo modo que a impureza consentida destrói a graça."}, {"n": 837, "chapter": "Pureza", "text": "Seguiu o caminho da impureza com todo o seu corpo... e com toda a sua alma. - A sua fé foi-se esfumando..., embora saiba muito bem que não é problema de fé."}, {"n": 838, "chapter": "Pureza", "text": "“O senhor disse-me que se pode chegar a ser `outro’ Santo Agostinho, depois do meu passado. Não duvido, e hoje mais do que ontem quero esforçar-me por comprová-lo”. Mas tens de cortar valentemente e pela raiz, como o santo bispo de Hipona."}, {"n": 839, "chapter": "Pureza", "text": "Sim, pede perdão contrito, e faz abundante penitência pelos acontecimentos impuros da tua vida passada - mas não queiras recordá-los."}, {"n": 840, "chapter": "Pureza", "text": "Essa conversa... suja, de cloaca! - Não basta que não a secundes: manifesta energicamente a tua repugnância!"}, {"n": 841, "chapter": "Pureza", "text": "É como se o “espírito” se fosse reduzindo, empequenecendo, até ficar num pontinho... E o corpo aumenta, agiganta-se até dominar. - Foi para ti que São Paulo escreveu: “Castigo o meu corpo e o reduzo à escravidão, não seja que, tendo pregado aos outros, venha eu a ser reprovado”."}, {"n": 842, "chapter": "Pureza", "text": "Que pena dão os que afirmam - pela sua triste experiência pessoal - que não se pode ser casto vivendo e trabalhando no meio do mundo! - Com esse raciocínio ilógico, não deveriam incomodar-se se alguém ofende a memória de seus pais, de seus irmãos, da sua mulher, do seu marido."}, {"n": 843, "chapter": "Pureza", "text": "Aquele confessor, um pouco rude, mas experiente, conteve os desvarios de uma alma e os reduziu à ordem com esta afirmação: “Andas agora por caminhos de gado; depois conformar-te-ás em ir pelos das cabras; e depois..., sempre como um animal, que não sabe olhar para o céu”."}, {"n": 844, "chapter": "Pureza", "text": "Talvez sejas... isso mesmo, o que és: um animalzinho. - Mas tens de reconhecer que outros são íntegros e castos. Ah!, e não te irrites depois, quando não contarem contigo ou quando te ignorarem: eles e elas organizam os seus planos humanos com pessoas que têm alma e corpo..., não com animais."}, {"n": 845, "chapter": "Pureza", "text": "Há quem traga filhos ao mundo para o seu benefício, para o seu serviço, para o seu egoísmo... E não se lembram de que são um dom maravilhoso do Senhor, do qual terão que prestar contas especialíssimas. Trazer filhos, somente para continuar a espécie, também o sabem fazer - não te zangues comigo - os animais."}, {"n": 846, "chapter": "Pureza", "text": "Um casal cristão não pode desejar cegar as fontes da vida. Porque o seu amor se fundamenta no Amor de Cristo, que é entrega e sacrifício... Além disso, como Tobias recordava a Sara, os esposos sabem que “nós somos filhos de santos, e não podemos juntar-nos à maneira dos gentios, que não conhecem a Deus”."}, {"n": 847, "chapter": "Pureza", "text": "Quando éramos pequenos, procurávamos grudar-nos à nossa mãe, ao passarmos por caminhos escuros ou por onde havia cachorros. Agora, ao sentirmos as tentações da carne, devemos chegar-nos estreitamente à Nossa Mãe do Céu, por meio da sua presença bem próxima e por meio das jaculatórias. - Ela nos defenderá e nos levará à luz."}, {"n": 848, "chapter": "Pureza", "text": "Pensa, que são mais homens, ou mais mulheres, por levarem essa vida desordenada. Vê-se que os que raciocinam assim colocam o seu ideal de pessoa nas meretrizes, nos invertidos, nos degenerados..., naqueles que têm o coração podre e não poderão entrar no Reino dos Céus."}, {"n": 849, "chapter": "Pureza", "text": "Permite-me um conselho, para que o ponhas em prática diariamente. Quando o coração te fizer notar as suas baixas tendências, reza devagar à Virgem Imaculada: Olha-me com compaixão, não me deixes, minha Mãe! - E aconselha - o assim a outros."}, {"n": 850, "chapter": "Paz", "text": "Fomenta, na tua alma e no teu coração - na tua inteligência e no teu querer -, o espírito de confiança e de abandono na amorosa Vontade do Pai celestial... - Daí nasce a paz interior por que anseias."}, {"n": 851, "chapter": "Paz", "text": "Como hás de ter paz, se te deixas arrastar - contraindo os “puxões” da graça - por essas paixões que nem sequer tentas dominar?"}, {"n": 852, "chapter": "Paz", "text": "Tanto a paz como a guerra estão dentro de nós. - Não se pode chegar ao triunfo, à paz, se faltam a lealdade e a decisão de vencer no combate."}, {"n": 853, "chapter": "Paz", "text": "Um remédio contra essas tuas inquietações: ter paciência, retidão de intenção, e olhar as coisas com perspectiva sobrenatural."}, {"n": 854, "chapter": "Paz", "text": "Afasta logo de ti - se Deus está contigo! - o temor e a perturbação de espírito... Evita pela raiz essas reações, pois ó servem para multiplicar as tentações e aumentar o perigo."}, {"n": 855, "chapter": "Paz", "text": "Ainda que tudo se afunde e se acabe, ainda que os acontecimentos ocorram ao contrário do previsto, e nos sejam tremendamente adversos, nada ganhamos perturbando-nos. Além disso, lembra-te da oração confiante do profeta: “O Senhor é nosso Juiz, o Senhor é nosso Legislador, o Senhor é nosso Rei; Ele é quem nos há de salvar”. - Reza-a devotamente, todos os dias, para ajustares a tua conduta aos desígnios da Providência, que nos governa para nosso bem."}, {"n": 856, "chapter": "Paz", "text": "Se - por teres o olhar cravado em Deus - sabes manter-te sereno ante as preocupações, se aprendes a esquecer as pequenezes, os rancores e as invejas, evitarás a perda de muitas energias, que te fazem falta para trabalhar com eficácia, a serviço dos homens."}, {"n": 857, "chapter": "Paz", "text": "Aquele amigo confiava-nos sinceramente que nunca se tinha entediado, porque nunca se tinha encontrado só, sem o nosso Amigo. - Caía a tarde, num silêncio denso... Notas-te muito vivamente a presença de Deus... E, com essa realidade, que paz!"}, {"n": 858, "chapter": "Paz", "text": "Uma saudação vibrante de um irmão recordou-te, naquele ambiente de viagem, que os caminhos honestos do mundo estão abertos para Cristo: falta apenas que nos lancemos a percorrê-los, com espírito de conquista."}, {"n": 859, "chapter": "Paz", "text": "És extraordinariamente feliz. Às vezes, quando percebes que um filho de Deus O abandona, sentes - no meio da tua paz e da tua alegria íntimas - uma dor de carinho, uma amargura, que nem perturba nem inquieta. - Muito bem, mas... toca a empregar todos os meios humanos e sobrenaturais para que essa pessoa reaja..., e a confiar com segurança em Jesus Cristo! Assim, as águas voltam sempre ao seu leito."}, {"n": 860, "chapter": "Paz", "text": "Quando te abandonares de verdade no Senhor, aprenderás a contentar-se com o que vier, e a não perder a serenidade, se as tarefas - apensar de teres posto todo o teu empenho e utilizado os meios oportunos - não correm a teu gosto... Porque terão “corrido” como convém a Deus que corram."}, {"n": 861, "chapter": "Paz", "text": "Continuas a ter desacertos e faltas, e doem-te! Ao mesmo tempo, caminhas com uma alegria que parece que te vai fazer explodir. Por isso, porque te doem - dor de amor -, os teus malogros já não te tiram a paz."}, {"n": 862, "chapter": "Paz", "text": "Quando se está às escuras, com a alma cega e inquieta, temos de recorrer, como Bartimeu, à Luz. Repete, grita, insiste com mais força: “Domine, ut videam!” - Senhor, que eu veja!... E far-se-á dia para os teus olhos, e poderás alegrar-te com o clarão de luz que Ele te concederá."}, {"n": 863, "chapter": "Paz", "text": "Luta contra as asperezas do teu caráter, contra os teus egoísmos, contra o teu comodismo, contra as tuas antipatias... Além de que temos de ser corredentores, o prêmio que receberás - pensa bem nisto - estará em proporção diretíssima com a semeadura que tiveres feito."}, {"n": 864, "chapter": "Paz", "text": "Tarefa do cristão: afogar o mal em abundância de bem. Não se trata de campanhas negativas, nem de ser anti-nada. Pelo contrário: viver de afirmação, cheios de otimismo, com juventude, alegria e paz; ver com compreensão a todos: os que seguem a Cristo e os que O abandonam ou não O conhecem. - Mas compreensão não significa abstencionismo nem indiferença, mas atividade."}, {"n": 865, "chapter": "Paz", "text": "Por caridade cristã e por elegância humana, deves esforçar-te por não criar um abismo com ninguém..., por deixar sempre uma saída ao próximo, para que não se afaste ainda mais da Verdade."}, {"n": 866, "chapter": "Paz", "text": "A violência não é bom sistema para convencer..., e muito menos no apostolado."}, {"n": 867, "chapter": "Paz", "text": "O violento perde sempre, mesmo que ganhe a primeira batalha..., porque acaba rodeado da solidão criada pela sua incompreensão."}, {"n": 868, "chapter": "Paz", "text": "A tática do tirano é conseguir que briguem entre si aqueles que, unidos, poderiam fazê-lo cair. - Velha artimanha usada pelo inimigo -, para desbaratar muitos planos apostólicos."}, {"n": 869, "chapter": "Paz", "text": "Esses..., que vêem antagonistas onde só há irmãos, negam com as suas obras a sua profissão de cristãos."}, {"n": 870, "chapter": "Paz", "text": "Com a polêmica agressiva, que humilha, raramente se resolve uma questão. E, sem dúvida, nunca se consegue esclarecimento algum quando, entre os que disputam, há um fanático."}, {"n": 871, "chapter": "Paz", "text": "Não compreendo o teu aborrecimento, nem o teu desencanto. Corresponderam-te com a tua mesma moeda: o deleite nas injúrias, através da palavra e das obras. Aproveita a lição e, de agora em diante, não esqueças que também têm coração os que convivem contigo."}, {"n": 872, "chapter": "Paz", "text": "Para que não perdesses a paz, naqueles tempos de dura e injusta contradição, recordei-te: “Se nos abrirem a cabeça, não daremos a isso a maior importância: será porque temos de levá-la aberta”."}, {"n": 873, "chapter": "Paz", "text": "Paradoxo: desde que me decidi a seguir o conselho do Salmo: “Lança sobre o Senhor as tuas preocupações, e Ele te sustentará”, cada dia tenho menos preocupações na cabeça... E, ao mesmo tempo, com o trabalho oportuno, tudo se resolve com maior clareza!"}, {"n": 874, "chapter": "Paz", "text": "Santa Maria é - assim a invoca a Igreja - a Rainha da paz. Por isso, quando se conturba a tua alma, ou o ambiente familiar ou profissional, ou a convivência na sociedade ou entre os povos, não cesses de aclamá-la com esse título: “Regina pacis, ora pro nobis!” - Rainha da paz, rogai por nós! Experimentaste fazê-lo, ao menos, quando perdes a tranqflilidade?... - Ficarás surpreso com a sua eficácia imediata."}, {"n": 875, "chapter": "O Além", "text": "O verdadeiro cristão está sempre disposto a comparecer diante de Deus. Porque, em cada instante - se luta por viver como homem de Cristo -, encontra - se preparado para cumprir o seu dever."}, {"n": 876, "chapter": "O Além", "text": "Em face da morte, sereno! - É assim que te quero. - Não com o estoicismo frio do pagão; mas com o fervor do filho de Deus, que sabe que a vida é mudada, não tirada. - Morrer?... Viver!"}, {"n": 877, "chapter": "O Além", "text": "Doutor em Direito e em Filosofia, preparava um concurso para professor catedrático na Universidade de Madrid. Duas carreiras brilhantes, feitas com brilhantismo. Mandou-me avisar: estava doente, e desejava que eu fosse visitá - lo. Cheguei à pensão onde estava hospedado. - “Padre, estou morrendo”, foi a saudação. Animei-o, com carinho. Quis fazer uma confissão geral. Naquela noite, faleceu. Um arquiteto e um médico me ajudaram a amortalhá-lo. - E, à vista daquele corpo jovem, que rapidamente começou a decompor-se..., estivemos de acordo os três em que as duas carreiras universitárias não valiam nada, comparadas com a carreira definitiva que, como bom cristão, acabava de coroar."}, {"n": 878, "chapter": "O Além", "text": "Tudo se conserta, menos a morte... E a morte conserta tudo."}, {"n": 879, "chapter": "O Além", "text": "A morte chegará inexoravelmente. Portanto, que oca vaidade centrar a existência nesta vida! Olha como padecem tantas e tantos. A uns, porque ela se acaba, dói-lhes deixá-la; a outros, porque dura, enfastia-os... Em caso algum tem cabimento a atitude errada de justificarmos a nossa passagem pela terra como um fim. É preciso sair dessa lógica, e ancorar-se na outra: na eterna. É necessário uma mudança total: um esvaziar-se de si mesmo, dos motivos egocêntricos, que são caducos, para renascer em Cristo, que é eterno."}, {"n": 880, "chapter": "O Além", "text": "Quando pensares na morte, apesar dos teus pecados, não tenhas medo... Porque Ele já sabe que O amas..., e de que massa estás feito. - Se tu O procurares, acolher-te-á como o pai ao filho pródigo: mas tens de procurá-Lo!"}, {"n": 881, "chapter": "O Além", "text": "“Non habemus hic manentem civitatem” - não se encontra nesta terra a nossa morada definitiva. - E, para que não o esqueçamos, às vezes essa verdade surge com crueza à hora da morte: incompreensão, perseguição, desprezo... - E sempre a solidão, porque - mesmo que estejamos rodeados de carinho - cada um morre sozinho. - Soltemos já todas as amarras! Preparemo - nos continuamente para esse passo, que nos levará à presença eterna da Trindade Santíssima."}, {"n": 882, "chapter": "O Além", "text": "O tempo é o nosso tesouro, o “dinheiro” para comprarmos a eternidade."}, {"n": 883, "chapter": "O Além", "text": "Consolou-te a idéia de que a vida é um gastar-se, um queimá-la no serviço de Deus. - Assim, gastando-nos integralmente por Ele, virá a libertação da morte, que nos trará a posse da Vida."}, {"n": 884, "chapter": "O Além", "text": "Aquele sacerdote amigo trabalhava pensando em Deus, agarrado à sua mão paterna, e ajudando os outros a assimilar estas idéias-mestras. Por isso, dizia para si mesmo: Quando morreres, tudo continuará a andar bem, porque continuará Ele a ocupar-se de tudo."}, {"n": 885, "chapter": "O Além", "text": "Não faças da morte uma tragédia!, porque não o é. Só aos filhos desamorados é que não entusiasma o encontro com seus pais."}, {"n": 886, "chapter": "O Além", "text": "Todas as coisas daqui de baixo são um punhado de cinzas. Pensa nos milhões de pessoas - já defuntas - “importantes” e “recentes”, de quem já ninguém se lembra."}, {"n": 887, "chapter": "O Além", "text": "Esta foi a grande revolução cristã: converter a dor em sofrimento fecundo; fazer, de um mal, um bem. Despojamos o diabo dessa arma...; e, com ela, conquistamos a eternidade."}, {"n": 888, "chapter": "O Além", "text": "O juízo revelar-se-á terrível para aqueles que, conhecendo perfeitamente o caminho, e tendo-o ensinado e exigido aos outros, não o tiveram percorrido eles mesmos. - Deus os julgará e os condenará com as suas próprias palavras."}, {"n": 889, "chapter": "O Além", "text": "O purgatório é uma misericórdia de Deus, para limpar os defeitos daqueles que desejam identificar-se com Ele."}, {"n": 890, "chapter": "O Além", "text": "Somente o inferno é castigo do pecado. A morte e o juízo não passam de conseqflências, que aqueles que vivem na graça de Deus não temem."}, {"n": 891, "chapter": "O Além", "text": "Se alguma vez te intranqflilizas com o pensamento da nossa irmã a morte - porque te vês tão pouca coisa! -, anima-te e considera: que será esse Céu que nos espera, quando toda a formosura e grandeza, toda a felicidade e Amor infinitos de Deus se derramarem sobre o pobre vaso de barro que é a criatura humana, e a saciarem eternamente, sempre com a novidade de uma aventura nova?"}, {"n": 892, "chapter": "O Além", "text": "Quando se choca com a amarga injustiça desta vida, como se alegra a alma reta ao pensar na Justiça eterna do seu Deus eterno! - E, dentro do conhecimento das suas próprias misérias, escapa-lhe, com eficazes desejos, aquela exclamação paulina: “Non vivo ego” - não sou eu quem vive agora!, é Cristo quem vive em mim!: e viverá eternamente."}, {"n": 893, "chapter": "O Além", "text": "Como se deve morrer contente, quando se viveram heroicamente todos os minutos da vida! - Posso garantir-te isso, porque presenciei a alegria daqueles que, com serena impaciência, durante muitos anos, se prepararam para esse encontro."}, {"n": 894, "chapter": "O Além", "text": "Pede que nenhum de nós falhe ao Senhor. - Não nos será difícil, se não formos tolos. Porque o nosso Pai-Deus ajuda em tudo: até mesmo tornando temporário este nosso desterro no mundo."}, {"n": 895, "chapter": "O Além", "text": "O pensamento da morte ajudar-te-á a cultivar a virtude da caridade, porque talvez esse instante concreto de convivência seja o último em que estás com este ou com aquele...: eles ou tu, ou eu, podemos faltar em qualquer momento."}, {"n": 896, "chapter": "O Além", "text": "Dizia uma alma ambiciosa de Deus: felizmente, nós os homens não somos eternos!"}, {"n": 897, "chapter": "O Além", "text": "Fez-me meditar aquela notícia: cinqflenta e um milhões de pessoas falecem por ano; noventa e sete por minuto. O pescador - assim disse o Mestre - lança as suas redes ao mar, o Reino dos Céus é semelhante a uma rede de arrastão..., e de dentro dela serão escolhidos os bons; e os maus, os que não preencheram as condições, rejeitados para sempre! Cinqflenta e um milhões morrem por ano, noventa e sete por minuto: dize-o também a outros."}, {"n": 898, "chapter": "O Além", "text": "A nossa Mãe subiu em corpo e alma aos Céus. Repete-lhe que, como filhos, não queremos separar-nos dEla... Ela te escutará!"}, {"n": 899, "chapter": "A Língua", "text": "Dom de línguas, saber transmitir a ciência de Deus; recurso imprescindível para quem há de ser apóstolo. - Por isso, pelo todos os dias a Deus Nosso Senhor que o conceda a cada uma e a cada um dos seus filhos."}, {"n": 900, "chapter": "A Língua", "text": "Aprende a dizer “não”, sem ferir desnecessariamente, sem lançar mão da recusa cortante, que rasga a caridade. - Lembra-te de que estás sempre diante de Deus."}, {"n": 901, "chapter": "A Língua", "text": "Aborrece-te que eu insista, do mesmo modo, nas mesmas coisas essenciais? Que não tenha em conta essas correntes em voga? - Olha: sempre se definiu da mesma maneira, ao longo dos séculos, a linha reta, porque é a mais clara e breve. Outra definição seria mais obscura e complicada."}, {"n": 902, "chapter": "A Língua", "text": "Acostuma-te a falar cordialmente de tudo e de todos; em particular, de todos os que trabalham no serviço de Deus. E quando não for possível, cala-te! Também os comentários bruscos ou desembaraçados podem beirar a murmuração ou a difamação."}, {"n": 903, "chapter": "A Língua", "text": "Dizia-te um rapagão que acabava de entregar-se mais intimamente a Deus: “Agora o que eu preciso é falar menos, visitar doentes e dormir no chão”. - Aplica a moral da história a ti mesmo."}, {"n": 904, "chapter": "A Língua", "text": "Dos sacerdotes de Cristo não se deve falar senão para louvá-los! - Desejo com toda a minha alma que os meus irmãos e eu o tenhamos muito em conta, para a nossa conduta diária."}, {"n": 905, "chapter": "A Língua", "text": "A mentira tem muitas facetas: reticências, cochichos, murmuração... - Mas é sempre arma de covardes."}, {"n": 906, "chapter": "A Língua", "text": "Não há direito de que te deixes impressionar pela primeira ou pela última conversa! Escuta com respeito, com interesse; dá crédito às pessoas..., mas peneira o teu juízo na presença de Deus."}, {"n": 907, "chapter": "A Língua", "text": "Murmuram. E depois eles mesmos se encarregam de que alguém venha imediatamente contar-te o “diz-se”... - Vilania? - Sem dúvida. Mas não percas a paz, já que as suas línguas não poderão fazer-te mal nenhum, se trabalhas com retidão... - Pensa: como são bobos, que pouco tato humano têm, que falta de lealdade para com os seus irmãos... e especialmente para com Deus! E não caias tu na murmuração, por um mal entendido direito de réplica. Se tens de falar, serve-te da correção fraterna, como nos aconselha o Evangelho."}, {"n": 908, "chapter": "A Língua", "text": "Não te preocupes com essas contradições, com esses falatórios; trabalhamos sem dúvida numa tarefa divina, mas somos homens... E é lógico que, ao andar, levantemos o pó do caminho. Isso que te incomoda, que te fere..., aproveita-o para a tua purificação e, se for preciso, para retificar."}, {"n": 909, "chapter": "A Língua", "text": "Murmurar, dizem, é muito humano. - Repliquei: nós temos que viver à maneira divina. A palavra malvada ou leviana de um só homem pode formar uma opinião, e até pôr de moda que se fale mal de alguém... Depois, essa murmuração sobe lá de baixo, chega às alturas, e talvez se condense em negras nuvens. - Mas, quando o fustigado é uma alma de Deus, as nuvens se revolvem em chuva fecunda, aconteça o que acontecer; e o Senhor se encarrega de exaltá-lo, naquilo mesmo em que pretendiam humilhá-lo ou difamá-lo."}, {"n": 910, "chapter": "A Língua", "text": "Não querias acreditar, mas tiveste que render-te à evidência, bem à tua custa: aquelas afirmações que pronunciaste com simplicidade e com saudável senso católico, os inimigos da fé as retorceram com malícia. É verdade, “temos de ser cândidos como as pombas..., e prudentes como as serpentes”. Não fales a destempo nem fora de lugar."}, {"n": 911, "chapter": "A Língua", "text": "Por não saberes - ou não quereres - imitar a conduta nobre daquele homem, a tua secreta inveja te leva a ridicularizá-lo."}, {"n": 912, "chapter": "A Língua", "text": "A maledicência é filha da inveja; e a inveja, o refúgio, dos infecundos. Por isso, perante a esterilidade, examina o teu ponto de mira: se trabalhas e não te incomoda que os outros também trabalhem e consigam frutos, essa esterilidade é apenas aparente; farás a colheita a seu tempo."}, {"n": 913, "chapter": "A Língua", "text": "Há alguns que, quando não fazem mal aos outros ou não os mortificam, parece que se consideram desocupados."}, {"n": 914, "chapter": "A Língua", "text": "Às vezes, penso que os murmuradores são como pequenos endemoninhados... - Porque o demônio insinua-se sempre com o seu espírito maligno de crítica a Deus, ou aos seguidores de Deus."}, {"n": 915, "chapter": "A Língua", "text": "“Burrices!”, comentas depreciativamente. - Mas tu as conheces? Não? - Então, como é que falas daquilo que não sabes?"}, {"n": 916, "chapter": "A Língua", "text": "Responde a esse murmurador: fique descansado, vou contar isso ou falar disso com o interessado."}, {"n": 917, "chapter": "A Língua", "text": "Escreveu um autor contemporâneo: “O mexerico é sempre desumano; revela uma valia pessoal medíocre; é um sinal de falta de educação; demonstra ausência de finura de sentimentos; é indigno do cristão”."}, {"n": 918, "chapter": "A Língua", "text": "Evita sempre a queixa, a crítica, as murmurações... Evita à risca tudo o que possa introduzir discórdia entre irmãos."}, {"n": 919, "chapter": "A Língua", "text": "Tu, que estás investido em muito alta autoridade, serias imprudente se interpretasses o silêncio dos que escutam como sinal de aquiescência: pensa que não lhes deixa expor as suas sugestões, e que te sentes ofendido se chegam a fazê-las. - Tens de corrigir-te."}, {"n": 920, "chapter": "A Língua", "text": "Esta há de ser a tua altitude perante a difamação. Primeiro, perdoar: a todos, desde o primeiro instante e de todo o coração. - Depois, amar: que não te escape nem uma falta de caridade, responde sempre com amor! - Mas, se atacam a tua Mãe, a Igreja, defende-a valentemente; com calma, mas com firmeza e com inteireza cheia de energia, impede que manchem, ou que estorvem, o caminho por onde têm de caminhar as almas que querem perdoar e responder com caridade, quando sofrem injúrias pessoais."}, {"n": 921, "chapter": "A Língua", "text": "O vilarejo mais pequeno - comentava alguém, cansado de murmurações - deveria ter ambiente de capital. - Não sabia, o coitado, que não adianta. - Tu, por amor a Deus e a o próximo, não caias num defeito tão “provinciano”... e tão pouco cristão. - Dos primeiros seguidores de Cristo afirmava-se: Vêde como se amam! Pode-se dizer o mesmo de ti, de mim, a qualquer hora?"}, {"n": 922, "chapter": "A Língua", "text": "As críticas contra as obras de apostolado costumam ser de dois gêneros: uns apresentam o trabalho como uma estrutura complicadíssima; outros o tacham de tarefa cômoda e fácil. No fundo, essa “objetividade” se reduz a estreiteza de vistas, com uma boa dose de preguiça tagarela. - Pergunta-lhe sem te zangares: E vocês, que fazem?"}, {"n": 923, "chapter": "A Língua", "text": "Para os imperativos da tua fé, talvez não possas pedir simpatia, mas tens que exigir respeito."}, {"n": 924, "chapter": "A Língua", "text": "Os que te falaram mal desse amigo leal para com Deus são os mesmos que irão murmurar de ti, quando te decidires a portar-te melhor."}, {"n": 925, "chapter": "A Língua", "text": "Certos comentários só podem ferir os que se sentem atingidos. Por isso, quando se caminha - com a cabeça e o coração - seguindo os passos do Senhor, as críticas se acolhem como purificação e servem de acicate para avivar o passo."}, {"n": 926, "chapter": "A Língua", "text": "A Trindade Santíssima coroou a nossa Mãe. - Deus Pai, Deus Filho, Deus Espírito Santo, pedir-nos-á contas de toda a palavra ociosa. Mais um motivo para que digamos a Santa Maria que nos ensine a falar sempre na presença do Senhor."}, {"n": 927, "chapter": "Propaganda", "text": "Convence-te: o teu apostolado consiste em difundir bondade, luz, entusiasmo, generosidade, espírito de sacrifício, constância no trabalho, profundidade no estudo, amplitude na entrega, atualização, obediência absoluta e alegre à Igreja, caridade perfeita... - Ninguém dá o que não tem."}, {"n": 928, "chapter": "Propaganda", "text": "Para ti, que és ainda jovem e acabas de empreender o caminho, um conselho: como Deus merece tudo, procura sobressair profissionalmente, para que possas depois propagar as tuas idéias com maior eficácia."}, {"n": 929, "chapter": "Propaganda", "text": "Não o esqueças: tanto melhor convencemos quanto mais convencidos estamos."}, {"n": 930, "chapter": "Propaganda", "text": "“Não se acende a luz para colocá-la debaixo de um alqueire, mas sobre um candeeiro, a fim de que alumie todos os da casa; assim brilhe a vossa luz diante dos homens, de maneira que vejam as vossas obras e glorifiquem o vosso Pai que está nos céus”. E, no final da sua passagem pela terra, Ele ordena: “Euntes docete” - ide e ensinai. Quer que a sua luz brilhe na conduta e na palavra dos seus discípulos - nas tuas também."}, {"n": 931, "chapter": "Propaganda", "text": "É chocante a freqflência com que, em nome da liberdade!, tanto têm medo - e se opõem! - a que os católicos sejam simplesmente bons católicos."}, {"n": 932, "chapter": "Propaganda", "text": "Guarda-te dos propagadores de calúnias e insinuações, que uns acolhem por ligeireza e outros por má-fé, destruindo a serenidade do ambiente e envenenando a opinião pública. Em certas ocasiões, a verdadeira caridade pede que se denunciem esses atropelos e os seus promotores. Senão, com a consciência desviada ou pouco formada, eles e os que os ouvem podem pensar: calam, logo consentem."}, {"n": 933, "chapter": "Propaganda", "text": "Os sectários vociferam contra o que chamam “o nosso fanatismo”, porque os séculos passam e a Fé católica permanece imutável. Pelo contrário, o fanatismo dos sectários - por não guardar relação com a verdade - muda de vestimenta em cada época, levantando contra a Santa Igreja o espantalho de meras palavras, esvaziadas de conteúdo pelas suas obras: “liberdade”, que acorrenta; “progresso”, que devolve à selva; “ciência”, que esconde ignorância... Sempre uma bandeira que encobre velha mercadoria estragada. Oxalá se torne cada dia mais forte o “teu fanatismo” pela Fé, única defesa da única Verdade!"}, {"n": 934, "chapter": "Propaganda", "text": "Não te assustes nem te espantes com a obtusidade de alguns. Nunca deixará de haver fátuos que esgrimam, com alardes de cultura, a arma da sua ignorância."}, {"n": 935, "chapter": "Propaganda", "text": "Que pena verificar como caminham unidos, por paixões diferentes - mas unidos contra os cristãos, filhos de Deus -, os que odeiam o Senhor e alguns que afirmam estar a seu serviço!"}, {"n": 936, "chapter": "Propaganda", "text": "Em certos ambientes, sobretudo nos da esfera intelectual, percebe-se e apalpa-se como que uma palavra de ordem de seitas, servida às vezes até por católicos, que - com cínica perseverança - mantém e propaga a calúnia, para lançar sombras sobre a Igreja ou sobre pessoas e entidades, contra toda a verdade e toda a lógica. Reza diariamente, com fé: “ut inimicos Sanctae Ecclesiae - inimigos porque são eles que se proclamam assim - humiliare digneris, te rogamus audi nos!”. Confunde, Senhor, os que te perseguem, com a claridade da tua luz, que estamos decididos a propagar."}, {"n": 937, "chapter": "Propaganda", "text": "Dizem que é velha essa idéia do catolicismo, e portanto inaceitável?... - Mais antigo é o sol, e não perdeu a sua luz; mais arcaica a água, e ainda tira a sede e refresca."}, {"n": 938, "chapter": "Propaganda", "text": "Não se pode tolerar que ninguém, nem mesmo com um bom fim, falseie a história ou a vida. - Mas constitui um grande erro levantar um pedestal aos inimigos da Igreja, que consumiram os seus dias em persegui-la. Convence-te: não se falta à verdade histórica se um cristão não colabora na construção de um pedestal que não deve existir: desde quando se pode colocar o ódio como modelo?"}, {"n": 939, "chapter": "Propaganda", "text": "A propaganda cristã não necessita provocar antagonismos, nem maltratar os que não conhecem a nossa doutrina. Se se procede com caridade - “caritas omnia suffert!”, o amor tudo suporta -, quem era contrário, decepcionado com o seu erro, pode acabar aderindo sincera e delicadamente. - Contudo, não tem cabimento fazer concessões no dogma, em nome de uma ingênua “amplidão de critério”, porque quem agisse assim se exporia a ficar fora da Igreja; e, em vez de conseguir o bem para os outros, faria um mal a si mesmo."}, {"n": 940, "chapter": "Propaganda", "text": "O cristianismo é “insólito”, não se acomoda às coisas deste mundo. E esse é talvez o seu “maior inconveniente”, e a bandeira dos mundanos."}, {"n": 941, "chapter": "Propaganda", "text": "Alguns não sabem nada de Deus..., porque não lhes falaram em termos compreensíveis."}, {"n": 942, "chapter": "Propaganda", "text": "Aonde não chegar a tua inteligência, pede que chegue a tua santa esperteza, para servires mais e melhor a todos."}, {"n": 943, "chapter": "Propaganda", "text": "Acredita em mim: o apostolado, a catequese, de ordinário, tem de ser capilar: um a um. Cada homem de fé com o seu companheiro mais próximo. Aos que somos filhos de Deus, importam-nos todas as almas, porque nos importa cada alma."}, {"n": 944, "chapter": "Propaganda", "text": "Ampara-te na Virgem Santíssima, Mãe do Bom Conselho, para que da tua boca jamais saiam ofensas a Deus."}, {"n": 945, "chapter": "Responsabilidade", "text": "Se nós, os cristãos, vivêssemos verdadeiramente de acordo com a nossa fé, produzir-se-ia a maior revolução de todos os tempos... A eficácia da corredenção depende também de cada um de nós! - Medita nisto."}, {"n": 946, "chapter": "Responsabilidade", "text": "Sentir-te-ás plenamente responsável quando compreenderes que, em face de Deus, só tens deveres. Ele já se encarrega de conceder-te direitos!"}, {"n": 947, "chapter": "Responsabilidade", "text": "Oxalá te habitues a ocupar-te diariamente dos outros, com tanta entrega que te esqueças de que existes!"}, {"n": 948, "chapter": "Responsabilidade", "text": "Um pensamento que te ajudará nos momentos difíceis: quanto mais aumentar a minha fidelidade, melhor contribuirei para que os outros cresçam nesta virtude. - E é tão atraente sentirmo-nos sustentados uns pelos outros!"}, {"n": 949, "chapter": "Responsabilidade", "text": "Não sejas “teórico”: são as nossas vidas, em cada jornada, que devem converter esses ideais grandiosos numa realidade cotidiana, heróica e fecunda."}, {"n": 950, "chapter": "Responsabilidade", "text": "De fato, o que é velho merece respeito e agradecimento. Aprender, sim. Ter em conta essas experiências, também. Mas não exageremos: cada coisa a seu tempo. Por acaso vestimos gibão e bombacha, ou cobrimos a nossa cabeça com uma peruca empoada?"}, {"n": 951, "chapter": "Responsabilidade", "text": "Não te zangues: muitas vezes um comportamento irresponsável denota falta de cabeça ou de formação, mais que ausência de bom espírito. Será necessário exigir aos mestres, aos diretores, que preencham essas lacunas com o seu cumprimento responsável do dever. - Será necessário que te examines..., se és tu que ocupas um desses lugares."}, {"n": 952, "chapter": "Responsabilidade", "text": "Corres o grande perigo de conformar-te com viver - ou de pensar que deves viver - como um “bom menino”, que mora numa casa ordenada, sem problemas, e que só conhece a felicidade. Isso é uma caricatura do lar de Nazaré: Cristo, justamente porque trazia a felicidade e a ordem, saiu de lá para propagar esses tesouros entre os homens e mulheres de todos os tempos."}, {"n": 953, "chapter": "Responsabilidade", "text": "Acho muito lógicas as tuas ânsias de que a humanidade inteira conheça a Cristo. mas começa com a responsabilidade de salvar as almas dos que convivem contigo, de santificar cada um dos teus colegas de trabalho ou de estudo... - Esta é a principal missão que o Senhor te confiou."}, {"n": 954, "chapter": "Responsabilidade", "text": "Comporta-te como se dependesse de ti, exclusivamente de ti, o ambiente do lugar em que trabalhas: ambiente de laboriosidade, de alegria, de presença de Deus e de sentido sobrenatural. - Não compreendo a tua abulia. Se tropeças com um grupo de colegas um pouco difícil - que talvez tenha chegado a ser difícil pelo teu descaso -, logo te desinteressas deles, tiras o corpo, e pensas que são um peso morto, um lastro que se opõe às tuas aspirações apostólicas, que não te vão entender... Como queres que te escutem se, além de querer-lhe bem e servi-los com a tua oração e mortificação, não lhe falas?... - Quantas surpresas terás no dia em que te decidas a conversar com um, com outro, e outro! Além disso, se não mudas, poderão exclamar com razão, apontando-te com o dedo: “Hominem non habeo!” - não tenho quem me ajude!"}, {"n": 955, "chapter": "Responsabilidade", "text": "Escuta-me: as coisas santas, quando se vêem santamente, quando se vivem todos os dias santamente..., não se convertem em coisas “de todos os dias”. Todos os afazeres de Jesus Cristo nesta terra foram humanos, e divinos!"}, {"n": 956, "chapter": "Responsabilidade", "text": "Não te podes conformar com viver - dizes - como os outros, com uma fé comum. - Efetivamente, deves ter fé pessoal: com senso de responsabilidade."}, {"n": 957, "chapter": "Responsabilidade", "text": "A Trindade Santíssima concede-te a sua graça, e espera que a aproveites responsavelmente: em face de tanto benefício, não se pode andar com atitudes cômodas, lentas, preguiçosas..., porque, além disso, as almas te esperam."}, {"n": 958, "chapter": "Responsabilidade", "text": "Para ti, que estás tendo esse grande problema. - Se se focaliza bem o assunto, isto é, com um sentido sobrenatural sereno e responsável, sempre se encontra a solução."}, {"n": 959, "chapter": "Responsabilidade", "text": "Ao pegarem os seus filhos ao colo, as mães - as boas mães - procuram não trazer alfinetes que possam ferir essas criaturas... Ao tratarmos com as almas, temos que usar de toda a suavidade... e de toda a energia necessária."}, {"n": 960, "chapter": "Responsabilidade", "text": "“Custos, quid de nocte!” - Sentinela, alerta! Tomara que tu também te acostumes a ter, durante a semana, o teu dia de guarda: para te entregares mais, para viveres com mais amorosa vigilância cada detalhe, para fazeres um pouco mais de oração e de mortificação. Olha que a Santa Igreja é como um grande exército em ordem de batalha. E tu, dentro desse exército, defendes uma “frente”, onde há ataques e lutas e contra-ataques. Compreendes? Essa disposição, ao aproximar-te mais de Deus, incitar-te-á a converter as tuas jornadas, uma após outra, em dias de guarda."}, {"n": 961, "chapter": "Responsabilidade", "text": "No reverso de uma vocação “perdida” ou de uma resposta negativa a essas chamadas constantes da graça, deve-se ver a vontade permissiva de Deus. - Sem dúvida; mas se somos sinceros, bem sabemos que isso não constitui isenção de culpa nem atenuante, porque percebemos no anverso o descumprimento pessoal da Vontade divina, que nos procurou para Si e não encontrou correspondência."}, {"n": 962, "chapter": "Responsabilidade", "text": "Se tu amas de verdade a tua Pátria - e estou certo de que a amas -, perante um alistamento voluntário para defendê-la de um perigo iminente, não duvidarias em inscrever o teu nome. Em momentos de emergência, como já te escrevi, todos são úteis: homens e mulheres; velhos, maduros, jovens e até adolescentes. Só ficam à margem os incapazes e as crianças. Todos os dias se convoca, não há um alistamento voluntário - isso é pouco -, mas uma mobilização geral de almas, para defender o Reino de Cristo. E o próprio Rei, Jesus, te chamou expressamente pelo teu nome. Ele te pede que combatas as batalhas de Deus, pondo a seu serviço o que tens de mais elevado na tua alma: o teu coração, a tua vontade, o teu entendimento, todo o teu ser. - Escuta-me: a carne, com a tua pureza de vida e especialmente com a proteção de Nossa Senhora, não é problema. - Serás tão covarde que tentes livrar-te do chamamento, com a desculpa de que tens doente o coração, a vontade ou o entendimento?... Pretendes justificar-te e ficar nos serviços auxiliares? - O Senhor quer fazer de ti um instrumento de vanguarda - já o és - e, se viras as costas, só mereces compaixão, como traidor!"}, {"n": 963, "chapter": "Responsabilidade", "text": "Se o tempo fosse ouro..., talvez pudesses perdê-lo. - Mas o tempo é vida, e tu não sabes quanta te resta."}, {"n": 964, "chapter": "Responsabilidade", "text": "O Senhor converteu Pedro - que O tinha negado três vezes - sem lhe dirigir sequer uma censura: com um olhar de Amor. - É com esses mesmos olhos que Jesus nos olha, depois das nossas quedas. Oxalá possamos dizer-Lhe, como Pedro: “Senhor, Tu sabes tudo; Tu sabes que eu te amo!”, e mudemos de vida."}, {"n": 965, "chapter": "Responsabilidade", "text": "Alguns argumentam que é em nome da caridade que procedem com delicadeza e compreensão com os que cometem atropelos. - Rogo a Deus que essa delicadeza e essa compreensão não sejam a camuflagem dos seus... respeitos humanos, do seu comodismo!, para permitir que se cometa o mal. Porque então... a sua delicadeza e a sua compreensão só seriam cumplicidade na ofensa a Deus."}, {"n": 966, "chapter": "Responsabilidade", "text": "Não é possível facilitar a conversão de uma alma, à custa de tornar possível a perversão de muitas outras."}, {"n": 967, "chapter": "Responsabilidade", "text": "Se alguém aceitasse que, entre os cordeiros se criassem lobos..., pode-se imaginar com facilidade a sorte que correriam os seus cordeiros."}, {"n": 968, "chapter": "Responsabilidade", "text": "Os homens medíocres, medíocres de cabeça e de espírito cristão, quando constituídos em autoridade, rodeiam-se de néscios: a sua vaidade os persuade, falsamente, de que assim nunca perderão o domínio. Os sensatos, pelo contrário, rodeiam-se de doutos - que ao seu saber acrescentam a limpeza de vida -, e os transformam em homens de governo. Essa humildade não os frustra, pois - ao engrandecerem os outros - se engrandecem a si próprios."}, {"n": 969, "chapter": "Responsabilidade", "text": "Não é prudente elevar homens inéditos a uma tarefa importante de direção, para ver o que acontece. - Como se o bem comum pudesse depender uma caixa de surpresas!"}, {"n": 970, "chapter": "Responsabilidade", "text": "Estás constituído em autoridade, e atuas guiado pelo que os homens dirão? - Velho caduco! - Primeiro, deve importar-te o que Deus dirá; depois - muito em segundo lugar, e às vezes nunca -, terás de ponderar o que os outros podem pensar. “Todo aquele que me reconhecer diante dos homens - diz o Senhor -, eu também o reconhecerei diante de meu Pai que está nos céus. Mas aquele que me negar diante dos homens, eu também o negarei diante de meu Pai que está nos céus”."}, {"n": 971, "chapter": "Responsabilidade", "text": "Tu, que ocupas um posto de responsabilidade, ao exercer a tua tarefa, lembra-te disto: tudo o que é pessoal perece com a pessoa que se fez imprescindível."}, {"n": 972, "chapter": "Responsabilidade", "text": "Uma norma fundamental de bom governo: distribuir responsabilidades, sem que isto signifique procurar a comodidade ou o anonimato. Insisto, distribuir responsabilidades: pedindo contas a cada um do seu encargo, para poder “prestar contas” a Deus; e à almas, se for preciso."}, {"n": 973, "chapter": "Responsabilidade", "text": "Ao resolveres os assuntos, procura nunca exagerar a justiça ao ponto de esqueceres a caridade."}, {"n": 974, "chapter": "Responsabilidade", "text": "A resistência de uma corrente mede-se pelo elo mais fraco."}, {"n": 975, "chapter": "Responsabilidade", "text": "Não digas de nenhum dos teus subordinados: não presta. - Quem não presta és tu: porque não sabes colocá-los no lugar em que podem funcionar bem."}, {"n": 976, "chapter": "Responsabilidade", "text": "Rejeita a ambição de honras; contempla, pelo contrário, os instrumentos, os deveres e a eficácia. - Assim, não ambicionarás os cargos e, se te chegam, hás de olhá-los na sua justa medida: cargas a serviço das almas."}, {"n": 977, "chapter": "Responsabilidade", "text": "Na hora do desprezo da Cruz, Nossa Senhora está la, perto do seu Filho, decidida a correr a sua mesma sorte. - Percamos o medo de nos comportarmos como cristãos responsáveis, quando isso não é cômodo no ambiente em que nos desenvolvemos: Ela nos ajudará."}, {"n": 978, "chapter": "Penitência", "text": "Nosso Senhor Jesus assim o quer: é preciso segui-lo de perto. Não há outro caminho. Essa é a obra do Espírito Santo em cada alma - na tua -: sê dócil, não oponhas obstáculos a Deus, até que faça da tua pobre carne em Crucifixo."}, {"n": 979, "chapter": "Penitência", "text": "Se a palavra amor sai muitas vezes da boca, sem estar escorada em pequenos sacrifícios, chega a cansar."}, {"n": 980, "chapter": "Penitência", "text": "Sob todos os pontos de vista, a mortificação é de uma importância extraordinária. - Por razões humanas, pois quem não sabe dominar-se a si mesmo jamais influirá positivamente nos outros, e o ambiente o vencerá, sempre que afague os seus gostos pessoais: será um homem sem energia, incapaz de um esforço grande quando for preciso. - Por razões divinas: não te parece justo que, com estes pequenos atos, demonstremos o nosso amor e acatamento. Àquele que deu tudo por nós?"}, {"n": 981, "chapter": "Penitência", "text": "O espírito de mortificação brota, não tanto como manifestação de Amor, mas como das suas conseqflências. Se falhas nessas pequenas provas - reconhece-o -, fraqueja o teu amor pelo Amor."}, {"n": 982, "chapter": "Penitência", "text": "Não reparaste que as almas mortificadas, pela sua simplicidade, até neste mundo desfrutam mais das coisas boas?"}, {"n": 983, "chapter": "Penitência", "text": "Sem mortificação, não há felicidade na terra."}, {"n": 984, "chapter": "Penitência", "text": "Quando te decidires a ser mortificado, melhorará a tua vida e serás muito mais fecundo."}, {"n": 985, "chapter": "Penitência", "text": "Não devemos esquecê-lo: em todas as atividades humanas, tem que haver homens e mulheres com a Cruz de Cristo na sua vida e nas suas obras, erguida ao alto, visível, reparadora; símbolo da paz, da alegria; símbolo da Redenção, da unidade do gênero humano, do amor que Deus Pai, Deus Filho e Deus Espírito Santo, a Trindade Santíssima teve e continua a ter pela humanidade."}, {"n": 986, "chapter": "Penitência", "text": "“Não irá rir, Padre, se lhe disser que - faz uns dias - me surpreendi oferecendo ao Senhor, de uma maneira espontânea, o sacrifício de tempo que supunha para mim ter de consertar um brinquedo estragado de um dos meus filhos?” - Não sorrio, fico feliz! Porque, com esse mesmo Amor, Deus se ocupa de recompor os nossos estragos."}, {"n": 987, "chapter": "Penitência", "text": "Sê mortificado, mas não insípido nem amargurado. - Sê recolhido, mas não encolhido."}, {"n": 988, "chapter": "Penitência", "text": "Um dia sem mortificação é um dia perdido, porque não nos negamos a nós mesmos, não vivemos o holocausto."}, {"n": 989, "chapter": "Penitência", "text": "Não contrariaste alguma vez, em alguma coisa, os teus gostos, os teus caprichos? - Olha que Quem te pede isso está pregado numa Cruz - sofrendo em todos os seus sentidos e potências -, e uma coroa de espinhos cobre a sua cabeça... por ti."}, {"n": 990, "chapter": "Penitência", "text": "Apresentas-te como um teórico formidável... - Mas não cedes nem em miudezas insignificantes! - Não acredito nesse teu espírito de mortificação!"}, {"n": 991, "chapter": "Penitência", "text": "Cuidar das pequenas coisas representa uma mortificação constante, caminho para tornar mais agradável a vida dos outros."}, {"n": 992, "chapter": "Penitência", "text": "Prefiro as virtudes às austeridades, diz Yavé com outras palavras ao povo escolhido, que se engana com certos formalismos externos. - Por isso, temos de cultivar a penitência e a mortificação, como provas verdadeiras de amor a Deus e ao próximo."}, {"n": 993, "chapter": "Penitência", "text": "Na meditação, a Paixão de Cristo sai do marco frio da história ou da consideração piedosa, para se apresentar diante dos olhos, terrível, opressiva, cruel, sangrante..., cheia de Amor. - E sente-se que o pecado não se reduz a uma pequena “falta de ortografia”: é crucificar, rasgar a marteladas as mãos e os pés do Filho de Deus, e fazer-Lhe saltar o coração."}, {"n": 994, "chapter": "Penitência", "text": "Se de verdade desejas ser alma penitente - penitente e alegre -, deves defender, acima de tudo, os teus tempos diários de oração - de oração íntima, generosa, prolongada -, e hás de procurar que esses tempos não sejam quando calhar, mas a hora certa, sempre que te seja possível. Não cedas nestes detalhes. Sê escravo deste culto cotidiano a Deus, e eu te asseguro que te sentirás constantemente alegre."}, {"n": 995, "chapter": "Penitência", "text": "O cristão triunfa sempre do algo da Cruz, a partir da sua própria renúncia, porque assim deixa atuar a Onipotência divina."}, {"n": 996, "chapter": "Penitência", "text": "Quando recordares a tua vida passada, passada sem pena nem glória, considera quanto tempo tens perdido e como o podes recuperar: com penitência e com maior entrega."}, {"n": 997, "chapter": "Penitência", "text": "Ao pensares em todas as coisas da tua vida que ficarão sem valor não as teres oferecido a Deus, deverias sentir-te avaro: ansioso por apanhar tudo, por não desaproveitar também nenhuma dor. - Porque, se a dor acompanha a criatura, o que é senão insensatez desperdiça-la?"}, {"n": 998, "chapter": "Penitência", "text": "Tens espírito de oposição, de contradição?... Muito bem: exercita-o em opor - te, em contradizer-te a ti mesmo!"}, {"n": 999, "chapter": "Penitência", "text": "Enquanto a Sagrada Família descansa, aparece o Anjo a José, para que fujam para o Egito. Maria e José pegam o Menino e empreendem o caminho sem demora. Não se revoltam, não se desculpam, não esperam que a noite termine... Dize à Nossa Mãe Santa Maria e ao Nosso Pai e Senhor São José que desejamos amar com prontidão toda a penitência passiva."}, {"n": 1000, "chapter": "Penitência", "text": "Escrevo este número para que tu e eu acabemos o livro sorrindo, e fiquem tranqflilos os benditos leitores que, por simplicidade ou malícia, buscaram o “esotérico” nos 999 pontos de “Caminho”. Josemaria Escrivá nasceu em Barbastro (Huesca, Espanha), em 9 de janeiro de 1902. Seus pais chamavam-se José e Dolores. Teve cinco irmãos: Carmen (1899-1957), Santiago (1919-1994) e outras três irmãs menores do que ele, que faleceram ainda pequenas. O casal Escrivá deu aos seus filhos uma profunda educação cristã. Em 1915, a indústria de tecidos do pai abre falência, e ele tem de mudar-se para Logronho, onde encontrou outro emprego. Nessa cidade, Josemaria dá-se conta pela primeira vez da sua vocação: depois de ver umas pegadas na neve dos pés descalços de um religioso, intui que Deus deseja alguma coisa dele, embora não saiba exatamente o quê. Pensa que poderá descobri-lo mais facilmente se se fizer sacerdote, e começa a preparar-se, primeiro em Logronho e, mais tarde, no seminário de Saragoça. Seguindo um conselho de seu pai, cursa na Universidade de Saragoça a Faculdade de Direito, como aluno livre. Seu pai morre em 1924, e ele fica como chefe de família. Recebe a ordenação sacerdotal em 28 de março de 1925 e começa a exercer o ministério numa paróquia rural e depois em Saragoça. Em 1927, transfere-se para Madrid, com permissão do seu bispo, a fim de doutorar-se em Direito. Ali, no dia 2 de outubro de 1928, Deus faz-lhe ver a missão que lhe vinha inspirando havia anos, e funda o Opus Dei. A partir desse momento, passa a trabalhar com todas as suas forças no desenvolvimento da fundação que Deus lhe pede, ao mesmo tempo que continua a exercer o ministério pastoral que lhe fora encomendado naqueles anos, e que o punha diariamente em contato com a doença e a pobreza dos hospitais e bairros populares de Madrid. Quando eclode a guerra civil, em 1936, encontra-se em Madrid. A perseguição religiosa obriga-o a refugiar-se em diferentes lugares. Exerce o seu ministério sacerdotal clandestinamente, até que consegue sair de Madrid. Depois de atravessar os Pireneus até o sul da França, instala-se em Burgos. Quando termina a guerra, em 1939, volta a Madrid. Nos anos seguintes, dirige numerosos retiros espirituais para leigos, sacerdotes e religiosos. Nesse mesmo ano de 1939, conclui os estudos de doutorado em Direito. Em 1946, fixa a sua residência em Roma. Obtém o Doutorado em Teologia pela Universidade Lateranense. É nomeado consultor de duas Congregações vaticanas, membro honorário da Pontifícia Academia de Teologia e Prelado de honra de Sua Santidade. Acompanha com atenção os preparativos e as sessões do Concílio Vaticano II (1962-1965) e mantém um relacionamento intenso com muitos padres conciliares. De Roma, faz numerosas viagens a diversos países europeus para impulsionar o estabelecimento e a consolidação do Opus Dei nesses lugares. Com o mesmo objetivo, realiza entre 1970 e 1975 longas viagens até o México, a Península Ibérica, a América do Sul e Guatemala, e nelas também tem reuniões de catequese com grupos numerosos de homens e mulheres. Falece em Roma no dia 26 de junho de 1975. Vários milhares de pessoas, entre elas muitos bispos de diversos países - quase um terço do episcopado mundial -, solicitam à Santa Sé a abertura da sua causa de canonização. No dia 17 de maio de 1992, João Paulo II beatifica Josemaria Escrivá. Proclama-o santo dez anos depois, em 6 de outubro de 2002, na Praça de São Pedro, em Roma, diante de uma grande multidão. «Seguindo as suas pegadas», disse o Papa nessa ocasião na sua homilia, « difundam na sociedade, sem distinção de raça, classe, cultura ou idade, a consciência de que todos estamos chamados à santidade» Fonte: Opusdei.org.br"}]}, {"slug": "forja", "title": "Forja", "total": 1055, "chapters": [{"n": 1, "title": "Deslumbramento", "start": 1, "end": 57}, {"n": 2, "title": "Luta", "start": 58, "end": 157}, {"n": 3, "title": "Derrota", "start": 158, "end": 215}, {"n": 4, "title": "Pessimismo", "start": 216, "end": 285}, {"n": 5, "title": "Podes!", "start": 286, "end": 376}, {"n": 6, "title": "Tornar a lutar", "start": 377, "end": 474}, {"n": 7, "title": "Ressurgir", "start": 475, "end": 587}, {"n": 8, "title": "Vitória", "start": 588, "end": 677}, {"n": 9, "title": "Labor", "start": 678, "end": 749}, {"n": 10, "title": "Crisol", "start": 750, "end": 854}, {"n": 11, "title": "Seleção", "start": 855, "end": 911}, {"n": 12, "title": "Fecundidade", "start": 912, "end": 986}, {"n": 13, "title": "Eternidade", "start": 987, "end": 1055}], "points": [{"n": 1, "chapter": "Deslumbramento", "text": "Filhos de Deus. - Portadores da única chama capaz de iluminar os caminhos terrenos das almas, do único fulgor em que nunca se poderão dar escuridões, penumbras ou sombras. - O Senhor serve-se de nós como tochas, para que essa luz ilumine... De nós depende que muitos não permaneçam em trevas, mas andem por caminhos que levam até à vida eterna."}, {"n": 2, "chapter": "Deslumbramento", "text": "- Deus é meu Pai! - Se meditares nisto, não sairás dessa consoladora consideração. - Jesus é meu Amigo íntimo! (outra descoberta), que me ama com toda a divina loucura do seu Coração. - O Espírito Santo é meu Consolador!, que me guia nos passos de todo o meu caminho. Pensa bem nisso. - Tu és de Deus..., e Deus é teu."}, {"n": 3, "chapter": "Deslumbramento", "text": "Meu Pai - trata-O assim, com confiança! -, que estás nos Céus, olha-me com Amor compassivo, e faz que eu te corresponda. - Derrete e inflama o meu coração de bronze, queima e purifica a minha carne não mortificada, enche o meu entendimento de luzes sobrenaturais, faz que a minha língua seja pregoeira do Amor e da Glória de Cristo."}, {"n": 4, "chapter": "Deslumbramento", "text": "Cristo, que subiu à Cruz com os braços abertos de par em par, com gesto de Sacerdote Eterno, quer contar conosco - que não somos nada! - para levar a “todos” os homens os frutos da sua Redenção."}, {"n": 5, "chapter": "Deslumbramento", "text": "Estamos com gosto, Senhor, na tua mão chagada. Aperta-nos com força!, espreme-nos!, que percamos toda a miséria terrena!, que nos purifiquemos, que nos inflamemos, que nos sintamos embebidos no teu Sangue! - E depois, lança-nos longe!, longe, com fomes de messe, a uma semeadura cada dia mais fecunda, por Amor de Ti."}, {"n": 6, "chapter": "Deslumbramento", "text": "Não tenhas medo, nem te assustes, nem te espantes, nem te deixes levar por uma falsa prudência. A chamada para cumprir a Vontade de Deus - e bem assim a vocação - é repentina, como a dos Apóstolos: encontrar Cristo e seguir o seu chamamento... - Nenhum deles duvidou: conhecer Cristo e segui-Lo foi tudo uma só coisa."}, {"n": 7, "chapter": "Deslumbramento", "text": "Chegou para nós um dia de salvação, de eternidade. Uma vez mais se ouvem esses silvos do Pastor Divino, essas palavras carinhosas: “Vocavi te nomine tuo” - Eu te chamei pelo teu nome. Ele nos convida, como a nossa mãe, pelo nome. Mais ainda: pelo apelido carinhoso, familiar. - Lá na intimidade da alma, Ele chama, e é preciso responder: “Ecce ego, quia vocasti me” - aqui estou, porque me chamaste, decidido a não permitir que, desta vez, o tempo passe como a água sobre as pedras, sem deixar rasto."}, {"n": 8, "chapter": "Deslumbramento", "text": "Tens de viver junto de Cristo! Deves ser, no Evangelho, um personagem mais, convivendo com Pedro, com João, com André..., porque Cristo também vive agora: “Iesus Christus, heri et hodie, ipse et in saecula!” - Jesus Cristo vive!, hoje como ontem: é o mesmo, pelos séculos dos séculos."}, {"n": 9, "chapter": "Deslumbramento", "text": "Senhor, que os teus filhos sejam como uma brasa incandescente, sem labaredas que se vejam de longe. Uma brasa que prenda o primeiro ponto de ignição em cada coração que tenham perto de si... - Tu farás que essa fagulha se converta num incêndio: os teus Anjos - bem o sei, porque o tenho visto - são muito entendidos em soprar sobre o rescaldo dos corações..., e um coração sem cinzas não pode deixar de ser teu."}, {"n": 10, "chapter": "Deslumbramento", "text": "Pensa no que diz o Espírito Santo, e enche-te de pasmo e agradecimento: “Elegit nos ante mundi constitutionem” - escolheu-nos antes de criar o mundo -, “ut essemus sancti in conspectu eius!” - para que sejamos santos na sua presença. - Ser santo não é fácil, mas também não é difícil. Ser santo é ser bom cristão: parecer-se com Cristo. - Aquele que mais se parece com Cristo, esse é mais cristão, mais de Cristo, mais santo. - E que meios temos? - Os mesmos dos primeiros fiéis, que viram Jesus ou O entreviram através dos relatos dos Apóstolos ou dos Evangelistas."}, {"n": 11, "chapter": "Deslumbramento", "text": "Que dívida a tua para com teu Pai-Deus! - Ele te deu o ser, a inteligência, a vontade... Deu-te a graça: o Espírito Santo; Jesus, na Hóstia; a filiação divina; a Santíssima Virgem, Mãe de Deus e Mãe nossa. Deu-te a possibilidade de participares na Santa Missa e te concede o perdão dos teus pecados, tantas vezes o seu perdão! Deu-te dons sem conta, alguns extraordinários... - Diz-me, filho: como tens correspondido?, como correspondes?"}, {"n": 12, "chapter": "Deslumbramento", "text": "Não sei o que se passará contigo..., mas eu preciso confiar-te a minha emoção interior, depois de ler as palavras do profeta Isaías: “Ego vocavi te nomine tuo, meus es tu!” - Eu te chamei, Eu te trouxe à minha Igreja, tu és meu! Que Deus me diga a mim que sou dEle! É para ficar louco de Amor!"}, {"n": 13, "chapter": "Deslumbramento", "text": "Repara bem: há muitos homens e mulheres no mundo, e nem a um só deles deixa o Mestre de chamar. Chama-os a uma vida cristã, a uma vida de santidade, a uma vida de eleição, a uma vida eterna."}, {"n": 14, "chapter": "Deslumbramento", "text": "Cristo padeceu por ti e para ti, para te arrancar da escravidão do pecado e da imperfeição."}, {"n": 15, "chapter": "Deslumbramento", "text": "Nestes momentos de violência, de sexualidade brutal, selvagem, temos de ser rebeldes. Tu e eu somos rebeldes: não nos dá na gana deixar-nos levar pela corrente, e ser uns animais. Queremos portar-nos como filhos de Deus, como homens ou mulheres muito chegados a seu Pai, que está nos Céus e quer estar muito perto - dentro! - de cada um de nós."}, {"n": 16, "chapter": "Deslumbramento", "text": "Medita nisto com freqflência: sou católico, filho da Igreja de Cristo! Ele me fez nascer num lar “seu”, sem nenhum mérito da minha parte. - Quanto te devo, meu Deus!"}, {"n": 17, "chapter": "Deslumbramento", "text": "Recordai a todos - e de modo especial a tantos pais e a tantas mães de família que se dizem cristãos - que a “vocação”, a chamada de Deus, é uma graça do Senhor, uma escolha feita pela bondade divina, um motivo de santo orgulho, um servir a todos com gosto por amor a Jesus Cristo."}, {"n": 18, "chapter": "Deslumbramento", "text": "Serve-me de eco: não é um sacrifício, para os pais, que Deus lhes peça os filhos; nem, para aqueles que o Senhor chama, é um sacrifício segui-Lo. Pelo contrário, é uma honra imensa, um orgulho grande e santo, uma prova de predileção, um carinho particularíssimo, que Deus manifestou num momento concreto, mas que estava na sua mente desde toda a eternidade."}, {"n": 19, "chapter": "Deslumbramento", "text": "Agradece a teus pais o fato de te terem dado a vida, para poderes ser filho de Deus. - E sê ainda mais agradecido, se foram eles que puseram na tua alma o primeiro germe da fé, da piedade, do teu caminho de cristão ou da tua vocação."}, {"n": 20, "chapter": "Deslumbramento", "text": "Há muitas pessoas à tua volta, e não tens o direito de ser obstáculo ao seu bem espiritual, à sua felicidade eterna. - Tens obrigação de ser santo: de não decepcionar Deus pela escolha de que te fez objeto; nem tampouco essas criaturas que tanto esperam da tua vida de cristão."}, {"n": 21, "chapter": "Deslumbramento", "text": "O mandamento de amar os pais é de direito natural e de direito divino positivo, e eu o tenho chamado sempre “dulcíssimo preceito”. - Não descures a tua obrigação de amar cada dia mais os teus, de mortificar-te por eles, de rezar por eles e de lhes agradecer todo o bem que lhes deves."}, {"n": 22, "chapter": "Deslumbramento", "text": "Tal como quer o Mestre, tu tens de ser - bem metido neste mundo, em que nos toca viver, e em todas as atividades dos homens - sal e luz. - Luz que ilumina as inteligências e os corações; sal que dá sabor e preserva da corrupção. Por isso, se te faltar ímpeto apostólico, far-te-ás insípido e inútil, lograrás os outros e a tua vida será um absurdo."}, {"n": 23, "chapter": "Deslumbramento", "text": "Uma onda suja e podre - vermelha e verde - empenha-se em submergir a terra, cuspindo a sua porca saliva sobre a Cruz do Redentor... E Ele quer que das nossas almas saia outra onda - branca e poderosa, como a destra do Senhor -, que afogue, com a sua pureza, a podridão de todo o materialismo e neutralize a corrupção que inundou o orbe: é para isso que vêm - e para mais - os filhos de Deus."}, {"n": 24, "chapter": "Deslumbramento", "text": "Muitos, com ares de auto-justificação, se interrogam: - Eu, por que hei de meter-me na vida dos outros? - Porque tens obrigação, como cristão, de meter-te na vida dos outros, para servi-los! - Porque Cristo se meteu na tua vida e na minha!"}, {"n": 25, "chapter": "Deslumbramento", "text": "Se és outro Cristo, se te comportas como filho de Deus, onde estiveres queimarás: Cristo abrasa, não deixa indiferentes os corações."}, {"n": 26, "chapter": "Deslumbramento", "text": "Dói ver que, depois de dois mil anos, há tão poucos que se chamem cristãos no mundo. E que, dos que se chamam cristãos, há tão poucos que vivam a verdadeira doutrina de Jesus Cristo. Vale a pena jogar a vida inteira!: trabalhar e sofrer, por Amor, para levar avante os desígnios de Deus, para corredimir."}, {"n": 27, "chapter": "Deslumbramento", "text": "Vejo a tua Cruz, meu Jesus, e gozo da tua graça, porque o prêmio do teu Calvário foi para nós o Espírito Santo... E Tu te entregas a mim, cada dia, amoroso - louco! - na Hóstia Santíssima..., e me fizeste filho de Deus!, e me deste a tua Mãe. Não me basta a ação de graças; escapa-me o pensamento: - Senhor, Senhor, tantas almas longe de Ti! Fomenta na tua vida as ânsias de apostolado, para que O conheçam..., e O amem..., e se sintam amados!"}, {"n": 28, "chapter": "Deslumbramento", "text": "Algumas vezes - ouviste-me comentar isso com freqflência -, fala-se do amor como se fosse um impulso para a auto-satisfação, ou um mero recurso para completar de modo egoísta a própria personalidade. - E sempre te disse que não é assim: o amor verdadeiro exige que saiamos de nós mesmos, que nos entreguemos. O autêntico amor traz consigo a alegria: uma alegria que tem as suas raízes em forma de Cruz."}, {"n": 29, "chapter": "Deslumbramento", "text": "Meu Deus, como é possível que eu veja um Crucifixo e não clame de dor e de amor?"}, {"n": 30, "chapter": "Deslumbramento", "text": "Admira-te ante a magnanimidade de Deus: fez-se Homem para nos redimir, para que tu e eu - que não valemos nada, reconhece-o! - O tratemos com confiança."}, {"n": 31, "chapter": "Deslumbramento", "text": "Õ Jesus..., fortalece as nossas almas, aplaina o caminho e, sobretudo, embriaga-nos de Amor! Converte-nos assim em fogueiras vivas, que incendeiem a terra com o fogo divino que Tu trouxeste."}, {"n": 32, "chapter": "Deslumbramento", "text": "Aproximar-se um pouco mais de Deus quer dizer estar disposto a uma nova conversão, a uma nova retificação, a escutar atentamente as suas inspirações - os santos desejos que faz brotar em nossas almas - e a pô-los em prática."}, {"n": 33, "chapter": "Deslumbramento", "text": "De que te envaideces? - Todo o impulso que te move é dEle. Atua em conseqflência."}, {"n": 34, "chapter": "Deslumbramento", "text": "Que respeito, que veneração, que carinho temos de sentir por uma só alma, ante a realidade de que Deus a ama como coisa sua!"}, {"n": 35, "chapter": "Deslumbramento", "text": "Aspiração: oxalá queiramos usar os dias, que o Senhor nos dá, unicamente para agradar-Lhe!"}, {"n": 36, "chapter": "Deslumbramento", "text": "Desejo que o teu comportamento seja como o de Pedro e o de João: que consideres na tua oração, para falar com Jesus, as necessidades dos teus amigos, dos teus colegas..., e que depois, com o teu exemplo, possas dizer - lhes: “Respice in nos!” - olhai-me!"}, {"n": 37, "chapter": "Deslumbramento", "text": "Quando se ama muito uma pessoa, deseja-se saber tudo o que a ela se refere. - Medita nisto: tens fome de conhecer Cristo? Porque... é com essa medida que O amas."}, {"n": 38, "chapter": "Deslumbramento", "text": "Mentem - ou estão enganados - os que afirmam que nós, os sacerdotes, estamos sós: estamos mais acompanhados do que ninguém, porque contamos com a contínua companhia do Senhor, com quem temos de manter um trato ininterrupto. - Somos enamorados do Amor, do Autor do Amor!"}, {"n": 39, "chapter": "Deslumbramento", "text": "Vejo-me como um pobre passarinho que, acostumado a voar somente de árvore em árvore ou, quando muito, até à varanda de um terceiro andar..., um dia, na sua vida, se encheu de brios para chegar até o telhado de um modesto prédio, que não era precisamente um arranha-céus... Mas eis que o nosso pássaro é arrebatado por uma águia - que o tomou erradamente por uma cria da sua raça - e, entre aquelas garras poderosas, o passarinho sobe, sobe muito alto, acima das montanhas da terra e dos cumes nevados, acima das nuvens brancas e azuis e rosáceas, mais acima ainda, até olhar o sol de frente... E então a águia, soltando o passarinho, diz-lhe: anda lá, voa! - Senhor, que eu não torne a voar colado à terra!, que esteja sempre iluminado pelos raios do divino Sol - Cristo - na Eucaristia!, que o meu vôo não se interrompa enquanto não alcançar o descanso do teu Coração!"}, {"n": 40, "chapter": "Deslumbramento", "text": "Assim concluía a sua oração aquele nosso amigo: “Amo a Vontade do meu Deus. Por isso, em completo abandono, que Ele me leve como e por onde quiser”."}, {"n": 41, "chapter": "Deslumbramento", "text": "Pede ao Pai, ao Fi
