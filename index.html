deslumbrantes, pobre burrico!, não esqueças que “podes”, por tua culpa, jogar a bela carga ao chão..., mas tu sozinho “não podes” voltar a carregá-la sobre ti."}, {"n": 331, "chapter": "Podes!", "text": "Descansa na filiação divina. Deus é um Pai - o teu Pai! - cheio de ternura, de infinito amor. Chama-Lhe Pai muitas vezes, e diz-Lhe - a sós - que O amas, que O amas muitíssimo!: que sentes o orgulho e a força de ser seu filho."}, {"n": 332, "chapter": "Podes!", "text": "A alegria é conseqflência necessária da filiação divina, de nos sabermos queridos com predileção pelo nosso Pai-Deus, que nos acolhe, nos ajuda e nos perdoa. - Lembra-te bem e sempre disto: mesmo que alguma vez pareça que tudo vem abaixo, nada vem abaixo!, porque Deus não perde batalhas."}, {"n": 333, "chapter": "Podes!", "text": "A maior prova de agradecimento a Deus é amarmos apaixonadamente a nossa condição de filhos seus."}, {"n": 334, "chapter": "Podes!", "text": "Estás como o pobre-diabo que de repente fica sabendo que é filho do Rei! - Por isso, já só te preocupa na terra a Glória - toda a Glória - de teu Pai-Deus."}, {"n": 335, "chapter": "Podes!", "text": "Menino amigo, diz-Lhe: - Jesus, sabendo que te amo e que me amas, o resto pouco me importa: tudo vai bem."}, {"n": 336, "chapter": "Podes!", "text": "- Pedi muito a Nossa Senhora, afirmavas-me. E te corrigias: - Digo mal, expus muito a Nossa Senhora."}, {"n": 337, "chapter": "Podes!", "text": "“Tudo posso nAquele que me conforta”. Com Ele, não há possibilidade de fracasso, e desta persuasão nasce o santo “complexo de superioridade” para enfrentarmos as tarefas com espírito de vencedores, porque Deus nos concede a sua fortaleza."}, {"n": 338, "chapter": "Podes!", "text": "Diante da tela, com ânsias de superação, exclamava aquele artista: - Senhor, quero pintar para ti trinta e oito corações, trinta e oito anjos desfazendo-se sempre em amor por Ti: trinta e oito maravilhas bordadas no teu céu, trinta e oito sóis no teu manto, trinta e oito chamas, trinta e oito amores, trinta e oito loucuras, trinta e oito alegrias... Depois, humilde, reconhecia: - Isso é a imaginação e o desejo. A realidade são trinta e oito figuras pouco conseguidas que, mais do que dar satisfação, mortificam a vista."}, {"n": 339, "chapter": "Podes!", "text": "Não podemos ter a pretensão de que os Anjos nos obedeçam... Mas temos a absoluta certeza de que os Santos Anjos nos ouvem sempre."}, {"n": 340, "chapter": "Podes!", "text": "Deixa-te conduzir por Deus. Levar-te-á pelo “seu caminho”, servindo-se de adversidades sem conta..., e talvez até da tua mandriice, para que se veja que a tua tarefa, é Ele quem a realiza."}, {"n": 341, "chapter": "Podes!", "text": "Pede-Lhe sem medo, insiste. Lembra-te da cena que o Evangelho nos relata acerca da multiplicação dos pães. - Olha com que magnanimidade responde Ele aos Apóstolos: - Quantos pães tendes? Cinco?... Que me pedis?... E Ele dá seis, cem, milhares... Por quê? - Porque Cristo vê as nossas necessidades com uma sabedoria divina, e com a sua onipotência pode e chega mais longe do que os nossos desejos. O Senhor vai além da nossa pobre lógica e é infinitamente generoso!"}, {"n": 342, "chapter": "Podes!", "text": "Quando se trabalha por Deus, é preciso ter “complexo de superioridade”, indiquei-te. - Mas, perguntavas-me, isso não é uma manifestação de soberba? - Não! É uma consequência da humildade, de uma humildade que me faz dizer: - Senhor, Tu és quem és. Eu sou a negação. Tu tens todas as perfeições: o poder, a fortaleza, o amor, a glória, a sabedoria, o império, a dignidade... Se eu me unir a Ti, como um filho quando se põe nos braços fortes de seu pai ou no regaço maravilhoso de sua mãe, sentirei o calor da tua divindade, sentirei as luzes da tua sabedoria, sentirei correr pelo meu sangue a tua fortaleza."}, {"n": 343, "chapter": "Podes!", "text": "Se tiveres presença de Deus, por cima da tempestade que ensurdece, brilhará sempre o sol no teu olhar; e, por baixo das ondas tumultuosas e devastadoras, reinarão na tua alma a calma e a serenidade."}, {"n": 344, "chapter": "Podes!", "text": "Para um filho de Deus, cada jornada tem que ser uma ocasião de renovar - se, na certeza de que, ajudado pela graça, chegará ao termo do caminho, que é o Amor. Por isso, se começas e recomeças, andas bem. Se tens moral de vitória, se lutas, com o auxílio de Deus, vencerás! Não há dificuldade que não possas superar!"}, {"n": 345, "chapter": "Podes!", "text": "Chega-te a Belém, aproxima-te do Menino, embala-O, diz-Lhe um monte de coisas ardentes, aperta-O contra o coração... - Não falo de criancices: falo de amor! E o amor manifesta-se com fatos: na intimidade da tua alma, bem O podes abraçar!"}, {"n": 346, "chapter": "Podes!", "text": "Manifestemos a Jesus que somos crianças. E as crianças, as crianças pequeninas e simples, quanto não sofrem para subir um degrau! Parece que estão ali perdendo o tempo. Finalmente, subiram. Agora, outro degrau. Com as mãos e os pés, e com o impulso de todo o corpo, conseguem um novo triunfo: mais um degrau. E volta a começar. Que esforços! Já faltam poucos..., mas então um tropeção... e zás!... lá em baixo. Toda machucada, inundada de lágrimas, a pobre criança começa, recomeça a subida. Assim nós, Jesus, quando estamos sós. Toma-nos Tu em teus braços amáveis, como um Amigo grande e bom da criança simples; não nos soltes até que estejamos lá em cima; e então - oh, então! - saberemos corresponder ao teu Amor Misericordioso, com audácias infantis, dizendo - te, doce Senhor, que, a não ser Maria e José, não houve nem haverá mortal algum - e os tem havido muito loucos - que te ame como eu te amo."}, {"n": 347, "chapter": "Podes!", "text": "Não te importes de fazer pequenas criancices, aconselhei-te: enquanto esses atos não forem rotineiros, não serão estéreis. - Um exemplo: suponhamos que uma alma, que caminha pela via da infância espiritual, se sente movida a cobrir com um agasalho cada noite, à hora de dormir, uma imagem de madeira da Santíssima Virgem. A cabeça insurge-se contra semelhante ação, por lhe parecer claramente inútil. Mas a alma pequena, tocada pela graça, vê perfeitamente que uma criança, por amor, agiria assim. Então, a vontade varonil, que têm todos os que são espiritualmente pequeninos, levanta-se, obrigando a cabeça a render-se... E se aquela alma infantil continua agasalhando cada dia a imagem de Nossa Senhora, também cada dia faz uma pequena criancice fecunda aos olhos de Deus."}, {"n": 348, "chapter": "Podes!", "text": "Quando fores sinceramente criança e seguires por caminhos de infância - se o Senhor te leva por aí -, serás invencível."}, {"n": 349, "chapter": "Podes!", "text": "Um pedido confiante de filho pequeno: - Eu quereria, Senhor, uma compunção como a que tiveram os que mais te souberam agradar."}, {"n": 350, "chapter": "Podes!", "text": "Menino, deixarás de sê-lo se alguém ou alguma coisa se interpuser entre Deus e ti."}, {"n": 351, "chapter": "Podes!", "text": "Não devo pedir nada a Jesus: limitar-me-ei a dar-Lhe gosto em tudo e a contar-Lhe as coisas como se Ele não as soubesse, tal como uma criança faz com seu pai."}, {"n": 352, "chapter": "Podes!", "text": "Menino, diz a Jesus: - Não me conformo com menos do que Contigo."}, {"n": 353, "chapter": "Podes!", "text": "Na tua oração de infância espiritual, que coisas tão pueris dizes ao teu Senhor! Com a confiança de um menino que fala com o amigo grande, de cujo amor tem certeza, tu Lhe confias: - Que eu viva somente para a tua Glória! Recordas e reconheces lealmente que fazes tudo mal: - Isso, meu Jesus - acrescentas -, não pode chamar-te a atenção: é impossível que eu faça alguma coisa direito. Ajuda-me Tu, faze-o Tu por mim e verás como sai bem. Depois, audazmente e sem te afastares da verdade, continuas: - Empapa - me, embriaga-me com o teu Espírito, e assim farei a tua Vontade. Quero fazê-la. Se não a faço..., é porque não me ajudas. Mas é claro que me ajudas!"}, {"n": 354, "chapter": "Podes!", "text": "Tens de sentir a necessidade de te veres pequeno, desprovido de tudo, fraco. Então lançar-te-ás no regaço da nossa Mãe do Céu, com jaculatórias, com olhares de afeto, com práticas de piedade mariana..., que estão na entranha do teu espírito filial. - Ela te protegerá."}, {"n": 355, "chapter": "Podes!", "text": "Aconteça o que acontecer, persevera no teu caminho; persevera, alegre e otimista, porque o Senhor se empenha em varrer todos os obstáculos. - Ouve-me bem: tenho a certeza de que, se lutas, serás santo!"}, {"n": 356, "chapter": "Podes!", "text": "Quando o Senhor os chamou, os primeiros Apóstolos estavam junto à barca velha e junto às redes furadas, remendando-as. O Senhor disse-lhes que O seguissem; e eles, “statim” - imediatamente -, “relictis omnibus” - abandonando todas as coisas, tudo! -, O seguiram... E acontece algumas vezes que nós - que desejamos imitá-los - não acabamos de abandonar tudo, e fica-nos um apego no coração, um erro em nossa vida, que não queremos cortar para oferecê-lo ao Senhor. - Examinarás o teu coração bem a fundo? - Não há de ficar nada aí que não seja dEle; caso contrário, não O amamos bem, nem tu nem eu."}, {"n": 357, "chapter": "Podes!", "text": "Tens de manifestar ao Senhor, com sinceridade e constantemente, os teus desejos de santidade e de apostolado..., e então não se quebrará o pobre vaso da tua alma; ou, se se quebra, recompor-se-á com nova graça, e continuará a servir para a tua própria santidade e para o apostolado."}, {"n": 358, "chapter": "Podes!", "text": "A tua oração tem de ser a do filho de Deus; não a dos hipócritas, que hão de escutar de Jesus aquelas palavras: “Nem todo aquele que diz Senhor!, Senhor! entrará no Reino dos Céus”. A tua oração, o teu clamar “Senhor!, Senhor!”, tem de andar unido, de mil formas diversas no teu dia, ao desejo e ao esforço eficaz de cumprir a Vontade de Deus."}, {"n": 359, "chapter": "Podes!", "text": "Menino, diz-Lhe: - Õ Jesus, eu não quero que o demônio se apodere das almas!"}, {"n": 360, "chapter": "Podes!", "text": "Se foste escolhido, chamado pelo Amor de Deus, para segui-Lo, tens obrigação de corresponder-Lhe..., e tens também o dever, não menos forte, de conduzir, de contribuir para a santidade e para o bom caminhar dos teus irmãos os homens."}, {"n": 361, "chapter": "Podes!", "text": "Coragem!..., também quando a caminhada se tornar dura. Não te dá alegria saber que a fidelidade aos teus compromissos de cristão depende em boa parte de ti? Enche-te de júbilo e renova livremente a tua decisão: - Senhor, eu também quero, conta com o pouco que sou!"}, {"n": 362, "chapter": "Podes!", "text": "Deus não te arranca do teu ambiente, não te retira do mundo, nem do teu estado de vida, nem das tuas ambições humanas nobres, nem do teu trabalho profissional... mas, aí, te quer santo!"}, {"n": 363, "chapter": "Podes!", "text": "Com a fronte grudada ao chão e colocado na presença de Deus, deves considerar (porque é assim) que és uma coisa mais suja e desprezível do que o lixo recolhido pela vassoura. - E, apesar de tudo, o Senhor te escolheu."}, {"n": 364, "chapter": "Podes!", "text": "Quando é que te decidirás...! Muitos, à tua volta, levam uma vida sacrificada por um motivo simplesmente humano; não se lembram essas pobres criaturas de que são filhos de Deus, e comportam-se assim talvez unicamente por soberba, para sobressair, para conseguir uma vida futura mais cômoda: abstêm-se de tudo! E tu, que tens o doce peso da Igreja, dos teus, dos teus colegas e amigos, motivos pelos quais vale a pena gastar-se, que fazes?, com que sentido de responsabilidade reages?"}, {"n": 365, "chapter": "Podes!", "text": "Õ Senhor!, por que me procuraste - a mim, que sou a negação -, quando há tantos santos, sábios, ricos e cheios de prestígio? - Tens razão... Precisamente por isso, mostra-Lhe o teu agradecimento com obras e com amor."}, {"n": 366, "chapter": "Podes!", "text": "Jesus, que na tua Igreja Santa todos perseverem no caminho, seguindo a sua vocação cristã, como os Magos seguiram a estrela: desprezando os conselhos de Herodes..., que não lhes faltarão."}, {"n": 367, "chapter": "Podes!", "text": "Peçamos a Jesus Cristo que o fruto da sua Redenção cresça abundante nas almas: ainda mais, mais, mais abundante!, divinamente abundante! E para isso, que nos faça bons filhos da sua Mãe bendita."}, {"n": 368, "chapter": "Podes!", "text": "Queres um segredo para ser feliz? Dá-te e serve os outros, sem esperar que te agradeçam."}, {"n": 369, "chapter": "Podes!", "text": "Se atuas - vives e trabalhas - de olhos postos em Deus, por razões de amor e de serviço, com alma sacerdotal, ainda que não sejas sacerdote, toda a tua ação cobra um genuíno sentido sobrenatural, que mantém a tua vida inteira unida à fonte de todas as graças."}, {"n": 370, "chapter": "Podes!", "text": "Ante o imenso panorama de almas que nos espera, ante essa preciosa e tremenda responsabilidade, talvez te ocorra pensar o mesmo que eu penso às vezes: - Comigo, todo esse trabalho? Comigo, que valho tão pouco? - Temos de abrir então o Evangelho e contemplar como Jesus cura o cego de nascença: com barro feito de pó da terra e saliva. E esse é o colírio que dá luz a uns olhos cegos! Isso é o que somos tu e eu. Com o conhecimento da nossa fraqueza, da nossa nenhuma valia, mas com a graça de Deus e a nossa boa vontade, somos colírio!, para iluminar, para comunicar a nossa fortaleza aos outros e a nós mesmos."}, {"n": 371, "chapter": "Podes!", "text": "Dizia-Lhe uma alma apostólica: - Jesus, vê lá o que fazes..., eu não trabalho para mim..."}, {"n": 372, "chapter": "Podes!", "text": "Se perseverares na tua oração com “perseverança pessoal”, Deus Nosso Senhor te dará os meios de que necessitas para seres mais eficaz e para estenderes o seu reinado no mundo. - Mas é necessário que permaneças fiel: pede, pede, pede... Achas que te comportas assim?"}, {"n": 373, "chapter": "Podes!", "text": "O Senhor quer os seus filhos por todos os caminhos honestos da terra, lançando a semente da compreensão, do perdão, da convivência, da caridade, da paz. - Tu, que fazes?"}, {"n": 374, "chapter": "Podes!", "text": "A Redenção está-se fazendo, ainda neste momento..., e tu és - tens de ser! - corredentor."}, {"n": 375, "chapter": "Podes!", "text": "Ser cristão no mundo não significa isolar-se, muito pelo contrário! - Significa amar todas as pessoas e desejar inflamá-las com o fogo do amor a Deus."}, {"n": 376, "chapter": "Podes!", "text": "Senhora, Mãe de Deus e minha Mãe, nem por sombras quero que deixes de ser a Dona e a Imperatriz de toda a criação."}, {"n": 377, "chapter": "Tornar a lutar", "text": "Segue o conselho de São Paulo: Hora est iam nos de somno surgere! - já é hora de trabalhar! - De trabalhar por dentro, na edificação da tua alma; e por fora, do lugar onde estás, na edificação do Reino de Deus."}, {"n": 378, "chapter": "Tornar a lutar", "text": "Dizes-me, contrito: - “Quanta miséria vejo em mim! É tal a minha torpeza e tal a bagagem das minhas concupiscências, que me encontro como se nunca tivesse feito nada para me aproximar de Deus. Começar, começar: ó Senhor, sempre começando! Procurarei, no entanto, fazer força com toda a minha alma em cada jornada”. - Que Ele abençoe essas tuas aspirações."}, {"n": 379, "chapter": "Tornar a lutar", "text": "“Padre, comentaste-me, eu cometo muitos enganos, tenho muitos erros”. - Eu sei, respondi-te. Mas Deus Nosso Senhor, que também o sabe e conta com isso, só te pede a humildade de reconhecê-lo, e a luta por retificar, por servi-Lo cada dia melhor, com mais vida interior, com uma oração contínua, com a piedade e com o emprego dos meios adequados para santificares o teu trabalho."}, {"n": 380, "chapter": "Tornar a lutar", "text": "Oxalá adquiras - queres alcançá-las! - as virtudes do burrico!: humilde, duro para o trabalho e perseverante, teimoso!, fiel, seguríssimo no seu passo, forte e - se tiver bom dono - agradecido e obediente."}, {"n": 381, "chapter": "Tornar a lutar", "text": "Continua a considerar as virtudes do burrico, e repara que o jumento, para fazer alguma coisa de proveito, tem que deixar-se dominar pela vontade de quem o guia...: sozinho, não faria senão... burradas. Com certeza que não lhe ocorre outra coisa melhor do que revolver-se no chão, correr para o estábulo... e zurrar. Ah Jesus! - diz-Lhe tu também -: “Ut iumentum factus sum apud te!” - fizeste-me teu burriquinho: não me largues, “et ego semper tecum!” - e estarei sempre Contigo. Conduz-me fortemente atado com a tua graça: “tenuisti manum dexteram meam”... - apanhaste-me pelo cabresto; “et in voluntate tua deduxisti me”... - e faz-me cumprir a tua Vontade. E assim te amarei pelos séculos sem fim! - “et cum gloria suscepisti me!”."}, {"n": 382, "chapter": "Tornar a lutar", "text": "Até o sacrifício mais insignificante te parece uma epopéia. Às vezes, Jesus serve-se das tuas “singularidades”, das tuas pequenezes, para que sejas mortificado, e venças por virtude o que tens de vencer por necessidade."}, {"n": 383, "chapter": "Tornar a lutar", "text": "- Meu Jesus, quero corresponder ao teu Amor, mas sou mole. - Com a tua graça, saberei!"}, {"n": 384, "chapter": "Tornar a lutar", "text": "A vida espiritual é - repito-o até cansar, de propósito - um contínuo começar e recomeçar. - Recomeçar? Sim! De cada vez que fazes um ato de contrição - e deveríamos fazer muitos diariamente -, recomeças, porque dás a Deus um novo amor."}, {"n": 385, "chapter": "Tornar a lutar", "text": "Não podemos conformar-nos com o que fazemos no nosso serviço a Deus, à semelhança do artista que não fica satisfeito com o quadro ou estátua que sai das suas mãos. Todos lhe dizem: - É uma maravilha. Mas ele pensa: - Não, não é bem isto; eu quereria mais. Assim deveríamos nós reagir. Além disso, o Senhor nos dá muito, tem direito à nossa mais plena correspondência... e é preciso caminhar ao seu passo."}, {"n": 386, "chapter": "Tornar a lutar", "text": "Falta-te fé... e falta-te amor. Senão, correrias imediatamente e com mais freqflência a Jesus, pedindo-Lhe por isto e por aquilo. - Não esperes mais, invoca-O, e ouvirás Cristo dizer-te: “Que queres que te faça?”, tal como atendeu aquele ceguinho que, postado à beira do caminho, não se cansou de insistir."}, {"n": 387, "chapter": "Tornar a lutar", "text": "Escrevia aquele nosso amigo: “Muitas vezes pedi perdão ao Senhor pelos meus grandíssimos pecados; disse-Lhe que O amava, beijando o Crucifixo, e agradeci-Lhe as suas providências paternais destes dias. Surpreendi-me, como há anos, dizendo - sem dar por isso senão depois -: “Dei perfecta sunt opera” - todas as obras de Deus são perfeitas. Ao mesmo tempo, ficou-me a certeza plena, sem nenhum gênero de dúvida, de que essa é a resposta do meu Deus à sua criatura, pecadora mas amante. Tudo espero dEle! Louvado seja!!” Apressei-me a responder-lhe: “O Senhor sempre se comporta como um bom Pai, e oferece-nos contínuas provas do seu Amor: cifra toda a tua esperança nEle..., e continua a lutar”."}, {"n": 388, "chapter": "Tornar a lutar", "text": "Õ Jesus! Se, sendo como tenho sido! - pobre de mim -, fizeste o que fizeste..., se eu correspondesse, o que não farias? Esta verdade há de levar-te a uma generosidade sem tréguas. Chora, e dói-te com pena e com amor, porque o Senhor e a sua Mãe bendita merecem outro comportamento da tua parte."}, {"n": 389, "chapter": "Tornar a lutar", "text": "Ainda que às vezes se meta na tua alma a falta de vontade, e te pareça que falas só da boca para fora, renova os teus atos de fé, de esperança, de amor. Não adormeças!, porque, caso contrário, no meio das coisas boas virão as más, e te arrastarão."}, {"n": 390, "chapter": "Tornar a lutar", "text": "Faz assim a tua oração: - Se devo fazer alguma coisa de proveito, Jesus, tens de fazê-lo Tu por mim. Que se cumpra a tua Vontade; amo-a, ainda que a tua Vontade permita que eu esteja sempre como agora, caindo penosamente, e Tu, levantando-me!"}, {"n": 391, "chapter": "Tornar a lutar", "text": "Faz-me santo, meu Deus, ainda que seja à paulada. Não quero ser o peso morto da tua Vontade. Quero corresponder, quero ser generoso... Mas, que espécie de querer é o meu?"}, {"n": 392, "chapter": "Tornar a lutar", "text": "Estás cheio de preocupação porque não amas como deves. Tudo te aborrece. E o inimigo faz o que pode para que o teu mau gênio venha à tona. - Compreendo que estejas muito humilhado, e precisamente por isso deves reagir com eficácia e sem demora."}, {"n": 393, "chapter": "Tornar a lutar", "text": "Não é verdadeira santidade - será, quando muito, a sua caricatura - aquela que obriga a pensar que “para agflentar um santo, são precisos dois santos”."}, {"n": 394, "chapter": "Tornar a lutar", "text": "O diabo trata de afastar-nos de Deus e, se te deixas dominar por ele, as criaturas honradas “afastar-se-ão” de ti, porque se “afastam” dos amigos ou dos possuídos por satanás."}, {"n": 395, "chapter": "Tornar a lutar", "text": "Quando falares com o Senhor, embora penses que tudo o que dizes é palavreado, pede-Lhe uma maior entrega, um progresso mais decidido na perfeição cristã: que te inflame mais!"}, {"n": 396, "chapter": "Tornar a lutar", "text": "Renova o teu propósito firme de viver com “voluntariedade atual” a tua vida de cristão: a todas as horas e em todas as circunstâncias."}, {"n": 397, "chapter": "Tornar a lutar", "text": "Não levantes obstáculos à graça: tens de convencer-te de que, para ser fermento, precisas ser santo, precisas lutar por identificar-te com Ele."}, {"n": 398, "chapter": "Tornar a lutar", "text": "Diz devagar, com ânimo sincero: “Nunc coepi!” - agora começo! Não desanimes se, infelizmente, não vês em ti a mudança, que é efeito da destra do Senhor... Do fundo da tua baixeza, podes gritar: - Ajuda-me, meu Jesus, porque quero cumprir a tua Vontade..., a tua amabilíssima Vontade."}, {"n": 399, "chapter": "Tornar a lutar", "text": "De acordo: a tua preocupação devem ser “eles”. Mas a tua primeira preocupação deves ser tu mesmo, a tua vida interior; porque, de outro modo, não poderás servi-los."}, {"n": 400, "chapter": "Tornar a lutar", "text": "Quanto te custa essa mortificação que o Espírito Santo te sugere! Olha bem devagar um Crucifixo..., e amarás essa expiação."}, {"n": 401, "chapter": "Tornar a lutar", "text": "Pregar-se na Cruz! Esta aspiração, como luz nova, vinha à inteligência, ao coração e aos lábios daquela alma, muitas vezes. - Pregar-se na Cruz? Quanto custa!, dizia de si para si. E isso apesar de saber muito bem o caminho: “agere contra!” - negar-se a si mesmo. Por isso suplicava: - Ajuda-me, Senhor!"}, {"n": 402, "chapter": "Tornar a lutar", "text": "Situados no Calvário, onde Jesus morreu, a experiência dos nossos pecados pessoais deve conduzir-nos à dor: a uma decisão mais madura e mais funda de não ofendê-Lo de novo."}, {"n": 403, "chapter": "Tornar a lutar", "text": "Cada dia um pouco mais - como se se tratasse de talhar uma pedra ou uma madeira -, é preciso ir limando asperezas, tirando defeitos da nossa vida pessoal, com espírito de penitência, com pequenas mortificações, que são de duas espécies: as ativas - essas que procuramos, como florzinhas que apanhamos ao longo do dia -, e as passivas, que vêm de fora e nos custa aceitar. Depois, Jesus Cristo vai completando o que falta. - Que Crucifixo tão esplêndido vais ser, se correspondes com generosidade, com alegria, de todo!"}, {"n": 404, "chapter": "Tornar a lutar", "text": "O Senhor, com os braços abertos, pede-te uma constante esmola de amor."}, {"n": 405, "chapter": "Tornar a lutar", "text": "Aproxima-te de Jesus morto por ti, aproxima-te dessa Cruz que se recorta sobre o cume do Gólgota... Mas aproxima-te com sinceridade, com esse recolhimento interior que é sinal de maturidade cristã: para que os acontecimentos divinos e humanos da Paixão penetrem na tua alma."}, {"n": 406, "chapter": "Tornar a lutar", "text": "Temos de aceitar a mortificação com os mesmos sentimentos que teve Jesus Cristo na sua Paixão Santa."}, {"n": 407, "chapter": "Tornar a lutar", "text": "A mortificação é premissa necessária para todo o apostolado e para a perfeita execução de cada apostolado."}, {"n": 408, "chapter": "Tornar a lutar", "text": "O espírito de penitência consiste principalmente em aproveitar essas abundantes miudezas - ações, renúncias, sacrifícios, serviços... - que encontramos cada dia no caminho, para convertê-las em atos de amor, de contrição, em mortificações, formando um ramalhete no fim do dia: um belo ramo, que oferecemos a Deus!"}, {"n": 409, "chapter": "Tornar a lutar", "text": "O melhor espírito de sacrifício é a perseverança no trabalho começado: quer se faça com entusiasmo, quer se torne encosta empinada."}, {"n": 410, "chapter": "Tornar a lutar", "text": "Não deixes de submeter à consideração do teu Diretor espiritual o teu plano de mortificações, para que ele as modere. - Porém, moderá-las não quer dizer sempre diminuí-las, mas também aumentá-las, se o julgar conveniente. - E, seja o que for, aceita-o!"}, {"n": 411, "chapter": "Tornar a lutar", "text": "Podemos dizer, como Santo Agostinho, que as paixões ruins nos puxam pela roupa, para baixo. Ao mesmo tempo, notamos dentro do coração desejos grandes, nobres, limpos, e há uma luta. - Se tu, com a graça do Senhor, puseres em prática os meios ascéticos: a busca da presença de Deus, a mortificação - não te assustes: a penitência -, irás para a frente, terás paz e alcançarás a vitória."}, {"n": 412, "chapter": "Tornar a lutar", "text": "A guarda do coração. - Assim rezava aquele sacerdote: “Jesus, que o meu pobre coração seja horto selado; que o meu pobre coração seja um paraíso, onde vivas Tu; que o meu Anjo da Guarda o guarde com espada de fogo, e com ela purifique todos os afetos antes de entrarem em mim; Jesus, com o divino selo da tua Cruz, sela o meu pobre coração”."}, {"n": 413, "chapter": "Tornar a lutar", "text": "Vida limpa, com valentia! Cada um no seu estado de vida: é preciso saber dizer “não”, pelo grande Amor, com maiúscula."}, {"n": 414, "chapter": "Tornar a lutar", "text": "Há um ditado muito claro: entre santa e santo, parede de cal e canto. - Temos de guardar o coração e os sentidos, afastando-nos sempre da ocasião. É preciso evitar a paixão, por santa que pareça!"}, {"n": 415, "chapter": "Tornar a lutar", "text": "Meu Deus! Encontro graça e beleza em tudo o que vejo: guardarei a vista a toda a hora, por Amor."}, {"n": 416, "chapter": "Tornar a lutar", "text": "Tu, cristão, e, por seres cristão, filho de Deus, deves sentir a grave responsabilidade de corresponder, com uma atitude de vigilante e amorosa firmeza, às misericórdias que recebeste do Senhor, para que nada nem ninguém possa diluir os traços peculiares do Amor, que Ele imprimiu na tua alma."}, {"n": 417, "chapter": "Tornar a lutar", "text": "Chegaste a uma grande intimidade com este nosso Deus, que está tão perto de ti, tão dentro da tua alma... Mas procuras que aumente, que se torne mais profunda? Evitas que se intrometam mesquinhezes que possam turvar essa amizade? - Sê corajoso! Não te recuses a cortar tudo o que, mesmo levemente, cause dor a Quem tanto te ama."}, {"n": 418, "chapter": "Tornar a lutar", "text": "A vida de Jesus Cristo, se Lhe somos fiéis, repete-se de alguma maneira na de cada um de nós, tanto no seu processo interno - na santificação - como na conduta externa. - Agradece-Lhe a sua bondade."}, {"n": 419, "chapter": "Tornar a lutar", "text": "Parece-me muito oportuno que manifestes com freqflência ao Senhor um desejo ardente, grande, de ser santo, ainda que te vejas cheio de misérias... - Tens de fazê-lo, precisamente por isso!"}, {"n": 420, "chapter": "Tornar a lutar", "text": "Tu, que viste claramente a tua condição de filho de Deus, mesmo que já não tornes a vê-la - não há de acontecer! -, deves continuar adiante no teu caminho, para sempre, por sentido de fidelidade, sem olhar para trás."}, {"n": 421, "chapter": "Tornar a lutar", "text": "Propósito: ser fiel - heroicamente fiel e sem desculpas - ao horário, na vida ordinária e na extraordinária."}, {"n": 422, "chapter": "Tornar a lutar", "text": "Deves ter pensado alguma vez, com santa inveja, no Apóstolo adolescente, João, “quem diligebat Iesus” - a quem Jesus amava. - Não gostarias de merecer que te chamassem “aquele que ama a Vontade de Deus”? Emprega os meios para isso, dia após dia."}, {"n": 423, "chapter": "Tornar a lutar", "text": "Deves ter esta certeza: o desejo - com obras! - de te comportares como bom filho de Deus dá juventude, serenidade, alegria e paz permanentes."}, {"n": 424, "chapter": "Tornar a lutar", "text": "Se voltares a abandonar-te nas mãos de Deus, receberás, do Espírito Santo, luzes no entendimento e vigor na vontade."}, {"n": 425, "chapter": "Tornar a lutar", "text": "Escuta dos lábios de Jesus aquela parábola que São João relata no seu Evangelho: “Ego sum vitis, vos palmites” - Eu sou a videira; vós, os ramos. Já tens na imaginação, no entendimento, a parábola inteira. E vês que um ramo separado da cepa, da videira, não serve para nada, não se encherá de fruto, correrá a sorte de uma vara seca, que será pisada pelos homens ou pelos animais, ou que será lançada ao fogo... - Tu és o ramo: deduz todas as conseqflências."}, {"n": 426, "chapter": "Tornar a lutar", "text": "Hoje voltei a rezar cheio de confiança, com esta súplica: - Senhor, que não nos inquietem as nossas misérias passadas, já perdoadas, nem tampouco a possibilidade de misérias futuras; que nos abandonemos nas tuas mãos misericordiosas; que levemos à tua presença os nossos desejos de santidade e apostolado, que latejam como brasas sob as cinzas de uma aparente frieza... - Senhor, sei que nos escutas. Diz-Lhe isso tu também."}, {"n": 427, "chapter": "Tornar a lutar", "text": "Ao abrires a tua alma, sê sincero! E, sem dourar a pílula - coisa que às vezes é infantilismo -, fala. Depois, com docilidade, continua em frente: serás mais santo, mais feliz."}, {"n": 428, "chapter": "Tornar a lutar", "text": "Não procures consolos fora de Deus. Olha o que escrevia aquele sacerdote: - Nada de desabafar o coração, sem necessidade, com nenhum outro amigo!"}, {"n": 429, "chapter": "Tornar a lutar", "text": "Alcança-se a santidade com o auxílio do Espírito Santo - que vem morar em nossas almas -, mediante a graça que nos é concedida nos sacramentos, e com uma luta ascética constante. Meu filho, não nos iludamos: tu e eu - não me cansarei de repeti-lo - teremos de combater sempre, sempre, até o fim da nossa vida. Assim amaremos a paz, e daremos a paz, e receberemos o prêmio eterno."}, {"n": 430, "chapter": "Tornar a lutar", "text": "Não te limites a falar ao Paráclito, escuta-O! Na tua oração, considera que a vida de infância, ao fazer-te descobrir com profundidade que és filho de Deus, te encheu de amor filial ao Pai; pensa que, antes disso, foste por Maria a Jesus, a quem adoras como amigo, como irmão, como Aquele que amas... Depois, ao receberes este conselho, compreendeste que até agora sabias que o Espírito Santo habitava na tua alma, para santificá-la..., mas não tinhas “compreendido” a verdade da sua presença em ti. Foi precisa essa sugestão: agora sentes o Amor dentro de ti; e queres chegar ao trato íntimo com Ele, ser seu amigo, seu confidente..., facilitar-Lhe o trabalho de tirar arestas, de arrancar, de prender fogo... Não saberei fazê-lo!, pensavas. - Escuta-O, insisto. Ele te dará forças, Ele fará tudo, se tu quiseres..., como sem dúvida queres! Reza-lhe assim: - Divino Hóspede, Mestre, Luz, Guia, Amor: que eu saiba acolher-te, e escutar as tuas lições, e inflamar-me, e seguir-te, e amar-te."}, {"n": 431, "chapter": "Tornar a lutar", "text": "Para te aproximares de Deus, para voares até Deus, necessitas das asas firmes e generosas da Oração e da Expiação."}, {"n": 432, "chapter": "Tornar a lutar", "text": "Para evitares a rotina nas orações vocais, procura recitá-las com o mesmo amor com que o apaixonado fala pela primeira vez..., e como se fosse a última ocasião em que pudesses dirigir-te ao Senhor."}, {"n": 433, "chapter": "Tornar a lutar", "text": "Se estás orgulhoso de ser filho de Santa Maria, pergunta-te: - Quantas manifestações de devoção a Nossa Senhora tenho durante o dia, da manhã até à noite?"}, {"n": 434, "chapter": "Tornar a lutar", "text": "Há duas razões, entre outras - dizia de si para si aquele amigo -, para que desagrave a minha Mãe Imaculada todos os sábados e nas vésperas das suas festas. - A segunda é que, em vez de dedicarem à oração os domingos e as festas de Nossa Senhora (que costumam ser festas nos vilarejos), as pessoas os dedicam - basta abrir os olhos e ver - a ofender o Nosso Jesus com pecados públicos e crimes escandalosos. - A primeira: que os que queremos ser bons filhos não vivemos com a devida atenção, talvez empurrados por satanás, esses dias dedicados ao Senhor e à sua Mãe. - Já percebes que, infelizmente, essas razões continuam a ser muito atuais, para que também nós desagravemos."}, {"n": 435, "chapter": "Tornar a lutar", "text": "Sempre entendi a oração do cristão como uma conversa amorosa com Jesus, que não deve ser interrompida nem mesmo nos momentos em que estamos fisicamente longe do Sacrário, porque toda a nossa vida está feita de canções de amor humano à maneira divina..., e amar é coisa que podemos fazer sempre."}, {"n": 436, "chapter": "Tornar a lutar", "text": "É tanto o Amor de Deus pelas suas criaturas, e deveria ser tanta a nossa correspondência que, ao celebrar-se a Santa Missa, os relógios deveriam parar."}, {"n": 437, "chapter": "Tornar a lutar", "text": "Os ramos, unidos à videira, amadurecem e dão frutos. - Que havemos de fazer tu e eu? Estar muito unidos, por meio do Pão e da Palavra, a Jesus Cristo, que é a nossa videira..., dizendo-Lhe palavras de carinho ao longo de todo o dia. Os apaixonados fazem assim."}, {"n": 438, "chapter": "Tornar a lutar", "text": "Ama muito o Senhor. Guarda na tua alma - e fomenta - esta urgência de querer-Lhe. Ama a Deus, precisamente agora, quando talvez bastantes dos que O têm em suas mãos não O amam, O maltratam e Lhe fazem pouco caso. Trata muito bem o Senhor, na Santa Missa e durante o dia todo!"}, {"n": 439, "chapter": "Tornar a lutar", "text": "A oração é a arma mais poderosa do cristão. A oração nos torna eficazes. A oração nos torna felizes. A oração nos dá toda a força necessária para cumprirmos os preceitos de Deus. - Sim! Toda a tua vida pode e deve ser oração."}, {"n": 440, "chapter": "Tornar a lutar", "text": "A santidade pessoal não é uma abstração, mas uma realidade precisa, divina e humana, que se manifesta constantemente em obras diárias de Amor."}, {"n": 441, "chapter": "Tornar a lutar", "text": "O espírito de oração, que anima a vida inteira de Jesus Cristo entre os homens, nos ensina que todas as obras - grandes e pequenas - têm que ser precedidas, acompanhadas e seguidas de oração."}, {"n": 442, "chapter": "Tornar a lutar", "text": "Contempla e vive a Paixão de Cristo, juntamente com Ele: expõe - com freqflência cotidiana - as tuas costas, quando O açoitam; oferece a tua cabeça à coroa de espinhos. - Na minha terra dizem: “Amor com amor se paga”."}, {"n": 443, "chapter": "Tornar a lutar", "text": "Quem ama não perde um detalhe. Já o vi em tantas almas! Essas minúcias são uma coisa muito grande: Amor!"}, {"n": 444, "chapter": "Tornar a lutar", "text": "Tens de amar a Deus por aqueles que não O amam; tens de fazer carne da tua carne este espírito de desagravo e reparação."}, {"n": 445, "chapter": "Tornar a lutar", "text": "Se nalguma ocasião a luta interior se torna mais difícil, será o bom momento de mostrar que o nosso Amor é de verdade."}, {"n": 446, "chapter": "Tornar a lutar", "text": "Tens a certeza de que foi Deus quem te fez ver, claramente, que deves voltar às ninharias mais pueris da tua antiga vida interior; e perseverar durante meses, e até anos, nessas insignificâncias heróicas (a sensibilidade, tantas vezes adormecida para o bem, não conta), com a tua vontade talvez fria, mas decidida a cumpri-las por Amor."}, {"n": 447, "chapter": "Tornar a lutar", "text": "Persevera, voluntariamente e com amor - mesmo que estejas seco -, na tua vida de piedade. E não te importes se te surpreendes contando os minutos ou os dias que faltam para terminares essa norma de piedade ou esse trabalho, com o turvo regozijo que põe, em semelhante operação, o rapaz mau estudante, que sonha com o fim das aulas; ou o vadio, que espera voltar às suas malandragens quando lhe abrirem as portas da prisão. Persevera - insisto - com vontade eficaz e atual, sem deixar nem por um instante de querer fazer e aproveitar esses meios de piedade."}, {"n": 448, "chapter": "Tornar a lutar", "text": "Vive a tua fé, alegre, grudado a Jesus Cristo. Ama-O de verdade - de verdade, de verdade! -, e assim serás protagonista da grande Aventura do Amor, porque estarás cada dia mais apaixonado."}, {"n": 449, "chapter": "Tornar a lutar", "text": "Diz devagar ao Mestre: - Senhor, só quero servir-te! Só quero cumprir os meus deveres, e amar-te com alma enamorada! Faz-me sentir o teu passo firme a meu lado. Sê Tu o meu único apoio. - Diz-Lhe isso devagar..., e dize-o de verdade!"}, {"n": 450, "chapter": "Tornar a lutar", "text": "Necessitas de vida interior e de formação doutrinal. Sê exigente contigo! Tu - cavalheiro cristão, mulher cristã - deves ser sal da terra e luz do mundo, porque tens obrigação de dar exemplo com uma santa desvergonha. - Há de urgir-te a caridade de Cristo e, ao te sentires e saberes outro Cristo desde o momento em que Lhe disseste que O seguias, não te separarás dos teus iguais - parentes, amigos, colegas -, tal como o sal não se separa do alimento que condimenta. A tua vida interior e a tua formação abrangem a piedade e o critério que deve ter um filho de Deus, para temperar tudo com a sua presença ativa. Pede ao Senhor que sejas sempre esse bom condimento na vida dos outros."}, {"n": 451, "chapter": "Tornar a lutar", "text": "Nós, os cristãos, viemos recolher, com espírito de juventude, o tesouro do Evangelho - que é sempre novo -, para fazê-lo chegar a todos os cantos da terra."}, {"n": 452, "chapter": "Tornar a lutar", "text": "Precisas imitar Jesus Cristo, e dá-Lo a conhecer com a tua conduta. Não esqueças que Cristo assumiu a nossa natureza para introduzir todos os homens na vida divina, de modo que - unindo-nos a Ele - vivamos individual e socialmente os mandamentos do Céu."}, {"n": 453, "chapter": "Tornar a lutar", "text": "Tu, pela tua condição de cristão, não podes viver de costas para nenhuma inquietação, para nenhuma necessidade dos teus irmãos os homens."}, {"n": 454, "chapter": "Tornar a lutar", "text": "Com quanta insistência pregava o Apóstolo São João o mandatum novum! - “Que vos ameis uns aos outros!” - Eu me poria de joelhos, sem fazer teatro - assim me grita o coração -, para vos pedir por amor de Deus que vos ameis, que vos ajudeis, que estendais a mão uns aos outros, que saibais perdoar-vos. - Portanto, vamos banir o orgulho, ser compassivos, ter caridade; vamos prestar-nos mutuamente o auxílio da oração e da amizade sincera."}, {"n": 455, "chapter": "Tornar a lutar", "text": "Só serás bom se souberes ver as coisas boas e as virtudes dos outros. - Por isso, quando tiveres de corrigir, faze-o com caridade, no momento oportuno, sem humilhar... e com ânimo de aprender e de melhorares tu mesmo naquilo que corriges."}, {"n": 456, "chapter": "Tornar a lutar", "text": "Ama e pratica a caridade, sem limites e sem discriminações, porque é a virtude que caracteriza os discípulos do Mestre. - Não obstante, essa caridade não pode levar-te - deixaria de ser virtude - a amortecer a fé, a tirar-lhe as arestas que a definem, a dulcificá-la até convertê-la, como pretendem alguns, em algo de amorfo que não tem a força e o poder de Deus."}, {"n": 457, "chapter": "Tornar a lutar", "text": "Tens de conviver, tens de compreender, tens de ser irmão dos teus irmãos os homens, tens de pôr amor - como diz o místico castelhano - onde não há amor, para colher amor."}, {"n": 458, "chapter": "Tornar a lutar", "text": "A crítica, quando tiveres que fazê-la, deve ser positiva, com espírito de colaboração, construtiva, e nunca às escondidas do interessado. - Caso contrário, é uma traição, uma murmuração, uma difamação, talvez uma calúnia... e, sempre, uma falta de hombridade."}, {"n": 459, "chapter": "Tornar a lutar", "text": "Quando vires que a glória de Deus e o bem da Igreja exigem que fales, não te cales. - Pensa nisto: quem não seria valente se estivesse face a face com Deus, com toda a eternidade pela frente? Não há nada a perder e, pelo contrário, muito a ganhar. Então, por que não te atreves?"}, {"n": 460, "chapter": "Tornar a lutar", "text": "Não somos bons irmãos dos nossos irmãos os homens, se não estamos dispostos a manter uma conduta reta, mesmo que as pessoas que nos rodeiam interpretem mal a nossa atuação e reajam de um modo desagradável."}, {"n": 461, "chapter": "Tornar a lutar", "text": "O teu amor e o teu serviço à Igreja Santa não podem estar condicionados pela maior ou menor santidade pessoal dos que a compõem, ainda que desejemos ardentemente a perfeição cristã em todos. - Tens de amar a Esposa de Cristo, tua Mãe, que está e estará sempre limpa e sem mancha."}, {"n": 462, "chapter": "Tornar a lutar", "text": "O empenho na nossa santificação pessoal repercute na santidade de muitas almas e na da Igreja de Deus."}, {"n": 463, "chapter": "Tornar a lutar", "text": "Persuade-te disto: se quiseres - como Deus te ouve, te ama, te promete a glória -, tu, protegido pela mão onipotente de teu Pai do Céu, podes ser uma pessoa cheia de fortaleza, disposta a dar testemunho em toda a parte da sua amável doutrina verdadeira."}, {"n": 464, "chapter": "Tornar a lutar", "text": "O campo do Senhor é fértil e boa a sua semente. Por isso, quando neste nosso mundo aparece o joio, não duvides: houve falta de correspondência dos homens, dos cristãos especialmente, que adormeceram e deixaram o terreno aberto ao inimigo. - Não te lamentes, que é estéril; e examina antes a tua conduta."}, {"n": 465, "chapter": "Tornar a lutar", "text": "Far-te-á pensar, também a ti, este comentário que me doeu muito: “Vejo com clareza que a falta de resistência às leis infames, ou a ineficácia dessa resistência, é porque há em cima, em baixo e no meio muitos - mas muitos! - que se aburguesaram”."}, {"n": 466, "chapter": "Tornar a lutar", "text": "Os inimigos de Deus e da sua Igreja, manipulados pelo ódio imperecível de satanás, mexem-se e organizam-se sem tréguas. Com uma constância “exemplar”, preparam os seus quadros, mantêm escolas, dirigentes e agitadores, e, com uma ação dissimulada - mas eficaz -, propagam as suas idéias e levam - aos lares e aos lugares de trabalho - a sua semente destruidora de toda a ideologia religiosa. - O que não deveremos fazer nós, os cristãos, para servir o nosso Deus, sempre com a verdade?"}, {"n": 467, "chapter": "Tornar a lutar", "text": "Não confundas a serenidade com a preguiça, com o desleixo, com o atraso nas decisões ou no estudo dos assuntos. A serenidade complementa-se sempre com a diligência, virtude necessária para considerar e resolver, sem demora, as questões pendentes."}, {"n": 468, "chapter": "Tornar a lutar", "text": "- Filho, onde está o Cristo que as almas buscam em ti? Na tua soberba? Nos teus desejos de impor-te aos outros? Nessas mesquinhezes de caráter que não queres vencer? Nessa caturrice?... Está aí Cristo? - Não!! - De acordo: deves ter personalidade, mas a tua personalidade tem de procurar identificar-se com Cristo."}, {"n": 469, "chapter": "Tornar a lutar", "text": "Proponho-te uma boa norma de conduta para viveres a fraternidade, o espírito de serviço: que, quando faltares, os outros possam levar para a frente a tarefa que tens entre mãos, pela experiência que generosamente lhes transmitas, sem te fazeres imprescindível."}, {"n": 470, "chapter": "Tornar a lutar", "text": "Recai sobre ti - apesar das tuas paixões - a responsabilidade pela santidade, pela vida cristã e pela eficácia dos outros. Tu não és uma peça isolada. Se paras, quantos podes deter ou prejudicar!"}, {"n": 471, "chapter": "Tornar a lutar", "text": "Pensa na tua Mãe, a Igreja Santa, e considera que, se um membro se ressente, todo o corpo se ressente. - O teu corpo necessita de cada um dos membros, mas cada um dos membros necessita do corpo inteiro. - Ai, se a minha mão deixasse de cumprir o seu dever..., ou se o coração deixasse de bater!"}, {"n": 472, "chapter": "Tornar a lutar", "text": "Viste-o claramente: há tanta gente que não O conhece e, no entanto, Deus reparou em ti. Ele quer que sejas fundamento, silhar, em que se apóie a vida da Igreja. Medita nesta realidade, e tirarás muitas consequências práticas para a tua conduta habitual: o fundamento, o silhar - talvez sem brilhar, oculto - tem que ser sólido, sem fragilidades; tem que servir de base para a sustentação do edifício... Senão, fica isolado."}, {"n": 473, "chapter": "Tornar a lutar", "text": "Uma vez que te sentes fundamento escolhido por Deus para corredimir - não te esqueças de que és... miséria e miséria -, a tua humildade te há de levar a colocar-te debaixo dos pés - ao serviço - de todos. - Assim estão os alicerces dos edifícios. Mas o fundamento deve ter fortaleza, que é virtude indispensável em quem há de sustentar ou impulsionar outros. - Jesus - dize-o com força -, que nunca, por falsa humildade, eu deixe de praticar a virtude cardeal da fortaleza. Concede-me, meu Deus, que eu possa distinguir o ouro da escória."}, {"n": 474, "chapter": "Tornar a lutar", "text": "Mãe nossa, nossa Esperança! Como estamos seguros, pegadinhos a Ti, mesmo que tudo cambaleie!"}, {"n": 475, "chapter": "Ressurgir", "text": "Sentes a necessidade de converter-te: Ele te pede mais... e tu cada dia Lhe dás menos!"}, {"n": 476, "chapter": "Ressurgir", "text": "Realmente, para cada um de nós, como para Lázaro, foi um veni foras - sai cá para fora - o que nos pôs em movimento. - Que pena causam os que ainda estão mortos, e não conhecem o poder da misericórdia de Deus! - Renova a tua alegria santa porque, em face do homem que se desintegra sem Cristo, ergue-se o homem que ressuscitou com Ele."}, {"n": 477, "chapter": "Ressurgir", "text": "Os afetos da terra, mesmo quando não são concupiscência suja e seca, envolvem geralmente algum egoísmo. Por isso, sem desprezares esses afetos - que podem ser muito santos -, retifica sempre a intenção."}, {"n": 478, "chapter": "Ressurgir", "text": "Não procures que se compadeçam de ti: muitas vezes, isso é sinal de orgulho ou de vaidade."}, {"n": 479, "chapter": "Ressurgir", "text": "Quando falares das virtudes teologais - da fé, da esperança, do amor -, pensa que, mais do que para teorizar, são virtudes para viver."}, {"n": 480, "chapter": "Ressurgir", "text": "Há alguma coisa na tua vida que não corresponda à tua condição de cristão e que te leve a não quereres purificar-te? - Examina-te e muda."}, {"n": 481, "chapter": "Ressurgir", "text": "Observa a tua conduta com vagar. Verás que estás cheio de erros, que te prejudicam a ti e talvez também aos que te rodeiam. - Lembra-te, filho, de que não são menos importantes os micróbios do que as feras. E tu cultivas esses erros, esses desacertos - como se cultivam os micróbios no laboratório -, com a tua falta de humildade, com a tua falta de oração, com a tua falta de cumprimento do dever, com a tua falta de conhecimento próprio... E, depois, esses focos infectam o ambiente. - Precisas de um bom exame de consciência diário, que te leve a propósitos concretos de melhora, por sentires verdadeira dor das tuas faltas, das tuas omissões e pecados."}, {"n": 482, "chapter": "Ressurgir", "text": "Deus Onipotente, Todo-Poderoso, Sapientíssimo, tinha que escolher a sua Mãe. Tu, que terias feito, se tivesses tido que escolhê-la? Penso que tu e eu teríamos escolhido a que temos - cumulando-a de todas as graças. Foi isso o que Deus fez. Portanto, depois da Santíssima Trindade, vem Maria. - Os teólogos estabelecem um raciocínio lógico para esse cúmulo de graças, para essa impossibilidade de estar sujeita a satanás: convinha, Deus podia fazê-lo, logo o fez. É a grande prova, a prova mais clara de que Deus rodeou a sua Mãe de todos os privilégios, desde o primeiro instante. E assim é: formosa, e pura, e limpa em alma e corpo!"}, {"n": 483, "chapter": "Ressurgir", "text": "Esperas a vitória, o fim do combate... e não chega? - Dá graças ao Senhor, como se já tivesses alcançado essa meta, e oferece - Lhe as tuas impaciências: Vir fidelis loquetur victoriam - a pessoa fiel cantará a alegria da vitória."}, {"n": 484, "chapter": "Ressurgir", "text": "Há momentos em que - privado daquela união com o Senhor, que te dava uma oração contínua, mesmo dormindo -, parece que entras num braço-de-ferro com a Vontade de Deus. - Isso é fraqueza, bem o sabes: ama a Cruz; ama a falta de tantas coisas que todos julgam necessárias; e os obstáculos para empreenderes... ou continuares o caminho; e a tua própria pequenez e a tua miséria espiritual. - Oferece - com um querer eficaz - as tuas coisas e as dos teus: visto humanamente, isso não é pouco; com luzes sobrenaturais, é nada."}, {"n": 485, "chapter": "Ressurgir", "text": "Vez por outra, alguém me tem dito: - Padre, encontro-me cansado e frio; quando rezo ou cumpro outra norma de piedade, parece-me estar representando uma comédia... A esse amigo e a ti, se te encontras na mesma situação, respondo-vos: - Uma comédia? Grande coisa, meu filho! Representa a comédia! O Senhor é teu espectador: o Pai, o Filho, o Espírito Santo!; a Trindade Santíssima nos estará contemplando, nesses momentos em que “representamos a comédia”. - Atuar assim diante de Deus, por amor, para agradar-Lhe, quando se vive a contragosto, como é bonito! Ser jogral de Deus! Que maravilhoso é esse recital levado a cabo por Amor, com sacrifício, sem nenhuma satisfação pessoal, para dar gosto a Nosso Senhor! - Isto, sim, é viver de Amor."}, {"n": 486, "chapter": "Ressurgir", "text": "Um coração que ame desordenadamente as coisas da terra está como que preso por uma corrente, ou por um “fiozinho sutil”, que o impede de voar para Deus."}, {"n": 487, "chapter": "Ressurgir", "text": "“Vigiai e orai, para não cairdes em tentação...”. É impressionante a experiência de ver como se pode abandonar uma tarefa divina - por uma miragem passageira!"}, {"n": 488, "chapter": "Ressurgir", "text": "O apóstolo tíbio: esse é o grande inimigo das almas."}, {"n": 489, "chapter": "Ressurgir", "text": "Prova evidente de tibieza é a falta de “teimosia” sobrenatural, de fortaleza para perseverar no trabalho e não parar até colocar a “última pedra”."}, {"n": 490, "chapter": "Ressurgir", "text": "Há corações duros, mas nobres, que - ao se aproximarem do calor do Coração de Jesus Cristo - se derretem como o bronze em lágrimas de amor, de desagravo. Inflamam-se! Pelo contrário, os tíbios têm o coração de barro, de carne miserável... e racham. São pó. Dão pena. Diz comigo: - Jesus nosso, longe de nós a tibieza! Tíbios, não!"}, {"n": 491, "chapter": "Ressurgir", "text": "Toda a bondade, toda a formosura, toda a majestade, toda a beleza, toda a graça adornam a nossa Mãe. - Não te enamora ter uma Mãe assim?"}, {"n": 492, "chapter": "Ressurgir", "text": "Somos os enamorados do Amor. Por isso, o Senhor não nos quer secos, hirtos, como uma coisa sem vida: Ele nos quer impregnados do seu carinho!"}, {"n": 493, "chapter": "Ressurgir", "text": "Vê se entendes esta aparente contradição. - Ao fazer trinta anos, aquele homem escreveu no seu diário: “Já não sou jovem”. - E, passados os quarenta, voltou a anotar: “Permanecerei jovem até chegar a octogenário; se morrer antes, pensarei que fracassei”. - Apesar dos anos, andava sempre com a juventude madura do amor."}, {"n": 494, "chapter": "Ressurgir", "text": "Como entendo bem a pergunta que fazia a si própria aquela alma enamorada de Deus: - Houve algum trejeito de desgosto, houve em mim alguma coisa que te pudesse a Ti, Senhor, meu Amor, doer? - Pede a teu Pai-Deus que nos conceda essa exigência constante de amor."}, {"n": 495, "chapter": "Ressurgir", "text": "Viste com que carinho, com que confiança os amigos de Cristo O tratavam? Com toda a naturalidade, as irmãs de Lázaro lançam-Lhe em rosto a sua ausência: - Nós te avisamos! Se tivesses estado aqui!... - Confia-Lhe devagar: - Ensina-me a tratar-te com aquele amor de amizade de Marta, de Maria e de Lázaro; como te tratavam também os primeiros Doze, ainda que a princípio te seguissem talvez por motivos não muito sobrenaturais."}, {"n": 496, "chapter": "Ressurgir", "text": "Como gosto de contemplar João, que reclina a sua cabeça sobre o peito de Cristo! - É como render amorosamente a inteligência, ainda que custe, para acendê-la no fogo do Coração de Jesus."}, {"n": 497, "chapter": "Ressurgir", "text": "Deus me ama... E o Apóstolo João escreve: “Amemos, pois, a Deus, porque Deus nos amou primeiro”. - Como se fosse pouco, Jesus dirige-se a cada um de nós, apesar das nossas inegáveis misérias, para nos perguntar como a Pedro: “Simão, filho de João, tu me amas mais do que estes?”... - É o momento de responder: “Senhor, Tu sabes tudo, Tu sabes que eu te amo!”, acrescentando com humildade: - Ajuda-me a amar-te mais, aumenta o meu amor!"}, {"n": 498, "chapter": "Ressurgir", "text": "“Obras é que são amores, não as boas razões”. Obras, obras! - Propósito: continuarei a dizer-te muitas vezes que te amo - quantas não te terei repetido hoje! -; mas, com a tua graça, será sobretudo a minha conduta, serão as bagatelas de cada dia que - com eloqflência muda - hão de clamar diante de Ti, mostrando-te o meu amor."}, {"n": 499, "chapter": "Ressurgir", "text": "Nós, os homens, não sabemos ter com Jesus as suaves delicadezas que uns pobres homens rudes, mas cristãos, têm diariamente com uma infeliz criaturinha - a mulher, o filho, o amigo -, pobre também como eles. Esta realidade deveria servir-nos de revulsivo."}, {"n": 500, "chapter": "Ressurgir", "text": "É tão atraente e tão sugestivo o Amor de Deus, que o seu crescimento na vida de um cristão não tem limites."}, {"n": 501, "chapter": "Ressurgir", "text": "Não podes comportar-te como uma criança travessa ou como um louco. - Tens de ser pessoa rija, filho de Deus; sereno no teu trabalho profissional e na tua vida de relação, com uma presença do Senhor que te faça esmerar - te até nos menores detalhes."}, {"n": 502, "chapter": "Ressurgir", "text": "Se se faz justiça a seco, é possível que as pessoas se sintam feridas. - Portanto, deves agir sempre por amor a Deus, que a essa justiça acrescentará o bálsamo do amor ao próximo; e que purifica e limpa o amor terreno. Quando Deus está de permeio, tudo se sobrenaturaliza."}, {"n": 503, "chapter": "Ressurgir", "text": "Ama apaixonadamente o Senhor. Ama-O com loucura! Porque, se há amor - então! -, atrevo-me a afirmar que nem sequer são precisos propósitos. Os meus pais - pensa nos teus - não precisavam fazer nenhum propósito de amar-me, e que profusão de pormenores cotidianos de carinho tinham comigo! Com esse coração humano, podemos e devemos amar a Deus."}, {"n": 504, "chapter": "Ressurgir", "text": "O amor é sacrifício; e o sacrifício, por Amor, gozo."}, {"n": 505, "chapter": "Ressurgir", "text": "Responde a ti mesmo: - Quantas vezes por dia a tua vontade te pede que coloques o coração em Deus, para que Lhe entregues os teus afetos e as tuas obras? Boa medida para verificares a intensidade e a qualidade do teu amor."}, {"n": 506, "chapter": "Ressurgir", "text": "Convence-te, filho, de que Deus tem o direito de nos dizer: - Pensas em Mim? Tens presença de Mim? Procuras-me como teu apoio? Procuras-me como Luz da tua vida, como couraça..., como tudo? - Portanto, reafirma-te neste propósito: nas horas que a gente da terra qualifica como boas, clamarei: Senhor! Nas horas que chama de más, repetirei: Senhor!"}, {"n": 507, "chapter": "Ressurgir", "text": "Não percas nunca o sentido do sobrenatural. Ainda que vejas em toda a sua crueza as tuas próprias misérias, as tuas más inclinações - o barro de que estás feito -, Deus conta contigo."}, {"n": 508, "chapter": "Ressurgir", "text": "Tens de viver, como os outros que te rodeiam, com naturalidade, mas sobrenaturalizando cada instante do teu dia."}, {"n": 509, "chapter": "Ressurgir", "text": "É necessário um coração limpo, zelo pelas coisas de Deus e amor às almas, sem preconceitos, para se poder julgar com retidão de intenção. - Pensa bem nisso!"}, {"n": 510, "chapter": "Ressurgir", "text": "Ouvi falar a uns conhecidos sobre os seus aparelhos de radio. Quase sem perceber, levei o assunto ao terreno espiritual: temos muita tomada de terra, demasiada, e esquecemos a antena da vida interior... - Esta é a causa de que sejam tão poucas as almas que mantêm um trato íntimo com Deus: oxalá nunca nos falte a antena do sobrenatural."}, {"n": 511, "chapter": "Ressurgir", "text": "Minúcias e trivialidades às quais nada devo, das quais nada espero, ocupam a minha atenção mais do que o meu Deus? Com quem estou, quando não estou com Deus?"}, {"n": 512, "chapter": "Ressurgir", "text": "Diz-Lhe: - Senhor, nada quero fora do que Tu quiseres. Não me dês nem mesmo aquilo que te venho pedindo nestes dias, se me afasta um milímetro da tua Vontade."}, {"n": 513, "chapter": "Ressurgir", "text": "O segredo da eficácia reside em seres piedoso, sinceramente piedoso: assim, todo o teu dia transcorrerá com Ele."}, {"n": 514, "chapter": "Ressurgir", "text": "Propósito: “freqflentar”, se possível sem interrupção, a amizade e o trato amoroso e dócil com o Espírito Santo. - “Veni, Sancte Spiritus...!” - Vem, Espírito Santo, morar na minha alma!"}, {"n": 515, "chapter": "Ressurgir", "text": "Repete de todo o coração e sempre com mais amor, mais ainda quando estiveres perto do Sacrário ou tiveres o Senhor dentro do teu peito: “Non est qui se abscondat a calore eius” - que eu não te evite, que me invada o fogo do teu Espírito."}, {"n": 516, "chapter": "Ressurgir", "text": "“Ure igne Sancti Spiritus!” - queima-me com o fogo do teu Espírito!, clamas. E acrescentas: - É necessário que a minha pobre alma recomece quanto antes o vôo..., e que não deixe de voar até descansar nEle! - Acho ótimos os teus desejos. Vou pedir muito ao Paráclito por ti; vou invocá-Lo continuamente, para que se instale no centro do teu ser e presida e dê tom sobrenatural a todas as tuas ações, palavras, pensamentos e anseios."}, {"n": 517, "chapter": "Ressurgir", "text": "Ao celebrares a festa da Exaltação da Santa Cruz, suplicaste ao Senhor, com todas as veras da tua alma, que te concedesse a sua graça para “exaltares” a Cruz Santa nas tuas potências e nos teus sentidos... Uma vida nova! Um cunho para dares firmeza à autenticidade do teu cometimento..., todo o teu ser na Cruz! - Veremos, veremos."}, {"n": 518, "chapter": "Ressurgir", "text": "A mortificação deve ser contínua, como o bater do coração: assim teremos domínio sobre nós mesmos, e viveremos com os outros a caridade de Jesus Cristo."}, {"n": 519, "chapter": "Ressurgir", "text": "Amar a Cruz é saber sacrificar-se com gosto por amor de Cristo, ainda que custe e porque custa...: não te falta a experiência de que são coisas compatíveis."}, {"n": 520, "chapter": "Ressurgir", "text": "A alegria cristã não é fisiológica: o seu fundamento é sobrenatural, e está acima da doença e da contradição. - Alegria não é alvoroço de guizos ou de baile popular. A verdadeira alegria é algo mais íntimo: algo que nos faz estar serenos, transbordantes de júbilo, ainda que às vezes o rosto permaneça severo."}, {"n": 521, "chapter": "Ressurgir", "text": "Escrevia-te: - Embora compreenda que é um modo normal de falar, sinto desagrado quando ouço chamar cruzes às contrariedades nascidas da soberba da pessoa. Esses fardos não são a Cruz, a verdadeira Cruz, porque não são a Cruz de Cristo. Luta, pois, contra essas adversidades inventadas, que nada têm que ver com a marca de Cristo: desprende-te de todos os disfarces do eu!"}, {"n": 522, "chapter": "Ressurgir", "text": "Mesmo nos dias em que parece que se perde o tempo, através da prosa dos mil pequenos detalhes, diários, há poesia mais do que suficiente para nos sentirmos na Cruz: numa Cruz sem espetáculo."}, {"n": 523, "chapter": "Ressurgir", "text": "Não ponhas o coração em nada de caduco: imita a Cristo, que se fez pobre por nós e não tinha onde reclinar a cabeça. - Pede-Lhe que te conceda, no meio do mundo, um efetivo desprendimento, sem atenuantes."}, {"n": 524, "chapter": "Ressurgir", "text": "Um sinal claro de desprendimento é não considerar - de verdade - coisa alguma como própria."}, {"n": 525, "chapter": "Ressurgir", "text": "Aquele que vive sinceramente a fé, sabe que os bens temporais são meios, e emprega-os com generosidade, de modo heróico."}, {"n": 526, "chapter": "Ressurgir", "text": "Cristo ressuscitado, glorioso, despojou-se de tudo o que é terreno, para que os seus irmãos, os homens, pensássemos de que coisas temos que despojar-nos."}, {"n": 527, "chapter": "Ressurgir", "text": "É preciso amar a Santíssima Virgem: nunca a amaremos bastante! - Ama-a muito! - Que não te baste colocar imagens suas, e saudá-las, e dizer jaculatórias, mas que saibas oferecer-lhe - na tua vida cheia de rijeza - algum pequeno sacrifício em cada dia, para manifestar-lhe o teu amor, e o amor que queremos que lhe dedique a humanidade inteira."}, {"n": 528, "chapter": "Ressurgir", "text": "Esta é a verdade do cristão: entrega e amor - amor a Deus e, por Ele, ao próximo -, fundamentados no sacrifício."}, {"n": 529, "chapter": "Ressurgir", "text": "Jesus, eu me ponho confiadamente nos teus braços, escondida a minha cabeça no teu peito amoroso, pegado o meu coração ao teu Coração: quero, em tudo, o que Tu quiseres."}, {"n": 530, "chapter": "Ressurgir", "text": "Hoje, que o ambiente está cheio de desobediência, de murmuração, de bisbilhotice, de enredos, temos que amar mais do que nunca a obediência, a sinceridade, a lealdade, a simplicidade - e tudo isso com sentido sobrenatural, que nos fará mais humanos."}, {"n": 531, "chapter": "Ressurgir", "text": "Dizes-me que sim, que estás firmemente decidido a seguir a Cristo. - Pois então tens de caminhar ao passo de Deus; não ao teu!"}, {"n": 532, "chapter": "Ressurgir", "text": "Perguntas-me qual é o fundamento da nossa fidelidade. - Dir-te-ia a traços largos que se baseia no amor de Deus, que faz vencer todos os obstáculos: o egoísmo, a soberba, o cansaço, a impaciência... - Um homem que ama espezinha-se a si próprio; está ciente de que, mesmo que ame com toda a sua alma, ainda não sabe amar bastante."}, {"n": 533, "chapter": "Ressurgir", "text": "Diziam-me - e copio porque é muito bonito - que assim falava uma freirinha aragonesa, agradecida à bondade paternal de Deus: “Como Ele é agudo! Não Lhe escapa nada”."}, {"n": 534, "chapter": "Ressurgir", "text": "Tu - como todos os filhos de Deus - necessitas também da oração pessoal: dessa intimidade, desse relacionamento direto com Nosso Senhor - diálogo a dois, cara a cara -, sem te esconderes no anonimato."}, {"n": 535, "chapter": "Ressurgir", "text": "A primeira condição da oração é a perseverança; a segunda, a humildade. - Sê santamente teimoso, com confiança. Pensa que o Senhor, quando Lhe pedimos alguma coisa importante, talvez queira a súplica de muitos anos. Insiste!..., mas insiste sempre com mais confiança."}, {"n": 536, "chapter": "Ressurgir", "text": "Persevera na oração, como aconselha o Mestre. Esse ponto de partida será a origem da tua paz, da tua alegria, da tua serenidade e, portanto, da tua eficácia sobrenatural e humana."}, {"n": 537, "chapter": "Ressurgir", "text": "Num lugar onde se conversava e se ouvia música, surgiu a oração na tua alma, com um consolo inexplicável. Acabaste dizendo: - Jesus, não quero o consolo, quero-te a Ti."}, {"n": 538, "chapter": "Ressurgir", "text": "A tua vida tem que ser oração constante, diálogo contínuo com o Senhor: perante o agradável e o desagradável, perante o fácil e o difícil, perante o ordinário e o extraordinário... Em todas as ocasiões, tem que vir à tua cabeça, imediatamente, a conversa com teu Pai-Deus, procurando-O no centro da tua alma."}, {"n": 539, "chapter": "Ressurgir", "text": "Recolher-se em oração, em meditação, é tão fácil...! Jesus não nos faz esperar, não impõe ante-salas: é Ele quem espera. Basta que Lhe digas: - Senhor, quero fazer oração, quero conversar contigo!, e já estás na presença de Deus, falando com Ele. Como se fosse pouco, não te cerceia o tempo: deixa-o ao teu gosto. E isto, não durante dez minutos ou um quarto de hora. Não!, horas a fio, o dia inteiro! E Ele é quem é: o Onipotente, o Sapientíssimo."}, {"n": 540, "chapter": "Ressurgir", "text": "Na vida interior, tal como no amor humano, é preciso ser perseverante. Sim, tens de meditar muitas vezes os mesmos argumentos, insistindo até descobrires uma nova América. - E como é que não tinha percebido isto antes, com esta clareza?, perguntar-te-ás surpreendido. - Simplesmente porque às vezes somos como as pedras, que deixam resvalar a água, sem absorver nem uma gota. - Por isso, é necessário voltar a refletir sobre as mesmas coisas - que não são as mesmas! -, para nos empaparmos das bênçãos de Deus."}, {"n": 541, "chapter": "Ressurgir", "text": "No Santo Sacrifício do altar, o sacerdote toma o Corpo do nosso Deus e o Cálice com o seu Sangue, e os eleva sobre todas as coisas da terra, dizendo: “Per Ipsum, et cum Ipso, et in Ipso” - pelo meu Amor!, com o meu Amor!, no meu Amor! Une-te a esse gesto. Mais ainda: incorpora essa realidade à tua vida."}, {"n": 542, "chapter": "Ressurgir", "text": "Conta o Evangelista que Jesus, depois de ter realizado o milagre, quando querem coroá-Lo rei, se esconde. - Senhor, a Ti que nos fazes participar do milagre da Eucaristia, nós te pedimos que não te escondas, que vivas conosco, que te vejamos, que te toquemos, que te sintamos, que queiramos estar sempre junto de Ti, que sejas o Rei das nossas vidas e dos nossos trabalhos."}, {"n": 543, "chapter": "Ressurgir", "text": "Procura o convívio com as três Pessoas, com Deus Pai, com Deus Filho, com Deus Espírito Santo. E para chegares à Trindade Santíssima, passa por Maria."}, {"n": 544, "chapter": "Ressurgir", "text": "Não tem fé “viva” aquele que não tem uma entrega atual a Jesus Cristo."}, {"n": 545, "chapter": "Ressurgir", "text": "Todo o cristão deve procurar Cristo e relacionar-se com Ele, para poder amá-Lo sempre mais. - Acontece como com o namoro: o trato é necessário, porque, se duas pessoas não se vêem, não podem chegar a querer-se. E a nossa vida é de Amor."}, {"n": 546, "chapter": "Ressurgir", "text": "Detém-te a considerar a ira santa do Mestre, quando vê no Templo de Jerusalém que maltratam as coisas de seu Pai. - Que lição, para que nunca fiques indiferente, nem sejas covarde, quando não tratam respeitosamente o que é de Deus!"}, {"n": 547, "chapter": "Ressurgir", "text": "Enamora-te da Santíssima Humanidade de Jesus Cristo. - Não te dá alegria que Ele tenha querido ser como nós? Agradece a Jesus este cúmulo de bondade!"}, {"n": 548, "chapter": "Ressurgir", "text": "Chegou o Advento. Que bom tempo para remoçar o desejo, a nostalgia, as ânsias sinceras pela vinda de Cristo!, pela sua vinda cotidiana à tua alma na Eucaristia! - “Ecce veniet!” - está para chegar!, anima-nos a Igreja."}, {"n": 549, "chapter": "Ressurgir", "text": "Natal. - Cantam: “Venite, venite...” - Vamos, que Ele já nasceu. E depois de contemplar como Maria e José cuidam do Menino, atrevo-me a sugerir-te: olha-O de novo, olha-O sem descanso."}, {"n": 550, "chapter": "Ressurgir", "text": "Ainda que nos doa - e peço a Deus que nos aumente essa dor -, tu e eu não somos alheios à morte de Cristo, porque os pecados dos homens foram as marteladas que O pregaram com pregos ao madeiro."}, {"n": 551, "chapter": "Ressurgir", "text": "São José: não se pode amar a Jesus e a Maria sem amar o Santo Patriarca."}, {"n": 552, "chapter": "Ressurgir", "text": "Olha quantos motivos para venerar São José e para aprender da sua vida: foi um varão forte na fé...; levou adiante a sua família - Jesus e Maria -, com o seu trabalho esforçado...; velou pela pureza da Virgem, que era a sua Esposa...; e respeitou - amou! - a liberdade de Deus, que fez a escolha, não só da Virgem como Mãe, mas também dele como Esposo de Santa Maria."}, {"n": 553, "chapter": "Ressurgir", "text": "São José, nosso Pai e Senhor, castíssimo, limpíssimo, tu que mereceste trazer Jesus Menino em teus braços, e lavá-Lo e abraçá-Lo: ensina-nos a tratar o nosso Deus, a ser limpos, dignos de ser outros Cristos. E ajuda-nos a fazer e a ensinar, como Cristo, os caminhos divinos - ocultos e luminosos -, dizendo aos homens que podem ter continuamente, na terra, uma eficácia espiritual extraordinária."}, {"n": 554, "chapter": "Ressurgir", "text": "Tens de amar muito São José, amá-lo com toda a tua alma, porque é a pessoa que, com Jesus, mais amou Santa Maria e quem mais privou com Deus: quem mais O amou, depois da nossa Mãe. - Ele merece o teu carinho, e a ti convém-te buscar o seu convívio, porque é Mestre de vida interior e pode muito diante do Senhor e diante da Mãe de Deus."}, {"n": 555, "chapter": "Ressurgir", "text": "A Santíssima Virgem. Quem pode ser melhor Mestra de amor a Deus do que esta Rainha, do que esta Senhora, do que esta Mãe, que tem a relação mais íntima com a Trindade - Filha de Deus Pai, Mãe de Deus Filho, Esposa de Deus Espírito Santo -, e que é ao mesmo tempo Mãe nossa? - Recorre pessoalmente à sua intercessão."}, {"n": 556, "chapter": "Ressurgir", "text": "Chegarás a ser santo se tiveres caridade, se souberes fazer as coisas que agradem aos outros e que não sejam ofensa a Deus, ainda que a ti te custem."}, {"n": 557, "chapter": "Ressurgir", "text": "São Paulo dá-nos uma receita de caridade fina: “Alter alterius onera portate et sic adimplebitis legem Christi” - levai uns as cargas dos outros, e assim cumprireis a lei de Cristo. - Cumpre-se isto na tua vida?"}, {"n": 558, "chapter": "Ressurgir", "text": "Jesus Senhor Nosso amou tanto os homens que se encarnou, tomou a nossa natureza e viveu em contacto diário com pobres e ricos, com justos e pecadores, com jovens e velhos, com gentios e judeus. Dialogou constantemente com todos: com os que Lhe queriam bem, e com os que somente procuravam a maneira de retorcer as suas palavras, para condená-Lo. - Procura tu comportar-te como o Senhor."}, {"n": 559, "chapter": "Ressurgir", "text": "O amor às almas, por Deus, faz-nos querer a todos, compreender, desculpar, perdoar... Devemos ter um amor que cubra a multidão das deficiências das misérias humanas. Devemos ter uma caridade maravilhosa, “veritatem facientes in caritate”, defendendo a verdade - sem ferir."}, {"n": 560, "chapter": "Ressurgir", "text": "Quando te falo do “bom exemplo”, quero indicar-te também que tens de compreender e desculpar, que tens de encher o mundo de paz e de amor."}, {"n": 561, "chapter": "Ressurgir", "text": "Pergunta-te com freqflência: - Esmero-me em aprimorar a caridade com aqueles que convivem comigo?"}, {"n": 562, "chapter": "Ressurgir", "text": "Quando prego que é preciso fazer-se tapete onde os outros pisem macio, não pretendo dizer uma frase bonita: tem que ser uma realidade! - É difícil, como é difícil a santidade; mas é fácil, porque - insisto - a santidade é acessível a todos."}, {"n": 563, "chapter": "Ressurgir", "text": "No meio de tanto egoísmo, de tanta indiferença - cada um atrás das suas coisas! -, lembro-me daqueles burrinhos de madeira, fortes, robustos, trotando sobre uma mesa... - Um deles perdeu uma pata. Mas continuava em frente, porque se apoiava nos outros."}, {"n": 564, "chapter": "Ressurgir", "text": "Nós, os católicos - ao defendermos e mantermos a verdade, sem transigências -, temos de esforçar-nos por criar um clima de caridade, de convivência, que afogue todos os ódios e rancores."}, {"n": 565, "chapter": "Ressurgir", "text": "Num cristão, num filho de Deus, amizade e caridade fazem uma só coisa: luz divina que dá calor."}, {"n": 566, "chapter": "Ressurgir", "text": "A prática da correção fraterna - que tem raiz evangélica - é uma prova de carinho sobrenatural e de confiança. Agradece-a quando a receberes, e não deixes de praticá-la com aqueles com quem convives."}, {"n": 567, "chapter": "Ressurgir", "text": "Ao corrigir - porque se torna necessário e se quer cumprir com o dever -, é preciso contar com a dor alheia e com a dor própria. Mas que essa realidade não te sirva nunca de desculpa para te inibires."}, {"n": 568, "chapter": "Ressurgir", "text": "Coloca-te muito perto da tua Mãe, a Santíssima Virgem. - Tu deves estar sempre unido a Deus: procura a união com Ele junto da sua Mãe bendita."}, {"n": 569, "chapter": "Ressurgir", "text": "Escuta-me bem: estar no mundo e ser do mundo não quer dizer ser mundano."}, {"n": 570, "chapter": "Ressurgir", "text": "Tens de comportar-te como uma brasa incandescente, que pega fogo onde quer que esteja; ou, pelo menos, procura elevar a temperatura espiritual dos que te rodeiam, levando-os a viver uma intensa vida cristã."}, {"n": 571, "chapter": "Ressurgir", "text": "Deus quer que as suas obras, confiadas aos homens, vão para a frente à força de oração e de mortificação."}, {"n": 572, "chapter": "Ressurgir", "text": "O fundamento de toda a nossa atividade como cidadãos - como cidadãos católicos - está numa intensa vida interior: em sermos, eficaz e realmente, homens e mulheres que fazem do seu dia um diálogo ininterrupto com Deus."}, {"n": 573, "chapter": "Ressurgir", "text": "Quando estiveres com uma pessoa, tens de ver uma alma: uma alma que é preciso ajudar, que é preciso compreender, com quem é preciso conviver e que é preciso salvar."}, {"n": 574, "chapter": "Ressurgir", "text": "Empenhas-te em andar sozinho, fazendo a tua própria vontade, guiado exclusivamente pelo teu próprio juízo... e, bem vês!, o fruto chama-se “infecundidade”. Filho, se não abates o teu juízo, se és soberbo, se te dedicas ao “teu” apostolado, trabalharás durante toda a noite - toda a tua vida será uma noite! -, e no fim amanhecerás com as redes vazias."}, {"n": 575, "chapter": "Ressurgir", "text": "Pensar na morte de Cristo traduz-se num convite para que nos situemos perante os nossos afazeres cotidianos com absoluta sinceridade, e tomemos a sério a fé que professamos. Tem que ser uma ocasião de aprofundar na profundidade do Amor de Deus, para podermos assim - com a palavra e com as obras - mostrá-lo aos homens."}, {"n": 576, "chapter": "Ressurgir", "text": "Procura que na tua boca de cristão - que isso és e isso deves ser em todos os instantes - esteja a “imperiosa” palavra sobrenatural que mova, que incite, que seja a expressão da tua disposição vital comprometida."}, {"n": 577, "chapter": "Ressurgir", "text": "Esconde-se um grande comodismo - e, por vezes, uma grande falta de responsabilidade - naqueles que, constituídos em autoridade, fogem da dor de corrigir, com a desculpa de evitar o sofrimento aos outros. Talvez poupem desgostos nesta vida..., mas põem em risco a felicidade eterna - a sua e a dos outros - pelas suas omissões, que são verdadeiros pecados."}, {"n": 578, "chapter": "Ressurgir", "text": "O santo, para a vida de muitos, é “incômodo”. Mas isso não significa que tenha de ser insuportável. - O seu zelo nunca deve ser amargo; a sua correção nunca deve ferir; o seu exemplo nunca deve ser uma bofetada moral, arrogante, na cara do próximo."}, {"n": 579, "chapter": "Ressurgir", "text": "Aquele jovem sacerdote costumava dirigir-se a Jesus com as palavras dos Apóstolos: “Edissere nobis parabolam” - explica-nos a parábola. E acrescentava: - Mestre, mete em nossas almas a claridade da tua doutrina, para que nunca falte nas nossas vidas e nas nossas ações..., e para que possamos dá-la aos outros. - Dize-o tu também ao Senhor."}, {"n": 580, "chapter": "Ressurgir", "text": "Deves ter sempre a coragem - que é humildade e serviço de Deus - de apresentar as verdades da fé tal como são, sem concessões nem ambigflidades."}, {"n": 581, "chapter": "Ressurgir", "text": "Não é possível outra disposição num católico: defender “sempre” a autoridade do Papa; e estar “sempre” docilmente decidido a retificar a opinião, ante o Magistério da Igreja."}, {"n": 582, "chapter": "Ressurgir", "text": "Há muito tempo, uma pessoa perguntou-me indiscretamente se os que seguimos a carreira sacerdotal temos aposentadoria, pensão, ao chegarmos a velhos... Como não lhe respondesse, o importuno insistiu. - Ocorreu-me então a resposta que, em meu entender, é irretorquível: - O sacerdócio - disse-lhe - não é uma carreira, é um apostolado! - É assim que o sinto. E quis registrá-lo nestas notas para que - com a ajuda do Senhor - nunca nos esqueçamos da diferença."}, {"n": 583, "chapter": "Ressurgir", "text": "Ter espírito católico implica que deve pesar sobre os nossos ombros a preocupação por toda a Igreja, não somente por esta parcela concreta ou aquela outra; e exige que a nossa oração se estenda de norte a sul, de leste a oeste, em súplica generosa. Entenderás assim a exclamação - a jaculatória - daquele amigo, perante o desamor de tantos para com a nossa Santa Mãe: - Dói-me a Igreja!"}, {"n": 584, "chapter": "Ressurgir", "text": "“Pesa sobre mim a solicitude por todas as igrejas”, escrevia São Paulo; e este suspiro do Apóstolo recorda a todos os cristãos - também a ti! - a responsabilidade de pormos aos pés da Esposa de Jesus Cristo, da Igreja Santa, o que somos e o que podemos, amando-a fidelissimamente, mesmo à custa dos bens, da honra e da vida."}, {"n": 585, "chapter": "Ressurgir", "text": "Não te assustes - e, na medida em que possas, reage - ante essa conspiração do silêncio com que querem amordaçar a Igreja. Uns não deixam que se ouça a sua voz; outros não permitem que se contemple o exemplo dos que a pregam com as suas obras; outros apagam qualquer vestígio de boa doutrina..., e há tantas maiorias que não a suportam. Não te assustes, repito, mas não te canses de servir de alto-falante aos ensinamentos do Magistério."}, {"n": 586, "chapter": "Ressurgir", "text": "Deves fazer-te cada dia mais “romano”, amar essa condição bendita, que adorna os filhos da única e verdadeira Igreja, porque assim o quis Jesus Cristo."}, {"n": 587, "chapter": "Ressurgir", "text": "A devoção a Nossa Senhora desperta nas almas cristãs o impulso sobrenatural de agirem como “domestici Dei” - como membros da família de Deus."}, {"n": 588, "chapter": "Vitória", "text": "Imita a Virgem Santa: só o reconhecimento cabal do nosso nada pode tornar-nos preciosos aos olhos do Criador."}, {"n": 589, "chapter": "Vitória", "text": "Estou persuadido de que João, o Apóstolo jovem, permanece ao lado de Cristo na Cruz porque a Mãe o arrasta: tanto pode o Amor de Nossa Senhora!"}, {"n": 590, "chapter": "Vitória", "text": "Não alcançaremos nunca a autêntica alegria sobrenatural e humana, o “verdadeiro” bom humor, se não imitarmos “de verdade” Jesus; se não formos, como Ele, humildes."}, {"n": 591, "chapter": "Vitória", "text": "Dar-se sinceramente aos outros é de tal eficácia, que Deus o premia com uma humildade cheia de alegria."}, {"n": 592, "chapter": "Vitória", "text": "A humilhação, o aniquilamento, o esconder-se e desaparecer devem ser totais, absolutos."}, {"n": 593, "chapter": "Vitória", "text": "Humildade sincera: que poderá perturbar aquele que tem por deleite as injúrias, pois sabe que não merece outro tratamento?"}, {"n": 594, "chapter": "Vitória", "text": "Meu Jesus: o que é meu é teu, porque o que é teu é meu, e o que é meu, eu o abandono em Ti."}, {"n": 595, "chapter": "Vitória", "text": "És capaz de passar por essas humilhações, que te pede o próprio Deus, em coisas que não têm importância, que não obscurecem a verdade? - Não? Então não amas a virtude da humildade!"}, {"n": 596, "chapter": "Vitória", "text": "A soberba dificulta a caridade. - Pede diariamente ao Senhor - para ti e para todos - a virtude da humildade, porque com o passar dos an
