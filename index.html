 Maria Cléofas, e Salomé! Com um grupo de mulheres valentes, como essas, bem unidas à Virgem Dolorosa, que apostolado não se faria no mundo!"}, {"n": 983, "chapter": "Perseverança", "text": "Começar é de todos; perseverar, de santos. Que a tua perseverança não seja conseqflência cega do primeiro impulso, fruto da inércia; que seja uma perseverança refletida."}, {"n": 984, "chapter": "Perseverança", "text": "Diz-Lhe: “Ecce ego quia vocasti me!” - Aqui me tens, porque me chamaste!"}, {"n": 985, "chapter": "Perseverança", "text": "Sei que te afastaste do caminho, e não voltavas por vergonha. - Era mais lógico que tivesses vergonha de não retificar."}, {"n": 986, "chapter": "Perseverança", "text": "“A verdade é que não é preciso ser nenhum herói - confessas-me - para, sem excentricidades nem afetações de carola, saber isolar-se quando for necessário segundo os casos... e perseverar”. E acrescentas: “Desde que cumpra as normas que me deu, não me preocupam as intrigas e complicações do ambiente; o que me assustaria era ter medo dessas insignificâncias”. - Magnífico!"}, {"n": 987, "chapter": "Perseverança", "text": "Fomenta e preserva esse ideal nobilíssimo que acaba de nascer em ti. - Olha que se abrem muitas flores na primavera, e são poucas as que frutificam."}, {"n": 988, "chapter": "Perseverança", "text": "O desalento é inimigo da tua perseverança. - Se não lutas contra o desalento, chegarás ao pessimismo, primeiro, e à tibieza, depois. - Sê otimista."}, {"n": 989, "chapter": "Perseverança", "text": "Ora vamos! Depois de tanto dizer: “Cruz, Senhor, Cruz!”, está-se vendo que querias uma cruz ao teu gosto."}, {"n": 990, "chapter": "Perseverança", "text": "Constância, que nada desoriente. - Faz-te falta. Pede-a ao Senhor e faz o que puderes para obtê-la; porque é um grande meio para que não te separes do fecundo caminho que empreendeste."}, {"n": 991, "chapter": "Perseverança", "text": "Não podes “subir”, não é mesmo? - Não é de estranhar: aquela queda!... Persevera e “subirás”. - Recorda o que diz um autor espiritual: a tua pobre alma é um pássaro que ainda tem as asas empastadas de barro. É preciso muito calor do Céu e esforços pessoais, pequenos e constantes, para arrancar essas inclinações, essas imaginações, esse abatimento: esse barro pegajoso de tuas asas. E te verás livre. - Se perseveras, “subirás”."}, {"n": 992, "chapter": "Perseverança", "text": "Dá graças a Deus, que te ajudou, e rejubila com a tua vitória. - Que alegria tão profunda, essa que sente a tua alma depois de ter correspondido!"}, {"n": 993, "chapter": "Perseverança", "text": "Discorres... bem, friamente: quantos motivos para abandonar a tarefa! - E um ou outro, ao que parece, capital. Vejo, sem dúvida, que tens razões. - Mas não tens razão."}, {"n": 994, "chapter": "Perseverança", "text": "“Passou-me o entusiasmo”, escreveste-me. - Tu não deves trabalhar por entusiasmo, mas por Amor; com consciência do dever, que é abnegação."}, {"n": 995, "chapter": "Perseverança", "text": "Inabalável. Assim tens de ser. - Se fazem vacilar a tua perseverança as misérias alheias ou as próprias, formo um triste conceito do teu ideal. Decide-te de uma vez para sempre."}, {"n": 996, "chapter": "Perseverança", "text": "Tens uma pobre idéia do teu caminho quando, ao te sentires frio, julgas tê - lo perdido; é a hora da provação. Por isso te tiraram as consolações sensíveis."}, {"n": 997, "chapter": "Perseverança", "text": "Ausência, isolamento - provas para a perseverança. - Santa Missa, oração, sacramentos, sacrifícios, comunhão dos santos! - armas para vencer na prova."}, {"n": 998, "chapter": "Perseverança", "text": "Bendita perseverança a do burrico de nora!"}, {"n": 999, "chapter": "Perseverança", "text": "Qual é o segredo da perseverança? O Amor. - Enamora-te, e não O deixarás."}]}, {"slug": "sulco", "title": "Sulco", "total": 1000, "chapters": [{"n": 1, "title": "Generosidade", "start": 1, "end": 33}, {"n": 2, "title": "Respeitos humanos", "start": 34, "end": 51}, {"n": 3, "title": "Alegria", "start": 52, "end": 95}, {"n": 4, "title": "Audácia", "start": 96, "end": 124}, {"n": 5, "title": "Lutas", "start": 125, "end": 180}, {"n": 6, "title": "Pescadores de homens", "start": 181, "end": 232}, {"n": 7, "title": "Sofrimento", "start": 233, "end": 258}, {"n": 8, "title": "Humildade", "start": 259, "end": 289}, {"n": 9, "title": "Cidadania", "start": 290, "end": 322}, {"n": 10, "title": "Sinceridade", "start": 323, "end": 339}, {"n": 11, "title": "Lealdade", "start": 340, "end": 371}, {"n": 12, "title": "Disciplina", "start": 372, "end": 415}, {"n": 13, "title": "Personalidade", "start": 416, "end": 443}, {"n": 14, "title": "Oração", "start": 444, "end": 481}, {"n": 15, "title": "Trabalho", "start": 482, "end": 531}, {"n": 16, "title": "Frivolidade", "start": 532, "end": 553}, {"n": 17, "title": "Naturalidade", "start": 554, "end": 566}, {"n": 18, "title": "Veracidade", "start": 567, "end": 607}, {"n": 19, "title": "Ambição", "start": 608, "end": 631}, {"n": 20, "title": "Hipocrisia", "start": 632, "end": 647}, {"n": 21, "title": "Vida interior", "start": 648, "end": 695}, {"n": 22, "title": "Soberba", "start": 696, "end": 726}, {"n": 23, "title": "Amizade", "start": 727, "end": 768}, {"n": 24, "title": "Vontade", "start": 769, "end": 794}, {"n": 25, "title": "Coração", "start": 795, "end": 830}, {"n": 26, "title": "Pureza", "start": 831, "end": 849}, {"n": 27, "title": "Paz", "start": 850, "end": 874}, {"n": 28, "title": "O Além", "start": 875, "end": 898}, {"n": 29, "title": "A Língua", "start": 899, "end": 926}, {"n": 30, "title": "Propaganda", "start": 927, "end": 944}, {"n": 31, "title": "Responsabilidade", "start": 945, "end": 977}, {"n": 32, "title": "Penitência", "start": 978, "end": 1000}], "points": [{"n": 1, "chapter": "Generosidade", "text": "São muitos os cristãos persuadidos de que a Redenção se realizará em todos os ambientes do mundo, e de que deve haver almas - não sabem quais - que com Cristo contribuam para realizá-la. Mas eles a vêem a um prazo de séculos, de muitos séculos...; seria uma eternidade se se levasse a cabo ao passo de sua entrega. Assim pensavas tu, até que vieram “acordar-te”."}, {"n": 2, "chapter": "Generosidade", "text": "A entrega é o primeiro passo de uma veloz caminhada de sacrifício, de alegria, de amor, de união com Deus. - E assim, toda a vida se enche de uma bendita loucura, que faz encontrar felicidade onde a lógica humana só vê negação, padecimento, dor."}, {"n": 3, "chapter": "Generosidade", "text": "“Peça por mim - dizias -: que eu seja generoso, que progrida, que chegue a transformar-me de tal modo que algum dia possa ser útil em alguma coisa”. Bem. - Mas, que meios empregas para que esses propósitos se tornem eficazes?"}, {"n": 4, "chapter": "Generosidade", "text": "Muitas vezes te perguntas por que certas almas, que tiveram a ventura de conhecer o verdadeiro Jesus desde crianças, vacilam tanto em corresponder com o melhor que possuem: a vida, a família, os sonhos. Olha: tu, precisamente porque recebeste “tudo” de golpe, estás obrigado a mostrar-te muito agradecido ao Senhor: tal como reagiria um cego que recuperasse a vista de repente, enquanto aos outros nem lhes passa pela cabeça que devem dar graças porque vêem. Mas... não é suficiente. Todos os dias, tens que ajudar os que te rodeiam, para que se comportem com gratidão pela sua condição de filhos de Deus. Senão, não me digas que és agradecido."}, {"n": 5, "chapter": "Generosidade", "text": "Medita devagar: é muito pouco o que se me pede, para o muito que se me dá."}, {"n": 6, "chapter": "Generosidade", "text": "Para ti, que não acabas de “deslanchar”, considera o que me escrevia um teu irmão: “Custa, mas uma vez tomada a `decisão’, que suspiro de felicidade, ao encontrar-me seguro no caminho!”."}, {"n": 7, "chapter": "Generosidade", "text": "Estes dias - comentavas-me - transcorreram mais felizes do que nunca. E te respondi sem vacilar: foi porque “viveste” um pouco mais entregue do que habitualmente."}, {"n": 8, "chapter": "Generosidade", "text": "A chamada do Senhor - a vocação - apresenta-se sempre assim: “Se alguém quer vir após Mim, negue-se a si mesmo, tome a sua cruz e siga-Me”. Sim, a vocação exige renúncia, sacrifício. Mas como se torna prazeroso o sacrifício “gaudium cum pace”, alegria e paz -, se a renúncia é completa!"}, {"n": 9, "chapter": "Generosidade", "text": "Quando lhe falaram de comprometer-se pessoalmente, a sua reação foi raciocinar assim: “Nesse caso, poderia fazer isto..., teria que fazer aquilo...”. - Responderam-lhe: “Aqui não pechinchamos com o Senhor. A lei de Deus, o convite do Senhor, ou se pega ou se larga, tal como é. É preciso decidir-se: ou ir para a frente, sem nenhuma reserva e com muito ânimo, ou retirar-se. “Qui non est mecum...” - quem não está comigo, está contra Mim”."}, {"n": 10, "chapter": "Generosidade", "text": "Da falta de generosidade à tibieza não vai senão um passo."}, {"n": 11, "chapter": "Generosidade", "text": "Para que não o imites, copio de uma carta este exemplo de covardia: “Naturalmente, agradeço-lhe muito que se lembre de mim, porque preciso de muitas orações. Mas também agradeceria que ao suplicar ao Senhor que me faça `apóstolo’, não se esforçasse em pedir-Lhe que me exija a entrega de minha liberdade”."}, {"n": 12, "chapter": "Generosidade", "text": "Aquele teu conhecido, muito inteligente, bom burguês, boa gente, dizia: “Cumprir a lei, mas com medida, sem passar da risca, o mais estritamente possível”. E acrescentava: “Pecar? Não; mas dar-se, também não”. Causam verdadeira pena esses homens mesquinhos, calculistas, incapazes de sacrificar - se, de entregar-se por um ideal nobre."}, {"n": 13, "chapter": "Generosidade", "text": "É preciso pedir-te mais: porque podes dar mais, e deves dar mais. Pensa nisso."}, {"n": 14, "chapter": "Generosidade", "text": "“É muito difícil”, exclamas desanimado. - Escuta: se lutas, basta-te a graça de Deus. Prescindirás dos interesses pessoais, servirás aos outros por Deus, e ajudarás a Igreja no campo onde hoje se trava a batalha: na rua, na fábrica, na oficina, na universidade, no escritório, no teu ambiente, no meio dos teus."}, {"n": 15, "chapter": "Generosidade", "text": "Escreveste-me: “No fundo, é sempre a mesma coisa: muita falta de generosidade. Que pena e que vergonha descobrir o caminho e permitir que umas nuvenzinhas de pó - inevitáveis - turvem o final!”. Não te zangues se te digo que és tu o único culpado: arremete valentemente contra ti mesmo. Tens meios mais do que suficientes."}, {"n": 16, "chapter": "Generosidade", "text": "Quando o teu egoísmo te afasta da comum preocupação pelo bem-estar sadio e santo dos homens, quando te fazes calculista e não te comoves com as misérias materiais ou morais do teu próximo, obrigas-me a lançar-te em rosto uma palavra muito forte, para que reajas: se não sentes a bendita fraternidade com teus irmãos os homens, e vives à margem da grande família cristã, és um pobre enjeitado."}, {"n": 17, "chapter": "Generosidade", "text": "O cume? Para uma alma que se entrega, tudo se converte em cume por alcançar: cada dia descobre novas metas, porque nem sabe nem quer pôr limites ao Amor de Deus."}, {"n": 18, "chapter": "Generosidade", "text": "Quanto mais generoso fores - por Deus -, mais feliz serás."}, {"n": 19, "chapter": "Generosidade", "text": "Com freqflência surge a tentação de querermos reservar um pouco de tempo para nós mesmos... Aprende de uma vez por todas a pôr remédio a tanta pequenez, retificando imediatamente."}, {"n": 20, "chapter": "Generosidade", "text": "Eras da turma do “tudo ou nada”. E como nada podias..., que desastre! Começa a lutar com humildade, para acender essa tua pobre entrega, tão tacanha, até a tornares “totalmente” efetiva."}, {"n": 21, "chapter": "Generosidade", "text": "Nós, os que nos dedicamos a Deus, nada perdemos."}, {"n": 22, "chapter": "Generosidade", "text": "Gostaria de gritar ao ouvido de tantas e de tantos: não é sacrifício entregar os filhos a serviço de Deus; é honra e alegria."}, {"n": 23, "chapter": "Generosidade", "text": "Chegou para ele o momento da dura provação, e veio procurar-te desconsolado. - Lembras-te? Para ele - o amigo que te dava conselhos “prudentes” -, o teu modo de proceder não era senão utopia, fruto de uma deformação de idéias, captação de vontades, e... “sutilezas” do mesmo jaez. - “Esse entregar-se ao Senhor - sentenciava - é uma exacerbação anormal do sentimento religioso”. E, com a sua pobre lógica, pensava que entre a tua família se havia interposto um estranho: Cristo. Agora compreendeu o que tantas vezes lhe repetias: Cristo jamais separa as almas."}, {"n": 24, "chapter": "Generosidade", "text": "Eis uma tarefa urgente: sacudir a consciência dos que crêem e dos que não crêem - fazer uma leva de homens de boa vontade -, com o fim de que cooperem e proporcionem os instrumentos materiais para trabalhar com as almas."}, {"n": 25, "chapter": "Generosidade", "text": "Esse demonstra muito entusiasmo e compreensão. Mas quando vê que se trata “dele”, que “ele” tem de contribuir a sério, retira-se covardemente. Lembra-me aqueles que, em momento de grave perigo, gritavam com falsa valentia: “Guerra, guerra!”, mas nem queriam dar dinheiro, nem alistar-se para defender a sua pátria."}, {"n": 26, "chapter": "Generosidade", "text": "Dá pena verificar de que modo alguns entendem a esmola: uns tostões ou um pouco de roupa velha. Parece que não leram o Evangelho. Não andeis com receios: ajudai as pessoas a formar-se com a fé e a fortaleza suficientes para se desprenderem generosamente, em vida, daquilo que lhes é necessário. - Aos renitentes, explicai-lhes que é pouco nobre e elegante, também do ponto de vista terreno, esperar pelo fim, quando forçosamente já não podem levar nada consigo."}, {"n": 27, "chapter": "Generosidade", "text": "“Quem empresta, que não cobre; se cobra, que não seja tudo; se tudo, que não seja tal; se tal, inimigo mortal”. Que fazer?... Dar! Sem cálculo, e sempre por Deus. Assim viverás, também humanamente, mais perto dos homens, e contribuirás para que haja menos ingratos."}, {"n": 28, "chapter": "Generosidade", "text": "Vi rubor no rosto daquele homem simples, e quase lágrimas em seus olhos: prestava generosamente a sua colaboração em obras boas, com o dinheiro honesto que ele mesmo ganhava, e soube que os “bons” apodavam de bastardas as suas ações. Com ingenuidade de neófito nestas batalhas de Deus, sussurrava: “Estão vendo que me sacrifico... e ainda me sacrificam!”. - Falei-lhe devagar. Beijou o meu Crucifixo, e a sua indignação natural se trocou em paz e alegria."}, {"n": 29, "chapter": "Generosidade", "text": "Não sentes um ímpeto louco de tornar mais completa, mais “irremediável” a tua entrega?"}, {"n": 30, "chapter": "Generosidade", "text": "Como é ridícula a atitude dos pobrezinhos dos homens, quando uma vez e outra negamos bagatelas ao Senhor! Passa o tempo, as coisas vão-se vendo com o seu verdadeiro relevo..., e nascem a vergonha e a dor."}, {"n": 31, "chapter": "Generosidade", "text": "“Aure audietis, et non intellligetis: et videntis videbitis, et non perspicietis”. Palavras claras do Espírito Santo: ouvem com os seus próprios ouvidos, e não entendem; olham com os seus olhos, mas não enxergam. Por que te inquietas, se alguns, “vendo” o apostolado e conhecendo a sua grandeza, não se entregam? Reza tranqflilo, e persevera no teu caminho: se esses não se lançam, outros virão!"}, {"n": 32, "chapter": "Generosidade", "text": "Desde que lhe disseste “sim”, o tempo vai mudando a cor do teu horizonte - cada dia mais belo -, que brilha mais amplo e luminoso. Mas tens de continuar a dizer “sim”."}, {"n": 33, "chapter": "Generosidade", "text": "A Virgem Santa Maria, Mestra de entrega sem limites. - Lembras-te? Com palavras que eram um louvor dirigido a Ela, Jesus Cristo afirma: “Aquele que cumpre a Vontade de meu Pai, esse - essa - é minha mãe!...”. Pede a esta Mãe boa que ganhe força na tua alma - força de amor e de libertação - a sua resposta de generosidade exemplar: “Ecce ancilla Domini” - eis a escrava do Senhor"}, {"n": 34, "chapter": "Respeitos humanos", "text": "Quando está em jogo a defesa da verdade, como se pode desejar não desagradar a Deus e, ao mesmo tempo, não chocar com o ambiente? São coisas antagônicas: ou uma ou outra! É preciso que o sacrifício seja holocausto: é preciso queimar tudo..., até o “que vão dizer”, até isso que chamam reputação."}, {"n": 35, "chapter": "Respeitos humanos", "text": "Como vejo agora claramente que a “santa desvergonha” tem a sua raiz, muito profunda, no Evangelho! - Cumpre a Vontade de Deus..., lembrando-te de Jesus difamado, de Jesus cuspido e esbofeteado, de Jesus levado aos tribunais de homenzinhos..., e de Jesus calado!! - Propósito: baixar a fonte diante dos ultrajes e - contando também com as humilhações que, sem dúvida, virão - prosseguir a tarefa divina, que o Amor Misericordioso de Nosso Senhor nos quis confiar."}, {"n": 36, "chapter": "Respeitos humanos", "text": "Assusta o mal que podemos causar, se nos deixamos arrastar pelo medo ou pela vergonha de nos mostrarmos como cristãos na vida diária."}, {"n": 37, "chapter": "Respeitos humanos", "text": "Há alguns que, quando falam de Deus ou do apostolado, é como se sentissem a necessidade de se defender. Talvez porque não descobriram o valor das virtudes humanas e, pelo contrário, sobra-lhes deformação espiritual e covardia."}, {"n": 38, "chapter": "Respeitos humanos", "text": "É inútil agradar a todos. Descontentes, gente que proteste, haverá sempre. Olha como o resume a sabedoria popular: “Quando as coisas correm bem para os cordeiros, correm mal para os lobos”."}, {"n": 39, "chapter": "Respeitos humanos", "text": "Não te comportes como esses que se assustam perante um inimigo que só tem a força da sua “voz agressiva”."}, {"n": 40, "chapter": "Respeitos humanos", "text": "Compreendes o trabalho que se faz..., achas bem (!). Mas pões muito cuidado em não colaborar, e maior ainda em conseguir que os outros não vejam ou não pensem que colaboras. - Tens medo de que te julguem melhor do que és! disseste-me. - Não será que tens medo de que Deus e os homens te exijam mais coerência?"}, {"n": 41, "chapter": "Respeitos humanos", "text": "Parecia completamente decidido... Mas, ao pegar na caneta para acabar com o namoro, pesou mais a indecisão e faltou-lhe coragem: muito humano e compreensível, comentavam outros. - Pelo que se vê, segundo alguns, não estão os amores terrenos entre as coisas que se devem deixar para seguir plenamente a Jesus Cristo, quando Ele o pede."}, {"n": 42, "chapter": "Respeitos humanos", "text": "Há os que erram por fraqueza - pela fragilidade do barro de que estamos feitos -, mas se mantêm íntegros na doutrina. São os mesmos que, com a graça de Deus, demonstram a valentia e a humildade heróica de confessar o seu erro, e de defender - com afinco - a verdade."}, {"n": 43, "chapter": "Respeitos humanos", "text": "Alguns chamam imprudência e atrevimento à fé e à confiança em Deus."}, {"n": 44, "chapter": "Respeitos humanos", "text": "É uma loucura confiar em Deus!..., dizem - É não é maior loucura confiar em si mesmo ou nos demais homens?"}, {"n": 45, "chapter": "Respeitos humanos", "text": "Escreves-me que te chegaste, por fim, ao confessionário, e que experimentaste a humilhação de ter que abrir a cloaca da tua vida - assim dizes tu - diante de “um homem”. - Quando arrancarás essa vã estima que sentes por ti mesmo? Então irás à confissão feliz de te mostrardes como és, diante “desse homem” ungido - outro Cristo, o próprio Cristo! -, que te dá a absolvição, o perdão de Deus."}, {"n": 46, "chapter": "Respeitos humanos", "text": "Tenhamos a coragem de viver pública e constantemente de acordo com a nossa santa fé."}, {"n": 47, "chapter": "Respeitos humanos", "text": "Não podemos ser sectários, diziam-me com ares de equanimidade, perante a firmeza da doutrina da Igreja. Depois quando lhes fiz ver que quem tem a Verdade não é sectário, compreenderam o seu erro."}, {"n": 48, "chapter": "Respeitos humanos", "text": "Para nos convencermos de que é ridículo tomar a moda como norma de conduta, basta olhar para alguns retratos antigos."}, {"n": 49, "chapter": "Respeitos humanos", "text": "Gosto de que ames as procissões, todas as manifestações externas da nossa Mãe a Igreja Santa, para dar a Deus o culto devido..., e que as vivas!"}, {"n": 50, "chapter": "Respeitos humanos", "text": "“Ego palam locutus sum mundo”: Eu preguei publicamente diante de toda a gente, responde Jesus a Caifás, quando se aproxima o momento de dar a sua Vida por nós. - E, no entanto, há cristãos que se envergonham de manifestar “palam” - patentemente - veneração pelo Senhor."}, {"n": 51, "chapter": "Respeitos humanos", "text": "Quando ocorreu a debandada dos Apóstolos e o povo embravecido rasga as gargantas em ódio a Jesus Cristo, Santa Maria segue de perto o seu Filho pelas ruas de Jerusalém. não a arreda o clamor da multidão, nem deixa de acompanhar o Redentor enquanto todos os do cortejo, no anonimato, se fazem covardemente valentes para maltratar a Cristo. Invoca-a com força: “Virgo fidelis!” - Virgem fiel! -, e pede-lhe que os que nos dizemos amigos de Deus o sejamos deveras e a todas as horas."}, {"n": 52, "chapter": "Alegria", "text": "Ninguém é feliz, na terra, enquanto não se decide a não sê-lo. Assim transcorre o caminho: dor - dito em cristão! -, Cruz; Vontade de Deus, Amor; felicidade aqui e, depois, eternamente."}, {"n": 53, "chapter": "Alegria", "text": "“Servite Domino in laetitia!” - Servirei a Deus com alegria! Uma alegria que será conseqflência da minha Fé, da minha Esperança e do meu Amor..., que há de durar sempre porque, como nos assegura o Apóstolo, “Dominus prope est!”... - o Senhor me acompanha de perto. Caminharei com Ele, portanto, bem seguro, já que o Senhor é meu Pai..., e com a sua ajuda cumprirei a sua amável Vontade, ainda que me custe."}, {"n": 54, "chapter": "Alegria", "text": "Um conselho, que vos tenho repetido até cansar: estai alegres, sempre alegres. - Que estejam tristes os que não se considerem filhos de Deus."}, {"n": 55, "chapter": "Alegria", "text": "Procuro deixar a pele, para que os meus irmãos mais novos “pises macio”, como o senhor nos diz. - Há tantas alegrias neste “passar mal”!"}, {"n": 56, "chapter": "Alegria", "text": "Outro homem de fé escrevia-me: “Quando se está isolado por necessidade, nota-se perfeitamente a ajuda dos irmãos. Ao considerar que agora tenho que suportar tudo `sozinho’, penso muitas vezes que, se não fosse por essa `companhia que fazemos de longe uns aos outros’ - a bendita Comunhão dos Santos! -, não poderia conservar este otimismo que me invade”."}, {"n": 57, "chapter": "Alegria", "text": "Não esqueças que às vezes, faz-nos falta ter ao lado caras sorridentes."}, {"n": 58, "chapter": "Alegria", "text": "“Vocês são todos tão alegres! Ninguém o imaginaria”, ouvi comentar. Vem de longe o empenho diabólico dos inimigos de Cristo, que não se cansam de murmurar que as pessoas entregues a Deus são da espécie dos “soturnos”. E, infelizmente, alguns dos que querem ser “bons” servem-lhes de eco, com as suas ‘virtudes tristes”. - Nós Te damos graças, Senhor, porque quiseste contar com as nossas vidas, ditosamente alegres, para apagar essa falsa caricatura. - Peço-Te também que não o esqueçamos."}, {"n": 59, "chapter": "Alegria", "text": "Que ninguém leia tristeza nem dor na tua cara, quando difundes pelo ambiente do mundo o aroma do teu sacrifício: os filhos de Deus têm que ser sempre semeadores de paz e de alegria."}, {"n": 60, "chapter": "Alegria", "text": "A alegria de um homem de Deus, de uma mulher de Deus, há de ser transbordante: serena, contagiosa, cativante; em poucas palavras, há de ser tão sobrenatural, tão pegadiça e tão natural, que arraste outros pelos caminhos cristãos."}, {"n": 61, "chapter": "Alegria", "text": "“Contente?” - A pergunta deixou-me pensativo. - Ainda não se inventaram as palavras para exprimir tudo o que se sente - no coração e na vontade - quando se sabe que se é filho de Deus."}, {"n": 62, "chapter": "Alegria", "text": "Natal. Escreves-me: “Ao compasso da espera santa de Maria e de José, eu também espero, com impaciência, o Menino. Como ficarei contente em Belém! Pressinto que explodirei numa alegria sem limites. Ah!, e com Ele quero também nascer de novo...”. - Oxalá seja verdade este teu querer!"}, {"n": 63, "chapter": "Alegria", "text": "Propósito sincero: tornar amável e fácil o caminho aos outros, que já bastantes amarguras traz a vida consigo."}, {"n": 64, "chapter": "Alegria", "text": "Que maravilha converter infieis, ganhar algumas!... - Pois bem, tão grato a Deus, e ainda mais, é evitar que se percam."}, {"n": 65, "chapter": "Alegria", "text": "Outra vez as tuas antigas loucuras!... E depois, quando regressas, te sentes pouco alegre, porque te falta humildade. Parece que te obstinas em desconhecer a segunda parte da parábola do filho pródigo, e ainda continuas apegado à pobre felicidade das bolotas. Com o orgulho ferido pela tua fragilidade, não te decides a pedir perdão, e não consideras que, se te humilhas, espera-te a jubilosa acolhida de teu Pai-Deus, a festa pelo teu regresso e pelo teu recomeço."}, {"n": 66, "chapter": "Alegria", "text": "É verdade; não valemos nada, não somos nada, não podemos nada, não temos nada. E, simultaneamente, no meio da luta cotidiana, não faltam os obstáculos, as tentações... Mas a “alegria” dos teus irmãos dissipará todas as dificuldades, tão logo te reúnas com eles, porque os verás firmemente apoiados nEle “quia Tu es Deus fortitudo mea” - porque Tu és, Senhor a nossa fortaleza."}, {"n": 67, "chapter": "Alegria", "text": "Repete-se a cena, como com os convidados da parábola. Uns, medo: outros, ocupações; bastantes..., histórias, desculpas tolas. Resistem. Assim andam: enfastiados, embaralhados, sem vontade de nada, entediados, amargurados. Quando é tão fácil aceitar o divino convite de cada momento, e viver alegre e feliz!"}, {"n": 68, "chapter": "Alegria", "text": "É muito cômodo dizer: “Não presto; não me corre bem - não nos corre bem - uma só coisa”. - Além de que não é verdade, esse pessimismo encobre uma poltronice muito grande... Há coisas que fazes bem, e coisas que fazes mal. Enche-te de contentamento e de esperança pelas primeiras; e enfrenta - sem desalento - as segundas, para retificar: e correrão bem."}, {"n": 69, "chapter": "Alegria", "text": "“Padre, tal como me aconselhou, rio-me das minhas misérias - sem esquecer que não devo transigir -, e então sinto-me muito mais alegre. “Pelo contrário, quando cometo a tolice de ficar triste, fico com a impressão de que perco o caminho”."}, {"n": 70, "chapter": "Alegria", "text": "Perguntaste-me se tenho cruz. E te respondi que sim, que nós sempre temos Cruz. - Mas uma Cruz gloriosa, cunho divino, garantia de autenticidade de sermos filhos de Deus. Por isso, sempre caminhamos felizes com a Cruz."}, {"n": 71, "chapter": "Alegria", "text": "Sentes mais alegria. Mas desta vez trata-se de uma alegria nervosa, um pouco impaciente, acompanhada da clara sensação de que alguma coisa em ti se despedaça em sacrifício. Escuta-me bem: aqui na terra, não há felicidade completa. Por isso, agora, imediatamente, sem palavras e sem “vitimismos”, oferece-te em oblação a Deus, com uma entrega total e absoluta."}, {"n": 72, "chapter": "Alegria", "text": "Estás passando uns dias de alvoroço, coma alma inundada de sol e de cor. E, coisa estranha, os motivos da tua felicidade são os mesmos que em outras ocasiões te desanimavam! É o que acontece sempre: tudo depende do ponto de mira. - “Laetetur cor quaerentium Dominum!” - Quando se procura o Senhor, o coração transborda sempre de alegria."}, {"n": 73, "chapter": "Alegria", "text": "Que diferença entre esses homens sem fé, tristes e vacilantes por causa de sua existência vazia, exposto como cata-ventos à “variabilidade” das circunstâncias, e a nossa vida confiante de cristãos, alegre e firme, maciça, por causa do conhecimento e do absoluto convencimento do nosso destino sobrenatural!"}, {"n": 74, "chapter": "Alegria", "text": "Não és feliz, porque ficas ruminando tudo como se sempre fosses tu o centro: é que te dói o estômago, é que te cansas, é que te disseram isto ou aquilo... - Experimentaste pensar nEle e, por Ele, nos outros?"}, {"n": 75, "chapter": "Alegria", "text": "“Miles” - soldado, chama o Apóstolo ao cristão. Pois bem, nesta bendita e cristã peleja de amor e de paz pela felicidade de todas as almas, há, dentro das fileiras de Deus, soldados cansados, famintos, lacerados pelas feridas..., mas alegres: levam no coração a luzes seguras da vitória."}, {"n": 76, "chapter": "Alegria", "text": "“Quero enviar-lhe, Padre, o propósito de estar sempre sorridente: coração risonho, ainda que mo apunhalem”. - Parece-me um propósito acertado. Rezo para que o cumpras."}, {"n": 77, "chapter": "Alegria", "text": "Em certos momentos, oprime-te um começo de desânimo, que mata todo o seu entusiasmo, e que mal consegues vencer à força de atos de esperança. - Não tem importância: é a hora boa de pedires mais graça a Deus, e para a frente! Renova a alegria de lutar, ainda que percas uma escaramuça."}, {"n": 78, "chapter": "Alegria", "text": "Chegaram nuvens densas de falta de vontade, de perda de entusiasmo. Caíram aguaceiros de tristeza, com a clara sensação de te encontrares atado. E, como remate, assomaram decaimentos, que nascem de uma realidade mais ou menos objetiva: tantos anos lutando..., e ainda estás tão atrás, tão longe. Tudo isto é necessário, e Deus conta com isso: para alcançarmos o “gaudium cum pace” - a paz e a alegria verdadeiras -, temos de acrescentar à convicção da nossa filiação divina, que nos enche de otimismo, o reconhecimento da nossa fraqueza pessoal."}, {"n": 79, "chapter": "Alegria", "text": "Rejuveneceste! De fato, percebes que o trato com Deus te devolveu um pouco à época simples e feliz da juventude, até mesmo à segurança e alegria - sem criancices - da infância espiritual... Olhas à tua volta e verificas que acontece outro tanto aos demais: vão passando os anos desde o seu encontro com o Senhor e, com a maturidade, robustecem-se uma juventude e uma alegria indeléveis. Não estão jovens: São jovens e alegres! Esta realidade da vida interior atrai, confirma e subjuga as almas. Agradece-o diariamente “ad Deum qui laetificat iuventutem” - ao Deus que enche de alegria a tua juventude."}, {"n": 80, "chapter": "Alegria", "text": "A graça de Deus não te falta. Portanto, se correspondes, deves sentir-te seguro. O triunfo de ti: a tua fortaleza e o teu ímpeto - unidos a essa graça - são razão mais que suficiente para dar-te o otimismo de quem tem por certa a vitória."}, {"n": 81, "chapter": "Alegria", "text": "Talvez ontem fosses uma dessas pessoas amarguradas nos seus sonhos, decepcionadas nas suas ambições humanas. Hoje, desde que Ele se meteu na tua vida - obrigado, meu Deus! -, ris e cantas, e levas o sorriso, o Amor e a felicidade aonde quer que vás."}, {"n": 82, "chapter": "Alegria", "text": "Muitos se sentem infelizes, precisamente por terem demasiado de tudo. - Os cristãos, se verdadeiramente se comportam como filhos de Deus, poderão passar incomodidades, calor, fadiga, frio... Mas jamais lhes faltará a alegria, porque isso - tudo! -, quem o dispõe é Ele, e Ele é a fonte da verdadeira felicidade."}, {"n": 83, "chapter": "Alegria", "text": "Ante um panorama de homens sem fé, sem esperança; perante cérebros que se agitam, à beira da angústia, procurando uma razão de ser para a vida, tu encontraste uma meta: Ele! E esta descoberta injetará permanentemente na tua existência uma alegria nova, transformar-te-á, e te apresentará uma imensidade diária de coisas formosas que te eram desconhecidas, e que mostram a gozosa amplidão desse caminho largo, que te conduz a Deus."}, {"n": 84, "chapter": "Alegria", "text": "A tua felicidade na terra identifica-se com a tua fidelidade à fé, à pureza e ao caminho que o Senhor te traçou."}, {"n": 85, "chapter": "Alegria", "text": "Dá graças a Deus por estares contente, com uma alegria profunda que não sabe ser ruidosa."}, {"n": 86, "chapter": "Alegria", "text": "Com Deus - pensava -, cada novo dia me parece mais atrativo. Vou vivendo aos “pedacinhos”. Um dia acho magnífico um detalhe; outro, descubro um panorama que antes não tinha notado... A este passo, não sei o que acontecerá com o decorrer do tempo. Depois, reparei que Ele me assegurava: Pois bem, cada dia será maior o teu contentamento, porque aprofundarás mais e mais na aventura divina, na “complicação” tão grande em que te meti. E verificarás que Eu não te abandono."}, {"n": 87, "chapter": "Alegria", "text": "A alegria é uma conseqflência da entrega. Confirma-se em cada volta da nora."}, {"n": 88, "chapter": "Alegria", "text": "Que alegria imutável te causa o haveres-te entregado a Deus!... E que inquietação, e que ânsias hás de ter de que todos participem da tua alegria!"}, {"n": 89, "chapter": "Alegria", "text": "Tudo o que agora de preocupa cabe dentro de um sorriso, esboçado por amor de Deus."}, {"n": 90, "chapter": "Alegria", "text": "Otimismo? Sempre! Também quando as coisas correm aparentemente mal: talvez seja essa a altura de romperes a cantar, com um Glória, porque te refugiaste nEle, e dEle só te pode vir o bem."}, {"n": 91, "chapter": "Alegria", "text": "Esperar não significa começar a ver a luz, mas confiar de olhos fechados em que o Senhor a possui plenamente e vive nessa claridade. Ele é a Luz."}, {"n": 92, "chapter": "Alegria", "text": "Dever de cada cristão é levar a paz e a felicidade pelos diversos ambientes da terra, numa cruzada de fortaleza e de alegria, que sacuda até os corações murchos e apodrecidos, e os levante para Ele."}, {"n": 93, "chapter": "Alegria", "text": "Se arrancares pela raiz qualquer assomo de inveja, e te alegrares sinceramente com os êxitos dos outros, não perderás a alegria."}, {"n": 94, "chapter": "Alegria", "text": "Abordou-me aquele amigo: “Disseram-me que estás apaixonado”. - Fiquei muito surpreso e só me ocorreu perguntar-lhe pela origem da notícia. Confessou-me que a lia nos meus olhos, que brilhavam de alegria."}, {"n": 95, "chapter": "Alegria", "text": "Como seria o olhar alegre de Jesus! O mesmo que brilharia nos olhos de sua Mãe, que não pode conter a alegria - “Magnificat anima mea Dominum!” - e a sua alma glorifica o Senhor, desde que O traz de si e a seu lado. Oh Mãe! Que a nossa alegria, como a tua, seja a alegria de estar com Ele e de O ter."}, {"n": 96, "chapter": "Audácia", "text": "Não sejais almas de “bitola estreita”, homens ou mulheres menores de idade, curtos de vista, incapazes de abarcar o nosso horizonte sobrenatural cristão de filhos de Deus. Deus e audácia!"}, {"n": 97, "chapter": "Audácia", "text": "Audácia não é imprudência, nem ousadia irrefletida, nem simples atrevimento. A audácia é fortaleza, virtude cardeal, necessária para a vida da alma."}, {"n": 98, "chapter": "Audácia", "text": "Tu te decidiste, mais por reflexão do que por fogo e entusiasmo. Não houve lugar para o sentimento, embora desejasses tê-lo: tu te entregaste quando te convenceste de que Deus assim o queria. E, a partir daquele instante, não voltaste a “sentir” nenhuma dúvida séria; sentiste, pelo contrário, uma alegria tranqflila, serena, que de vez em quando transborda. Assim paga Deus as audácias do Amor."}, {"n": 99, "chapter": "Audácia", "text": "Li certa vez um provérbio muito popular em alguns países: “O mundo é de Deus, mas Deus o aluga aos valentes”. E fez-me refletir. - Que estás esperando?"}, {"n": 100, "chapter": "Audácia", "text": "Não sou o apóstolo que deveria ser. Sou... o tímido. - Não estarás apequenado, porque o teu amor é curto? - Reage!"}, {"n": 101, "chapter": "Audácia", "text": "As dificuldades encolheram-te, e te tornaste “prudente, moderado e objetivo”. - Lembra-te de que sempre desprezaste esses termos, quando são sinônimos de covardia, apoucamento e comodismo."}, {"n": 102, "chapter": "Audácia", "text": "Medo? É próprio dos que sabem que agem mal. Tu, nunca."}, {"n": 103, "chapter": "Audácia", "text": "Há uma quantidade bem considerável de cristãos que seriam apóstolos..., se não tivessem medo. São os mesmos que depois se queixam, porque o Senhor - dizem! - os abandona. Que fazem eles com Deus?"}, {"n": 104, "chapter": "Audácia", "text": "“Somos muitos; com a ajuda de Deus, podemos chegar a toda a parte”, comentam entusiasmados. - Então, por que te amedrontas? Com a graça divina, podes chegar a ser santo, que é o que interessa."}, {"n": 105, "chapter": "Audácia", "text": "Quando a consciência remorde, por termos deixado de realizar uma coisa boa, é sinal de que o Senhor queria que não a omitíssemos. - De fato. Além disso, tem por certo que “podias” tê-la feito, com a graça de Deus."}, {"n": 106, "chapter": "Audácia", "text": "Não o esqueçamos: no cumprimento da Vontade Divina, as dificuldades se ultrapassam por cima..., ou por baixo..., ou ao largo. Mas..., ultrapassam-se!"}, {"n": 107, "chapter": "Audácia", "text": "Quando se trabalha para expandir um empreendimento apostólico, o “não” nunca é uma resposta definitiva. Insiste!"}, {"n": 108, "chapter": "Audácia", "text": "És demasiado “precavido” ou demasiado pouco “sobrenatural” e, por isso, pecas por esperto: não inventes tu mesmo os “problemas”, nem queiras resolvê - los todos. - Talvez aquele que te escuta seja menos “esperto” ou mais “generoso” do que tu e, como conta Deus, não te levantará tantas dificuldades."}, {"n": 109, "chapter": "Audácia", "text": "Há uns modos de agir tão prudenciais que, numa palavra, significam pusilanimidade."}, {"n": 110, "chapter": "Audácia", "text": "Convence-te: quando se trabalha por Deus, não há dificuldades que não se possam superar, nem desalentos que façam abandonar a tarefa, nem fracassos dignos deste nome, por mais infrutíferos que se apresentem os resultados."}, {"n": 111, "chapter": "Audácia", "text": "A tua fé é demasiado pouco operante: dir-se-ia que é de carola, mais do que de homem que luta por ser santo."}, {"n": 112, "chapter": "Audácia", "text": "Serenidade! Audácia! Desbarata com essas virtudes a “quinta coluna” dos tíbios, dos assustados, dos traidores."}, {"n": 113, "chapter": "Audácia", "text": "Asseguraste-me que querias lutar sem tréguas. E agora me vens de asa caída. Olha, até humanamente, convém que não te dêem tudo resolvido, sem problemas. Alguma coisa - muito! - te cabe fazer a ti. Senão, como hás de “fazer-te” santo?"}, {"n": 114, "chapter": "Audácia", "text": "Não te lanças a trabalhar nesse empreendimento sobrenatural, porque - assim o dizes - tens medo de não saber agradar, de tratar de algum assunto de maneira infeliz. - Se pensasses mais em Deus, essas sem-razões desapareceriam."}, {"n": 115, "chapter": "Audácia", "text": "Às vezes penso que uns poucos inimigos de Deus e de sua Igreja vivem do medo de muitos bons, e encho-me de vergonha."}, {"n": 116, "chapter": "Audácia", "text": "Enquanto conversávamos, afirmava-me que preferia não sair nunca do tugúrio onde vivia, porque gostava mais de contar as vigas da “sua” estrebaria do que as estrelas do céu. - Assim são muitos, incapazes de prescindir das suas pequenas coisas, para levantar os olhos ao céu. Já é tempo de que adquiram uma visão de mais altura!"}, {"n": 117, "chapter": "Audácia", "text": "Compreendo a alegria sobrenatural e humana daquele homem que tinha a sorte de ser um ponta-de-lança na semeadura divina. “É esplêndido sentir-se único, para sacudir toda uma cidade e seus arredores”, repetia para si mesmo, muito convicto. - Não esperes até contar com mais meios ou até que venham outros: as almas precisam de ti hoje, agora."}, {"n": 118, "chapter": "Audácia", "text": "Sê atrevido na tua oração, e o Senhor te transformará de pessimista em otimista; de tímido em audaz; de acanhado de espírito em homem de fé, em apóstolo!"}, {"n": 119, "chapter": "Audácia", "text": "Os problemas que antes te oprimiam - pareciam-te altíssimas cordilheiras - desapareceram por completo, resolveram-se à maneira divina, como, quando o Senhor mandou aos ventos e às águas que se acalmassem. - E pensar que ainda duvidavas!"}, {"n": 120, "chapter": "Audácia", "text": "“Não ajudem tanto o Espírito Santo!”, dizia um amigo, brincando, mas com muito medo. - Respondi: penso que “O ajudamos” pouco."}, {"n": 121, "chapter": "Audácia", "text": "Quando vejo tantas covardias, tantas falsas prudências..., neles e nelas, ardo em desejos de perguntar-lhes: então a fé a confiança são para pregar, não para praticar?"}, {"n": 122, "chapter": "Audácia", "text": "Encontras-te numa atitude que te parece bastante estranha: por um lado, diminuído, ao olhares para dentro; e, por outro, seguro, animado, ao olhares para cima. - Não te preocupes: é sinal de que te vais conhecendo melhor e - isso, sim, é o que importa! -, de que O vais conhecendo melhor a Ele."}, {"n": 123, "chapter": "Audácia", "text": "Viste? Com Ele, pudeste! De que te admiras? - Convence-te: não tens por que maravilhar-te. Confiando em Deus - confiando deveras! -, as coisas tornam-se fáceis. E, além disso, ultrapassa-se sempre o limite do imaginado."}, {"n": 124, "chapter": "Audácia", "text": "Queres viver a audácia santa, para conseguir que Deus atue através de ti? - recorre a Maria, e Ela te acompanhará pelo caminho da humildade, de modo que, diante dos impossíveis para a mente humana, saibas responder com um “fiat!” - faça-se! - que una a terra ao Céu."}, {"n": 125, "chapter": "Lutas", "text": "Nem todos podem chegar a ser ricos, sábios, famosos... Em contrapartida, todos - sim, “todos” - estamos chamados a ser santos."}, {"n": 126, "chapter": "Lutas", "text": "Ser fiel a Deus exige luta. E luta corpo a corpo, homem a homem - homem velho e homem de Deus -, detalhe a detalhe, sem claudicar."}, {"n": 127, "chapter": "Lutas", "text": "A provação, não o nego, está ficando demasiado dura: tens que subir a ladeira acima, a “contragosto”. - Que te aconselho? - repete: “Omnia in bonum!”, tudo o que sucede, “tudo o que me sucede”, é para meu bem... Por conseguinte - e esta é a conclusão acertada-, aceita isso, que te parece custoso, como uma doce realidade."}, {"n": 128, "chapter": "Lutas", "text": "Hoje não bastam mulheres ou homens bons. - Além disso, não é suficientemente bom aquele que só se contenta em ser... quase bom: é preciso ser “revolucionário”. Perante o hedonismo, perante a carga pagã e materialista que nos oferecem, Cristo quer anticonformistas!, rebeldes de Amor!"}, {"n": 129, "chapter": "Lutas", "text": "A santidade, o verdadeiro afã por alcançá-la, não faz pausas nem tira férias."}, {"n": 130, "chapter": "Lutas", "text": "Alguns comportam-se, ao longo da vida, como se o Senhor tivesse falado de entrega e de conduta reta somente àqueles a quem não custasse - não existem! - ou aos que não precisassem lutar. Esquecem que, para todos, Jesus disse: o Reino dos Céus arrebata-se com violência, com a luta santa de cada instante."}, {"n": 131, "chapter": "Lutas", "text": "Que ânsias têm muitos de reformar! Não seria melhor que nos reformássemos todos - cada um -, para cumprirmos fielmente o que está mandado?"}, {"n": 132, "chapter": "Lutas", "text": "Vais chapinhando nas tentações, pões-te em perigo, brincas com a vista e com a imaginação, ficas conversando sobre... estupidez. - E depois te assustas por te assaltarem dúvidas, escrúpulos, confusões, tristeza e desalento. - Tens de admitir que és pouco conseqflente."}, {"n": 133, "chapter": "Lutas", "text": "Depois do entusiasmo inicial, começaram as vacilações, os titubeios, os temores. - Preocupam-te os estudos, a família, o problema econômico e, sobretudo, o pensamento de que não consegues, de que talvez não sirvas, de que te falta experiência da vida. Eu te darei um meio seguro para venceres esses temores - tentações do diabo ou da tua falta de generosidade! -: “despreza-os”, tira da tua memória essas lembranças. Já o pregou de modo terminante o Mestre há vinte séculos: “Não olhes para trás!”."}, {"n": 134, "chapter": "Lutas", "text": "Temos de fomentar em nossas almas um verdadeiro horror ao pecado. Senhor - repete-o de coração contrito -, que eu não Te ofenda mais! Mas não te assustes ao notares o lastro do pobre corpo e das humanas paixões: seria tolo e ingenuamente pueril que descobrisses agora que “isso” existe. A tua miséria não é obstáculo, mas acicate para que te unas mais a Deus, para que O procures com constância, porque Ele nos purifica."}, {"n": 135, "chapter": "Lutas", "text": "Se a imaginação ferve em torno de ti mesmo, crias situações ilusórias, cenários que, ordinariamente, não combinam com o teu caminho, e te distraem totalmente, te esfriam e te afastam da presença de Deus. - Vaidade. Se a imaginação volteia em torno dos outros, cais facilmente no defeito de julgá-los - quando não tens essa missão -, e interpretas de modo rasteiro e pouco objetivo o seu comportamento. - Juízos temerários. Se a imaginação esvoaça sobre os teus próprios talentos e modos de dizer, ou sobre o clima de admiração que despertas nos outros, expões-te a perder a retidão de intenção e a dar pasto à soberba. Geralmente, soltar a imaginação implica uma perda de tempo, mas, além disso, quando não se domina, abre passagem a um filão de tentações voluntárias. - Não abandones nenhum dia a mortificação interior!"}, {"n": 136, "chapter": "Lutas", "text": "Não tenhas a ingenuidade tola de pensar que tens de sofrer tentações, para te certificares de que estás firme no caminho. Seria como desejar que te parassem o coração, para demonstrarem a ti mesmo que queres viver."}, {"n": 137, "chapter": "Lutas", "text": "Não dialogues com a tentação. Deixa-me que te repita: tem a coragem de fugir, e a energia de não manusear a tua fraqueza pensando até onde poderias chegar. Corta, sem concessões!"}, {"n": 138, "chapter": "Lutas", "text": "Não tens desculpa nenhuma. A culpa é somente tua. Se sabes - conheces-te o bastante - que, por esse caminho - com essas leituras, com essa companhia... -, podes acabar no precipício, por que te obstinas em pensar que talvez seja um atalho que facilita a tua formação ou que amadurece a tua personalidade? Muda radicalmente o teu plano, ainda que te exija mais esforço, menos diversões ao alcance da mão. Já é tempo de que te comportes como uma pessoa responsável."}, {"n": 139, "chapter": "Lutas", "text": "Dói muito ao Senhor a inconsciência de tantos e de tantas, que não se esforçam por evitar os pecados veniais deliberados. É o normal - pensam e justificam-se -, porque nesses tropeços caímos todos! Ouve-me bem: também a maioria daquela chusma, que condenou Cristo e lhe a morte, começou apenas por gritar - como os outros! -, por afluir ao Horto das Oliveiras - como os outros! -... No fim, empurrados também pelo que “todos” faziam, não souberam ou não quiseram retroceder..., e crucificaram Jesus! Agora, depois de vinte séculos, ainda não aprendemos."}, {"n": 140, "chapter": "Lutas", "text": "Altos e baixos. Tens muitos - demasiados! - altos e baixos. A razão é clara: até aqui; levaste uma vida fácil, e não queres perceber que do “desejar” ao “dar-se” vai uma distância notável."}, {"n": 141, "chapter": "Lutas", "text": "Como necessariamente, mais cedo ou mais tarde, terás de tropeçar com a evidência da tua própria miséria pessoal, quero prevenir-te contra algumas tentações, que o diabo te insinuará nessa ocasião e que tens de repelir imediatamente: o pensamento de que Deus se esqueceu de ti, de que a tua chamada para o apostolado é vá, ou de que o peso da dor e dos pecados do mundo é superior às tuas forças de apóstolo... - Nada disso é verdade!"}, {"n": 142, "chapter": "Lutas", "text": "Se lutas de verdade, precisas fazer exame de consciência. - Cuida do exame diário: vê se sentes dor de Amor, porque não tratas Nosso Senhor como deverias."}, {"n": 143, "chapter": "Lutas", "text": "Assim como muitos comparecem à colocação das “primeiras pedras”, sem querer saber se depois se acabará a obra iniciada, assim os pecadores se iludem com as “últimas vezes”."}, {"n": 144, "chapter": "Lutas", "text": "Quanto se trata de “cortar” - não o esqueças -, a “última vez” tem que ser a anterior, a que já passou."}, {"n": 145, "chapter": "Lutas", "text": "Aconselho-te que tentes alguma vez voltar... ao começo da tua “primeira conversão”, coisa que, se não é fazer-se como criança, é muito parecida: na vida espiritual, é preciso deixar-se guiar com inteira confiança, sem medos nem duplicidades; é preciso falar com absoluta clareza daquilo que se tem na cabeça e na alma."}, {"n": 146, "chapter": "Lutas", "text": "Como podes sair desse estado de tibieza, de lamentável languidez, se não empregas os meios! Lutas muito pouco e, quando te esforças, o fazes como que por birra e com desgosto, quase com o desejo de que os teus débeis esforços não produzam efeito, para assim te autojustificares: para não te exigires e para que não te exijam mais. - Estás cumprindo a tua vontade; não a de Deus. Enquanto não mudares, a sério, nem serás feliz, nem conseguirás a paz que agora te falta. - Humilha-te diante de Deus, e procura querer de verdade."}, {"n": 147, "chapter": "Lutas", "text": "Que perda de tempo, e que visão tão humana, quando reduzem tudo a táticas, como se aí estivesse o segredo da eficácia. - Esquecem-se de que a “tática” de Deus é a caridade, o Amor sem limites: assim preencheu Ele a distância impreenchível que o homem, com o pecado, abre entre o Céu e a terra."}, {"n": 148, "chapter": "Lutas", "text": "Deves ter uma sinceridade “selvagem” no exame de consciência; quer dizer, coragem: a mesma com que te olhas no espelho, para saber onde te feriste ou onde te manchaste, ou onde estão os teus defeitos, que tens de eliminar."}, {"n": 149, "chapter": "Lutas", "text": "Preciso prevenir-te contra uma argúcia de “satanás” - assim, com minúscula!, porque não merece mais -, que tenta servir-te das circunstâncias mais comuns para nos desviar pouco ou muito do caminho que nos leva a Deus. Se lutas, e mais ainda se lutas de verdade, não deves estranhar que sobrevenha o cansaço ou o tempo de “andar a contragosto”, sem nenhum consolo espiritual ou humano. Olha o que me escreviam há tempos, e que conservei pensando em alguns que consideram ingenuamente que a graça prescinde da natureza: “Padre, desde há alguns dias, estou com uma preguiça e uma apatia tremendas, para cumprir o plano de vida; faço tudo para que passe logo esta crise, que me faz sofrer muito pensando em que pode desviar-me do caminho”. - Limitei-me a responder: não sabias que o Amor exige sacrifício? Lê devagar as palavras do Mestre: “Quem não toma a sua Cruz “cotidie” - cada dia - não é digno de Mim”. E mais adiante: “Não vos deixarei órfãos...”. O Senhor permite essa tua aridez, que se torna tão dura para ti, para que O ames mais, que confies somente nEle, para que com a Cruz sejas corredentor, para que O encontres."}, {"n": 150, "chapter": "Lutas", "text": "O diabo parece bem pouco esperto!, comentavas-me. Não entendo a sua estupidez: sempre os mesmos enganos, as mesmas falsidades... Tens toda a razão. Mas nós, os homens, somos ainda menos espertos, e não aprendemos a escarmentar em cabeça alheia... E satanás conta com tudo isso, para nos tentar."}, {"n": 151, "chapter": "Lutas", "text": "Ouvi dizer certa vez que nas grandes batalhas se repete um fenômeno curioso. Ainda que a vitória esteja assegurada de antemão pela superioridade numérica e de meios, depois, no fragor do combate, não faltam momentos em que a derrota ameaça, pela debilidade de um setor. Chegam então as ordens terminantes do alto comando, e cobrem-se as brechas do flanco em dificuldade. - Pensei em ti e em mim. Com Deus, que não perde batalhas, seremos sempre vencedores. Por isso, no combate pela santidade, se te sentes sem forças, escuta as ordens, faz caso, deixa-te ajudar..., porque Ele não falha."}, {"n": 152, "chapter": "Lutas", "text": "Abriste sinceramente o coração ao teu Diretor, falando na presença de Deus..., e foi maravilhoso verificar como tu sozinho ias encontrando respostas adequada às tuas tentativas de evasão. Amemos a direção espiritual!"}, {"n": 153, "chapter": "Lutas", "text": "Concedo; comportas-te decorosamente... Mas, deixa-me que te fale com sinceridade: com esse passo arrastado - reconhece-o -, além de que não és feliz por inteiro, ficas muito longe da santidade. Por isso te pergunto: é mesmo verdade que te comportas decorosamente? Não terás um conceito errado do decoro?"}, {"n": 154, "chapter": "Lutas", "text": "Assim, bobeando, com essa frivolidade interior e exterior, com essas vacilações em face da tentação, com esse querer sem querer, é impossível que avances na vida interior."}, {"n": 155, "chapter": "Lutas", "text": "Sempre pensei que muitos chamam “amanhã”, “depois”, à resistência à graça."}, {"n": 156, "chapter": "Lutas", "text": "Outro paradoxo do caminho espiritual: a alma necessitada de menor reforma na sua conduta, empenha-se mais em consegui-la, não se detém até alcançá-la. E ao contrário."}, {"n": 157, "chapter": "Lutas", "text": "Às vezes, inventas “problemas”, porque não vais à raiz dos teus modos de comportar-te. - A única coisa de que necessitas é de uma decidida mudança de frente de batalha: cumprir lealmente o teu dever e ser fiel às indicações que te deram na direção espiritual."}, {"n": 158, "chapter": "Lutas", "text": "Notaste com mais força a urgência, a “idéia fixa” de ser santo; e foste à luta cotidiana sem vacilações, persuadido de que tens de cortar valentemente qualquer sintoma de aburguesamento. Depois, enquanto falavas com o Senhor na tua oração, compreendeste com maior clareza que luta é sinônimo de Amor, e pediste-Lhe um Amor maior, sem medo ao combate que te espera, porque combaterás por Ele, com Ele e nEle."}, {"n": 159, "chapter": "Lutas", "text": "Complicações?... Sê sincero, e reconhece que preferes ser escravo de um egoísmo teu, ao invés de servires a Deus ou àquela alma. - Cede!"}, {"n": 160, "chapter": "Lutas", "text": "“Beatus vir qui suffert tentationem...” - bem-aventurado o homem que sofre tentação porque, depois de ter sido provado, receberá a coroa da Vida. Não te enche de alegria verificar que esse esporte interior é uma fonte de paz que nunca se esgota?"}, {"n": 161, "chapter": "Lutas", "text": "“Nunc coepi!” - agora começo! É o grito da alma apaixonada que, em cada instante, quer tenha sido fiel, quer lhe tenha faltado generosidade, renova o seu desejo de servir - de amar! - o nosso Deus com uma lealdade sem brechas."}, {"n": 162, "chapter": "Lutas", "text": "Doeu-te na alma quando te disseram: tu, o que procuras não é a conversão, mas um estojo para as tuas misérias..., para assim continuares arrastando comodamente - mas com sabor a azebre! - essa triste carga."}, {"n": 163, "chapter": "Lutas", "text": "Não sabes se será abatimento físico ou uma espécie de cansaço interior o que se apoderou de ti, ou as duas coisas ao mesmo tempo...: lutas sem lutar, sem ânsias de uma autêntica melhora positiva, com o fim de comunicares a alegria e o amor de Cristo às almas. Quero recordar-te as palavras claras do Espírito Santo: só será coroado aquele que tiver combatido “legitime” - de verdade, apesar dos pesares."}, {"n": 164, "chapter": "Lutas", "text": "Poderia comportar-me melhor, ser mais decidido, esbanjar mais entusiasmo... Por que não o faço? Porque - perdoa a minha fraqueza - és um bobo: o diabo sabe perfeitamente que uma das portas da alma mais mal guardadas é a da tontice humana: a vaidade. Agora carrega por aí, com todas as suas forças: lembranças pseudo-sentimentais, complexo de ovelha negra com visão histérica, impressão de uma hipotética falta de liberdade... Que estás esperando para entender a sentença do Mestre: “Vigiai e orai, porque não sabeis nem o dia nem a hora”?"}, {"n": 165, "chapter": "Lutas", "text": "Comentaste com ar fanfarrão e inseguro: uns sobem e outros descem... E outros - como eu! estamos deitados no caminho. Deu-me tristeza a tua indolência, e acrescentei: os mandriões são puxados a reboque pelos que sobrem; e, geralmente, com mais força pelos que descem. Pensam no descaminho tão penoso que buscas para ti! Já o apontava o santo bispo de Hipona: não avançar, é retroceder."}, {"n": 166, "chapter": "Lutas", "text": "Na tua vida, há duas peças que não se encaixam: a cabeça e o sentimento. A inteligência - iluminada pela fé - mostra-te claramente não só o caminho, mas a diferença entre a maneira heróica e a maneira estúpida de percorrê-lo. Sobretudo, põe diante de ti a grandeza e a formosura divina das tarefas que a Trindade deixa em nossas mãos. O sentimento, pelo contrário, apega-se a tudo o que desprezas, mesmo que continues a considerá-lo desprezível. É como se mil e uma insignificâncias estivessem esperando qualquer oportunidade, e logo que a tua pobre vontade se debilita - por cansaço físico ou pela perda de sentido sobrenatural -, essas ninharias se amontoam e se agitam na tua imaginação, até formarem uma montanha que te oprime e te desanima: as asperezas do trabalho; a resistência em obedecer; a falta de meios; os fogos de artifício de uma vida regalada; pequenas e grandes tentações repugnantes; rajadas de sentimentalismo; a fadiga; o sabor amargo da mediocridade espiritual... E, às vezes, também o medo: porque sabes que Deus te quer santo e não o és. Permite-me que te fale com crueza. Sobram-te “motivos” para voltar atrás, e falta-te arrojo para corresponder à graça que Ele te concede, porque te chamou para seres outro Cristo, “ipse Christus!” - o próprio Cristo. Esqueceste a admoestação do Senhor ao Apóstolo: “Basta-te a minha graça!”, que é uma confirmação de que, se quiseres, podes."}, {"n": 167, "chapter": "Lutas", "text": "Recupera o tempo que perdestes descansando sobre os louros da complacência em ti mesmo, por te julgares uma pessoa boa, como se fosse suficiente ir levando, sem roubar nem matar. Aperta o passo na piedade e no trabalho: falta-te ainda tanto por andar! Convive de bom grado com todos, também com os que te incomodam; e esforça-te por amar - por servir! - aqueles que antes desprezavas."}, {"n": 168, "chapter": "Lutas", "text": "Mostraste as tuas misérias passadas - cheias de pus - na confissão. E o sacerdote atuou na tua alma como um bom médico, como um médico honrado: cortou onde era preciso, e não permitiu que a ferida fechasse enquanto a limpeza não ficasse completa. - Agradece-o."}, {"n": 169, "chapter": "Lutas", "text": "Dá muito bom resultado empreender as coisas sérias com espírito esportivo... Perdi várias jogadas? Muito bem, mas - se perseverar - no fim ganharei."}, {"n": 170, "chapter": "Lutas", "text": "Converte-te agora, quando ainda te sentes jovem... Como é difícil retificar quando a alma envelheceu!"}, {"n": 171, "chapter": "Lutas", "text": "“Felix culpa!”, canta a Igreja... Abençoado erro o teu - repito ao ouvido -, se te serviu para não recair; e também para melhor compreenderes e ajudares o próximo, que não é de pior qualidade do que tu."}, {"n": 172, "chapter": "Lutas", "text": "Será possível - perguntas depois de teres repelido a tentação -, será possível, Senhor, que eu seja... esse outro?"}, {"n": 173, "chapter": "Lutas", "text": "Vou resumir a tua história clínica: aqui caio e acolá me levanto...; este último ponto é que é importante. - Continua com essa luta íntima, ainda que avances a passo de tartaruga. Para a frente! - Bem sabes, filho, até onde podes chegar, se não lutas: o abismo chama outros abismos."}, {"n": 174, "chapter": "Lutas", "text": "Estás envergonhado, diante de Deus e dos outros. Descobriste em ti ronha velha e renovada: não há instinto, nem tendência ruim, que não sintas à flor da pele... e tens a nuvem da incerteza no coração. Além disso, a tentação aparece quando menos queres ou quando menos a esperas, quando por fadiga a tua vontade amolece. Já não sabes se te humilha, embora te doa ver-te assim... Mas que te doa por Ele, por Amor dEle; esta contrição de amor te ajudará a permanecer vigilante, porque a luta durará enquanto vivermos."}, {"n": 175, "chapter": "Lutas", "text": "Que grande desejos te consomem de confirmar a entrega que um dia fizeste: saber-te e viver como filho de Deus! - Coloca nas mãos do Senhor as tuas muitas misérias e infidelidades. Também porque é o único modo de aliviares o seu peso."}, {"n": 176, "chapter": "Lutas", "text": "Renovação não é relaxamento."}, {"n": 177, "chapter": "Lutas", "text": "Dias de retiro. Recolhimento para conhecer a Deus, para te conheceres e assim progredir. Um tempo necessário para descobrir em que coisas e de que modo é preciso reforma-se: que tenho que fazer? que devo evitar?"}, {"n": 178, "chapter": "Lutas", "text": "Que não volte a repetir-se o que aconteceu no ano passado. - “Como foi o retiro?”, perguntaram-te. E respondestes: “Descansamos muito bem”."}, {"n": 179, "chapter": "Lutas", "text": "Dias de silêncio e de graça intensa... Oração face a face com Deus... Desatei em ação de graças ao contemplar aquelas pessoas, graves pelos anos e pela experiência, que se abriam aos toques divinos e correspondiam como crianças, entusiasmadas com a possibilidade de ainda converterem a sua vida em algo útil..., que apagasse todos os seus descaminhos e todos os seus esquecimentos. Recordando aquela cena, encareci-te: não descures a tua luta na vida e na piedade."}, {"n": 180, "chapter": "Lutas", "text": "“Auxilium christianorum!” - Auxílio dos cristãos, reza com toda a segurança a ladainha de Nossa Senhora. Experimentaste repetir essa jaculatória em teu transes difíceis? Se o fizeres com Fé, com ternura de filha ou de filho, comprovarás a eficácia da intercessão de tua Mãe Santa Maria, que te levará à vitória."}, {"n": 181, "chapter": "Pescadores de homens", "text": "Enquanto conversávamos, víamos as terras daquele continente. - Acenderam - se as luzes em teus olhos, encheu-se de impaciência a tua alma e, com o pensamento naquelas gentes, disseste-me: será possível que, do outro lado destes mares, a graça de Cristo se torne ineficaz? Depois, tu mesmo deste a resposta: Ele, na sua bondade infinita, quer servir-se de instrumentos dóceis."}, {"n": 182, "chapter": "Pescadores de homens", "text": "Como te inspiram compaixão!... Quererias gritar-lhes que estão perdendo o tempo... Por que são tão cegos e não percebem o que tu - miserável - já viste? Por que não hão de preferir o melhor? - Reza, mortifica-te, e depois - tens obrigação disso! - desperta-os um a um, explicando-lhes - também um a um - que, tal como tu, podem encontrar um caminho divino, sem abandonar o lugar que ocupam na sociedade."}, {"n": 183, "chapter": "Pescadores de homens", "text": "Começaste com muitos brios. Mas pouco a pouco te foste encolhendo... E vai acabar metido na tua pobre carapaça, se continuares a empequenecer o teu horizonte. - Cada vez tens de alargar mais o teu coração, com fomes de apostolado! De cem almas interessam-nos as cem."}, {"n": 184, "chapter": "Pescadores de homens", "text": "Agradece ao Senhor a contínua delicadeza, paternal e maternal, com que Ele te trata. Tu, que sempre sonhaste com grandes aventuras, te comprometeste num empreendimento maravilhoso..., que te leva à santidade. Insisto: agradece-o a Deus, com uma vida de apostolado."}, {"n": 185, "chapter": "Pescadores de homens", "text": "Quando te lançares ao apostolado, convence-te de que se trata sempre de fazer felizes, muito felizes, as pessoas: a Verdade é inseparável da autêntica alegria."}, {"n": 186, "chapter": "Pescadores de homens", "text": "Pessoas de diversas nações, de diferentes raças, de ambientes e profissões muito diversos... Ao falar-lhes de Deus, apalpas o valor humano e sobrenatural da tua vocação de apóstolo. É como se revivesses, na sua realidade total, o milagre da primeira pregação dos discípulos do Senhor: frases ditas em língua estranha, mostrando um caminho novo, foram ouvidas por cada um no fundo do seu coração, na sua própria língua. E passa pela tua cabeça, ganhando vida nova, a cena em que “partos, medos e elamitas...” se aproximaram felizes de Deus."}, {"n": 187, "chapter": "Pescadores de homens", "text": "Ouve-me bem e serve-me de eco: o cristianismo é Amor; o trato com Deus é diálogo eminentemente afirmativo; a preocupação pelos outros - o apostolado - não é um artigo de luxo, ocupação de alguns poucos. - Agora que o sabes, enche-te de alegria, porque a tua vida adquiriu um sentido completamente diverso. E sê conseqflente."}, {"n": 188, "chapter": "Pescadores de homens", "text": "Naturalidade, sinceridade, alegria: as condições indispensáveis, no apóstolo, para atrair as pessoas."}, {"n": 189, "chapter": "Pescadores de homens", "text": "Não podia ser mais simples a maneira como Jesus chamou os primeiros doze: “Vem e segue-me”. Para ti, que procuras tantas desculpas para não continuares essa tarefa, ajusta-se como uma luva à mão a consideração de que bem pobre era a ciência humana daqueles primeiros; e, no entanto, como sacudiram aqueles que os escutavam! Não o esqueças: o trabalho, é Ele que continua a fazê-lo, através de cada um de nós."}, {"n": 190, "chapter": "Pescadores de homens", "text": "As vocações de apóstolo, é Deus quem as envia. mas tu não deves deixar de empregar os meios: oração, mortificação, estudo ou trabalho, amizade, sentido sobrenatural..., vida interior!"}, {"n": 191, "chapter": "Pescadores de homens", "text": "Quando te falo de “apostolado de amizade”, refiro-me a uma amizade “pessoal”, sacrificada, sincera: de tu a tu, de coração a coração."}, {"n": 192, "chapter": "Pescadores de homens", "text": "No apostolado de amizade e confidência, o primeiro passo é a compreensão, o serviço... e a santa intransigência na doutrina."}, {"n": 193, "chapter": "Pescadores de homens", "text": "Os que encontraram a Cristo não podem fechar-se no seu ambiente: triste coisa séria esse empequenecimento! Têm que abrir-se em leque para chegar a todas as almas. Cada um tem que criar - e alargar - um círculo de amigos, sobre o qual influa com o seu prestígio profissional, com a sua conduta, com a sua amizade, procurando que Cristo influa por meio desse prestígio profissional, dessa conduta, dessa amizade."}, {"n": 194, "chapter": "Pescadores de homens", "text": "Tens que ser uma brasa acesa, que leve fogo a toda a parte. E, onde o ambiente for incapaz de arder, tens que aumentar a sua temperatura espiritual. - Senão, estás perdendo o tempo miserável, e fazendo-o perder aos que te rodeiam."}, {"n": 195, "chapter": "Pescadores de homens", "text": "Quando há zelo pelas almas, sempre se encontra gente boa, sempre se descobre terreno adubado. Não há desculpas!"}, {"n": 196, "chapter": "Pescadores de homens", "text": "Convence-te: também aí há muitos que podem entender o teu caminho; almas que - consciente ou inconscientemente - procuram a Cristo e não O encontram. Mas “como ouvirão falar dEle, se ninguém lhes fala?”"}, {"n": 197, "chapter": "Pescadores de homens", "text": "Não me digas que cuidas da tua vida interior, se não fazes um apostolado intenso, sem pausas: o Senhor - com Quem me garantes ter intimidade - quer que todos os homens se salvem."}, {"n": 198, "chapter": "Pescadores de homens", "text": "Esse caminho é muito difícil, disse-te ele. E, ao ouvi-lo, o concordaste ufano, lembrando-te de que a Cruz é o sinal certo do caminho verdadeiro... Mas o teu amigo reparou somente na parte áspera da senda, sem ter em conta a promessa de Jesus; “O meu jugo é suave”. Lembra-lhe isso, porque - quando o souber - talvez se entregue."}, {"n": 199, "chapter": "Pescadores de homens", "text": "Diz que não tem tempo?... Muito melhor. Precisamente os que não têm tempo é que interessam a Cristo."}, {"n": 200, "chapter": "Pescadores de homens", "text": "Ao considerares que são muitos os que desaproveitam a grande oportunidade, e deixam Jesus passar ao largo, pensa: de onde me vem a mim essa chamada clara, tão providencial, que me mostrou o meu caminho? - Medita nisto diariamente: o apóstolo tem que ser sempre outro Cristo, o próprio Cristo."}, {"n": 201, "chapter": "Pescadores de homens", "text": "Não te surpreendas e não te amedrontes porque ele te censurou que o tivesses posto frente a frente com Cristo; nem porque acrescentou, indignado: “Já não posso viver tranqflilo sem tomar uma decisão...” Reza por ele... É inútil que procures tranqflilizá-lo: talvez lhe tenha aflorado uma antiga inquietação, a voz da sua consciência."}, {"n": 202, "chapter": "Pescadores de homens", "text": "Escandalizam-se contigo porque falas de entrega a pessoas que nunca tinham pensado nesse problema?... - Muito bem, e daí? Se tu tens vocação de apóstolo de apóstolos!"}, {"n": 203, "chapter": "Pescadores de homens", "text": "Não atinges as pessoas porque falas uma “língua” diferente. Aconselho-te a naturalidade. Essa tua formação, tão artificial!"}, {"n": 204, "chapter": "Pescadores de homens", "text": "Vacilas em lançar-te a falar de Deus, de vida cristã, de vocação..., porque não queres fazer sofrer?... Esqueces que não és tu quem chama, mas Ele: “Ego scio quos elegerim” - Eu sei muito bem a quem escolhi. Além disso, desgostar-me-ia que, por trás desses falsos respeitos, se escondesse o comodismo ou a tibieza: a esta altura, preferes uma pobre amizade humana à amizade de Deus?"}, {"n": 205, "chapter": "Pescadores de homens", "text": "Tiveste uma conversa com este, com aquele, com aquele outro, porque te consome o zelo pelas almas. Aquele ficou com medo; o outro consultou um “prudente”, que o orientou mal... - Persevera: que ninguém possa depois desculpar-se afirmando “quia nemo nos conduxit” - que ninguém nos chamou."}, {"n": 206, "chapter": "Pescadores de homens", "text": "Compreendo a tua impaciência santa, mas ao mesmo tempo tens de considerar que alguns precisam pensar muito, que outros irão correspondendo com o tempo... Espera-os de braços abertos: condimenta a tua impaciência santa com oração e mortificação abundantes. Acabarão vindo mais jovens e generosos; terão sacudido o seu aburguesamento e serão mais valentes. Quanto Deus os espera!"}, {"n": 207, "chapter": "Pescadores de homens", "text": "A fé é um requisito imprescindível no apostolado, que muitas vezes se manifesta na constância em falar de Deus, ainda que os frutos demorem em vir. Se perseverarmos, se insistirmos, bem convencidos de que o Senhor assim o quer, também à tua volta, por toda a parte, se irão notando sinais de uma revolução cristã: uns haverão de entregar-se, outros tomarão a sério a sua vida interior, e outros - os mais fracos - ficarão pelo menos alertados."}, {"n": 208, "chapter": "Pescadores de homens", "text": "Dias de autêntico alvoroço: mais três! Cumprem-se as palavras de Jesus: “Meu Pai é glorificado em que deis muito fruto e sejais meus discípulos”."}, {"n": 209, "chapter": "Pescadores de homens", "text": "Fizeste-me sorrir, porque te entendo muito bem, quando me dizias: “Fico entusiasmado com a possibilidade de ir a novas terras, para abrir brecha, talvez muito longe... Preciso averiguar se há homens na lua”. - Pede ao Senhor que te aumente esse zelo apostólico."}, {"n": 210, "chapter": "Pescadores de homens", "text": "Por vezes, diante dessas almas adormecidas, dá uma vontade louca de gritar - lhes, de sacudi-las, de fazê-las reagir, para que saiam dessa modorra terrível em que se acham mergulhadas. É tão triste ver como andam, tateando como cegos, sem acertar com o caminho! - Como compreendo esse pranto de Jesus por Jerusalém, como fruto da sua caridade perfeita..."}, {"n": 211, "chapter": "Pescadores de homens", "text": "Aprofunda cada dia na raiz apostólica da tua vocação cristã. - O Senhor desfraldou há vinte séculos - para que tu e eu o proclamássemos ao ouvidos dos homens - uma bandeira de alistamento, aberta a todos os que têm um coração sincero e capacidade de amar... Que outras chamadas mais claras queres do que o “ignem veni mittere in terram” - vim trazer fogo à terra - e a consideração desses dois bilhões e quinhentos milhões de almas que ainda não conhecem a Cristo!"}, {"n": 212, "chapter": "Pescadores de homens", "text": "“Hominem no habeo” - não tenho ninguém que me ajude. É o que poderiam afirmar - infelizmente! - muitos doentes e paralíticos do espírito, que podem servir... e devem servir. Senhor: que eu nunca fique indiferente diante das almas."}, {"n": 213, "chapter": "Pescadores de homens", "text": "Ajuda-me a pedir um novo Pentecostes, que abrase outra vez a terra."}, {"n": 214, "chapter": "Pescadores de homens", "text": "“Se algum dos que me seguem não aborrece seu pai e sua mãe, e a mulher e os filhos, e os irmãos e irmãs, e mesmo a sua própria vida, não pode ser meu discípulo”. Cada vez vejo com mais clareza, Senhor, que os laços do sangue, se não passam pelo teu Coração amabilíssimo, são, para uns, motivo permanente de cruz; para outros, origem de tentações - mais ou menos diretas - contra a perseverança; para outros, causa de ineficácia absoluta; e, para todos, lastro que se opõe a uma entrega total."}, {"n": 215, "chapter": "Pescadores de homens", "text": "A relha que rotura e abre o sulco, não vê a semente nem o fruto."}, {"n": 216, "chapter": "Pescadores de homens", "text": "Depois da tua decisão, fazes cada dia uma nova descoberta. Lembras-te de ontem, quando te perguntavas constantemente: “E isto, de que maneira...?, para continuares depois nas tuas dúvidas ou nos teus desencantos... Agora sempre encontras a resposta exata, fundamentada e clara. E, ao ouvires como respondem às tuas perguntas às vezes pueris, ocorre-te pensar: “Assim deve ter atendido Jesus os primeiros Doze”."}, {"n": 217, "chapter": "Pescadores de homens", "text": "Vocações, Senhor, mais vocações! Não me interessa se a semeadura foi minha ou de outro - semeaste Tu, Jesus, com as nossas mãos! -; somente sei que nos prometeste a maturidade do fruto: “et fructus vester maneat!” - que o nosso fruto será duradouro."}, {"n": 218, "chapter": "Pescadores de homens", "text": "Sê claro. Se te dizem que vais “pescá-los”, responde que sim, que é o que desejas... Mas..., que não se preocupem! Porque, se não têm vocação - se Ele não os chama -, não virão, e se não a têm, que vergonha acabarem como o jovem rico do Evangelho: sozinhos e tristes."}, {"n": 219, "chapter": "Pescadores de homens", "text": "A tua tarefa de apóstolo é grande e bela. Estás no ponto de confluência da graça com a liberdade das almas; e assistes ao momento soleníssimo da vida de alguns homens: o seu encontro com Cristo."}, {"n": 220, "chapter": "Pescadores de homens", "text": "Parece que vos escolheram um a um..., dizia alguém. - E assim é!"}, {"n": 221, "chapter": "Pescadores de homens", "text": "Convence-te: necessitas formar-te bem, com vistas a essa avalanche de gente que se jogará sobre nós, com a pergunta precisa e exigente: - “Bom, o que há que fazer?”."}, {"n": 222, "chapter": "Pescadores de homens", "text": "Uma receita eficaz para o teu espírito apostólico: planos concretos, não de sábado para sábado, mas de hoje para amanhã, e de agora para daqui a pouco."}, {"n": 223, "chapter": "Pescadores de homens", "text": "Cristo espera muito do teu trabalho. Mas tens que sair em busca das almas, como o Bom Pastor foi atrás da centésima ovelha: sem esperar que te chamem. Depois, serve-te dos teus amigos para fazer bem a outros: ninguém pode sentir - se tranqflilo - dize-o a cada um - com uma vida espiritual que, depois de inundá - lo, não transborda em zelo apostólico."}, {"n": 224, "chapter": "Pescadores de homens", "text": "Não é tolerável que percas o tempo nas tuas “bobagens”, quando há tantas almas que te esperam."}, {"n": 225, "chapter": "Pescadores de homens", "text": "Apostolado da doutrina: esse será sempre o teu apostolado."}, {"n": 226, "chapter": "Pescadores de homens", "text": "A maravilha do Pentecostes é a consagração de todos os caminhos: nunca pode ser entendido como monopólio nem como estima por um só em detrimento de outros. O Pentecostes é indefinida variedade de línguas de métodos, de formas de encontro com Deus: não uniformidade violenta."}, {"n": 227, "chapter": "Pescadores de homens", "text": "Escrevias-me: uniu-se ao nosso grupo um rapaz jovem, que ia para o norte. Era mineiro de profissão. Cantava muito bem, e veio acompanhando o nosso coro. Rezei por ele até chegar à estação em que descia. Ao despedir-se, comentou: “Quanto gostaria de continuar a viagem com vocês!”. - Lembrei-me imediatamente do “mane nobiscum!” - fica conosco, Senhor! -, e pedi-Lhe novamente com fé que os outros “O vissem” em cada um de nós, companheiros do “Seu caminho”."}, {"n": 228, "chapter": "Pescadores de homens", "text": "Pela “senda do justo descontentamento” foram-se embora - e continuam indo - as massas. Dói..., mas quantos ressentidos não temos fabricado entre os que estão espiritual ou materialmente necessitados! - É necessário voltar a meter Cristo entre os pobres e entre os humildes: é justamente entre eles que se sente melhor."}, {"n": 229, "chapter": "Pescadores de homens", "text": "Professor: que te entusiasme fazer compreender aos alunos, em pouco tempo, o que a ti te custou horas de estudo chegar a ver com clareza."}, {"n": 230, "chapter": "Pescadores de homens", "text": "O desejo de “ensinar”, e “ensinar com toda a alma”, cria nos alunos uma agradecimento que constitui terreno idôneo para o apostolado."}, {"n": 231, "chapter": "Pescadores de homens", "text": "Gosto desse lema: “Cada caminhante siga o seu caminho” - aquele que Deus lhe traçou -, com fidelidade, com amor, ainda que custe."}, {"n": 232, "chapter": "Pescadores de homens", "text": "Que lição tão extraordinária cada um dos ensinamentos do Novo Testamento! - Depois de o Mestre lhes ter dito, enquanto ascendia à direita de Deus Pai: “Ide e pregai a todos os povos”, os discípulos ficaram com paz. Mas ainda têm dúvidas: não sabem o que fazer, e reúnem-se com Maria, Rainha dos Apóstolos, para se converterem em zelosos pregoeiros da Verdade que salvará o mundo."}, {"n": 233, "chapter": "Sofrimento", "text": "Comentavas que há cenas da vida de Jesus que te comovem mais: quando se põe em contacto com homens em carne viva..., quando leva a paz e a saúde aos que têm a alma e o corpo despedaçados pela dor... Estusiasmas-te - insistias - ao vê-Lo curar a lepra, devolver a vista, sarar o paralítico da piscina: o pobre de quem ninguém se lembra. Tu O contemplas, nesses momentos, tão profundamente humano, tão ao seu alcance! - Pois olha..., Jesus continua a ser o mesmo de então."}, {"n": 234, "chapter": "Sofrimento", "text": "Pediste ao Senhor que te deixasse sofrer um pouco por Ele. Mas depois, quando chega o padecimento em forma tão humana, tão normal - dificuldades e problemas familiares..., ou essas mil e uma insignificância da vida diária -, custa-te trabalho ver Cristo por trás disso. - Abre com docilidade as tuas mãos a esses pregos..., e a tua dor se converterá em alegria."}, {"n": 235, "chapter": "Sofrimento", "text": "Não te queixes, se sofres. Lapida-se a pedra que se estima, que tem valor. Dói-te? - Deixa-te lapidar, com agradecimento, porque Deus te tomou nas suas mãos como um diamante... Não se trabalha assim um pedregulho vulgar."}, {"n": 236, "chapter": "Sofrimento", "text": "Os que fogem covardemente do sofrimento têm matéria de meditação ao verem o entusiasmo com que outras almas abraçam a dor. Não são poucos os homens e as mulheres que sabem padecer cristãmente. Sigamos o seu exemplo."}, {"n": 237, "chapter": "Sofrimento", "text": "Lamentas-te?... E explicas-me, como se tivesse razão: Uma alfinetada!... outra!..."}, {"n": 238, "chapter": "Sofrimento", "text": "Deixa-me que, como até agora, continue a falar-te em confidência: basta-me ter diante de mim um Crucifixo, para não me atrever a falar dos meus sofrimentos... E não me importo de acrescentar que tenho sofrido muito, sempre com alegria."}, {"n": 239, "chapter": "Sofrimento", "text": "Não te compreendem?... Ele era a Verdade e a Luz, mas também os seus não O compreenderam. - Como tantas vezes te fiz considerar, lembra-te das palavras do Senhor: “Não
