os a soberba aumenta, se não se corrige a tempo."}, {"n": 597, "chapter": "Vitória", "text": "Pode haver coisa mais antipática do que uma criança bancando o homem? Que simpatia pode ter diante do seu Deus um pobre homem - uma criança - que assume ares de grande, inchado pela soberba, convencido do seu valor, fiado unicamente de si próprio?"}, {"n": 598, "chapter": "Vitória", "text": "É verdade que podes condenar-te. Estás bem convencido disso, pois no teu coração se encontram germes de todas as maldades. Mas, se te fizeres criança diante de Deus, esta circunstância te levará a unir - te a teu Pai-Deus e à tua Mãe Santa Maria. E São José e o teu Anjo da Guarda não te hão de desamparar, ao verem-te pequeno. - Tem fé, faz o que puderes - penitência e Amor! -, e o que faltar, Eles o acrescentarão."}, {"n": 599, "chapter": "Vitória", "text": "Quanto custa viver a humildade!, porque - assim o afirma a sabedoria popular cristã - “a soberba morre vinte e quatro horas depois de ter morrido a pessoa”. Portanto, quando - ao contrário do que te diz quem recebeu graça especial de Deus para orientar a tua alma - pensares que tens razão, convence-te de que “não tens razão nenhuma”."}, {"n": 600, "chapter": "Vitória", "text": "Servir e dar formação às crianças; atender com carinho os doentes. Para nos fazermos entender das almas simples, temos que humilhar a inteligência; para compreendermos os pobres doentes, temos que humilhar o coração. E assim, pondo de joelhos o entendimento e a carne, será fácil chegarmos a Jesus, pelo caminho seguro da miséria humana, da miséria própria, que nos leva a aniquilar-nos, para deixar que Deus construa sobre o nosso nada."}, {"n": 601, "chapter": "Vitória", "text": "Propósito: a menos que haja verdadeira necessidade, nunca falarei das minhas coisas pessoais."}, {"n": 602, "chapter": "Vitória", "text": "Agradece a Jesus a segurança que te dá! Porque não é teimosia: é luz de Deus, que te faz sentir-te firme, como que sobre rocha, quando outros, a quem toca fazer um triste papel - sendo tão bons -, parecem afundar-se na areia..., faltos do fundamento da fé. Pede ao Senhor que as exigências da virtude da fé se cumpram na tua vida e na de todos."}, {"n": 603, "chapter": "Vitória", "text": "Se eu fosse de outro jeito, se dominasse mais o meu gênio, se te fosse mais fiel, Senhor, de que admirável maneira não irias ajudar-nos!"}, {"n": 604, "chapter": "Vitória", "text": "As ânsias de reparação, que teu Pai-Deus põe na tua alma, ver-se-ão satisfeitas se unires a tua pobre expiação pessoal aos méritos infinitos de Jesus. - Retifica a intenção, ama a dor nEle, com Ele e por Ele."}, {"n": 605, "chapter": "Vitória", "text": "Não sabes se progrediste, nem quanto... - De que te serviria esse cálculo?... - O importante é que perseveres, que o teu coração arda em fogo, que vejas mais luz e mais horizonte...: que te afadigues pelas nossas intenções, que as pressintas - mesmo que não as conheças -, e que por todas rezes."}, {"n": 606, "chapter": "Vitória", "text": "Diz-Lhe: - Não vejo, Jesus, nem uma flor viçosa no meu jardim: todas têm manchas..., parece que todas perderam a cor e o aroma. Pobre de mim! A boca no esterco, no chão: assim. Este é o meu lugar. - Deste modo - humilhando-te -, Ele vencerá em ti, e alcançarás a vitória."}, {"n": 607, "chapter": "Vitória", "text": "Bem te entendi quando concluías: - Decididamente, quase não chego a burrico..., ao burrico que foi o trono de Jesus para entrar em Jerusalém: fico fazendo parte do montãozinho vil de trapos sujos, que o trapeiro mais pobre despreza. Mas comentei-te: - No entanto, o Senhor escolheu-te e quer que sejas seu instrumento. Por isso, o fato - real - de te veres tão miserável tem de converter-se em mais uma razão para agradeceres a Deus a sua chamada."}, {"n": 608, "chapter": "Vitória", "text": "O cântico humilde e gozoso de Maria, no Magnificat, lembra-nos a infinita generosidade do Senhor para com os que se fazem como crianças, para com os que se abaixam e sinceramente se sabem nada."}, {"n": 609, "chapter": "Vitória", "text": "É muito grato a Deus o reconhecimento pela sua bondade que denota recitar um Te Deum de ação de graças, sempre que ocorre algum acontecimento um pouco extraordinário, sem dar importância a que seja - como o chama o mundo - favorável ou adverso: porque, vindo das suas mãos de Pai, mesmo que o golpe de cinzel fira a carne, é também uma prova de Amor, que tira as nossas arestas para nos aproximar da perfeição."}, {"n": 610, "chapter": "Vitória", "text": "Os homens, quando querem realizar algum trabalho, procuram servir-se dos meios apropriados. Se eu tivesse vivido há séculos, teria usado uma pena de ave para escrever; agora utilizo uma caneta. Deus, porém, quando deseja levar a cabo alguma obra, escolhe meios desproporcionados, para que se note - quantas vezes me terás ouvido isto! - que a obra é sua. Por isso, tu e eu, que conhecemos o peso enorme das nossas misérias, devemos dizer ao Senhor: - Ainda que eu seja miserável, não deixo de compreender que sou instrumento divino nas tuas mãos."}, {"n": 611, "chapter": "Vitória", "text": "Dedicaremos todos os afãs da nossa vida - grandes e pequenos - à honra de Deus Pai, de Deus Filho, de Deus Espírito Santo. - Lembro-me com emoção do trabalho daqueles universitários brilhantes - dois engenheiros e dois arquitetos -, ocupados com muito gosto na instalação material de uma residência de estudantes. Mal acabaram de colocar o quadro-negro numa sala de aula, a primeira coisa que os quatro artistas escreveram foi: “Deo omnis gloria!” - toda a glória para Deus. - Sei que te encantou, Jesus."}, {"n": 612, "chapter": "Vitória", "text": "Em qualquer lugar em que te encontres, lembra-te de que o Filho do homem não veio para ser servido, mas para servir, e convence-te de que quem quiser segui-Lo não deve pretender outra linha de conduta."}, {"n": 613, "chapter": "Vitória", "text": "Deus tem sobre nós, seus filhos, um direito especial: o direito de que correspondamos ao seu amor, apesar dos nossos erros pessoais. - Esta convicção, ao mesmo tempo que nos impõe uma responsabilidade, da qual não podemos escapar, dá-nos segurança plena: somos instrumentos nas mãos de Deus, com que Ele conta diariamente e, por isso, diariamente, nos esforçamos por servi-Lo."}, {"n": 614, "chapter": "Vitória", "text": "O Senhor espera que os instrumentos façam o possível para estar bem dispostos: e tu tens de procurar que nunca te falte essa boa disposição."}, {"n": 615, "chapter": "Vitória", "text": "Eu entendo que cada Ave-Maria, cada saudação à Santíssima Virgem, é um novo palpitar de um coração enamorado."}, {"n": 616, "chapter": "Vitória", "text": "A nossa vida - a dos cristãos - deve ser tão vulgar como isto: procurar fazer bem, todos os dias, as mesmas coisas que temos obrigação de viver; realizar no mundo a nossa missão divina, cumprindo o pequeno dever de cada instante. - Para dizê-lo melhor: esforçando-nos por cumpri-lo, porque às vezes não o conseguiremos e, ao chegar a noite, no exame, teremos que dizer ao Senhor: - Não te ofereço virtudes; hoje só posso oferecer-te defeitos, mas - com a tua graça - chegarei a chamar-me vencedor."}, {"n": 617, "chapter": "Vitória", "text": "Desejo de todo o coração que, pela misericórdia de Deus, Ele - não obstante os teus pecados (nunca mais ofender Jesus!) - te faça “viver habitualmente essa vida feliz de amor à sua Vontade”."}, {"n": 618, "chapter": "Vitória", "text": "No serviço de Deus, não há ofícios de pouca categoria: todos são de muita importância. - A categoria do ofício depende do nível espiritual de quem o realiza."}, {"n": 619, "chapter": "Vitória", "text": "Não te dá alegria essa certeza, firme, de que Deus se interessa até pelas menores coisas das suas criaturas?"}, {"n": 620, "chapter": "Vitória", "text": "Manifesta-Lhe de novo que queres eficazmente ser seu: - Õ Jesus, ajuda - me, faz-me teu de verdade: que eu arda e me consuma, à força de pequenas coisas despercebidas de todos."}, {"n": 621, "chapter": "Vitória", "text": "Santo Rosário.- Os gozos, as dores e as glórias da vida de Nossa Senhora tecem uma coroa de louvores que os Anjos e os Santos do Céu repetem ininterruptamente..., como também os que amam a nossa Mãe aqui na terra. - Pratica diariamente esta devoção santa e difunde-a."}, {"n": 622, "chapter": "Vitória", "text": "O Batismo nos faz “fideles” - fiéis -, palavra que, como aquela outra, “sancti” - santos -, os primeiros seguidores de Jesus empregavam para designar-se entre si, e que ainda hoje se usa: fala-se dos “fiéis” da Igreja. - Pensa nisto!"}, {"n": 623, "chapter": "Vitória", "text": "Deus não se deixa ganhar em generosidade, e - deves tê-lo por bem certo! - concede a fidelidade a quem se Lhe rende."}, {"n": 624, "chapter": "Vitória", "text": "Tens de exigir-te sem medo. Na sua vida escondida, assim o fazem muitas almas, para que só o Senhor brilhe. Quereria que tu e eu reagíssemos como aquela pessoa - que desejava ser muito de Deus - na festa da Sagrada Família, que então se celebrava dentro da oitava da Epifania. - “Não me faltam cruzinhas. Uma de ontem - custou-me até as lágrimas - trouxe-me à consideração, no dia de hoje, que meu Pai e Senhor São José e minha Mãe Santa Maria não quiseram deixar a sua criança sem presente de Reis"}, {"n": 625, "chapter": "Vitória", "text": "Quando as santas mulheres chegaram ao sepulcro, repararam que a pedra tinha sido retirada. É o que acontece sempre! Quando nos decidimos a fazer o que devemos, as dificuldades se ultrapassam facilmente."}, {"n": 626, "chapter": "Vitória", "text": "Convence-te de que, se não aprendes a obedecer, não serás eficaz."}, {"n": 627, "chapter": "Vitória", "text": "Quando receberes uma ordem, que ninguém te vença em saber obedecer!, quer faça frio ou calor, quer estejas animado ou cansado, quer sejas jovem ou não o sejas tanto. Uma pessoa que “não saiba obedecer” não aprenderá nunca a mandar."}, {"n": 628, "chapter": "Vitória", "text": "Erro insigne é que o Diretor se conforme com que uma alma dê quatro, quando pode dar doze."}, {"n": 629, "chapter": "Vitória", "text": "Tu tens de obedecer - ou tens de mandar - pondo sempre muito amor."}, {"n": 630, "chapter": "Vitória", "text": "Quereria - ajuda-me com a tua oração - que, na Igreja Santa, todos nos sentíssemos membros de um só corpo, como nos pede o Apóstolo; e que vivêssemos a fundo, sem indiferenças, as alegrias, as tribulações, a expansão da nossa Mãe, una, santa, católica, apostólica, romana. Quereria que vivêssemos a identidade de uns com outros e de todos com Cristo."}, {"n": 631, "chapter": "Vitória", "text": "Persuade-te, filho, de que desunir-se, na Igreja, é morrer."}, {"n": 632, "chapter": "Vitória", "text": "Pede a Deus que na Igreja Santa, nossa Mãe, os corações de todos, como na primitiva cristandade, sejam um só coração, para que até o fim dos séculos se cumpram de verdade as palavras da Escritura: “Multitudinis autem credentium erat cor unum et anima una” - a multidão dos fiéis tinha um só coração e uma só alma. - Falo-te muito seriamente: que por ti não se lese esta unidade santa. Medita-o na tua oração!"}, {"n": 633, "chapter": "Vitória", "text": "A fidelidade ao Romano Pontífice implica uma obrigação clara e determinada: a de conhecer o pensamento do Papa, manifestado nas Encíclicas ou em outros documentos, fazendo quanto estiver ao nosso alcance para que todos os católicos prestem ouvidos ao magistério do Santo Padre, e ajustem a esses ensinamentos a sua atuação na vida."}, {"n": 634, "chapter": "Vitória", "text": "Rezo de todo o coração, diariamente, para que o Senhor nos conceda o dom de línguas. Um dom de línguas que não consiste no conhecimento de vários idiomas, mas em saber adaptar-se à capacidade dos ouvintes. - Não se trata de “falar como néscios ao vulgo, para que entenda”, mas de falar como sábios, em cristão, porém de modo acessível a todos. - Este dom de línguas é o que peço ao Senhor e à sua Mãe bendita para os seus filhos."}, {"n": 635, "chapter": "Vitória", "text": "A malícia de alguns e a ignorância de muitos: aí está o inimigo de Deus, da Igreja. - Confundamos o malvado, iluminemos a inteligência do ignorante... Com a ajuda de Deus, e com o nosso esforço, salvaremos o mundo."}, {"n": 636, "chapter": "Vitória", "text": "Temos de procurar que, em todas as atividades intelectuais, haja pessoas retas, de autêntica consciência cristã, de vida coerente, que empreguem as armas da ciência a serviço da humanidade e da Igreja. Porque nunca faltarão no mundo, como aconteceu quando Jesus veio à terra, novos Herodes que tentem aproveitar os conhecimentos científicos, mesmo falseando-os, para perseguir Cristo e os que são de Cristo. Que grande tarefa temos pela frente!"}, {"n": 637, "chapter": "Vitória", "text": "No teu trabalho de almas - a tua ocupação inteira deve ser trabalho de almas -, enche-te de fé, de esperança, de amor, porque todas as dificuldades se superam. Para confirmar-nos nesta verdade, escreveu o salmista: “Et Tu, Domine, deridebis eos: ad nihilum deduces omnes gentes” - Tu, Senhor, zombarás deles; Tu os reduzirás a nada. Estas palavras ratificam o “non praevalebunt” - não prevalecerão os inimigos de Deus: nada hão de poder contra a Igreja nem contra aqueles que - instrumentos de Deus - servem a Igreja."}, {"n": 638, "chapter": "Vitória", "text": "A nossa Santa Mãe a Igreja, em magnífica extensão de amor, vai espalhando a semente do Evangelho por todo o mundo. De Roma até à periferia. - Ao colaborares tu nessa expansão, pelo orbe inteiro, deves levar a periferia ao Papa, para que a terra toda seja um só rebanho e um só Pastor: um só apostolado!"}, {"n": 639, "chapter": "Vitória", "text": "“Regnare Christum volumus!” - queremos que Cristo reine. “Deo omnis gloria!” - para Deus toda a glória. Este ideal de guerrear - e vencer - com as armas de Cristo, somente se fará realidade pela oração e pelo sacrifício, pela fé e pelo Amor. - Pois então..., vamos orar, e crer, e sofrer, e Amar!"}, {"n": 640, "chapter": "Vitória", "text": "O trabalho da Igreja é em cada dia como um grande tecido que oferecemos ao Senhor, porque todos os batizados somos Igreja. - Se cumprirmos - fiéis e entregados -, este grande tecido será formoso e sem falha. - Mas, se um solta um fio aqui, outro acolá, e outro mais além..., em vez de um belo tecido, teremos um trapo esfiapado."}, {"n": 641, "chapter": "Vitória", "text": "Por que não te decides a fazer uma correção fraterna? - Sofre-se ao recebê-la, porque custa humilhar-se, pelo menos no começo. Mas, fazê-la, custa sempre. Bem o sabem todos. O exercício da correção fraterna é a melhor maneira de ajudar, depois da oração e do bom exemplo."}, {"n": 642, "chapter": "Vitória", "text": "Pela confiança que Ele deposita em ti, ao ter-te trazido à Igreja, hás de ter o comedimento, a serenidade, a fortaleza, a prudência - humana e sobrenatural - de pessoa madura que muitos adquirem com o passar dos anos. Não esqueças que cristão, como aprendemos no Catecismo, significa homem - mulher - que tem a fé de Jesus Cristo."}, {"n": 643, "chapter": "Vitória", "text": "Queres ser forte? - Primeiro, repara que és muito fraco; e depois, confia em Cristo, que é Pai e Irmão e Mestre, e que nos torna fortes entregando - nos os meios para vencer: os sacramentos. Vive-os!"}, {"n": 644, "chapter": "Vitória", "text": "Entendia-te bem quando me confiavas: - Quero embeber-me na liturgia da Santa Missa."}, {"n": 645, "chapter": "Vitória", "text": "Valor da piedade na Santa Liturgia! Não estranhei nada quando, há alguns dias, certa pessoa me comentava de um sacerdote exemplar, falecido recentemente: - Como era santo! - Conhecia-o bem?, perguntei-lhe. - Não - respondeu-me -, mas vi-o uma vez celebrar a Santa Missa."}, {"n": 646, "chapter": "Vitória", "text": "Tu, que te chamas cristão, tens de viver a Sagrada Liturgia da Igreja, pondo verdadeiro interesse em orar e em mortificar-te pelos sacerdotes - especialmente pelos novos sacerdotes -, nos dias fixados para esta intenção"}, {"n": 647, "chapter": "Vitória", "text": "Oferece a oração, a expiação e a ação por esta finalidade: “Ut sint unum!” - para que todos os cristãos tenhamos uma mesma vontade, um mesmo coração, um mesmo espírito: para que “omnes cum Petro ad Iesum per Mariam!” - que todos, bem unidos ao Papa, vamos a Jesus, por Maria."}, {"n": 648, "chapter": "Vitória", "text": "Perguntas-me, meu filho, o que podes fazer para que eu fique muito contente contigo. - Se o Senhor está satisfeito contigo, eu também estou. E tu podes saber se Ele está contente contigo pela paz e pela alegria que houver em teu coração."}, {"n": 649, "chapter": "Vitória", "text": "Característica evidente de um homem de Deus, de uma mulher de Deus, é a paz na sua alma; tem “a paz” e dá “a paz” às pessoas com quem convive."}, {"n": 650, "chapter": "Vitória", "text": "Acostuma-te a apedrejar esses pobres “odiadores”, respondendo às suas pedradas com Ave-Marias."}, {"n": 651, "chapter": "Vitória", "text": "Não te preocupes se o teu trabalho agora parece estéril. Quando a semeadura é de santidade, não se perde; outros recolherão o fruto."}, {"n": 652, "chapter": "Vitória", "text": "Mesmo que consigas poucas luzes na oração, mesmo que te pareça emperrada, seca..., tens de considerar, sempre com visão nova e segura, a necessidade da perseverança em todos os pormenores da tua vida de piedade."}, {"n": 653, "chapter": "Vitória", "text": "Crescias perante as dificuldades do apostolado, orando assim: “Senhor, Tu és o mesmo de sempre. Dá-me a fé daqueles varões que souberam corresponder à tua graça e que realizaram - em teu Nome - grandes milagres, verdadeiros prodígios...” - E concluías: “Sei que os farás; mas também sei que queres que os peçamos, que queres que te procuremos, que batamos fortemente às portas do teu Coração”. - No fim, renovaste a tua decisão de perseverar na oração humilde e confiante."}, {"n": 654, "chapter": "Vitória", "text": "Quando te vires atribulado..., e também na hora do triunfo, repete: - Senhor, não me largues, não me deixes, ajuda-me como a uma criatura inexperiente, leva-me sempre pela tua mão!"}, {"n": 655, "chapter": "Vitória", "text": "“Aquae multae non potuerunt extinguere caritatem!” - a turbulência das águas não pôde extinguir o fogo da caridade. - Ofereço-te duas interpretações destas palavras da Escritura Santa. - Uma, que a multidão dos teus pecados passados - a ti, que estás bem arrependido - não te afastará do Amor do nosso Deus; e outra, que as águas da incompreensão, das contradições, que talvez estejas sofrendo, não deverão interromper o teu trabalho apostólico."}, {"n": 656, "chapter": "Vitória", "text": "Acabar! Acabar! - Filho, “qui perseveraverit usque in finem, hic salvus erit” - quem perseverar até o fim, esse se salvará. - E nós, os filhos de Deus, dispomos dos meios; tu também! Colocaremos o telhado, porque tudo podemos nAquele que nos conforta. - Com o Senhor, não há impossíveis: superam-se sempre."}, {"n": 657, "chapter": "Vitória", "text": "Por vezes, apresenta-se um futuro imediato cheio de preocupações, se perdemos o sentido sobrenatural dos acontecimentos. - Portanto, filho, fé nessas horas..., e mais obras. Assim não há dúvida de que o nosso Pai-Deus continuará a dar solução aos teus problemas."}, {"n": 658, "chapter": "Vitória", "text": "A providência ordinária de Deus é um contínuo milagre, mas... Ele empregará meios extraordinários, quando forem precisos."}, {"n": 659, "chapter": "Vitória", "text": "O otimismo cristão não é um otimismo meloso, nem tampouco uma confiança humana em que tudo dará certo. É um otimismo que mergulha as suas raízes na consciência da liberdade e na certeza do poder da graça; um otimismo que nos leva a ser exigentes conosco próprios, a esforçar-nos por corresponder em cada instante às chamadas de Deus."}, {"n": 660, "chapter": "Vitória", "text": "O dia do triunfo do Senhor, da sua Ressurreição, é definitivo. Onde estão os soldados que a autoridade tinha destacado? Onde estão os selos que tinham colocado sobre a pedra do sepulcro? Onde estão os que condenaram o Mestre? Onde estão os que crucificaram Jesus?... Perante a sua vitória, produz-se a grande fuga dos pobres miseráveis. Enche-te de esperança: Jesus Cristo vence sempre."}, {"n": 661, "chapter": "Vitória", "text": "Se procuras Maria, encontrarás “necessariamente” Jesus, e aprenderás - sempre com maior profundidade - o que há no Coração de Deus."}, {"n": 662, "chapter": "Vitória", "text": "Quando te dispuseres a empreender uma tarefa de apostolado, aplica a ti mesmo o que dizia um homem que procurava a Deus: “Hoje começo a pregar um retiro para sacerdotes. Oxalá tiremos muito fruto: em primeiro lugar, eu!” - E mais tarde: “Há vários dias que estou pregando um retiro. Os retirantes são cento e vinte. Espero que o Senhor faça um bom trabalho nas nossas almas”."}, {"n": 663, "chapter": "Vitória", "text": "Filho, vale a pena que sejas humilde, obediente, leal, que te impregnes do espírito de Deus, para levá-lo - daí do lugar que ocupas, do teu lugar de trabalho - a todas as gentes que povoam o mundo!"}, {"n": 664, "chapter": "Vitória", "text": "Na guerra, de pouco serviria a coragem dos soldados que enfrentam o inimigo, se não houvesse outros que, sem tomarem aparentemente parte na batalha, proporcionam munições e alimentos e remédios aos guerreiros... - Sem a oração e sem o sacrifício de tantas almas, não haverá verdadeiro apostolado de ação."}, {"n": 665, "chapter": "Vitória", "text": "Poder de fazer milagres! Quantas almas mortas, e até apodrecidas, não ressuscitarás, se permites a Cristo que atue em ti. Naqueles tempos, narram os Evangelhos, o Senhor passava, e eles, os enfermos, chamavam por Ele e O procuravam. Também agora Cristo passa com a tua vida cristã e, se o secundares, quantos não O conhecerão, e chamarão por Ele, e Lhe pedirão ajuda, e terão os olhos abertos para as luzes maravilhosas da graça!"}, {"n": 666, "chapter": "Vitória", "text": "Empenhas-te em caminhar ao teu jeito, e o teu trabalho acaba sendo estéril. Obedece, sê dócil: porque, assim como é uma necessidade pôr cada roda de uma máquina no seu lugar (caso contrário, pára ou deformam-se as peças; e, sem dúvida, não produz ou o seu rendimento é muito pequeno), assim também um homem ou uma mulher, tirados do seu campo de ação, serão antes um estorvo do que um instrumento de apostolado."}, {"n": 667, "chapter": "Vitória", "text": "O apóstolo não tem outro fim que não deixar agir o Senhor, tornar-se disponível."}, {"n": 668, "chapter": "Vitória", "text": "Também os primeiros Doze eram estrangeiros nas terras que evangelizavam, e tropeçavam com pessoas que construíam o mundo sobre bases diametralmente opostas à doutrina de Cristo. - Olha: por cima dessas circunstâncias adversas, eles sabiam-se depositários da mensagem divina da Redenção. E clama o Apóstolo: “Ai de mim se não evangelizar!”"}, {"n": 669, "chapter": "Vitória", "text": "A eficácia corredentora - eterna! - das nossas vidas só se pode tornar efetiva mediante a humildade - desaparecendo -, para que os outros descubram o Senhor."}, {"n": 670, "chapter": "Vitória", "text": "Os filhos de Deus têm de ser, na sua ação apostólica, como essas potentes instalações elétricas: encherão de luz o mundo, sem que se veja o foco."}, {"n": 671, "chapter": "Vitória", "text": "Diz Jesus: “Quem a vós ouve a mim ouve”. - Julgas ainda que são as tuas palavras que convencem os homens?... Além disso, não esqueças que o Espírito Santo pode valer-se, para os seus planos, do instrumento mais inepto."}, {"n": 672, "chapter": "Vitória", "text": "Como se ajustam admiravelmente aos filhos de Deus estas palavras de Santo Ambrósio! Fala do burrico atado com a jumenta, de que Jesus necessitava para o seu triunfo, e comenta: “Só uma ordem do Senhor podia desatá-lo. Soltaram-no as mãos dos Apóstolos. Para semelhante fato, requerem-se um modo de viver e uma graça especial. Sê tu também apóstolo, para poderes libertar os que estão cativos”. - Deixa-me que te glose novamente este texto: quantas vezes, a mando de Jesus, não teremos de soltar os grilhões das almas, porque Ele necessitará delas para o seu triunfo! Que sejam de apóstolo as nossas mãos, e as nossas ações, e a nossa vida... Então Deus nos dará também graça de apóstolo, para quebrarmos os ferros dos agrilhoados."}, {"n": 673, "chapter": "Vitória", "text": "Não podemos atribuir nunca a nós mesmos o poder de Jesus, que passa entre nós. O Senhor passa, e transforma as almas, quando nos colocamos todos junto dEle, com um só coração, com um só sentir, com um só desejo de ser bons cristãos; mas é Ele, não tu nem eu. É Cristo que passa! - E, além disso, Ele fica em nossos corações - no teu e no meu! -, e nos nossos sacrários. - É Jesus que passa, e Jesus que fica. Permanece em ti, em cada um de vós e em mim."}, {"n": 674, "chapter": "Vitória", "text": "O Senhor quis fazer-nos corredentores com Ele. - É por isso, para nos ajudar a compreender esta maravilha, que move os evangelistas a relatar tantos grandes prodígios. Ele podia tirar o pão de onde quisesse... Mas não! Procura a cooperação humana: necessita de um menino, de um rapaz, de uns pedaços de pão e de uns peixes. - Fazemos-Lhe falta tu e eu, e é Deus! - Isto nos há de instar a ser generosos, na nossa correspondência às suas graças."}, {"n": 675, "chapter": "Vitória", "text": "Se O ajudares, mesmo que seja com uma ninharia, como fizeram os Apóstolos, Ele estará disposto a realizar milagres, a multiplicar os pães, a mudar as vontades, a dar luz às inteligências mais obscurecidas, a fazer - com uma graça extraordinária - que sejam capazes de retidão os que nunca o foram. Tudo isto... e mais, se O ajudares com o que tens."}, {"n": 676, "chapter": "Vitória", "text": "Jesus morreu. É um cadáver. Aquelas mulheres santas não esperavam nada. Tinham visto como O haviam maltratado e como O haviam crucificado: como tinham elas presente a violência daquela Paixão sofrida! Sabiam também que os soldados vigiavam o lugar, sabiam que o sepulcro estava completamente fechado: - Quem nos tirará a pedra da entrada?, perguntavam-se, porque era uma lousa enorme. No entanto, apesar de tudo, elas acorrem a estar com Ele. Olha, as dificuldades - grandes e pequenas - enxergam-se logo... Mas, se há amor, não se repara nesses obstáculos, e procede-se com audácia, com decisão, com valentia: não tens de confessar que sentes vergonha ao contemplar o ímpeto, a intrepidez e a valentia daquelas mulheres?"}, {"n": 677, "chapter": "Vitória", "text": "Maria, tua Mãe, levar-te-á ao Amor de Jesus. E aí estarás “cum gaudio et pace”, com alegria e paz, sempre “levado” - porque sozinho cairias e te encherias de lama -, caminho afora, para crer, para amar e para sofrer."}, {"n": 678, "chapter": "Labor", "text": "Pelo ensinamento de São Paulo, sabemos que temos de renovar o mundo no espírito de Jesus Cristo, que temos de colocar o Senhor no alto e na entranha de todas as coisas. - Achas que estás cumprindo isso no teu ofício, na tua tarefa profissional?"}, {"n": 679, "chapter": "Labor", "text": "Por que não experimentas converter em serviço de Deus a tua vida inteira: o trabalho e o descanso, o pranto e o sorriso? - Podes... e deves!"}, {"n": 680, "chapter": "Labor", "text": "Todas e cada uma das criaturas, todos os acontecimentos desta vida, sem exceção, têm de ser degraus que te levem a Deus e que te movam a conhecê-Lo e amá-Lo, a dar-Lhe graças e a procurar que todos O conheçam e O amem."}, {"n": 681, "chapter": "Labor", "text": "Temos obrigação de trabalhar, e de trabalhar conscienciosamente, com senso de responsabilidade, com amor e perseverança, sem descuidos nem ligeirezas: porque o trabalho é um mandamento de Deus, e a Deus, como diz o salmista, é preciso obedecer “in laetitia” - com alegria!"}, {"n": 682, "chapter": "Labor", "text": "Temos de conquistar, para Cristo, todo e qualquer valor humano que seja nobre."}, {"n": 683, "chapter": "Labor", "text": "Quando se vive deveras a caridade, não sobra tempo para nos procurarmos a nós mesmos; não há espaço para o orgulho; só nos ocorrem ocasiões de servir!"}, {"n": 684, "chapter": "Labor", "text": "Qualquer atividade - seja ou não humanamente muito importante - tem de converter-se para ti num meio de servir o Senhor e os homens: aí está a verdadeira dimensão da sua importância."}, {"n": 685, "chapter": "Labor", "text": "Trabalha sempre, e em tudo, com sacrifício, para colocar Cristo no cume de todas as atividades dos homens."}, {"n": 686, "chapter": "Labor", "text": "A correspondência à graça também se encontra nessas coisas corriqueiras da jornada, que parecem sem categoria e, no entanto, têm a transcendência do Amor."}, {"n": 687, "chapter": "Labor", "text": "Não é possível esquecer que o trabalho humanamente digno, nobre e honesto, pode - e deve! - ser elevado à ordem sobrenatural, passando a ser uma ocupação divina."}, {"n": 688, "chapter": "Labor", "text": "Ao crescer e viver como qualquer um de nós, Jesus, nosso Senhor e Modelo, revelou-nos que a existência humana - a tua -, as ocupações comuns e habituais, têm um sentido divino, de eternidade."}, {"n": 689, "chapter": "Labor", "text": "Admira a bondade do nosso Pai-Deus: não te enche de alegria a certeza de que o teu lar, a tua família, o teu país, que amas com loucura, são matéria de santidade?"}, {"n": 690, "chapter": "Labor", "text": "Minha filha, a ti que formaste um lar, gosto de recordar-te que as mulheres - bem o sabes! - têm muita fortaleza, uma fortaleza que sabem envolver numa doçura especial, para que não se note. E, com essa fortaleza, podem fazer do marido e dos filhos instrumentos de Deus ou diabos. - Tu os farás sempre instrumentos de Deus: o Senhor conta com a tua ajuda."}, {"n": 691, "chapter": "Labor", "text": "Comove-me que o Apóstolo qualifique o matrimônio cristão como “sacramentum magnum” - sacramento grande. Também daqui deduzo que a tarefa dos pais de família é importantíssima. - Participais do poder criador de Deus, e é por isso que o amor humano é santo, nobre e bom: uma alegria do coração, a que o Senhor - na sua providência amorosa - quer que outros renunciemos livremente. - Cada filho que Deus vos concede é uma grande bênção divina: não tenhais medo aos filhos!"}, {"n": 692, "chapter": "Labor", "text": "Em minhas conversas com tantos casais, insisto-lhes em que, enquanto eles viverem e viverem também os seus filhos, devem ajudá-los a ser santos, sabendo que na terra nenhum de nós será santo. Não faremos mais do que lutar, lutar e lutar. E acrescento: - Vós, mães e pais cristãos, sois um grande motor espiritual, que manda aos seus fortaleza de Deus para essa luta, para que vençam, para que sejam santos. Não os decepcioneis!"}, {"n": 693, "chapter": "Labor", "text": "Não tenhas medo de amar as almas, por Ele; e não te importes de amar ainda mais os teus, sempre que, amando-os tanto, O ames a Ele milhões de vezes mais."}, {"n": 694, "chapter": "Labor", "text": "“Coepit facere et docere” - Jesus começou a fazer e depois a ensinar: tu e eu temos que dar o testemunho do exemplo, porque não podemos levar uma dupla vida; não podemos ensinar o que não praticamos. Por outras palavras, temos de ensinar aquilo que, pelo menos, lutamos por praticar."}, {"n": 695, "chapter": "Labor", "text": "Cristão: tens obrigação de ser exemplar em todos os terrenos, também como cidadão, no cumprimento das leis que visam o bem comum."}, {"n": 696, "chapter": "Labor", "text": "Uma vez que és tão exigente em que, até nos serviços públicos, os outros cumpram as suas obrigações - é um dever!, afirmas -, já pensaste se tu respeitas o teu horário de trabalho, se o realizas conscienciosamente?"}, {"n": 697, "chapter": "Labor", "text": "Tens de observar todos os teus deveres cívicos, sem te quereres subtrair ao cumprimento de nenhuma obrigação; e exercer todos os teus direitos, em bem da coletividade, sem excetuar imprudentemente nenhum. - Também aí deves dar testemunho cristão."}, {"n": 698, "chapter": "Labor", "text": "Se queremos de verdade santificar o trabalho, é preciso que cumpramos ineludivelmente a primeira condição: trabalhar, e trabalhar bem!, com seriedade humana e sobrenatural."}, {"n": 699, "chapter": "Labor", "text": "Que a tua caridade seja amável: não deve faltar nunca em teus lábios, com a prudência e a naturalidade devidas, e ainda que chores por dentro, um sorriso para todos, um serviço sem regateios."}, {"n": 700, "chapter": "Labor", "text": "Esse trabalho acabado pela metade é apenas uma caricatura do holocausto que Deus te pede."}, {"n": 701, "chapter": "Labor", "text": "Se afirmas que queres imitar a Cristo... e te sobra tempo, andas por caminhos de tibieza."}, {"n": 702, "chapter": "Labor", "text": "As tarefas profissionais - o trabalho do lar também é uma profissão de primeira grandeza - são testemunho da dignidade da criatura humana; ocasião de desenvolvimento da própria personalidade; vínculo de união com os outros; fonte de recursos; meio de contribuir para a melhoria da sociedade em que vivemos e de fomentar o progresso da humanidade inteira... - Para um cristão, estas perspectivas alargam-se e ampliam-se ainda mais, porque o trabalho - assumido por Cristo como realidade redimida e redentora - se converte em meio e caminho de santidade, em tarefa concreta santificável e santificadora."}, {"n": 703, "chapter": "Labor", "text": "O Senhor quis que os seus filhos, os que recebemos o dom da fé, manifestássemos a original visão otimista da criação, o “amor ao mundo” que palpita no cristianismo. - Portanto, não deve faltar nunca entusiasmo no teu trabalho profissional, nem no teu empenho por construir a cidade temporal."}, {"n": 704, "chapter": "Labor", "text": "Tens de permanecer vigilante, para que os teus êxitos profissionais ou os teus fracassos - que virão! - não te façam esquecer, nem por um instante, qual é o verdadeiro fim do teu trabalho: a glória de Deus!"}, {"n": 705, "chapter": "Labor", "text": "A responsabilidade cristã no trabalho não se traduz apenas em ir preenchendo as horas, mas em realizá-lo com competência técnica e profissional... e, sobretudo, com amor de Deus."}, {"n": 706, "chapter": "Labor", "text": "Que pena matar o tempo, que é um tesouro de Deus!"}, {"n": 707, "chapter": "Labor", "text": "Como todas as profissões honestas podem e devem ser santificadas, nenhum filho de Deus tem o direito de dizer: - Não posso fazer apostolado."}, {"n": 708, "chapter": "Labor", "text": "Da vida oculta de Jesus Cristo tens que tirar esta outra conseqflência: não ter pressa..., tendo-a! Quer dizer, antes de mais nada está a vida interior; o resto, o apostolado, qualquer apostolado, é um corolário."}, {"n": 709, "chapter": "Labor", "text": "Enfrenta os problemas deste mundo com sentido sobrenatural e de acordo com as normas morais, que não ameaçam nem destroem a personalidade, antes a encaminham. - Infundirás assim na tua conduta uma força vital, que arraste; e te confirmarás na tua caminhada pelo reto caminho."}, {"n": 710, "chapter": "Labor", "text": "Deus Nosso Senhor te quer santo para que santifiques os outros. - E para isso, é preciso que tu - com valentia e sinceridade - olhes para ti mesmo, olhes para o Senhor Nosso Deus... e, depois, só depois, olhes para o mundo."}, {"n": 711, "chapter": "Labor", "text": "Fomenta as tuas qualidades nobres, humanas. Podem ser o começo do edifício da tua santificação. Ao mesmo tempo, lembra-te de que - como já te disse em outra oportunidade - no serviço de Deus é preciso queimar tudo, até o “que vão dizer”, até isso que chamam reputação, se for necessário."}, {"n": 712, "chapter": "Labor", "text": "Precisas de formação, porque deves ter um profundo senso de responsabilidade, que promova e anime a atuação dos católicos na vida pública, com o respeito devido à liberdade de cada um, e recordando a todos que têm de ser coerentes com a sua fé."}, {"n": 713, "chapter": "Labor", "text": "Por meio do teu trabalho profissional, acabado com a possível perfeição sobrenatural e humana, podes - deves! - dar critério cristão nos lugares onde exerças a tua profissão ou ofício."}, {"n": 714, "chapter": "Labor", "text": "Como cristão, tens o dever de atuar, de não te absteres, de prestar a tua própria colaboração para servir - com lealdade e com liberdade pessoal - o bem comum."}, {"n": 715, "chapter": "Labor", "text": "Nós, os filhos de Deus, cidadãos da mesma categoria que os outros, temos de participar “sem medo” em todas as atividades e organizações honestas dos homens, para que Cristo ali esteja presente. Nosso Senhor nos pedirá contas estritas se, por desleixo ou comodismo, cada um de nós, livremente, não procura intervir nas obras e nas decisões humanas de que dependem o presente e o futuro da sociedade."}, {"n": 716, "chapter": "Labor", "text": "Com sentido de profunda humildade - fortes no nome do nosso Deus e não, como diz o Salmo, “nos recursos dos nossos carros de combate e dos nossos cavalos” -, temos de procurar, sem respeitos humanos, que não haja recantos da sociedade em que não se conheça a Cristo."}, {"n": 717, "chapter": "Labor", "text": "Com liberdade, e de acordo com as tuas inclinações ou qualidades, deves tomar parte ativa e eficaz nas retas associações oficiais ou privadas do teu país, com uma participação cheia de sentido cristão: essas organizações nunca são indiferentes para o bem temporal e eterno dos homens."}, {"n": 718, "chapter": "Labor", "text": "Esforça-te para que as instituições e as estruturas humanas, em que trabalhas e te mexes com pleno direito de cidadão, se ajustem aos princípios que regem uma concepção cristã de vida. Assim - não tenhas dúvida -, asseguras aos homens os meios necessários para viverem de acordo com a sua dignidade, e dás ensejo a que muitas almas, com a graça de Deus, possam corresponder pessoalmente à vocação cristã."}, {"n": 719, "chapter": "Labor", "text": "Dever de cristão e de cidadão é defender e fomentar, por piedade e por cultura, os monumentos disseminados por ruas e caminhos - cruzeiros, imagens marianas, etc. -, reconstruindo aqueles que a barbárie ou o tempo destroem."}, {"n": 720, "chapter": "Labor", "text": "É necessário neutralizar essas “liberdades de perdição”, filhas da libertinagem, netas das más paixões, bisnetas do pecado original..., que, como se vê, descendem em linha reta do diabo."}, {"n": 721, "chapter": "Labor", "text": "Por objetividade, e para que não continuem fazendo mal, tenho de insistir em que não se deve dar publicidade nem “hosanar” os inimigos de Deus..., também depois de mortos."}, {"n": 722, "chapter": "Labor", "text": "Hoje ataca-se a nossa Mãe a Igreja no terreno social e no governo dos povos. Por isso Deus envia os seus filhos - a ti! - a lutar e a difundir a verdade nessas tarefas."}, {"n": 723, "chapter": "Labor", "text": "Pela tua condição de cidadão comum, precisamente por esse teu “laicismo”, igual - nem mais nem menos - ao dos teus colegas, deves ter a valentia, que em certas ocasiões não será pequena, de tornar “tangível” a tua fé: que vejam as tuas boas obras e o motivo que te inspira."}, {"n": 724, "chapter": "Labor", "text": "Um filho de Deus - tu - não deve ter medo de viver no ambiente - profissional, social... - que lhe é próprio: nunca está só! - Deus Nosso Senhor, que sempre te acompanha, concede-te os meios para que Lhe sejas fiel e para que leves os outros até Ele."}, {"n": 725, "chapter": "Labor", "text": "Tudo por Amor! Este é o caminho da santidade, da felicidade. Enfrenta com essas miras as tuas tarefas intelectuais, as ocupações mais altas do espírito e as coisas mais terra-a-terra, essas que necessariamente temos de cumprir todos, e viverás alegre e com paz."}, {"n": 726, "chapter": "Labor", "text": "Tu, por seres cristão, dentro dos limites do dogma e da moral, podes ceder em tudo o que for teu, e ceder de todo o coração... Mas, no que é de Jesus Cristo, não podes ceder!"}, {"n": 727, "chapter": "Labor", "text": "Quando tiveres de mandar, não humilhes: procede com delicadeza; respeita a inteligência e a vontade daquele que obedece."}, {"n": 728, "chapter": "Labor", "text": "Logicamente, tens de empregar meios terrenos. - Mas põe um empenho muito grande em estar desprendido de tudo o que é terreno, para usá- -lo pensando sempre no serviço a Deus e aos homens."}, {"n": 729, "chapter": "Labor", "text": "Planejar tudo? - Tudo, disseste-me. - De acordo; é necessário exercitar a prudência, mas tem em conta que os empreendimentos humanos, árduos ou comuns, conservam sempre uma margem de imprevistos..., e que um cristão, além disso, não deve barrar o passo à esperança, nem prescindir da Providência divina."}, {"n": 730, "chapter": "Labor", "text": "Tens de trabalhar com tal sentido sobrenatural, que só te deixes absorver pela tua atividade para divinizá-la: assim, o que é terreno se converte em divino, o que é temporal se converte em eterno."}, {"n": 731, "chapter": "Labor", "text": "As obras em serviço de Deus nunca se perdem por falta de dinheiro: perdem-se por falta de espírito."}, {"n": 732, "chapter": "Labor", "text": "Não te causa alegria sentir tão de perto a pobreza de Jesus?... Como é bonito não ter nem mesmo o necessário! Mas, como Ele: oculta e silenciosamente."}, {"n": 733, "chapter": "Labor", "text": "A devoção sincera, o verdadeiro amor a Deus, leva ao trabalho, ao cumprimento - ainda que custe - do dever de cada dia."}, {"n": 734, "chapter": "Labor", "text": "Tem-se posto de relevo, muitas vezes,o perigo das obras sem vida interior que as anime; mas deveria também sublinhar-se o perigo de uma vida interior - se é que pode existir - sem obras."}, {"n": 735, "chapter": "Labor", "text": "A luta interior não nos afasta das nossas ocupações temporais: leva-nos a terminá-las melhor!"}, {"n": 736, "chapter": "Labor", "text": "A tua existência não é uma repetição de atos iguais, porque o seguinte deve ser mais reto, mais eficaz, mais cheio de amor que o anterior. - Cada dia nova luz, novo entusiasmo!, por Ele!"}, {"n": 737, "chapter": "Labor", "text": "Em cada dia, deves fazer tudo o que possas para conhecer a Deus, para manter um “trato” íntimo com Ele, para te enamorares mais dEle em cada instante e não pensares senão no seu Amor e na sua glória. Cumprirás este plano, filho, se não abandonares - por nada! - os teus tempos de oração, a tua presença de Deus (com jaculatórias e comunhões espirituais, para te inflamares), a tua Santa Missa pausada, o teu trabalho bem acabado por amor dEle."}, {"n": 738, "chapter": "Labor", "text": "Nunca compartilharei a opinião - embora a respeite - dos que separam a oração da vida ativa, como se fossem incompatíveis. Nós, os filhos de Deus, temos de ser contemplativos: pessoas que, no meio do fragor da multidão, sabem encontrar o silêncio da alma em colóquio permanente com o Senhor; e olhá-Lo como se olha para um Pai, como se olha para um Amigo, a quem se ama com loucura."}, {"n": 739, "chapter": "Labor", "text": "Uma pessoa piedosa, com uma piedade sem carolice, cumpre o seu dever profissional com perfeição, porque sabe que esse trabalho é prece elevada a Deus."}, {"n": 740, "chapter": "Labor", "text": "A nossa condição de filhos de Deus há de levar-nos - insisto - a ter espírito contemplativo no meio de todas as atividades humanas - luz, sal e fermento, pela oração, pela mortificação, pela cultura religiosa e profissional -, tornando realidade este programa: quanto mais dentro do mundo estivermos, tanto mais temos que ser de Deus."}, {"n": 741, "chapter": "Labor", "text": "O ouro bom e os diamantes estão nas entranhas da terra, não na palma da mão. O teu labor de santidade - própria e dos outros - depende desse fervor, dessa alegria, desse teu trabalho, obscuro e cotidiano, normal e corrente."}, {"n": 742, "chapter": "Labor", "text": "Na nossa conduta habitual, necessitamos de uma virtude muito superior à do lendário rei Midas: ele convertia em ouro tudo quanto tocava. - Nós temos de converter - pelo amor - o trabalho humano, da nossa jornada habitual, em obra de Deus, com alcance eterno."}, {"n": 743, "chapter": "Labor", "text": "Na tua vida, se te propuseres consegui-lo, tudo pode ser objeto de oferecimento ao Senhor, ocasião de colóquio com teu Pai do Céu, que sempre reserva e concede luzes novas."}, {"n": 744, "chapter": "Labor", "text": "Trabalha com alegria, com paz, com presença de Deus. - Desta maneira, além disso, realizarás a tua tarefa com bom senso: mesmo que o cansaço te esgote, chegarás ao fim, acabá-la-ás bem..., e as tuas obras agradarão a Deus."}, {"n": 745, "chapter": "Labor", "text": "Deves manter - ao longo do dia - uma constante conversa com o Senhor, que se alimente também das próprias incidências da tua tarefa profissional. - Vai com o pensamento ao Sacrário..., e oferece ao Senhor o trabalho que tenhas entre mãos."}, {"n": 746, "chapter": "Labor", "text": "Aí, nesse lugar de trabalho, deves conseguir que o teu coração escape para o Senhor, junto ao Sacrário, para Lhe dizer, sem fazer coisas estranhas: - Meu Jesus, eu te amo. - Não tenhas medo de chamá-Lo assim - meu Jesus - e de chamá-lo amiúde."}, {"n": 747, "chapter": "Labor", "text": "Era assim que um sacerdote desejava dedicar-se à oração, enquanto recitava o Ofício divino: “Terei por norma dizer no começo: Quero rezar como rezam os santos, e depois convidarei o meu Anjo da Guarda a cantar, comigo, os louvores ao Senhor”. Experimenta este caminho para a tua oração vocal e para fomentares a presença de Deus no teu trabalho."}, {"n": 748, "chapter": "Labor", "text": "Recebeste a chamada de Deus para um caminho concreto: meteres-te em todas as encruzilhadas do mundo, estando tu - no teu trabalho profissional - metido em Deus."}, {"n": 749, "chapter": "Labor", "text": "Não percas nunca de vista a mira sobrenatural. - Retifica a intenção, como se vai retificando o rumo do navio no mar alto: olhando para a estrela, olhando para Maria. E terás a certeza de chegar sempre a bom porto."}, {"n": 750, "chapter": "Crisol", "text": "Não te digo, Senhor, que me tires os afetos - porque com eles posso servir-te -, mas que os acrisoles."}, {"n": 751, "chapter": "Crisol", "text": "Perante todas as maravilhas de Deus, e perante todos os nossos fracassos humanos, temos de reconhecer: - Tu és tudo para mim: serve-te de mim como quiseres! - E deixará de haver solidão para ti, para nós."}, {"n": 752, "chapter": "Crisol", "text": "O grande segredo da santidade reduz-se a parecer-se mais e mais com Ele, que é o único e amável Modelo."}, {"n": 753, "chapter": "Crisol", "text": "Quando fores orar, e não enxergares nada, e te sentires agitado e seco, este é o caminho: não penses em ti; volta antes os teus olhos para a Paixão de Cristo, nosso Redentor. Convence-te de que o Senhor também pede a cada um de nós o que pedia àqueles três Apóstolos mais íntimos, no Horto das Oliveiras: “Vigiai e orai”."}, {"n": 754, "chapter": "Crisol", "text": "Quando abrires o Santo Evangelho, pensa que não só deves saber, mas viver o que ali se narra: obras e ditos de Cristo. Tudo, cada ponto que se relata, foi registrado, detalhe por detalhe, para que o encarnes nas circunstâncias concretas da tua existência. - O Senhor chamou-nos, a nós católicos, para que O seguíssemos de perto; e, nesse Texto Santo, encontras a Vida de Jesus; mas, além disso, deves encontrar a tua própria vida. Aprenderás a perguntar tu também, como o Apóstolo, cheio de amor: “Senhor, que queres que eu faça?...” - A Vontade de Deus!, ouvirás na tua alma de modo terminante. Pois bem, pega no Evangelho diariamente, e lê-o e vive-o como norma concreta. - Assim procederam os santos."}, {"n": 755, "chapter": "Crisol", "text": "Se verdadeiramente desejas que o teu coração reaja de um modo seguro, eu te aconselho a meter-te numa Chaga do Senhor: assim O tratarás de perto, grudar-te-ás nEle, sentirás palpitar o seu Coração..., e O seguirás em tudo o que te peça."}, {"n": 756, "chapter": "Crisol", "text": "A oração é indubitavelmente o “tira-pesares” dos que amamos a Jesus."}, {"n": 757, "chapter": "Crisol", "text": "A Cruz simboliza a vida do apóstolo de Cristo, com um vigor e uma verdade que encantam a alma e o corpo, ainda que às vezes custe e se note o peso."}, {"n": 758, "chapter": "Crisol", "text": "Compreendo que, por Amor, desejes padecer com Cristo: interpor as tuas costas entre Ele e os algozes que O açoitam; oferecer a tua cabeça, e não a dEle, aos espinhos; e os teus pés e as tuas mãos, aos pregos;...ou, pelo menos, acompanhar a nossa Mãe Santa Maria, no Calvário, e acusar-te de deicida pelos teus pecados..., e sofrer e amar."}, {"n": 759, "chapter": "Crisol", "text": "Propus-me freqflentar mais o Paráclito e pedir-Lhe as suas luzes, disseste - me. - Muito bem: mas lembra-te, filho, de que o Espírito Santo é fruto da Cruz."}, {"n": 760, "chapter": "Crisol", "text": "O amor saboroso, que torna feliz a alma, está baseado na dor: não é possível amor sem renúncia."}, {"n": 761, "chapter": "Crisol", "text": "Cristo pregado na Cruz, e tu?... Ainda metido apenas nos teus gostos! Corrijo-me: pregado pelos teus gostos!"}, {"n": 762, "chapter": "Crisol", "text": "Não sejamos - não podemos ser! - cristãos adocicados: na terra tem que haver dor e Cruz."}, {"n": 763, "chapter": "Crisol", "text": "Nesta nossa vida, é preciso contar com a Cruz. Quem não conta com a Cruz não é cristão..., e não poderá evitar o encontro com a “sua cruz”, na qual desesperará."}, {"n": 764, "chapter": "Crisol", "text": "Agora que a Cruz é séria, de peso, Jesus arruma as coisas de tal modo que nos cumula de paz: faz-se nosso Cireneu, para que o fardo se torne leve. Diz-Lhe, pois, cheio de confiança: - Senhor, que Cruz é esta? Uma Cruz sem cruz. De agora em diante, com a tua ajuda, conhecendo a fórmula para abandonar-me em Ti, serão sempre assim todas as minhas cruzes."}, {"n": 765, "chapter": "Crisol", "text": "Reafirma na tua alma o antigo propósito daquele amigo: - Senhor, quero o sofrimento, não o espetáculo."}, {"n": 766, "chapter": "Crisol", "text": "Ter a Cruz é ter a alegria: é ter-te a Ti, Senhor!"}, {"n": 767, "chapter": "Crisol", "text": "O que verdadeiramente torna infeliz uma pessoa - e até uma sociedade inteira - é essa procura, ansiosa e egoísta, de bem-estar: essa tentativa de eliminar tudo o que contraria."}, {"n": 768, "chapter": "Crisol", "text": "O caminho do Amor chama-se Sacrifício."}, {"n": 769, "chapter": "Crisol", "text": "A Cruz - a Santa Cruz! - pesa. - Por um lado, estão os meus pecados. Por outro, a triste realidade dos sofrimentos da nossa Mãe a Igreja; a apatia de tantos católicos que têm um “querer sem querer”; a separação - por diversos motivos - de seres amados; as doenças e tribulações, alheias e próprias... A Cruz - a Santa Cruz! - pesa: “Fiat, adimpleatur...!” - Faça-se, cumpra-se, seja louvada e eternamente glorificada a justíssima e amabilíssima Vontade de Deus sobre todas as coisas. Assim seja. Assim seja."}, {"n": 770, "chapter": "Crisol", "text": "Quando se caminha por onde Cristo caminha; quando já não há resignação, mas a alma se conforma com a Cruz - se amolda à forma da Cruz -; quando se ama a Vontade de Deus; quando se quer a Cruz..., então, mas só então, é Ele que a leva."}, {"n": 771, "chapter": "Crisol", "text": "Une a tua dor - a Cruz exterior ou interior - à Vontade de Deus, por meio de um “fiat!” - faça-se - generoso, e te encherás de júbilo e de paz."}, {"n": 772, "chapter": "Crisol", "text": "Sinais inequívocos da verdadeira Cruz de Cristo: a serenidade, um profundo sentimento de paz, um amor disposto a qualquer sacrifício, uma eficácia grande, que brota do próprio Lado aberto de Jesus, e sempre - de modo evidente - a alegria: uma alegria que procede de saber que, quem se entrega de verdade, está junto da Cruz e, por conseguinte, junto de Nosso Senhor."}, {"n": 773, "chapter": "Crisol", "text": "Não deixes de ver e de agradecer a predileção do Rei que, na tua vida inteira, sela a tua carne e o teu espírito com o selo régio da Santa Cruz."}, {"n": 774, "chapter": "Crisol", "text": "“Trago comigo - escrevia aquele amigo - um pequeno crucifixo, com a imagem muito gasta pelo uso e pelos beijos, herdado por meu pai quando da morte de sua mãe, que o usava habitualmente. “Como é muito pobrezinho e está muito gasto, não me atreverei a dá-lo de presente a ninguém, e deste modo - ao vê-lo - aumentará o meu amor à Cruz”."}, {"n": 775, "chapter": "Crisol", "text": "Assim rezava um sacerdote, em momentos de aflição: “Venha, Jesus, a Cruz que Tu quiseres; desde agora a recebo com alegria e a abençôo com a rica bênção do meu sacerdócio”."}, {"n": 776, "chapter": "Crisol", "text": "Quando receberes algum golpe forte, alguma Cruz, não deves afligir-te. Pelo contrário, de rosto alegre, deves dar graças ao Senhor."}, {"n": 777, "chapter": "Crisol", "text": "Ontem vi um quadro de Jesus morto, que me encantou. Um anjo, com unção indizível, beija a sua mão esquerda; outro, aos pés do Salvador, tem um prego arrancado da Cruz; e, em primeiro plano, de costas, olhando para Cristo, um anjinho pequeno chora. Pedi ao Senhor que me oferecessem o quadro de presente: é bonito, respira piedade. - Entristeceu-me saber que uma pessoa, a quem mostraram a tela para que a comprasse, a rejeitou dizendo: “Um cadáver!”. - Para mim, Tu serás sempre a Vida."}, {"n": 778, "chapter": "Crisol", "text": "Senhor - não me importo de repeti-lo milhares de vezes -, quero acompanhar-te, sofrendo Contigo, nas humilhações e crueldades da Paixão e da Cruz."}, {"n": 779, "chapter": "Crisol", "text": "Encontrar a Cruz é encontrar Cristo."}, {"n": 780, "chapter": "Crisol", "text": "Jesus, que o teu Sangue de Deus penetre nas minhas veias, para fazer-me viver, em cada instante, a generosidade da Cruz."}, {"n": 781, "chapter": "Crisol", "text": "Perante Jesus morto na Cruz, faz oração, para que a Vida e a Morte de Cristo sejam o modelo e o estímulo da tua vida e da tua resposta à Vontade divina."}, {"n": 782, "chapter": "Crisol", "text": "Lembra-te disto na hora da dor ou da expiação: a Cruz é o sinal de Cristo Redentor. Deixou de ser o símbolo do mal para ser o sinal da vitória."}, {"n": 783, "chapter": "Crisol", "text": "Tens que pôr, entre os ingredientes da comida, o “riquíssimo” da mortificação."}, {"n": 784, "chapter": "Crisol", "text": "Não é espírito de penitência fazer nuns dias grandes mortificações, e abandoná-las em outros. - Espírito de penitência significa saber vencer-se todos os dias, oferecendo a Deus coisas - grandes e pequenas - por amor e sem espetáculo."}, {"n": 785, "chapter": "Crisol", "text": "Se unirmos as nossas ninharias - as insignificantes e as grandes contrariedades - aos grandes sofrimentos do Senhor-Vítima - a única Vítima é Ele! -, aumentará o seu valor, tornar-se-ão um tesouro e, então, tomaremos com gosto, com garbo, a Cruz de Cristo. - E não haverá assim pena alguma que não se vença com rapidez; e não haverá nada nem ninguém que nos tire a paz e a alegria."}, {"n": 786, "chapter": "Crisol", "text": "Para seres apóstolo, tens que levar em ti - como ensina São Paulo - Cristo crucificado."}, {"n": 787, "chapter": "Crisol", "text": "É verdade! A Santa Cruz traz às nossas vidas a confirmação inequívoca de que somos de Cristo."}, {"n": 788, "chapter": "Crisol", "text": "A Cruz não é a pena, nem o desgosto, nem a amargura... É o madeiro santo onde triunfa Jesus Cristo..., e onde triunfamos nós, quando recebemos com alegria e generosamente o que Ele nos envia."}, {"n": 789, "chapter": "Crisol", "text": "Após o Santo Sacrifício, percebeste como da tua Fé e do teu Amor - da tua penitência, da tua oração e da tua atividade - dependem em boa parte a perseverança dos teus e, por vezes, até a sua vida terrena. - Bendita Cruz, que carregamos o meu Senhor Jesus - Ele -, e tu, e eu!"}, {"n": 790, "chapter": "Crisol", "text": "Õ Jesus, quero ser uma fogueira de loucura de Amor! Quero que já só a minha presença seja bastante para incendiar o mundo, em muitos quilômetros à volta, com um incêndio inextinguível. Quero saber que sou teu. Depois, que venha a Cruz... - Magnífico caminho! Sofrer, amar e crer."}, {"n": 791, "chapter": "Crisol", "text": "Quando estiveres doente, oferece com amor os teus sofrimentos, e eles se converterão em incenso que se eleva em honra de Deus e que te santifica."}, {"n": 792, "chapter": "Crisol", "text": "Tens de ser, como filho de Deus e com a sua graça, varão ou mulher forte, de desejos e de realidades. - Não somos plantas de estufa. Vivemos no meio do mundo, e temos de estar prontos a arrostar todos os ventos, o calor e o frio, a chuva e os ciclones..., mas fiéis a Deus e à sua Igreja."}, {"n": 793, "chapter": "Crisol", "text": "Como doem os desprezos, ainda que a vontade os queira! - Não te admires: oferece-os a Deus."}, {"n": 794, "chapter": "Crisol", "text": "Feriu-te muito esse desprezo!... - Isso significa que te esqueces com demasiada facilidade de quem és."}, {"n": 795, "chapter": "Crisol", "text": "Ante as acusações que consideramos injustas, examinemos a nossa conduta, diante de Deus, “cum gaudio et pace” - com alegre serenidade -, e retifiquemos o nosso proceder, mesmo que se trate de coisas sem mal nenhum, se a caridade assim no-lo aconselha. - Lutemos por ser santos, cada dia mais; e depois, “que falem”, sempre que a esses falatórios se possa aplicar aquela bem-aventurança: “Beati estis cum... dixerint omne malum adversus vos mentientes propter me” - bem - aventurados sereis quando vos caluniarem por minha causa."}, {"n": 796, "chapter": "Crisol", "text": "Afirmou-se - não me recordo de quem foi nem onde - que o vendaval da insídia se assanha contra os que sobressaem, como o furacão açoita os pinheiros mais altos."}, {"n": 797, "chapter": "Crisol", "text": "Intrigas, interpretações miseráveis - talhadas à medida do coração vil que interpreta -, sussurros covardes... - É uma cena infelizmente repetida nos diversos ambientes: nem trabalham nem deixam trabalhar. - Medita devagar aqueles versos do salmo: “Meu Deus, cheguei a ser um estranho para os meus irmãos, e um forasteiro para os filhos de minha mãe. Porque o zelo da tua casa me devorou, e os opróbrios dos que te ultrajavam caíram sobre mim”... E continua a trabalhar."}, {"n": 798, "chapter": "Crisol", "text": "Não se pode fazer o bem, ainda que todas as almas sejam boas, sem que se produza a Cruz santa dos falatórios."}, {"n": 799, "chapter": "Crisol", "text": "“In silentio et in spe erit fortitudo vestra” - no silêncio e na esperança residirá a vossa fortaleza..., assegura o Senhor aos seus. Calar-se e confiar: duas armas fundamentais no momento da adversidade, quando te forem negados os remédios humanos. O sofrimento suportado sem queixa - olha para Jesus na sua Santa Paixão e Morte - dá também a medida do amor."}, {"n": 800, "chapter": "Crisol", "text": "Assim rezava uma alma desejosa de ser inteiramente de Deus e, por Ele, de todas as almas: “Senhor, eu te peço que atues neste pecador, e que retifiques e purifiques e acrisoles as minhas intenções”."}, {"n": 801, "chapter": "Crisol", "text": "Tocou-me a condescendência - a transigência e a intransigência - daquele varão doutíssimo e santo, que dizia: - Avenho-me a tudo, menos a ofender a Deus."}, {"n": 802, "chapter": "Crisol", "text": "Considera o bem que fizeram à tua alma aqueles que, durante a tua vida, te mortificaram ou procuraram mortificar-te. - Há quem chame inimigos a essas pessoas. Tu - procurando imitar os santos, ao menos nisto, e valendo muito pouco para teres ou teres tido inimigos -, chama-os “benfeitores”. E acontecerá que, à força de pedir por eles a Deus, lhes terás simpatia."}, {"n": 803, "chapter": "Crisol", "text": "Filho, escuta-me bem: tu, feliz quando te maltratarem e te desonrarem; quando muita gente se alvoroçar e estiver na moda cuspir em ti, porque és “omnium peripsema” - como lixo para todos... - Custa, custa muito. É duro, até que - finalmente - um homem se aproxima do Sacrário, vê-se considerado como toda a porcaria do mundo, como um pobre verme, e diz de verdade: “Senhor, se Tu não precisas da minha honra, eu para que a quero?”. Até então, não sabe o filho de Deus o que é ser feliz: até chegar a essa nudez, a essa entrega, que é entrega de amor, mas fundada na mortificação, na dor."}, {"n": 804, "chapter": "Crisol", "text": "Contradição dos bons? - Coisas do demônio."}, {"n": 805, "chapter": "Crisol", "text": "Quando perdes a calma e ficas nervoso, é como se tirasses razão à tua razão. Nesses momentos, torna-se a ouvir a voz do Mestre a Pedro, que se afunda nas águas da sua falta de paz e dos seus nervos: “Por que duvidaste?”."}, {"n": 806, "chapter": "Crisol", "text": "A ordem dará harmonia à tua vida e te obterá a perseverança. A ordem proporcionará paz ao teu coração e gravidade à tua compostura."}, {"n": 807, "chapter": "Crisol", "text": "Copio este texto, porque pode dar paz à tua alma: “Encontro-me numa situação econômica tão apertada como nunca. Não perco a paz. Tenho absoluta certeza de que Deus, meu Pai, resolverá todo este assunto de uma vez. “Quero, Senhor, abandonar o cuidado de todas as minhas coisas nas tuas mãos generosas. A nossa Mãe - a tua Mãe! -, a estas horas, como em Caná, já fez soar aos teus ouvidos: - Não têm!... Eu creio em Ti, espero em Ti, amo-Te, Jesus: para mim, nada; para eles”."}, {"n": 808, "chapter": "Crisol", "text": "Amo a tua Vontade. Amo a santa pobreza, minha grande senhora. - E abomino, para sempre, tudo o que suponha, mesmo de longe, falta de adesão à tua justíssima, amabilíssima e paternal Vontade."}, {"n": 809, "chapter": "Crisol", "text": "O espírito de pobreza, de desprendimento dos bens terrenos, redunda na eficácia do apostolado."}, {"n": 810, "chapter": "Crisol", "text": "Nazaré: caminho de fé, de desprendimento, onde o Criador se submete às criaturas tal como ao seu Pai celestial."}, {"n": 811, "chapter": "Crisol", "text": "Jesus fala sempre com amor..., também quando nos corrige ou permite a tribulação."}, {"n": 812, "chapter": "Crisol", "text": "Identifica-te com a Vontade de Deus..., e assim a contradição não é contradição."}, {"n": 813, "chapter": "Crisol", "text": "Deus nos ama infinitamente mais do que tu mesmo te amas... Deixa, pois, que te exija!"}, {"n": 814, "chapter": "Crisol", "text": "Aceita sem medo a Vontade de Deus; formula sem vacilações o propósito de edificar toda a tua vida com o que nos ensina e exige a nossa fé. - Deste modo, podes estar certo de que, mesmo com penas e até com calúnias, serás feliz, com uma felicidade que te impelirá a amar os outros e a fazê-los participar da tua alegria sobrenatural."}, {"n": 815, "chapter": "Crisol", "text": "Se vierem contradições, fica certo de que são uma prova do amor de Pai que o Senhor tem por ti."}, {"n": 816, "chapter": "Crisol", "text": "Nesta forja de dor que acompanha a vida de todas as pessoas que amam, o Senhor nos ensina que quem pisa sem medo - embora custe - onde pisa o Mestre, encontra a alegria."}, {"n": 817, "chapter": "Crisol", "text": "Fortalece o teu espírito com a penitência, de tal maneira que, quando chegar a contradição, nunca desanimes."}, {"n": 818, "chapter": "Crisol", "text": "Quando te proporás, de uma vez por todas, identificar-te com esse Cristo que é Vida!"}, {"n": 819, "chapter": "Crisol", "text": "Para perseverar no seguimento dos passos de Jesus, é precisa uma liberdade contínua, um querer contínuo, um exercício contínuo da própria liberdade."}, {"n": 820, "chapter": "Crisol", "text": "Maravilha-te descobrir que, em cada uma das possibilidades de melhorar, existem muitas metas diferentes... - São outros caminhos dentro do “caminho”, que evitam a possível rotina e te aproximam mais do Senhor. - Tens de aspirar com generosidade ao que for mais alto."}, {"n": 821, "chapter": "Crisol", "text": "Deves trabalhar com humildade, quer dizer, contando primeiro com as bênçãos de Deus, que não te faltarão; depois, com os teus bons desejos, com os teus planos de trabalho, e com as tuas dificuldades!, sem esquecer que, entre essas dificuldades, deves colocar sempre a tua falta de santidade. - Serás bom instrumento se lutares cada dia por ser melhor."}, {"n": 822, "chapter": "Crisol", "text": "Confiaste-me que, na tua oração, abrias o coração com as seguintes palavras: “Considero, Senhor, as minhas misérias, que parecem aumentar apesar das tuas graças, sem dúvida pela minha falta de correspondência. Reconheço a ausência em mim da menor preparação para o empreendimento que pedes. E quando leio nos jornais que tantos e tantos homens de prestígio, de talento e de dinheiro falam e escrevem e organizam para defender o teu reinado..., olho para mim e vejo-me tão ignorante e tão pobre, numa palavra, tão pequeno..., que me encheria de confusão e de vergonha se não soubesse que Tu me queres assim. Ó Jesus! Por outro lado, sabes bem como coloquei a teus pés, com a maior das boas vontades, a minha ambição... Fé e Amor: Amar, Crer, Sofrer. Nisto, sim, quero ser rico e sábio, mas não mais sábio nem mais rico do que aquilo que Tu, na tua Misericórdia sem limites, tenhas determinado: porque devo pôr todo o meu prestígio e honra em cumprir fielmente a tua justíssima e amabilíssima Vontade”. - Aconselhei-te a não ficar só nesses bons desejos."}, {"n": 823, "chapter": "Crisol", "text": "O amor a Deus convida-nos a levar a Cruz a pulso..., a sentir sobre os ombros o peso da humanidade inteira, e a cumprir, nas circunstâncias próprias do estado de vida e do trabalho de cada um, os desígnios - claros e amorosos ao mesmo tempo - da Vontade do Pai."}, {"n": 824, "chapter": "Crisol", "text": "O maior louco que já houve e haverá é Ele. É possível maior loucura do que entregar-se como Ele se entrega, e àqueles a quem se entrega? Porque, na verdade, já teria sido loucura ficar como um Menino indefeso; mas, nesse caso, até mesmo muitos malvados se enterneceriam, sem atrever-se a maltratá-Lo. Achou que era pouco: quis aniquilar-se mais e dar-se mais. E fez-se comida, fez-se Pão. - Divino Louco! Como é que te tratam os homens?... E eu mesmo?"}, {"n": 825, "chapter": "Crisol", "text": "Jesus, a tua loucura de amor rouba-me o coração. Estás inerme e pequeno, para engrandecer os que te comem."}, {"n": 826, "chapter": "Crisol", "text": "Tens de conseguir que a tua vida seja essencialmente - totalmente! - eucarística."}, {"n": 827, "chapter": "Crisol", "text": "Gosto de chamar “prisão de amor” ao Sacrário. - Há vinte séculos que Ele está ali..., voluntariamente encerrado!, por mim, e por todos."}, {"n": 828, "chapter": "Crisol", "text": "Pensaste alguma vez como te prepararias para receber o Senhor, se apenas se pudesse comungar uma vez na vida? - Agradeçamos a Deus a facilidade que temos para aproximar-nos dEle, mas... temos de agradecer preparando-nos muito bem para recebê-Lo."}, {"n": 829, "chapter": "Crisol", "text": "Diz ao Senhor que, daqui por diante, de cada vez que celebres ou assistas à Santa Missa, e administres ou recebas o Sacramento Eucarístico, o farás com uma fé grande, com um amor que queime, como se fosse a última vez da tua vida. - E sente dor pelas tuas negligências passadas."}, {"n": 830, "chapter": "Crisol", "text": "Compreendo as tuas ânsias de receber diariamente a Sagrada Eucaristia, porque quem se sente filho de Deus tem imperiosa necessidade de Cristo."}, {"n": 831, "chapter": "Crisol", "text": "Enquanto assistes à Santa Missa, pensa - porque é assim! - que estás participando num Sacrifício divino: sobre o altar, Cristo volta a oferecer-se por ti."}, {"n": 832, "chapter": "Crisol", "text": "Quando O receberes, diz-Lhe: - Senhor, espero em Ti; adoro-te, amo - te, aumenta-me a fé. Sê o apoio da minha debilidade, Tu, que ficaste na Eucaristia, inerme, para remediar a fraqueza das criaturas."}, {"n": 833, "chapter": "Crisol", "text": "Devemos fazer nossas, por assimilação, aquelas palavras de Jesus: “Desiderio desideravi hoc Pascha manducare vobiscum” - desejei ardentemente comer esta Páscoa convosco. De nenhuma outra maneira poderemos manifestar melhor o nosso máximo interesse e amor pelo Santo Sacrifício, do que observando esmeradamente até a menor das cerimônias prescritas pela sabedoria da Igreja. E, além do Amor, deve urgir-nos a “necessidade” de nos parecermos com Jesus Cristo, não apenas interiormente, mas também externamente, movimentando-nos - nos amplos espaços do altar cristão - com aquele ritmo e harmonia da santidade obediente, que se identifica com a vontade da Esposa de Cristo, quer dizer, com a Vontade do próprio Cristo."}, {"n": 834, "chapter": "Crisol", "text": "Temos de receber o Senhor, na Eucaristia, como aos grandes da terra, e melhor! Com adornos, luzes, roupa nova... - E se me perguntas que limpeza, que adornos e que luzes hás de ter, responder-te-ei: limpeza nos teus sentidos, um por um; adorno nas tuas potências, uma por uma; luz em toda a tua alma."}, {"n": 835, "chapter": "Crisol", "text": "Sê alma de Eucaristia! - Se o centro dos teus pensamentos e esperanças estiver no Sacrário, filho, que abundantes os frutos de santidade e de apostolado!"}, {"n": 836, "chapter": "Crisol", "text": "Os objetos empregados no culto divino deverão ser artísticos, tendo em conta que não é o culto para a arte, mas a arte para o culto."}, {"n": 837, "chapter": "Crisol", "text": "Acorre perseverantemente ao Sacrário, de modo físico ou com o coração, para te sentires seguro, para te sentires sereno: mas também para te sentires amado... e para amar!"}, {"n": 838, "chapter": "Crisol", "text": "Copio umas palavras de um sacerdote, dirigidas aos que o seguiam no seu empreendimento apostólico: “Quando contemplardes a Sagrada Hóstia exposta no ostensório sobre o altar, vede que amor, que ternura a de Cristo. Eu o compreendo pelo amor que vos tenho; se pudesse estar longe trabalhando, e ao mesmo tempo junto de cada um de vós, com que gosto o faria! “Cristo, porém, pode! E Ele, que nos ama com um amor infinitamente superior ao que possam albergar todos os corações da terra, ficou para que pudéssemos unir-nos sempre à sua Humanidade Santíssima, e para nos ajudar, para nos consolar, para nos fortalecer, para que sejamos fiéis”."}, {"n": 839, "chapter": "Crisol", "text": "Não penses que é fácil fazer da vida um serviço. É necessário traduzir em realidades tão bom desejo, porque “o reino de Deus não consiste em palavras, mas na virtude”, ensina o Apóstolo; e porque a prática de uma constante ajuda aos outros não é possível sem sacrifício."}, {"n": 840, "chapter": "Crisol", "text": "Deves sentir sempre e em tudo com a Igreja! - Tens de adquirir, por isso, a formação espiritual e doutrinal necessária, que te faça pessoa de reto critério nas tuas opções temporais, pronto e humilde para retificar, quando percebes que te enganaste. - A nobre retificação dos erros pessoais é um modo, muito humano e muito sobrenatural, de exercer a liberdade pessoal."}, {"n": 841, "chapter": "Crisol", "text": "Urge difundir a luz da doutrina de Cristo. Entesoura formação, enche-te de clareza de idéias, de plenitude da mensagem cristã, para poderes depois transmiti-la aos outros. - Não esperes umas iluminações de Deus, que Ele não tem por que dar-te, quando dispões de meios humanos concretos: o estudo, o trabalho."}, {"n": 842, "chapter": "Crisol", "text": "O erro não só obscurece a inteligência, como divide as vontades. - Em contrapartida, “veritas liberabit vos” - a verdade vos livrará das facções que estiolam a caridade."}, {"n": 843, "chapter": "Crisol", "text": "Procuras relacionar-te com esse colega que mal te dá os bons dias..., e isso custa-te. - Persevera e não o julgues; deve ter os “seus motivos”, da mesma maneira que tu alimentas os teus para rezar mais por ele em cada dia."}, {"n": 844, "chapter": "Crisol", "text": "Se tu estás no mundo de quatro, como estranhas que os outros não sejam anjos?"}, {"n": 845, "chapter": "Crisol", "text": "Vigia com amor para viveres a santa pureza..., porque mais depressa se apaga uma fagulha do que um incêndio. Mas toda a diligência humana, com a mortificação, e o cilício, e o jejum - armas necessárias! -, que pouco valem sem Ti, meu Deus!"}, {"n": 846, "chapter": "Crisol", "text": "Lembra-te com constância de que tu colaboras na formação espiritual e humana dos que te rodeiam, e de todas as almas - até aí chega a bendita Comunhão dos Santos -, em qualquer momento: quando trabalhas e quando descansas; quando te vêem alegre ou preocupado; quando na tua tarefa ou no meio da rua fazes a tua oração de filho de Deus, e transcende ao exterior a paz da tua alma; quando se nota que sofreste - que choraste - e sorris."}, {"n": 847, "chapter": "Crisol", "text": "Uma coisa é a santa coação e outra a violência cega ou a vingança."}, {"n": 848, "chapter": "Crisol", "text": "Já o disse o Mestre: oxalá nós, os filhos da luz, ponhamos, em fazer o bem, pelo menos o mesmo empenho e a obstinação com que se dedicam às suas ações os filhos das trevas! - Não te queixes: trabalha antes para afogar o mal em abundância de bem."}, {"n": 849, "chapter": "Crisol", "text": "É uma caridade falsa aquela que prejudica a eficácia sobrenatural do apostolado."}, {"n": 850, "chapter": "Crisol", "text": "Deus necessita de mulheres e homens seguros, firmes, em quem seja possível apoiar-se."}, {"n": 851, "chapter": "Crisol", "text": "Não vivemos para a terra, nem para a nossa honra, mas para a honra de Deus, para a glória de Deus, para o serviço de Deus: isto é o que nos há de mover!"}, {"n": 852, "chapter": "Crisol", "text": "Desde que Jesus Cristo Nosso Senhor fundou a Igreja, esta nossa Mãe tem sofrido contínua perseguição. Talvez em outros tempos as perseguições se fizessem abertamente, e agora se organizam muitas vezes à socapa; mas, hoje como ontem, continua-se combatendo a Igreja. - Que obrigação temos de viver, diariamente, como católicos responsáveis!"}, {"n": 853, "chapter": "Crisol", "text": "Emprega para a tua vida esta receita: “Não me lembro de que existo. Não penso nas minhas coisas, pois não me sobra tempo”. - Trabalho e serviço!"}, {"n": 854, "chapter": "Crisol", "text": "A bondade inigualável da nossa Mãe Santa Maria discorre segundo estas diretrizes: um amor levado até ao extremo, cumprindo com esmero a Vontade divina, e um esquecimento completo de si mesma, feliz de estar onde Deus a quer. - Por isso, nem o menor dos seus gestos é trivial. - Aprende."}, {"n": 855, "chapter": "Seleção", "text": "Comprometido! Como gosto desta palavra! - Nós, os filhos de Deus, obrigamo-nos - livremente - a viver dedicados ao Senhor, com o empenho de que Ele domine, de modo soberano e completo, nas nossas vidas."}, {"n": 856, "chapter": "Seleção", "text": "A santidade - quando é verdadeira - transborda do recipiente, para encher outros corações, outras almas, dessa superabundância. Nós, os filhos de Deus, santificamo-nos santificando. - Propaga-se à tua volta a vida cristã? Pensa nisto diariamente."}, {"n": 857, "chapter": "Seleção", "text": "O Reino de Jesus Cristo. Isso é o que nos cabe! - Portanto, filho - com generosidade! -, não queiras saber de nenhuma das muitas razões que tens para reinar sobre ti. Se O olhas, bastar-te-á contemplar como Ele te ama..., sentirás fomes de corresponder, gritando-Lhe a plenos pulmões que “O amas atualmente”, e compreenderás que, se tu não O deixas, Ele não te deixará."}, {"n": 858, "chapter": "Seleção", "text": "O primeiro passo para aproximares os outros dos caminhos de Cristo é que te vejam contente, feliz, seguro no teu caminhar para Deus."}, {"n": 859, "chapter": "Seleção", "text": "Um varão católico - uma mulher católica - não pode esquecer esta idéia - mestra: imitar Jesus Cristo, em todos os ambientes, sem repelir ninguém."}, {"n": 860, "chapter": "Seleção", "text": "Nosso Senhor Jesus assim o quer: é preciso segui-Lo de perto. Não há outro caminho. Esta é a obra do Espírito Santo em cada alma - na tua -, e deves ser dócil, para não levantar obstáculos ao teu Deus."}, {"n": 861, "chapter": "Seleção", "text": "Sinal evidente de que procuras a santidade é - deixa-me chamá-lo assim! - o “sadio preconceito psicológico” de pensar habitualmente nos outros, esquecendo-te de ti mesmo, para aproximá-los de Deus."}, {"n": 862, "chapter": "Seleção", "text": "Tem de ficar claramente gravado na tua alma que Deus não precisa de ti. - A sua chamada é uma misericórdia amorosíssima do seu Coração."}, {"n": 863, "chapter": "Seleção", "text": "Deves tratar com afeto, com carinho - com caridade cristã! -, aquele que erra, mas sem admitir barganhas no que for contrário à nossa santa Fé."}, {"n": 864, "chapter": "Seleção", "text": "Recorre a Maria, Doce Senhora, Mãe de Deus e Mãe nossa, pedindo-lhe a limpeza de alma e de corpo de todas as pessoas. Diz-lhe que queres invocá-la - e que os outros a invoquem sempre -, e sempre vencer, nas horas ruins - ou boas, e muito boas - da luta contra os inimigos da nossa condição de filhos de Deus."}, {"n": 865, "chapter": "Seleção", "text": "Ele veio à terra porque “omnes homines vult salvos fieri” - para redimir o mundo inteiro. - Enquanto trabalhas lado a lado com tantas pessoas, lembra-te sempre de que não há alma que não interesse a Cristo!"}, {"n": 866, "chapter": "Seleção", "text": "Senhor! - afirmavas-Lhe -, gosto de ser agradecido; quero sê-lo sempre com todos. - Pois olha: não és uma pedra..., nem um carvalho..., nem um mulo. Não pertences a esses seres, que cumprem o seu fim aqui em baixo. E isso porque Deus quis fazer-te homem ou mulher - filho seu -..., e te ama “in caritate perpetua” - com amor eterno. - Gostas de ser agradecido? E vais fazer uma exceção com o Senhor? - Procura que a tua ação de graças, diária, saia impetuosa do teu coração."}, {"n": 867, "chapter": "Seleção", "text": "Compreensão, caridade real. Quando a tiveres conseguido de verdade, terás o coração grande para com todos, sem discriminações, e viverás - também com os que te maltrataram - o conselho de Jesus: “Vinde a mim todos os que andais abatidos..., e Eu vos aliviarei”."}, {"n": 868, "chapter": "Seleção", "text": "Tens de tratar com afeto os que ignoram as coisas de Deus. Mas com mais razão tens de tratar assim os que as conhecem: sem isto, não podes cumprir aquilo."}, {"n": 869, "chapter": "Seleção", "text": "Se de verdade amasses a Deus com todo o teu coração, o amor ao próximo - que às vezes se torna tão difícil para ti - seria uma conseqflência necessária do Grande Amor. - E não te sentirias inimigo de ninguém, nem farias distinção de pessoas."}, {"n": 870, "chapter": "Seleção", "text": "Tens ânsias, loucura divina de que as almas conheçam o Amor de Deus? Pois bem, na tua vida de todos os dias, oferece mortificações, reza, cumpre o dever, vence-te em tantos pequenos detalhes."}, {"n": 871, "chapter": "Seleção", "text": "Fala-Lhe devagar: - Bom Jesus, se tenho de ser apóstolo - apóstolo de apóstolos -, é preciso que me faças muito humilde. Que eu me conheça: que me conheça e que Te conheça. - Assim jamais perderei de vista o meu nada."}, {"n": 872, "chapter": "Seleção", "text": "“Per Iesum Christum Dominum nostrum” - por Jesus Cristo, Senhor Nosso. Assim tens de fazer as coisas: por Jesus Cristo! - É bom que tenhas um coração humano; mas, se fazes as coisas só porque se trata de uma pessoa determinada, mal! - Ainda que o faças também por esse irmão, por esse amigo, faze-o sobretudo por Jesus Cristo!"}, {"n": 873, "chapter": "Seleção", "text": "A Igreja, as almas - de todos os continentes, de todos os tempos atuais e vindouros - esperam muito de ti... Mas - que isto se meta bem na tua cabeça e no teu coração! - serás estéril se não fores santo: corrijo-me, se não lutares por ser santo."}, {"n": 874, "chapter": "Seleção", "text": "Deixa-te modelar pelos golpes - fortes ou delicados - da graça. Esforça-te por não ser obstáculo, mas instrumento. E, se quiseres, a tua Mãe Santíssima te ajudará, e serás canal, em vez de pedra que desvie o curso das águas divinas."}, {"n": 875, "chapter": "Seleção", "text": "Senhor, ajuda-me a ser-te fiel e dócil, “sicut lutum in manu figuli”, como o barro nas mãos do oleiro. - E assim não viverei eu, mas viverás e agirás Tu em mim, Amor."}, {"n": 876, "chapter": "Sel
