eção", "text": "Jesus fará que ganhes um carinho grande por todas as pessoas com quem te relacionas, que em nada toldará aquele que tens por Ele. Ao contrário: quanto mais amares Jesus, mais gente caberá no teu coração."}, {"n": 877, "chapter": "Seleção", "text": "Quanto mais a criatura se aproxima de Deus, mais universal se sente: dilata-se o seu coração, para que caibam todos e tudo, no único grande desejo de pôr o universo aos pés de Jesus."}, {"n": 878, "chapter": "Seleção", "text": "Ao morrer na Cruz, Jesus tinha trinta e três anos. A juventude não pode servir de desculpa! Além disso, a cada dia que passa, vais deixando de ser jovem..., se bem que, com Ele, terás a sua juventude eterna."}, {"n": 879, "chapter": "Seleção", "text": "Tens de rejeitar o nacionalismo, que dificulta a compreensão e a convivência: é uma das barreiras mais perniciosas de muitos momentos históricos. E rejeita-o com mais força - porque seria mais nocivo -, se se pretende levá-lo ao Corpo da Igreja, que é onde mais deve resplandecer a união de tudo e de todos no amor a Jesus Cristo."}, {"n": 880, "chapter": "Seleção", "text": "Tu, filho de Deus, que fizeste até agora para ajudar as almas dos que te rodeiam? - Não podes conformar-te com essa passividade, com essa languidez: Ele quer chegar a outros através do teu exemplo, da tua palavra, da tua amizade, do teu serviço..."}, {"n": 881, "chapter": "Seleção", "text": "Sacrifica-te, entrega-te, e trabalha com as almas uma a uma, como se tratam uma a uma as jóias preciosas. - Mais ainda, hás de pôr maior empenho, porque está em jogo uma coisa de valor incomparável: o objetivo dessa atenção espiritual é preparar para o serviço de Deus bons instrumentos, que custaram a Cristo - cada um! - todo o seu Sangue."}, {"n": 882, "chapter": "Seleção", "text": "Ser cristão - e de modo particular ser sacerdote; lembrando-nos também de que todos os batizados participamos do sacerdócio real - é estar continuamente na Cruz."}, {"n": 883, "chapter": "Seleção", "text": "Se fosses coerente, agora que viste a Sua luz, desejarias ser tão santo, como tão grande pecador foste: e lutarias por tornar realidade essas ânsias."}, {"n": 884, "chapter": "Seleção", "text": "Não é orgulho, mas fortaleza, fazer sentir o peso da autoridade, cortando quanto houver que cortar, quando assim o exigir o cumprimento da Santa Vontade de Deus."}, {"n": 885, "chapter": "Seleção", "text": "Òs vezes, é preciso atar certas mãos, com reverência e com comedimento, sem afrontas nem descortesia. Não por vingança, mas para curar. Não por castigo, mas como remédio."}, {"n": 886, "chapter": "Seleção", "text": "Olhaste-me sério..., mas por fim entendeste-me, quando te comentei: “Quero reproduzir a vida de Cristo nos filhos de Deus, à força de meditá - la, para que atuem como Ele e falem somente dEle”."}, {"n": 887, "chapter": "Seleção", "text": "Jesus ficou na Eucaristia por amor..., por ti. - Ficou, sabendo como é que os homens O receberiam..., e como é que tu O recebes. - Ficou, para que O comas, para que O visites e Lhe contes as tuas coisas e, chegando ao trato íntimo na oração junto do Sacrário e na recepção do Sacramento, te enamores mais de dia para dia, e faças que outras almas - muitas! - sigam o mesmo caminho."}, {"n": 888, "chapter": "Seleção", "text": "Dizes-me que desejas a santa pobreza, o desprendimento das coisas que usas. - Pergunta-te a ti mesmo: - Tenho os afetos de Jesus Cristo, e os seus sentimentos, no que se refere à pobreza e às riquezas? E aconselhei-te: - Além de descansares no teu Pai-Deus, com verdadeiro abandono de filho..., fixa particularmente os teus olhos nessa virtude, para amá-la como Jesus. E assim, em lugar de vê-la como uma cruz, hás de considerá-la como sinal de predileção."}, {"n": 889, "chapter": "Seleção", "text": "Às vezes, com a sua atuação, alguns cristãos não dão ao preceito da caridade o valor máximo que tem. Cristo, rodeado pelos seus, naquele maravilhoso sermão final, dizia a modo de testamento: “Mandatum novum do vobis, ut diligatis invicem” - dou-vos um mandamento novo, que vos ameis uns aos outros. E ainda insistiu: “In hoc cognoscent omnes quia discipuli mei estis” - nisto saberão todos que sois meus discípulos, se tiverdes amor uns aos outros. - Oxalá nos decidamos a viver como Ele quer!"}, {"n": 890, "chapter": "Seleção", "text": "Se vier a faltar a piedade - esse laço que nos ata fortemente a Deus e, por Ele, aos outros, porque nos outros vemos Cristo -, é inevitável que se produza a desunião, com a perda de todo o espírito cristão."}, {"n": 891, "chapter": "Seleção", "text": "Agradece de todo o coração ao Senhor as potências admiráveis... - e terríveis - da inteligência e da vontade, com as quais Ele quis criar-te. Admiráveis, porque te fazem semelhante a Ele; terríveis, porque há homens que as reviram contra o seu Criador. A mim, como síntese do nosso agradecimento de filhos de Deus, ocorre - me dizer, agora e sempre, a este Pai nosso: “Serviam!” - eu Te servirei!"}, {"n": 892, "chapter": "Seleção", "text": "Sem vida interior, sem formação, não há verdadeiro apostolado nem obras fecundas: o trabalho é precário e até fictício. - Que responsabilidade, portanto, a dos filhos de Deus! Havemos de ter fome e sede dEle e da sua doutrina."}, {"n": 893, "chapter": "Seleção", "text": "Diziam àquele bom amigo, para humilhá-lo, que a sua alma era de segunda ou de terceira categoria. Convencido do seu nada, sem se aborrecer, raciocinava assim: - Como cada homem não tem senão uma alma - eu a minha, uma só também -, para cada um a sua alma será... de primeira categoria. Não quero abaixar a pontaria! Portanto, tenho uma alma de “primeiríssima”, e quero, com a ajuda de Deus, purificá-la e branqueá-la e inflamá-la, para que o Amado esteja muito contente. - Não o esqueças: tu também - ainda que te vejas cheio de misérias - não podes “abaixar a pontaria”."}, {"n": 894, "chapter": "Seleção", "text": "Para ti, que te queixas de estar só, de que o ambiente é agressivo: pensa que Cristo Jesus, Bom Semeador, nos aperta a cada um dos seus filhos na sua mão chagada - como ao trigo -; inunda-nos com o seu Sangue, purifica-nos, limpa-nos, embriaga-nos!...; e depois, generosamente, nos lança pelo mundo um a um: que o trigo não se semeia aos sacos, mas grão a grão."}, {"n": 895, "chapter": "Seleção", "text": "Insisto: suplica ao Senhor que conceda aos seus filhos o “dom de línguas”, o dom de se fazerem entender por todos. A razão pela qual desejo este “dom de línguas”, podes deduzi-la das páginas do Evangelho, repletas de parábolas, de exemplos que materializam a doutrina e ilustram as coisas espirituais, sem envilecer nem degradar a palavra de Deus. Para todos - doutos e menos doutos -, é mais fácil considerar e entender a mensagem divina através dessas imagens humanas."}, {"n": 896, "chapter": "Seleção", "text": "Nestes momentos - e sempre! -, quando o Senhor quer que a sua semente se espalhe, numa divina dispersão pelos diversos ambientes, quer também que a extensão não faça perder a intensidade... - E tu tens a missão, clara e sobrenatural, de contribuir para que essa intensidade não se perca."}, {"n": 897, "chapter": "Seleção", "text": "Sim, tens razão: que profundidade, a da tua miséria! Só por ti, onde estarias agora, até onde terias chegado?... “Somente um Amor cheio de misericórdia pode continuar a amar-me”, reconhecias. - Consola-te: Ele não te negará nem o seu Amor nem a sua misericórdia, se O procuras."}, {"n": 898, "chapter": "Seleção", "text": "Tu tens de procurar que haja, no meio do mundo, muitas almas que amem a Deus de todo o coração. É hora de fazer contas: quantas ajudaste tu a descobrir esse Amor?"}, {"n": 899, "chapter": "Seleção", "text": "A presença e o testemunho dos filhos de Deus no mundo é para arrastar, não para se deixarem arrastar; para dar o seu próprio ambiente - o de Cristo -, não para se deixarem dominar por outro ambiente."}, {"n": 900, "chapter": "Seleção", "text": "Tens obrigação de aproximar-te dos que estão à tua volta, de sacudi-los da sua modorra, de rasgar horizontes diferentes e amplos à sua existência aburguesada e egoísta, de lhes complicar santamente a vida, de fazer que se esqueçam de si mesmos e compreendam os problemas dos outros. Senão, não és bom irmão dos teus irmãos, os homens, que estão precisados desse “gaudium cum pace” - desta alegria e desta paz, que talvez não conheçam ou tenham esquecido."}, {"n": 901, "chapter": "Seleção", "text": "Nenhum filho da Igreja Santa pode viver tranqflilo, sem experimentar inquietação perante as massas despersonalizadas: rebanho, manada, vara, escrevi certa vez. Quantas paixões nobres não existem na sua aparente indiferença! Quantas possibilidades! É necessário servir a todos, impor as mãos sobre cada um - “singulis manus imponens”, como fazia Jesus -, para devolvê-los à vida, para iluminar as suas inteligências e robustecer as suas vontades, para que sejam úteis!"}, {"n": 902, "chapter": "Seleção", "text": "Eu também não pensava que Deus me apanharia como o fez. Mas o Senhor - deixa-me que te repita - não nos pede licença para nos “complicar a vida”. Mete-se e... pronto!"}, {"n": 903, "chapter": "Seleção", "text": "Senhor, confiarei somente em Ti. Ajuda-me a ser-te fiel, porque sei que, desta fidelidade em servir-te - deixando nas tuas mãos todas as minhas preocupações e cuidados - posso esperar tudo."}, {"n": 904, "chapter": "Seleção", "text": "Agradeçamos muito e com freqflência esta chamada maravilhosa que recebemos de Deus: que seja uma gratidão real e profunda, estreitamente unida à humildade."}, {"n": 905, "chapter": "Seleção", "text": "O privilégio de nos contarmos entre os filhos de Deus - felicidade suprema - é sempre imerecido."}, {"n": 906, "chapter": "Seleção", "text": "Corta o coração aquele clamor - sempre atual! - do Filho de Deus, que se lamenta porque a messe é muita e os operários são poucos. - Esse grito saiu da boca de Cristo para que também tu o ouças. Como lhe respondeste até agora? Rezas, ao menos diariamente, por essa intenção?"}, {"n": 907, "chapter": "Seleção", "text": "Para seguir o Senhor, é preciso dar-se de uma vez, sem reservas e energicamente: cortar as amarras com decisão, para que não haja possibilidades de retroceder."}, {"n": 908, "chapter": "Seleção", "text": "Não te assustes quando Jesus te pedir mais, mesmo a felicidade das pessoas do teu sangue. Convence-te de que, de um ponto de vista sobrenatural, Ele tem o direito de passar por cima dos teus, para a sua Glória."}, {"n": 909, "chapter": "Seleção", "text": "Afirmas que queres ser apóstolo de Cristo. - Fico muito feliz em ouvir-te. Peço ao Senhor que te conceda perseverança. E lembra-te de que, da nossa boca, do nosso pensamento, do nosso coração, não devem sair senão motivos divinos, fome de almas, assuntos que de um modo ou de outro levem a Deus; ou, pelo menos, que não te afastem dEle."}, {"n": 910, "chapter": "Seleção", "text": "A Igreja precisa - e precisará sempre - de sacerdotes. Pede-os diariamente à Trindade Santíssima, através de Santa Maria. - E pede que sejam alegres, operantes, eficazes; que estejam bem preparados; que se sacrifiquem com gosto pelos seus irmãos, sem sentir-se vítimas."}, {"n": 911, "chapter": "Seleção", "text": "Recorre constantemente à Virgem Santíssima, Mãe de Deus e Mãe da humanidade. E Ela atrairá, com suavidade de Mãe, o amor de Deus às almas com quem tratas, para que se decidam - no seu trabalho ordinário, na sua profissão - a ser testemunhas de Jesus Cristo."}, {"n": 912, "chapter": "Fecundidade", "text": "Tens de corresponder ao amor divino sendo fiel, muito fiel! E, como conseqflência dessa fidelidade, tens de levar a outras pessoas o Amor que recebeste, para que também elas gozem do encontro com Deus."}, {"n": 913, "chapter": "Fecundidade", "text": "Meu Senhor Jesus: faz que eu sinta e secunde de tal modo a tua graça, que esvazie o meu coração..., para que o preenchas Tu, meu Amigo, meu Irmão, meu Rei, meu Deus, meu Amor!"}, {"n": 914, "chapter": "Fecundidade", "text": "Se não mostras - com a tua oração, com o teu sacrifício, com a tua ação - uma constante preocupação de apostolado, isso é sinal evidente de que te falta felicidade e de que tem que aumentar a tua fidelidade. - Aquele que tem a felicidade, o bem, procura dá-lo aos outros."}, {"n": 915, "chapter": "Fecundidade", "text": "Quando calcares de verdade o teu próprio eu e viveres para os outros, serás instrumento apto nas mãos de Deus. Ele chamou - chama - os seus discípulos, e manda-lhes: “Ut eatis!” - ide buscar a todos."}, {"n": 916, "chapter": "Fecundidade", "text": "Decide-te a incendiar o mundo em amores limpos - podes fazê-lo -, a fim de tornar feliz a humanidade inteira, aproximando-a verdadeiramente de Deus."}, {"n": 917, "chapter": "Fecundidade", "text": "“In modico fidelis!” - fiel no pouco... - O teu trabalho, meu filho, não é só salvar almas, mas santificá-las, dia a dia, dando a cada instante - mesmo aos aparentemente vulgares - vibração de eternidade."}, {"n": 918, "chapter": "Fecundidade", "text": "Não se pode separar a semente da doutrina da semente da piedade. A tua tarefa de semeador de doutrina somente poderá evitar os micróbios que a tornem ineficaz, se fores piedoso."}, {"n": 919, "chapter": "Fecundidade", "text": "Assim como a imensa maquinaria de dezenas de fábricas pára, fica sem força, quando a corrente elétrica se interrompe, também o apostolado deixa de ser fecundo sem a oração e a mortificação, que movem o Coração Sacratíssimo de Cristo."}, {"n": 920, "chapter": "Fecundidade", "text": "Se fores fiel aos impulsos da graça, darás bons frutos: frutos duradouros para a glória de Deus. - Ser santo implica ser eficaz, mesmo que o santo não toque nem veja a eficácia."}, {"n": 921, "chapter": "Fecundidade", "text": "A retidão de intenção está em procurar “somente e em tudo” a glória de Deus."}, {"n": 922, "chapter": "Fecundidade", "text": "O apostolado - manifestação evidente da vida espiritual - é um adejar constante que leva a sobrenaturalizar cada detalhe da jornada - grande ou pequeno -, pelo amor a Deus que se põe em tudo."}, {"n": 923, "chapter": "Fecundidade", "text": "Trazia sempre, como marca nos livros que lhe serviam de leitura, uma tira de papel com este lema, escrito em caracteres amplos e enérgicos: “Ure igne Sancti Spiritus!”. Dir-se-ia que, em vez de escrever, gravava: - Queima com o fogo do Espírito Santo! Esculpido na tua alma, e ardendo na tua boca, e ateado nas tuas obras, cristão, quereria eu deixar esse fogo divino."}, {"n": 924, "chapter": "Fecundidade", "text": "Tens de procurar ser uma criança com santa desvergonha, que “sabe” que seu Pai-Deus lhe envia sempre o melhor. Por isso, quando lhe falta até o que parece mais necessário, não se aflige; e, cheia de paz, diz: - Resta-me e tenho o Espírito Santo."}, {"n": 925, "chapter": "Fecundidade", "text": "Cuida da tua oração diária por esta intenção: que todos os católicos sejamos fiéis, que nos decidamos a lutar por ser santos. - É lógico! Que outra coisa havemos de desejar àqueles que amamos, àqueles que estão ligados a nós pelo forte vínculo da fé?"}, {"n": 926, "chapter": "Fecundidade", "text": "Quando me dizem que há pessoas entregues a Deus que já não se aplicam fervorosamente à santidade, penso que isso - se tiver alguma parcela de verdade - conduzirá ao grande fracasso das suas vidas."}, {"n": 927, "chapter": "Fecundidade", "text": "“Qui sunt isti, qui ut nubes volant, et quasi columbae ad fenestras suas?” - Quem são esses que voam como nuvens, como as pombas para os seus ninhos?, pergunta o Profeta. E comenta um autor: “As nuvens têm a sua origem no mar e nos rios, e, depois de uma circulação ou percurso mais ou menos longo, voltam outra vez à sua fonte”. E eu te acrescento: - Assim tens de ser tu: nuvem que fecunde o mundo, fazendo-o viver vida de Cristo... Estas águas divinas banharão - ensopando - as - as entranhas da terra; e, em vez de sujar-se, filtrar-se-ão ao atravessarem tanta impureza, e brotarão fontes limpíssimas, que depois serão arroios e rios imensos para saciar a sede da humanidade. - Depois, retira-te para o teu Refúgio, para o teu Mar imenso, para o teu Deus, sabendo que continuarão amadurecendo mais frutos, com a rega sobrenatural do teu apostolado, com a fecundidade das águas de Deus, que durarão até o fim dos tempos."}, {"n": 928, "chapter": "Fecundidade", "text": "Menino: oferece-Lhe também as penas e as dores dos outros."}, {"n": 929, "chapter": "Fecundidade", "text": "Penas? Contrariedades por causa daquele episódio ou daquele outro?... Não vês que assim o quer teu Pai-Deus..., e Ele é bom..., e Ele te ama - a ti só! - mais do que todas as mães do mundo juntas podem amar os seus filhos?"}, {"n": 930, "chapter": "Fecundidade", "text": "Examina com sinceridade o teu modo de seguir o Mestre. Considera se te entregaste de uma maneira oficial e seca, com uma fé que não tem vibração; se não há humildade, nem sacrifício, nem obras nos teus dias; se não há em ti senão fachada e não estás atento ao detalhe de cada instante..., numa palavra, se te falta Amor. Se é assim, não te pode surpreender a tua ineficácia. Reage imediatamente, levado pela mão de Santa Maria!"}, {"n": 931, "chapter": "Fecundidade", "text": "Quando tiveres alguma necessidade, alguma contradição - pequena ou grande -, invoca o teu Anjo da Guarda, para que a resolva com Jesus ou te preste o serviço de que estejas precisando."}, {"n": 932, "chapter": "Fecundidade", "text": "Deus está metido no centro da tua alma, da minha, e na de todos os homens em graça. E está para alguma coisa: para que tenhamos mais sal, e para que adquiramos muita luz, e para que saibamos distribuir esses dons, cada um a partir do lugar onde está. E como poderemos distribuir esses dons de Deus? Com humildade, com piedade, bem unidos à nossa Mãe a Igreja. - Lembras-te da videira e dos ramos? Que fecundidade a do ramo unido à videira! Que cachos generosos! E que esterilidade a do ramo separado, que seca e perde a vida!"}, {"n": 933, "chapter": "Fecundidade", "text": "Jesus, que o meu pobre coração seja invadido pelo oceano do teu Amor, com ondas tais que limpem e expulsem de mim toda a minha miséria... Derrama as águas puríssimas e ardentes do teu Coração no meu, até que, satisfeita a minha ânsia de amar-te, não podendo represar mais afetos de divino incêndio, se rompa - morrer de Amor! -, e esse teu Amor salte, em cataratas vivificantes e irresistíveis e fecundíssimas, para outros corações que vibrem, ao contacto de tais águas, com vibrações de Fé e de Caridade."}, {"n": 934, "chapter": "Fecundidade", "text": "Tens que viver a Santa Missa! - Ajudar-te-á aquela consideração que fazia de si para si um sacerdote enamorado: - É possível, meu Deus, participar na Santa Missa e não ser santo? - E continuava: - Cumprindo um propósito antigo, ficarei metido em cada dia na Chaga do Lado do meu Senhor! - Anima-te!"}, {"n": 935, "chapter": "Fecundidade", "text": "Quanto bem e quanto mal podes fazer! - Bem, se fores humilde e souberes entregar-te com alegria e com espírito de sacrifício; bem, para ti e para os teus irmãos os homens, para a Igreja, para esta Mãe boa. - E quanto mal, se te deixas guiar pela tua soberba."}, {"n": 936, "chapter": "Fecundidade", "text": "Não te aburgueses, porque - se estás aburguesado - estorvas, convertes-te num peso morto para o apostolado, e sobretudo num motivo de dor para o Coração de Cristo! Não deixes de fazer apostolado, não abandones o teu esforço por trabalhar do melhor modo possível, não descures a tua vida de piedade. - Deus fará o resto."}, {"n": 937, "chapter": "Fecundidade", "text": "De vez em quando, é preciso fazer com as almas como com o fogo da lareira: mete-se um atiçador de ferro e remexe-se, para tirar a escória, que é o que mais brilha e é a causa de que se apague o fogo do amor de Deus."}, {"n": 938, "chapter": "Fecundidade", "text": "Iremos a Jesus, ao Tabernáculo, para conhecê-Lo, para digerir a sua doutrina, para entregar esse alimento às almas."}, {"n": 939, "chapter": "Fecundidade", "text": "Quando tiveres o Senhor no teu peito e saboreares os delírios do seu Amor, promete-Lhe que te esforçarás por mudar o rumo da tua vida em tudo o que for necessário, para levá-Lo à multidão, que não O conhece, que anda vazia de ideais: que, infelizmente, caminha animalizada."}, {"n": 940, "chapter": "Fecundidade", "text": "“Onde há caridade e amor, aí está Deus”, canta o hino litúrgico. E assim pôde anotar aquela alma: “É um tesouro grande e maravilhoso este amor fraternal, que não se detém num simples consolo - necessário muitas vezes -, mas transmite a segurança de ter a Deus perto, e se manifesta pela caridade dos que nos rodeiam e com os que nos rodeiam”."}, {"n": 941, "chapter": "Fecundidade", "text": "Foge do espetáculo! Que seja Deus a conhecer a tua vida, porque a santidade passa despercebida, embora cheia de eficácia."}, {"n": 942, "chapter": "Fecundidade", "text": "Procura prestar a tua ajuda sem que os outros o notem, sem que te louvem, sem que ninguém te veja..., para que, passando oculto, como o sal, condimentes os ambientes em que te desenvolves; e contribuas para conseguir que - pelo teu sentido cristão - tudo seja natural, amável e saboroso."}, {"n": 943, "chapter": "Fecundidade", "text": "Para que este nosso mundo caminhe por um trilho cristão - o único que vale a pena -, temos de viver uma leal amizade com os homens, baseada numa prévia leal amizade com Deus."}, {"n": 944, "chapter": "Fecundidade", "text": "Ouviste-me muitas vezes falar do apostolado “ad fidem”. Não mudei de opinião: que maravilhoso campo de trabalho nos espera em todo o mundo, com aqueles que não conhecem a verdadeira fé e, contudo, são nobres, generosos e alegres!"}, {"n": 945, "chapter": "Fecundidade", "text": "Com freqflência, sinto ímpetos de gritar ao ouvido de tantas e de tantos que, no escritório e nas lojas, no jornal e na tribuna, na escola, na oficina e nas minas e no campo, amparados pela vida interior e pela Comunhão dos Santos, devem ser portadores de Deus em todos os ambientes, segundo aquele ensinamento do Apóstolo: “Glorificai a Deus com a vossa vida e levai-O sempre convosco”."}, {"n": 946, "chapter": "Fecundidade", "text": "Os que temos a verdade de Cristo no coração devemos meter esta verdade no coração, na cabeça e na vida dos outros. O contrário seria comodismo, tática falsa. Pensa de novo: Cristo pediu-te licença para se meter na tua alma? - Deixou-te a liberdade de segui-Lo, mas foi Ele que te procurou, porque quis."}, {"n": 947, "chapter": "Fecundidade", "text": "Com obras de serviço, podemos preparar para o Senhor um triunfo maior que o da sua entrada em Jerusalém... Porque não se repetirão as cenas de Judas, nem a do Horto das Oliveiras, nem aquela noite fechada... Conseguiremos que o mundo arda nas chamas do fogo que Ele veio trazer à terra!... E a luz da Verdade - o nosso Jesus - iluminará as inteligências num dia sem fim."}, {"n": 948, "chapter": "Fecundidade", "text": "Não te assustes! Tu, por seres cristão, tens o direito e o dever de provocar nas almas a crise saudável de que vivam voltadas para Deus."}, {"n": 949, "chapter": "Fecundidade", "text": "Tens de pedir pelo mundo inteiro, pelos homens de todas as raças, e de todas as línguas, e de todas as crenças; pelos homens que têm uma idéia vaga da religião, e pelos que não conhecem a fé. - E esta ânsia de almas, que é prova fiel e clara de que amamos Jesus, fará que Jesus venha."}, {"n": 950, "chapter": "Fecundidade", "text": "Ao ouvirem falar de tarefas de almas em terras longínquas, como lhes brilhavam os olhos! Davam a impressão de estar dispostos a saltar o oceano de um pulo. É que o mundo é muito pequeno, quando o Amor é grande."}, {"n": 951, "chapter": "Fecundidade", "text": "Nenhuma alma - nenhuma! - te pode ser indiferente."}, {"n": 952, "chapter": "Fecundidade", "text": "Um discípulo de Cristo nunca raciocinará assim: “Eu procuro ser bom, e os outros, se quiserem..., que vão para o inferno”. Este comportamento não é humano, nem se coaduna com o amor de Deus, nem com a caridade que devemos ao próximo."}, {"n": 953, "chapter": "Fecundidade", "text": "Quando o cristão compreende e vive a catolicidade, quando percebe a urgência de anunciar a Boa Nova da salvação a todas as criaturas, sabe que - como ensina o Apóstolo - tem de fazer-se “tudo para todos, para salvar a todos”."}, {"n": 954, "chapter": "Fecundidade", "text": "Tens de amar os teus irmãos, os homens, até o extremo de que mesmo os seus defeitos - quando não forem ofensa a Deus - não te pareçam defeitos. Se não amas senão as boas qualidades que vês nos outros - se não sabes compreender, desculpar, perdoar -, és um egoísta."}, {"n": 955, "chapter": "Fecundidade", "text": "Não podes destruir, com a tua negligência ou com o teu mau exemplo, as almas dos teus irmãos, os homens. - Tens - apesar das tuas paixões! - a responsabilidade da vida cristã dos teus próximos, da eficácia espiritual de todos, da sua santidade!"}, {"n": 956, "chapter": "Fecundidade", "text": "Longe fisicamente e, no entanto, muito perto de todos: muito perto de todos!..., repetias feliz. Estavas contente, graças a essa comunhão de caridade de que te falei, que tens de avivar sem cansaço."}, {"n": 957, "chapter": "Fecundidade", "text": "Perguntas-me o que poderias fazer por esse teu amigo, para que não se encontre só. - Dir-te-ei o mesmo de sempre, porque temos à nossa disposição uma arma maravilhosa que resolve tudo: rezar. Primeiro, rezar. E, depois, fazer por ele o que quererias que fizessem por ti em circunstâncias semelhantes. Sem o humilhar, é preciso ajudá-lo de tal maneira que lhe seja fácil o que lhe é dificultoso."}, {"n": 958, "chapter": "Fecundidade", "text": "Coloca-te sempre nas circunstâncias do próximo: assim verás os problemas ou as questões serenamente, não te aborrecerás, compreenderás, desculparás, corrigirás quando e como for necessário, e encherás o mundo de caridade."}, {"n": 959, "chapter": "Fecundidade", "text": "Não se pode ceder naquilo que é de fé. Mas não esqueças que, para dizer a verdade, não é preciso maltratar ninguém."}, {"n": 960, "chapter": "Fecundidade", "text": "Sendo para bem do próximo, não te cales, mas fala de modo amável, sem destemperança nem irritação."}, {"n": 961, "chapter": "Fecundidade", "text": "Não é possível comentar acontecimentos ou doutrinas sem mencionar pessoas..., que não julgas: “Qui iudicat Dominus est” - é Deus quem julga. - Não te preocupes, pois, se alguma vez tropeças com um interlocutor sem reta consciência, que - por má fé ou por falta de critério - qualifica as tuas palavras como murmuração."}, {"n": 962, "chapter": "Fecundidade", "text": "Alguns pobrezinhos sentem-se incomodados pelo bem que fazes, como se o bem deixasse de sê-lo quando não são eles que o fazem ou controlam... - Que essa incompreensão não te sirva de desculpa para afrouxares na tua tarefa. Esforça-te por render com maior empenho, agora: quando na terra te faltam aplausos, mais grata chega ao Céu a tua tarefa."}, {"n": 963, "chapter": "Fecundidade", "text": "Às vezes, cinqflenta por cento da atividade se perde em lutas intestinas, que têm por fundamento a ausência de caridade, e as histórias e as intrigas entre irmãos. Por outro lado, vinte e cinco por cento da atividade se perde em levantar edifícios desnecessários para o apostolado. Não se deve consentir nunca na murmuração e não se deve perder o tempo em edificar tantas casas, e assim as pessoas serão apóstolos cem por cento."}, {"n": 964, "chapter": "Fecundidade", "text": "Tens de pedir a Deus para os sacerdotes - os de agora e os que virão - que amem de verdade, cada dia mais e sem discriminações, os seus irmãos os homens, e que saibam fazer-se querer por eles."}, {"n": 965, "chapter": "Fecundidade", "text": "Pensando nos sacerdotes do mundo inteiro, tens de ajudar-me a rezar pela fecundidade dos seus apostolados. - Sacerdote, meu irmão, fala sempre de Deus, porque, se és dEle, não haverá monotonia nos teus colóquios."}, {"n": 966, "chapter": "Fecundidade", "text": "A pregação, a pregação de Cristo “Crucificado”, é a palavra de Deus. Os sacerdotes devem preparar-se do melhor modo possível, antes de exercerem tão divino ministério, procurando a salvação das almas. Os leigos devem escutar com respeito especialíssimo."}, {"n": 967, "chapter": "Fecundidade", "text": "Causou-me alegria o que diziam daquele sacerdote: “Prega com toda a alma... e com todo o corpo”."}, {"n": 968, "chapter": "Fecundidade", "text": "Deves rezar assim, alma de apóstolo: - Senhor, faz que eu saiba “apertar” as pessoas e incendiá-las todas em fogueiras de Amor, que sejam o motor único das nossas atividades."}, {"n": 969, "chapter": "Fecundidade", "text": "Nós, os católicos, temos de andar pela vida como apóstolos: com luz de Deus, com sal de Deus. Sem medo, com naturalidade, mas com tal vida interior, com tal união com o Senhor, que iluminemos, que evitemos a corrupção e as sombras, que espalhemos o fruto da serenidade e a eficácia da doutrina cristã."}, {"n": 970, "chapter": "Fecundidade", "text": "Saiu o semeador a semear, a lançar aos quatro ventos a semente em todas as encruzilhadas da terra... - Bendito trabalho o nosso!: encarregarmo-nos de que, em todas as circunstâncias de lugares e de épocas, lance raízes, germine e dê fruto a palavra de Deus."}, {"n": 971, "chapter": "Fecundidade", "text": "“Dominus dabit benignitatem suam et terra nostra dabit fructum suum” - o Senhor dará a sua bênção, e a nossa terra produzirá o seu fruto. - Sim, essa bênção é a origem de todo o bom fruto, o clima necessário para que no nosso mundo possamos cultivar santos, homens e mulheres de Deus. “Dominus dabit benignitatem” - o Senhor dará a sua bênção. - Mas, repara bem, a seguir diz que Ele espera o nosso fruto - o teu, o meu -, e não um fruto raquítico, desmedrado, por não termos sabido entregar-nos. Ele espera-o abundante, porque nos cumula de bênçãos."}, {"n": 972, "chapter": "Fecundidade", "text": "Vias a tua vocação como essas cápsulas que encerram a semente. Há de chegar o momento da expansão, e haverá um arraigar múltiplo e simultâneo."}, {"n": 973, "chapter": "Fecundidade", "text": "Dentro da grande multidão humana - interessam-nos todas as almas -, tens de ser fermento, para que, com a ajuda da graça divina e com a tua correspondência, atues em todos os cantos do mundo como o fermento, que dá qualidade, que dá sabor, que dá volume, a fim de que o pão de Cristo possa alimentar depois outras almas."}, {"n": 974, "chapter": "Fecundidade", "text": "Os inimigos de Jesus - e alguns que se dizem seus amigos -, cobertos com a armadura da ciência humana, empunhando a espada do poder, riem-se dos cristãos como o filisteu se ria de Davi, desprezando-o. Também agora cairá por terra o Golias do ódio, da falsia, da prepotência, do laicismo, do indiferentismo...; e nessa altura, ferido o gigantão dessas falsas ideologias pelas armas aparentemente débeis do espírito cristão - oração, expiação, ação -, despojá-lo-emos da armadura das suas errôneas doutrinas, para revestirmos os nossos irmãos, os homens, da verdadeira ciência: a cultura e a prática cristã."}, {"n": 975, "chapter": "Fecundidade", "text": "Nas campanhas contra a Igreja, maquinam muitas organizações - às vezes, de braço dado com os que se chamam bons -, que aliciam o povo com imprensa, folhetos, pasquins, calúnias, propaganda falada. Depois, levam-no para onde querem: para o próprio inferno. Pretendem que a massa seja amorfa, como se as pessoas não tivessem alma..., e despertam compaixão. Mas, como têm alma, é preciso arrancá-las das garras dessas organizações do mal e pô-las a serviço de Deus."}, {"n": 976, "chapter": "Fecundidade", "text": "Uma percentagem muito considerável de pessoas que freqflentam os Sacramentos, lê a má imprensa... Com calma e com amor de Deus, temos que rezar e dar doutrina, para que não leiam esses papeluchos endiabrados que, segundo dizem - porque se envergonham -, são pessoas da família que os compram, ainda que talvez o façam eles próprios."}, {"n": 977, "chapter": "Fecundidade", "text": "Tens que defender a verdade, com caridade e com firmeza, quando se trata das coisas de Deus. Tens de praticar a santa desvergonha de denunciar os erros, que algumas vezes são pequenas insídias; outras, odiosas razões ou descaradas ignorâncias; e, geralmente, manifestação da impotência dos homens, que não podem tolerar a fecundidade da palavra de Deus."}, {"n": 978, "chapter": "Fecundidade", "text": "Em momentos de desorientação geral, quando clamas ao Senhor pedindo pelas almas - que são suas! -, ficas com a impressão de que Ele não te ouve, como se se fizesse surdo aos teus apelos. Chegas a pensar que o teu trabalho apostólico é em vão. - Não te preocupes! Continua a trabalhar com a mesma alegria, com a mesma vibração, com o mesmo ímpeto. - Deixa-me que insista: quando se trabalha por Deus, nada é infecundo!"}, {"n": 979, "chapter": "Fecundidade", "text": "Filho: todos os mares deste mundo são nossos, e onde a pesca é mais difícil, é também mais necessária."}, {"n": 980, "chapter": "Fecundidade", "text": "Com a tua doutrina de cristão, com a tua vida íntegra e com o teu trabalho bem feito, tens que dar bom exemplo, no exercício da tua profissão e no cumprimento dos deveres do teu cargo, aos que te rodeiam: aos teus parentes, amigos, colegas, vizinhos, alunos... - Não podes ser um “marreteiro”."}, {"n": 981, "chapter": "Fecundidade", "text": "Pela tua intimidade com Cristo, tens obrigação de render fruto. - Fruto que sacie a fome das almas, quando se aproximarem de ti no trabalho, na convivência, no ambiente familiar..."}, {"n": 982, "chapter": "Fecundidade", "text": "Com o teu cumprimento do dever, realizado com gosto e generosidade, consegues também abundante graça do Senhor para outras almas."}, {"n": 983, "chapter": "Fecundidade", "text": "Esforça-te por levar o teu sentido cristão ao mundo, para que haja muitos amigos da Cruz."}, {"n": 984, "chapter": "Fecundidade", "text": "Além da sua graça copiosa e eficaz, o Senhor deu-te a cabeça, as mãos, as faculdades intelectuais, para que faças frutificar os teus talentos. Deus quer realizar milagres constantes - ressuscitar mortos, dar ouvido aos surdos, vista aos cegos, possibilidades de andar aos coxos... -, através da tua atuação profissional santificada, convertida em holocausto grato a Deus e útil às almas."}, {"n": 985, "chapter": "Fecundidade", "text": "No dia em que não procurares aproximar os outros de Deus - tu, que deves ser sempre brasa incandescente -, converter-te-ás num carvãozinho desprezível, ou num montãozinho de cinza, que um sopro de vento dispersa. - Tens de levar fogo, tens de ser algo que queime, que arda, que produza fogueiras de amor, de fidelidade, de apostolado."}, {"n": 986, "chapter": "Fecundidade", "text": "Invoca a Santíssima Virgem; não deixes de pedir-lhe que se mostre sempre tua Mãe: “Monstra te esse Matrem!”, e que te alcance, com a graça do seu Filho, luz de boa doutrina na inteligência, e amor e pureza no coração, a fim de que saibas ir para Deus e levar-Lhe muitas almas."}, {"n": 987, "chapter": "Eternidade", "text": "Um filho de Deus não tem medo da vida nem medo da morte, porque o fundamento da sua vida espiritual é o sentido da filiação divina: Deus é meu Pai - pensa - e é o Autor de todo o bem, é toda a Bondade. - Mas será que tu e eu nos comportamos, de verdade, como filhos de Deus?"}, {"n": 988, "chapter": "Eternidade", "text": "Encheu-me de júbilo ver que compreendias o que te disse: - Tu e eu temos de agir e viver e morrer como enamorados, e assim “viveremos” eternamente."}, {"n": 989, "chapter": "Eternidade", "text": "O Senhor vence sempre. - Se fores seu instrumento, também tu vencerás, porque lutarás os combates de Deus."}, {"n": 990, "chapter": "Eternidade", "text": "A santidade consiste precisamente nisto: em lutarmos por ser fiéis durante toda a vida; e em aceitarmos gozosamente a Vontade de Deus, na hora da morte."}, {"n": 991, "chapter": "Eternidade", "text": "Quando receberes o Senhor na Eucaristia, agradece-Lhe com todas as veras da tua alma essa bondade de estar contigo. - Não te detiveste a considerar que passaram séculos e séculos, até que viesse o Messias? Os patriarcas e os profetas pediam, com todo o povo de Israel: - A terra tem sede, Senhor, vem! - Oxalá seja assim a tua espera de amor."}, {"n": 992, "chapter": "Eternidade", "text": "A despeito dos que negam a Deus, também nestes tempos a terra está muito perto do Céu."}, {"n": 993, "chapter": "Eternidade", "text": "Escrevias: ““Simile est regnum caelorum” - o Reino dos Céus é semelhante a um tesouro... Esta passagem do Santo Evangelho caiu na minha alma e lançou raízes. Já a tinha lido muitas vezes, sem captar a sua substância, o seu sabor divino”. Tudo..., tudo tem que ser vendido pelo homem sensato, para conseguir o tesouro, a pérola preciosa da Glória!"}, {"n": 994, "chapter": "Eternidade", "text": "Tens de entrar em colóquio com Santa Maria e confiar-lhe: - Ë Senhora, para viver o ideal que Deus meteu no meu coração, preciso voar... muito alto, muito alto! Não basta que te desprendas, com a ajuda divina, das coisas deste mundo, sabendo que são terra. Mais ainda: mesmo que coloques o universo inteiro num montão debaixo dos teus pés, para estares mais perto do Céu..., isso não basta! Precisas voar, sem te apoiares em nada daqui de baixo, pendente da voz e do sopro do Espírito. - Mas, dizes-me, as minhas asas estão manchadas!: barro de anos, sujo, pegajoso... E insisti contigo: recorre à Virgem. - Senhora - repete-lhe -, mal consigo levantar vôo!, a terra atrai-me como um ímã maldito! - Senhora, Tu podes fazer que a minha alma se lance em vôo definitivo e glorioso, que tem o seu termo no Coração de Deus. - Confia, que Ela te escuta."}, {"n": 995, "chapter": "Eternidade", "text": "Pensa como é grato a Deus Nosso Senhor o incenso que se queima em sua honra; pensa também quão pouco valem as coisas da terra que, mal começam, já acabam... Pelo contrário, um grande Amor te espera no Céu: sem traições, sem enganos: todo o amor, toda a beleza, toda a grandeza, toda a ciência...! E sem enjoar: saciar-te-á sem saciar."}, {"n": 996, "chapter": "Eternidade", "text": "Sentido sobrenatural! Calma! Paz! Deves olhar assim as coisas, as pessoas e os acontecimentos..., com olhos de eternidade. Então, qualquer muro que te feche a passagem - mesmo que, falando humanamente, seja impressionante -, mal levantes os olhos de verdade ao Céu, como é pouca coisa!"}, {"n": 997, "chapter": "Eternidade", "text": "Se estamos perto de Cristo e seguimos os seus passos, temos que amar de todo o coração a pobreza, o desprendimento dos bens terrenos, as privações."}, {"n": 998, "chapter": "Eternidade", "text": "Na vida espiritual, muitas vezes é preciso saber perder, aos olhos da terra, para ganhar no Céu. - Assim ganha-se sempre."}, {"n": 999, "chapter": "Eternidade", "text": "Mentem os homens quando dizem “para sempre” nas coisas temporais. Só é verdade, com uma verdade total, o “para sempre” da eternidade. - E assim hás de viver tu, com uma fé que te faça sentir sabores de mel, doçuras de céu, ao pensares nessa eternidade que, essa sim, é para sempre!"}, {"n": 1000, "chapter": "Eternidade", "text": "Se não houvesse outra vida além desta, a vida seria uma brincadeira cruel: hipocrisia, maldade, egoísmo, traição."}, {"n": 1001, "chapter": "Eternidade", "text": "Continua em frente, com alegria, com esforço, mesmo que valhas tão pouco, nada! - Com Ele, ninguém te deterá no mundo. Pensa, além disso, que tudo é bom para os que amam a Deus: nesta terra, tudo tem conserto, menos a morte: e, para nós, a morte é Vida."}, {"n": 1002, "chapter": "Eternidade", "text": "Para salvares o homem, Senhor, morres na Cruz; e, no entanto, por um só pecado mortal, condenas o homem a uma eternidade infeliz de tormentos... Quanto te ofende o pecado, e quanto não devo odiá-lo!"}, {"n": 1003, "chapter": "Eternidade", "text": "Assegura Santa Teresa que “quem não faz oração não necessita de demônio que o tente; ao passo que quem a faz apenas quinze minutos por dia, necessariamente se salva”..., porque o diálogo com o Senhor - amável, mesmo nos tempos de aspereza ou de secura da alma - nos descobre o autêntico relevo e a justa dimensão da vida. Sê alma de oração."}, {"n": 1004, "chapter": "Eternidade", "text": "“Logo, tu és rei”... - Sim, Cristo é o Rei, que não somente te concede audiência quando o desejas, mas, em delírio de Amor, até abandona - bem me entendes - o magnífico palácio do Céu, ao qual tu ainda não podes chegar, e te espera no Sacrário. - Não te parece absurdo não irmos pressurosos e com mais constância falar com Ele?"}, {"n": 1005, "chapter": "Eternidade", "text": "Estou cada vez mais persuadido disto: a felicidade do Céu é para os que sabem ser felizes na terra."}, {"n": 1006, "chapter": "Eternidade", "text": "Vejo com meridiana clareza a fórmula, o segredo da felicidade terrena e eternal: não somente conformar-se com a Vontade de Deus, mas aderir, identificar-se, querer - numa palavra -, com um ato positivo da nossa vontade, a Vontade divina. - Este é o segredo infalível - insisto - da alegria e da paz."}, {"n": 1007, "chapter": "Eternidade", "text": "Quantas vezes não te verás inundado, ébrio de graça de Deus! Que grande pecado se não correspondes!"}, {"n": 1008, "chapter": "Eternidade", "text": "Na hora da tentação, tens de praticar a virtude da Esperança, dizendo: para descansar e gozar, aguarda-me uma eternidade; agora, cheio de Fé, tenho que ganhar o descanso com o trabalho; e o gozo com a dor... Que será o Amor, no Céu? Melhor ainda, pratica o Amor, reagindo assim: - Quero dar gosto ao meu Deus, ao meu Amado, cumprindo a sua Vontade em tudo..., como se não houvesse prêmio nem castigo: somente para Lhe agradar."}, {"n": 1009, "chapter": "Eternidade", "text": "Quando - umas vezes como um relâmpago; e outras como uma mosca suja e irritante, que se enxota e volta - vier desassossegar-te o pensamento de que te falta retidão de intenção, faz sempre, e imediatamente, atos contrários..., e continua a trabalhar tranqflilo, por Ele e com Ele. - De passagem, diz devagar, mesmo que te pareça que o pronuncias somente com os lábios: - Senhor, para mim nada quero. Tudo para tua glória e por teu Amor."}, {"n": 1010, "chapter": "Eternidade", "text": "Tanto te faz estar aqui ou na China, dizes-me. - Pois então procura estar onde cumpras a Santa Vontade de Deus."}, {"n": 1011, "chapter": "Eternidade", "text": "De ti depende também que muitos não permaneçam nas trevas, e caminhem por sendas que levam até à vida eterna."}, {"n": 1012, "chapter": "Eternidade", "text": "Acostuma-te a recomendar cada uma das pessoas das tuas relações ao seu Anjo da Guarda, para que a ajude a ser boa e fiel, e alegre; para que, quando chegar a hora, possa receber o eterno abraço de Amor de Deus Pai, de Deus Filho, de Deus Espírito Santo e de Santa Maria."}, {"n": 1013, "chapter": "Eternidade", "text": "Tal como o grão de trigo, temos necessidade da morte para ser fecundos. Tu e eu queremos abrir, com a graça de Deus, um sulco profundo e luminoso. Por isso, temos que deixar o pobre homem animal e lançar-nos pelos campos do espírito, dando sentido sobrenatural a todas as tarefas humanas e, ao mesmo tempo, aos homens que nelas trabalham."}, {"n": 1014, "chapter": "Eternidade", "text": "Jesus, que as minhas distrações sejam distrações ao contrário: em vez de me lembrar do mundo quando tratar Contigo, que me lembre de Ti ao tratar das coisas do mundo."}, {"n": 1015, "chapter": "Eternidade", "text": "Assustou-te um pouco ver tanta luz..., tanta que achas difícil olhar, e mesmo ver. - Fecha os olhos à tua evidente miséria; abre o olhar da tua alma à fé, à esperança, ao amor, e continua em frente, deixando-te guiar por Ele, através de quem dirige a tua alma."}, {"n": 1016, "chapter": "Eternidade", "text": "Sê generoso! Não peças a Jesus... nem um consolo! - Por quê?, perguntaste-me. Porque - respondi-te - bem sabes que, embora pareça que este nosso Deus está longe, está assentado no centro da tua alma, dando relevo divino à tua vida inteira!"}, {"n": 1017, "chapter": "Eternidade", "text": "Contava-te que até pessoas que não receberam o batismo me têm dito, comovidas: “É verdade, eu compreendo que as almas santas têm de ser felizes, porque encaram os acontecimentos com uma visão que está por cima das coisas da terra, porque vêem as coisas com olhos de eternidade”. Oxalá não te falte esta visão! - acrescentei depois -, para que sejas conseqflente com o tratamento de predileção que recebeste da Trindade."}, {"n": 1018, "chapter": "Eternidade", "text": "Eu te garanto que, se nós, os filhos de Deus, quisermos, contribuiremos poderosamente para iluminar o trabalho e a vida dos homens, com o resplendor divino - eterno! - que o Senhor quis depositar em nossas almas. - Mas “quem diz que mora em Jesus deve seguir o caminho que Ele seguiu”, como ensina São João: caminho que conduz sempre à glória, passando - sempre também - pelo sacrifício."}, {"n": 1019, "chapter": "Eternidade", "text": "Que desencanto para os que viram a luz do pseudo-apóstolo, e quiseram sair das suas trevas aproximando-se dessa claridade! Correram para chegar. Talvez tenham deixado pelo caminho retalhos da sua pele... Alguns, na sua ânsia de luz, abandonaram também retalhos da sua alma... Já estão junto do pseudo-apóstolo: frio e escuridão. Frio e escuridão que acabarão por tomar conta dos corações partidos daqueles que, por uns instantes, acreditaram no ideal. Má obra fez o pseudo-apóstolo: esses homens decepcionados, que vieram trocar a carne de suas entranhas por uma brasa ardente, por um maravilhoso rubi de caridade, descem de novo à terra donde vieram..., descem com o coração apagado, com um coração que não é coração..., é um pedaço de gelo envolto em trevas que chegarão a enevoar-lhes o cérebro. Falso apóstolo dos paradoxos, essa é a tua obra: porque tens Cristo na tua língua, e não nas tuas obras; porque atrais com uma luz que não possuis; porque não tens calor de caridade, e finges preocupar-te com os estranhos, ao mesmo tempo que abandonas os teus; porque és mentiroso e a mentira é filha do diabo... Por isso trabalhas para o demônio, desconcertas os seguidores do Amo e, ainda que triunfes com freqflência aqui em baixo, ai de ti, no próximo dia, quando vier a nossa amiga a Morte e contemplares a ira do Juiz a quem nunca enganaste! - Paradoxos, não, Senhor; paradoxos, nunca."}, {"n": 1020, "chapter": "Eternidade", "text": "Este é o caminho seguro: pela humilhação até à Cruz; da Cruz, com Cristo, à Glória imortal do Pai."}, {"n": 1021, "chapter": "Eternidade", "text": "Como me deixou feliz a epístola daquele dia! O Espírito Santo, por São Paulo, nos ensina o segredo da imortalidade e da Glória. Todos sentimos ânsias de perdurar. Quereríamos eternizar os instantes da nossa vida que julgamos felizes. Quereríamos glorificar a nossa memória... Quereríamos a imortalidade para os nossos ideais. Por isso, nos momentos de aparente felicidade, ao termos alguma coisa que consola o nosso desamparo, todos, naturalmente, dizemos e desejamos: para sempre, para sempre... Que sabedoria a do demônio! Como conhecia bem o coração humano! Sereis como deuses, disse aos nossos primeiros pais. Aquilo foi um logro cruel. São Paulo, nessa epístola aos Filipenses, ensina um segredo divino para termos a imortalidade e a Glória: Jesus aniquilou-se, tomando forma de servo... Humilhou-se a si mesmo, fazendo-se obediente até à morte, e morte de Cruz. Por isso Deus o exaltou e lhe deu um nome que está acima de todo o nome: para que, ao nome de Jesus, todos se ajoelhem, nos Céus e na terra e nos infernos..."}, {"n": 1022, "chapter": "Eternidade", "text": "Para acompanharmos Cristo na sua Glória, no triunfo final, é necessário que participemos antes do seu holocausto, e que nos identifiquemos com Ele, morto no Calvário."}, {"n": 1023, "chapter": "Eternidade", "text": "Não te distraias, não deixes a imaginação à solta: vive dentro de ti e estarás mais perto de Deus."}, {"n": 1024, "chapter": "Eternidade", "text": "Ajuda-me a repetir ao ouvido daquele, e do outro..., e de todos: um homem com fé que for pecador, ainda que consiga todas as bem - aventuranças da terra, é necessariamente infeliz e desgraçado. É verdade que o motivo que nos há de levar a odiar o pecado - mesmo o venial - e que deve mover a todos, é sobrenatural: que Deus o detesta com toda a sua infinitude, com ódio sumo, eterno e necessário, como mal oposto ao infinito bem... Mas a primeira consideração que te apontei acima pode conduzir-nos a esta última."}, {"n": 1025, "chapter": "Eternidade", "text": "Terás tanto de santidade quanto tiveres de mortificação por Amor."}, {"n": 1026, "chapter": "Eternidade", "text": "Tinha-se desencadeado a perseguição violenta. E aquele sacerdote rezava: - Jesus, que cada incêndio sacrílego aumente o meu incêndio de Amor e de Reparação."}, {"n": 1027, "chapter": "Eternidade", "text": "Ao considerares a formosura, a grandeza e a eficácia da tarefa apostólica, asseguras que chega a doer-te a cabeça, pensando no caminho que falta ainda percorrer - quantas almas esperam! -; e te sentes felicíssimo, oferecendo-te a Jesus como escravo seu. Tens ânsias de Cruz e de dor e de Amor e de almas. Sem querer, num movimento instintivo - que é Amor -, estendes os braços e abres as palmas, para que Ele te crave na sua Cruz bendita; para seres seu escravo - “serviam!” -, que é reinar."}, {"n": 1028, "chapter": "Eternidade", "text": "Comoveu-me a súplica inflamada que saiu dos teus lábios: “Meu Deus, só desejo ser agradável aos teus olhos; tudo o mais não me importa. - Mãe Imaculada, faz que só me mova o Amor”."}, {"n": 1029, "chapter": "Eternidade", "text": "Pede de todo o coração a morte - e mil mortes - antes que ofender o teu Deus. E isto, não por causa das penas do pecado - que tanto merecemos -, mas porque Jesus foi e é tão bom contigo."}, {"n": 1030, "chapter": "Eternidade", "text": "Meu Deus, quando te amarei a Ti, por Ti? Se bem que, bem vistas as coisas, Senhor, desejar o prêmio imperecível é o mesmo que desejar-te a Ti, que Te dás como recompensa."}, {"n": 1031, "chapter": "Eternidade", "text": "Provai e vede como o Senhor é bom, reza o Salmista. - A conquista espiritual, porque é Amor, tem de ser - nas coisas grandes e nas pequenas - ânsia de Infinito, de eternidade."}, {"n": 1032, "chapter": "Eternidade", "text": "Jesus, não quero pensar no que será o “amanhã”, porque não quero pôr limites à tua generosidade."}, {"n": 1033, "chapter": "Eternidade", "text": "Faz teus os pensamentos daquele amigo que escrevia: “Estive considerando as bondades de Deus para comigo e, cheio de júbilo interior, teria gritado pela rua, para que toda a gente ficasse sabendo do meu agradecimento filial: Pai, Pai! E, se não gritei, andei chamando-Lhe assim baixinho: - Pai! -, muitas vezes, na certeza de que Lhe agradava. “Não procuro outra coisa: só quero o seu agrado e a sua Glória: tudo para Ele. Se quero a salvação, a minha santificação, é porque sei que Ele a quer. Se na minha vida de cristão tenho ânsias de almas, é porque sei que Ele tem essas ânsias. Digo-o de verdade: nunca porei os olhos no prêmio. Não desejo recompensa: tudo por Amor!”."}, {"n": 1034, "chapter": "Eternidade", "text": "Como amava a Vontade de Deus aquela doente que atendi espiritualmente! Via na doença, longa, penosa e múltipla (não tinha nada sadio), a bênção e as predileções de Jesus; e, embora afirmasse na sua humildade que merecia castigo, a terrível dor que sentia em todo o seu organismo não era um castigo, era uma misericórdia. - Falamos da morte. E do Céu. E do que havia de dizer a Jesus e a Nossa Senhora... E de como ali “trabalharia” mais do que aqui... Queria morrer quando Deus quisesse..., mas - exclamava, cheia de felicidade -, que bom se fosse hoje mesmo! Contemplava a morte com a alegria de quem sabe que, ao morrer, vai ter com seu Pai."}, {"n": 1035, "chapter": "Eternidade", "text": "Não temas a morte. É tua amiga! - Procura acostumar-te a essa realidade, assomando com freqflência à tua sepultura. E ali, olha, cheira e apalpa o teu cadáver apodrecido, defunto há oito dias. - Lembra-te disto, especialmente, quando te perturbar o ímpeto da tua carne."}, {"n": 1036, "chapter": "Eternidade", "text": "Abrindo-me a sua alma, dizia: “Pensava nestes dias na morte, como num descanso, apesar dos meus crimes. E considerava: se me comunicassem: Chegou a hora de morrer, com que gosto retrucaria: Chegou a hora de Viver”."}, {"n": 1037, "chapter": "Eternidade", "text": "Morrer é uma coisa boa. Como pode ser que haja quem tenha fé e, ao mesmo tempo, medo da morte?... Mas, enquanto o Senhor te quiser manter na terra, morrer, para ti, é uma covardia. Viver, viver e padecer e trabalhar por Amor: isto é o que te toca."}, {"n": 1038, "chapter": "Eternidade", "text": "Ao menos uma vez por dia, situa-te com o pensamento no transe da morte, para veres a essa luz os acontecimentos de cada dia. Asseguro-te que terás uma boa experiência da paz que produz essa consideração."}, {"n": 1039, "chapter": "Eternidade", "text": "Ficaste muito sério ao escutar-me: - Aceito a morte quando Ele quiser, como Ele quiser e onde Ele quiser; e ao mesmo tempo penso que é “um comodismo” morrer cedo, porque temos que desejar trabalhar muitos anos para Ele e, por Ele, a serviço dos outros."}, {"n": 1040, "chapter": "Eternidade", "text": "Morrer?... Que comodismo!, repito. - Diz como aquele santo bispo, ancião e doente: “Non recuso laborem”: Senhor, enquanto puder ser-te útil, não me recuso a viver e a trabalhar por Ti."}, {"n": 1041, "chapter": "Eternidade", "text": "Não queiras fazer nada para ganhar méritos, nem por medo das penas do purgatório. Empenha-te, desde agora e para sempre, em fazer tudo, até as coisas mais pequenas, para dar gosto a Jesus."}, {"n": 1042, "chapter": "Eternidade", "text": "Deves desejar ardentemente que, quando a nossa boa e inevitável irmã a morte vier prestar-te o serviço de te levar à presença de Deus, não te encontres atado a coisa alguma da terra!"}, {"n": 1043, "chapter": "Eternidade", "text": "Se anelas por ter vida, e vida e felicidade eternas, não podes sair da barca da Santa Madre Igreja. - Olha: se tu te afastas do âmbito da barca, irás para o meio das ondas do mar, irás para a morte, afogado no oceano; deixas de estar com Cristo, perdes a sua amizade, que escolheste voluntariamente quando percebeste que Ele a oferecia a ti."}, {"n": 1044, "chapter": "Eternidade", "text": "Jesus veio à terra para padecer..., e para evitar os padecimentos - também os terrenos - dos outros."}, {"n": 1045, "chapter": "Eternidade", "text": "Não há ânimo mais senhoril do que saber-se em serviço: em serviço voluntário a todas as almas! - É assim que se ganham as grandes honras: as da terra e as do Céu."}, {"n": 1046, "chapter": "Eternidade", "text": "Perante a dor e a perseguição, dizia uma alma dotada de sentido sobrenatural: “Prefiro apanhar aqui a apanhar no purgatório!”"}, {"n": 1047, "chapter": "Eternidade", "text": "Se eu amo, para mim não haverá inferno."}, {"n": 1048, "chapter": "Eternidade", "text": "Como é bom viver de Deus! Como é bom não querer senão a sua Glória!"}, {"n": 1049, "chapter": "Eternidade", "text": "Se queres de verdade alcançar vida e honra eternas, aprende a prescindir em muitos casos das tuas nobres ambições pessoais."}, {"n": 1050, "chapter": "Eternidade", "text": "Não coloques o teu “eu” na tua saúde, no teu nome, na tua carreira, na tua ocupação, em cada passo que dás... Que coisa tão aborrecida! Pareces ter esquecido que “tu” não tens nada, que tudo é dEle. Quando ao longo do dia te sentires - talvez sem razão - humilhado; quando julgares que o teu critério deveria prevalecer; quando notares que em cada instante borbulha o teu “eu”, o teu, o teu, o teu..., convence-te de que estás matando o tempo, e de que estás precisando que “matem” o teu egoísmo."}, {"n": 1051, "chapter": "Eternidade", "text": "Aconselho-te a não procurar o louvor próprio, nem mesmo aquele que merecerias: é melhor passarmos ocultos, e que o mais belo e nobre da nossa atividade, da nossa vida, fique escondido... Como é grande este fazer-se pequeno! “Deo omnis gloria!” - toda a glória, para Deus."}, {"n": 1052, "chapter": "Eternidade", "text": "Em momentos de desconsolo, dizia ao Senhor aquela alma: “Meu Jesus, que podia dar-te, além da honra, se não tinha outra coisa? Se tivesse tido fortuna, eu a teria entregue a Ti. Se tivesse tido virtudes, teria edificado com cada uma delas, para servir-te. Só tinha a honra, e a dei a Ti. Louvado sejas! Bem se vê que estava segura nas tuas mãos!”"}, {"n": 1053, "chapter": "Eternidade", "text": "O barro foi o meu princípio e a terra é a herança de toda a minha linhagem. Quem, senão Deus, merece louvor?"}, {"n": 1054, "chapter": "Eternidade", "text": "Quando sentires o orgulho que ferve dentro de ti - a soberba! -, que te faz considerar-te um super-homem, chegou o momento de exclamares: - Não! E assim saborearás a alegria do bom filho de Deus, que passa pela terra com erros, mas fazendo o bem."}, {"n": 1055, "chapter": "Eternidade", "text": "“Sancta Maria, Stella maris” - Santa Maria, Estrela do mar, conduz-nos Tu! Clama assim com energia, porque não há tempestade que possa fazer naufragar o Coração Dulcíssimo da Virgem. Quando vires chegar a tempestade, se te abrigares nesse Refúgio firme que é Maria, não haverá perigo algum de que venhas a soçobrar ou a afundar-te. Josemaria Escrivá nasceu em Barbastro (Huesca, Espanha), em 9 de janeiro de 1902. Seus pais chamavam-se José e Dolores. Teve cinco irmãos: Carmen (1899-1957), Santiago (1919-1994) e outras três irmãs menores do que ele, que faleceram ainda pequenas. O casal Escrivá deu aos seus filhos uma profunda educação cristã. Em 1915, a indústria de tecidos do pai abre falência, e ele tem de mudar-se para Logronho, onde encontrou outro emprego. Nessa cidade, Josemaria dá-se conta pela primeira vez da sua vocação: depois de ver umas pegadas na neve dos pés descalços de um religioso, intui que Deus deseja alguma coisa dele, embora não saiba exatamente o quê. Pensa que poderá descobri-lo mais facilmente se se fizer sacerdote, e começa a preparar - se, primeiro em Logronho e, mais tarde, no seminário de Saragoça. Seguindo um conselho de seu pai, cursa na Universidade de Saragoça a Faculdade de Direito, como aluno livre. Seu pai morre em 1924, e ele fica como chefe de família. Recebe a ordenação sacerdotal em 28 de março de 1925 e começa a exercer o ministério numa paróquia rural e depois em Saragoça. Em 1927, transfere-se para Madrid, com permissão do seu bispo, a fim de doutorar-se em Direito. Ali, no dia 2 de outubro de 1928, Deus faz-lhe ver a missão que lhe vinha inspirando havia anos, e funda o Opus Dei. A partir desse momento, passa a trabalhar com todas as suas forças no desenvolvimento da fundação que Deus lhe pede, ao mesmo tempo que continua a exercer o ministério pastoral que lhe fora encomendado naqueles anos, e que o punha diariamente em contato com a doença e a pobreza dos hospitais e bairros populares de Madrid. Quando eclode a guerra civil, em 1936, encontra-se em Madrid. A perseguição religiosa obriga-o a refugiar-se em diferentes lugares. Exerce o seu ministério sacerdotal clandestinamente, até que consegue sair de Madrid. Depois de atravessar os Pireneus até o sul da França, instala-se em Burgos. Quando termina a guerra, em 1939, volta a Madrid. Nos anos seguintes, dirige numerosos retiros espirituais para leigos, sacerdotes e religiosos. Nesse mesmo ano de 1939, conclui os estudos de doutorado em Direito. Em 1946, fixa a sua residência em Roma. Obtém o Doutorado em Teologia pela Universidade Lateranense. É nomeado consultor de duas Congregações vaticanas, membro honorário da Pontifícia Academia de Teologia e Prelado de honra de Sua Santidade. Acompanha com atenção os preparativos e as sessões do Concílio Vaticano II (1962-1965) e mantém um relacionamento intenso com muitos padres conciliares. De Roma, faz numerosas viagens a diversos países europeus para impulsionar o estabelecimento e a consolidação do Opus Dei nesses lugares. Com o mesmo objetivo, realiza entre 1970 e 1975 longas viagens até o México, a Península Ibérica, a América do Sul e Guatemala, e nelas também tem reuniões de catequese com grupos numerosos de homens e mulheres. Falece em Roma no dia 26 de junho de 1975. Vários milhares de pessoas, entre elas muitos bispos de diversos países - quase um terço do episcopado mundial -, solicitam à Santa Sé a abertura da sua causa de canonização. No dia 17 de maio de 1992, João Paulo II beatifica Josemaria Escrivá. Proclama-o santo dez anos depois, em 6 de outubro de 2002, na Praça de São Pedro, em Roma, diante de uma grande multidão. a;IKXMQHR EV VXEV SIKEHEVb, disse o Papa nessa ocasião na sua homilia, « HMJXQHEP QE VRGMIHEHI! VIP HMVWMQlkR HI UElE! GOEVVI! GXOWXUE RX MHEHI! E GRQVGMmQGME HI TXI WRHRV IVWEPRV GLEPEHRV j VEQWMHEHIb Fonte: Opusdei.org.br"}]}]};</script>
