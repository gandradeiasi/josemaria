332, "chapter": "Estudo", "text": "Àquele que puder ser sábio, não lhe perdoamos que não o seja."}, {"n": 333, "chapter": "Estudo", "text": "Estudo. - Obediência: “Non multa, sed multum”"}, {"n": 334, "chapter": "Estudo", "text": "Oras, mortificas-te, trabalhas em mil coisas de apostolado..., mas não estudas. - Não serves, então, se não mudas. O estudo, a formação profissional, seja qual for, é obrigação grave entre nós."}, {"n": 335, "chapter": "Estudo", "text": "Para um apóstolo moderno, uma hora de estudo é uma hora de oração."}, {"n": 336, "chapter": "Estudo", "text": "Se tens de servir a Deus com a tua inteligência, para ti estudar é uma obrigação grave."}, {"n": 337, "chapter": "Estudo", "text": "Freqflentas os Sacramentos, fazes oração, és casto... e não estudas... - Não me digas que és bom; és apenas bonzinho."}, {"n": 338, "chapter": "Estudo", "text": "Dantes, como os conhecimentos humanos - a ciência - eram muito limitados, parecia bem possível que um só homem sábio pudesse fazer a defesa e a apologia da nossa santa Fé. Hoje, com a extensão e a intensidade da ciência moderna, é preciso que os apologistas dividam entre si o trabalho, para defenderem cientificamente a Igreja em todos os campos. - Tu... não podes furtar-te a esta obrigação."}, {"n": 339, "chapter": "Estudo", "text": "Livros. Não os compres sem te aconselhares com pessoas cristãs, doutas e prudentes. - Poderias comprar uma coisa inútil ou prejudicial. Quantas vezes julgam levar debaixo do braço um livro... e levam um montão de lixo!"}, {"n": 340, "chapter": "Estudo", "text": "Estuda. - Estuda com empenho. - Se tens de ser sal e luz, necessitas de ciência, de idoneidade. Ou julgas que, por seres preguiçoso e comodista, hás de receber ciência infusa?"}, {"n": 341, "chapter": "Estudo", "text": "Está certo que ponhas esse empenho no estudo, sempre que ponhas o mesmo empenho em adquirir a vida interior."}, {"n": 342, "chapter": "Estudo", "text": "Não esqueças que antes de ensinar é preciso fazer. - “Coepit facere et docere”, diz de Jesus Cristo a Sagrada Escritura: começou a fazer e a ensinar. - Primeiro, fazer. Para que tu e eu aprendamos."}, {"n": 343, "chapter": "Estudo", "text": "Trabalha. - Quando tiveres a preocupação de um trabalho profissional, melhorará a vida da tua alma. E serás mais varonil, porque abandonarás esse “espírito de mexerico” que te consome."}, {"n": 344, "chapter": "Estudo", "text": "Educador: o inegável empenho que pões em conhecer e praticar o melhor método para que os teus alunos adquiram a ciência terrena, põe-no também em conhecer e praticar a ascética cristã, que é o único método para que eles e tu sejais melhores."}, {"n": 345, "chapter": "Estudo", "text": "Cultura, cultura! - Está certo. Que ninguém nos vença em ambicioná-la e possuí-la. - Mas a cultura é meio, e não fim."}, {"n": 346, "chapter": "Estudo", "text": "Estudante: forma-te numa piedade sólida e ativa, sobressai no estudo, sente anelos firmes de apostolado profissional. - E eu te prometo, ante o vigor da tua formação religiosa e científica, próximas e amplas conquistas."}, {"n": 347, "chapter": "Estudo", "text": "Só te preocupas de edificar a tua cultura. E é preciso edificar a tua alma. - Assim trabalharás como deves, por Cristo. Para que Ele reine no mundo, é necessário que haja gente que, com o olhar posto no Céu, se dedique prestigiosamente a todas as atividades humanas e, dentro delas, realize silenciosamente - e eficazmente - um apostolado de caráter profissional."}, {"n": 348, "chapter": "Estudo", "text": "A tua incúria, o teu desleixo, a tua indolência são covardia e comodismo - assim te argúi continuamente a consciência -, mas “não são caminho”."}, {"n": 349, "chapter": "Estudo", "text": "Fica tranqflilo se exprimiste uma opinião ortodoxa, ainda que a malícia de quem te escutou o leve a escandalizar-se. - Porque o seu escândalo é farisaico."}, {"n": 350, "chapter": "Estudo", "text": "Não é suficiente que sejas sábio, além de bom cristão. - Se não corriges as maneiras bruscas do teu caráter, se tornas incompatível o teu zelo e a tua ciência com a boa educação, não compreendo como possas vir a ser santo. - E mesmo que realmente sejas sábio, devias estar amarrado a uma manjedoura, como um mulo."}, {"n": 351, "chapter": "Estudo", "text": "Com esse ar de auto-suficiência, tornas-te aborrecido e antipático, cais no ridículo e, o que é pior, tiras eficácia ao teu trabalho de apóstolo. Não esqueças que até os “medíocres” podem pecar por demasiado sábios."}, {"n": 352, "chapter": "Estudo", "text": "A tua própria inexperiência te leva a essa presunção, a essa vaidade, a isso que tu julgas que te dá um ar de importância. - Corrige-te, por favor. Néscio e tudo, podes chegar a ocupar cargos de direção (mais de um caso se tem visto), e, se não te persuades da tua falta de dotes, te negarás a escutar os que têm dom de conselho. - E dá medo pensar no mal que fará o teu desgoverno."}, {"n": 353, "chapter": "Estudo", "text": "Aconfessionalismo. - Neutralidade. - Velhos mitos que tentam sempre remoçar. Tens-te dado ao trabalho de meditar no absurdo que é deixar de ser católico ao entrar na Universidade, ou na Associação profissional, ou na sábia Academia, ou no Parlamento, como quem deixa o chapéu à porta?"}, {"n": 354, "chapter": "Estudo", "text": "Aproveita o tempo. - Não te esqueças da figueira amaldiçoada. Já fazia alguma coisa: dar folhas. Como tu... - Não me digas que tens desculpas. - De nada valeu à figueira - narra o Evangelista - não ser tempo de figos, quando o Senhor lá os foi buscar. - E estéril ficou para sempre."}, {"n": 355, "chapter": "Estudo", "text": "Os que andam em negócios humanos dizem que o tempo é ouro. - Parece - me pouco; para nós, que andamos em negócios de almas, o tempo é Glória!"}, {"n": 356, "chapter": "Estudo", "text": "Não compreendo que te digas cristão e tenhas essa vida de preguiçoso inútil. - Será que esqueces a vida de trabalho de Cristo?"}, {"n": 357, "chapter": "Estudo", "text": "Todos os pecados - disseste-me - parece que estão à espera do primeiro momento de ócio. O próprio ócio já deve ser um pecado! - Quem se entrega a trabalhar por Cristo não há de ter um momento livre, porque o descanso não é não fazer nada; é distrair-se em atividades que exigem menos esforço."}, {"n": 358, "chapter": "Estudo", "text": "Estar ocioso é coisa que não se compreende num homem com alma de apóstolo."}, {"n": 359, "chapter": "Estudo", "text": "Põe um motivo sobrenatural na tua atividade profissional de cada dia, e terás santificado o trabalho."}, {"n": 360, "chapter": "Formação", "text": "Como te rias, nobremente, quando te aconselhei a pôr teus anos moços sob a proteção de São Rafael!: para que ele te leve a um matrimônio santo, como ao jovem Tobias, com uma moça que seja boa e bonita e rica - disse - te, brincando. E depois, que pensativo ficaste quando continuei a aconselhar-te que te pusesses também sob o patrocínio daquele Apóstolo adolescente, João, para o caso de o Senhor te pedir mais."}, {"n": 361, "chapter": "Formação", "text": "Para ti, que te queixas interiormente porque te tratam com dureza, e sentes o contraste desse rigor com a conduta da tua família, copio estes parágrafos da carta de um tenente médico: “Diante do enfermo, é possível a atitude fria e calculadora, mas objetiva e útil para o paciente, do profissional honesto. E também a pieguice lamurienta da família. - Que seria de um posto de socorros durante um combate, quando vai chegando a vaga de feridos, que se amontoam porque a evacuação não é suficientemente rápida, se junto de cada maca houvesse uma família? Era caso para passar-se ao inimigo”."}, {"n": 362, "chapter": "Formação", "text": "Não preciso de milagres; bastam-me os que há na Escritura. - Pelo contrário, faz-me falta o teu cumprimento do dever, a tua correspondência à graça."}, {"n": 363, "chapter": "Formação", "text": "Desiludido. - Vens de asa caída. Os homens acabam de te dar uma lição! - Julgavam que não precisavas deles, e se desfaziam em oferecimentos. A possibilidade de terem que ajudar-te economicamente - uma quantia miserável - converteu a amizade em indiferença. - Confia só em Deus e naqueles que, por Ele, estão unidos a ti."}, {"n": 364, "chapter": "Formação", "text": "Ah! Se te propusesses servir a Deus “seriamente”, com o mesmo empenho que pões em servir a tua ambição, as tuas vaidades, a tua sensualidade!..."}, {"n": 365, "chapter": "Formação", "text": "Se sentes impulsos de ser líder, a tua aspiração deve ser esta: com os teus irmãos, o último; com os outros, o primeiro."}, {"n": 366, "chapter": "Formação", "text": "Mas olha aqui: de que injúria te queixas só porque este ou aquele tem mais confiança com determinadas pessoas, que conheceu antes ou por quem sente mais afinidades de simpatia, de profissão, de caráter? - No entanto, entre os teus, evita cuidadosamente até a aparência de uma amizade particular."}, {"n": 367, "chapter": "Formação", "text": "O manjar mais delicado e seleto, se o comer um porco (que assim se chama, sem perdão da palavra), converte-se, quando muito, em carne de porco! Sejamos anjos, para dignificar as idéias ao assimilá-las. - Pelo menos, sejamos homens, para converter os alimentos, no mínimo, em músculos nobres e belos, ou talvez em cérebro potente..., capaz de entender e adorar a Deus. - Mas... não sejamos animais, como tantos e tantos!"}, {"n": 368, "chapter": "Formação", "text": "Estás entediado? - É que tens os sentidos despertos e a alma adormecida."}, {"n": 369, "chapter": "Formação", "text": "A caridade de Jesus Cristo há de levar-te a muitas concessões... nobilíssimas. - E a caridade de Jesus Cristo há de levar-te a muitas intransigências..., nobilíssimas também."}, {"n": 370, "chapter": "Formação", "text": "Se não és mau e o pareces, és bobo. - E essa bobice - pedra de escândalo - é pior do que a maldade."}, {"n": 371, "chapter": "Formação", "text": "Quando fervilham, liderando manifestações exteriores de religiosidade, pessoas profissionalmente mal conceituadas, com certeza sentis vontade de lhes dizer ao ouvido: - Por favor, tenham a bondade de ser menos católicos!"}, {"n": 372, "chapter": "Formação", "text": "Se ocupas um posto oficial, tens também uns direitos, que nascem do exercício desse cargo, e uns deveres. - Desvias-te do teu caminho de apóstolo se, por ocasião - ou com o pretexto - de uma obra de apostolado, deixas de cumprir os deveres do cargo. Porque perderás o prestígio profissional, que é precisamente o teu “anzol de pescador de homens”."}, {"n": 373, "chapter": "Formação", "text": "Gosto do teu lema de apóstolo: “Trabalhar sem descanso”."}, {"n": 374, "chapter": "Formação", "text": "Por que essa precipitação? - Não me digas que é atividade; é estouvamento."}, {"n": 375, "chapter": "Formação", "text": "Dissipação. - Deixas que os teus sentidos e potências bebam em qualquer charco. - E depois andas desse jeito: sem firmeza, dispersa a atenção, adormecida a vontade e desperta a concupiscência. - Torna a sujeitar-te com seriedade a um plano que te faça ter vida de cristão, ou nunca farás nada de proveito."}, {"n": 376, "chapter": "Formação", "text": "“Influi tanto o ambiente!”, disseste-me. E tive que responder: - Sem dúvida. Por isso é mister que seja tal a vossa formação, que saibais levar convosco, com naturalidade, o vosso próprio ambiente, para dar o “vosso tom” à sociedade em que viveis. - E então, se apreendeste esse espírito, tenho a certeza de que me dirás com o pasmo dos primeiros discípulos, ao contemplarem as primícias dos milagres que se operavam por suas mãos em nome de Cristo: “Influímos tanto no ambiente!”"}, {"n": 377, "chapter": "Formação", "text": "E como adquirirei a “nossa formação”, e como conservarei o “nosso espírito”? - Cumprindo as normas concretas que o teu Diretor te entregou e te explicou e te fez amar; cumpre-as, e serás apóstolo."}, {"n": 378, "chapter": "Formação", "text": "Não sejas pessimista. - Não sabes que tudo quanto sucede ou pode suceder é para bem? - Teu otimismo será conseqflência necessária da tua fé."}, {"n": 379, "chapter": "Formação", "text": "Naturalidade. - Que a vossa vida de cavalheiros cristãos, de mulheres cristãs - o vosso sal e a vossa luz -, flua espontaneamente, sem esquisitices nem pieguices; levai sempre convosco o nosso espírito de simplicidade."}, {"n": 380, "chapter": "Formação", "text": "“E num ambiente paganizado ou pagão, quando esse ambiente chocar com a minha vida, não parecerá postiça a minha naturalidade?”, perguntas-me. E te respondo: - Chocará, sem dúvida, a tua vida com a deles. E esse contraste, porque confirma com as tuas obras a tua fé, é precisamente a naturalidade que eu te peço."}, {"n": 381, "chapter": "Formação", "text": "Não te importes se dizem que tens “espírito de grupo”. - Que querem? Um instrumento deliqflescente que se desfaça em pedaços à hora de empunhá-lo?"}, {"n": 382, "chapter": "Formação", "text": "Ao oferecer-te aquela História de Jesus, pus como dedicatória: “Que procures Cristo. Que encontres Cristo. Que ames a Cristo”. - São três etapas claríssimas. Tentaste, pelo menos, viver a primeira?"}, {"n": 383, "chapter": "Formação", "text": "Se te vêem fraquejar... e és autoridade, não é de estranhar que se quebrante a obediência."}, {"n": 384, "chapter": "Formação", "text": "Confusionismo. Soube que estava vacilando a retidão do teu critério. E, para que me entendesses, escrevi-te: - O diabo tem a cara muito feia e, como é esperto, não se expõe a que lhe vejamos os cornos. Não vem de frente. - Por isso, quantas vezes aparece com disfarces de nobreza e até de espiritualidade!"}, {"n": 385, "chapter": "Formação", "text": "Diz o Senhor: “Um mandamento novo vos dou: que vos ameis uns aos outros... Nisto se conhecerá que sois meus discípulos”. - E São Paulo: “Carregai os fardos uns dos outros, e assim cumprireis a lei de Cristo”. - Eu não te digo nada."}, {"n": 386, "chapter": "Formação", "text": "Não esqueças, meu filho, que para ti, na terra, só há um mal que deves temer e, com a graça divina, evitar: o pecado."}, {"n": 387, "chapter": "O plano da tua santidade", "text": "O plano de santidade que o Senhor nos pede é determinado por estes três pontos: - A santa intransigência, a santa coação e a santa desvergonha."}, {"n": 388, "chapter": "O plano da tua santidade", "text": "Uma coisa é a santa desvergonha, e outra o despudor “laico”."}, {"n": 389, "chapter": "O plano da tua santidade", "text": "A santa desvergonha é uma característica da “vida de infância”. A uma criança, nada a preocupa. - As suas misérias, as suas naturais misérias, põem-se em evidência com simplicidade, mesmo que todo o mundo a contemple... Essa desvergonha, aplicada à vida sobrenatural, traz consigo este raciocínio: louvor... menosprezo; admiração... escárnio; honra... desonra; saúde... doença; riqueza... pobreza; formosura... fealdade... E tudo isso... que importa?"}, {"n": 390, "chapter": "O plano da tua santidade", "text": "Ri-te do ridículo. - Despreza o que dirão. Vê e sente a Deus em ti mesmo e no que te rodeia. - Assim acabarás conseguindo a santa desvergonha de que precisas - ó paradoxo! - para viver com delicadeza de cavalheiro cristão."}, {"n": 391, "chapter": "O plano da tua santidade", "text": "Se tens a santa desvergonha, que te importa “o que terão dito” ou “o que dirão”?"}, {"n": 392, "chapter": "O plano da tua santidade", "text": "Convence-te de que o ridículo não existe para quem faz o melhor."}, {"n": 393, "chapter": "O plano da tua santidade", "text": "Um homem, um... cavalheiro transigente, tornaria a condenar Jesus à morte."}, {"n": 394, "chapter": "O plano da tua santidade", "text": "A transigência é sinal certo de não se possuir a verdade. - Quando um homem transige em coisas de ideal, de honra ou de Fé, esse homem é um homem... sem ideal, sem honra e sem Fé."}, {"n": 395, "chapter": "O plano da tua santidade", "text": "Aquele homem de Deus, curtido na luta, argumentava assim: - Não transijo? Mas é claro! Porque estou persuadido da verdade do meu ideal. Pelo contrário, você é muito transigente... Parece-lhe que dois e dois sejam três e meio? - Não?... Nem por amizade cede em tão pouca coisa? - É que pela primeira vez se persuadiu de ter a verdade... e passou-se para o meu partido!"}, {"n": 396, "chapter": "O plano da tua santidade", "text": "A santa intransigência não é destempero."}, {"n": 397, "chapter": "O plano da tua santidade", "text": "Sê intransigente na doutrina e na conduta. - Mas suave na forma. - Maça poderosa de aço, almofadada. - Sê intransigente, mas não sejas cabeçudo."}, {"n": 398, "chapter": "O plano da tua santidade", "text": "A intransigência não é intransigência sem mais nada: é “a santa intransigência”. Não nos esqueçamos de que também há uma “santa coação”."}, {"n": 399, "chapter": "O plano da tua santidade", "text": "Se, para salvar uma vida terrena, com o aplauso de todos, empregamos a força para evitar que um homem se suicide..., não havemos de poder empregar a mesma coação - a santa coação - para salvar a Vida (com maiúscula) de muitos que se obstinam em suicidar idiotamente a sua alma?"}, {"n": 400, "chapter": "O plano da tua santidade", "text": "Quantos crimes se cometem em nome da justiça! - Se tu vendesses armas de fogo, e alguém te pagasse o preço de uma delas para matar com essa arma a tua mãe, tu a venderias?... Mas será que não te dava o seu justo preço?... - Professor, jornalista, político, diplomata: meditai."}, {"n": 401, "chapter": "O plano da tua santidade", "text": "Deus e audácia! - Audácia não é imprudência. - Audácia não é temeridade."}, {"n": 402, "chapter": "O plano da tua santidade", "text": "Não peças perdão a Jesus apenas de tuas culpas; não O ames com teu coração somente... Desagrava-O por todas as ofensas que Lhe têm feito, que Lhe fazem e Lhe hão de fazer...; ama-O com toda a força de todos os corações de todos os homens que mais O tenham amado. Sê audaz: diz-Lhe que estás mais louco por Ele que Maria Madalena, mais que Teresa e Teresinha..., mais apaixonado que Agostinho e Domingos e Francisco, mais que Inácio e Xavier."}, {"n": 403, "chapter": "O plano da tua santidade", "text": "Ganha mais audácia ainda e, quando precisares de alguma coisa, aceitando sempre de antemão o “fiat”"}, {"n": 404, "chapter": "O plano da tua santidade", "text": "Fracassaste! - Nós nunca fracassamos. - Puseste por completo a tua confiança em Deus. Não omitiste, depois, nenhum meio humano. Convence-te desta verdade: o teu êxito - agora e nisto - era fracassar. - Dá graças ao Senhor e... torna a começar!"}, {"n": 405, "chapter": "O plano da tua santidade", "text": "Fracassaste? - Tu (estás bem convencido) não podes fracassar. Não fracassaste; adquiriste experiência. - Para a frente!"}, {"n": 406, "chapter": "O plano da tua santidade", "text": "Aquilo, sim, foi um fracasso, um desastre: porque perdeste o nosso espírito. - Já sabes que, com sentido sobrenatural, o final (vitória?, derrota? Ora!...) só tem um nome: êxito."}, {"n": 407, "chapter": "O plano da tua santidade", "text": "Não confundamos os direitos do cargo com os da pessoa. - Àqueles não se pode renunciar."}, {"n": 408, "chapter": "O plano da tua santidade", "text": "Santarrão está para santo como beato para piedoso: é a sua caricatura."}, {"n": 409, "chapter": "O plano da tua santidade", "text": "Não pensemos que há de valer alguma coisa a nossa aparente virtude de santos, se não estiver unida às comuns virtudes de cristãos. - Seria o mesmo que adornar-se com esplêndidas jóias sobre roupa de baixo."}, {"n": 410, "chapter": "O plano da tua santidade", "text": "Que a tua virtude não seja uma virtude sonora."}, {"n": 411, "chapter": "O plano da tua santidade", "text": "Muitos falsos apóstolos, apesar deles, fazem bem à massa, ao povo, pela própria virtude da doutrina de Jesus que pregam, ainda que não a pratiquem. Mas, com este bem, não se compensa o mal enorme e efetivo que produzem, matando almas de líderes, de apóstolos, que se afastam, enojadas, daqueles que não fazem o que ensinam aos outros. Por isso, se não querem ter uma vida íntegra, nunca devem pôr-se na primeira fila, como chefes de grupo - nem eles, nem elas."}, {"n": 412, "chapter": "O plano da tua santidade", "text": "Que o fogo do teu Amor não seja um fogo-fátuo - ilusão, mentira de fogo, que nem ateia em labaredas o que toca nem dá calor."}, {"n": 413, "chapter": "O plano da tua santidade", "text": "O “non serviam” de Satanás tem sido demasiado fecundo. - Não sentes o impulso generoso de dizer cada dia, com vontade de oração e de obras, um “serviam” - eu Te servirei, eu Te serei fiel! - que vença em fecundidade aquele clamor de rebeldia?"}, {"n": 414, "chapter": "O plano da tua santidade", "text": "Que pena um “homem de Deus” pervertido! - Mas mais pena ainda um “homem de Deus” tíbio e mundano!"}, {"n": 415, "chapter": "O plano da tua santidade", "text": "Não dês muita importância ao que o mundo chama vitórias ou derrotas. - Sai tantas vezes derrotado o vencedor!"}, {"n": 416, "chapter": "O plano da tua santidade", "text": "“Sine me nihil potestis facere!”"}, {"n": 417, "chapter": "Amor de Deus", "text": "Não há outro amor além do Amor!"}, {"n": 418, "chapter": "Amor de Deus", "text": "O segredo para dar relevo às coisas mais humildes, mesmo às mais humilhantes, é amar."}, {"n": 419, "chapter": "Amor de Deus", "text": "Criança. - Doente. - Ao escrever estas palavras, não sentis a tentação de as pôr com maiúsculas? É que, para uma alma enamorada, as crianças e os doentes são Ele."}, {"n": 420, "chapter": "Amor de Deus", "text": "Que pouco é uma vida para oferecê-la a Deus!..."}, {"n": 421, "chapter": "Amor de Deus", "text": "Um amigo é um tesouro. - Quanto mais... um Amigo!..., que onde está o teu tesouro, aí está o teu coração."}, {"n": 422, "chapter": "Amor de Deus", "text": "Jesus é teu amigo. - O Amigo. - Com coração de carne como o teu. - Com olhos de olhar amabilíssimo, que choraram por Lázaro... - E, tanto como a Lázaro, te ama a ti."}, {"n": 423, "chapter": "Amor de Deus", "text": "Meu Deus, eu Te amo, mas... ensina-me a amar!"}, {"n": 424, "chapter": "Amor de Deus", "text": "Castigar por Amor: este é o segredo para elevar a um plano sobrenatural a pena imposta aos que a merecem. Por amor a Deus, a quem se ofende, sirva a pena de expiação; por amor ao próximo por Deus, jamais sirva a pena de vingança, mas de remédio salutar."}, {"n": 425, "chapter": "Amor de Deus", "text": "Saber que me amas tanto, meu Deus, e... não enlouqueci?!"}, {"n": 426, "chapter": "Amor de Deus", "text": "Em Cristo temos todos os ideais: porque é Rei, é Amor, é Deus."}, {"n": 427, "chapter": "Amor de Deus", "text": "Senhor: que eu tenha peso e medida em tudo... menos no Amor."}, {"n": 428, "chapter": "Amor de Deus", "text": "Se o amor, mesmo o amor humano, dá tantas consolações aqui, o que será o Amor no Céu?"}, {"n": 429, "chapter": "Amor de Deus", "text": "Tudo o que se faz por Amor adquire formosura e se engrandece."}, {"n": 430, "chapter": "Amor de Deus", "text": "Jesus, que eu seja o último em tudo... e o primeiro no Amor."}, {"n": 431, "chapter": "Amor de Deus", "text": "Não temas a Justiça de Deus. - Tão admirável e tão amável é em Deus a Justiça como a Misericórdia; ambas são provas do Amor."}, {"n": 432, "chapter": "Amor de Deus", "text": "Considera o que há de mais formoso e grande na terra..., o que apraz ao entendimento e às outras potências..., o que é recreio da carne e dos sentidos... E o mundo, e os outros mundos que brilham na noite: o Universo inteiro. E isso, mais todas as loucuras do coração satisfeitas..., nada vale, é nada e menos que nada, ao lado deste Deus meu! - teu! -, tesouro infinito, pérola preciosíssima, humilhado, feito escravo, aniquilado sob a forma de servo no curral onde quis nascer, na oficina de José, na Paixão e na morte ignominiosa..., e na loucura de Amor da Sagrada Eucaristia."}, {"n": 433, "chapter": "Amor de Deus", "text": "Vive de Amor e vencerás sempre - ainda que sejas vencido - nas Navas e Lepantos"}, {"n": 434, "chapter": "Amor de Deus", "text": "Deixa que o teu coração transborde em efusões de Amor e de agradecimento ao considerar como a graça de Deus te liberta todos os dias dos laços que te arma o inimigo."}, {"n": 435, "chapter": "Amor de Deus", "text": "“Timor Domini sanctus”. - Santo é o temor de Deus. - Temor que é veneração do filho por seu Pai; nunca temor servil, porque teu Pai-Deus não é um tirano."}, {"n": 436, "chapter": "Amor de Deus", "text": "Dor de Amor. - Porque Ele é bom. - Porque é teu Amigo, que deu a sua Vida por ti. - Porque tudo o que tens de bom é dEle. - Porque O tens ofendido tanto... Porque te tem perdoado... Ele!... a ti! - Chora, meu filho, de dor de Amor."}, {"n": 437, "chapter": "Amor de Deus", "text": "Se um homem tivesse morrido para me livrar da morte!... - Morreu Deus. E fico indiferente."}, {"n": 438, "chapter": "Amor de Deus", "text": "Louco! - Bem te vi (julgavas-te só na capela episcopal) depor um beijo em cada cálice e em cada patena recém-consagrados: para que Ele os encontre, quando pela primeira vez “descer” a esses vasos eucarísticos."}, {"n": 439, "chapter": "Amor de Deus", "text": "Não esqueças que a Dor é a pedra de toque do Amor."}, {"n": 440, "chapter": "Caridade", "text": "Quando tiveres terminado o teu trabalho, faz o do teu irmão, ajudando-o, por Cristo, com tal delicadeza e naturalidade, que nem mesmo o favorecido repare que estás fazendo mais do que em justiça deves. - Isso, sim, é fina virtude de filho de Deus!"}, {"n": 441, "chapter": "Caridade", "text": "Doem-te as faltas de caridade do próximo para contigo. Quanto não hão de doer a Deus as tuas faltas de caridade - de Amor - para com Ele?"}, {"n": 442, "chapter": "Caridade", "text": "Não admitas um mau pensamento acerca de ninguém, mesmo que as palavras ou obras do interessado dêem motivo para assim julgares razoavelmente."}, {"n": 443, "chapter": "Caridade", "text": "Não faças crítica negativa; quando não puderes louvar, cala-te."}, {"n": 444, "chapter": "Caridade", "text": "Nunca fales mal do teu irmão, mesmo que tenhas motivos de sobra. - Vai primeiro ao Sacrário, e depois procura o Sacerdote, teu pai, e desabafa também com ele a tua pena. - E com mais ninguém."}, {"n": 445, "chapter": "Caridade", "text": "A murmuração é crosta que suja e atrapalha o apostolado. - Vai contra a caridade, tira forças, rouba a paz e faz perder a união com Deus."}, {"n": 446, "chapter": "Caridade", "text": "Se és tão miserável, como estranhas que os outros tenham misérias?"}, {"n": 447, "chapter": "Caridade", "text": "Depois de ver em que se empregam, por completo!, muitas vidas (língua, língua, língua, com todas as suas conseqflências), parece-me mais necessário e mais amável o silêncio. - E compreendo muito bem que peças contas, Senhor, da palavra ociosa."}, {"n": 448, "chapter": "Caridade", "text": "É mais fácil dizer que fazer. - Tu..., que tens essa língua cortante - de navalha -, experimentaste alguma vez, ao menos por acaso, fazer “bem” o que, segundo a tua “autorizada” opinião, os outros fazem menos bem?"}, {"n": 449, "chapter": "Caridade", "text": "Isso chama-se: bisbilhotice, murmuração, mexerico, enredo, intriga, alcovitice, insídia..., calúnia?... vileza? - É difícil que a “função de dar critério” de quem não tem o dever de exercitá-la, não acabe em “negócio de comadres”."}, {"n": 450, "chapter": "Caridade", "text": "Quanto dói a Deus e quanto mal faz a muitas almas - e quanto pode santificar outras - a injustiça dos “justos”!"}, {"n": 451, "chapter": "Caridade", "text": "Não queiramos julgar. - Cada qual vê as coisas do seu ponto de vista... e com o seu entendimento, bem limitado quase sempre, e com os olhos obscurecidos ou enevoados, com trevas de exaltação muitas vezes. Além disso, tal como a desses pintores modernistas, a visão de certas pessoas é tão subjetiva e tão enfermiça, que desenham uns traços arbitrários, assegurando-nos que são o nosso retrato, a nossa conduta... Como valem pouco os juízos dos homens! - Não julgueis sem peneirar o vosso juízo na oração."}, {"n": 452, "chapter": "Caridade", "text": "Esforça-te, se é preciso, por perdoar sempre aos que te ofendem, desde o primeiro instante, já que, por maior que seja o prejuízo ou a ofensa que te façam, mais te tem perdoado Deus a ti."}, {"n": 453, "chapter": "Caridade", "text": "Murmuras? - Então, estás perdendo o bom espírito. E, se não aprendes a calar-te, cada palavra é um passo que te aproxima da porta de saída desse empreendimento apostólico em que trabalhas."}, {"n": 454, "chapter": "Caridade", "text": "Não julgueis sem ouvir ambas as partes. - Mesmo as pessoas que se têm por piedosas esquecem muito facilmente esta norma de prudência elementar."}, {"n": 455, "chapter": "Caridade", "text": "Sabes o mal que podes ocasionar jogando para longe uma pedra com os olhos vendados? - Também não sabes o prejuízo que podes causar, às vezes grave, quando lanças frases de murmuração, que te parecem levíssimas por teres os olhos vendados pela inconsciência ou pela exaltação."}, {"n": 456, "chapter": "Caridade", "text": "Fazer crítica, destruir, não é difícil: o último aprendiz de pedreiro sabe cravar a sua ferramenta na pedra nobre e bela de uma catedral. - Construir: esse é o trabalho que requer mestres."}, {"n": 457, "chapter": "Caridade", "text": "Quem és tu para julgar do acerto do superior? - Não vês que ele tem mais elementos de juízo do que tu; mais experiência; mais retos, sábios e desapaixonados conselheiros; e, sobretudo, mais graça, uma graça especial, a graça de estado, que é luz e ajuda poderosa de Deus?"}, {"n": 458, "chapter": "Caridade", "text": "Esses choques com o egoísmo do mundo hão de fazer-te apreciar mais a caridade fraternal dos teus."}, {"n": 459, "chapter": "Caridade", "text": "A tua caridade é... presunçosa. - De longe, atrais: tens luz. - De perto, repeles: falta-te calor. - Que pena!"}, {"n": 460, "chapter": "Caridade", "text": "“Frater qui adjuvatur a fratre quasi civitas firma” - O irmão ajudado por seu irmão é tão forte quanto uma cidade amuralhada. - Pensa um pouco e decide-te a viver a fraternidade que sempre te recomendo."}, {"n": 461, "chapter": "Caridade", "text": "Se não te vejo praticar a bendita fraternidade que continuamente te prego, lembrar-te-ei aquelas comoventes palavras de São João: “Filioli mei, non diligamus verbo neque lingua, sed opere et veritate” - Filhinhos, não amemos com a palavra ou com a língua, mas com obras e de verdade."}, {"n": 462, "chapter": "Caridade", "text": "O poder da caridade! - A vossa mútua fraqueza é também apoio que vos mantém erguidos no cumprimento do dever, se viveis a vossa bendita fraternidade: como mutuamente se sustêm, apoiando-se, as cartas do baralho."}, {"n": 463, "chapter": "Caridade", "text": "Mais do que em “dar”, a caridade está em “compreender”. - Por isso, procura uma desculpa para o teu próximo - sempre as há -, se tens o dever de julgar."}, {"n": 464, "chapter": "Caridade", "text": "Sabes que certa pessoa está em perigo para a sua alma? - De longe, com a tua vida de união, podes ser para ela uma ajuda eficaz. - Então vamos lá! E não te intranqflilizes."}, {"n": 465, "chapter": "Caridade", "text": "Essa preocupação que sentes pelos teus irmãos parece-me bem; é prova da vossa mútua caridade. - Procura, no entanto, que as tuas preocupações não degenerem em inquietação."}, {"n": 466, "chapter": "Caridade", "text": "Escreves-me: - “Regra geral, os homens são pouco generosos com o seu dinheiro. Conversas, entusiasmos ruidosos, promessas, planos. À hora do sacrifício, são poucos os que “metem ombros”. E, se dão, há de ser com uma diversão de permeio - baile, bingo, cinema, coquetel - ou com anúncio e lista de donativos na imprensa”. - O quadro é triste, mas tem exceções. Sê tu também dos que não deixam que a mão esquerda saiba o que faz a direita, quando dão esmola."}, {"n": 467, "chapter": "Caridade", "text": "Livros. - Estendi a mão, como um pobrezinho de Cristo, e pedi livros. Livros!, que são alimento para a inteligência católica, apostólica e romana de muitos jovens universitários. - Estendi a mão, como um pobrezinho de Cristo..., e sofri cada decepção! - Por que será que não entendem, Jesus, a profunda caridade cristã dessa esmola, mais eficaz do que dar pão de bom trigo?"}, {"n": 468, "chapter": "Caridade", "text": "És excessivamente cândido. - Dizes que são poucos os que praticam a caridade! - Porque ter caridade não é dar roupa velha ou uns trocados... - E me contas o teu caso e a tua desilusão. - Só me ocorre isto: vamos tu e eu dar e dar-nos sem tacanhice. E evitaremos que os que convivem conosco adquiram a tua triste experiência."}, {"n": 469, "chapter": "Caridade", "text": "“Saudai todos os santos. Todos os santos vos saúdam. A todos os santos que vivem em Éfeso. A todos os santos em Cristo Jesus que estão em Filipos”. - Que comovente esse apelativo - santos! - que os primeiros fiéis cristãos empregavam para se designarem entre si, não é verdade? - Aprende a tratar com os teus irmãos."}, {"n": 470, "chapter": "Os meios", "text": "Mas... e os meios? - São os mesmos de Pedro e Paulo, de Domingos e Francisco, de Inácio e Xavier: o Crucifixo e o Evangelho... - Será que te parecem pequenos?"}, {"n": 471, "chapter": "Os meios", "text": "Nos empreendimentos de apostolado, está certo - é um dever - que consideres os teus meios terrenos (2 + 2 = 4). Mas não esqueças - nunca! - que tens de contar, felizmente, com outra parcela: Deus + 2 + 2..."}, {"n": 472, "chapter": "Os meios", "text": "Serve ao teu Deus com retidão, sê-Lhe fiel... e não te preocupes com mais nada. Porque é uma grande verdade que, “se procuras o reino de Deus e a sua justiça, Ele te dará o resto - o material, os meios - por acréscimo”."}, {"n": 473, "chapter": "Os meios", "text": "Lança para longe de ti essa desesperança que te produz o conhecimento da tua miséria. - É verdade: por teu prestígio econômico, és um zero..., por teu prestígio social, outro zero..., e outro por tuas virtudes, e outro por teu talento... Mas, à esquerda dessas negações está Cristo... E que cifra incomensurável não resulta!"}, {"n": 474, "chapter": "Os meios", "text": "Dizes que és... ninguém. - Que os outros levantaram e levantam agora maravilhas de organização, de imprensa, de propaganda. - Que têm todos os meios, enquanto tu não tens nenhum!... Está certo; mas lembra-te de Inácio: Ignorante, entre os doutores de Alcalá"}, {"n": 475, "chapter": "Os meios", "text": "Reconheces-te miserável. E és. - Apesar de tudo - mais ainda, por isso -, Deus te procurou. - Sempre emprega instrumentos desproporcionados: para que se veja que a “obra” é dEle. - A ti, só te pede docilidade."}, {"n": 476, "chapter": "Os meios", "text": "Quando te “entregares” a Deus, não haverá dificuldade que possa abalar o teu otimismo."}, {"n": 477, "chapter": "Os meios", "text": "Por que deixas esses recantos em teu coração? - Enquanto não te deres tu de todo, é inútil que pretendas levar outro a Deus. - Pobre instrumento és."}, {"n": 478, "chapter": "Os meios", "text": "Mas - nesta altura! - será possível que ainda necessites da aprovação, do calor, das consolações dos poderosos, para continuares a fazer o que Deus quer? - Os poderosos costumam ser volúveis, e tu tens de ser constante. - Mostra - te agradecido, se te ajudam. E continua em frente, imperturbável, se te desprezam."}, {"n": 479, "chapter": "Os meios", "text": "Não faças caso. - Sempre os “prudentes” têm chamado de loucuras as obras de Deus. - Para a frente! Audácia!"}, {"n": 480, "chapter": "Os meios", "text": "Estás vendo? Um fio e outro e muitos, bem entrançados, formam esse cabo, capaz de levantar pesos enormes. - Tu e os teus irmãos, unidas as vossas vontades para cumprir a de Deus, sereis capazes de vencer todos os obstáculos."}, {"n": 481, "chapter": "Os meios", "text": "Quando só se procura a Deus, bem se pode pôr em prática, para fazer vingar as obras de apostolado, aquele princípio que sustentava um bom amigo nosso: “Gasta-se o que se deve, ainda que se deva o que se gasta”."}, {"n": 482, "chapter": "Os meios", "text": "Que importa que tenhas contra ti o mundo inteiro, com todos os seus poderes? Tu... para a frente! - Repete as palavras do salmo: “O Senhor é a minha luz e a minha salvação, a quem temerei?... “Si consistant adversum me castra, non timebit cor meum” - Ainda que me veja cercado de inimigos, não fraquejará meu coração”."}, {"n": 483, "chapter": "Os meios", "text": "Coragem! Tu... podes. - Não vês o que fez a graça de Deus com aquele Pedro dorminhoco, negador e covarde..., com aquele Paulo perseguidor, odiento e pertinaz?"}, {"n": 484, "chapter": "Os meios", "text": "Sê instrumento: de ouro ou de aço, de platina ou de ferro..., grande ou pequeno, delicado ou tosco... - Todos são úteis; cada um tem a sua missão própria. É como no mundo material: quem se atreverá a dizer que é menos útil o serrote do carpinteiro do que as pinças do cirurgião? - Teu dever é ser instrumento."}, {"n": 485, "chapter": "Os meios", "text": "Certo. E daí? - Não entendo como te podes retrair desse trabalho de almas (se não é por oculta soberba: julgas-te perfeito), só porque o fogo de Deus que te atraiu, além da luz e do calor que te entusiasmam, lança às vezes a fumaça da fraqueza dos instrumentos."}, {"n": 486, "chapter": "Os meios", "text": "Trabalho... há. - Os instrumentos não podem estar enferrujados. - Normas há também para evitar o mofo e a ferrugem. - Basta pô-las em prática."}, {"n": 487, "chapter": "Os meios", "text": "Não te inquietes com o problema econômico que se avizinha do teu empreendimento de apostolado. - Aumenta a confiança em Deus, faz humanamente o que puderes, e verás com que rapidez o dinheiro deixa de ser problema!"}, {"n": 488, "chapter": "Os meios", "text": "Não deixes de fazer as coisas por falta de instrumentos; começa-se como se pode. - Depois, a função cria o órgão. Alguns, que não prestavam, tornam-se aptos. Com os outros, faz-se uma operação cirúrgica, ainda que doa - bons “cirurgiões” foram os santos! -, e segue-se adiante."}, {"n": 489, "chapter": "Os meios", "text": "Fé viva e penetrante. Como a fé de Pedro. - Quando a tiveres, disse-o Ele, afastarás as montanhas, os obstáculos, humanamente insuperáveis, que se oponham aos teus empreendimentos de apóstolo."}, {"n": 490, "chapter": "Os meios", "text": "Retidão de coração e boa vontade: com estes dois elementos e o olhar posto em cumprir o que Deus quer, verás transformados em realidade os teus sonhos de Amor e saciada a tua fome de almas."}, {"n": 491, "chapter": "Os meios", "text": "“Nonne hic est fabri filius? Nonne hic est faber, filius Mariae?” - Porventura não é este o filho do artesão? Não é o artesão, filho de Maria? - Isto que disseram de Jesus, é bem possível que o digam de ti, com um pouco de pasmo e outro pouco de troça, quando “definitivamente” quiseres cumprir a Vontade de Deus, ser instrumento: “Mas este não é aquele?...” - Cala-te. E que as tuas obras confirmem a tua missão."}, {"n": 492, "chapter": "A Virgem Maria", "text": "O amor à nossa Mãe será sopro que atice em fogo vivo as brasas de virtude que estão ocultas sob o rescaldo da tua tibieza."}, {"n": 493, "chapter": "A Virgem Maria", "text": "Ama a Senhora. E Ela te obterá graça abundante para venceres nesta luta quotidiana. - E de nada servirão ao maldito essas coisas perversas que sobem e sobem, fervendo dentro de ti, até quererem sufocar, com a sua podridão bem cheirosa, os grandes ideais, os mandamentos sublimes que o próprio Cristo pôs em teu coração. - “Serviam!”"}, {"n": 494, "chapter": "A Virgem Maria", "text": "Sê de Maria e serás nosso."}, {"n": 495, "chapter": "A Virgem Maria", "text": "A Jesus sempre se vai e se “volta” por Maria."}, {"n": 496, "chapter": "A Virgem Maria", "text": "Como gostam os homens de que lhes recordem o seu parentesco com personagens da literatura, da política, do exército, da Igreja!... - Canta diante da Virgem Imaculada, recordando-lhe: Ave, Maria, Filha de Deus Pai; Ave, Maria, Mãe de Deus Filho; Ave, Maria, Esposa de Deus Espírito Santo... Mais do que tu, só Deus!"}, {"n": 497, "chapter": "A Virgem Maria", "text": "Diz: - Minha Mãe (tua, porque és seu por muitos títulos), que o teu amor me ate à Cruz de teu Filho; que não me falte a Fé, nem a valentia, nem a audácia para cumprir a vontade do nosso Jesus."}, {"n": 498, "chapter": "A Virgem Maria", "text": "Todos os pecados da tua vida parecem ter-se posto de pé. - Não desanimes. Pelo contrário, chama por tua Mãe, Santa Maria, com fé e abandono de criança. Ela trará o sossego à tua alma."}, {"n": 499, "chapter": "A Virgem Maria", "text": "Maria Santíssima, Mãe de Deus, passa despercebida, como mais uma, entre as mulheres do seu povo. - Aprende dEla a viver com “naturalidade”."}, {"n": 500, "chapter": "A Virgem Maria", "text": "Traz sobre o teu peito o santo escapulário do Carmo. - Poucas devoções (há muitas e muito boas devoções marianas) estão tão arraigadas entre os fiéis e têm tantas bênçãos dos Pontífices. Além disso, é tão maternal este privilégio sabatino!"}, {"n": 501, "chapter": "A Virgem Maria", "text": "Quando te perguntaram que imagem de Nossa Senhora te dava mais devoção, e respondeste - como quem já fez bem a experiência - que todas, compreendi que eras um bom filho. Por isso te parecem bons (enamoram - me, disseste) todos os retratos da tua Mãe."}, {"n": 502, "chapter": "A Virgem Maria", "text": "Maria, Mestra de oração. - Olha como pede a seu Filho em Caná. E como insiste, sem desanimar, com perseverança. - E como consegue. - Aprende."}, {"n": 503, "chapter": "A Virgem Maria", "text": "Soledade de Maria. Só! - Chora, sem amparo. - Tu e eu devemos acompanhar Nossa Senhora, e chorar também; porque a Jesus O pregaram ao madeiro, com pregos, as nossas misérias."}, {"n": 504, "chapter": "A Virgem Maria", "text": "A Virgem Santa Maria, Mãe do Amor Formoso, aquietará o teu coração, quando te fizer sentir que é de carne, se recorres a Ela com confiança."}, {"n": 505, "chapter": "A Virgem Maria", "text": "O amor à Senhora é prova de bom espírito, nas obras e nas pessoas singulares. - Desconfia do empreendimento que não tenha esse sinal."}, {"n": 506, "chapter": "A Virgem Maria", "text": "A Virgem Dolorosa... Quando a contemplares, repara em seu Coração. É uma Mãe com dois filhos, frente a frente: Ele... e tu."}, {"n": 507, "chapter": "A Virgem Maria", "text": "Que humildade, a de minha Mãe Santa Maria! - Não a vereis entre as palmas de Jerusalém, nem - afora as primícias de Caná - à hora dos grandes milagres. - Mas não foge ao desprezo do Gólgota; ali está “juxta crucem Jesu”, junto à cruz de Jesus, sua Mãe."}, {"n": 508, "chapter": "A Virgem Maria", "text": "Admira a firmeza de Santa Maria: ao pé da Cruz, com a maior dor humana - não há dor como a sua dor -, cheia de fortaleza. - E pede-lhe dessa firmeza, para que saibas também estar junto da Cruz."}, {"n": 509, "chapter": "A Virgem Maria", "text": "Maria, Mestra do sacrifício escondido e silencioso! - Vede-a, quase sempre oculta, colaborando com o Filho: sabe e cala."}, {"n": 510, "chapter": "A Virgem Maria", "text": "Vedes com que simplicidade? - “Ecce ancilla!...”"}, {"n": 511, "chapter": "A Virgem Maria", "text": "“Ne timeas, Maria!” - Não temas, Maria!... - Turbou-se a Senhora diante do Arcanjo. - E depois disto, quererei ainda desprezar esses pormenores de modéstia, que são a salvaguarda da minha pureza?!"}, {"n": 512, "chapter": "A Virgem Maria", "text": "Ó Mãe, Mãe! Com essa tua palavra - “fiat” - nos tornaste irmãos de Deus e herdeiros da sua glória. - Bendita sejas!"}, {"n": 513, "chapter": "A Virgem Maria", "text": "Antes, sozinho, não podias... - Agora, recorreste à Senhora, e, com Ela, que fácil!"}, {"n": 514, "chapter": "A Virgem Maria", "text": "Confia. - Torna. - Invoca Nossa Senhora e serás fiel."}, {"n": 515, "chapter": "A Virgem Maria", "text": "Sentes que, por momentos, te faltam as forças? - Por que não o dizes à tua Mãe, “consolatrix afflictorum, auxilium christianorum..., Spes nostra, Regina apostolorum”?"}, {"n": 516, "chapter": "A Virgem Maria", "text": "Mãe! - Chama-a bem alto, bem alto. - Ela, tua Mãe Santa Maria, te escuta, te vê em perigo talvez, e te oferece, com a graça do seu Filho, o consolo do seu regaço, a ternura das suas carícias. E te encontrarás reconfortado para a nova luta."}, {"n": 517, "chapter": "A Igreja", "text": "“Et unam, sanctam, catholicam et apostolicam Ecclesiam!...” - Compreendo essa tua pausa quando rezas, saboreando: Creio na Igreja, Una, Santa, Católica e Apostólica..."}, {"n": 518, "chapter": "A Igreja", "text": "Que alegria poder dizer com todas as forças da minha alma: - Amo a minha Mãe, a santa Igreja!"}, {"n": 519, "chapter": "A Igreja", "text": "Esse grito - “serviam!” - é vontade de “servir” fidelissimamente a Igreja de Deus, mesmo à custa dos bens, da honra e da vida."}, {"n": 520, "chapter": "A Igreja", "text": "Católico, Apostólico, Romano! - Gosto de que sejas muito romano. E que tenhas desejos de fazer a tua “romaria”, “videre Petrum”, para ver Pedro."}, {"n": 521, "chapter": "A Igreja", "text": "Que bondade a de Cristo ao deixar à sua Igreja os Sacramentos! - São remédio para cada necessidade. - Venera-os e fica muito agradecido ao Senhor e à sua Igreja."}, {"n": 522, "chapter": "A Igreja", "text": "Deves ter veneração e respeito pela Santa Liturgia da Igreja e por cada uma das suas cerimônias. - Cumpre-as fielmente. - Não vês que nós, os pobrezinhos dos homens, necessitamos que até as coisas mais nobres e grandes entrem pelos sentidos?"}, {"n": 523, "chapter": "A Igreja", "text": "A Igreja canta - disse alguém - porque falar não seria bastante para a sua oração. - Tu, cristão - e cristão escolhido -, deves aprender a cantar liturgicamente."}, {"n": 524, "chapter": "A Igreja", "text": "O único jeito é romper a cantar!, dizia uma alma enamorada, depois de ver as maravilhas que o Senhor operava por seu ministério. - E eu te repito o conselho: Canta! Que transborde em harmonias o teu agradecido entusiasmo pelo teu Deus."}, {"n": 525, "chapter": "A Igreja", "text": "Ser “católico” é amar a Pátria, sem a ninguém deixar que nos exceda nesse amor, e, ao mesmo tempo, ter por meus os ideais nobres de todos os países. Quantas glórias da França são glórias minhas! E igualmente muitos motivos de orgulho de alemães, de italianos, de ingleses..., de americanos e asiáticos e africanos, são também orgulho meu. - Católico!... Coração grande, espírito aberto."}, {"n": 526, "chapter": "A Igreja", "text": "Se não tens suma veneração pelo estado sacerdotal e pelo religioso, não é verdade que amas a Igreja de Deus."}, {"n": 527, "chapter": "A Igreja", "text": "Aquela mulher que, em casa de Simão o leproso, em Betânia, unge com rico perfume a cabeça do Mestre, recorda-nos o dever de sermos magnânimos no culto de Deus. - Todo o luxo, majestade e beleza me parecem pouco. - E contra os que atacam a riqueza dos vasos sagrados, paramentos e retábulos, ouve-se o louvor de Jesus: “Opus enim bonum operata est in me” - uma boa obra foi a que ela fez comigo."}, {"n": 528, "chapter": "Santa Missa", "text": "Uma característica muito importante do homem apostólico é amar a Missa."}, {"n": 529, "chapter": "Santa Missa", "text": "A Missa é comprida, dizes, e eu acrescento: porque o teu amor é curto."}, {"n": 530, "chapter": "Santa Missa", "text": "Não é estranho que muitos cristãos - pausados e até solenes na vida social (não têm pressa), nas suas pouco ativas atuações profissionais, à mesa e no descanso (também não têm pressa) - se sintam apressados e apressem o Sacerdote na sua ânsia de encurtar, de abreviar o tempo dedicado ao Santíssimo Sacrifício do Altar?"}, {"n": 531, "chapter": "Santa Missa", "text": "“Tratai-mO bem, tratai-mO bem!”, dizia, entre lágrimas, um velho Prelado aos novos Sacerdotes que acabava de ordenar. - Senhor! Quem me dera ter voz e autoridade para clamar desta maneira ao ouvido e ao coração de muitos cristãos, de muitos!"}, {"n": 532, "chapter": "Santa Missa", "text": "Como chorou, ao pé do altar, aquele jovem e santo Sacerdote - que havia de merecer o martírio -, porque se lembrava de uma alma que se tinha aproximado em pecado mortal a receber Cristo! - Assim O desagravas tu?"}, {"n": 533, "chapter": "Santa Missa", "text": "Humildade de Jesus: em Belém, em Nazaré, no Calvário... Porém, mais humilhação e mais aniquilamento na Hóstia Santíssima; mais que no estábulo, e que em Nazaré, e que na Cruz. Por isso, como estou obrigado a amar a Missa! (A “nossa” Missa, Jesus...)"}, {"n": 534, "chapter": "Santa Missa", "text": "Quantos anos comungando diariamente! - Qualquer outro seria santo - disseste-me -, e eu, sempre na mesma! - Meu filho - respondi-te -, continua com a Comunhão diária e pensa: Que seria de mim se não tivesse comungado?"}, {"n": 535, "chapter": "Santa Missa", "text": "Comunhão, união, comunicação, confidência: Palavra, Pão, Amor."}, {"n": 536, "chapter": "Santa Missa", "text": "Comunga. - Não é falta de respeito. - Comunga, hoje precisamente, que acabas de sair daquele laço. - Esqueces que Jesus disse: “Não é necessário o médico para os sãos, mas para os enfermos”?"}, {"n": 537, "chapter": "Santa Missa", "text": "Quando te aproximares do Sacrário, pensa que Ele!... faz vinte séculos que te espera."}, {"n": 538, "chapter": "Santa Missa", "text": "Aí o tens: é Rei dos Reis e Senhor dos Senhores. - Está escondido no Pão. Humilhou-se até esse extremo por amor de ti."}, {"n": 539, "chapter": "Santa Missa", "text": "Ficou para ti. - Não é reverência deixar de comungar, se estás bem preparado. - Irreverência é apenas recebê-Lo indignamente."}, {"n": 540, "chapter": "Santa Missa", "text": "Que fonte de graças é a Comunhão espiritual! - Pratica-a com freqflência, e terás mais presença de Deus e mais união com Ele nas obras."}, {"n": 541, "chapter": "Santa Missa", "text": "Há uma urbanidade da piedade. - Aprende-a. - Dão pena esses homens “piedosos”, que não sabem assistir à Missa - ainda que a ouçam diariamente -, nem benzer-se (fazem uns estranhos trejeitos, cheios de precipitação), nem dobrar o joelho diante do Sacrário (suas genuflexões ridículas parecem um escárnio), nem inclinar reverentemente a cabeça diante de uma imagem de Nossa Senhora."}, {"n": 542, "chapter": "Santa Missa", "text": "Não empregueis no culto imagens produzidas em “série”; prefiro um Cristo de ferro tosco a esses crucifixos de massa repintalgada que parecem feitos de açúcar."}, {"n": 543, "chapter": "Santa Missa", "text": "Viste-me celebrar a Santa Missa sobre um altar desnudo - mesa e ara -, sem retábulo. O Crucifixo, grande. Os castiçais maciços, com tochas de cera escalonadas: mais altas junto da Cruz. Frontal da cor do dia. Casula ampla. O cálice, severo de linhas, de copa larga e rico. Ausente a luz elétrica, cuja falta não notamos. - E te custou sair do oratório: estava-se bem ali. Vês como leva a Deus, como aproxima de Deus o rigor da liturgia?"}, {"n": 544, "chapter": "Comunhão dos Santos", "text": "Comunhão dos Santos. - Como dizer-te? - Sabes o que são as transfusões de sangue para o corpo? Pois assim vem a ser a Comunhão dos Santos para a alma."}, {"n": 545, "chapter": "Comunhão dos Santos", "text": "Vivei entre vós uma particular Comunhão dos Santos. E cada um sentirá, à hora da luta interior, e à hora do trabalho profissional, a alegria e a força de não estar só."}, {"n": 546, "chapter": "Comunhão dos Santos", "text": "Filho, que bem viveste a Comunhão dos Santos quando me escrevias: “Ontem “senti” que o senhor pedia por mim”!"}, {"n": 547, "chapter": "Comunhão dos Santos", "text": "Um outro que sabe dessa “comunicação” de bens sobrenaturais, diz-me: “A sua carta me fez muito bem; nota-se que vem impregnada das orações de todos!... E eu preciso muito que rezem por mim”."}, {"n": 548, "chapter": "Comunhão dos Santos", "text": "Se sentires a Comunhão dos Santos - se a viveres -, serás de bom grado um homem penitente. - E compreenderás que a penitência é “gaudium, etsi laboriosum” - alegria, embora trabalhosa. E te sentirás “aliado” de todas as almas penitentes que foram, são e serão."}, {"n": 549, "chapter": "Comunhão dos Santos", "text": "Terás mais facilidade em cumprir o teu dever, se pensares na ajuda que te prestam os teus irmãos e na que deixas de prestar-lhes se não és fiel."}, {"n": 550, "chapter": "Comunhão dos Santos", "text": "“Ideo omnia sustineo propter electos” - tudo sofro pelos escolhidos - “ut et ipsi salutem consequantur” - para que eles obtenham a salvação - “quae est in Christo Jesu” - que está em Cristo Jesus. - Bom modo de viver a Comunhão dos Santos! - Pede ao Senhor que te dê este espírito de São Paulo."}, {"n": 551, "chapter": "Devoções", "text": "Fujamos da “rotina” como do próprio demônio. - O grande meio para não cair nesse abismo, sepulcro da verdadeira piedade, é a contínua presença de Deus."}, {"n": 552, "chapter": "Devoções", "text": "As tuas devoções particulares devem ser poucas, mas constantes."}, {"n": 553, "chapter": "Devoções", "text": "Não esqueças as tuas orações de criança, aprendidas talvez dos lábios de tua mãe. - Recita-as todos os dias, com simplicidade, como então."}, {"n": 554, "chapter": "Devoções", "text": "Não abandones a visita ao Santíssimo. - Depois da oração vocal que tenhas por costume, conta a Jesus, realmente presente no Sacrário, as preocupações do dia. - E terás luzes e ânimo para a tua vida de cristão."}, {"n": 555, "chapter": "Devoções", "text": "Verdadeiramente, é amável a Santa Humanidade do nosso Deus! - “Meteste-te” na Chaga santíssima da mão direita do teu Senhor e me perguntaste: “Se uma Ferida de Cristo limpa, cura, tranqfliliza, fortalece, inflama e enamora, o que não farão as cinco, abertas no madeiro?”"}, {"n": 556, "chapter": "Devoções", "text": "A Via-Sacra. - Esta é que é devoção vigorosa e substancial! Quem dera que te habituasses a repassar esses catorze pontos da Paixão e Morte do Senhor, às sextas-feiras. - Eu te garanto que obterias fortaleza para toda a semana."}, {"n": 557, "chapter": "Devoções", "text": "Devoção de Natal. - Não sorrio quando te vejo fazer as montanhas de musgo do Presépio e dispor as ingênuas figuras de barro em volta da gruta. - Nunca me pareceste mais homem do que agora, que pareces uma criança."}, {"n": 558, "chapter": "Devoções", "text": "O Santo Rosário é arma poderosa. Emprega-a com confiança e te maravilharás do resultado."}, {"n": 559, "chapter": "Devoções", "text": "São José, Pai de Cristo, é também teu Pai e teu Senhor. - Recorre a ele."}, {"n": 560, "chapter": "Devoções", "text": "Nosso Pai e Senhor São José é Mestre da vida interior. - Coloca-te sob o seu patrocínio e sentirás a eficácia do seu poder."}, {"n": 561, "chapter": "Devoções", "text": "De São José diz Santa Teresa, no livro da sua vida: “Quem não achar mestre que lhe ensine a orar, tome este glorioso Santo por mestre, e não errará no caminho”. - O conselho vem de uma alma experimentada. Segue - o."}, {"n": 562, "chapter": "Devoções", "text": "Tem confiança com o teu Anjo da Guarda. Trata-o como amigo íntimo - porque de fato o é -, e ele saberá prestar-te mil e um serviços nos assuntos correntes de cada dia."}, {"n": 563, "chapter": "Devoções", "text": "Conquista o Anjo da Guarda daquele que queres trazer para o teu apostolado. - É sempre um grande “cúmplice”."}, {"n": 564, "chapter": "Devoções", "text": "Se tivesses presente o teu Anjo da Guarda e os do teu próximo, evitarias muitas tolices que deslizam na tua conversa."}, {"n": 565, "chapter": "Devoções", "text": "Ficas pasmado porque o teu Anjo da Guarda te tem prestado serviços patentes. - E não devias pasmar; para isso o colocou o Senhor junto de ti."}, {"n": 566, "chapter": "Devoções", "text": "Há nesse ambiente muitas ocasiões de te desviares? - De acordo. Mas por acaso não há também Anjos da Guarda?"}, {"n": 567, "chapter": "Devoções", "text": "Recorre ao teu Anjo da Guarda na hora da provação, e ele te protegerá contra o demônio e te dará santas inspirações."}, {"n": 568, "chapter": "Devoções", "text": "Com muito gosto deviam cumprir o seu ofício os Santos Anjos da Guarda junto daquela alma que lhes dizia: “Santos Anjos, eu vos invoco, como a Esposa do Cântico dos Cânticos, “ut nuntietis ei quia amore langueo” - para Lhe dizerdes que morro de Amor”."}, {"n": 569, "chapter": "Devoções", "text": "Sei que te dou uma alegria copiando para ti esta oração aos Santos Anjos da Guarda dos nossos Sacrários: “Ó Espíritos Angélicos que guardais os nossos Tabernáculos, onde repousa o tesouro adorável da Sagrada Eucaristia, defendei-a das profanações e conservai-a para o nosso amor”."}, {"n": 570, "chapter": "Devoções", "text": "Bebe na fonte límpida dos “Atos dos Apóstolos”: no capítulo XII, Pedro, libertado da prisão por intervenção dos Anjos, encaminha-se para a casa da mãe de Marcos. - Não querem acreditar na empregadinha que afirma que Pedro está à porta. “Angelus ejus est!” - deve ser o seu Anjo!, diziam. - Olha a confiança com que os primeiros cristãos tratavam os seus Anjos. - E tu?"}, {"n": 571, "chapter": "Devoções", "text": "As benditas almas do purgatório. - Por caridade, por justiça e por um egoísmo desculpável - podem tanto diante de Deus! -, lembra-te delas com muita freqflência nos teus sacrifícios e na tua oração. Oxalá possas dizer, ao falar nelas: “Minhas boas amigas, as almas do purgatório...”"}, {"n": 572, "chapter": "Devoções", "text": "Perguntas-me por que sempre te recomendo, com tanto empenho, o uso diário da água benta. - Podia dar-te muitas razões. Bastará, com certeza, esta da Santa de Ávila"}, {"n": 573, "chapter": "Devoções", "text": "Obrigado, meu Deus, pelo amor ao Papa que puseste em meu coração."}, {"n": 574, "chapter": "Devoções", "text": "Quem te disse que fazer novenas não é varonil? - Serão varonis essas devoções, sempre que as pratique um varão..., com espírito de oração e penitência."}, {"n": 575, "chapter": "Fé", "text": "Alguns passam pela vida como por um túnel, e não compreendem o esplendor e a segurança e o calor do sol da fé."}, {"n": 576, "chapter": "Fé", "text": "Com que infame lucidez argúi Satanás contra a nossa Fé Católica! Mas digamos-lhe sempre, sem entrar em discussões: - Eu sou filho da Igreja."}, {"n": 577, "chapter": "Fé", "text": "Sentes uma fé gigante... - Quem te dá essa fé, dar-te-á os meios."}, {"n": 578, "chapter": "Fé", "text": "É São Paulo quem te diz, alma de apóstolo: “Justus ex fide vivit” - O justo vive da fé. - Que fazes, que deixas apagar esse fogo?"}, {"n": 579, "chapter": "Fé", "text": "Fé. - Dá pena ver de que modo tão abundante a têm na boca muitos cristãos, e com que pouca abundância a põem em suas obras. - Até parece que é virtude para pregar, e não para praticar."}, {"n": 580, "chapter": "Fé", "text": "Pede humildemente ao Senhor que te aumente a fé. - E depois, com novas luzes, apreciarás bem as diferenças entre as sendas do mundo e o teu caminho de apóstolo."}, {"n": 581, "chapter": "Fé", "text": "Com que humildade e com que simplicidade narram os evangelistas fatos que manifestam a fé fraca e vacilante dos Apóstolos! - Para que tu e eu não percamos a esperança de chegar a ter a fé inamovível e forte que depois tiveram aqueles primeiros."}, {"n": 582, "chapter": "Fé", "text": "Como é bela a nossa Fé Católica! - Dá solução a todas as nossas ansiedades, e aquieta o entendimento, e enche de esperança o coração."}, {"n": 583, "chapter": "Fé", "text": "Não sou “milagreiro”. - Já te disse que me sobram milagres no Santo Evangelho para firmar fortemente a minha fé. - Mas dão-me pena esses cristãos - até piedosos, “apostólicos”! - que sorriem quando ouvem falar de caminhos extraordinários, de fatos sobrenaturais. Sinto desejos de lhes dizer: - Sim, agora também há milagres; nós mesmos os faríamos se tivéssemos fé!"}, {"n": 584, "chapter": "Fé", "text": "Aviva a tua fé. - Não é Cristo uma figura que passou. Não é uma recordação que se perde na história. Vive! “Jesus Christus heri et hodie: ipse et in saecula!”, diz São Paulo. Jesus Cristo ontem e hoje e sempre!"}, {"n": 585, "chapter": "Fé", "text": "“Si habueritis fidem, sicut granum sinapis!” Se tivésseis uma fé do tamanho de um grãozinho de mostarda!... - Que promessas não encerra esta exclamação do Mestre!"}, {"n": 586, "chapter": "Fé", "text": "Deus é o mesmo de sempre. - O que falta são homens de fé; e renovar-se - ão os prodígios que lemos na Santa Escritura. - “Ecce non est abbreviata manus Domini”. - O braço de Deus, o seu poder, não encolheu!"}, {"n": 587, "chapter": "Fé", "text": "Não têm fé. - Mas têm superstições. Deu-nos riso e vergonha aquele homem importante que perdia a tranqflilidade quando ouvia determinada palavra, em si indiferente e inofensiva - para ele de mau agouro -, ou quando via a cadeira girar sobre uma perna."}, {"n": 588, "chapter": "Fé", "text": "“Omnia possibilia sunt credenti”. - Tudo é possível para quem crê. - São palavras de Cristo. - Que fazes, que não Lhe dizes com os Apóstolos: “Adauge nobis fidem!”, aumenta-me a fé!?"}, {"n": 589, "chapter": "Humildade", "text": "Quando ouvires os aplausos do triunfo, que ressoem também aos teus ouvidos os risos que provocaste com os teus fracassos."}, {"n": 590, "chapter": "Humildade", "text": "Não queiras ser como aquele catavento dourado do grande edifício; por muito que brilhe e por mais alto que esteja, não conta para a solidez da obra. - Oxalá sejas como um velho silhar oculto nos alicerces, debaixo da terra, onde ninguém te veja; por ti não desabará a casa."}, {"n": 591, "chapter": "Humildade", "text": "Quanto mais me exaltarem, meu Jesus, humilha-me mais em meu coração, fazendo-me saber o que tenho sido e o que serei, se Tu me abandonares."}, {"n": 592, "chapter": "Humildade", "text": "Não esqueças que és... a lata do lixo. - Por isso, se porventura o Jardineiro divino lança mão de ti, e te esfrega e te limpa... e te enche de magníficas flores..., nem o aroma nem a cor que embelezam a tua fealdade devem envaidecer-te. - Humilha-te; não sabes que és o caixote do lixo?"}, {"n": 593, "chapter": "Humildade", "text": "Quando te vires como és, há de parecer-te natural que te desprezem."}, {"n": 594, "chapter": "Humildade", "text": "Não és humilde quando te humilhas, mas quando te humilham e o aceitas por Cristo."}, {"n": 595, "chapter": "Humildade", "text": "Se te conhecesses, alegrar-te-ias com o desprezo, e choraria teu coração ante a exaltação e o louvor."}, {"n": 596, "chapter": "Humildade", "text": "Não te aflijas por verem as tuas faltas. A ofensa a Deus e a desedificação que podes ocasionar, isso é o que te deve afligir. - De resto, que saibam como és e te desprezem. - Não tenhas pena de ser nada, porque assim Jesus tem que pôr tudo em ti."}, {"n": 597, "chapter": "Humildade", "text": "Se agisses de acordo com os impulsos que sentes em teu coração e os que a razão te dita, estarias continuamente com a boca por terra, em prostração, como um verme sujo, feio e desprezível... diante desse Deus! que tanto te vai suportando."}, {"n": 598, "chapter": "Humildade", "text": "Como é grande o valor da humildade! - “Quia respexit humilitatem...” Acima da fé, da caridade, da pureza imaculada, reza o hino jubiloso de nossa Mãe em casa de Zacarias: “Porque Ele olhou a humildade da sua serva, eis que desde agora me chamarão bem-aventurada todas as gerações...”"}, {"n": 599, "chapter": "Humildade", "text": "És pó sujo e caído. - Ainda que o sopro do Espírito Santo te levante sobre todas as coisas da terra e te faça brilhar como ouro, ao refletires nas alturas, com a tua miséria, os raios soberanos do Sol da Justiça, não esqueças a pobreza da tua condição. Um instante de soberba te faria voltar ao chão, e deixarias de ser luz para ser lodo."}, {"n": 600, "chapter": "Humildade", "text": "Tu?... Soberba? - De quê?"}, {"n": 601, "chapter": "Humildade", "text": "Soberba? - Por quê?... Dentro de pouco tempo - anos, dias -, serás um monte de podridão hedionda: vermes, humores fétidos, trapos sujos da mortalha..., e ninguém na terra se lembrará de ti."}, {"n": 602, "chapter": "Humildade", "text": "Tu, sábio, afamado, eloqflente, poderoso: se não fores humilde, nada vales. - Corta, arranca esse “eu” que tens em grau superlativo - Deus te ajudará -, e então poderás começar a trabalhar por Cristo, no último lugar do seu exército de apóstolos."}, {"n": 603, "chapter": "Humildade", "text": "Essa falsa humildade é comodismo; assim, tão “humildezinho”, vais abrindo mão de direitos... que são deveres."}, {"n": 604, "chapter": "Humildade", "text": "Reconhece humildemente a tua fraqueza, para poderes dizer com o Apóstolo: “Cum enim infirmor, tunc potens sum” - porque, quando sou fraco, então sou forte."}, {"n": 605, "chapter": "Humildade", "text": "Padre: como pode suportar todo este lixo?, disseste-me, depois de uma confissão contrita. - Calei-me, pensando que, se a tua humildade te leva a sentir-te assim - como lixo, um montão de lixo! -, ainda poderemos fazer algo de grande de toda a tua miséria."}, {"n": 606, "chapter": "Humildade", "text": "Olha como é humilde o nosso Jesus: um burrico foi o seu trono em Jerusalém!..."}, {"n": 607, "chapter": "Humildade", "text": "A humildade é outro bom caminho para chegar à paz interior. - Foi “Ele” que o disse: “Aprendei de mim, que sou manso e humilde de coração..., e encontrareis paz para as vossas almas”."}, {"n": 608, "chapter": "Humildade", "text": "Não é falta de humildade conheceres o progresso da tua alma. - Assim podes agradecê-lo a Deus. - Mas não te esqueças de que és um pobrezinho, que veste um bom terno... emprestado."}, {"n": 609, "chapter": "Humildade", "text": "O conhecimento próprio leva-nos como que pela mão à humildade."}, {"n": 610, "chapter": "Humildade", "text": "A tua firmeza em defender o espírito e as normas do apostolado em que trabalhas não deve fraquejar por falsa humildade. - Essa firmeza não é soberba; é a virtude cardeal da fortaleza."}, {"n": 611, "chapter": "Humildade", "text": "Foi por soberba: já te ias julgando capaz de tudo, tu sozinho. - O Senhor te largou por um instante, e caíste de cabeça. - Sê humilde, e o seu apoio extraordinário não te há de faltar."}, {"n": 612, "chapter": "Humildade", "text": "Bem podias repelir esses pensamentos de orgulho; afinal, és como o pincel nas mãos do artista. - E nada mais. - Diz-me para que serve um pincel, se não deixa trabalhar o pintor."}, {"n": 613, "chapter": "Humildade", "text": "Para que sejas humilde, tu, tão vazio e tão satisfeito de ti mesmo, basta-te considerar aquelas palavras de Isaías: és “gota de água ou de orvalho que cai na terra e mal se deixa ver”."}, {"n": 614, "chapter": "Obediência", "text": "Nos trabalhos de apostolado, não há desobediência pequena."}, {"n": 615, "chapter": "Obediência", "text": "Tempera a tua vontade, viriliza a tua vontade; que seja, com a graça de Deus, como um esporão de aço. - Só tendo uma vontade forte, saberás não tê-la para obedecer."}, {"n": 616, "chapter": "Obediência", "text": "Por essa demora, por essa passividade, por essa tua resistência em obedecer, como se ressente o apostolado e como se alegra o inimigo!"}, {"n": 617, "chapter": "Obediência", "text": "Obedecei, como nas mãos do artista obedece um instrumento - que não se detém a considerar por que faz isto ou aquilo -, certos de que nunca vos mandarão coisa que não seja boa e para toda a glória de Deus."}, {"n": 618, "chapter": "Obediência", "text": "O inimigo: - Vais obedecer... até nesse pormenor “ridículo”? - Tu, com a graça de Deus: - Vou obedecer... até nesse pormenor “heróico”."}, {"n": 619, "chapter": "Obediência", "text": "Iniciativas. - Toma-as, no teu apostolado, dentro dos limites do mandato que te outorgarem. - Se saem desses limites ou tens dúvidas, consulta o superior, sem comunicares a ninguém os teus pensamentos. - Nunca te esqueças de que és apenas um executor."}, {"n": 620, "chapter": "Obediência", "text": "Se a obediência não te dá paz, é que és soberbo."}, {"n": 621, "chapter": "Obediência", "text": "Que pena se quem manda não te dá exemplo!... - Mas porventura lhe obedeces pelas suas condições pessoais?... Ou será que, para tua comodidade, traduzes o “obedite praepositis vestris” - obedecei aos vossos superiores - de São Paulo, com uma interpolação tua que venha a significar... sempre que o superior tenha virtudes ao meu gosto?"}, {"n": 622, "chapter": "Obediência", "text": "Que bem entendeste a obediência quando me escrevias: “Obedecer sempre é ser mártir sem morrer”!"}, {"n": 623, "chapter": "Obediência", "text": "Mandam-te fazer uma coisa que julgas estéril e difícil. - Faze-a. - E verás que é fácil e fecunda."}, {"n": 624, "chapter": "Obediência", "text": "Hierarquia. - Cada peça no seu lugar. - Que ficaria de um quadro de Velázquez se cada cor saísse do seu lugar, se cada fio da tela se soltasse, se cada pedaço de madeira do bastidor se separasse dos outros?"}, {"n": 625, "chapter": "Obediência", "text": "A tua obediência não merece esse nome se não estás decidido a jogar por terra o teu trabalho pessoal mais florescente, quando quem de direito assim o dispuser."}, {"n": 626, "chapter": "Obediência", "text": "Não é verdade, Senhor, que Te dava grande consolação a “sutileza” daquele homenzarrão com alma de criança que, ao sentir o desconcerto que produz obedecer em coisas desagradáveis e em si repugnantes, Te dizia baixinho: “Jesus, que eu faça boa cara”?"}, {"n": 627, "chapter": "Obediência", "text": "A tua obediência deve ser muda. Essa língua!"}, {"n": 628, "chapter": "Obediência", "text": "Agora que te custa obedecer, lembra-te do teu Senhor, “factus obediens usque ad mortem, mortem autem crucis” - obediente até à morte, e morte de cruz!"}, {"n": 629, "chapter": "Obediência", "text": "Que poder o da obediência! - O lago de Genesaré negava os seus peixes às redes de Pedro. Toda uma noite em vão. - Agora, obediente, tornou a lançar a rede à água e pescaram “piscium multitudinem copiosam” - uma grande quantidade de peixes. - Acredita: o milagre repete-se todos os dias."}, {"n": 630, "chapter": "Pobreza", "text": "Não o esqueças: tem mais aquele que precisa de menos. - Não cries necessidades."}, {"n": 631, "chapter": "Pobreza", "text": "Desapega-te dos bens do mundo. - Ama e pratica o espírito de pobreza. Contenta-te com o que basta para passar a vida sóbria e temperadamente. - Senão, nunca serás apóstolo."}, {"n": 632, "chapter": "Pobreza", "text": "Não consiste a verdadeira pobreza em não ter, mas em estar desprendido, em renunciar voluntariamente ao domínio sobre as coisas. - Por isso há pobres que realmente são ricos. E vice-versa."}, {"n": 633, "chapter": "Pobreza", "text": "Se és homem de Deus, põe em desprezar as riquezas o mesmo empenho que põem os homens do mundo em possuí-las."}, {"n": 634, "chapter": "Pobreza", "text": "Tanta afeição às coisas da terra! - Bem cedo te fugirão das mãos, que não descem com o rico ao sepulcro as suas riquezas."}, {"n": 635, "chapter": "Pobreza", "text": "Não tens espírito de pobreza se, podendo escolher de modo que a escolha passe despercebida, não escolhes para ti o pior."}, {"n": 636, "chapter": "Pobreza", "text": "“Divitiae, si affluant, nolite cor apponere” - Se vierem às tuas mãos as riquezas, não queiras pôr nelas o teu coração. - Anima-te a empregá-las generosamente. E, se for preciso, heroicamente. - Sê pobre em espírito!"}, {"n": 637, "chapter": "Pobreza", "text": "Não amas a pobreza se não amas o que a pobreza traz consigo."}, {"n": 638, "chapter": "Pobreza", "text": "Quantos recursos santos não tem a pobreza! - Lembras-te? Tu lhe deste, em horas de apuro econômico para aquele seu empreendimento apostólico, até o último centavo de que dispunhas. - E ele, Sacerdote de Deus, te disse: “Eu te darei também tudo o que tenho”. - Tu, de joelhos. - E... “a bênção de Deus Onipotente, Pai, Filho e Espírito Santo, desça sobre ti e permaneça para sempre”, ouviu-se. - Ainda te dura a persuasão de que foste bem pago."}, {"n": 639, "chapter": "Discrição", "text": "De calar não te arrependerás nunca; de falar, muitas vezes."}, {"n": 640, "chapter": "Discrição", "text": "Como te atreves a recomendar que guardem segredo..., se essa advertência é sinal de que tu não o soubeste guardar?"}, {"n": 641, "chapter": "Discrição", "text": "Discrição não é mistério nem segredo. É, simplesmente, naturalidade."}, {"n": 642, "chapter": "Discrição", "text": "Discrição é... delicadeza. - Não sentes certa inquietação, um mal-estar íntimo, quando os assuntos - nobres e correntes - da tua família saem do calor do lar para a indiferença ou para a curiosidade da praça pública?"}, {"n": 643, "chapter": "Discrição", "text": "Não exibas facilmente a intimidade do teu apostolado. Não vês que o mundo está cheio de incompreensões egoístas?"}, {"n": 644, "chapter": "Discrição", "text": "Cala-te. Não esqueças que o teu ideal é como uma luzinha recém-acesa. - Pode bastar um sopro para apagá-la em teu coração."}, {"n": 645, "chapter": "Discrição", "text": "Como é fecundo o silêncio! - Todas as energias que perdes, com as tuas faltas de discrição, são energias que subtrais à eficácia do teu trabalho. - Sê discreto."}, {"n": 646, "chapter": "Discrição", "text": "Se fosses mais discreto, não te lamentarias interiormente desse mau sabor na boca que te faz sofrer depois de muitas das tuas conversas."}, {"n": 647, "chapter": "Discrição", "text": "Não pretendas que te “compreendam”. - Essa incompreensão é providencial: para que o teu sacrifício passe despercebido."}, {"n": 648, "chapter": "Discrição", "text": "Se te calares, conseguirás mais eficácia em teus empreendimentos apostólicos - a quantos não lhes foge “a força” pela boca! - e evitarás muitos perigos de vanglória."}, {"n": 649, "chapter": "Discrição", "text": "Sempre o espetáculo! - Vens pedir-me fotografias, gráficos, estatísticas. - Não te envio esse material, porque (parece-me muito respeitável a opinião contrária) depois havia de pensar que trabalho para me empoleirar na terra..., e onde eu quero empoleirar-me é no Céu."}, {"n": 650, "chapter": "Discrição", "text": "Há muita gente - santa - que não entende o teu caminho. - Não te empenhes em fazer que o compreendam; perderás o tempo e darás lugar a indiscrições."}, {"n": 651, "chapter": "Discrição", "text": "“Não se pode ser raiz e copa, se não se é seiva, espírito, coisa que vai por dentro”. - Aquele teu amigo que escreveu estas palavras sabia que eras nobremente ambicioso. - E te ensinou o caminho: a discrição, o sacrifício, ir por dentro!"}, {"n": 652, "chapter": "Discrição", "text": "Discrição, virtude de poucos. - Quem caluniou a mulher dizendo que a discrição não é virtude de mulheres? - Quantos homens bem barbados têm que aprender!"}, {"n": 653, "chapter": "Discrição", "text": "Que exemplo de discrição nos dá a Mãe de Deus! Nem a São José comunica o mistério. - Pede à Senhora a discrição que te falta."}, {"n": 654, "chapter": "Discrição", "text": "O despeito afiou a tua língua. Cala-te!"}, {"n": 655, "chapter": "Discrição", "text": "Nunca te encarecerei suficientemente a importância da discrição. - Se não é o gume da tua arma de combate, dir-te-ei que é a empunhadura."}, {"n": 656, "chapter": "Discrição", "text": "Cala-te sempre que sintas dentro de ti o referver da indignação. - Ainda que estejas justissimamente irado. - Porque, apesar da tua discrição, nesses instantes sempre dizes mais do que quererias dizer."}, {"n": 657, "chapter": "Alegria", "text": "A verdadeira virtude não é triste nem antipática, mas amavelmente alegre."}, {"n": 658, "chapter": "Alegria", "text": "Se as coisas correm bem, alegremo-nos, bendizendo a Deus que dá o incremento. - Correm mal? - Alegremo-nos, bendizendo a Deus que nos faz participar da sua doce Cruz."}, {"n": 659, "chapter": "Alegria", "text": "A alegria que deves ter não é essa que poderíamos chamar fisiológica, de animal são, mas uma outra, sobrenatural, que procede de abandonar tudo e te abandonares a ti mesmo nos braços amorosos do nosso Pai-Deus."}, {"n": 660, "chapter": "Alegria", "text": "Nunca desanimes, se és apóstolo. - Não há contradição que não possas superar. - Por que estás triste?"}, {"n": 661, "chapter": "Alegria", "text": "Caras compridas..., maneiras bruscas..., aspecto ridículo..., ar antipático... Desse jeito esperas animar os outros a seguir Cristo?"}, {"n": 662, "chapter": "Alegria", "text": "Não há alegria? - Então pensa: há um obstáculo entre Deus e mim. - Quase sempre acertarás."}, {"n": 663, "chapter": "Alegria", "text": "Para remediar a tua tristeza, pedes-me um conselho. - Vou-te dar uma receita que vem de boa mão - do Apóstolo Tiago: - “Tristatur aliquis vestrum?”: Estás triste, meu filho? - “Oret!”: Faz oração! - Experimenta!"}, {"n": 664, "chapter": "Alegria", "text": "Não estejas triste. - Tem uma visão mais... “nossa” - mais cristã - das coisas."}, {"n": 665, "chapter": "Alegria", "text": "Quero que estejas sempre contente, porque a alegria é parte integrante do teu caminho. - Pede essa mesma alegria sobrenatural para todos."}, {"n": 666, "chapter": "Alegria", "text": "“Laetetur cor quaerentium Dominum” - Alegre-se o coração dos que procuram o Senhor. - Luz, para que investigues os motivos da tua tristeza."}, {"n": 667, "chapter": "Outras virtudes", "text": "Os atos de Fé, Esperança e Amor são válvulas por onde se expande o fogo das almas que vivem vida de Deus."}, {"n": 668, "chapter": "Outras virtudes", "text": "Faz tudo desinteressadamente, por puro Amor, como se não houvesse prêmio nem castigo. - Mas fomenta em teu coração a gloriosa esperança do Céu."}, {"n": 669, "chapter": "Outras virtudes", "text": "Está bem que sirvas a Deus como um filho, sem paga, generosamente... - Mas não te preocupes se uma vez ou outra pensas no prêmio."}, {"n": 670, "chapter": "Outras virtudes", "text": "Diz Jesus: “E todo aquele que deixar casa ou irmãos ou irmãs ou pai ou mãe ou esposa ou filhos ou herdades por causa do meu nome, receberá cem vezes mais e possuirá a vida eterna”. - Vê lá se encontras na terra quem pague com tanta generosidade!"}, {"n": 671, "chapter": "Outras virtudes", "text": "Jesus... calado. - “Jesus autem tacebat”. - Por que falas tu? Para te consolares ou para te desculpares? Cala-te. - Procura a alegria nos desprezos; sempre serão menos do que mereces. - Porventura podes tu perguntar: “Quid enim mali feci?” - que mal fiz eu?"}, {"n": 672, "chapter": "Outras virtudes", "text": "Podes ter a certeza de que és homem de Deus se aceitas com alegria e silêncio a injustiça."}, {"n": 673, "chapter": "Outras virtudes", "text": "Bela resposta a que deu aquele homem venerável ao jovem que se queixava da injustiça sofrida: - “Isso te magoa?”, dizia-lhe. “Então, não queiras ser bom!...”"}, {"n": 674, "chapter": "Outras virtudes", "text": "Nunca dês o teu parecer se não te pedem, mesmo que penses que a tua opinião é a mais acertada."}, {"n": 675, "chapter": "Outras virtudes", "text": "É verdade que foi pecador. - Mas não faças dele esse juízo inabalável. - Vê se tens entranhas de piedade, e não te esqueças de que ainda pode vir a ser um Agostinho, enquanto tu não passas de um medíocre."}, {"n": 676, "chapter": "Outras virtudes", "text": "Todas as coisas deste mundo não são mais do que terra. - Amontoa-as debaixo dos pés, e estarás mais perto do Céu."}, {"n": 677, "chapter": "Outras virtudes", "text": "Ouro, prata, jóias..., terra, montões de esterco. - Gozos, prazeres sensuais, satisfação dos apetites..., como uma besta, como um mulo, como um porco, como um galo, como um touro. Honras, distinções, títulos..., balões de ar, inchaços de soberba, mentiras, nada."}, {"n": 678, "chapter": "Outras virtudes", "text": "Não tenhas os teus amores aqui em baixo. - São amores egoístas... Os que amas hão de afastar-se de ti, com medo e nojo, poucas horas depois de te chamar Deus à sua presença. - Outros são os amores que perduram."}, {"n": 679, "chapter": "Outras virtudes", "text": "A gula é um vício feio. - Não te dá um pouquinho de riso e outro pouquinho de náusea ver esses senhores graves, sentados à volta da mesa, sérios, com ares de rito, metendo gorduras no
