o com decoro e ordem”?, quer dizer, na presença de Deus, com Ele, por Ele e só para Ele?"}, {"n": 513, "chapter": "Trabalho", "text": "Quando distribuíres o teu tempo, deves pensar também em que é que vais empregar os espaços livres que se apresentem a horas imprevistas."}, {"n": 514, "chapter": "Trabalho", "text": "Sempre entendi o descanso como um afastar-se do acontecer diário, nunca como dias de ócio. Descanso significa represar: acumular forças, ideais, planos... Em poucas palavras: mudar de ocupação, para voltar depois - com novos brios - aos afazeres habituais."}, {"n": 515, "chapter": "Trabalho", "text": "Agora, que tens muitas coisas que fazer, desapareceram todos os “teus problemas”... - Sê sincero: como te decidiste a trabalhar por Ele, já não te sobra tempo para pensares nos teus egoísmos."}, {"n": 516, "chapter": "Trabalho", "text": "As jaculatórias não dificultam o trabalho como o bater do coração não estorva o movimento do corpo."}, {"n": 517, "chapter": "Trabalho", "text": "Santificar o trabalho próprio não é uma quimera, mas missão de todo o cristão...: tua e minha. - Assim o descobriu aquele torneiro mecânico, que comentava: “Deixa-me louco de alegria essa certeza de que eu, manejando o torno e cantando, cantando muito - por dentro e por fora -, posso fazer-me santo... Que bondade a do nosso Deus!”"}, {"n": 518, "chapter": "Trabalho", "text": "A tarefa parece-te ingrata, especialmente quando contemplas como os teus companheiros amam pouco a Deus, ao mesmo tempo que fogem da graça e do bem que lhes desejas fazer. Tens de procurar compensar tu o que eles omitem, dando-te também a Deus no trabalho - como nunca o tinhas feito até agora -, convertendo-o em oração que sobre ao Céu por toda a humanidade."}, {"n": 519, "chapter": "Trabalho", "text": "Trabalhar com alegria não significa trabalhar “alegremente”, sem profundidade, como que tirando de cima dos ombros um peso incômodo... Procura que, por estouvamento ou por leviandade, os teus esforços não percam valor e, no fim das contas, te exponhas a apresentar-te diante de Deus de mãos vazias."}, {"n": 520, "chapter": "Trabalho", "text": "Alguns atuam com preconceitos no trabalho: por princípio, não confiam em ninguém e, obviamente, não entendem a necessidade de procurar a santificação do seu ofício. Se lhes falas, respondem-te que não acrescentes mais carga à do seu próprio trabalho, que suportam de má vontade, como um peso. - Esta é uma das batalhas de paz que é preciso vencer: encontrar a Deus nas ocupações e - com Ele e como Ele - servir os outros."}, {"n": 521, "chapter": "Trabalho", "text": "Assustam-te as dificuldades, e te retrais. Sabes que resumo se pode fazer do teu comportamento? Comodismo, comodismo, comodismo! Tinhas dito que estavas disposto a gastar-te, e a gastar-te sem limites, e ficas em aprendiz de herói. Reage com maturidade."}, {"n": 522, "chapter": "Trabalho", "text": "Estudante: aplica-te com espírito de apóstolo aos teus livros, com a convicção íntima de que essas horas e horas são já - agora! - um sacrifício espiritual oferecido a Deus, proveitosa para a humanidade, para o teu país, para a tua alma."}, {"n": 523, "chapter": "Trabalho", "text": "Tens um cavalo de batalha que se chama estudo: propões-te mil vezes aproveitar o tempo e, no entanto, qualquer coisa te distrai. Às vezes, cansas de ti mesmo, pela pouca vontade que manifestas, embora todos os dias recomeces."}, {"n": 524, "chapter": "Trabalho", "text": "É mais fácil mexer-se do que estudar, e menos eficaz."}, {"n": 525, "chapter": "Trabalho", "text": "Se sabes que o estudo é apostolado, e te limitas a estudar para passar, evidentemente a tua vida interior vai mal. Com esse desleixo, perdes o bom espírito e, como aconteceu àquele trabalhador da parábola, que escondeu com manha o talento recebido, se não retificas, podes autoexcluir-te da amizade com o Senhor, para te enlameares nos teus cálculos de comodismo."}, {"n": 526, "chapter": "Trabalho", "text": "É necessário estudar... Mas não é suficiente. Que se pode conseguir de quem se esfalfa para alimentar o seu egoísmo, ou de quem não persegue outro objetivo senão o de garantir a tranqflilidade, para daqui a alguns anos? É preciso estudar..., para ganhar o mundo e conquistá-lo para Deus. Então elevaremos o nível do nosso esforço, procurando que o trabalho realizado se converta em encontro com o Senhor, e sirva de base aos outros, aos que seguirão o nosso caminho... - Deste modo, o estudo será oração."}, {"n": 527, "chapter": "Trabalho", "text": "Depois de conhecer tantas vidas heróicas, vividas por Deus sem sair do seu lugar, cheguei a esta conclusão: para um católico, trabalhar não é cumprir, é amar!; e exceder-se com gosto, e sempre, no dever e no sacrifício."}, {"n": 528, "chapter": "Trabalho", "text": "Quando compreenderes esse ideal de trabalho fraterno por Cristo, sentir-te-ás maior, mais firme, e tão feliz quanto se pode ser neste mundo, que tantos se empenham em deteriorar e tornar amargo, porque andam exclusivamente atrás do seu próprio eu."}, {"n": 529, "chapter": "Trabalho", "text": "A santidade compõe-se de heroísmos. - Portanto, o que se nos pede no trabalho é o heroísmo de “acabar” bem as tarefas que nos comprometem, dia após dia, ainda que se repitam as mesmas ocupações. Senão, não queremos ser santos!"}, {"n": 530, "chapter": "Trabalho", "text": "Convenceu-me aquele sacerdote amigo nosso. Falava-me da sua atividade apostólica, e me assegurava que não há ocupações pouco importantes. Debaixo deste campo coalhado de rosas - dizia, esconde-se o esforço silencioso de tantas algumas que, com o seu trabalho e oração, com a sua oração e trabalho, conseguiram do Céu uma torrente de chuvas da graça, que tudo fecunda."}, {"n": 531, "chapter": "Trabalho", "text": "Coloca na tua mesa de trabalho, no teu quarto, na tua carteira..., uma imagem de Nossa Senhora, e dirige-lhe o olhar ao começares a tua tarefa, enquanto a realizas e ao terminá-la. Ela te alcançará - garanto! - a força necessária para fazeres, da tua ocupação, um diálogo amoroso com Deus."}, {"n": 532, "chapter": "Frivolidade", "text": "Quando se pensa com a mente clara nas misérias da terra, e se contrasta esse panorama com as riquezas da vida com Cristo, a meu ver não se encontra senão uma palavra que qualifique - com expressão rotunda - o caminho que muitos escolhem: estupidez, estupidez, estupidez. Não é que a maioria dos homens nos enganemos; sucede-nos coisa bastante pior: somos tolos da cabeça aos pés."}, {"n": 533, "chapter": "Frivolidade", "text": "É triste que não queiras esconder-te como um silhar, para alicerçar o edifício. Mas que te convertas em pedra onde os outros tropecem..., isso parece-me de malvados!"}, {"n": 534, "chapter": "Frivolidade", "text": "Não te escandalizes por haver maus cristãos, que fazem barulho e não praticam. O Senhor - escreve o Apóstolo - “há de pagar a cada um segundo as suas obras”: a ti, pelas tuas; e a mim, pelas minhas. - Se tu e eu nos decidirmos a portar-nos bem, para começar já haverá dois pilantras a menos no mundo."}, {"n": 535, "chapter": "Frivolidade", "text": "Enquanto não lutares contra a frivolidade, a tua cabeça será semelhante a uma loja de bricabraque: não conterá senão utopias, sonhos e... trastes velhos."}, {"n": 536, "chapter": "Frivolidade", "text": "Tens uma dose de “malandragem” que, se a empregasses com sentido sobrenatural, te serviria para ser um cristão formidável... - Mas, tal como a usas, não passas de um formidável “malandro”."}, {"n": 537, "chapter": "Frivolidade", "text": "Quando te vejo tomar tudo à ligeira, lembras-me aquela velha piada: “Vem aí um leão!”, disseram-lhe. E respondeu o cândido naturalista: “E eu que tenho com isso? Eu caço borboletas!”"}, {"n": 538, "chapter": "Frivolidade", "text": "Uma pessoa terrível: o ignorante que é, ao mesmo tempo, trabalhador, infatigável. Não afrouxes, ainda que estejas morrendo de velho, no empenho por formar-te mais."}, {"n": 539, "chapter": "Frivolidade", "text": "Desculpa própria do homem frívolo e egoísta: “Não gosto de comprometer - me com nada”."}, {"n": 540, "chapter": "Frivolidade", "text": "Não queres nem uma coisa - o mal - nem outra - o bem -... E assim, mancando dos dois pés, além de errares de caminho, a tua vida fica cheia de vazio."}, {"n": 541, "chapter": "Frivolidade", "text": "“In medio virtus...” - A virtude está no meio, diz a sábia sentença, para nos afastar dos extremismos. - Mas não vás cair no logro de converter esse conselho em eufemismo para encobrires a tua comodidade, matreirice, tibieza, “malandragem”, falta de ideais, aburguesamento. Medita aquelas palavras da Escritura Santa: “Oxalá fosses frio ou quente! Mas porque és tíbio, e não frio nem quente, estou para te vomitar da minha boca”."}, {"n": 542, "chapter": "Frivolidade", "text": "Nunca chegas ao miolo. Ficas sempre no acidental! - Permite-me que te repita com a Escritura Santa: não fazes mais do que “falar ao vento”!"}, {"n": 543, "chapter": "Frivolidade", "text": "Não te comportes tu como esses que, ouvindo um sermão, em vez de aplicarem a doutrina a si mesmos, julgam: como isto se aplica bem a Fulano!"}, {"n": 544, "chapter": "Frivolidade", "text": "Às vezes, alguns pensam que na calúnia não há má intenção: é a hipótese - dizem - com que a ignorância explica o que desconhece ou não compreende, para se dar ares de bem informada. Mas é duplamente má: por ser ignorante e por ser mentirosa."}, {"n": 545, "chapter": "Frivolidade", "text": "Não fales com tanta irresponsabilidade... Não compreendes que, mal tu lanças a primeira pedra, outros - no anonimato - organizam um apedrejamento?"}, {"n": 546, "chapter": "Frivolidade", "text": "És tu mesmo quem cria essa atmosfera de descontentamento entre os que te rodeiam? - Perdoa então que te diga que, além de malvado, és... estúpido."}, {"n": 547, "chapter": "Frivolidade", "text": "Perante a desgraça ou o erro, constitui uma triste satisfação poder dizer: “Eu já o tinha previsto”. Isso significaria que não te importavas com a desventura alheia: porque deverias tê-la remediado, se estava ao teu alcance."}, {"n": 548, "chapter": "Frivolidade", "text": "Há muitos modos de semear desorientação... - basta, por exemplo, apontar a exceção como regra geral."}, {"n": 549, "chapter": "Frivolidade", "text": "Dizes que és católico... - Por isso, quanta pena me dás, quando verifico que as tuas convicções não são suficientemente sólidas para te levarem a viver um catolicismo de ação, sem soluções de continuidade e sem ressalvas."}, {"n": 550, "chapter": "Frivolidade", "text": "Faria rir, se não fosse tão dolorosa, essa ingenuidade com que aceitas - por ligeireza, ignorância, complexo de inferioridade... - as balelas mais grosseiras."}, {"n": 551, "chapter": "Frivolidade", "text": "Imaginam os tolos, os inescrupulosos, os hipócritas, que os outros são também da sua condição... E os tratam - isso é que é penoso - como se o fossem."}, {"n": 552, "chapter": "Frivolidade", "text": "Já seria ruim que perdesses o tempo, que não é teu, mas de Deus, e para a sua glória. Mas se, além disso, fazes que outros o percam, diminuis por um lado o teu prestígio e, por outro, aumentas o esbulho da glória que deves a Deus."}, {"n": 553, "chapter": "Frivolidade", "text": "Faltam-te a maturidade e o recolhimento próprios de quem caminha pela vida com a certeza de um ideal, de uma meta. - Reza à Virgem Santa, para que aprendas a exaltar a Deus com toda a tua alma, sem dispersões de nenhum gênero."}, {"n": 554, "chapter": "Naturalidade", "text": "Cristo ressuscitado: o maior dos milagres só foi visto por uns poucos..., os necessários. A naturalidade é a assinatura das obras divinas."}, {"n": 555, "chapter": "Naturalidade", "text": "Quando se trabalha única e exclusivamente para a glória de Deus, tudo se faz com naturalidade, com simplicidade, como quem tem pressa e não pode deter - se em “grandes manifestações”, para não perder esse trato - irrepetível e incomparável - com o Senhor."}, {"n": 556, "chapter": "Naturalidade", "text": "“Por que razão” - perguntavas indignado - “o ambiente e os instrumentos de apostolado hão de ser feios, sujos... e complicados?” - E acrescentavas: “Mas se custa a mesma coisa!” - A mim, a tua indignação pareceu-me muito razoável. E considerei que Jesus se dirigia e atraía a todos: pobres e ricos, sábios e ignorantes, alegres e tristes, jovens e anciãos... Como é amável e natural - sobrenatural - a Sua figura!"}, {"n": 557, "chapter": "Naturalidade", "text": "Para a eficácia, naturalidade. Que se pode esperar de um pincel - mesmo mas mãos de um grande pintor -, se envolvem os pelos numa carapuça de seda?"}, {"n": 558, "chapter": "Naturalidade", "text": "Os santos tornam-se sempre “incômodos” para os outros."}, {"n": 559, "chapter": "Naturalidade", "text": "Santos, anormais?... Chegou a hora de arrancar esse preconceito. Temos de ensinar, com a naturalidade sobrenatural da ascética cristã, que nem sequer os fenômenos místicos significam anormalidade: é essa a naturalidade desses fenômenos..., como outros processos psíquicos ou fisiológicos têm a sua."}, {"n": 560, "chapter": "Naturalidade", "text": "Fala-te do horizonte que se abre diante dos nossos olhos, e do caminho que devemos percorrer. - Não tenho objeções!, declaraste, como que estranhado de “não as ter”... - Grava bem isto na cabeça: é que não deve havê-las!!"}, {"n": 561, "chapter": "Naturalidade", "text": "Evita essa adulação ridícula que, talvez de um modo inconsciente, manifesta às vezes a quem governa, convertendo-te em alto-falante sistemático dos seus gostos ou das suas opiniões em pontos intranscendentes. - Põe mais cuidado ainda, no entanto, em não te empenhares em apresentar os seus defeitos como pormenores simpáticos, mostrando uma familiaridade que o desautoriza, ou - o que seria prestar-lhe um triste serviço! - chegando à deformação de converter oque não está certo em algo engraçado."}, {"n": 562, "chapter": "Naturalidade", "text": "Crias à tua volta um clima artificial, de desconfiança, de suspeita, porque, quando falas, dás a impressão de estar jogando xadrez: cada palavra, pensando na quarta jogada posterior. Repara que o Evangelho, ao relatar a triste figura cautelosa e hipócrita dos escribas e fariseus, diz que faziam perguntas a Jesus, expunham-Lhe questões, “ut caperent eum in sermone” - para retorcer as suas palavras! - Foge desse comportamento."}, {"n": 563, "chapter": "Naturalidade", "text": "A naturalidade nada tem que ver com a grosseria, nem com a sujeira, nem com a pobretice, nem com a má educação. Alguns empenham-se em reduzir o serviço a Deus ao trabalho com o mundo da miséria e - perdoai - dos piolhos. Esta tarefa é e será necessária e admirável; mas, se ficarmos exclusivamente nisso, além de abandonarmos a imensa maioria das almas, quando tivermos tirado os necessitados dessa situação, iremos ignorá-los?"}, {"n": 564, "chapter": "Naturalidade", "text": "Dizes que és indigno? - Pois então... procura tornar-te digno. E pronto."}, {"n": 565, "chapter": "Naturalidade", "text": "Que ânsias tens de ser extraordinário!... - O que acontece contigo é... vulgaríssimo!"}, {"n": 566, "chapter": "Naturalidade", "text": "Bem-aventurada és tu porque acreditaste, diz Isabel à nossa Mãe. - A união com Deus, a vida sobrenatural, comporta sempre a prática atraente das virtudes humanas: Maria leva a alegria ao lar de sua prima, porque “leva” Cristo."}, {"n": 567, "chapter": "Veracidade", "text": "Fazias a tua oração diante de um Crucifixo, e tomaste esta decisão: é melhor sofrer pela verdade, do que a verdade ter que sofrer por mim."}, {"n": 568, "chapter": "Veracidade", "text": "Muitas vezes a verdade é tão inverossímil!..., sobretudo porque sempre exige coerência de vida."}, {"n": 569, "chapter": "Veracidade", "text": "Se te incomoda que te digam a verdade, então... por que perguntas? - Pretendes talvez que te respondam com a tua verdade, para justificares os teus descaminhos?"}, {"n": 570, "chapter": "Veracidade", "text": "Garantes que tens muito respeito pela verdade... É por isso que te colocas sempre a uma distância tão “respeitosa”?"}, {"n": 571, "chapter": "Veracidade", "text": "Não te comportes como um mentecapto: nunca é fanatismo querer conhecer cada dia melhor, e amar mais, e defender com maior segurança, a verdade que tens de conhecer, amar e defender. Pelo contrário - digo-o sem medo -, caem no sectarismo os que se opõem a esta conduta lógica, em nome de uma falsa liberdade."}, {"n": 572, "chapter": "Veracidade", "text": "Torna-se fácil - o mesmo acontecia no tempo de Jesus Cristo - dizer “não”: negar ou pôr reservas a uma verdade de fé. - Tu, que te declaras católico, tens que partir do “sim”. - Depois, mediante o estudo, serás capaz de expor os motivos da tua certeza: de que não há contradição - não pode havê-la - entre Verdade e ciência, entre Verdade e vida."}, {"n": 573, "chapter": "Veracidade", "text": "Não abandones a tarefa, não te afastes do caminho, mesmo que tenhas de conviver com pessoas cheias de preconceitos, como se a base dos raciocínios ou o significado dos termos se definissem pelo seu comportamento ou pelas suas afirmações. - Esforça-te para que te entendam..., mas, se não o consegues, segue em frente."}, {"n": 574, "chapter": "Veracidade", "text": "Encontrarás pessoas a quem, pela sua obtusa teimosia, dificilmente poderás persuadir... Mas, fora esses casos, vale a pena esclarecer as discordâncias, e esclarecê-las com toda a paciência que se faça necessária."}, {"n": 575, "chapter": "Veracidade", "text": "Alguns não ouvem - não desejam ouvir - senão as palavras que têm na sua cabeça."}, {"n": 576, "chapter": "Veracidade", "text": "Para tantos, a compreensão que exigem aos outros consiste em que todos passem para o seu partido."}, {"n": 577, "chapter": "Veracidade", "text": "Não posso acreditar na tua veracidade, se não sentes mal-estar - e um mal - estar incômodo! - ante a mentira mais pequena e inócua, que nada tem de pequena nem de inócua, porque é ofensa a Deus."}, {"n": 578, "chapter": "Veracidade", "text": "Por que olhas, e ouves, e lês, e falas, com intenção baixa, e tratas de captar o “ruim” que habita, não na intenção dos outros, mas somente na tua alma?"}, {"n": 579, "chapter": "Veracidade", "text": "Quando não há retidão naquele que lê, torna-se difícil que descubra a retidão daquele que escreve."}, {"n": 580, "chapter": "Veracidade", "text": "O sectário só vê sectarismo em todas as atividades dos outros. Mede o próximo com a medida raquítica do seu coração."}, {"n": 581, "chapter": "Veracidade", "text": "Causou-me pena aquele homem de governo. Intuía a existência de alguns problemas, aliás lógicos na vida..., e se assustou e se aborreceu quando lhos comunicaram. Preferia desconhecê-los, viver com a meia-luz ou com a penumbra da sua visão, para permanecer tranqflilo. Aconselhei-o a enfrentá-los com crueza e em plena luz, justamente para que deixassem de existir, e assegurei-lhe que então, sim, viveria com a verdadeira paz. Tu, não resolvas os problemas, próprios e alheios, ignorando-os: isso seria comodismo, preguiça, abrir a porta à ação do diabo."}, {"n": 582, "chapter": "Veracidade", "text": "Cumpriste com o teu dever?... A tua intenção foi reta?... Sim? - Então não te preocupes se há pessoas anormais, que descobrem o mal que só existe no seu olhar."}, {"n": 583, "chapter": "Veracidade", "text": "Perguntaram-te - inquisitivos - se julgavas boa ou má aquela tua decisão, que eles consideravam indiferente. E, com a consciência segura, respondeste: “Somente sei duas coisas: que a minha intenção é limpa e que... sei bem quanto me custa”. E acrescentaste: Deus é a razão e o fim da minha vida, e por isso consta-me que não há nada indiferente."}, {"n": 584, "chapter": "Veracidade", "text": "Explicaste-lhe os teus ideais e a tua conduta, segura, firme, de católico: e pareceu que aceitava e compreendia o caminho. - Mas depois ficastes com a dúvida de saber se não teria abafado essa sua compreensão entre os seus costumes não muito corretos... Procura-o de novo, e esclarece-lhe que a verdade e coisa que se aceita para vivê-la ou para tentar vivê-la."}, {"n": 585, "chapter": "Veracidade", "text": "Quem são eles para querer experimentar primeiro?... Por que têm que desconfiar?, comentas-me. - Olha: responde-lhes, da minha parte, que desconfiem da sua própria miséria..., e prossegue com tranqflilidade os teus passos."}, {"n": 586, "chapter": "Veracidade", "text": "Dão-te compaixão... - Com uma total falta de galhardia, jogam a pedra e escondem a mão. Olha o que sentencia deles o Espírito Santo: “Ficarão confusos e envergonhados todos os forjadores de erros; todos à uma serão cobertos de opróbrio”. Sentença que se cumprirá inexoravelmente."}, {"n": 587, "chapter": "Veracidade", "text": "Dizes que são bastantes os que difamam e murmuram daquele empreendimento apostólico?... - Pois bem, logo que tu proclamas a verdade, pelo menos já haverá um que não criticará."}, {"n": 588, "chapter": "Veracidade", "text": "No trigal mais belo e promissor, é fácil carpir carradas de saramagos, de papoulas e de capim... - A respeito da pessoa mais íntegra e responsável, não falta, ao longo da história, com que encher páginas negras... Pensa também quanto não têm falado e escrito contra Nosso Senhor Jesus Cristo. - Aconselho - te que - como no trigal - colha as espigas brancas e graúdas: a verdadeira verdade."}, {"n": 589, "chapter": "Veracidade", "text": "Para ti, que me afirmaste que queres ter uma consciência reta: não esqueças que acolher uma calúnia, sem impugná-la, é converter-se em coletor de lixo."}, {"n": 590, "chapter": "Veracidade", "text": "Essa tua propensão - abertura, como lhe chamas - para admitir facilmente qualquer afirmação que vá contra aquela pessoa, sem ouvi-la, não é precisamente justiça..., e muito menos caridade."}, {"n": 591, "chapter": "Veracidade", "text": "A calúnia, às vezes um mal aos que a padecem... Mas a quem verdadeiramente desonra é aos que a lançam e difundem..., e depois carregam esse peso no fundo da alma."}, {"n": 592, "chapter": "Veracidade", "text": "Por que tantos murmuradores?, perguntas-te magoado. - Uns, por erro, por fanatismo ou por malícia. - Mas a maioria repete o boato por inércia, por superficialidade, por ignorância. Por isso, volto a insistir: quando não puderes louvar, e não seja necessário falar, cala-te!"}, {"n": 593, "chapter": "Veracidade", "text": "Quando a vítima caluniada padece em silêncio, os “carrascos” assanham-se na sua valente covardia. Desconfia dessas afirmações rotundas, se aqueles que as propugnam não tentaram, ou não quiseram, falar com o interessado."}, {"n": 594, "chapter": "Veracidade", "text": "Existem muitos modos de fazer um inquérito. Com um pouco de malícia, dando ouvidos às murmurações, reúnem-se dez volumes de bom tamanho contra qualquer pessoa nobre ou entidade digna. - E mais, se essa pessoa ou entidade trabalha com eficácia. - E muito mais ainda, se essa eficácia é apostólica..."}, {"n": 595, "chapter": "Veracidade", "text": "Esses - dizia ele com pena - não apreendem Cristo, mas uma máscara de Cristo... Por isso carecem de critério cristão, não alcançam a verdade e não dão fruto. Não podemos esquecer, nós os filhos de Deus, que o Mestre anunciou: “Quem vos ouve, a Mim ouve...” - Por isso, temos de procurar ser Cristo; nunca a sua caricatura."}, {"n": 596, "chapter": "Veracidade", "text": "Neste caso, como em tantos outros, os homens mexem-se - todos julgam ter razão -..., e Deus os guia: quer dizer, por cima das suas razões particulares, acabará por triunfar a imperscrutável e amorosíssima Providência de Deus. Deixa-te, pois, “guiar” pelo Senhor, sem te opores aos seus planos, ainda que contradigam as tuas “razões fundamentais”."}, {"n": 597, "chapter": "Veracidade", "text": "É uma experiência penosa observar que alguns, menos preocupados em aprender, em tomar posse dos tesouros adquiridos pela ciência, se dedicam a construí-la ao seu gosto, com procedimentos mais ou menos arbitrários. Mas essa comprovação deve levar-te a redobrar o teu empenho em aprofundar na verdade."}, {"n": 598, "chapter": "Veracidade", "text": "Mais cômodo do que pesquisar é escrever contra os que pesquisam, ou contra os que contribuem com novas descobertas para a ciência e para a técnica. - Mas não devemos tolerar que, além disso, esses “críticos” pretendam erigir-se em senhores absolutos do saber e da opinião dos ignorantes."}, {"n": 599, "chapter": "Veracidade", "text": "“Não fica claro, não fica claro”, contrapunha aquele homem à afirmação segura dos outros... E o que ficava claro era a sua ignorância."}, {"n": 600, "chapter": "Veracidade", "text": "Aborrece-te ferir, criar divisões, demonstrar intolerâncias..., e vais transigindo em atitudes e pontos - não são graves, garantes! - que trazem conseqflências nefastas para tantos. Perdoa a minha sinceridade: com esse modo de proceder, cais na intolerância - que tanto te aborrece - mais néscia e prejudicial: a de impedir que a verdade seja proclamada."}, {"n": 601, "chapter": "Veracidade", "text": "Deus, pela sua justiça e pela sua misericórdia - infinitas e perfeitas -, trata com o mesmo amor, e de modo desigual, os filhos desiguais. Por isso, igualdade não significa medir a todos com a mesma bitola."}, {"n": 602, "chapter": "Veracidade", "text": "Dizes uma verdade a meias, com tantas possíveis interpretações, que se pode qualificar como... mentira."}, {"n": 603, "chapter": "Veracidade", "text": "A dúvida - no terreno da ciência, da fama alheia - é uma planta que se semeia facilmente, mas que custa muito a arrancar."}, {"n": 604, "chapter": "Veracidade", "text": "Fazes-me lembrar Pilatos: “Quod scripsi, scripsi!” o que escrevi não se muda... -, depois de ter permitido o crime mais horrível. - És inamovível! mas deverias ter assumido essa posição antes..., não depois!"}, {"n": 605, "chapter": "Veracidade", "text": "É virtude manter-se coerente com as próprias resoluções. Mas, se com o passar do tempo mudam os dados, é também um dever de coerência retificar o enfoque e a solução do problema."}, {"n": 606, "chapter": "Veracidade", "text": "Não confundas a intransigência santa com a teimosia obtusa. “Quebro, mas não me dobro”, afirmas ufano e com certa altivez. - Ouve-me bem: o instrumento quebrado torna-se imprestável, e deixa aberto o campo àqueles que, com aparente transigência, impõem depois uma intransigência nefasta."}, {"n": 607, "chapter": "Veracidade", "text": "“Sancta Maria, Sedes Sapientiae” - Santa Maria, Sede de Sabedoria. - Invoca com freqflência, deste modo, a Nossa Mãe, para que Ela cumule os seus filhos, no seu trabalho, na sua convivência - da Verdade que Cristo nos trouxe."}, {"n": 608, "chapter": "Ambição", "text": "Perante os que reduzem a religião a um cúmulo de negações, ou se conformam com um catolicismo de meias-tintas; perante os que querem pôr o Senhor de cara contra a parede, ou colocá-Lo num canto da alma..., temos de afirmar, com as nossas palavras e com as nossas obras, que aspiramos a fazer de Cristo um autêntico Rei de todos os corações..., também dos deles."}, {"n": 609, "chapter": "Ambição", "text": "Não trabalhes em empreendimentos apostólicos, construindo somente para agora... Dedica-te a essas tarefas com a esperança de que outros - irmãos teus com o mesmo espírito - colham o que semeias a mãos cheias e arrematem os edifícios que vais alicerçando."}, {"n": 610, "chapter": "Ambição", "text": "Quando o espírito cristão te animar de verdade, os teus anseios se irão retificando. - Já não sentirás ânsias de conseguir renome, mas de perpetuar o teu ideal."}, {"n": 611, "chapter": "Ambição", "text": "Se não é para construir uma obra muito grande, muito de Deus - a santidade -, não vale a pena entregar-se. Por isso, a Igreja - ao canonizar os santos - proclama a heroicidade da sua vida."}, {"n": 612, "chapter": "Ambição", "text": "Quando trabalhares a sério pelo Senhor, a tua maior satisfação consistirá em que haja muitos que te façam concorrência."}, {"n": 613, "chapter": "Ambição", "text": "Nesta hora de Deus, a tua passagem pela terra, decide-te de verdade a realizar alguma coisa que valha a pena; o tempo urge, e é tão nobre, tão heróica, tão gloriosa a missão do homem e da mulher sobre a terra, quando acendem no fogo de Cristo os corações murchos e apodrecidos! - Vale a pena levar aos outros a paz e a felicidade de uma rija e jubilosa cruzada."}, {"n": 614, "chapter": "Ambição", "text": "Jogas a vida pela honra... Joga a honra pela alma."}, {"n": 615, "chapter": "Ambição", "text": "Pela Comunhão dos Santos, tens de sentir-te muito unido aos teus irmãos. Defende sem medo essa bendita unidade! - Se te encontrasses só, as tuas nobres ambições estariam condenadas ao fracasso: uma ovelha isolada é quase sempre uma ovelha perdida."}, {"n": 616, "chapter": "Ambição", "text": "Achei graça à tua veemência. Perante a falta de meios materiais de trabalho e sem a ajuda de outros, comentavas: “Eu só tenho dois braços, mas às vezes sinto a impaciência de ser um monstro com cinqflenta, para semear e apanhar a colheita”. - Pede ao Espírito Santo essa eficácia... Ele ta concederá!"}, {"n": 617, "chapter": "Ambição", "text": "Chegaram-te às mãos dois livros em russo, e deu-te uma vontade enorme de estudar essa língua. Imaginavas a beleza de morrer como grão de trigo nessa nação, agora tão árida, que com o tempo dará crescidos trigais... - Acho bem as tuas ambições. Mas, agora, dedica-te ao pequeno dever, à grande missão de cada dia, ao teu estudo, ao teu trabalho, ao teu apostolado e, sobretudo, à tua formação, que pelo muito que ainda deves podar - não é tarefa nem menos heróica nem menos bela."}, {"n": 618, "chapter": "Ambição", "text": "Para que serve um estudante que não estuda?"}, {"n": 619, "chapter": "Ambição", "text": "Quando estudar se torne para ti uma encosta muito árdua, oferece a Jesus esse esforço. Dize-Lhe que continuas debruçado sobre os livros para que a tua ciência seja a arma com que combatas os seus inimigos e ganhes muitas almas para Ele... Então poderás ter a certeza de que o teu estudo leva caminho de converter-se em oração."}, {"n": 620, "chapter": "Ambição", "text": "Se perdes as horas e os dias, se matas o tempo, abres as portas da tua alma ao demônio. Esse comportamento equivale a sugerir-lhe: “Aqui tens a tua casa”."}, {"n": 621, "chapter": "Ambição", "text": "Dizes que é difícil não perder o tempo - Concedo-te... Mas olha que o inimigo de Deus, os “outros”, não descansam. Além disso, lembra-te desta verdade que Paulo, um campeão do amor de Deus, proclama: “Tempus breve est!” - esta vida escapa-nos das mãos, e não existe a possibilidade de recuperá-la."}, {"n": 622, "chapter": "Ambição", "text": "Tens consciência do que significa seres ou não uma pessoa com sólida preparação? - Quantas almas!... - E agora deixarás de estudar ou de trabalhar com perfeição?"}, {"n": 623, "chapter": "Ambição", "text": "Existem duas maneiras de alcançar altura: uma - cristã -, pelo esforço nobre e galhardo de subir para servir os demais homens; e outra - pagã -, pelo esforço baixo e ignóbil de afundar o próximo."}, {"n": 624, "chapter": "Ambição", "text": "Não me afirmes que vives de cara para Deus, se não te esforças por viver - sempre e em tudo - com sincera e clara fraternidade de cara para os homens, para qualquer homem."}, {"n": 625, "chapter": "Ambição", "text": "Os “ambiciosos” - de pequenas e miseráveis ambições pessoais - não entendem que os amigos de Deus aspirem a “alguma coisa”, por serviço e não por “ambição”."}, {"n": 626, "chapter": "Ambição", "text": "Uma ansiedade te consome: a pressa em forjar-te logo, em moldar-te, em martelar-te e polir-te, para chegares a ser a peça harmônica que cumpra eficazmente a tarefa prevista, a missão atribuída..., no grande campo de Cristo. Rezo muito por ti, para que esse anseio seja acicate na hora do cansaço, do malogro, da obscuridade..., porque “a missão atribuída no grande campo de Cristo” não pode mudar."}, {"n": 627, "chapter": "Ambição", "text": "Precisas lutar decididamente contra essa falsa humildade - comodismo, é como deverias chamá-la -, que te impede de comportar-te com a maturidade do bom filho de Deus: tens de crescer! - Não te causa vergonha ver que os teus irmãos mais velhos levam anos de trabalho abnegado, e que tu ainda não és capaz - não queres ser capaz - de mexer um dedo para ajudá-los?"}, {"n": 628, "chapter": "Ambição", "text": "Deixa que a tua alma se consuma em desejos... Desejos de amor, de esquecimento próprio, de santidade, de Céu... Não te detenhas a pensar se chegarás alguma vez a vê-los realizados, como te sugerirá algum sisudo conselheiro; aviva-os cada vez mais, porque o Espírito Santo diz que Lhe agradam os “varões de desejos”. Desejos operantes, que tens de pôr em prática na tarefa cotidiana."}, {"n": 629, "chapter": "Ambição", "text": "Se o Senhor te chamou “amigo”, tens de responder à chamada, tens de caminhar com passo rápido, com a urgência necessária: ao passo de Deus! Caso contrário, corres o risco de ficar em simples espectador."}, {"n": 630, "chapter": "Ambição", "text": "Esquece-te de ti mesmo... Que a tua ambição seja a de não viveres senão para os teus irmãos, para as almas. para a Igreja; numa palavra, para Deus."}, {"n": 631, "chapter": "Ambição", "text": "No meio do júbilo da festa, em Caná, apenas Maria repara na falta de vinho... Até aos menores detalhes de serviço chega a alma se, como Ela, vive apaixonadamente pendente do próximo por Deus"}, {"n": 632, "chapter": "Hipocrisia", "text": "Aos que a cultivam, a hipocrisia faz levar sempre uma vida de mortificação amarga e rancorosa."}, {"n": 633, "chapter": "Hipocrisia", "text": "Diante de propostas como a de Herodes - “Ide e informai-vos pontualmente do que há sobre esse menino e, tendo-o achado, avisai-me para que eu também vá adorá-lo” -, peçamos ao Espírito Santo a sua ajuda, para que nos guarde das “proteções ou das boas promessas” de aparentes bem-intencionados. - Não nos faltará a luz do Paráclito se, como os Magos, procurarmos a verdade e falarmos com sinceridade."}, {"n": 634, "chapter": "Hipocrisia", "text": "Então há quem se incomode porque dizes as coisas claramente? - Talvez estejam procedendo com a consciência turva, e precisem encobri-la desse modo. - Persevera na tua conduta, para ajudá-los a reagir."}, {"n": 635, "chapter": "Hipocrisia", "text": "Enquanto interpretas com má fé as intenções alheias, não terás o direito de exigir compreensão para ti mesmo."}, {"n": 636, "chapter": "Hipocrisia", "text": "Falas continuamente de que é preciso corrigir, de que é preciso reformar. Muito bem...: reforma-te tu! - que boa falta te faz -, e já terás começado a reforma. - Enquanto não o fizeres, não darei crédito às tuas proclamações de renovação."}, {"n": 637, "chapter": "Hipocrisia", "text": "Há alguns tão farisaicos que... se escandalizam quando vêem que outras pessoas repetem exatamente o mesmo que antes escutaram dos seus lábios."}, {"n": 638, "chapter": "Hipocrisia", "text": "És tão intrometido, que parece que não te ocupa outra missão que a de bisbilhotar na vida do próximo. E quando, por fim, tropeças-te com um homem digno, de vontade enérgica, que te deu um “basta”, lamentas-te publicamente como se tivesse ofendido. - Até aí chega o teu impudor e a tua consciência deformada..., e a de muitos."}, {"n": 639, "chapter": "Hipocrisia", "text": "Numa só jogada, pretendes apropriar-te da “honradez” da opinião verdadeira e das “vantagens” ignóbeis da opinião oposta... - Isso, em qualquer língua, chama-se duplicidade."}, {"n": 640, "chapter": "Hipocrisia", "text": "Que bondade a daqueles!!... - Estão dispostos a “desculpar” o que só merece louvor."}, {"n": 641, "chapter": "Hipocrisia", "text": "Velho ardil, o do perseguidor que se diz perseguido... - O povo denunciou-o há muito tempo em claro adágio: atirar a pedra e sair gemendo."}, {"n": 642, "chapter": "Hipocrisia", "text": "Será verdade que - infelizmente - são numerosos os que faltam à justiça com as suas calúnias e, depois, invocam a caridade e a honradez, para que a sua vítima não possa defender-se?"}, {"n": 643, "chapter": "Hipocrisia", "text": "Triste ecumenismo esse que anda na boca de católicos que maltratam outros católicos!"}, {"n": 644, "chapter": "Hipocrisia", "text": "Que errônea visão da objetividade! Focalizam as pessoas ou as iniciativas com as lentes deformadas dos seus próprios defeitos e, com ácida desvergonha, criticam ou se permitem vender conselhos. - Propósito concreto: ao corrigir ou aconselhar, falar na presença de Deus, aplicando essas mesmas palavras à nossa conduta."}, {"n": 645, "chapter": "Hipocrisia", "text": "Não recorras nunca ao método - sempre deplorável - de organizar agressões caluniosas contra ninguém... Muito menos em nome de motivos moralizantes, que nunca justificam uma ação imoral."}, {"n": 646, "chapter": "Hipocrisia", "text": "Não há isenção nem intenção reta nos teus conselhos, se te incomoda, ou consideras uma prova de desconfiança, que sejam ouvidas também outras pessoas de comprovada formação e reta doutrina. - Se é certo que, como asseguras, te interessa o bem das almas ou a afirmação da verdade, porque te ofendes?"}, {"n": 647, "chapter": "Hipocrisia", "text": "Maria nem a José comunica o mistério que Deus operou nEla. - para que nos habituemos a não ser levianos, a dar rumo devido às nossas alegrias e às nossas tristezas: sem procurar que nos exaltem ou que se compadeçam de nós. “Deo omnis gloria!” - tudo para Deus!"}, {"n": 648, "chapter": "Vida interior", "text": "Consegue mais aquele que importuna mais de perto... Por isso, aproxima-te de Deus: empenha-te em ser santo."}, {"n": 649, "chapter": "Vida interior", "text": "Gosto de comparar a vida interior a uma veste, à veste nupcial de que fala o Evangelho. O tecido compõe-se de cada um dos hábitos ou práticas de piedade que, como fibras, dão vigor ao pano. E assim como se despreza um terno com um rasgão, mesmo que o resto esteja em boas condições, se fazes oração, se trabalhas..., mas não és penitente - ou ao contrário -, a tua vida interior não é, por assim dizer, cabal!"}, {"n": 650, "chapter": "Vida interior", "text": "Vamos ver quando acabas de entender que o teu único caminho possível é procurar seriamente a santidade! Decide-te - não te ofendas - a tomar Deus a sério. Essa tua leviandade, se não a combates, pode terminar numa triste farsa blasfema."}, {"n": 651, "chapter": "Vida interior", "text": "Umas vezes, deixas que salte o teu mau caráter, esse que em mais de uma ocasião aflora com uma dureza disparatada. Outras, não te ocupas em compor o teu coração e a tua cabeça, a fim de que sejam aposento regalado para a Santíssima Trindade... E sempre, acabas por ficar um tanto longe de Jesus, a quem conheces pouco... - Assim, nunca terás vida interior."}, {"n": 652, "chapter": "Vida interior", "text": "“Iesus Christus, perfectus Deus, perfectus Homo” - Jesus Cristo, perfeito Deus e perfeito Homem. São muitos os cristãos que seguem a Cristo, pasmados ante a sua divindade, mas O esquecem como Homem..., e fracassam no exercício das virtudes sobrenaturais - apesar de toda a armação externa de piedade -, porque não fazem nada por adquirir as virtudes humanas."}, {"n": 653, "chapter": "Vida interior", "text": "Remédio para tudo: santidade pessoal! - Por isso os santos estiveram cheios de paz, de fortaleza, de alegria, de segurança."}, {"n": 654, "chapter": "Vida interior", "text": "Até agora não tinhas compreendido a mensagem que nós, os cristãos, trazemos aos demais homens: a escondida maravilha da vida interior. Que mundo novo estás colocando diante deles!"}, {"n": 655, "chapter": "Vida interior", "text": "Quantas coisas novas descobriste! - No entanto, às vezes és um ingênuo, e pensas que já viste tudo, que já estás a par de tudo... Depois, tocas com as mãos a riqueza única e insondável dos tesouros do Senhor, que sempre te mostrará “coisas novas”, se corresponderes com amor e delicadeza; e então compreendes que estás no princípio do caminho, porque a santidade consiste na identificação com Deus, com esse nosso Deus que é infinito, inesgotável."}, {"n": 656, "chapter": "Vida interior", "text": "É com o Amor, mais do que com o estudo, que se chegam a compreender as “coisas de Deus”. Por isso, tens que trabalhar, tens que estudar, tens que aceitar a doença, tens que ser sóbrio... amando!"}, {"n": 657, "chapter": "Vida interior", "text": "Para o teu exame diário; deixei passar alguma hora sem falar com meu Pai - Deus?... Conversei com Ele, com amor de filho? - Podes!"}, {"n": 658, "chapter": "Vida interior", "text": "Não queiramos enganar-nos... - Deus não é uma sombra, um ser longínquo, que nos cria e depois nos abandona; não é um amo que se vai e não volta mais. Ainda que não o percebamos com os nossos sentidos, a sua existência é muito mais verdadeira que a de todas as realidades que tocamos e vemos. Deus está aqui, conosco, presente, vivo. Ele nos vê, nos ouve, nos dirige, e contempla nossas menores ações, as nossas intenções mais escondidas. Acreditamos nisto..., mas vivemos como se Deus não existisse! Porque não temos para Ele nem um pensamento, nem uma palavra; poque não lhe obedecemos, nem tratamos de dominar nossas paixões; porque não lhe obedecemos, nem tratamos de dominar as nossa paixões; porque não Lhe manifestamos amor, nem O desagravamos... Vamos continuar a viver com uma fé morta?"}, {"n": 659, "chapter": "Vida interior", "text": "Se tivesses presença de Deus, quantas atuações “irremediáveis” remediarias!"}, {"n": 660, "chapter": "Vida interior", "text": "Como podes viver a presença de Deus, se não fazes mais do que olhar para toda a parte?... - Estás como que bêbado de futilidades."}, {"n": 661, "chapter": "Vida interior", "text": "É possível que esta palavra te assuste: meditação. - Recorda-te livros de capas pretas e vermelhas, ruídos de suspiros ou de rezas como cantilenas rotineiras... Mas isso não é meditação. Meditar é considerar, contemplar que Deus é Pai, e tu, seu filho, necessitado de ajuda; e depois dar-Lhe graças pelo que já te concedeu e por tudo o que te dará."}, {"n": 662, "chapter": "Vida interior", "text": "O único meio de conhecer Jesus: chegar ao trato com Ele! NEle encontrarás sempre um Pai, um Amigo, um Conselheiro e um Colaborador para todas as atividades nobres da tua vida cotidiana... - E, com o trato íntimo, nascerá o Amor."}, {"n": 663, "chapter": "Vida interior", "text": "Se és tenaz em assistir diariamente a umas aulas, só porque ali adquires uns conhecimentos... muito limitados, como é que tens constância para freqflentar o Mestre, sempre desejoso de ensinar-te a ciência da vida interior, de sabor e conteúdo eternos?"}, {"n": 664, "chapter": "Vida interior", "text": "Que vale o maior homem, ou o maior galardão da terra, comparados com Jesus Cristo, que está sempre à tua espera?"}, {"n": 665, "chapter": "Vida interior", "text": "Um tempo de meditação diária - união de amizade com Deus - é coisa própria de pessoas que sabem aproveitar retamente a sua vida; de cristãos conscientes, que agem com coerência."}, {"n": 666, "chapter": "Vida interior", "text": "Os namorados não sabem dizer adeus um ao outro: acompanham-se sempre. Tu e eu, amamos assim o Senhor?"}, {"n": 667, "chapter": "Vida interior", "text": "Não viste como, para agradar e bem parecer, se arrumam os que se amam? - Assim deves arrumar e compor a tua alma."}, {"n": 668, "chapter": "Vida interior", "text": "Em geral, a graça atua como a natureza: por graus. - Não podemos propriamente antecipar-nos à ação da graça: mas, naquilo que depende de nós, temos de preparar o terreno e cooperar, quando Deus no-La concede. É mister conseguir que as almas apontem muito alto: empurrá-las para o ideal de Cristo; levá-las até às últimas conseqflências, sem atenuantes nem paliativos de espécie alguma, sem esquecer que a santidade não é primordialmente questão de braços. Normalmente, a graça segue as suas horas, e não gosta de violências. Fomenta as tuas santas impaciências..., mas não percas a paciência."}, {"n": 669, "chapter": "Vida interior", "text": "Corresponder à graça divina - perguntas - é uma questão de justiça..., de generosidade...? - De Amor!"}, {"n": 670, "chapter": "Vida interior", "text": "“Os assuntos fervem na minha cabeça nos momentos mais inoportunos...”, dizes. Por isso te recomendei que tratasse de conseguir uns tempos de silêncio interior..., e a guarda dos sentidos internos e externos."}, {"n": 671, "chapter": "Vida interior", "text": "“Fica conosco, porque escureceu...” Foi eficaz a oração de Cléofas e do seu companheiro. - Que pena se tu e eu não soubéssemos `deter’ Jesus que passa! Que dor, se não Lhe pedimos que fique!"}, {"n": 672, "chapter": "Vida interior", "text": "Esses minutos diários de leitura do Novo Testamento que te aconselhei - metendo-te e participando no conteúdo de cada cena, como um protagonista mais -, são para que encarnes, para que “cumpras” o Evangelho na tua vida... e para que o “faças cumprir”."}, {"n": 673, "chapter": "Vida interior", "text": "Antes “divertias-te” muito... - Mas agora, que trazes Cristo em ti, a tua vida encheu-se de sincera e comunicativa alegria. Por isso atrais outros. - Freqflenta - O mais, para chegares a todos."}, {"n": 674, "chapter": "Vida interior", "text": "Cuidado: segura-te bem! - Procura que, ao elevares tu a temperatura do ambiente que te rodeia, não baixe a tua."}, {"n": 675, "chapter": "Vida interior", "text": "Acostuma-te a referir tudo a Deus."}, {"n": 676, "chapter": "Vida interior", "text": "Não observas como muitos dos teus companheiros sabem demonstrar grande delicadeza e sensibilidade, no seu trato com as pessoas que amam: a namorada, a mulher, os filhos, a família...? - Tens que dizer-lhes - e exigir isso de ti mesmo! - que o Senhor não merece menos: que O tratem assim! E aconselha-os, além disso, a continuarem com essa delicadeza e essa sensibilidade, mas vividas com Ele e por Ele, e alcançarão uma felicidade nunca dantes sonhada, também aqui na terra."}, {"n": 677, "chapter": "Vida interior", "text": "O Senhor semeou na tua alma boa semente. E valeu-se - para essa sementeira de vida eterna - do meio poderoso da oração: porque tu não podes negar que, muitas vezes, estando diante do Sacrário, cara a cara, Ele te fez ouvir - no fundo da tua alma - que te queria para Si, que tinhas que deixar tudo... Se agora negas isso, és um miserável traidor; e, se o esqueceste, és um ingrato. Valeu-se também - não duvides disso, como não duvidaste até agora - dos conselhos ou insinuações sobrenaturais do teu Diretor, que te repetiu insistentemente palavras que não deves passar por alto; e valeu-se no começo, além disso - sempre para depositar a boa semente na tua alma -, daquele amigo nobre, sincero, que te disse verdades fortes, cheias de amor de Deus. - Mas, com ingênua surpresa, descobriste que o inimigo semeou joio na tua alma. E que continua a semeá-lo, enquanto tu dormes comodamente e amoleces na tua vida interior. - Esta, e não outra, é a razão pela qual encontras na tua alma plantas pegajosas, mundanas, que de vez em quando parece que vão afogar o grão de trigo bom que recebeste... - Arranca-as de uma vez! Basta-te a graça de Deus. Não temas que deixem um vazio, uma ferida... O Senhor colocará aí uma nova semente sua: amor de Deus, caridade fraterna, ânsias de apostolado... E, passado o tempo, não permanecerá nem o menor rasto do joio - desde que agora, que estás em tempo, o extirpes pela raiz; e melhor, se não dormes e vigias de noite o teu campo."}, {"n": 678, "chapter": "Vida interior", "text": "Felizes aquelas almas bem-aventuradas que, quando ouvem falar de Jesus - e Ele nos fala constantemente -, O reconhecem na hora como o Caminho, a Verdade e a Vida! - Bem sabes que, quando não participamos dessa felicidade, é porque nos faltou a determinação de segui-Lo."}, {"n": 679, "chapter": "Vida interior", "text": "Mais uma vez sentiste Cristo muito perto. - E mais uma vez compreendeste que tens que fazer tudo por Ele."}, {"n": 680, "chapter": "Vida interior", "text": "Aproxima-te mais do Senhor..., mais! - Até que se converta em teu Amigo, teu Confidente, teu Guia."}, {"n": 681, "chapter": "Vida interior", "text": "Cada dia te notas mais metido mais Deus..., dizes. - Então, cada dia estarás mais perto dos teus irmãos."}, {"n": 682, "chapter": "Vida interior", "text": "Se até agora, antes de encontrá-lo, querias correr na tua vida com os olhos abertos, para estares a par de tudo; a partir deste momento..., toca a correr com o olhar limpo!, para veres com Ele o que verdadeiramente te interessa."}, {"n": 683, "chapter": "Vida interior", "text": "Quando há vida interior, recorre-se a Deus, perante qualquer contrariedade, com a espontaneidade com que o sangue acode à ferida."}, {"n": 684, "chapter": "Vida interior", "text": "“Isto é o meu Corpo...”, e Jesus imolou-se, ocultando-se sob as espécies de pão. Agora está ali, com a sua Carne e com o Seu Sangue, com a sua Alma e com a sua Divindade: exatamente como no dia em que Tomé meteu os dedos em suas Chagas gloriosas. Contudo, em tantas ocasiões, tu passas ao largo, em esboçar sequer um breve cumprimento de simples cortesia, como fazes com qualquer pessoa conhecida que encontras de passagem. - Tens bastante menos fé que Tomé!"}, {"n": 685, "chapter": "Vida interior", "text": "Se, para libertar-te, tivessem posto na cadeia um teu amigo íntimo, não procurarias ir visitá-lo, conversar um pouco com ele, levar-lhe presentes, calor de amizade, consolo?... E, se essa conversa com o encarcerado fosse para salvar-te a ti de um mal e proporcionar-te um bem..., tu a abandonarias? E se, em vez de um amigo, se tratasse do teu próprio pai ou do teu irmão? - Então!"}, {"n": 686, "chapter": "Vida interior", "text": "Jesus ficou na Hóstia Santa por nós!: para permanecer ao nosso lado, para amparar-nos, para guiar-nos. - E amor somente com amor se paga. - Como não havemos de ir ao Sacrário, todos os dias, nem que seja apenas por uns minutos, para levar-Lhe a nossa saudação e o nosso amor de filhos e de irmãos?"}, {"n": 687, "chapter": "Vida interior", "text": "Viste a cena? - Um sargento qualquer ou um tenentinho de pouco comando...; pela frente, aproxima-se de um pracinha bem-apessoado, de condições incomparavelmente melhores que as dos oficiais, e não faltam nem a continência nem a resposta. - Medita no contraste. - Lá do Sacrário dessa igreja, Cristo - perfeito Deus, perfeito Homem -, que morreu por ti na Cruz, e que te dá todos os bens de que necessitas..., aproxima-se de ti. E tu passas sem reparar."}, {"n": 688, "chapter": "Vida interior", "text": "Começaste com a tua visita diária... - Não me admira que me digas: começo a amar com loucura a luz do Sacrário."}, {"n": 689, "chapter": "Vida interior", "text": "Que não faltes diariamente um “Jesus, eu te amo” e uma comunhão espiritual - ao menos -, como desagravo por todas as profanações e sacrilégios que Ele sofre por estar conosco."}, {"n": 690, "chapter": "Vida interior", "text": "Não se cumprimentam e se tratam com cordialidade todas as pessoas queridas? - Pois bem, vamos tu e eu cumprimentar - muitas vezes ao dia - Jesus, Maria e José, e o nosso Anjo da Guarda."}, {"n": 691, "chapter": "Vida interior", "text": "Deves ter uma devoção intensa à Nossa Mãe. Ela sabe corresponder com primor às delicadezas que lhe manifestamos. Além disso, se rezas o terço todos os dias, com espírito de fé e amor, a Senhora se encarregará de levar-te muito longe pelo caminho do seu Filho."}, {"n": 692, "chapter": "Vida interior", "text": "Sem o auxílio de Nossa Mãe, como havemos de manter-nos firmes na luta diária? - Procuras esse auxílio constantemente?"}, {"n": 693, "chapter": "Vida interior", "text": "O Anjo da Guarda acompanha-nos sempre como testemunha especialmente qualificada. Será ele quem, no teu juízo particular, recordará as delicadezas que tiveres tido com Nosso Senhor, ao longo da tua vida. Mais ainda: quando te sentires perdido pelas terríveis acusações do inimigo, o teu Anjo apresentará aqueles impulsos íntimos - e talvez esquecidos por ti mesmo -, aquelas manifestações de amor que tenhas dedicado a Deus Pai, a Deus Filho, a Deus Espírito Santo. Por isso, não esqueças nunca o teu Anjo da Guarda, e esse Príncipe do Céu não te abandonará agora, nem no momento decisivo."}, {"n": 694, "chapter": "Vida interior", "text": "As tuas comunhões eram muito frias: prestavas pouca atenção ao Senhor; qualquer bagatela te distraia... - Mas, desde que pensas - nesse teu íntimo colóquio com Deus - que estão presentes os Anjos, a tua atitude mudou...: “Que não me vejam assim!”, dizes para ti mesmo... - E olha como, com a força do “que vão dizer?” - desta vez, para bem -, avançaste um pouquinho em direção ao Amor."}, {"n": 695, "chapter": "Vida interior", "text": "Sempre que te vejas com o coração seco, sem saber o que dizer, recorre com confiança à Virgem Santíssima. Dize-lhe: Minha Mãe Imaculada, intercedei por mim. Se a invocares com fé, Ela te fará saborear - no meio dessa secura - a proximidade de Deus."}, {"n": 696, "chapter": "Soberba", "text": "Arrancar pela raiz o amor próprio e meter o amor a Jesus Cristo: nisto radica o segredo da eficácia e da felicidade."}, {"n": 697, "chapter": "Soberba", "text": "Embora afirmes que O segues, de uma maneira ou de outra sempre pretendes ser “tu” mesmo a agir, segundo os “teus” planos e unicamente com as “tuas” forças. - Mas o Senhor disse: “Sine me nihil!” - sem Mim, nada podes fazer."}, {"n": 698, "chapter": "Soberba", "text": "Ignoraram isso que tu chamas o teu “direito”, que eu te traduzi como o teu “direito à soberba”... Pobre espantalho! - Sentiste, porque não podias defender - te - o atacante era poderoso -, a dor de cem bofetões. - E, apesar de tudo, não aprendes a humilhar-te. Agora é a tua consciência que te argúi: chama-te soberbo... e covarde. - Dá graças a Deus, porque já vais entrevendo o teu “dever da humildade”."}, {"n": 699, "chapter": "Soberba", "text": "Estás cheio de ti, de ti, de ti... - E não será eficaz enquanto não te deixares invadir por Ele, por Ele, por Ele, atuando “in nomine Domini” - em nome e com a força de Deus."}, {"n": 700, "chapter": "Soberba", "text": "Como pretendes seguir a Cristo, se giras somente em volta de ti mesmo?"}, {"n": 701, "chapter": "Soberba", "text": "Uma preocupação impaciente e desordenada por subir profissionalmente pode disfarçar o amor próprio sob o pretexto de “servir as almas”. Com falsidade - não tiro uma letra -, forjamos a justificativa de que não devemos desaproveitar certas conjunturas, certas circunstâncias favoráveis... Volve os teus olhos para Jesus: Ele é “o Caminho”. Também durante os seus anos escondidos surgiram conjunturas e circunstâncias “muito favoráveis”, para antecipar a sua vida pública. Aos doze anos, por exemplo, quando os doutores da lei se admiraram das suas perguntas e das suas respostas... Mas Jesus Cristo cumpre a Vontade de seu Pai, e espera: obedece! - Sem perderes essa santa ambição de levar o mundo inteiro a Deus, quando se insinuarem essas iniciativas - quem sabe, ânsias de deserção -, lembra-te de que também te toca a ti obedecer e ocupar-te dessa tarefa obscura, pouco brilhante, enquanto o Senhor não te pedir outra coisa: Ele tem os seus tempos e as suas sendas."}, {"n": 702, "chapter": "Soberba", "text": "Fátuos e soberbos, é assim que se revelam todos aqueles que abusam da sua situação de privilégio - dada pelo dinheiro, pela linhagem, pelo grau hierárquico, pelo cargo, pela inteligência... - para humilhar os menos favorecidos."}, {"n": 703, "chapter": "Soberba", "text": "A soberba, mais cedo ou mais tarde, acaba por humilhar, diante dos outros, o homem “mais homem”, que atua como uma marionete vaidosa e sem cérebro, movida pelos fios que satanás aciona."}, {"n": 704, "chapter": "Soberba", "text": "Por presunção ou por simples vaidade, muitos mantêm um “mercado negro”, para fazer subir artificialmente os seus próprios valores pessoais."}, {"n": 705, "chapter": "Soberba", "text": "Cargos... Em cima ou em baixo? - Tanto te faz!... Tu vieste - assim o garantes - para ser útil, para servir, com uma disponibilidade total: então porta-te em conseqflência."}, {"n": 706, "chapter": "Soberba", "text": "Ficas falando, criticando... Parece que, sem ti, nada se faz bem. - Não te zangues se te digo que te comportas como um déspota arrogante."}, {"n": 707, "chapter": "Soberba", "text": "Se com lealdade, caridosamente, um bom amigo te faz ver, a sós, pontos que desfeiam a tua conduta, levanta-se dentro de ti a convicção de que se engana: não te compreende. Com esse falso convencimento, filho do teu orgulho, sempre serás incorrigível. - Dás-me pena: falta-te decisão para procurar a santidade."}, {"n": 708, "chapter": "Soberba", "text": "Malicioso, suspicaz, complicado, desconfiado, receoso..., adjetivos todos que mereces, ainda que te incomodem. - Retifica! Por que os outros hão de ser sempre maus... e tu bom?"}, {"n": 709, "chapter": "Soberba", "text": "Encontras-te só..., queixas-te..., tudo te incomoda. - Porque o teu egoísmo te isola dos teus irmãos, e porque não te aproximas de Deus."}, {"n": 710, "chapter": "Soberba", "text": "Sempre pretendo que façam caso de ti ostensivamente!... Mas, sobretudo, que façam mais caso de ti do que dos outros!"}, {"n": 711, "chapter": "Soberba", "text": "Por que ficas imaginando que tudo o que te dizem tem segunda intenção?... Com a tua suscetibilidade, estás limitando continuamente a ação da graça, que te chega por meio da palavra, não tenhas dúvida, dos que lutam por ajustar as suas obras ao ideal de Cristo."}, {"n": 712, "chapter": "Soberba", "text": "Enquanto continuares persuadido de que os outros têm que viver sempre pendentes de ti, enquanto não te decidires a servir - a ocultar-te e desaparecer -, o convívio com os teus irmãos, com os teus colegas, com os teus amigos, será forte contínua de desgostos, de mau humor... - de soberba."}, {"n": 713, "chapter": "Soberba", "text": "Detesta a jactância. - Repudia a vaidade. - Combate o orgulho, cada dia, a cada instante."}, {"n": 714, "chapter": "Soberba", "text": "Os pobrezinhos dos soberbos sofrem por mil e uma pequenas tolices, que o seu amor próprio agiganta, e que aos outros passam despercebidas."}, {"n": 715, "chapter": "Soberba", "text": "Julgas que os outros nunca tiveram vinte anos? Julgas que nunca estiveram sitiados pela família, como menores de idade? Julgas que lhes foram poupados os problemas - mínimos ou não tão mínimos - com os quais tropeças?... Não. Eles passaram agora, e fizeram-se homens maduros - com a ajuda da graça -, espezinhando o seu eu com perseverança generosa, cedendo no que se podia ceder, e mantendo-se leais, sem arrogância e sem ferir - com serena humildade -, quando não se podia."}, {"n": 716, "chapter": "Soberba", "text": "Ideologicamente, és muito católico. Agrada-te o ambiente dessa Residência universitária... Pena que a Missa não seja ao meio-dia, e as aulas à tarde, para estudares depois de jantar, saboreando um ou dois cálices de conhaque! - Esse teu “catolicismo” não corresponde à verdade, fica em simples aburguesamento. - Não compreendes que não se pode pensar assim na tua idade? Sai da tua poltronice, da tua egolatria..., e ajusta-te às necessidades dos outros, à realidade que te rodeia, e viverás a sério o catolicismo."}, {"n": 717, "chapter": "Soberba", "text": "“Esse santo - dizia aquele - que tinha doado a imagem exposta ao culto -... deve-me tudo o que é”. Não penses que é uma caricatura: também tu consideras - ao menos, é o que parece pelo teu comportamento - que cumpres com Deus, por trazeres umas medalhas ou por uma práticas de piedade, mais ou menos rotineiras."}, {"n": 718, "chapter": "Soberba", "text": "Que vejam as minhas boas obras!... - Mas não percebes que parece que as levas num cesto de bugigangas, para que contemplem as tuas qualidades? Além disso, não te esqueças da segunda parte do que Jesus mandou: “e glorifiquem o vosso Pai que está nos céus”."}, {"n": 719, "chapter": "Soberba", "text": "“A mim mesmo, com a admiração que me devo”. - Foi o que escreveu na primeira página de um livro. E o mesmo poderiam estampar muitos outros coitados, na última página da sua vida. Que pensa se tu e eu vivêssemos ou terminássemos assim! - Vamos fazer um exame sério."}, {"n": 720, "chapter": "Soberba", "text": "Não tomes nunca uma atitude de suficiência perante as coisas da Igreja, nem perante os homens, teus irmãos... Mas, em contrapartida, essa atitude pode ser necessária na atuação social, quando se trata de defender os interesses de Deus e das almas, porque já não se trata de suficiência, mas de fé e fortaleza, que viveremos com serena e humilde segurança."}, {"n": 721, "chapter": "Soberba", "text": "É indiscreto, pueril e chocho dizer amabilidades dos outros ou elogiar as suas qualidades diante dos interessados. - Assim se fomenta a vaidade, e se corre o risco de “roubar” glória a Deus, a Quem tudo se deve."}, {"n": 722, "chapter": "Soberba", "text": "Procura que a tua boa intenção esteja sempre acompanhada pela humildade. Porque, com freqflência, às boas intenções, se unem a dureza no juízo, uma quase incapacidade de ceder, e um certo orgulho pessoal, nacional ou de grupo."}, {"n": 723, "chapter": "Soberba", "text": "Não desanimes com os teus erros: reage. - A esterilidade não é tanto conseqflência das faltas - sobretudo se nos arrependemos - quanto da soberba."}, {"n": 724, "chapter": "Soberba", "text": "Se caíste, levanta-te com mais esperança... Só o amor próprio não compreende que o erro, quando é retificado, ajuda a conhecer-se e a humilhar - se."}, {"n": 725, "chapter": "Soberba", "text": "“Não servimos para nada”. - Afirmação pessimista e falsa. - Se se quer, com a graça de Deus - requisito prévio e fundamental -, pode-se chegar a servir, como bom instrumento, em muitos empreendimentos."}, {"n": 726, "chapter": "Soberba", "text": "Fez-me pensar a frase dura, mas exata, daquele homem de Deus, ao contemplar a arrogância daquela criatura; “Veste-se com a mesma pele do diabo, a soberba”. E senti na alma, por contraste, o desejo sincero de me revestir da virtude que Jesus Cristo pregou “quia mitis sum et humilis corde” -; e que atraiu o olhar da Trindade Santíssima sobre a sua Mãe e nossa Mãe: a humildade, o saber-nos e sentir-nos nada."}, {"n": 727, "chapter": "Amizade", "text": "Sempre que te custe fazer um favor, um serviço a uma pessoa, pensa que ela é filha de Deus, lembra-te de que o Senhor mandou que nos amássemos uns aos outros. - Mais ainda: aprofunda cotidianamente neste preceito evangélico; não fiques na superfície. Tira as conseqflências - é muito fácil -, e acomoda a tua conduta de cada instante a esse apelo."}, {"n": 728, "chapter": "Amizade", "text": "Vive-se de modo tão precipitado, que a caridade cristã passou a constituir um fenômeno estranho neste nosso mundo; por mais que - ao menos nominalmente - se pregue a Cristo... - Admito. Mas, que fazes tu que, como católico, tens de identificar-te com Ele e seguir as suas pegadas? Porque Ele nos indicou que temos de ir ensinar a sua doutrina a todas as gentes - a todas! - e em todos os tempos."}, {"n": 729, "chapter": "Amizade", "text": "Os homens - como aconteceu sempre na história - coligam as suas vidas para cumprirem uma missão e um destino coletivos. - Será que vale menos, para os homens e mulheres de hoje, o “único destino” da felicidade eterna?"}, {"n": 730, "chapter": "Amizade", "text": "Compreendeste o sentido da amizade quando chegaste a sentir-te como o pastor de um pequenino rebanho, que tinhas abandonado, e que agora procuras reunir novamente, ocupando-te em servir a cada um."}, {"n": 731, "chapter": "Amizade", "text": "Não podes ser apenas um elemento passivo. Tens de converter-te em verdadeiro amigo dos teus amigos: “ajudá-los”. Primeiro, com o exemplo da tua conduta. E depois, com o teu conselho e com o ascendente que a intimidade dá."}, {"n": 732, "chapter": "Amizade", "text": "Entusiasmou-te esse espírito de irmandade e companheirismo, que descobriste inesperadamente... - Claro: é coisa que tinhas sonhado com tanta força, mas que nunca tinhas visto. Não o tinhas visto porque os homens se esquecem de que são irmãos de Cristo, desse amável Irmão nosso, que entregou a sua vida pelos outros, por todos e por cada um, sem condições."}, {"n": 733, "chapter": "Amizade", "text": "Tiveste a grande sorte de encontrar mestres de verdade, amigos autênticos, que te ensinaram sem reservas tudo quanto quiseste saber; não precisaste de artimanhas para lhes “roubar” a sua ciência, porque te indicaram o caminho mais fácil, embora a eles lhe tenha custado duro trabalho e sofrimentos descobri-lo... Agora, toca-te a ti fazer outro tanto, com este, com aquele, com todos!."}, {"n": 734, "chapter": "Amizade", "text": "Medita bem nisto e tira as conseqflências: essas pessoas, que te acham antipático, deixarão de pensar assim quando perceberem que “verdadeiramente” lhes queres bem. Depende de ti."}, {"n": 735, "chapter": "Amizade", "text": "Não basta que sejas bom: tens de parecê-lo. Que dirias de uma roseira que não produzisse senão espinhos?"}, {"n": 736, "chapter": "Amizade", "text": "Para caldear os tíbios, é preciso rodeá-los com o fogo do entusiasmo. Muitos poderiam gritar-nos: Não lamenteis o meu estado! Ensinai-me o caminho para sair desta situação, que tanto vos entristece!"}, {"n": 737, "chapter": "Amizade", "text": "O dever da fraternidade, para com todas as almas, far-te-á exercitar “o apostolado das coisas pequenas”, sem que o notem: com ânsias de serviço, de modo que o caminho se lhes mostre amável."}, {"n": 738, "chapter": "Amizade", "text": "Que alma tão estreita a dos que guardam zelosamente a sua “lista de agravos”!... Com esses infelizes, é impossível conviver. A verdadeira caridade, assim como não contabiliza os “constantes e necessários” serviços que presta, também não anota - “omnia suffert”, tudo suporta - as desfeitas que padece."}, {"n": 739, "chapter": "Amizade", "text": "Cumpres um plano de vida exigente: madrugas, fazes oração, freqflentas os Sacramentos, trabalhas ou estudas muito, és sóbrio, mortificas-te..., mas notas que te falta alguma coisa! Leva ao teu diálogo com Deus esta consideração: uma vez que a santidade - a luta por alcança-la - é a plenitude da caridade, tens que revisar o teu amor a Deus e, por Ele, aos outros. Talvez descubras então, escondidos na tua alma, grandes defeitos, contra os quais nem sequer lutavas: não és bom filho, bom irmão, bom companheiro, bom amigo, bom colega; e, como amas desordenadamente a “tua santidade”, és invejoso. “Sacrificas-te” em muitos detalhes “pessoais”: por isso estás apegado ao teu eu, à tua pessoa e, no fundo, não vives para Deus nem para os outros: só para ti."}, {"n": 740, "chapter": "Amizade", "text": "Consideras-te amigo porque não dizes dele uma palavra má. - É verdade: mas também não vejo uma obra boa de exemplo, de serviço..."}, {"n": 741, "chapter": "Amizade", "text": "Primeiro maltratas... E, antes de que ninguém reaja, gritas: “Agora, caridade entre todos!” - Se começasses por esta segunda parte, nunca chegarias à primeira."}, {"n": 742, "chapter": "Amizade", "text": "Não sejas semeador de cizânia, como aquele de quem afirmava a própria mãe: “O senhor apresente-o aos seus amigos, que ele se encarregará de que esses amigos briguem com o senhor”."}, {"n": 743, "chapter": "Amizade", "text": "Não me parece cristã a fraternidade de que faz alarde contigo aquele amigo que te alerta: “Disseram-me de ti esta ou aquela calúnia horrível; desconfia de alguém que deve ser da tua intimidade”... Não me parece cristã, porque falta a esse “irmão” o impulso nobre de fazer calar o caluniador antes, e, depois de comunicar-te lealmente o seu nome. - Se não tem caráter para exigir de si próprio esta conduta, esse “irmão” expõe-te a ficares só na vida, impelindo-te a desconfiar de todos e a faltar à caridade com todos."}, {"n": 744, "chapter": "Amizade", "text": "Não possuis nem um pingo de sentido sobrenatural e, nos outros, vês somente pessoas de melhor ou pior posição social. Das almas, não te lembras para nada, nem as serves. Por isso não és generoso..., e vives muito longe de Deus com a tua falsa piedade, ainda que rezes muito. O Mestre falou bem claro; “Afastai-vos de mim, e ide para o fogo eterno, porque tive fome..., tive sede..., estava na prisão..., e não me atendeste”."}, {"n": 745, "chapter": "Amizade", "text": "Não é compatível amar a Deus com perfeição e deixar-se dominar pelo egoísmo - ou pela apatia - no relacionamento com o próximo."}, {"n": 746, "chapter": "Amizade", "text": "A verdadeira amizade implica também um esforço cordial por compreender as convicções dos nossos amigos, mesmo que não cheguemos a partilhar nem a aceitá-las."}, {"n": 747, "chapter": "Amizade", "text": "Nunca permitas que cresça a erva ruim no caminho da amizade: Sê leal."}, {"n": 748, "chapter": "Amizade", "text": "Um propósito firme na amizade: que nos meus pensamentos, nas minhas palavras, nas minhas obras para com o próximo - seja ele quem for -, não me comporte como até agora; quer dizer, que nunca deixe de praticar a caridade, que jamais dê passagem na minha alma à indiferença."}, {"n": 749, "chapter": "Amizade", "text": "A tua caridade deve adequar-se, ajustar-se, às necessidades dos outros...; não às tuas."}, {"n": 750, "chapter": "Amizade", "text": "Filhos de Deus! Eis uma condição que nos transforma em algo mais transcendente do que em pessoas que se suportam mutuamente. Escuta o Senhor: “Vos autem dixi amicos!” - somos seus amigos, que, como Ele, dão com gosto a sua vida pelos outros, nas horas heróicas e na vivência diária."}, {"n": 751, "chapter": "Amizade", "text": "Como se pode pretender que os que não possuem a nossa fé venham para a Igreja Santa, se contemplam o desabrido trato mútuo dos que se dizem seguidores de Cristo?"}, {"n": 752, "chapter": "Amizade", "text": "A atração do teu trato amável deve alargar-se em quantidade e qualidade. Senão, o teu apostolado se extinguirá em cenáculos inertes e fechados."}, {"n": 753, "chapter": "Amizade", "text": "Com a tua amizade e com a tua doutrina - corrijo-me: com a caridade e com a mensagem de Cristo -, animarás muitos não-católicos a colaborar a sério, para fazerem o bem a todos os homens."}, {"n": 754, "chapter": "Amizade", "text": "Tomei nota das palavras daquele operário, que comentava entusiasmado, depois de participar dessa reunião que promoveste: “Nunca tinha ouvido falar, como se faz aqui, de nobreza, de honradez, de amabilidade, de generosidade...” - E concluía admirado: “Em face do materialismo de esquerdas ou de direitas, isto é a verdadeira revolução!” - Qualquer alma entende a fraternidade que Jesus Cristo instaurou: empenhemo-nos em não desvirtuar essa doutrina!"}, {"n": 755, "chapter": "Amizade", "text": "Às vezes, pretendes justificar-te dizendo que és distraído, avoado; ou que, por caráter, és seco, fechadão. E acrescentas que, por isso, nem sequer conheces a fundo as pessoas com quem convives. - Escuta: não é verdade que não ficas tranqflilo com essa desculpa?"}, {"n": 756, "chapter": "Amizade", "text": "Põe muito sentido sobrenatural em todos os detalhes da tua vida ordinária, aconselhei-te. E acrescentei imediatamente: a convivência oferece-te muitas ocasiões, ao longo do dia."}, {"n": 757, "chapter": "Amizade", "text": "Viver a caridade significa respeitar a mentalidade dos outros; encher-se de alegria pelo seu modo de caminhar para Deus..., sem empenhar-se em que pensem como tu, em que se unam a ti. - Ocorreu-me fazer-te esta consideração: esses caminhos, diferentes, são paralelos; seguindo o seu, cada um chegará a Deus... Não te percas em comparações, nem desejos de saber quem anda mais alto: isso não interessa, o que interessa é que todos alcancemos o fim."}, {"n": 758, "chapter": "Amizade", "text": "Dizes que o outro está cheio de defeitos! Muito bem... Mas, além de que os perfeitos só se encontram no Céu, tu também arrastas os teus defeitos e, no entanto, suportam-te e, mais ainda, estimam-te: porque te querem com o amor que Jesus Cristo dava aos seus, que bem carregados andavam de misérias! - Aprende."}, {"n": 759, "chapter": "Amizade", "text": "Queixas-te de que essa pessoa não é compreensiva... - Eu tenho a certeza de que faz o possível por entender-te. Mas tu, quando é que te esforçarás um pouquinho por compreendê-la?"}, {"n": 760, "chapter": "Amizade", "text": "De acordo!, admito: essa pessoa portou-se mal; a sua conduta é reprovável e indigna; não demonstra classe nenhuma. - Merece humanamente todo o desprezo! - acrescentaste. - Insisto: compreendo-te, mas não compartilho a tua última afirmação. Essa vida mesquinha é sagrada: Cristo morreu para redimi-la! Se Ele não a desprezou, como podes tu atrever-te a fazê-lo?"}, {"n": 761, "chapter": "Amizade", "text": "Se a tua amizade se rebaixa até converter-te em cúmplice das misérias alheias, reduz-se a triste compadrio, que não merece o mínimo apreço."}, {"n": 762, "chapter": "Amizade", "text": "Verdadeiramente a vida - que já de per si é estreita e insegura - às vezes se torna difícil. - Mas isso contribuirá para fazer-te mais sobrenatural, para te fazer ver a mão de Deus: e assim serás mais humano e compreensivo com os que te rodeiam."}, {"n": 763, "chapter": "Amizade", "text": "A indulgência é proporcional à autoridade. Um simples juiz tem de condenar - talvez reconhecendo atenuantes - o réu convicto e confesso. O poder soberano de um país, algumas vezes, concede uma anistia ou um indulto. À alma contrita, Deus a perdoa sempre."}, {"n": 764, "chapter": "Amizade", "text": "“Através de vocês eu vi a Deus, que esquecia as minhas loucuras e as minhas ofensas, e me acolhia com carinho de Pai”. Isto escreveu aos seus, contrito, de regresso à casa paterna, um filho pródigo do século XX."}, {"n": 765, "chapter": "Amizade", "text": "Custou-te muito ir afastando e esquecendo as tuas preocupaçõezinhas, os teus sonhos pessoais: pobres e poucos, mas enraizados. - Em troca, agora estás bem certo de que o teu sonho e a tua ocupação são os teus irmãos, e somente eles, porque no teu próximo aprendeste a descobrir Jesus Cristo."}, {"n": 766, "chapter": "Amizade", "text": "“O cem por um”... Como te lembravas, faz uns dias, dessa promessa do Senhor! - Na fraternidade que se vive entre os teus companheiros de apostolado - garanto-te - encontrarás esse cem por um."}, {"n": 767, "chapter": "Amizade", "text": "Quantos temores e quantos perigos pode dissipar o amor verdadeiro entre os irmãos, que não se exibe - porque então é como se se profanasse -, mas que resplandece em cada detalhe!"}, {"n": 768, "chapter": "Amizade", "text": "Recorre, em confidência segura, todos os dias, à Virgem Santíssima. A tua alma e a tua vida sairão reconfortadas. - Ela te fará participar dos tesouros que guarda em seu coração, pois “nunca se ouviu dizer que algum daqueles que tivesse recorrido à sua proteção fosse desatendido”."}, {"n": 769, "chapter": "Vontade", "text": "Para avançar na vida interior e no apostolado, o necessário não é a devoção sensível; mas a disposição decidida e generosa da vontade, em face das instâncias divinas."}, {"n": 770, "chapter": "Vontade", "text": "Sem o Senhor não poderás dar um passo seguro. - Esta certeza de que precisas da sua ajuda te levará a unir-te mais a Ele, com uma confiança firme, perseverante, ungida de alegria e de paz, ainda que o caminho se torne áspero e íngreme."}, {"n": 771, "chapter": "Vontade", "text": "Repara na grande diferença que há entre o modo de agir natural e o sobrenatural. O primeiro começa bem, para depois acabar afrouxando. O segundo começa igualmente bem..., mas depois se esforça por prosseguir ainda melhor."}, {"n": 772, "chapter": "Vontade", "text": "Não é mau comportar-se bem por nobres razões humanas. - Mas... que diferença quando “comandam” as sobrenaturais!"}, {"n": 773, "chapter": "Vontade", "text": "Ao contemplar essa alegria perante o trabalho duro, aquele amigo perguntou: - Mas, realizam-se todas essas tarefas por entusiasmo? - E responderam-lhe com alegria e com serenidade: “Por entusiasmo?... Teríamos feito um papelão!” “Per Dominum Nostrum Iesum Christum!” por Nosso Senhor Jesus Cristo, que nos espera continuamente."}, {"n": 774, "chapter": "Vontade", "text": "O mundo está precisando que despertemos os sonolentos, que animemos os tímidos, que guiemos os desorientados; numa palavra, que os enquadremos nas fileiras de Cristo, para que não se joguem fora tantas energias."}, {"n": 775, "chapter": "Vontade", "text": "Talvez também te aproveite a ti aquele expediente sobrenatural - delicadeza de amor voluntário - que repetia a si mesma uma alma muito de Deus, perante as diferentes exigências: “Já é tempo de que te decidas, de verdade, a fazer alguma coisa que valha a pena”."}, {"n": 776, "chapter": "Vontade", "text": "Que perfeição cristã pretendes alcançar, se fazes sempre o teu capricho, “o que gostas”...? Todos os teus defeitos, não combatidos, darão um lógico fruto constante de más obras. E a tua vontade - que não estará temperada numa luta perseverante - não te servirá de nada, quando chegar uma ocasião difícil."}, {"n": 777, "chapter": "Vontade", "text": "A fachada é de energia e rijeza. Mas, quanta moleza e falta de vontade por dentro! - Fomenta a decisão de que as tuas virtudes não se transformem num disfarce, mas em hábitos que definam o teu caráter."}, {"n": 778, "chapter": "Vontade", "text": "“Conheço algumas e alguns que não têm forças nem para pedir socorro”, dizes-me desgostoso e cheio de pena. - Não passes ao largo; a tua vontade de salvar-te e de salvá-los pode ser o ponto de partida da sua conversão. Além disso, se reconsideras, perceberás que também a ti te estenderam a mão."}, {"n": 779, "chapter": "Vontade", "text": "Os molengões, os que se queixam de mil e uma ninharias, são os que não sabem sacrificar-se nessas minúcias diárias por Jesus..., e muito menos pelos outros. Que vergonha se o teu comportamento - tão duro, tão exigente com os outros! - padece dessa moleza nos teus afazeres cotidianos!"}, {"n": 780, "chapter": "Vontade", "text": "Sofres muito porque vês que não estás à altura. Quererias fazer mais e com maior eficácia, mas atuas com freqflência de um modo totalmente precipitado, ou não te atreves. “Contra spem, in spem!” - vive de esperança segura, contra toda a esperança. Apóia-te nesta rocha firme que te salvará e empurrará. É uma virtude teologal - esplêndida! -, que te animará a ir para a frente, sem receio de passar da risca, e te impedirá de parar. - Não me olhes desse jeito! Sim! Cultivar a esperança significa robustecer a vontade."}, {"n": 781, "chapter": "Vontade", "text": "Quando a tua vontade fraquejar diante do trabalho habitual, lembra-te uma vez mais daquela consideração: “O estudo, o trabalho, é parte essencial do meu caminho. O descrédito profissional - conseqflência da preguiça - anularia ou tornaria impossíveis as minhas tarefas de cristão. Necessito - assim Deus o quer - do ascendente do prestígio profissional, para atrair e ajudar os outros”. - Não duvides: se abandonas o teu trabalho, afastas-te - e afastas outros - dos planos divinos!"}, {"n": 782, "chapter": "Vontade", "text": "Assustava-te o caminho dos filhos de Deus porque, em nome do Senhor, te instavam a cumprir, a negar-te a ti mesmo, a sair da tua torre de marfim. Deste uma desculpa..., e confesso-te que não me admira nada essa carga que te pesa: um conjunto de complexos e tortuosidades, de melindres e escrúpulos, que te deixa inútil. Não te zangues se te digo que te portaste com menos inteireza - como se fosses pior ou inferior - do que a gente depravada, audaz pregoeira do mal. “Surge et ambula!” - levanta-te e caminha, decide-te! Ainda podes libertar - te desse fardo nefasto se, com a graça de Deus, ouves o que Ele pede e, sobretudo, se O secundas plenamente e de bom grado!"}, {"n": 783, "chapter": "Vontade", "text": "É bom que essas impaciências te comam a alma. - Mas não te
