<script>window.__DATA__ = {"generated": "pdf", "books": [{"slug": "caminho", "title": "Caminho", "total": 999, "chapters": [{"n": 1, "title": "Caráter", "start": 1, "end": 55}, {"n": 2, "title": "Direção espiritual", "start": 56, "end": 80}, {"n": 3, "title": "Oração", "start": 81, "end": 117}, {"n": 4, "title": "Santa Pureza", "start": 118, "end": 145}, {"n": 5, "title": "Coração", "start": 146, "end": 171}, {"n": 6, "title": "Mortificação", "start": 172, "end": 207}, {"n": 7, "title": "Penitência", "start": 208, "end": 234}, {"n": 8, "title": "Exame de consciência", "start": 235, "end": 246}, {"n": 9, "title": "Propósitos", "start": 247, "end": 257}, {"n": 10, "title": "Escrúpulos", "start": 258, "end": 264}, {"n": 11, "title": "Presença de Deus", "start": 265, "end": 278}, {"n": 12, "title": "Vida sobrenatural", "start": 279, "end": 300}, {"n": 13, "title": "Mais sobre vida interior", "start": 301, "end": 324}, {"n": 14, "title": "Tibieza", "start": 325, "end": 331}, {"n": 15, "title": "Estudo", "start": 332, "end": 359}, {"n": 16, "title": "Formação", "start": 360, "end": 386}, {"n": 17, "title": "O plano da tua santidade", "start": 387, "end": 416}, {"n": 18, "title": "Amor de Deus", "start": 417, "end": 439}, {"n": 19, "title": "Caridade", "start": 440, "end": 469}, {"n": 20, "title": "Os meios", "start": 470, "end": 491}, {"n": 21, "title": "A Virgem Maria", "start": 492, "end": 516}, {"n": 22, "title": "A Igreja", "start": 517, "end": 527}, {"n": 23, "title": "Santa Missa", "start": 528, "end": 543}, {"n": 24, "title": "Comunhão dos Santos", "start": 544, "end": 550}, {"n": 25, "title": "Devoções", "start": 551, "end": 574}, {"n": 26, "title": "Fé", "start": 575, "end": 588}, {"n": 27, "title": "Humildade", "start": 589, "end": 613}, {"n": 28, "title": "Obediência", "start": 614, "end": 629}, {"n": 29, "title": "Pobreza", "start": 630, "end": 638}, {"n": 30, "title": "Discrição", "start": 639, "end": 656}, {"n": 31, "title": "Alegria", "start": 657, "end": 666}, {"n": 32, "title": "Outras virtudes", "start": 667, "end": 684}, {"n": 33, "title": "Tribulações", "start": 685, "end": 706}, {"n": 34, "title": "Luta interior", "start": 707, "end": 733}, {"n": 35, "title": "Novíssimos", "start": 734, "end": 753}, {"n": 36, "title": "A Vontade de Deus", "start": 754, "end": 778}, {"n": 37, "title": "A Glória de Deus", "start": 779, "end": 789}, {"n": 38, "title": "Proselitismo", "start": 790, "end": 812}, {"n": 39, "title": "Pequenas coisas", "start": 813, "end": 830}, {"n": 40, "title": "Tática", "start": 831, "end": 851}, {"n": 41, "title": "Infância espiritual", "start": 852, "end": 874}, {"n": 42, "title": "Vida de infância", "start": 875, "end": 901}, {"n": 43, "title": "Chamamento", "start": 902, "end": 928}, {"n": 44, "title": "O Apóstolo", "start": 929, "end": 959}, {"n": 45, "title": "O Apostolado", "start": 960, "end": 982}, {"n": 46, "title": "Perseverança", "start": 983, "end": 999}], "points": [{"n": 1, "chapter": "Caráter", "text": "Que a tua vida não seja uma vida estéril. - Sê útil. - Deixa rasto. - Ilumina com o resplendor da tua fé e do teu amor. Apaga, com a tua vida de apóstolo, o rasto viscoso e sujo que deixaram os semeadores impuros do ódio. - E incendeia todos os caminhos da terra com o fogo de Cristo que levas no coração."}, {"n": 2, "chapter": "Caráter", "text": "Oxalá fossem tais o teu porte e a tua conversação que todos pudessem dizer, ao ver-te ou ouvir-te falar: “Este lê a vida de Jesus Cristo”."}, {"n": 3, "chapter": "Caráter", "text": "Gravidade. - Deixa esses meneios e trejeitos de mulherzinha ou de moleque. - Que o teu porte exterior seja o reflexo da paz e da ordem do teu espírito."}, {"n": 4, "chapter": "Caráter", "text": "Não digas: “Eu sou assim..., são coisas do meu caráter”. São coisas da tua falta de caráter. Sê homem - “esto vir”."}, {"n": 5, "chapter": "Caráter", "text": "Acostuma-te a dizer que não."}, {"n": 6, "chapter": "Caráter", "text": "Vira as costas ao infame quando te sussurra ao ouvido: “Para que hás de complicar a vida?”"}, {"n": 7, "chapter": "Caráter", "text": "Não tenhas espírito de “caipira”. - Dilata o teu coração, até que seja universal, “católico”. Não voes como ave de capoeira, quando podes subir como as águias."}, {"n": 8, "chapter": "Caráter", "text": "Serenidade. - Por que te zangas, se zangando-te ofendes a Deus, incomodas os outros, passas tu mesmo um mau bocado... e, por fim, tens de acalmar-te?"}, {"n": 9, "chapter": "Caráter", "text": "Isso mesmo que disseste, dize-o noutro tom, sem ira, e ganhará força o teu raciocínio, e sobretudo não ofenderás a Deus."}, {"n": 10, "chapter": "Caráter", "text": "Não repreendas quando sentes a indignação pela falta cometida. - Espera pelo dia seguinte, ou mais tempo ainda. - E depois, tranqflilo e com a intenção purificada, não deixes de repreender. - Conseguirás mais com uma palavra afetuosa do que com três horas de briga. - Modera o teu gênio."}, {"n": 11, "chapter": "Caráter", "text": "Vontade. - Energia. - Exemplo. - O que é preciso fazer, faz-se... Sem hesitar... Sem contemplações. Sem isso, nem Cisneros teria sido Cisneros"}, {"n": 12, "chapter": "Caráter", "text": "Cresce perante os obstáculos. - A graça do Senhor não te há de faltar: “Inter medium montium pertransibunt aquae!”: - passarás através das montanhas! Que importa que de momento tenhas de restringir a tua atividade, se em breve, como mola que foi comprimida, chegarás incomparavelmente mais longe do que nunca sonhaste?"}, {"n": 13, "chapter": "Caráter", "text": "Afasta de ti esses pensamentos inúteis que, pelo menos, te fazem perder o tempo."}, {"n": 14, "chapter": "Caráter", "text": "Não percas as tuas energias e o teu tempo, que são de Deus, jogando pedras aos cachorros que te ladrem no caminho. Despreza-os."}, {"n": 15, "chapter": "Caráter", "text": "Não deixes o teu trabalho para amanhã."}, {"n": 16, "chapter": "Caráter", "text": "Perder-se na massa? Tu... da multidão?! Mas, se nasceste para líder! - Entre nós, não há lugar para os tíbios. Humilha-te, e Cristo voltará a inflamar-te com fogos de Amor."}, {"n": 17, "chapter": "Caráter", "text": "Não caias nessa doença do caráter que tem por sintomas a falta de firmeza para tudo, a leviandade no agir e no dizer, o estouvamento..., a frivolidade, numa palavra. Essa frivolidade, que - não o esqueças - torna os teus planos de cada dia tão vazios (“tão cheios de vazio”), se não reages a tempo - não amanhã; agora! -, fará da tua vida um boneco de trapos morto e inútil."}, {"n": 18, "chapter": "Caráter", "text": "Obstinas-te em ser mundano, frívolo e estouvado porque és covarde. Que é, senão covardia, esse não quereres enfrentar-te a ti próprio?"}, {"n": 19, "chapter": "Caráter", "text": "Vontade. É uma característica muito importante. Não desprezes as pequenas coisas, porque, através do contínuo exercício de negar e te negares a ti próprio nessas coisas - que nunca são futilidades nem ninharias -, fortalecerás, virilizarás, com a graça de Deus, a tua vontade, para seres, em primeiro lugar, inteiro senhor de ti mesmo. E depois, guia, chefe, líder! - que prendas, que empurres, que arrastes, com o teu exemplo e com a tua palavra e com a tua ciência e com o teu império."}, {"n": 20, "chapter": "Caráter", "text": "Chocas com o caráter deste ou daquele... Tem de ser assim necessariamente; não és moeda de ouro que a todos agrade. Além disso, sem esses choques que se produzem ao lidar com o próximo, como havias de perder as pontas, as arestas e saliências - imperfeições, defeitos - do teu temperamento, para adquirires a forma cinzelada, polida e energicamente suave da caridade, da perfeição? Se o teu caráter e o caráter dos que convivem contigo fossem adocicados e moles como gelatina, não te santificarias."}, {"n": 21, "chapter": "Caráter", "text": "Pretextos. - Nunca te faltarão para deixares de cumprir os teus deveres. Que fartura de razões... sem razão! Não pares a considerá-las. - Repele-as e cumpre a tua obrigação."}, {"n": 22, "chapter": "Caráter", "text": "Sê enérgico. - Sê viril. - Sê homem. - E depois... sê anjo."}, {"n": 23, "chapter": "Caráter", "text": "Dizes que... não podes fazer mais? - Não será que... não podes fazer menos?"}, {"n": 24, "chapter": "Caráter", "text": "Tens ambições: de saber..., de ser líder..., de ser audaz. Muito bem. Está certo. - Mas... por Cristo, por Amor."}, {"n": 25, "chapter": "Caráter", "text": "Não discutais. - Da discussão não costuma sair a luz, porque é apagada pela paixão."}, {"n": 26, "chapter": "Caráter", "text": "O Matrimônio é um sacramento santo. - A seu tempo, quando tiveres de recebê-lo, que o teu Diretor ou o teu confessor te aconselhem a leitura de algum livro útil. - E estarás mais bem preparado para levar dignamente as cargas do lar."}, {"n": 27, "chapter": "Caráter", "text": "Estás rindo porque te digo que tens “vocação matrimonial”? - Pois é verdade: isso mesmo, vocação. Pede a São Rafael que te conduza castamente ao termo do caminho, como a Tobias."}, {"n": 28, "chapter": "Caráter", "text": "O matrimônio é para os soldados e não para o estado-maior de Cristo. - Ao passo que comer é uma exigência de cada indivíduo, procriar é apenas uma exigência da espécie, podendo dela desinteressar-se as pessoas individualmente. Ânsia de filhos...? Filhos, muitos filhos, e um rasto indelével de luz deixaremos, se sacrificarmos o egoísmo da carne."}, {"n": 29, "chapter": "Caráter", "text": "A relativa e pobre felicidade do egoísta, que se encerra na sua torre de marfim, na sua própria carcaça..., não é difícil de conseguir neste mundo. - Mas a felicidade do egoísta não é duradoura. Será que queres perder, por essa caricatura do Céu, a felicidade da Glória, que não terá fim?"}, {"n": 30, "chapter": "Caráter", "text": "És calculista! - Não me digas que és jovem. A juventude dá tudo quanto pode; dá-se a si própria sem medida."}, {"n": 31, "chapter": "Caráter", "text": "Egoísta! - Tu, sempre atrás das “tuas coisas”. - Pareces incapaz de sentir a fraternidade de Cristo: nos outros, não vês irmãos; vês “degraus”. Pressinto o teu fracasso rotundo. - E, quando estiveres afundado, quererás que vivam contigo a caridade que agora não queres viver."}, {"n": 32, "chapter": "Caráter", "text": "Tu não serás líder se na massa só vires o escabelo para empoleirar-te. - Tu serás líder se tiveres a ambição de salvar todas as almas. Não podes viver de costas para a multidão. É preciso que tenhas ânsias de torná-la feliz."}, {"n": 33, "chapter": "Caráter", "text": "Nunca queres “esgotar a verdade”. - Umas vezes, por correção. Outras - a maioria -, para não passares um mau bocado. Algumas, para evitá-lo aos outros. E, sempre, por covardia. Assim, com esse medo de aprofundar, jamais serás homem de critério."}, {"n": 34, "chapter": "Caráter", "text": "Não tenhas medo à verdade, ainda que a verdade te acarrete a morte."}, {"n": 35, "chapter": "Caráter", "text": "Não gosto de tanto eufemismo: à covardia chamais prudência. - E a vossa “prudência” é ocasião para que os inimigos de Deus, com o cérebro vazio de idéias, tomem ares de sábios e ascendam a postos a que nunca deviam ascender."}, {"n": 36, "chapter": "Caráter", "text": "Esse abuso não é irremediável. - É falta de caráter permitir que continue, como coisa desesperada e sem possível retificação. Não te esquives ao dever. - Cumpre-o em toda a linha, ainda que outros deixem de cumpri-lo."}, {"n": 37, "chapter": "Caráter", "text": "Tens, como por aí se diz, “muita lábia”. - Mas, com todo o teu palavreado, não conseguirás que eu justifique (“foi providencial!”, disseste) o que não tem justificação."}, {"n": 38, "chapter": "Caráter", "text": "Será verdade (não acredito, não acredito...) que na terra não há homens, mas “estômagos”?"}, {"n": 39, "chapter": "Caráter", "text": "“Peça que eu nunca queira deter-me no fácil”. - Já o pedi. Agora só falta que te empenhes em cumprir esse belo propósito."}, {"n": 40, "chapter": "Caráter", "text": "Fé, alegria, otimismo. - Mas não a estupidez de fechar os olhos à realidade."}, {"n": 41, "chapter": "Caráter", "text": "Que modo tão transcendental de viver bobagens vazias, e que maneira de chegar a ser alguém na vida - subindo, subindo - à força de “pesar pouco”, de não ter nada, nem no cérebro nem no coração!"}, {"n": 42, "chapter": "Caráter", "text": "Por que essas variações de caráter? Quando fixarás a tua vontade em alguma coisa? - Larga esse teu gosto pelas primeiras pedras, e põe a última ao menos em um de teus projetos."}, {"n": 43, "chapter": "Caráter", "text": "Não sejas tão... suscetível. - Magoas-te por qualquer coisinha. - Torna-se necessário medir as palavras para falar contigo do assunto mais insignificante. Não te zangues se te digo que és... insuportável. - Enquanto não te corrigires, nunca serás útil."}, {"n": 44, "chapter": "Caráter", "text": "Desculpa-te com a cortesia que a caridade cristã e a vida social exigem. - E, depois, para a frente! - com santa desvergonha, sem parar, até subires inteiramente a encosta do cumprimento do dever."}, {"n": 45, "chapter": "Caráter", "text": "Por que te doem essas errôneas conjecturas que se fazem a teu respeito? - A mais baixo chegarias se Deus te abandonasse. - Persevera no bem, e encolhe os ombros."}, {"n": 46, "chapter": "Caráter", "text": "Não achas que a igualdade, tal como a entendem, é sinônimo de injustiça?"}, {"n": 47, "chapter": "Caráter", "text": "Essa ênfase e esse ar emproado ficam-te mal; vê-se que são postiços. - Procura, pelo menos, não os empregar com o teu Deus, nem com o teu Diretor, nem com os teus irmãos. E haverá uma barreira a menos entre ti e eles."}, {"n": 48, "chapter": "Caráter", "text": "Pouco firme é o teu caráter: que ânsia de te meteres em tudo! - Obstinas-te em ser o sal de todos os pratos... e - não te zangues se te falo claramente - tens pouca graça para ser sal; e não és capaz de desfazer-te e passar despercebido à vista, como esse condimento. Falta-te espírito de sacrifício. E sobra-te espírito de curiosidade e de exibição."}, {"n": 49, "chapter": "Caráter", "text": "Cala-te. - Não sejas “meninão”, caricatura de criança, bisbilhoteiro, intriguista, linguarudo. - Com as tuas histórias e mexericos, esfriaste a caridade: fizeste a pior das obras. E... se por acaso abalaste - má língua! - os muros fortes da perseverança de outros, a tua perseverança deixa de ser graça de Deus, porque é instrumento traiçoeiro do inimigo."}, {"n": 50, "chapter": "Caráter", "text": "És curioso e bisbilhoteiro, xereta e intrometido. Não tens vergonha de ser, até nos defeitos, tão pouco masculino? - Sê homem. E esses desejos de saber da vida dos outros, troca-os por desejos e realidades de conhecimento próprio."}, {"n": 51, "chapter": "Caráter", "text": "Teu espírito varonil, retilínio e simples, confrange-se ao sentir-se envolvido em enredos e mexericos, que não acaba de compreender e em que nunca se quis misturar. - Sofre a humilhação de andar assim em boca alheia e procura que essa dura experiência te dê mais discrição."}, {"n": 52, "chapter": "Caráter", "text": "Por que razão, ao julgares os outros, pões na tua crítica o amargor dos teus próprios fracassos?"}, {"n": 53, "chapter": "Caráter", "text": "Esse espírito crítico (concedo-te que não é murmuração), não o deves exercer no teu apostolado, nem com teus irmãos. - Esse espírito crítico é, para o vosso empreendimento sobrenatural (perdoas-me que o diga?), um grande estorvo, porque, enquanto examinas - embora com elevada finalidade, acredito - o trabalho dos outros, sem teres nada a ver com isso, não fazes nenhuma obra positiva, e dificultas, com o teu exemplo de passividade, o bom andamento de todos. “Então...” - perguntas, inquieto - “...esse espírito crítico, que é como que a substância do meu caráter...?” Olha (vou tranqflilizar-te): apanha uma caneta e um papel, escreve simples e confiadamente - ah!, e com brevidade - os motivos que te torturam, entrega a nota ao superior e não penses mais nela. - Ele, que é quem vos dirige (tem graça de estado), guardará a nota... ou a jogará no cesto dos papéis. - Para ti, como o teu espírito crítico não é murmuração, e só o exerces para fins elevados, tanto faz."}, {"n": 54, "chapter": "Caráter", "text": "Contemporizar? É palavra que só se encontra (“é preciso contemporizar!”) no léxico dos que não têm vontade de lutar - comodistas, manhosos ou covardes -, porque de antemão se sabem vencidos."}, {"n": 55, "chapter": "Caráter", "text": "Olha, meu filho: sê um pouco menos ingênuo (ainda que sejas muito criança, e mesmo por o seres diante de Deus), e não “ponhas na berlinda”, diante de estranhos, os teus irmãos."}, {"n": 56, "chapter": "Direção espiritual", "text": "“Madeira de santo”. Isso dizem de alguns: que têm “madeira de santo”. - Além de que os santos não foram de madeira, ter madeira não basta. É necessária muita obediência ao Diretor e muita docilidade à graça. - Porque, se não se permite à graça de Deus e ao Diretor que façam a sua obra, jamais aparecerá a escultura, imagem de Jesus, em que se transforma o homem santo. E a “madeira de santo”, de que estamos falando, não passará de um tronco informe, sem talha, para o fogo... Para um bom fogo, se era boa madeira!"}, {"n": 57, "chapter": "Direção espiritual", "text": "Cultiva o trato com o Espírito Santo - o Grande Desconhecido -, que é quem te há de santificar. Não te esqueças de que és templo de Deus. - O Paráclito está no centro da tua alma: escuta-O e segue docilmente as suas inspirações."}, {"n": 58, "chapter": "Direção espiritual", "text": "Não estorves a obra do Paráclito; une-te a Cristo, para te purificares, e sente, com Ele, os insultos, e os escarros, e as bofetadas..., e os espinhos, e o peso da Cruz..., e os ferros rasgando a tua carne, e as ânsias de uma morte ao desamparo... E mete-te no lado aberto de Nosso Senhor Jesus, até encontrares refúgio seguro em seu Coração chagado."}, {"n": 59, "chapter": "Direção espiritual", "text": "Convém que conheças esta doutrina segura: o espírito próprio é mau conselheiro, mau piloto, para dirigir a alma nas borrascas e tempestades, por entre os escolhos da vida interior. Por isso, é Vontade de Deus que a direção da nau esteja entregue a um Mestre, para que, com a sua luz e conhecimento, nos conduza a porto seguro."}, {"n": 60, "chapter": "Direção espiritual", "text": "Se não te lembrarias de construir sem arquiteto uma boa casa para viveres na terra, como queres levantar sem Diretor o edifício da tua santificação, para viveres eternamente no Céu?"}, {"n": 61, "chapter": "Direção espiritual", "text": "Quando um leigo se erige em mestre de moral, erra freqflentemente. Os leigos só podem ser discípulos."}, {"n": 62, "chapter": "Direção espiritual", "text": "Diretor. - Precisas dele. - Para te entregares, para te dares..., obedecendo. - E Diretor que conheça o teu apostolado, que saiba o que Deus quer. Assim secundará, com eficácia, a ação do Espírito Santo na tua alma, sem tirar-te do lugar em que estás..., enchendo-te de paz e ensinando-te a tornar fecundo o teu trabalho."}, {"n": 63, "chapter": "Direção espiritual", "text": "Tu - pensas - tens muita personalidade: os teus estudos (teus trabalhos de pesquisa, tuas publicações), a tua posição social (teus antepassados), as tuas atuações políticas (os cargos que ocupas), o teu patrimônio..., a tua idade - não és mais uma criança!... Precisamente por tudo isso necessitas, mais do que outros, de um Diretor para a tua alma."}, {"n": 64, "chapter": "Direção espiritual", "text": "Não ocultes ao teu Diretor essas insinuações do inimigo. - A tua vitória, ao abrir-lhe a tua alma, te dá mais graça de Deus. - E, além disso, tens agora, para continuares a vencer, o dom de conselho e as orações do teu pai espiritual."}, {"n": 65, "chapter": "Direção espiritual", "text": "Por que esse receio de te veres a ti mesmo e te deixares ver pelo teu Diretor tal como na realidade és? Terás ganho uma grande batalha se perderes o medo de te dares a conhecer."}, {"n": 66, "chapter": "Direção espiritual", "text": "O Sacerdote - seja quem for - é sempre outro Cristo."}, {"n": 67, "chapter": "Direção espiritual", "text": "Ainda que bem sabido, não quero deixar de recordar-te uma vez mais que o Sacerdote é “outro Cristo”. - E que o Espírito Santo disse: “Nolite tangere Christos meos” - não toqueis nos “meus Cristos”."}, {"n": 68, "chapter": "Direção espiritual", "text": "Presbítero, etimologicamente, é o mesmo que ancião. - Se merece veneração a velhice, pensa quanto mais terás de venerar o Sacerdote."}, {"n": 69, "chapter": "Direção espiritual", "text": "Que pouca delicadeza de espírito - e que falta de respeito - não revela dirigir gracejos e zombarias ao Sacerdote - seja quem for - sob qualquer pretexto!"}, {"n": 70, "chapter": "Direção espiritual", "text": "Insisto: esse gracejos - “gozações” - ao Sacerdote, apesar de todas as circunstâncias que a ti te pareçam atenuantes, são sempre, pelo menos, uma grosseria, uma ordinarice."}, {"n": 71, "chapter": "Direção espiritual", "text": "Quanto não temos de admirar a pureza sacerdotal! - É o seu tesouro. - Nenhum tirano poderá arrancar jamais à Igreja esta coroa."}, {"n": 72, "chapter": "Direção espiritual", "text": "Não ponhas o Sacerdote em risco de perder a gravidade. É virtude que, sem afetação, precisa ter. Como a pedia - “Senhor, dá-me... oitenta anos de gravidade!” - aquele jovem clérigo, nosso amigo! Pede-a tu também para todos os Sacerdotes, e terás feito uma boa coisa."}, {"n": 73, "chapter": "Direção espiritual", "text": "Doeu-te - como uma punhalada no coração - que tivessem dito que havias falado mal daqueles sacerdotes. - Alegro-me com a tua dor. Agora, sim, estou certo do teu bom espírito!"}, {"n": 74, "chapter": "Direção espiritual", "text": "Amar a Deus e não venerar o Sacerdote... não é possível."}, {"n": 75, "chapter": "Direção espiritual", "text": "Como os filhos bons de Noé, cobre com o manto da caridade as misérias que vires em teu pai, o Sacerdote."}, {"n": 76, "chapter": "Direção espiritual", "text": "Se não tens um plano de vida, nunca terás ordem."}, {"n": 77, "chapter": "Direção espiritual", "text": "Sujeitar-se a um plano de vida, a um horário, é tão monótono!, disseste-me. - E eu te respondi: há monotonia porque falta Amor."}, {"n": 78, "chapter": "Direção espiritual", "text": "Se não te levantas a uma hora fixa, nunca cumprirás o teu plano de vida."}, {"n": 79, "chapter": "Direção espiritual", "text": "Virtude sem ordem? - Estranha virtude!"}, {"n": 80, "chapter": "Direção espiritual", "text": "Quando tiveres ordem, multiplicar-se-á o teu tempo e, portanto, poderás dar mais glória a Deus, trabalhando mais a seu serviço."}, {"n": 81, "chapter": "Oração", "text": "A ação nada vale sem a oração; a oração valoriza-se com o sacrifício."}, {"n": 82, "chapter": "Oração", "text": "Primeiro, oração; depois, expiação; em terceiro lugar, muito em “terceiro lugar”, ação."}, {"n": 83, "chapter": "Oração", "text": "A oração é o alicerce do edifício espiritual. - A oração é onipotente."}, {"n": 84, "chapter": "Oração", "text": "“Domine, doce nos orare” - Senhor, ensina-nos a orar! - E o Senhor respondeu: Quando começardes a orar, haveis de dizer: “Pater noster, qui es in coelis...” - Pai nosso, que estais nos céus... Como não havemos de ter em muito apreço a oração vocal!"}, {"n": 85, "chapter": "Oração", "text": "Devagar. - Repara no que dizes, quem o diz e a quem. - Porque esse falar às pressas, sem lugar para a reflexão, é ruído, chacoalhar de latas. E te direi, com Santa Teresa, que a isso não chamo oração, por muito que mexas os lábios."}, {"n": 86, "chapter": "Oração", "text": "A tua oração deve ser litúrgica. - Oxalá te afeiçoes a recitar os salmos e as orações do missal, em vez de orações privadas ou particulares."}, {"n": 87, "chapter": "Oração", "text": "“Nem só de pão vive o homem, mas de toda a palavra que sai da boca de Deus”, disse o Senhor. - Pão e palavra! - Hóstia e oração. Senão, não terás vida sobrenatural."}, {"n": 88, "chapter": "Oração", "text": "Procuras a companhia de amigos que, com a sua conversa e afeto, com o seu convívio, te tornem mais tolerável o desterro deste mundo..., embora os amigos às vezes atraiçoem. - Não me parece mal. Mas... como não freqflentas cada dia com maior intensidade a companhia, a conversa com o Grande Amigo, que nunca atraiçoa?"}, {"n": 89, "chapter": "Oração", "text": "“Maria escolheu a melhor parte”, lê-se no Santo Evangelho. - Aí está ela, bebendo as palavras do Mestre. Em aparente inatividade, ora e ama. - Depois, acompanha Jesus em suas pregações por cidades e aldeias. Sem oração, como é difícil acompanhá-Lo!"}, {"n": 90, "chapter": "Oração", "text": "Não sabes orar? - Põe-te na presença de Deus, e logo que começares a dizer: “Senhor, não sei fazer oração!...”, podes ter certeza de que começaste a fazê-la."}, {"n": 91, "chapter": "Oração", "text": "Escreveste-me: “Orar é falar com Deus. Mas de quê?” - De quê? DEle e de ti: alegrias, tristezas, êxitos e fracassos, ambições nobres, preocupações diárias..., fraquezas!; e ações de graças e pedidos; e Amor e desagravo. Em duas palavras: conhecê-Lo e conhecer-te - ganhar intimidade!"}, {"n": 92, "chapter": "Oração", "text": "“Et in meditatione mea exardescit ignis”. - E na minha meditação se ateia o fogo. - Para isso vais à oração: para tornar-te uma fogueira, lume vivo, que dê calor e luz. Por isso, quando não souberes ir mais longe, quando sentires que te apagas, se não puderes lançar ao fogo troncos aromáticos, lança os ramos e a folhagem de pequenas orações vocais, de jaculatórias, que continuem a alimentar a fogueira. - E terás aproveitado o tempo."}, {"n": 93, "chapter": "Oração", "text": "Vês-te tão miserável que te reconheces indigno de que Deus te ouça... Mas... e os méritos de Maria? E as chagas do teu Senhor? E... porventura não és filho de Deus? Além disso, Ele te escuta, “quoniam bonus..., quoniam in saeculum misericordia ejus”, porque é bom, porque a sua misericórdia permanece para sempre."}, {"n": 94, "chapter": "Oração", "text": "Fez-se tão pequeno - bem vês: um Menino! - para que te aproximes dEle com confiança."}, {"n": 95, "chapter": "Oração", "text": "“In te, Domine, speravi”: em Ti, Senhor, esperei. - E aos meios humanos acrescentei a minha oração e a minha cruz. - E não foi vã a minha esperança, nem jamais o será: “Non confundar in aeternum!”"}, {"n": 96, "chapter": "Oração", "text": "Fala Jesus: “Digo-vos, pois: Pedi e dar-se-vos-á; buscai e achareis; batei e abrir-se-vos-á”. Faz oração. Em que negócio humano te podem dar mais garantias de êxito?"}, {"n": 97, "chapter": "Oração", "text": "Não sabes o que dizer ao Senhor na oração. Não te lembras de nada, e, no entanto, quererias consultá-Lo sobre muitas coisas. - Olha: durante o dia, toma algumas notas sobre os assuntos que desejes considerar na presença de Deus. E depois, serve-te dessas notas na oração."}, {"n": 98, "chapter": "Oração", "text": "Depois da oração do Sacerdote e das virgens consagradas, a oração mais grata a Deus é a das crianças e a dos doentes."}, {"n": 99, "chapter": "Oração", "text": "Quando fores orar, que seja este um firme propósito: não ficar mais tempo por consolação, nem menos por aridez."}, {"n": 100, "chapter": "Oração", "text": "Não digas a Jesus que queres consolações na oração. - Se as dá, agradece-as. - Diz-Lhe sempre que queres perseverança."}, {"n": 101, "chapter": "Oração", "text": "Persevera na oração. - Persevera, ainda que o teu esforço pareça estéril. - A oração é sempre fecunda."}, {"n": 102, "chapter": "Oração", "text": "A tua inteligência está entorpecida, inativa. Fazes esforços inúteis para coordenar as idéias na presença do Senhor: um verdadeiro atordoamento! Não te esforces nem te preocupes. - Escuta-me bem: é a hora do coração."}, {"n": 103, "chapter": "Oração", "text": "Essas palavras que te feriram durante a oração, grava-as na memória e recita-as pausadamente muitas vezes ao longo do dia."}, {"n": 104, "chapter": "Oração", "text": "“Pernoctans in oratione Dei” - passou a noite em oração. - É o que São Lucas nos diz do Senhor. Tu, quantas vezes perseveraste assim? - Então..."}, {"n": 105, "chapter": "Oração", "text": "Se não procuras a intimidade com Cristo na oração e no Pão, como poderás dá-Lo a conhecer?"}, {"n": 106, "chapter": "Oração", "text": "Escreveste-me e te compreendo: “Faço todos os dias o meu “pouquinho” de oração. Se não fosse isso!...”"}, {"n": 107, "chapter": "Oração", "text": "Santo, sem oração?!... - Não acredito nessa santidade."}, {"n": 108, "chapter": "Oração", "text": "Dir-te-ei, plagiando a frase de um autor estrangeiro, que a tua vida de apóstolo vale o que valer a tua oração."}, {"n": 109, "chapter": "Oração", "text": "Se não és homem de oração, não acredito na retidão de tuas intenções quando dizes que trabalhas por Cristo."}, {"n": 110, "chapter": "Oração", "text": "Disseste-me uma vez que parecias um relógio desregulado, que bate fora de horas: estás frio, seco e árido à hora da tua oração; e, pelo contrário, quando menos era de esperar, na rua, entre os afazeres de cada dia, no meio da balbúrdia e da gritaria da cidade, ou na quietude laboriosa do teu trabalho profissional, surpreendes-te orando... Fora de horas? Certo... Mas não desaproveites essas badaladas do teu relógio. - O Espírito sopra onde quer."}, {"n": 111, "chapter": "Oração", "text": "Fizeste-me rir com a tua oração... impaciente. - Dizias-Lhe: “Não me quero tornar velho, Jesus... É esperar demais para Te ver! Nessa altura, talvez não tenha o coração em carne viva, como agora. Velho, parece-me tarde. Agora, a minha união seria mais galharda, porque Te amo com Amor virginal”."}, {"n": 112, "chapter": "Oração", "text": "Gosto de que vivas essa “reparação ambiciosa”: o mundo inteiro!, disseste-me. - Bem. Mas, em primeiro lugar, os da tua família sobrenatural e da humana, os do país que é a nossa Pátria."}, {"n": 113, "chapter": "Oração", "text": "Dizias-Lhe: “Não Te fies de mim. Eu, sim, é que me fio de Ti, Jesus. Abandono-me em teus braços. Aí deixo o que tenho: as minhas misérias!” - E me parece uma boa oração."}, {"n": 114, "chapter": "Oração", "text": "A oração do cristão nunca é monólogo."}, {"n": 115, "chapter": "Oração", "text": "“Minutos de silêncio”. - Deixai-os para os que têm o coração seco. Nós, os católicos, filhos de Deus, falamos com nosso Pai que está nos céus."}, {"n": 116, "chapter": "Oração", "text": "Não abandones a tua leitura espiritual. - A leitura tem feito muitos santos."}, {"n": 117, "chapter": "Oração", "text": "Na leitura - escreves-me - formo o depósito de combustível. - Parece um montão inerte, mas é dali que muitas vezes a minha memória tira espontaneamente material, que enche de vida a minha oração e inflama a minha ação de graças depois de comungar."}, {"n": 118, "chapter": "Santa Pureza", "text": "Deus concede a santa pureza aos que a pedem com humildade."}, {"n": 119, "chapter": "Santa Pureza", "text": "Que bela é a santa pureza! Mas não é santa nem agradável a Deus, se a separamos da caridade. A caridade é a semente que crescerá e dará frutos saborosíssimos com a rega que é a pureza. Sem caridade, a pureza é infecunda, e as suas águas estéreis convertem as almas num lamaçal, num charco imundo, donde saem baforadas de soberba."}, {"n": 120, "chapter": "Santa Pureza", "text": "Pureza?, perguntam. E sorriem. - São os mesmos que vão para o matrimônio com o corpo murcho e a alma desiludida. Prometo-vos um livro - se Deus me ajudar - que poderá ter este título: “Celibato, Matrimônio e Pureza”."}, {"n": 121, "chapter": "Santa Pureza", "text": "É necessária uma cruzada de virilidade e de pureza que enfrente e anule o trabalho selvagem daqueles que pensam que o homem é uma besta. - E essa cruzada é obra vossa."}, {"n": 122, "chapter": "Santa Pureza", "text": "Muitos vivem como anjos no meio do mundo. - Tu... por que não?"}, {"n": 123, "chapter": "Santa Pureza", "text": "Quando te decidires com firmeza a ter vida limpa, a castidade não será para ti um fardo; será coroa triunfal."}, {"n": 124, "chapter": "Santa Pureza", "text": "Escreveste-me, médico apóstolo: “Todos sabemos por experiência que podemos ser castos, vivendo vigilantes, freqflentando os Sacramentos e apagando as primeiras chispas da paixão, sem deixar que ganhe corpo a fogueira. “É precisamente entre os castos que se contam os homens mais íntegros, sob todos os aspectos. E entre os luxuriosos predominam os tímidos, os egoístas, os falsos e os cruéis, que são tipos de pouca virilidade”."}, {"n": 125, "chapter": "Santa Pureza", "text": "Eu quereria - disseste-me - que João, o Apóstolo adolescente, tivesse uma confidência comigo e me desse conselhos; e me animasse a conseguir a pureza do meu coração. Se na verdade o queres, dize-lhe isso. E sentirás ânimo e terás conselho."}, {"n": 126, "chapter": "Santa Pureza", "text": "A gula é a vanguarda da impureza."}, {"n": 127, "chapter": "Santa Pureza", "text": "Não queiras dialogar com a concupiscência; despreza-a."}, {"n": 128, "chapter": "Santa Pureza", "text": "O pudor e a modéstia são os irmãos menores da pureza."}, {"n": 129, "chapter": "Santa Pureza", "text": "Sem a santa pureza, não se pode perseverar no apostolado."}, {"n": 130, "chapter": "Santa Pureza", "text": "Tira-me, Jesus, esta crosta suja de podridão sensual que me recobre o coração, para que sinta e siga com facilidade os toques do Paráclito na minha alma."}, {"n": 131, "chapter": "Santa Pureza", "text": "Nuncas fales, nem sequer para te lamentares, de coisas ou acontecimentos impuros. Olha que é matéria mais pegajosa que o piche. - Muda de conversa, e, se não é possível, continua, falando da necessidade e formosura da santa pureza, virtude de homens que sabem o que vale a sua alma."}, {"n": 132, "chapter": "Santa Pureza", "text": "Não tenhas a covardia de ser “valente”; foge!"}, {"n": 133, "chapter": "Santa Pureza", "text": "Os santos não foram seres disformes, casos de estudo para um médico modernista. Foram e são normais; de carne, como a tua. - E venceram."}, {"n": 134, "chapter": "Santa Pureza", "text": "Ainda que a carne se vista de seda... - dir-te-ei, quando te vir vacilar diante da tentação, que oculta a sua impureza sob pretextos de arte, de ciência..., de caridade! Dir-te-ei, com palavras de um velho ditado espanhol: “Ainda que a carne se vista de seda, carne se queda”"}, {"n": 135, "chapter": "Santa Pureza", "text": "Se soubesses o que vales!... É São Paulo quem te diz: foste comprado “pretio magno” - por alto preço. E depois continua: “Glorificate et portate Deum in corpore vestro” - glorifica a Deus e traze-O em teu corpo."}, {"n": 136, "chapter": "Santa Pureza", "text": "Quando procuraste a companhia de uma satisfação sensual... - depois, que solidão!"}, {"n": 137, "chapter": "Santa Pureza", "text": "E pensar que por uma satisfação de um momento, que deixou em ti travos de fel e azebre, perdeste “o caminho”!"}, {"n": 138, "chapter": "Santa Pureza", "text": "“Infelix ego homo! Quis me liberabit de corpore mortis hujus?” - Pobre de mim! Quem me livrará deste corpo de morte? - Assim clama São Paulo. - Anima-te. Ele também lutava."}, {"n": 139, "chapter": "Santa Pureza", "text": "À hora da tentação, pensa no Amor que te espera no Céu. Fomenta a virtude da esperança, que não é falta de generosidade."}, {"n": 140, "chapter": "Santa Pureza", "text": "Não te preocupes, aconteça o que acontecer, desde que não consintas. - Porque só a vontade pode abrir a porta do coração e introduzir nele essas coisas execráveis."}, {"n": 141, "chapter": "Santa Pureza", "text": "Na tua alma, parece que ouves materialmente: “Esse preconceito religioso!...” - E depois, a defesa eloqflente de todas as misérias da nossa pobre carne decaída: “os seus direitos!” Quando isto te acontecer, diz ao inimigo que há lei natural e lei de Deus, e Deus! - E também inferno."}, {"n": 142, "chapter": "Santa Pureza", "text": "“Domine!” - Senhor! - “si vis, potes me mundare” - se quiseres, podes curar-me. - Que bela oração para que a digas muitas vezes, com a fé do pobre leproso, quando te acontecer o que Deus e tu e eu sabemos! - Não tardarás a sentir a resposta do Mestre: “Volo, mundare!” - Quero, sê limpo!"}, {"n": 143, "chapter": "Santa Pureza", "text": "Para defender a sua pureza, São Francisco revolveu-se na neve, São Bento jogou-se num silvado, São Bernardo mergulhou num tanque gelado... - Tu, que fizeste?"}, {"n": 144, "chapter": "Santa Pureza", "text": "A pureza limpidíssima de toda a vida de João torna-o forte diante da Cruz. - Os outros Apóstolos fogem do Gólgota; ele, com a Mãe de Cristo, fica. - Não esqueças que a pureza fortalece, viriliza o caráter."}, {"n": 145, "chapter": "Santa Pureza", "text": "Frente de Madrid. Uma vintena de oficiais, em nobre e alegre camaradagem. Ouve-se uma canção, e depois outra e mais outra. Aquele jovem tenente de bigode escuro só ouviu a primeira: “Corações partidos, eu não os quero; e se lhe dou o meu, dou-o inteiro”. “Quanta resistência em dar meu coração inteiro!” - E a oração brotou em caudal manso e largo."}, {"n": 146, "chapter": "Coração", "text": "Dás-me a impressão de que levas o coração na mão, como quem oferece uma mercadoria: quem o quer? - Se não agradar a nenhuma criatura, virás entregá-lo a Deus. Achas que assim fizeram os santos?"}, {"n": 147, "chapter": "Coração", "text": "As criaturas para ti? - As criaturas para Deus. Quando muito, para ti por Deus."}, {"n": 148, "chapter": "Coração", "text": "Por que te debruçares a beber nos charcos dos consolos mundanos, se podes saciar a tua sede em águas que saltam para a vida eterna?"}, {"n": 149, "chapter": "Coração", "text": "Desprende-te das criaturas até ficares despido delas. Porque - diz o Papa São Gregório - o demônio nada tem de seu neste mundo, e acode nu à contenda. Se vais vestido lutar com ele, em breve cairás por terra. Porque terá por onde te pegar."}, {"n": 150, "chapter": "Coração", "text": "É como se o teu Anjo te dissesse: - Tens o coração cheio de tanta afeição humana!... E a seguir: - E isso queres que guarde o teu Anjo da Guarda?"}, {"n": 151, "chapter": "Coração", "text": "Desprendimento. Como custa!... Quem me dera não estar atado senão por três pregos, nem ter outra sensação em minha carne que a Cruz!"}, {"n": 152, "chapter": "Coração", "text": "Não pressentes que te espera mais paz e mais união quando tiveres correspondido a essa graça extraordinária que te exige um desprendimento total? - Luta por Ele, para Lhe dar gosto; mas fortalece a tua esperança."}, {"n": 153, "chapter": "Coração", "text": "Vamos! Diz-Lhe com generosidade e como um menino: - Que vais dar-me quando me exiges “isso”?"}, {"n": 154, "chapter": "Coração", "text": "Tens medo de tornar-te frio e duro para todos. Tanto te queres desapegar! Afasta essa preocupação. Se és de Cristo - todo de Cristo! -, para todos terás - também de Cristo - fogo, luz e calor."}, {"n": 155, "chapter": "Coração", "text": "Jesus não se satisfaz “compartilhando”; quer tudo."}, {"n": 156, "chapter": "Coração", "text": "Não queres submeter-te à Vontade de Deus... E, no entanto, acomodas-te à vontade de qualquer pobre criatura."}, {"n": 157, "chapter": "Coração", "text": "Não percas a perspectiva: se se dá a ti o próprio Deus, por que esse apego às criaturas?"}, {"n": 158, "chapter": "Coração", "text": "Agora, tudo são lágrimas. - Dói, não é mesmo? - Pois é claro! Por isso precisamente te acertaram com o dedo na chaga."}, {"n": 159, "chapter": "Coração", "text": "Fraqueja o teu coração e buscas um arrimo na terra. - Está bem. Mas procura que o apoio de que te serves para não cair não se converta em peso morto que te arraste, em cadeia que te escravize."}, {"n": 160, "chapter": "Coração", "text": "Escuta, escuta: isso... é uma amizade ou uma algema?"}, {"n": 161, "chapter": "Coração", "text": "Tens expansões de ternura. E eu te digo: - Caridade com o próximo, sim, sempre. Mas - ouve-me bem, alma de apóstolo -, é de Cristo, e só para Ele, esse outro sentimento que o próprio Senhor pôs em teu peito. - Além disso..., não é verdade que, ao abrires algum ferrolho do teu coração - necessitas de sete ferrolhos -, mais de uma vez ficou pairando em teu horizonte sobrenatural a nuvenzinha da dúvida... e perguntaste a ti mesmo, preocupado, apesar da tua pureza de intenção: - Não será que fui longe demais nas minhas manifestações exteriores de afeto?"}, {"n": 162, "chapter": "Coração", "text": "O coração, de lado. Primeiro, o dever. - Mas, ao cumprires o dever, põe nesse cumprimento o coração, que é suavidade."}, {"n": 163, "chapter": "Coração", "text": "“Se o teu olho direito te escandaliza..., arranca-o e joga-o para longe!” - Pobre coração, que é ele que te escandaliza! Aperta-o, amarfanha-o entre as mãos; não lhe dês consolações. - E, cheio de uma nobre compaixão, quando as pedir, segreda-lhe devagar, como em confidência: - “Coração: coração na Cruz, coração na Cruz!”"}, {"n": 164, "chapter": "Coração", "text": "Como vai esse coração? - Não te inquietes; os santos - que eram seres bem constituídos e normais, como tu e como eu - sentiam também essas “naturais” inclinações. E se não as tivessem sentido, a sua reação “sobrenatural” de guardar o coração - alma e corpo - para Deus, em vez de entregá-lo a uma criatura, pouco mérito teria tido. Por isso, uma vez visto o caminho, creio que a fraqueza do coração não deve ser obstáculo para uma alma decidida e “bem enamorada”."}, {"n": 165, "chapter": "Coração", "text": "Tu..., que por um pobre amor da terra passaste por tantas baixezas, acreditas de verdade que amas a Cristo, e não passas - por Ele! - essa humilhação?"}, {"n": 166, "chapter": "Coração", "text": "Escreves-me: “Padre, tenho... dor de dentes no coração”. - Não tomo isso como brincadeira, porque entendo que precisas de um bom dentista que te faça umas extrações. Se tu deixasses!..."}, {"n": 167, "chapter": "Coração", "text": "“Ah, se eu tivesse cortado no princípio!”, disseste-me. - Oxalá não tenhas que repetir essa exclamação tardia."}, {"n": 168, "chapter": "Coração", "text": "“Achei graça quando ouvi o senhor falar das “contas” que Deus lhe pedirá. Não, para vós Ele não será Juiz - no sentido austero da palavra -, mas simplesmente Jesus”. - Esta frase, escrita por um Bispo santo, que consolou mais de um coração atribulado, bem pode consolar o teu."}, {"n": 169, "chapter": "Coração", "text": "A dor esmaga-te porque a recebes com covardia. - Recebe-a como um valente, com espírito cristão; e a estimarás como um tesouro."}, {"n": 170, "chapter": "Coração", "text": "Que claro o caminho!... Que patentes os obstáculos!... Que boas armas para os vencer!... E, apesar disso, quantos desvios e quantos tropeços! Não é mesmo? - É esse fiozinho sutil (corrente; corrente de ferro forjado), que tu e eu conhecemos e que não queres quebrar, a causa que te afasta do caminho, que te faz tropeçar e até cair. - Que esperas para cortá-lo... e avançar?"}, {"n": 171, "chapter": "Coração", "text": "O Amor... bem vale um amor!"}, {"n": 172, "chapter": "Mortificação", "text": "Se não te mortificas, nunca serás alma de oração."}, {"n": 173, "chapter": "Mortificação", "text": "Essa frase feliz, a piada que não te escapou da boca, o sorriso amável para quem te incomoda, aquele silêncio ante a acusação injusta, a tua conversa afável com os maçantes e os inoportunos, o não dar importância cada dia a um pormenor ou outro, aborrecido e impertinente, das pessoas que convivem contigo... Isto, com perseverança, é que é sólida mortificação interior."}, {"n": 174, "chapter": "Mortificação", "text": "Não digas: essa pessoa me aborrece. - Pensa: essa pessoa me santifica."}, {"n": 175, "chapter": "Mortificação", "text": "Nenhum ideal se torna realidade sem sacrifício. - Nega-te a ti mesmo. - É tão belo ser vítima!"}, {"n": 176, "chapter": "Mortificação", "text": "Quantas vezes te propões servir a Deus em alguma coisa... e tens de conformar-te - tão miserável és! - com oferecer o despeito, a amargura de não teres sabido cumprir aquele propósito tão fácil!"}, {"n": 177, "chapter": "Mortificação", "text": "Não desaproveites a ocasião de abater o teu próprio juízo. - Custa..., mas como é agradável aos olhos de Deus!"}, {"n": 178, "chapter": "Mortificação", "text": "Quando vires uma pobre Cruz de madeira, só, desprezível e sem valor... e sem Crucificado, não esqueças que essa Cruz é a tua Cruz: a de cada dia, a escondida, sem brilho e sem consolação..., que está esperando o Crucificado que lhe falta. E esse Crucificado tens que ser tu."}, {"n": 179, "chapter": "Mortificação", "text": "Procura mortificações que não mortifiquem os outros."}, {"n": 180, "chapter": "Mortificação", "text": "Onde não há mortificação, não há virtude."}, {"n": 181, "chapter": "Mortificação", "text": "Mortificação interior. - Não acredito na tua mortificação interior, se vejo que desprezas, que não praticas a mortificação dos sentidos."}, {"n": 182, "chapter": "Mortificação", "text": "Bebamos até a última gota o cálice da dor na pobre vida presente. - Que importa padecer dez, vinte, cinqflenta anos..., se depois vem o Céu para sempre, para sempre..., para sempre? E sobretudo - melhor do que a razão apontada - “propter retributionem”"}, {"n": 183, "chapter": "Mortificação", "text": "Os olhos! Por eles entram na alma muitas iniqflidades. - Quantas experiências como a de Davi!... - Se guardardes a vista, tereis assegurado a guarda do vosso coração."}, {"n": 184, "chapter": "Mortificação", "text": "Para que hás de olhar, se “o teu mundo”, o levas dentro de ti?"}, {"n": 185, "chapter": "Mortificação", "text": "O mundo admira somente o sacrifício com espetáculo, porque ignora o valor do sacrifício escondido e silencioso."}, {"n": 186, "chapter": "Mortificação", "text": "É preciso dar-se de todo, é preciso negar-se de todo: o sacrifício tem que ser holocausto"}, {"n": 187, "chapter": "Mortificação", "text": "Paradoxo: para Viver é preciso morrer."}, {"n": 188, "chapter": "Mortificação", "text": "Olha que o coração é um traidor. - Fecha-o a sete chaves."}, {"n": 189, "chapter": "Mortificação", "text": "Tudo o que não te leva a Deus é um estorvo. Arranca-o e joga-o para longe."}, {"n": 190, "chapter": "Mortificação", "text": "Fazia o Senhor dizer a uma alma que tinha um superior iracundo e grosseiro: “Muito obrigado, meu Deus, por este tesouro verdadeiramente divino, porque, quando encontrarei outra pessoa que a cada amabilidade me corresponda com um par de coices?”"}, {"n": 191, "chapter": "Mortificação", "text": "Vence-te em cada dia desde o primeiro momento, levantando-te pontualmente a uma hora fixa, sem conceder um só minuto à preguiça. Se, com a ajuda de Deus, te venceres, muito terás adiantado para o resto do dia. Desmoraliza tanto sentir-se vencido na primeira escaramuça!"}, {"n": 192, "chapter": "Mortificação", "text": "Sais sempre vencido. - Propõe-te, de cada vez, a salvação de uma alma determinada, ou a sua santificação, ou a sua vocação para o apostolado... - Assim, estou certo da tua vitória."}, {"n": 193, "chapter": "Mortificação", "text": "Não sejas frouxo, mole. - Já é tempo de repelires essa estranha compaixão que sentes por ti mesmo."}, {"n": 194, "chapter": "Mortificação", "text": "Eu te vou dizer quais são os tesouros do homem na terra, para que não os desperdices: fome, sede, calor, frio, dor, desonra, pobreza, solidão, traição, calúnia, cárcere..."}, {"n": 195, "chapter": "Mortificação", "text": "Tinha razão quem disse que a alma e o corpo são dois inimigos que não se podem separar, e dois amigos que não se podem ver."}, {"n": 196, "chapter": "Mortificação", "text": "Ao corpo, é preciso dar-lhe um pouco menos que o necessário. Senão, atraiçoa."}, {"n": 197, "chapter": "Mortificação", "text": "Se foram testemunhas das tuas fraquezas e misérias, que importa que o sejam da tua penitência?"}, {"n": 198, "chapter": "Mortificação", "text": "Estes são os saborosos frutos da alma mortificada: compreensão e transigência para as misérias alheias; intransigência para as próprias."}, {"n": 199, "chapter": "Mortificação", "text": "Se o grão de trigo não morre, permanece infecundo. - Não queres ser grão de trigo, morrer pela mortificação e dar espigas bem graúdas? - Que Jesus abençoe o teu trigal!"}, {"n": 200, "chapter": "Mortificação", "text": "Não te vences, não és mortificado, porque és soberbo. - Dizes que tens uma vida penitente? Não te esqueças de que a soberba é compatível com a penitência... - Mais razões: teu desgosto depois da queda, depois das tuas faltas de generosidade, é dor ou despeito de te veres tão pequeno e sem forças? - Que longe estás de Jesus se não és humilde..., ainda que as tuas disciplinas façam florescer, cada dia, rosas novas!"}, {"n": 201, "chapter": "Mortificação", "text": "Que sabor a fel e a vinagre, a cinza e a azebre! Que paladar tão ressequido, pastoso e gretado! - Parece que não é nada essa impressão fisiológica, se a compararmos com os outros dissabores da tua alma. - É que te “pedem mais” e não o sabes dar. - Humilha-te: ficaria essa amarga impressão de desagrado, na tua carne e no teu espírito, se tivesses feito tudo quanto podes?"}, {"n": 202, "chapter": "Mortificação", "text": "Quer dizer que vais impor-te voluntariamente um castigo pela tua fraqueza e falta de generosidade? - Está certo; mas que seja uma penitência discreta, como imposta a um inimigo que ao mesmo tempo fosse nosso irmão."}, {"n": 203, "chapter": "Mortificação", "text": "A alegria dos pobrezinhos dos homens, ainda que tenha um motivo sobrenatural, deixa sempre um ressaibo de amargura. - Que julgavas? - Aqui em baixo, a dor é o sal da nossa vida."}, {"n": 204, "chapter": "Mortificação", "text": "Quantos se deixariam cravar numa cruz perante o olhar atônito de milhares de espectadores, e não sabem sofrer cristãmente as alfinetadas de cada dia! - Pensa então no que será mais heróico."}, {"n": 205, "chapter": "Mortificação", "text": "Estávamos lendo - tu e eu - a vida heroicamente vulgar daquele homem de Deus. - E o vimos lutar, durante meses e anos (que “contabilidade”, a do seu exame particular!), à hora do café da manhã: hoje vencia, amanhã era vencido... Anotava: “Não comi manteiga... Comi manteiga!” Oxalá vivêssemos também - tu e eu - a nossa... “tragédia” da manteiga."}, {"n": 206, "chapter": "Mortificação", "text": "O minuto heróico. - É a hora exata de te levantares. Sem hesitar: um pensamento sobrenatural e... fora! - O minuto heróico: aí tens uma mortificação que fortalece a tua vontade e não debilita a tua natureza."}, {"n": 207, "chapter": "Mortificação", "text": "Agradece, como um favor muito especial, esse santo aborrecimento que sentes de ti mesmo."}, {"n": 208, "chapter": "Penitência", "text": "Bendita seja a dor. - Amada seja a dor. Santificada seja a dor... Glorificada seja a dor!"}, {"n": 209, "chapter": "Penitência", "text": "Todo um programa, para cursar com aproveitamento a matéria da dor, nos dá o Apóstolo: “spe gaudentes” - na esperança, alegres; “in tribulatione patientes” - pacientes na tribulação; “orationi instantes” - na oração, perseverantes."}, {"n": 210, "chapter": "Penitência", "text": "Expiação: esta é a senda que conduz à Vida."}, {"n": 211, "chapter": "Penitência", "text": "Enterra com a penitência, no fosso profundo que a tua humildade abrir, as tuas negligências, ofensas e pecados. - Assim enterra o lavrador, ao pé da árvore que os produziu, frutos apodrecidos, ramos secos e folhas caducas. E o que era estéril, melhor, o que era prejudicial, contribui eficazmente para uma nova fecundidade. Aprende a tirar das quedas, impulso; da morte, vida."}, {"n": 212, "chapter": "Penitência", "text": "Esse Cristo que tu vês não é Jesus. - Será, quando muito, a triste imagem que podem formar teus olhos turvos... - Purifica-te. Clarifica o teu olhar com a humildade e a penitência. Depois... não te hão de faltar as luzes límpidas do Amor. E terás uma visão perfeita. A tua imagem será realmente a sua: Ele!"}, {"n": 213, "chapter": "Penitência", "text": "Jesus sofre para cumprir a Vontade do Pai... E tu, que também queres cumprir a Santíssima Vontade de Deus, seguindo os passos do Mestre, poderás queixar-te se encontras por companheiro de caminho o sofrimento?"}, {"n": 214, "chapter": "Penitência", "text": "Diz ao teu corpo: - Prefiro ter um escravo a sê-lo teu."}, {"n": 215, "chapter": "Penitência", "text": "Que medo têm as pessoas da expiação! Se o que fazem para ficar bem diante do mundo, o fizessem retificando a intenção, por Deus..., que santos seriam alguns e algumas!"}, {"n": 216, "chapter": "Penitência", "text": "Choras? - Não te envergonhes. Chora; sim, os homens também choram, como tu, na solidão e diante de Deus. - Durante a noite, diz o rei Davi, regarei de lágrimas o meu leito. Com essas lágrimas, ardentes e viris, podes purificar o teu passado e sobrenaturalizar a tua vida atual."}, {"n": 217, "chapter": "Penitência", "text": "Quero que sejas feliz na terra. - Não o serás se não perdes esse medo à dor. Porque, enquanto “caminhamos”, na dor está precisamente a felicidade."}, {"n": 218, "chapter": "Penitência", "text": "Que belo é perder a vida pela Vida!"}, {"n": 219, "chapter": "Penitência", "text": "Se sabes que essas dores - físicas ou morais - são purificação e merecimento, abençoa-as."}, {"n": 220, "chapter": "Penitência", "text": "Não te deixa um mau sabor na boca esse desejo de bem-estar fisiológico - “Deus lhe dê saúde” - com que certos pobres agradecem ou pedem uma esmola?"}, {"n": 221, "chapter": "Penitência", "text": "Se formos generosos na expiação voluntária, Jesus nos encherá de graça para amarmos as expiações que Ele nos mandar."}, {"n": 222, "chapter": "Penitência", "text": "Que a tua vontade exija aos sentidos, mediante a expiação, o que as outras potências lhe negam na oração."}, {"n": 223, "chapter": "Penitência", "text": "Vale tão pouco a penitência sem a contínua mortificação!"}, {"n": 224, "chapter": "Penitência", "text": "Tens medo da penitência?... Da penitência, que te ajudará a obter a Vida eterna? No entanto, não vês como os homens, para conservarem esta pobre vida de agora, se submetem às mil torturas de uma cruenta operação cirúrgica?"}, {"n": 225, "chapter": "Penitência", "text": "Teu maior inimigo és tu mesmo."}, {"n": 226, "chapter": "Penitência", "text": "Trata o teu corpo com caridade, mas não com mais caridade que a que se tem com um inimigo traidor."}, {"n": 227, "chapter": "Penitência", "text": "Se sabes que o teu corpo é teu inimigo, e inimigo da glória de Deus, por sê-lo da tua santificação, por que o tratas com tanta brandura?"}, {"n": 228, "chapter": "Penitência", "text": "“Passem muito boa tarde” - disseram-nos, como é costume -, e comentou uma alma muito de Deus: - Que desejos tão curtos!"}, {"n": 229, "chapter": "Penitência", "text": "Contigo, Jesus, que agradável é a dor e que luminosa a obscuridade!"}, {"n": 230, "chapter": "Penitência", "text": "Sofres! - Pois olha: “Ele” não tem o Coração menor que o nosso. - Sofres? Convém."}, {"n": 231, "chapter": "Penitência", "text": "O jejum rigoroso é penitência agradabilíssima a Deus. - Mas, ora por esta, ora por aquela razão, temos feito concessões. Não faz mal - muito pelo contrário! - que tu, com a aprovação do teu Diretor, o pratiques com freqflência."}, {"n": 232, "chapter": "Penitência", "text": "Motivos para a penitência? Desagravo, reparação, petição, ação de graças; meio para progredir...; por ti, por mim, pelos outros, pela tua família, pelo teu país, pela Igreja... E mil motivos mais."}, {"n": 233, "chapter": "Penitência", "text": "Não faças mais penitência do que a que o teu Diretor te consentir."}, {"n": 234, "chapter": "Penitência", "text": "Como enobrecemos a dor quando a colocamos no lugar que lhe corresponde - expiação - na economia do espírito!"}, {"n": 235, "chapter": "Exame de consciência", "text": "Exame. - Tarefa diária. - Contabilidade que nunca descura quem tem um negócio. E há negócio que renda mais que o negócio da vida eterna?"}, {"n": 236, "chapter": "Exame de consciência", "text": "À hora do exame, vai prevenido contra o demônio mudo."}, {"n": 237, "chapter": "Exame de consciência", "text": "Examina-te: devagar, com valentia. - Não é verdade que o teu mau humor e a tua tristeza inexplicáveis (inexplicáveis, aparentemente) procedem da tua falta de decisão em cortar os laços, sutis mas “concretos”, que te armou - arteiramente, com paliativos - a tua concupiscência?"}, {"n": 238, "chapter": "Exame de consciência", "text": "O exame geral assemelha-se à defesa. - O particular, ao ataque. - O primeiro é a armadura. O segundo, espada toledana"}, {"n": 239, "chapter": "Exame de consciência", "text": "Um olhar sobre o passado. - E... lamentar-te? Não, que é estéril. - Aprender, que é fecundo."}, {"n": 240, "chapter": "Exame de consciência", "text": "Pede luz. Insiste. - Até dares com a raiz, para lhe aplicares essa arma de combate que é o exame particular."}, {"n": 241, "chapter": "Exame de consciência", "text": "Com o exame particular tens de procurar diretamente adquirir uma virtude determinada ou arrancar o defeito que te domina."}, {"n": 242, "chapter": "Exame de consciência", "text": "“Quanto não devo a Deus, como cristão! A minha falta de correspondência, perante essa dívida, tem-me feito chorar de dor: de dor de Amor. “Mea culpa!”” - Bom é que vás reconhecendo as tuas dívidas. Mas não te esqueças de como se pagam: com lágrimas... e com obras."}, {"n": 243, "chapter": "Exame de consciência", "text": "“Qui fidelis est in minimo et in majori fidelis est”: quem é fiel no pouco, também o é no muito. - São palavras de São Lucas, que te indicam - faz exame - a raiz dos teus descaminhos."}, {"n": 244, "chapter": "Exame de consciência", "text": "Reage. - Ouve o que te diz o Espírito Santo: “Si inimicus meus maledixisset mihi, sustinuissem utique” - que o meu inimigo me ofenda, não é estranho e é mais tolerável. Mas tu... “tu vero homo unanimis, dux meus, et notus meus, qui simul mecum dulces capiebas cibos” - tu, meu amigo, meu apóstolo, que te sentas à minha mesa e comes comigo doces manjares!"}, {"n": 245, "chapter": "Exame de consciência", "text": "Em dias de retiro, o teu exame deve ser mais profundo e mais extenso que o habitual exame da noite. - Quando não, perdes uma grande ocasião de retificar."}, {"n": 246, "chapter": "Exame de consciência", "text": "Acaba sempre o teu exame com um ato de Amor - dor de Amor -: por ti, por todos os pecados dos homens... - E considera o cuidado paternal de Deus, que afastou de ti os obstáculos para que não tropeçasses."}, {"n": 247, "chapter": "Propósitos", "text": "Concretiza. - Que os teus propósitos não sejam fogos de artifício, que brilham um instante para deixarem, como realidade amarga, uma vareta de foguete, negra e inútil, que se joga fora com desprezo."}, {"n": 248, "chapter": "Propósitos", "text": "És tão jovem! - Pareces um barco que empreende viagem. - Esse ligeiro desvio de agora, se não o corriges, fará que no fim não chegues ao porto."}, {"n": 249, "chapter": "Propósitos", "text": "Faz poucos propósitos. - Faz propósitos concretos. - E cumpre-os com a ajuda de Deus."}, {"n": 250, "chapter": "Propósitos", "text": "Disseste-me e te ouvi em silêncio: “Sim, quero ser santo”. Se bem que esta afirmação, tão esfumada, tão geral, me pareça normalmente uma tolice."}, {"n": 251, "chapter": "Propósitos", "text": "Amanhã! Algumas vezes, é prudência; muitas vezes, é o advérbio dos vencidos."}, {"n": 252, "chapter": "Propósitos", "text": "Faz este propósito determinado e firme: lembrar-te, quando te derem honras e louvores, daquilo que te envergonha e te faz corar. Isso é teu; o louvor e a glória, de Deus."}, {"n": 253, "chapter": "Propósitos", "text": "Porta-te bem “agora”, sem te lembrares do “ontem”, que já passou, e sem te preocupares com o “amanhã”, que não sabes se chegará para ti."}, {"n": 254, "chapter": "Propósitos", "text": "Agora! Volta à tua vida nobre agora. Não te deixes enganar: “agora” não é demasiado cedo... nem demasiado tarde."}, {"n": 255, "chapter": "Propósitos", "text": "Queres que te diga tudo o que penso do “teu caminho”? Pois olha: verás que, se correspondes à chamada divina, trabalharás por Cristo como ninguém; se te fazes homem de oração, obterás essa correspondência de que te falo, e procurarás, com fome de sacrifício, os trabalhos mais duros... E serás feliz aqui, e felicíssimo depois, na Vida."}, {"n": 256, "chapter": "Propósitos", "text": "Essa chaga dói. - Está, porém, em vias de cura; sê conseqflente com os teus propósitos. E em breve a dor será gozosa paz."}, {"n": 257, "chapter": "Propósitos", "text": "Estás como um saco de areia. - Não fazes nada da tua parte. E assim não admira que comeces a sentir os sintomas da tibieza. - Reage."}, {"n": 258, "chapter": "Escrúpulos", "text": "Repele esses escrúpulos que te tiram a paz. - Não é de Deus o que rouba a paz da alma. Quando Deus te visitar, hás de sentir a verdade daquelas saudações: “Dou - vos a paz..., deixo-vos a paz..., a paz seja convosco...” E isso, no meio da tribulação."}, {"n": 259, "chapter": "Escrúpulos", "text": "Ainda os escrúpulos! - Fala com simplicidade e clareza ao teu Diretor. Obedece..., e não julgues que é tão mesquinho assim o Coração amorosíssimo do Senhor."}, {"n": 260, "chapter": "Escrúpulos", "text": "Tristeza, abatimento. - Não me admira; é a nuvem de pó que a tua queda levantou. Mas basta! Por acaso o vento da graça não levou para longe essa nuvem? Além disso, a tua tristeza, se não a repeles, bem pode ser o invólucro da tua soberba. - Julgavas-te perfeito e impecável?"}, {"n": 261, "chapter": "Escrúpulos", "text": "Proíbo-te que penses mais nisso. - Pelo contrário, louva a Deus, que devolveu a vida à tua alma."}, {"n": 262, "chapter": "Escrúpulos", "text": "Não penses mais na tua queda. - Esse pensamento, além de pesada laje que te cobre e esmaga, facilmente se tornará ocasião de próximas tentações. - Cristo te perdoou. Esquece o “homem velho”."}, {"n": 263, "chapter": "Escrúpulos", "text": "Não desanimes. - Eu te vi lutar... A tua derrota de hoje é treino para a vitória definitiva."}, {"n": 264, "chapter": "Escrúpulos", "text": "Sei que te portaste bem..., apesar de teres caído tão fundo. - Sei que te portaste bem, porque te humilhaste, porque retificaste, porque te encheste de esperança, e a esperança te trouxe de novo ao Amor. - Não faças essa cara boba de surpresa; de fato, te portaste bem! - Já te levantaste do chão. “Surge”, clamou de novo a voz poderosa, “et ambula!”"}, {"n": 265, "chapter": "Presença de Deus", "text": "Os filhos..., como procuram comportar-se dignamente quando estão diante de seus pais! E os filhos de Reis, diante de seu pai El-Rei, como procuram guardar a dignidade da realeza! E tu... não sabes que estás sempre diante do Grande Rei, teu Pai-Deus?"}, {"n": 266, "chapter": "Presença de Deus", "text": "Não tomes uma decisão sem te deteres a considerar o assunto diante de Deus."}, {"n": 267, "chapter": "Presença de Deus", "text": "É preciso convencer-se de que Deus está junto de nós continuamente. - Vivemos como se o Senhor estivesse lá longe, onde brilham as estrelas, e não consideramos que também está sempre ao nosso lado. E está como um Pai amoroso - quer mais a cada um de nós do que todas as mães do mundo podem querer a seus filhos -, ajudando-nos, inspirando-nos, abençoando... e perdoando. Quantas vezes fizemos desanuviar o rosto de nossos pais dizendo-lhes, depois de uma travessura: Não volto a fazer mais! - Talvez naquele mesmo dia tenhamos tornado a cair... - E o nosso pai, com fingida dureza na voz, de cara séria, repreende-nos..., ao mesmo tempo que se enternece o seu coração, conhecedor da nossa fraqueza, pensando: - Pobre criatura, que esforços faz para se portar bem! Necessário é que nos embebamos, que nos saturemos de que Pai e muito Pai nosso é o Senhor que está junto de nós e nos céus."}, {"n": 268, "chapter": "Presença de Deus", "text": "Habitua-te a elevar o coração a Deus em ação de graças, muitas vezes ao dia. - Porque te dá isto e aquilo. - Porque te desprezaram. - Porque não tens o que precisas, ou porque o tens. Porque fez tão formosa a sua Mãe, que é também tua Mãe. - Porque criou o Sol e a Lua e este animal e aquela planta. - Porque fez aquele homem eloqflente e a ti te fez difícil de palavra... Dá-Lhe graças por tudo, porque tudo é bom."}, {"n": 269, "chapter": "Presença de Deus", "text": "Não sejas tão cego ou tão estouvado que deixes de meter-te dentro de cada Sacrário quando divisares os muros ou as torres das casas do Senhor. - Ele te espera. Não sejas tão cego ou tão estouvado que deixes de rezar a Maria Imaculada ao menos uma jaculatória sempre que passes junto de lugares onde sabes que se ofende a Cristo."}, {"n": 270, "chapter": "Presença de Deus", "text": "Não te alegras quando descobres no teu caminho habitual, pelas ruas da cidade, outro Sacrário?"}, {"n": 271, "chapter": "Presença de Deus", "text": "Dizia uma alma de oração: - Nas intenções, seja Jesus o nosso fim; nos afetos, o nosso Amor; na palavra, o nosso assunto; nas ações, o nosso modelo."}, {"n": 272, "chapter": "Presença de Deus", "text": "Emprega esses santos “expedientes humanos” que te aconselhei para não perderes a presença de Deus: jaculatórias, atos de Amor e desagravo, comunhões espirituais, “olhares” à imagem de Nossa Senhora..."}, {"n": 273, "chapter": "Presença de Deus", "text": "Só! - Não estás só. Fazemos-te muita companhia, mesmo de longe. - Além disso..., firmado na tua alma em graça, o Espírito Santo - Deus contigo - vai dando tom sobrenatural a todos os teus pensamentos, desejos e obras."}, {"n": 274, "chapter": "Presença de Deus", "text": "“Padre” - dizia-me aquele rapagão (que será feito dele?), bom estudante da Central"}, {"n": 275, "chapter": "Presença de Deus", "text": "Não duvido da tua retidão. - Sei que ages na presença de Deus. Mas... (há um “mas”!) as tuas ações são presenciadas ou podem ser presenciadas por homens que julguem humanamente... E é preciso dar-lhes bom exemplo."}, {"n": 276, "chapter": "Presença de Deus", "text": "Se te habituares, mesmo que seja uma só vez por semana, a procurar a união com Maria para ir a Jesus, verás como tens mais presença de Deus."}, {"n": 277, "chapter": "Presença de Deus", "text": "Perguntas-me: - Por que essa Cruz de madeira? - E copio de uma carta: “Ao levantar a vista do microscópio, o olhar vai tropeçar na Cruz negra e vazia. Esta Cruz sem Crucificado é um símbolo. Tem um sentido que os outros não entenderão. E aquele que, cansado, estava a ponto de abandonar a tarefa, aproxima de novo os olhos da ocular e continua trabalhando: porque a Cruz solitária está pedindo uns ombros que carreguem com ela.”"}, {"n": 278, "chapter": "Presença de Deus", "text": "Tem presença de Deus e terás vida sobrenatural."}, {"n": 279, "chapter": "Vida sobrenatural", "text": "As pessoas, geralmente, têm uma visão plana, pegada à terra, de duas dimensões. - Quando a tua vida for sobrenatural, obterás de Deus a terceira dimensão: a altura. E, com ela, o relevo, o peso e o volume."}, {"n": 280, "chapter": "Vida sobrenatural", "text": "Se perdes o sentido sobrenatural da tua vida, a tua caridade será filantropia; a tua pureza, decência; a tua mortificação, bobice; as tuas disciplinas, látego; e todas as tuas obras, estéreis."}, {"n": 281, "chapter": "Vida sobrenatural", "text": "O silêncio é como que o porteiro da vida interior."}, {"n": 282, "chapter": "Vida sobrenatural", "text": "Paradoxo: é mais acessível ser santo do que sábio, mas é mais fácil ser sábio do que santo."}, {"n": 283, "chapter": "Vida sobrenatural", "text": "Distrair-te. - Precisas distrair-te..., abrindo muito os olhos, para que entrem bem as imagens das coisas, ou fechando-os quase, por exigências da tua miopia... Fecha-os de todo! Tem vida interior, e verás, com cor e relevo inesperados, as maravilhas de um mundo melhor, de um mundo novo: e terás intimidade com Deus..., e conhecerás a tua miséria..., e te endeusarás..., com um endeusamento que, aproximando-te de teu Pai, te fará mais irmão dos teus irmãos, os homens."}, {"n": 284, "chapter": "Vida sobrenatural", "text": "Aspiração: que eu seja bom, e todos os outros melhores do que eu."}, {"n": 285, "chapter": "Vida sobrenatural", "text": "A conversão é coisa de um instante. A santificação é obra de toda a vida."}, {"n": 286, "chapter": "Vida sobrenatural", "text": "Não há nada melhor no mundo do que estar em graça de Deus."}, {"n": 287, "chapter": "Vida sobrenatural", "text": "Pureza de intenção. - Tê-la-ás sempre se, sempre e em tudo, só procurares agradar a Deus."}, {"n": 288, "chapter": "Vida sobrenatural", "text": "Mete-te nas chagas de Cristo Crucificado. Ali aprenderás a guardar os teus sentidos, terás vida interior, e oferecerás ao Pai continuamente as dores do Senhor e as de Maria, para pagar por tuas dívidas e por todas as dívidas dos homens."}, {"n": 289, "chapter": "Vida sobrenatural", "text": "Essa tua santa impaciência por servir a Deus não Lhe desagrada. - Mas será estéril se não for acompanhada de um efetivo melhoramento na tua conduta diária."}, {"n": 290, "chapter": "Vida sobrenatural", "text": "Retificar. - Cada dia um pouco. - Eis o teu trabalho constante, se de verdade queres tornar-te santo."}, {"n": 291, "chapter": "Vida sobrenatural", "text": "Tens obrigação de santificar-te. - Tu também. - Alguém pensa, por acaso, que é tarefa exclusiva de sacerdotes e religiosos? A todos, sem exceção, disse o Senhor: “Sede perfeitos, como meu Pai Celestial é perfeito”."}, {"n": 292, "chapter": "Vida sobrenatural", "text": "A tua vida interior deve ser isso precisamente: começar... e recomeçar."}, {"n": 293, "chapter": "Vida sobrenatural", "text": "Na vida interior, tens considerado devagar a beleza de “servir” com voluntariedade sempre atual?"}, {"n": 294, "chapter": "Vida sobrenatural", "text": "Não se viam as plantas cobertas pela neve. - E o agricultor, dono do campo, comentou jovialmente: “Agora estão crescendo para dentro”. - Pensei em ti, na tua forçosa inatividade... - E... diz-me uma coisa: também cresces para dentro?"}, {"n": 295, "chapter": "Vida sobrenatural", "text": "Se não és senhor de ti mesmo, ainda que sejas poderoso, dá-me pena e riso o teu senhorio."}, {"n": 296, "chapter": "Vida sobrenatural", "text": "É duro ler nos Santos Evangelhos a pergunta de Pilatos: “Quem quereis que vos solte? Barrabás ou Jesus, que se chama Cristo?” - É mais penoso ouvir a resposta: “Barrabás!” E mais terrível ainda verificar que - muitas vezes! -, ao afastar-me do caminho, tenho dito também: “Barrabás!” E tenho acrescentado: “Cristo?... “Crucifige eum!” - Crucifica-o!”"}, {"n": 297, "chapter": "Vida sobrenatural", "text": "Tudo isso, que te preocupa de momento, é mais ou menos importante. - O que importa acima de tudo é que sejas feliz, que te salves."}, {"n": 298, "chapter": "Vida sobrenatural", "text": "Luzes novas! - Que alegria sentes porque o Senhor te fez descobrir uma nova América! - Aproveita esses instantes: é a hora de romperes a cantar um hino de ação de graças, e é também a hora de sacudires o pó de alguns recantos da tua alma, de abandonares certas rotinas, de agires mais sobrenaturalmente, de evitares um possível escândalo ao próximo... - Numa palavra: que o teu agradecimento se manifeste em um propósito concreto."}, {"n": 299, "chapter": "Vida sobrenatural", "text": "Cristo morreu por ti. - Tu... que deves fazer por Cristo?"}, {"n": 300, "chapter": "Vida sobrenatural", "text": "A tua experiência pessoal - esse desabrimento, essa inquietação, essa amargura - faz-te sentir a verdade daquelas palavras de Jesus: “Ninguém pode servir a dois senhores!”"}, {"n": 301, "chapter": "Mais sobre vida interior", "text": "Um segredo. - Um segredo em voz alta: estas crises mundiais são crises de santos. Deus quer um punhado de homens “seus” em cada atividade humana. - Depois... “pax Christi in regno Christi” - a paz de Cristo no reino de Cristo."}, {"n": 302, "chapter": "Mais sobre vida interior", "text": "O teu Crucifixo. - Como cristão, deverias trazer sempre contigo o teu Crucifixo. E colocá-lo sobre a tua mesa de trabalho. E beijá-lo antes de te entregares ao descanso e ao acordar. - E quando o pobre corpo se rebelar contra a tua alma, beija-o também."}, {"n": 303, "chapter": "Mais sobre vida interior", "text": "Perde o medo de chamar o Senhor pelo seu nome - Jesus - e de Lhe dizer que O amas."}, {"n": 304, "chapter": "Mais sobre vida interior", "text": "Procura encontrar diariamente uns minutos dessa bendita solidão que tanta falta te faz para teres em andamento a vida interior."}, {"n": 305, "chapter": "Mais sobre vida interior", "text": "Escreveste-me: “A simplicidade é como que o sal da perfeição. E é o que me falta. Quero consegui-la, com a ajuda dEle e a sua”. - Nem a dEle nem a minha te hão de faltar. - Põe em prática os meios."}, {"n": 306, "chapter": "Mais sobre vida interior", "text": "Que a vida do homem sobre a terra é milícia, disse-o Jó há muitos séculos. Ainda há comodistas que não deram por isso."}, {"n": 307, "chapter": "Mais sobre vida interior", "text": "Esse modo sobrenatural de proceder é uma verdadeira tática militar. - Sustentas a guerra - as lutas diárias da tua vida interior - em posições que colocas longe dos redutos da tua fortaleza. E o inimigo acode aí: à tua pequena mortificação, à tua oração habitual, ao teu trabalho metódico, ao teu plano de vida; e é difícil que chegue a aproximar-se dos torreões, fracos para o assalto, do teu castelo. E, se chega, chega sem eficácia."}, {"n": 308, "chapter": "Mais sobre vida interior", "text": "Escreves-me e copio: “A minha alegria e a minha paz... Nunca poderei ter verdadeira alegria se não tiver paz. E o que é a paz? A paz é algo de muito relacionado com a guerra. A paz é conseqflência da vitória. A paz exige de mim uma contínua luta. Sem luta, não poderei ter paz”."}, {"n": 309, "chapter": "Mais sobre vida interior", "text": "Repara que entranhas de misericórdia tem a justiça de Deus! - Porque, nos julgamentos humanos, castiga-se a quem confessa a sua culpa; e no divino, perdoa-se. Bendito seja o santo Sacramento da Penitência!"}, {"n": 310, "chapter": "Mais sobre vida interior", "text": "“Induimini Dominum Jesum Christum” - revesti-vos de Nosso Senhor Jesus Cristo, dizia São Paulo aos Romanos. - É no Sacramento da Penitência que tu e eu nos revestimos de Jesus Cristo e dos seus merecimentos."}, {"n": 311, "chapter": "Mais sobre vida interior", "text": "A guerra! - A guerra - dizes - tem uma finalidade sobrenatural desconhecida do mundo: a guerra foi feita para nós... - A guerra é o obstáculo máximo do caminho fácil. - Mas temos de amá-la, ao fim e ao cabo, como o religioso deve amar as suas disciplinas."}, {"n": 312, "chapter": "Mais sobre vida interior", "text": "O poder do teu nome, Senhor! - Encabecei a minha carta como costumo: “Jesus te guarde”. - E me escrevem: “O “Jesus te guarde” da sua carta já me serviu para escapar de uma boa. Que Ele os guarde a todos também”."}, {"n": 313, "chapter": "Mais sobre vida interior", "text": "“Já que o Senhor me ajuda com a sua habitual generosidade, procurarei corresponder com um “aprimoramento” dos meus modos”, disseste-me. - E eu nada tive que acrescentar."}, {"n": 314, "chapter": "Mais sobre vida interior", "text": "Escrevi-te dizendo: “Apóio-me em ti. Vê lá o que fazemos!...” - Que havíamos de fazer, senão apoiar-nos no Outro!"}, {"n": 315, "chapter": "Mais sobre vida interior", "text": "Missionário. - Sonhas em ser missionário. Tens vibrações como as de Xavier, e queres conquistar para Cristo um império. - O Japão, a China, a Índia, a Rússia..., os povos frios do norte da Europa, ou a América, ou a África, ou a Austrália... - Fomenta esses incêndios em teu coração, essa fome de almas. Mas não esqueças que és mais missionário “obedecendo”. Geograficamente longe desses campos de apostolado, trabalhas “aqui” e “ali”. Não sentes - como Xavier! - o braço cansado, depois de administrares a tantos o batismo?"}, {"n": 316, "chapter": "Mais sobre vida interior", "text": "Dizes que sim, que queres. - Está bem. - Mas... queres como um avaro quer o seu ouro, como uma mãe quer ao seu filho, como um ambicioso quer as honras, ou como um pobre sensual quer o seu prazer? - Não? Então não queres."}, {"n": 317, "chapter": "Mais sobre vida interior", "text": "Que empenho põem os homens nos seus assuntos terrenos!: sonhos de honras, ambição de riquezas, preocupações de sensualidade. - Eles e elas, ricos e pobres, velhos e homens feitos e moços e até crianças; todos a mesma coisa. - Quando tu e eu pusermos o mesmo empenho nos assuntos da nossa alma, teremos uma fé viva e operante; e não haverá obstáculo que não vençamos nos nossos empreendimentos apostólicos."}, {"n": 318, "chapter": "Mais sobre vida interior", "text": "Para ti, que és esportista, que boa razão é a do Apóstolo!: “Nescitis quod ii qui in stadio currunt omnes quidem currunt, sed unus accipit bravium? Sic currite ut comprehendatis”. - Não sabeis que, dos que correm no estádio, embora todos corram, um só obtém o prêmio? Correi de tal maneira que o ganheis."}, {"n": 319, "chapter": "Mais sobre vida interior", "text": "Recolhe-te. - Procura a Deus em ti e escuta-O."}, {"n": 320, "chapter": "Mais sobre vida interior", "text": "Fomenta esses pensamentos nobres, esses santos desejos incipientes... - Uma faísca pode dar origem a uma fogueira."}, {"n": 321, "chapter": "Mais sobre vida interior", "text": "Alma de apóstolo: essa intimidade de Jesus contigo - tão junto dEle, tantos anos! - não te diz nada?"}, {"n": 322, "chapter": "Mais sobre vida interior", "text": "É verdade que ao nosso Sacrário chamo sempre Betânia... - Faz-te amigo dos amigos do Mestre: Lázaro, Marta, Maria. - E depois não me perguntarás mais por que chamo Betânia ao nosso Sacrário."}, {"n": 323, "chapter": "Mais sobre vida interior", "text": "Tu sabes que há “conselhos evangélicos”. Segui-los é uma finura de Amor. - Dizem que é caminho de poucos. - Às vezes penso que podia ser caminho de muitos."}, {"n": 324, "chapter": "Mais sobre vida interior", "text": "“Quia hic homo coepit aedificare et non potuit consummare!” - começou a edificar e não pôde terminar! Triste comentário que, se quiseres, não se fará de ti, porque tens todos os meios para coroar o edifício da tua santificação: a graça de Deus e a tua vontade."}, {"n": 325, "chapter": "Tibieza", "text": "Luta contra essa frouxidão que te faz preguiçoso e desleixado na tua vida espiritual. - Olha que pode ser o princípio da tibieza..., e, na frase da Escritura, aos tíbios, Deus os vomitará."}, {"n": 326, "chapter": "Tibieza", "text": "Dói-me ver o perigo de tibieza em que te encontras quando não te vejo caminhar seriamente para a perfeição dentro do teu estado. - Diz comigo: Não quero tibieza! “Confige timore tuo carnes meas!” - dá - me, meu Deus, um temor filial que me faça reagir!"}, {"n": 327, "chapter": "Tibieza", "text": "Já sei que evitas os pecados mortais. - Queres salvar-te! - Mas não te preocupa esse contínuo cair deliberadamente em pecados veniais, ainda que sintas o chamado de Deus para te venceres em cada caso. - É a tibieza que torna a tua vontade tão fraca."}, {"n": 328, "chapter": "Tibieza", "text": "Que pouco Amor de Deus tens quando cedes sem luta só porque não é pecado grave!"}, {"n": 329, "chapter": "Tibieza", "text": "Os pecados veniais fazem muito mal à alma. - Por isso, “capite nobis vulpes parvulas, quae demoliuntur vineas”, diz o Senhor no “Cântico dos Cânticos”: caçai as pequenas raposas que destroem a vinha."}, {"n": 330, "chapter": "Tibieza", "text": "Que pena me dás enquanto não sentires dor dos teus pecados veniais! - Porque, até então, não terás começado a ter verdadeira vida interior."}, {"n": 331, "chapter": "Tibieza", "text": "És tíbio se fazes preguiçosamente e de má vontade as coisas que se referem ao Senhor; se procuras com cálculo ou “manha” o modo de diminuir os teus deveres; se só pensas em ti e na tua comodidade; se as tuas conversas são ociosas e vãs; se não aborreces o pecado venial; se ages por motivos humanos."}, {"n":
