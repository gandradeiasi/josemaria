é o discípulo mais do que o Mestre”."}, {"n": 240, "chapter": "Sofrimento", "text": "Para um filho de Deus, as contradições e as calúnias são, como para um soldado, feridas recebidas no campo de batalha."}, {"n": 241, "chapter": "Sofrimento", "text": "Andas na boca de todos... Que importa a fama? De qualquer modo, não sintas vergonha nem pena por ti, mas por eles: pelos que te maltratam."}, {"n": 242, "chapter": "Sofrimento", "text": "Umas vezes, não querem entender: estão como cegos... Mas, outras, és tu que não consegues fazer-te compreender: corrige-te!"}, {"n": 243, "chapter": "Sofrimento", "text": "Não basta ter razão. Além disso, é necessário fazê-la valer..., e que os outros queiram reconhecê-la. Não obstante, afirma a verdade sempre que for necessário, sem te deteres pelo “que vão dizer”."}, {"n": 244, "chapter": "Sofrimento", "text": "Se freqflentas a escola do Mestre, não te há de estranhar que também tenhas de labutar contra a incompreensão de tantas e tantas pessoas, que poderiam ajudar-te muitíssimo se simplesmente fizessem o menor esforço por ser compreensivas."}, {"n": 245, "chapter": "Sofrimento", "text": "Não o maltrataste fisicamente... Mas ignoraste-o tantas vezes! Olhaste-o com indiferença como se fosse um estranho. - Parece-te pouco?"}, {"n": 246, "chapter": "Sofrimento", "text": "Sem o pretender, os que perseguem santificam... - Mas ai desses “santificadores”!"}, {"n": 247, "chapter": "Sofrimento", "text": "Na terra, muitas vezes se paga caluniando."}, {"n": 248, "chapter": "Sofrimento", "text": "Há almas que parecem empenhadas em inventar sofrimentos, torturando-se com a imaginação. Depois, quando chegam penas e contrariedades objetivas, não sabem estar como a Santíssima Virgem, ao pé da Cruz, com o olhar pendente do seu Filho."}, {"n": 249, "chapter": "Sofrimento", "text": "Sacrifício, sacrifício! - É verdade que seguir a Jesus Cristo - disse-o Ele - é levar a Cruz. Mas não gosto de ouvir as almas que amam o Senhor falarem tanto de cruzes e de renúncias: porque, quando há Amor, o sacrifício é prazeroso - ainda que custe - e a cruz é a Santa Cruz. - A alma que sabe amar é entregar-se assim, enche-se de alegria e de paz. Então, por que insistir em “sacrifício”, como que procurando consolo, se a Cruz de Cristo - que é a tua vida - te faz feliz?"}, {"n": 250, "chapter": "Sofrimento", "text": "Quanta neurastenia e histerismo se eliminariam se - com a doutrina católica - se ensinasse de verdade as pessoas a viverem como cristãos; amando a Deus e sabendo aceitar as contrariedades como bênção vinda da sua mão!"}, {"n": 251, "chapter": "Sofrimento", "text": "Não passes indiferente diante da dor alheia. Essa pessoa - um parente, um amigo, um colega..., esse que não conheces - é teu irmão. - Lembra-te daquilo que relata o Evangelho e que tantas vezes leste com pena: nem sequer os parentes de Jesus confiavam nEle. - Procura que a cena se repita."}, {"n": 252, "chapter": "Sofrimento", "text": "Imagina que na terra não existem senão Deus e Tu. - Assim te será mais fácil sofrer as mortificações, as humilhações... E, por fim, farás as coisas que Deus quer e como Ele as quer."}, {"n": 253, "chapter": "Sofrimento", "text": "Às vezes - comentava aquele doente consumido de zelo pelas almas -, o corpo reclama um pouco, queixa-se. Mas procuro também transformar “esses queixumes” em sorrisos, porque se mostram muito eficazes."}, {"n": 254, "chapter": "Sofrimento", "text": "Uma doença incurável, que limitava a sua ação. E, no entanto, dizia-me contente: “A doença porta-se bem comigo e cada vez a amo mais; se me dessem a escolher, voltaria a nascer assim mil vezes!”."}, {"n": 255, "chapter": "Sofrimento", "text": "Jesus chegou à cruz depois de se preparar durante trinta e três anos, toda a sua Vida! - Seus discípulos, se de verdade desejam imitá-lo, devem converter a sua existência em corredenção de Amor, com a negação de si mesmos, ativa e passiva."}, {"n": 256, "chapter": "Sofrimento", "text": "A Cruz está presente em tudo, e chega quando menos se espera. - Mas não esqueças que, ordinariamente, andam emparelhados o começo da Cruz e o começo da eficácia."}, {"n": 257, "chapter": "Sofrimento", "text": "O Senhor, Sacerdote Eterno, abençoa sempre com a Cruz."}, {"n": 258, "chapter": "Sofrimento", "text": "“Cor Mariae perdolentis, miserere nobis!” - invoca o Coração de Santa Maria, com ânimo e decisão de te unires à sua dor, em reparação pelos teus pecados e pelos de todos os homens de todos os tempos. - E pede-lhe - para cada alma - que essa sua dor aumente em nós a aversão pelo pecado, e que saibamos amar, com expiação, as contrariedades físicas ou morais de cada jornada."}, {"n": 259, "chapter": "Humildade", "text": "“A oração” é a humildade do homem que reconhece a sua profunda miséria e a grandeza de Deus, a quem se dirige e adora, de maneira que tudo espera dEle e nada de si mesmo. “A fé” é a humildade da razão, que renuncia ao seu próprio critério e se prostra diante dos juízos e da autoridade da Igreja. “A obediência” é a humildade da vontade, que se sujeita ao querer alheio, por Deus. “A castidade” é a humildade da carne, que se submete ao espírito. “A mortificação” é a humildade de todas as paixões, imoladas ao Senhor. - A humildade é a verdade no caminho da luta ascética."}, {"n": 260, "chapter": "Humildade", "text": "É uma grande coisa saber-se nada diante de Deus, porque é assim mesmo."}, {"n": 261, "chapter": "Humildade", "text": "“Aprendei de mim, que sou manso e humilde de coração...” Humildade de Jesus!... Que lição para ti, que és um pobre instrumento de barro! Ele - sempre misericordioso - te levantou, fazendo brilhar na tua baixeza, elevada gratuitamente, as luzes do sol da graça. E tu, quantas vezes não disfarçaste a tua soberba sob a capa da dignidade, da justiça...! E quantas ocasiões de aprender do Mestre não desaproveitaste, por não teres sabido sobrenaturalizá - la!"}, {"n": 262, "chapter": "Humildade", "text": "Essas depressões, porque vês ou porque descobrem os teus defeitos, não têm fundamento... - Pede a verdadeira humildade."}, {"n": 263, "chapter": "Humildade", "text": "Deixa-me que te recorde, entre outros, alguns sinais evidentes de falta de humildade: - pensar que o que fazes ou dizes está mais bem feito ou dito do que aquilo que os outros fazem ou dizem; - querer levar sempre a tua avante; - discutir sem razão ou - quando a tens - insistir com teimosia e de maus modos; - dar o teu parecer sem que to peçam, ou sem que a caridade o exija; - desprezar o ponto de vista dos outros; - não encarar todos os teus dons e qualidades como emprestados; - não reconhecer que és indigno de qualquer nota e estima, que não mereces sequer a terra que pisas e as coisas que possuis; - citar-te a ti mesmo como exemplo nas conversas; - falar mal de ti mesmo, para que façam bom juízo de ti ou te contradigam; - desculpar-te quando te repreendem; - ocultar ao Diretor algumas faltas humilhantes, para que não perca o conceito que faz de ti; - ouvir com complacência quando te louvam; ou alegrar-te de que tenham falado bem de ti; - doer-te de que outros sejam mais estimados do que tu; - nega-te a desempenhar ofícios inferiores; - procurar ou desejar singularizar-te; - insinuar na conversa palavras de louvor próprio ou que dêem a entender a tua honradez, o teu engenho ou habilidade, o teu prestígio profissional...; - envergonhar-te por careceres de certos bens..."}, {"n": 264, "chapter": "Humildade", "text": "Ser humilde não é o mesmo que ter angústia ou temor."}, {"n": 265, "chapter": "Humildade", "text": "Fujamos dessa falsa humildade que se chama comodismo."}, {"n": 266, "chapter": "Humildade", "text": "Diz-Lhe Pedro: Senhor, Tu lavares-me os pés a mim?! Respondeu Jesus: O que eu faço, tu não o entendes agora; entendê-lo-ás depois. Insiste Pedro: Jamais me lavarás os pés. Replicou Jesus: Se eu não te lavar, não terás parte comigo. Rende-se Simão Pedro: Senhor, não somente os pés, mas também as mãos e a cabeça. Perante a chamada para uma entrega total, completa, sem vacilações, muitas vezes opomos uma falsa modéstia, como a de Pedro... Oxalá fôssemos também homens de coração como o Apóstolo! Pedro não permite que ninguém ame mais a Jesus do que ele. Esse amor leva a reagir assim; Aqui estou!, lava-me as mãos, cabeça, pés!, purifica-me de todo!, que eu quero entregar-me a Ti sem reservas."}, {"n": 267, "chapter": "Humildade", "text": "Para ti, transcrevo de uma carta: “Encanta-me a humildade evangélica. Mas revolta-me o encolhimento acarneirado e inconsciente de alguns cristãos, que assim desprestigiam a Igreja. Neles deve ter reparado aquele escritor ateu, quando disse que a moral cristã é uma moral de escravos...” - Realmente, somos servos: servos elevados à categoria de filhos de Deus, que não desejam comportar-se como escravos das paixões."}, {"n": 268, "chapter": "Humildade", "text": "O convencimento do teu “material ruim” - o teu conhecimento próprio - dar - te-á uma reação sobrenatural; que fará arraigar mais e mais na tua alma o contentamento e a paz, perante a humilhação, o desprezo, a calúnia... Depois de pronunciares o “fiat” - Senhor, o que Tu quiseres -, o teu raciocínio nesses casos deverá ser: “Só disse isso de mil? Vê-se que não me conhece; de outro modo, não teria parado por aí”. Como estás convencido de que mereces pior tratamento, sentirás gratidão por aquela pessoa, e te alegrarás com o que faria sofrer a outro."}, {"n": 269, "chapter": "Humildade", "text": "Quanto mais alto se levanta a estátua, tanto mais duro e perigoso é depois o choque na queda."}, {"n": 270, "chapter": "Humildade", "text": "Vai à direção espiritual cada vez com maior humildade, e pontualmente, o que é também humildade. Pensa - e não te enganas, porque aí é Deus quem te fala - que és como uma criança pequena - sincera! -, a quem vão ensinando a falar, a ler, a conhecer as flores e os pássaros, a viver as alegrias e as penas, a reparar no chão que pisa."}, {"n": 271, "chapter": "Humildade", "text": "“Continuo a ser uma pobre criatura”, dizes-me. Mas antes, quanto reparavas nisso, passavas tão mal! Agora, sem caíres na habituação ou nas transigências, vai-te acostumando a sorrir, e a recomeçar a tua luta com uma alegria crescente."}, {"n": 272, "chapter": "Humildade", "text": "Se és sensato, humilde, deves ter observado que nunca se acaba de aprender... Acontece o mesmo na vida; até os mais doutos têm alguma coisa que aprender, até o fim da sua vida; quando não, deixam de ser doutos."}, {"n": 273, "chapter": "Humildade", "text": "Jesus bom: se tenho de ser apóstolo, é preciso que me faças muito humilde. O sol envolve em luz tudo quanto toca: Senhor, invade-me com a tua claridade, endeusa-me: que eu me identifique com a tua Vontade adorável, para me converter no instrumento que desejas... Dá-me a tua loucura de humilhação: a que te levou a nascer pobre, ao trabalho sem brilho, à infâmia de morrer costurado com ferros a um lenho, ao aniquilamento do Sacrário. - Que eu me conheça: que me conheça e que te conheça. Assim jamais perderei de vista o meu nada."}, {"n": 274, "chapter": "Humildade", "text": "Só os tolos é que são cabeçudos; os muito tolos, muito cabeçudos."}, {"n": 275, "chapter": "Humildade", "text": "Não esqueças que, nos assuntos humanos, também os outros podem ter razão: vêem a mesma questão que tu, mas de um ponto de vista diferente, com outra luz, com outra sombra, com outros contornos. - Somente na fé e na moral é que há um critério indiscutível: o da nossa Mãe Igreja."}, {"n": 276, "chapter": "Humildade", "text": "Como é bom saber retificar!... E como são poucos os que aprendem esta ciência!"}, {"n": 277, "chapter": "Humildade", "text": "Antes que faltar à caridade, cede: não resistas, sempre que seja possível... Tem a humildade da erva, que se curva sem distinguir o pé que a pisa."}, {"n": 278, "chapter": "Humildade", "text": "Sobe-se à conversão pela humildade, pelo caminho de abaixar-se."}, {"n": 279, "chapter": "Humildade", "text": "Dizias-me: “É preciso decapitar o “eu”!...” - Mas, como custa!, não é mesmo?"}, {"n": 280, "chapter": "Humildade", "text": "Muitas vezes precisamos usar de violência sobre nós mesmos, para nos humilharmos e repetirmos deveras ao Senhor: “Serviam!” - eu te servirei."}, {"n": 281, "chapter": "Humildade", "text": "“Memento, homo, quia pulvis es...” - lembra-te, ó homem, de que és pó... - Se és pó, por que te há de incomodar que te pisem?"}, {"n": 282, "chapter": "Humildade", "text": "Pela senda da humildade vai-se a toda a parte..., fundamentalmente ao Céu."}, {"n": 283, "chapter": "Humildade", "text": "Caminho seguro de humildade é meditar como, mesmo carecendo de talento, de renome e de fortuna, podemos ser instrumentos eficazes, se recorrermos ao Espírito Santo para que nos dispense os seus dons. Os Apóstolos, apesar de terem sido instruídos por Jesus durante três anos, fugiram espavoridos diante dos inimigos de Cristo. No entanto, depois de Pentecostes, deixaram-se açoitar e prender, e acabaram dando a vida em testemunho da sua fé."}, {"n": 284, "chapter": "Humildade", "text": "É verdade que ninguém pode estar certo da sua perseverança... Mas essa incerteza é mais um motivo de humildade, e prova evidente da nossa liberdade."}, {"n": 285, "chapter": "Humildade", "text": "Embora valhas tão pouco, Deus serviu-se e continua a servir-se de ti para trabalhos fecundos pela sua glória. - Não te envaideças. Pensa: que diria de si mesmo o instrumento de aço ou de ferro, que o artista utiliza para montar jóias de ouro e de pedras finas?"}, {"n": 286, "chapter": "Humildade", "text": "Que vale mais: um quilo de ouro ou um de cobre?... E, no entanto, em muitos casos o cobre serve mais e melhor do que o ouro."}, {"n": 287, "chapter": "Humildade", "text": "A tua vocação - chamada de Deus - é para dirigir, para arrastar, para servir, para ser líder. Se tu, por falsa ou por mal entendida humildade, te isolas, encerrando-te no teu cantinho, faltas ao teu dever de instrumento divino."}, {"n": 288, "chapter": "Humildade", "text": "Quando o Senhor se serve de ti para derramar a sua graça nas almas, lembra-te de que és apenas o embrulho do presente: um papel que se rasga e se joga fora."}, {"n": 289, "chapter": "Humildade", "text": "“Quia respexit humilitatem ancillae suae” - porque viu a baixeza da sua escrava... - Cada dia me persuado mais de que a humildade autêntica é a base de todas as virtudes! Fala com Nossa Senhora, para que Ela nos vá adestrando em caminhar por essa senda."}, {"n": 290, "chapter": "Cidadania", "text": "O mundo nos espera. Sim! Amamos apaixonadamente este mundo porque Deus assim no-lo ensinou: “Sic Deus dilexit mundum...” - tanto amou Deus o mundo -; e porque é o lugar do nosso campo de batalha - uma formosíssima guerra de caridade -, para que todos alcancemos a paz que Cristo veio instaurar."}, {"n": 291, "chapter": "Cidadania", "text": "O Senhor teve esta fineza de Amor conosco: permitir-nos que Lhe conquistemos a terra. Ele - sempre tão humilde! - quis limitar-se a torná-lo possível... A nós, concedeu-nos a parte mais exeqflível e grata: a da ação e do triunfo."}, {"n": 292, "chapter": "Cidadania", "text": "O mundo... - “Isso é o que nos toca!” - E afirmas isso depois de pores o olhar e a cabeça no céu, com a segurança do lavrador que caminha soberano pela sua própria seara: “Regnare Christum volumus!” - queremos que Ele reine sobre esta terra que é sua!"}, {"n": 293, "chapter": "Cidadania", "text": "“É tempo de esperança, e eu vivo deste tesouro. Não é uma simples frase, Padre - dizes-me -, é uma realidade”. Então..., o mundo inteiro, todos os valores humanos que te atraem com uma força enorme - amizade, arte, ciência, filosofia, teologia, esporte, natureza, cultura, almas... - tudo isso, deposita-o na esperança: na esperança de Cristo."}, {"n": 294, "chapter": "Cidadania", "text": "Esse encanto inconcreto e prazenteiro do mundo..., tão persistente. As flores do caminho - atraem-te as suas cores e os seus aromas... -; as aves do céu; as criaturas todas... - Meu pobre filho, é razoável! Se não fosse assim, se não te fascinassem, que sacrifício havias de oferecer a Nosso Senhor?"}, {"n": 295, "chapter": "Cidadania", "text": "A tua vocação de cristão te pede que estejas em Deus e, ao mesmo tempo, que te ocupes das coisas da terra, empregando-as objetivamente tal como são: para devolvê-las a Ele."}, {"n": 296, "chapter": "Cidadania", "text": "Parece incrível que se possa ser tão feliz neste mundo, em que tantos se empenham em viver tristes porque correm atrás do seu egoísmo, como se tudo acabasse aqui em baixo! - Não sejas tu um destes... Retifica em cada instante!"}, {"n": 297, "chapter": "Cidadania", "text": "O mundo está frio, dá a impressão de estar adormecido. - Muitas vezes tu o contemplas, do teu observatório, com olhar abrasador. Que ele acorde, Senhor! - Orienta as tuas impaciências, na certeza de que, se soubermos queimar bem a nossa vida, atearemos fogo em todos os cantos..., e o panorama mudará."}, {"n": 298, "chapter": "Cidadania", "text": "A fidelidade - o serviço a Deus e às almas -, que te peço sempre, não é o entusiasmo fácil, mas o outro: aquele que se conquista pela rua, ao ver o muito que há que fazer em toda a parte."}, {"n": 299, "chapter": "Cidadania", "text": "O bom filho de Deus tem que ser muito humano. Mas não tanto que degenere em ordinário e mal educado."}, {"n": 300, "chapter": "Cidadania", "text": "É difícil gritar ao ouvido de cada um com um trabalho silencioso, através do bom cumprimento das nossas obrigações de cidadãos, para depois exigir os nossos direitos e pô-los ao serviço da Igreja e da sociedade. É difícil..., mas é muito eficaz."}, {"n": 301, "chapter": "Cidadania", "text": "Não é verdade que haja oposição entre ser bom católico e servir fielmente a sociedade civil. Assim como não há razão para que a Igreja e o Estado entrem em choque, no exercício legítimo da sua autoridade respectiva, voltados para a missão que Deus lhes confiou. Mentem - isso mesmo: mentem! os que afirmam o contrário. São os mesmos que, em aras de uma falsa liberdade, quereriam “amavelmente” que nós, os católicos, voltássemos às catacumbas."}, {"n": 302, "chapter": "Cidadania", "text": "Esta é a tua tarefa de cidadão: contribuir para que o amor e a liberdade de Cristo presidam a todas as manifestações da vida moderna - a cultura e a economia, o trabalho e o descanso, a vida de família e o convívio social."}, {"n": 303, "chapter": "Cidadania", "text": "Um filho de Deus não pode ser classista, porque lhe interessam os problemas de todos os homens... E procura ajudar a resolvê-los com a justiça e a caridade do nosso Redentor. Já o apontava o Apóstolo, quando nos escrevia que, para o Senhor, não há discriminação de pessoa, o que não duvidei em traduzir deste modo: não há senão uma raça dos filhos de Deus!"}, {"n": 304, "chapter": "Cidadania", "text": "Os homens mundanos empenham-se em que as almas percam quanto antes a Deus; e depois, em que percam o mundo... Não amam este nosso mundo: exploram-no, espezinhando os outros! - Que tu não sejas também vítima dessa dupla vigarice!"}, {"n": 305, "chapter": "Cidadania", "text": "Há quem viva amargurado o dia inteiro. Tudo lhe causa desassossego. Dorme com uma obsessão física: que essa única evasão possível lhe vai durar pouco. Acorda coma impressão hostil e desanimadora de que já tem outra jornada pela frente. Muitos se esqueceram de que o Senhor nos colocou, neste mundo, de passagem para a felicidade eterna; e não pensam que só a poderão alcançar os que caminharem, pela terra, com a alegria dos filhos de Deus."}, {"n": 306, "chapter": "Cidadania", "text": "Com a tua conduta de cidadão cristão, mostra às pessoas a diferença que há entre viver triste e viver alegre; entre sentir-se tímido e sentir-se audaz; entre agir com cautela, com duplicidade - com hipocrisia! -, e agir como homem simples e de uma só peça. - Numa palavra, entre ser mundano e ser filho de Deus."}, {"n": 307, "chapter": "Cidadania", "text": "Eis um erro fundamental de que deves guardar-te: pensar que os costumes e exigências - nobres e legítimos - do teu tempo ou do teu ambiente, não podem ser ordenados e ajustados à santidade da doutrina moral de Jesus Cristo. Observa que precisei: os nobres e legítimos. Os demais não têm direito de cidadania."}, {"n": 308, "chapter": "Cidadania", "text": "Não se pode separar a religião da vida, nem no pensamento nem na realidade cotidiana."}, {"n": 309, "chapter": "Cidadania", "text": "De longe - lá no horizonte -, parece que o céu se junta com a terra. Não esqueças que, onde de verdade a terra e o céu se juntam, é no teu coração de filho de Deus."}, {"n": 310, "chapter": "Cidadania", "text": "Não podemos cruzar os braços, quando uma sutil perseguição condena a Igreja a morrer de inanição, relegando-a para fora da vida pública e, sobretudo, impedindo-a de intervir na educação, na cultura, na vida familiar. Não são direitos nossos: são de Deus, e foi Ele que os confiou a nós, os católicos..., para que os exerçamos!"}, {"n": 311, "chapter": "Cidadania", "text": "Muitas realidades materiais, técnicas, econômicas, sociais, políticas, culturais..., abandonadas a si mesmas, ou em mãos dos que não possuem a luz da nossa fé, convertem-se em obstáculos formidáveis para a vida sobrenatural: formam como que um campo fechado e hostil à Igreja. Tu, por seres cristão - pesquisador, literato, cientista, político, trabalhador... - tens o dever de santificar essas realidades. Lembra-te de que o universo inteiro - assim escreve o Apóstolo - está gemendo como que com dores de parto, à espera da libertação dos filhos de Deus."}, {"n": 312, "chapter": "Cidadania", "text": "Não queiras fazer do mundo um convento, poque seria uma desordem... Mas também não queiras fazer da Igreja um bando terreno, porque equivaleria a uma traição."}, {"n": 313, "chapter": "Cidadania", "text": "Que coisa triste é ter uma mentalidade cesarista, e não compreender a liberdade dos demais cidadãos, nas coisas que Deus deixou ao juízo dos homens."}, {"n": 314, "chapter": "Cidadania", "text": "“Quem disse que, para chegar à santidade, é necessário refugiar-se numa cela ou na solidão de uma montanha?”, interrogava-se, admirado, um bom pai de família, que acrescentava: “Nesse caso, seriam santas, não as pessoas, mas a cela ou a montanha. parece que se esqueceram de que o Senhor nos disse expressamente a todos e a cada um: Sede santos, como meu Pai celestial é Santo”. - Limitei-me a comentar-lhe: “Além de querer que sejamos santos, o Senhor concede a cada um as graças oportunas”."}, {"n": 315, "chapter": "Cidadania", "text": "Ama a tua pátria: o patriotismo é uma virtude cristã. Mas se o patriotismo se converte num nacionalismo que leva a encarar com frieza, com desprezo - sem caridade cristã nem justiça -, outros povos, outras nações, é um pecado."}, {"n": 316, "chapter": "Cidadania", "text": "Não é patriotismo justificar delitos... e desconhecer os direitos dos demais povos."}, {"n": 317, "chapter": "Cidadania", "text": "Escreveu também o Apóstolo que “não há distinção entre gentio e judeu, circunciso e incircunciso, bárbaro e cita, escravo e livre, mas Cristo é tudo e está em todos”. Estas palavras são válidas hoje como ontem: perante o Senhor, não existem diferenças de nação, de e raça, de classe, de estado de vida... Cada um de nós renasceu em Cristo, para ser uma nova criatura, um filho de Deus: todos somos irmãos, e temos de comportar-nos fraternalmente!"}, {"n": 318, "chapter": "Cidadania", "text": "Há já muitos anos, vi com clareza meridiana um critério que será sempre válido: o ambiente da sociedade, com o seu afastamento da fé e da moral cristãs, precisa de uma nova forma de viver e de propagar a verdade eterna do Evangelho: nas próprias entranhas da sociedade, do mundo, os filhos de Deus ao de brilhar por suas virtudes como lanternas na escuridão - “quasi lucernae lucentes in caliginoso loco”."}, {"n": 319, "chapter": "Cidadania", "text": "A perene vitalidade da Igreja Católica garante que a verdade e o espírito de Cristo não se afastam das diversas necessidades dos tempos."}, {"n": 320, "chapter": "Cidadania", "text": "Para seguir as pegadas de Cristo, o apóstolo de hoje não vem reformar nada, e muito menos desentender-se da realidade histórica que o rodeia... - Basta-lhe atuar como os primeiros cristãos, vivificando o ambiente."}, {"n": 321, "chapter": "Cidadania", "text": "Tu, que vives no meio do mundo, que és um cidadão como os outros, em contacto com homens que dizem ser bons ou ser maus...; tu, tens que sentir o desejo constante de dar aos outros a alegria de que gozas, por seres cristão."}, {"n": 322, "chapter": "Cidadania", "text": "Promulgou-se um edito de César Augusto, que manda recensear todos os habitantes de Israel. Maria e José caminham para Belém... - Não pensaste que o Senhor se serviu do acatamento pontual de uma lei para que se cumprisse a sua profecia? Ama e respeita as normas de uma convivência honrada e não duvides de que a tua submissão leal ao dever será também veículo para que outros descubram a honradez cristã do amor divino, e encontrem a Deus."}, {"n": 323, "chapter": "Sinceridade", "text": "Quem oculta ao seu Diretor uma tentação, tem um segredo a meias com o demônio. - Fez-se amigo do inimigo."}, {"n": 324, "chapter": "Sinceridade", "text": "O pó e a cegueira de certa queda causam-te desassossego, juntamente com pensamentos que querem tirar-te a paz. - Procuraste desabafar em lágrimas junto do Senhor, e na conversa confiada com um irmão?"}, {"n": 325, "chapter": "Sinceridade", "text": "Sinceridade: com Deus, com o Diretor, com os teus irmãos os homens. - Assim estou certo da tua perseverança."}, {"n": 326, "chapter": "Sinceridade", "text": "Um meio para sermos francos e simples?... Escuta e medita estas palavras de Pedro: “Domine, tu omnia nosti...” - Senhor, Tu sabes tudo!"}, {"n": 327, "chapter": "Sinceridade", "text": "Que vou dizer?, perguntas ao começares a abrir a tua alma. E, com segura consciência, respondo-te: em primeiro lugar, aquilo que quererias que não se soubesse."}, {"n": 328, "chapter": "Sinceridade", "text": "Os defeitos que vês nos outros talvez sejam os teus próprios. “Si oculus tuus fuerit simplex...” - Se o teu olho for simples, todo o teu corpo estará iluminado; mas se for malicioso, todo o teu corpo estará obscurecido. E mais ainda: “Como te pões a olhar o cisco no olho do teu irmão, e não reparas na trave que está dentro do teu?” - Examina-te."}, {"n": 329, "chapter": "Sinceridade", "text": "Todos precisamos prevenir a falta de objetividade, sempre que se trate de julgar a nossa própria conduta... - Tu também."}, {"n": 330, "chapter": "Sinceridade", "text": "De acordo, dizes a verdade “quase” por inteiro... Portanto, não és veraz."}, {"n": 331, "chapter": "Sinceridade", "text": "Dói-te... Mas insisto com intransigência santa: dói-te... porque desta vez pus o dedo na tua chaga."}, {"n": 332, "chapter": "Sinceridade", "text": "Compreendeste em que consiste a sinceridade quando me escrevias: “Estou procurando habituar-me a chamar as coisas pelo seu nome e, sobretudo, a não tentar atribuir nomes ao que não existe”."}, {"n": 333, "chapter": "Sinceridade", "text": "Pensa bem nisto: ser transparente consiste mais em não tapar do que em querer fazer ver... Trata-se de permitir que se distingam os objetos que há no fundo do copo, e não em esforçar-se por tornar visível o ar."}, {"n": 334, "chapter": "Sinceridade", "text": "Atuemos sempre de tal maneira, na presença de Deus, que não tenhamos que ocultar nada aos homens."}, {"n": 335, "chapter": "Sinceridade", "text": "Acabaram-se as aflições... Descobriste que a sinceridade com o Diretor conserta com uma facilidade admirável aquilo que se entortou."}, {"n": 336, "chapter": "Sinceridade", "text": "Como erram pais, mestres, diretores... que exigem sinceridade absoluta e, quando lhes mostram toda a verdade, se assustam!"}, {"n": 337, "chapter": "Sinceridade", "text": "Lias naquele dicionário os sinônimos de insincero: “ambíguo, ladino, dissimulado, matreiro, astuto”... - Fechaste o livro, enquanto pedias ao Senhor que nunca pudessem aplicar-se a ti esses qualificativos, e te propuseste aprimorar ainda mais esta virtude sobrenatural e humana da sinceridade."}, {"n": 338, "chapter": "Sinceridade", "text": "“Abyssus abyssum invocat...” - um abismo chama outro abismo, como já te recordei. É a descrição exata do modo de comportar-se dos mentirosos, dos hipócritas, dos renegados, dos traidores: como estão desgostosos com o seu próprio modo de conduzir-se, ocultam aos outros as suas trapaças, para irem de mal a pior, criando um despenhadeiro entre eles e o próximo."}, {"n": 339, "chapter": "Sinceridade", "text": "“Tota pulchra es, Maria, et macula originalis non est in te!” - És toda formosa, Maria, e não há em ti mancha original!, canta alvoroçada a liturgia: não há nEla a menor sombra de duplicidade. Peço diariamente à nossa Mãe que saibamos abrir a alma na direção espiritual, para que a luz da graça ilumine toda a nossa conduta! - Se assim lhe suplicarmos, Maria nos obterá a valentia da sinceridade, para que nos cheguemos mais à Trindade Santíssima."}, {"n": 340, "chapter": "Lealdade", "text": "A lealdade tem como conseqflências a segurança de andar por um caminho reto, sem instabilidades nem perturbações; e a de firmar-se nesta certeza: que existem o bom senso e a felicidade. - Vê se isso se cumpre na tua vida de cada instante."}, {"n": 341, "chapter": "Lealdade", "text": "Confiavas-me que Deus, em certos momentos, te enche de luz; em outros não. Recordei-te, com firmeza, que o Senhor é sempre infinitamente bom. Por isso, para continuares em frente, bastam-te esses tempos luminosos; se bem que os outros também te são proveitosos, para te fazeres mais fiel."}, {"n": 342, "chapter": "Lealdade", "text": "Sal da terra - Nosso Senhor disse que os seus discípulos - tu e eu também - são sal da terra: para imunizar, para evitar a corrupção, para temperar o mundo. - Mas também acrescentou “quod si sal evanuerit...” - que se o sal perde o seu sabor, será lançado fora e pisado pelos homens... - Agora, perante muitos acontecimentos que lamentamos, vais compreendendo o que antes não compreendias?"}, {"n": 343, "chapter": "Lealdade", "text": "Faz-me tremer aquela passagem da segunda epístola a Timóteo, quando o Apóstolo se dói de que Demas tenha fugido para Tessalônica, atrás dos encantos deste mundo... Por uma bagatela, e por medo das perseguições, atraiçoou a tarefa divina um homem que São Paulo cita, em outras epístolas, entre os santos. Faz-me tremer, conhecendo a minha pequenez; e leva-me a exigir de mim fidelidade ao Senhor até nos fatos que podem parecer indiferentes, porque, se não me servem para unir-me mais a Ele, não os quero!"}, {"n": 344, "chapter": "Lealdade", "text": "Para tantos momentos da história, que o diabo se encarrega de repetir, parece-me uma consideração muito acertada aquela que me escrevias sobre lealdade: “Trago o dia todo, no coração, na cabeça, nos lábios, uma jaculatória: Roma!”"}, {"n": 345, "chapter": "Lealdade", "text": "Uma grande descoberta! Uma coisa que só entendias muito pela metade, tornou-se claríssima para ti quando tiveste que explicá-la a outros. Tiveste que falar muito devagar com um que estava desanimado porque se sentia ineficaz e não queria ser um peso para ninguém... Então compreendeste melhor que nunca por que te falo constantemente de sermos burrinhos de nora: fiéis, com viseiras muito grandes para não olharmos nem saborearmos pessoalmente os resultados - as flores, os frutos, a louçania da horta -, bem certos da eficácia da nossa fidelidade."}, {"n": 346, "chapter": "Lealdade", "text": "A lealdade exige fome de formação, porque - movido por um amor sincero - não desejas correr o risco de difundir ou defender, por ignorância, critérios que estão muito longe de corresponderem à verdade."}, {"n": 347, "chapter": "Lealdade", "text": "“Quereria - escreves-me - que a minha lealdade e a minha perseverança fossem tão sólidas e tão eternas, e o meu serviço tão vigilante e amoroso, que o Senhor pudesse alegrar-se comigo e eu fosse para si um pequeno descanso”. - E respondo-te: Deus te confirme no teu propósito para que sejamos ajuda e descanso para Ele."}, {"n": 348, "chapter": "Lealdade", "text": "É verdade que alguns que se entusiasmam, depois vão-se embora... Não te preocupes: são agulha de que Deus se serve para enfiar a linha. - Ah, e reza por eles!, porque talvez se possa conseguir que continuem empurrando outros."}, {"n": 349, "chapter": "Lealdade", "text": "Para ti, que vacilas, copio de uma carta: “De agora em diante, talvez continue a ser o mesmo instrumento inepto de sempre. Apesar disso, terá mudado o enfoque e a solução do problema da minha vida; porque há em mim um desejo, firme, de perseverança... até sempre!” - Nunca duvides de que Ele jamais falha."}, {"n": 350, "chapter": "Lealdade", "text": "A tua vida é serviço, mas sempre com uma lealdade sem brechas, sem condições: somente assim daremos o rendimento que o Senhor espera."}, {"n": 351, "chapter": "Lealdade", "text": "Nunca partilharei, nem no terreno ascético nem no jurídico, da idéia dos que pensam e vivem como se servir a Igreja equivalesse a empoleirar-se."}, {"n": 352, "chapter": "Lealdade", "text": "Dói-te ver que alguns têm a técnica de falar da Cruz de Cristo, unicamente para subir e conquistar posições... São os mesmos que não consideram limpo nada do que vêem, se não coincide com o seu critério. - Mais uma razão para que perseveres na retidão de tuas intenções, e para que peças ao Mestre que te conceda a força de repetir: “Non mea voluntas, sed tua fiat” - Senhor, que eu cumpra com amor a tua Vontade Santa!"}, {"n": 353, "chapter": "Lealdade", "text": "Tens de crescer de dia para dia em lealdade à Igreja, ao Papa, à Santa Sé... Com um amor cada vez mais teológico!"}, {"n": 354, "chapter": "Lealdade", "text": "Tens uma grande ânsia de amar a Igreja: tanto maior, quanto mais se agitam os que pretendem desfeá-la. Parece-me muito lógico: porque a Igreja é tua Mãe."}, {"n": 355, "chapter": "Lealdade", "text": "Os que não querem entender que a fé exige serviço à Igreja e às almas, cedo ou tarde invertem os termos, e acabam por servir-se da Igreja e das almas, para os seus fins pessoais."}, {"n": 356, "chapter": "Lealdade", "text": "Oxalá não caias nunca, no erro de identificar o Corpo Místico de Cristo com uma atitude determinada, pessoal ou pública, de qualquer dos seus membros. E oxalá não dês pé a que pessoas menos formadas caiam nesse erro. - Vê se não é importante a tua coerência, a tua lealdade!"}, {"n": 357, "chapter": "Lealdade", "text": "Não te compreendo quando, ao falares de questões de moral e de fé, me dizes que és um católico independente... - Independente de quem? Essa falsa independência equivale a sair do caminho de Cristo."}, {"n": 358, "chapter": "Lealdade", "text": "Não cedas nunca na doutrina da Igreja - Quando se faz uma liga, o melhor metal é o que sai perdendo. Além disso, esse tesouro não é teu, e - como narra o Evangelho - o Dono pode pedir-te contas quando menos o esperas."}, {"n": 359, "chapter": "Lealdade", "text": "Concordo contigo em que há católicos, praticantes e mesmo piedosos aos olhos dos outros, e talvez sinceramente convictos, que servem ingenuamente os inimigos da Igreja... - Infiltrou-se em sua própria casa, com nomes diferentes mal aplicados - ecumenismos, pluralismos, democracia -, o pior adversário: a ignorância."}, {"n": 360, "chapter": "Lealdade", "text": "Ainda que pareça um paradoxo, não raro sucede que, aqueles que se chamam a si próprios filhos da Igreja, são precisamente os que maior confusão semeiam."}, {"n": 361, "chapter": "Lealdade", "text": "Estás cansado de lutar. Deu-te nojo esse ambiente, caracterizado pela falta de lealdade... Todos se lançam sobre aquele que caiu, para espezinhá-lo! Não sei por que te admiras. Aconteceu o mesmo com Jesus Cristo, mas Ele não recuou, porque tinha vindo salvar justamente os doentes e os que não O compreendiam."}, {"n": 362, "chapter": "Lealdade", "text": "Que os leais não atuem! - É o que querem os desleais."}, {"n": 363, "chapter": "Lealdade", "text": "Foge dos sectarismos, que se opõem a uma colaboração leal."}, {"n": 364, "chapter": "Lealdade", "text": "Não se pode promover a verdadeira unidade à base de abrir novas divisões... Muito menos quando os promotores aspiram a apoderar-se do comando, suplantando a autoridade legítima."}, {"n": 365, "chapter": "Lealdade", "text": "Ficaste muito pensativo quando me ouviste comentar: Quero ter o sangue de minha Mãe a Igreja; não o de Alexandre, nem o de Carlos Magno, nem o dos sete sábios da Grécia."}, {"n": 366, "chapter": "Lealdade", "text": "Perseverar é persistir no amor “per Ipsum et cum Ipso et in Ipso...”, o que realmente podemos interpretar também assim: Ele!, comigo, por mim e em"}, {"n": 367, "chapter": "Lealdade", "text": "Pode acontecer que haja, entre os católicos, alguns com pouco espírito cristão; ou que dêem essa impressão aos que se relacionam com eles num momento determinado. Mas, se esta realidade te escandalizasse, darias mostras de conhecer pouco a miséria humana e... a tua própria miséria. Além disso, não é justo nem leal servir-se das fraquezas desses poucos, para difamar Cristo e a sua Igreja."}, {"n": 368, "chapter": "Lealdade", "text": "É verdade que nós, os filhos de Deus, não devemos servir ao Senhor para que nos vejam..., mas não nos há de importar que nos vejam, e muito menos podemos deixar de cumprir porque estão vendo!"}, {"n": 369, "chapter": "Lealdade", "text": "Passaram-se vinte séculos, e a cena se repete todos os dias: continuam levando a julgamento, flagelando e crucificando o Mestre... E muitos católicos, com o seu comportamento e com as suas palavras, continuam gritando: Esse? Não o conheço! Desejaria ir por toda a parte, recordando confidencialmente a muitos que Deus é misericordioso, e que também é muito justo! Por isso afirmou claramente: “Também Eu não reconhecerei os que não me tiveram reconhecido diante dos homens”."}, {"n": 370, "chapter": "Lealdade", "text": "Sempre pensei que a falta de lealdade por respeitos humanos é desamor..., e ausência de personalidade."}, {"n": 371, "chapter": "Lealdade", "text": "Volta os teus olhos para a Virgem Maria e contempla como vive a virtude da lealdade. Quando Israel precisa dela, diz o Evangelho que vai “cum festinatione” com pressa alegre. Aprende!"}, {"n": 372, "chapter": "Disciplina", "text": "Obedecer docilmente. - Mas com inteligência, com amor e com sentido de responsabilidade, que nada têm a ver com julgar os que governam."}, {"n": 373, "chapter": "Disciplina", "text": "No apostolado, obedece sem reparar nas condições humanas de quem manda, nem no modo como manda. O contrário não é virtude. Cruzes há muitas: de brilhantes, de pérolas, de esmeraldas, de esmaltes, de marfim...; também de madeira, como a de Nosso Senhor, porque a Cruz nos fala do sacrifício do Deus feito Homem. - Leva esta consideração à tua obediência, sem te esqueceres de Ele se abraçou amorosamente - sem hesitar! - ao Madeiro, e ali nos obteve a Redenção. Só depois de teres obedecido, o que é sinal de retidão de intenção, faz a correção fraterna, com as condições requeridas, e reforçarás a unidade por meio do cumprimento desse dever."}, {"n": 374, "chapter": "Disciplina", "text": "Obedece-se com os lábios, com o coração e com a mente. - Obedece-se não a um homem, mas a Deus."}, {"n": 375, "chapter": "Disciplina", "text": "Não amas a obediência se não amas de verdade o mandado, se não amas de verdade o que te mandaram."}, {"n": 376, "chapter": "Disciplina", "text": "Muitos problemas se remedeiam logo. Outros, não imediatamente. Mas todos se resolverão, se formos fiéis: se obedecermos, se cumprirmos o que está estabelecido."}, {"n": 377, "chapter": "Disciplina", "text": "O Senhor quer de ti um apostolado concreto, como o da pesca daqueles cento e cinqflenta e três grandes peixes - e não outros -, apanhados à direita da barca. E perguntas-me: como é que, sabendo-me pescador de homens, vivendo em contacto com muitos companheiros e podendo distinguir a quem deve dirigir-se o meu apostolado específico, não pesco?... Falta-me Amor? Falta-me vida interior? Escuta a resposta dos lábios de Pedro, naquela outra pesca milagrosa: - “Mestre, estivemos fatigando-nos durante toda a noite, e nada apanhamos; não obstante, fiado na tua palavra, lançarei a rede”. Em nome de Cristo, começa de novo. - Fortalecido: fora essa moleza!"}, {"n": 378, "chapter": "Disciplina", "text": "Obedece sem tantas vacilações inúteis... Mostrar tristeza ou pouca vontade perante o que se manda é falta muito considerável. Mas senti-la apenas, não somente não é culpa, mas pode ser uma grande ocasião de nos vencermos a nós mesmos, de coroarmos um ato heróico de virtude. Não sou eu que o invento. Lembras-te? Narra o Evangelho que um pai de família confiou o mesmo encargo aos seus dois filhos... E Jesus alegra-se com aquele que, apesar de ter levantado dificuldades, cumpre! Alegra-se porque a disciplina é fruto do Amor."}, {"n": 379, "chapter": "Disciplina", "text": "A maior parte das desobediências provém de não saber “escutar” a indicação, o que no fundo é falta de humildade ou de interesse em servir."}, {"n": 380, "chapter": "Disciplina", "text": "Queres obedecer cabalmente?... Pois bem, escuta com atenção, para compreenderes o alcance e o espírito do que te indicam; e, se não entendes alguma coisa, pergunta."}, {"n": 381, "chapter": "Disciplina", "text": "Vamos ver quando te convences de que tens de obedecer!... E desobedeces se, em vez de cumprir o plano de vida, perdes o tempo. Todos os teus minutos devem estar preenchidos: trabalho, estudo, proselitismo, vida interior."}, {"n": 382, "chapter": "Disciplina", "text": "De modo semelhante ao da Igreja que, através do cuidado com a liturgia, nos faz intuir a beleza dos mistérios da Religião, e nos leva a amá-los melhor, assim devemos viver - sem fazer teatro - certa correção, aparentemente mundana, de respeito profundo - mesmo externo - pelo Diretor, que por sua boca nos comunica a Vontade de Deus."}, {"n": 383, "chapter": "Disciplina", "text": "Ao governador, depois de pensar no bem comum, é necessário levar em conta que - no terreno espiritual e no civil - dificilmente uma norma pode não desagradar a alguns. - Nunca chove ao gosto de todos!, reza a sabedoria popular. Mas isso, não duvides, não é de feito da lei, mas rebeldia injustificada da soberba ou do egoísmo daqueles poucos."}, {"n": 384, "chapter": "Disciplina", "text": "Ordem, autoridade, disciplina... - Escutam - se é que escutam! -, e sorriem cinicamente, alegando - elas e eles - que defendem a sua liberdade. São os mesmo que depois pretendem que respeitemos ou que nos ajustemos aos seus descaminhos; não compreendem - que protestos tão vulgares! - que os seus modos não sejam - não podem ser! - aceitos pela autêntica liberdade dos outros."}, {"n": 385, "chapter": "Disciplina", "text": "Os que dirigem tarefas espirituais têm que interessar-se por tudo que é humano, para elevá-lo à ordem sobrenatural e divinizá-lo. Se não se pode divinizar, não te enganes; não é humano, é “animalesco”, impróprio da criatura racional."}, {"n": 386, "chapter": "Disciplina", "text": "Autoridade. Não consiste em que o de cima “grite” ao inferior, e este ao de mais abaixo. Com esse critério - caricatura da autoridade -, além da evidente falta de caridade e de correção humana, só se consegue que quem está no comando se vá afastando dos governados, porque não os serve: no melhor dos casos, usa-os!"}, {"n": 387, "chapter": "Disciplina", "text": "Não sejas tu desses que, trazendo desgovernada a sua própria casa, tentam intrometer-se no governo das casas dos outros."}, {"n": 388, "chapter": "Disciplina", "text": "Mas... pensas de verdade que sabes tudo, porque foste constituído em autoridade? - Escuta-me bem: o bom governante “sabe” que pode - que deve! - aprender dos outros."}, {"n": 389, "chapter": "Disciplina", "text": "Liberdade de consciência: não! Quantos males trouxe aos povos e às pessoas este erro lamentável, que permite agir contra os ditames íntimos da própria consciência! Liberdade “das consciências”, sim: que significa o dever de seguir esse imperativo interior... Ah, mas depois de se ter recebido uma séria formação!"}, {"n": 390, "chapter": "Disciplina", "text": "Governar não é mortificar."}, {"n": 391, "chapter": "Disciplina", "text": "Para ti, que ocupas essa função de governo. Medita: os instrumentos mais fortes e eficazes, se o tratarmos mal, ficam amassados, desgastam-se e se inutilizam."}, {"n": 392, "chapter": "Disciplina", "text": "As decisões de governo, tomadas de ânimo leve por uma só pessoa, nascem sempre, ou quase sempre influenciadas por uma visão unilateral dos problemas. - Por muito grandes que sejam a tua preparação e o seu talento, deves ouvir aqueles que compartilham contigo essa tarefa de direção."}, {"n": 393, "chapter": "Disciplina", "text": "Nunca dês ouvidos à delação anônima: é o procedimento da gente vil."}, {"n": 394, "chapter": "Disciplina", "text": "Um critério de bom governo: é preciso tomar o material humano tal como é, e ajudá-lo a melhorar, sem nunca desprezá-lo."}, {"n": 395, "chapter": "Disciplina", "text": "Acho muito bem que procures diariamente aumentar essa profunda preocupação pelos que dependem de ti: porque sentir-se rodeado e protegido pela compreensão afetuosa do superior, pode ser o remédio eficaz de que necessitem as pessoas a quem tens de servir com o teu governo."}, {"n": 396, "chapter": "Disciplina", "text": "Que pena causam alguns, investidos em autoridade, quando julgam e falam com ligeireza, sem estudar o assunto, com afirmações categóricas, sobre pessoas ou questões que desconhecem, e... até com “preconceitos”, que são frutos da deslealdade!"}, {"n": 397, "chapter": "Disciplina", "text": "Se a autoridade se converte em autoritarismo ditatorial e esta situação se prolonga no tempo, perde-se a continuidade histórica, morrem ou envelhecem os homens de governo, chegam à idade madura pessoas sem experiência de direção, e a juventude - inexperiente e excitada - quer tomar as rédeas: quantos males e quantas ofensas a Deus - próprias e alheiras - recaem sobre os que usam tão mal da autoridade!"}, {"n": 398, "chapter": "Disciplina", "text": "Quando quem manda é negativo e desconfiado, facilmente cai na tirania."}, {"n": 399, "chapter": "Disciplina", "text": "Procura ser retamente objetivo no teu trabalho de governo. Evita essa inclinação dos que tendem a ver sobretudo - e às vezes somente - o que não anda, os erros. - Enche-te de alegria, na certeza de que o Senhor concedeu a todos a capacidade de se fazerem santos, precisamente na luta contra os seus próprios defeitos."}, {"n": 400, "chapter": "Disciplina", "text": "A ânsia de novidade pode levar ao desgoverno. - São precisos novos regulamentos, dizes... - Achas mesmo que o corpo humano melhoraria com outro sistema nervoso ou arterial?"}, {"n": 401, "chapter": "Disciplina", "text": "Que empenho o de alguns em massificar! Convertem a unidade em uniformidade amorfa, afogando a liberdade. Parece que ignoram a impressionante unidade do corpo humano, com tão divina diferenciação de membros que - cada um com a sua função própria - contribuem para a saúde geral. - Deus não quis que todos fôssemos iguais, nem que caminhássemos todos do mesmo modo pelo único caminho."}, {"n": 402, "chapter": "Disciplina", "text": "É preciso ensinar as pessoas a trabalhar - sem exagerar a preparação: “fazer” é também formar-se - e a aceitar de antemão as imperfeições inevitáveis: o ótimo é inimigo do bom."}, {"n": 403, "chapter": "Disciplina", "text": "Nunca confies só na organização."}, {"n": 404, "chapter": "Disciplina", "text": "O bom pastor não precisa atemorizar as suas ovelhas: semelhante comportamento é próprio dos maus governantes. Por isso, ninguém estranha que acabem odiados e sós."}, {"n": 405, "chapter": "Disciplina", "text": "Governar, muitas vezes, consiste em saber “ir puxando” pelas pessoas, com paciência e carinho."}, {"n": 406, "chapter": "Disciplina", "text": "O bom governo não ignora a necessária flexibilidade, sem cair na falta de exigência."}, {"n": 407, "chapter": "Disciplina", "text": "“Enquanto não me fizerem pecar!” - Enérgico comentário daquela pobre criatura, quase aniquilada, na sua vida pessoa e em seus afãs de homem e de cristão, por inimigos poderosos. - Medita e aprende: enquanto não te fizerem pecar!"}, {"n": 408, "chapter": "Disciplina", "text": "Nem todos os cidadãos pertencem aos quadro do exército. Mas, quando chega a guerra, todos participam... E o Senhor disse: “Não vim trazer a paz, mas a guerra”."}, {"n": 409, "chapter": "Disciplina", "text": "“Eu era um guerrilheiro” - escreve - “e andava pelos montes, disparando quando me dava na telha. Mas quis alistar-me como soldado, porque compreendi que as guerras são ganhas mais facilmente pelos exércitos organizados e com disciplina. Um pobre guerrilheiro isolado não pode tomar cidades inteiras, nem ocupar o mundo. Pendurei o meu bacamarte - fica antiquado! - e agora estou mais bem armado. Ao mesmo tempo, sei que já não posso deitar-me no monte, à sombra de uma árvore, e sonhar que eu sozinho ganharei a guerra”. - Bendita disciplina e bendita unidade da nossa Mãe a Igreja Santa!"}, {"n": 410, "chapter": "Disciplina", "text": "A tantos católicos rebeldes, dir-lhes-ia que faltam ao seu dever aqueles que, em vez de se aterem à disciplina, e à obediência à autoridade legítima, se convertem em partido; em pequeno bando; em vermes de discórdia; em conjura e intriguice; em fomentadores de estúpidas pugnas pessoais; em tecelões de urdiduras de ciúmes e crises."}, {"n": 411, "chapter": "Disciplina", "text": "Não são a mesma coisa um vento suave e um furacão. Ao primeiro, qualquer um resiste: é brincadeira de crianças, paródia de luta. - Pequenas contradições, escassez, apuros de nada... Aceitavas tudo isso com gosto, e vivias a alegria interior de pensar: agora, sim, estou trabalhando por Deus, porque temos Cruz!... Mas, meu pobre filho: chegou o furacão, e sentes um balançar, um fustigar que arrancaria árvores centenárias. Isso..., por dentro e por fora. Confia! Não poderá arrancar a tua Fé e o teu Amor, nem tirar-te do teu caminho..., se tu não te afastas da “cabeça”, se sentes a unidade."}, {"n": 412, "chapter": "Disciplina", "text": "Com que facilidade deixas de cumprir o plano de vida, ou fazes as coisas pior do que se as omitisses!... - É assim que queres enamorar-te cada vez mais do teu caminho, para contagiar depois os outros com esse amor?"}, {"n": 413, "chapter": "Disciplina", "text": "Não ambiciones senão um único direito: o de cumprires o teu dever."}, {"n": 414, "chapter": "Disciplina", "text": "Dizes que a carga é pesada? - Não, mil vezes não! Essas obrigações, que aceitaste livremente, são asas que te levantam sobre o lodo vil das paixões. Porventura os pássaros sentem o peso das suas asas? Corta-as, coloca-as no prato de uma balança: pesam! Pode, no entanto, a ave voar se lhas arrancam? Precisa dessas asas assim; e não nota o seu peso porque a elevam acima do nível das outras criaturas. Também as tuas “asas” pesam! Mas, se te faltassem, cairias nos mais sujos lodaçais."}, {"n": 415, "chapter": "Disciplina", "text": "“Maria guardava todas estas coisas no seu coração...” Quando está de permeio o amor limpo e sincero, a disciplina não representa um peso, ainda que custe, porque une ao Amado."}, {"n": 416, "chapter": "Personalidade", "text": "O Senhor necessita de almas fortes e audazes, que não pactuem com a mediocridade e penetrem com passo firme em todos os ambientes."}, {"n": 417, "chapter": "Personalidade", "text": "Sereno e equilibrado de caráter, vontade inflexível, fé profunda e piedade ardente: características imprescindíveis de um filho de Deus."}, {"n": 418, "chapter": "Personalidade", "text": "O Senhor pode tirar das próprias pedras filhos de Abraão... Mas temos de procurar que a pedra não seja quebradiça. De um rochedo sólido, ainda que seja informe. pode lavrar-se mais facilmente um silhar esplêndido."}, {"n": 419, "chapter": "Personalidade", "text": "O apóstolo não deve nivelar-se pela rasoura de uma criatura medíocre. Deus o chama para que atue como portador de humanidade e transmissor de uma novidade eterna. - Por isso, o apóstolo precisa ser uma alma longamente, pacientemente, heroicamente formada."}, {"n": 420, "chapter": "Personalidade", "text": "Cada dia descubro coisas novas em mim, dizes... E respondo-te: agora começas a conhecer-te. Quando se ama deveras..., sempre se encontram detalhes para amar ainda mais."}, {"n": 421, "chapter": "Personalidade", "text": "Seria lamentável que alguém concluísse, ao ver atuar os católicos na vida social, que se mexem com acanhamento e capitis-diminuídos. Não se pode esquecer que o nosso Mestre era - é! - “perfectus Homo” - perfeito Homem."}, {"n": 422, "chapter": "Personalidade", "text": "Se o Senhor te deu uma boa qualidade - ou uma habilidade -, não é apenas para que nela te deleites, ou para que te pavoneies, mas para que a desenvolvas com caridade a serviço do próximo. - E quando encontrarás melhor ocasião de servir do que agora, ao conviveres com tantas almas que compartilham o teu mesmo ideal?"}, {"n": 423, "chapter": "Personalidade", "text": "Ante a pressão e o impacto de um mundo materializado, hedonista, sem fé..., como é possível exigir e justificar a liberdade de não pensar como “eles”, de não agir como “eles?... - Um filho de Deus não tem necessidade de pedir essa liberdade, porque Cristo já no-la ganhou de uma vez para sempre; mas deve defendê-la e demonstrá-la em qualquer ambiente. Só assim é que “eles” entenderão que a nossa liberdade não está aferrolhada pelo ambiente."}, {"n": 424, "chapter": "Personalidade", "text": "Teus parentes, teus colegas, teus amigos vão notando a mudança, e reparam que não é uma transição momentânea, que já não és o mesmo. - Não te preocupes, continua em frente! Cumpre-se o “vivit vero in me Christus” - agora é Cristo quem vive em ti."}, {"n": 425, "chapter": "Personalidade", "text": "Deves estimar os que sabem dizer-te “não”. E, além disso, pedir-lhes que te esclareçam as razões da sua negativa, para aprenderes..., ou para corrigires."}, {"n": 426, "chapter": "Personalidade", "text": "Antes eras pessimista, indeciso e apático. Agora estás totalmente transformado: sentes-te audaz, otimista, seguro de ti mesmo..., porque afinal te decidiste a buscar o teu apoio somente em Deus."}, {"n": 427, "chapter": "Personalidade", "text": "Triste situação a de uma pessoa com magníficas virtudes humanas, e com carência absoluta de sentido sobrenatural: porque facilmente aplicará aquelas virtudes apenas aos seus fins particulares. - Medita nisto."}, {"n": 428, "chapter": "Personalidade", "text": "Para ti, que desejas formar-te num mentalidade católica, universal, transcrevo algumas características: - amplidão de horizontes e um aprofundamento enérgico no que é permanentemente vivo na ortodoxia católica; - empenho reto e sadio - nunca frivolidade - em renovar as doutrinas típicas do pensamento tradicional, na filosofia e na interpretação da história...; - uma cuidadosa atenção às orientações da ciência e do pensamento contemporâneos; - e uma atitude positiva e aberta ante a transformação atual das estruturas sociais e das formas de vida."}, {"n": 429, "chapter": "Personalidade", "text": "Tens que aprender a dissentir dos outros - quando for preciso - com caridade, sem te tornares antipático."}, {"n": 430, "chapter": "Personalidade", "text": "Com graça de Deus e boa formação, podes fazer-te entender no ambiente dos mais simples... - Eles dificilmente te seguirão se te faltar “dom de línguas”: capacidade e esforço para chegar às suas inteligências."}, {"n": 431, "chapter": "Personalidade", "text": "Cortesia sempre, com todos. Mas especialmente com os que se apresentam como adversários - tu não tenhas inimigos -, quando procuras tirá-los do seu erro."}, {"n": 432, "chapter": "Personalidade", "text": "Não é verdade que te causou compaixão o menino mimado? - Pois então... não te trates tão bem a ti mesmo! Não compreendes que vais tornar-te molezinho? - Além disso, não sabes que as flores de melhor aroma são as silvestres, as que estão expostas à intempérie e à seca?"}, {"n": 433, "chapter": "Personalidade", "text": "Esse vai longe, dizem, e assusta a sua futura responsabilidade. - Ninguém lhe conhece uma atividade desinteressada, nem uma frase oportuna, nem um escrito fecundo. - É homem de vida negativa. - Dá sempre a impressão de estar submerso em profundas congeminações, embora se saiba que nunca cultivou idéias em que pensar. - Tem no rosto e nas maneiras a sisudez do mulo, e isso lhe dá fama de prudente... - Esse vai muito longe!, mas - pergunto-me - que poderá ensinar aos outros, como e em que os servirá, se não o ajudamos a mudar?"}, {"n": 434, "chapter": "Personalidade", "text": "O pedante interpreta como ignorância a simplicidade e a humildade do douto."}, {"n": 435, "chapter": "Personalidade", "text": "Não sejas desses que, quando recebem uma ordem, logo pensam na maneira de modificá-la... - Dir-se-ia que têm demasiada “personalidade”! E desunem ou desbaratam."}, {"n": 436, "chapter": "Personalidade", "text": "A experiência, o saber tanto do mundo, o ler nas entrelinhas, a perspicácia excessiva, o espírito crítico... Tudo isso que, nas tuas relações e negócios, te levou demasiado longe, ao ponto de tornar-te um pouco cínico; todo esse “excessivo realismo” - que é falta de espírito sobrenatural - invadiu até mesmo a tua vida interior. - Por não seres simples, passaste a ser às vezes frio e cruel."}, {"n": 437, "chapter": "Personalidade", "text": "No fundo és um bom rapaz, porém julgas-te Maquiavel. - Lembra-te de que no Céu se entra sendo um homem honrado e bom, não um intriguistinha maçante."}, {"n": 438, "chapter": "Personalidade", "text": "É admirável esse teu bom humor... Mas levar tudo, tudo... na brincadeira - reconhece! - significa passar dos limites. - A realidade é bem outra: como te falta vontade para tomares as tuas coisas a sério, autojustificas-te gozando dos outros, que são melhores do que tu."}, {"n": 439, "chapter": "Personalidade", "text": "Não nego que sejas esperto. Mas o arrebatamento desordenado leva-te a agir como um tolo."}, {"n": 440, "chapter": "Personalidade", "text": "Essa desigualdade do teu caráter! - Tens as teclas estragadas: dás muito bem as notas altas e baixas..., mas não soam as do meio, as da vida corrente, aquelas que habitualmente os outros escutam."}, {"n": 441, "chapter": "Personalidade", "text": "Para que aprendas. - Numa ocasião memorável, fiz notar àquele nobre varão, douto e enérgico, como arriscava - ia perder - um alto posto no seu mundo, por estar defendendo uma causa santa que os “bons” impugnavam. Com voz cheia de gravidade humana e sobrenatural, que desprezava as honras da terra, respondeu-me: “Arrisco a alma”."}, {"n": 442, "chapter": "Personalidade", "text": "O diamante lapida-se com o diamante...; e as almas, com as almas."}, {"n": 443, "chapter": "Personalidade", "text": "“Um grande sinal apareceu no Céu: uma mulher com uma coroa de doze estrelas sobre a cabeça; vestida de sol; a lua a seus pés”. - Para que tu e eu, e todos, tenhamos a certeza de que nada aperfeiçoa tanto a personalidade como a correspondência à graça. - Procura imitar a Santíssima Virgem, e serás homem - ou mulher - de uma só peça."}, {"n": 444, "chapter": "Oração", "text": "Conscientes dos nossos deveres, como podemos passar um dia inteiro sem nos lembrarmos de que temos alma? Da meditação diária deve nascer a retificação constante, para não sairmos do caminho."}, {"n": 445, "chapter": "Oração", "text": "Se se abandona a oração, primeiro vive-se das reservas espirituais..., e depois, da trapaça."}, {"n": 446, "chapter": "Oração", "text": "Meditação. - Tempo certo e a hora certa. - Senão, acabará adaptando-se à nossa comodidade: isso é falta de mortificação. E a oração sem mortificação é pouco eficaz."}, {"n": 447, "chapter": "Oração", "text": "Falta-te vida interior: porque não levas à oração as preocupações dos teus e o proselitismo; porque não te esforças por ver claro, por tirar propósitos concretos e por cumpri-los; porque não tens sentido sobrenatural no estudo, no trabalho, nas tuas conversas, no convívio com os outros... - Como andas em matéria de presença de Deus, conseqflência e manifestação da tua oração?"}, {"n": 448, "chapter": "Oração", "text": "Não?... Porque não tiveste tempo?... - Tens tempo. Além disso, como é que serão as tuas obras, se não as meditaste na presença do Senhor, para bem orientá-las? Sem essa conversa com Deus, como é que acabarás com perfeição o trabalho de cada jornada?... - Olha, é como se alegasses que te falta tempo para estudar, porque estás muito ocupado em dar uma aulas... Sem estudo, não se pode dar uma boa aula. A oração está antes de qualquer coisa. Se o entendes assim e não o pões em prática, não me digas que te falta tempo: muito simplesmente, não queres fazê-la!"}, {"n": 449, "chapter": "Oração", "text": "Oração, mais oração! - pace uma incongruência agora, em época de provas, de mais trabalho... Precisas dela: e não só da habitual, como prática de piedade; oração também durante os tempos mortos; oração entre ocupação e ocupação, em vez de deixares correr o pensamento entre bobagens. Não faz mal se - apesar do teu empenho - não consegues concentrar-te e recolher-te. Pode valer mais esta meditação do que aquela outra que fizeste, com toda a comodidade, no oratório."}, {"n": 450, "chapter": "Oração", "text": "Um costume eficaz para conseguir presença de Deus” em cada dia, a primeira audiência, com Jesus Cristo."}, {"n": 451, "chapter": "Oração", "text": "A oração não é prerrogativa de frades: é incumbência de cristãos, de homens e mulheres do mundo, que se sabem filhos de Deus."}, {"n": 452, "chapter": "Oração", "text": "Sem dúvida, deves seguir o teu caminho: homem de ação... com vocação de contemplativo."}, {"n": 453, "chapter": "Oração", "text": "Católico, sem oração?... É como um soldado sem armas."}, {"n": 454, "chapter": "Oração", "text": "Agradece ao Senhor o enorme bem que te outorgou ao fazer-te compreender que “uma só coisa é necessária”. - E, justamente com a gratidão, que não falte todos os dias a tua súplica pelos que ainda não O conhecem ou não O entenderam."}, {"n": 455, "chapter": "Oração", "text": "Quando procuravam “pescar-te”, perguntavas a ti mesmo onde é que conseguiam aquela força e aquele fogo que tudo abrasa. - Agora, que fazes oração, percebeste que essa é a fonte que ressuma em torno dos verdadeiros filhos de Deus."}, {"n": 456, "chapter": "Oração", "text": "Desprezas a meditação... Não será que tens medo, que procuras o anonimato, que não te atreves a falar com Cristo cara a cara? - Bem vês que há muitos modos de “desprezar” este meio, ainda que se afirme que se pratica."}, {"n": 457, "chapter": "Oração", "text": "Oração: é a hora das intimidades santas e das resoluções firmes."}, {"n": 458, "chapter": "Oração", "text": "Como era bem pensada a súplica daquela alma que dizia: - Senhor, não me abandones; não reparas que há “outra pessoa” que me puxa pelos pés?!"}, {"n": 459, "chapter": "Oração", "text": "Voltará o Senhor a acender-me a alma?... - Afirmavam-te que sim a tua cabeça e a força profunda de um desejo longínquo, que talvez seja esperança... - Pelo contrário, o coração e a vontade - excesso de um, falta da outra - tingem tudo de uma melancolia paralisante e hirta, como um esgar, como uma troça amarga. Escuta a promessa do Espírito Santo: “Dentro de brevíssimo tempo, virá Aquele que há de vir e não tardará. Entretanto, o meu justo viverá de fé”."}, {"n": 460, "chapter": "Oração", "text": "A verdadeira oração, aquela que absorve o indivíduo por completo, é favorecida não tanto pela solidão do deserto como pelo recolhimento interior."}, {"n": 461, "chapter": "Oração", "text": "Fizemos a oração da tarde no meio do campo, já perto do anoitecer. Devíamos ter um aspecto um tanto pitoresco, para um espectador que, não soubesse do que se tratava: sentados no chão, num silêncio apenas interrompido pela leitura de uns pontos de meditação. Essa oração em pleno campo, “pressionando com força” o Senhor por todos os que vinham conosco, pela Igreja, pelas almas, foi grata ao Céu e fecunda: qualquer lugar é apto para esse encontro com Deus."}, {"n": 462, "chapter": "Oração", "text": "Gosto de que, na oração, tenhas essa tendência de percorrer muitos quilômetros: contemplas terras diferentes daquelas que pisas; diante dos teus olhos, passa gente de outras raças; ouves línguas diversas... É como um eco daquele mandamento de Jesus: “Euntes docete omnes gentes” - ide e ensinai a todos os povos. Para chegares longe, sempre mais longe, mete esse fogo de amor nos que te rodeiam; e os teus sonhos e desejos se converterão em realidade: antes, mais e melhor!"}, {"n": 463, "chapter": "Oração", "text": "A oração transcorrerá, uma vezes, de modo discursivo; outras, talvez poucas, cheia de fervor; e, talvez muitas, seca, seca, seca... Mas o que importa é que tu, com a ajuda de Deus, não desanimes. Pensa na sentinela que está de guarda: não sabe se o Rei ou Chefe de Estado se encontra no Palácio; não está informado do que este faz e, na maioria dos casos, essa personagem não sabe quem lhe monta a guarda. - Nada disto acontece com o nosso Deus: Ele vive onde tu vives; ocupa-se de ti; conhece-te e conhece os teus pensamentos mais íntimos... Não abandones a guarda da oração!"}, {"n": 464, "chapter": "Oração", "text": "Olha que conjunto de razões sem razão te apresenta o inimigo, para que abandones a oração: “Falta-me tempo” - quando o estás perdendo continuamente -; “isto não é para mim”, “eu tenho o coração seco”... A oração não é problema de falar ou de sentir, mas de amar. E ama-se quando se faz o esforço de tentar dizer alguma coisa ao Senhor, ainda que não se diga nada."}, {"n": 465, "chapter": "Oração", "text": "“Um minuto de reza intensa; isto basta”. - Dizia isso um que nunca rezava. - Compreenderia um apaixonado que bastasse contemplar intensamente durante um minuto a pessoa amada?"}, {"n": 466, "chapter": "Oração", "text": "Este ideal de combater - e vencer - as batalhas de Cristo somente se tornará realidade pela oração e pelo sacrifício, pela Fé e pelo Amor. - Pois então... vamos orar, e crer, e sofrer, e Amar!"}, {"n": 467, "chapter": "Oração", "text": "A mortificação é a ponte levadiça, que nos permite a entrada no castelo da oração."}, {"n": 468, "chapter": "Oração", "text": "Não desfaleças: por mais indigna que seja a pessoa, por mais imperfeita que venha a ser a sua oração, se esta se eleva com humildade e perseverança, Deus a escuta sempre."}, {"n": 469, "chapter": "Oração", "text": "“Senhor, eu não mereço que me escutes, porque sou mau” - rezava uma alma penitente. E acrescenta: “Agora... escuta-me “quoniam bonus” - porque Tu és bom”."}, {"n": 470, "chapter": "Oração", "text": "O Senhor, depois de enviar os seus discípulos a pregar, reúne-os na volta e convida-os a ir com Ele a um lugar solitário para descansar... Que coisa não lhes perguntaria e contaria Jesus! Pois bem..., o Evangelho continua a ser atual."}, {"n": 471, "chapter": "Oração", "text": "Entendo-te perfeitamente quando me escreves a respeito do teu apostolado: “Vou fazer três horas de oração com a Física. Será um bombardeio para que `caia’ outra posição, que se acha do outro lado da mesa da biblioteca..., e que o senhor já conheceu quando esteve aqui”. Lembro-me da tua alegria, enquanto me ouvias dizer que entre a oração e o trabalho não deve haver solução de continuidade."}, {"n": 472, "chapter": "Oração", "text": "Comunhão dos Santos: bem a experimentou aquele jovem engenheiro, quando afirmava: “Padre, em tal dia, a tal hora, o senhor estava rezando por mim”. Esta é e será a primeira ajuda fundamental que temos de prestar às almas: a oração."}, {"n": 473, "chapter": "Oração", "text": "Habitua-te a rezar orações vocais, pela manhã, ao vestir-te, como as crianças. - E terás mais presença de Deus depois, ao longo da jornada."}, {"n": 474, "chapter": "Oração", "text": "Para que os empregam como arma a inteligência e o estudo, o terço é eficacíssimo. Porque, ao implorarem assim a Nossa Senhora, essa aparente monotonia de crianças com sua Mãe vai destruindo neles todo o germe de vanglória e de orgulho."}, {"n": 475, "chapter": "Oração", "text": "“Virgem Imaculada, bem sei que sou um pobre miserável, que não faço mais do que aumentar todos os dias o número dos meus pecados...” Disseste-me o outro dia que falavas assim com a Nossa Mãe. E aconselhei-te, com plena segurança, que rezasses o terço: bendita monotonia de ave-marias, que purifica a monotonia dos teus pecados!"}, {"n": 476, "chapter": "Oração", "text": "Uma triste forma de não rezar o terço: deixá-lo para o fim do dia. Quando se deixa para o momento de deitar-se, recita-se pelo menos de má maneira e sem meditar os mistérios. Assim, dificilmente se evita a rotina, que afoga a verdadeira piedade, a única piedade."}, {"n": 477, "chapter": "Oração", "text": "Não se pronuncia o terço somente com os lábios, mastigando uma após outra as ave-marias. Assim mussitam as beatas e os beatos. - Para um cristão, a oração vocal há de enraizar-se no coração de modo que, durante a recitação do terço, a mente possa adentrar-se na contemplação de cada um dos mistérios."}, {"n": 478, "chapter": "Oração", "text": "Sempre adias o terço para depois, e acabas por omiti-lo por causa do sono. - Se não dispõe de outros momentos, reza-o pela rua e sem que ninguém o note. Isso te ajudará também a ter presença de Deus."}, {"n": 479, "chapter": "Oração", "text": "“Reze por mim”, pedi-lhe como faço sempre. E respondeu-me espantado: “Mas está-lhe acontecendo alguma coisa?” Tive de esclarecer-lhe que a todos nos acontece ou ocorre alguma coisa em qualquer instante; e acrescentei-lhe que, quando falta a oração, “passam-se e pesam mais coisas”."}, {"n": 480, "chapter": "Oração", "text": "Renova durante o dia os teus atos de contrição: olha que se ofende a Jesus sem parar e, infelizmente, não O desagradam a esse mesmo ritmo. Por isso venho repetindo desde sempre: os atos de contrição, quantos mais melhor! Serve-me tu de eco, com a tua vida e com os teus conselhos."}, {"n": 481, "chapter": "Oração", "text": "Como enamora a cena da Anunciação! Maria - quantas vezes temos meditado nisso! - está recolhida em oração..., aplica os seus cinco sentidos e todas as suas potências na conversa com Deus. Na oração conhece a Vontade divina; e com a oração converte-a em vida da sua vida. Não esqueças o exemplo de Nossa Senhora!"}, {"n": 482, "chapter": "Trabalho", "text": "O trabalho é a vocação inicial do homem, é uma bênção de Deus, e enganam-se lamentavelmente os que o consideram um castigo. O Senhor, o melhor dos pais, colocou o primeiro homem no paraíso, “ut operaretur” - para que trabalhasse."}, {"n": 483, "chapter": "Trabalho", "text": "Estudo, trabalho: deveres ineludíveis para todo o cristão; meios para nos defendermos dos inimigos da Igreja e para atrairmos - com o nosso prestígio profissional - tantas outras almas que, sendo boas, lutam isoladamente. São arma fundamentalíssima para quem queira ser apóstolo no meio do mundo."}, {"n": 484, "chapter": "Trabalho", "text": "Peço a Deus que também te sirvam de modelo a adolescência e a juventude de Jesus, quer quando argumentava com os doutores do Templo, quer quando trabalhava na oficina de José."}, {"n": 485, "chapter": "Trabalho", "text": "Trinta e três anos de Jesus!... Trinta foram de silêncio e obscuridade; de submissão e trabalho..."}, {"n": 486, "chapter": "Trabalho", "text": "Escrevia-me aquele rapagão: “O meu ideal é tão grande que só cabe no mar”. - Respondi-lhe: E o Sacrário, tão “pequeno”? E a oficina “vulgar” de Nazaré? - Na grandeza das coisas do dia-a-dia espera-nos Ele!"}, {"n": 487, "chapter": "Trabalho", "text": "Diante de Deus, nenhuma ocupação é em si mesma grande ou pequena. Tudo adquire o valor do Amor com que se realiza."}, {"n": 488, "chapter": "Trabalho", "text": "O heroísmo do trabalho está em “acabar” cada tarefa."}, {"n": 489, "chapter": "Trabalho", "text": "Insisto: na simplicidade do teu trabalho habitual, nos detalhes monótonos de cada dia, tens que descobrir o segredo - para tantos escondido - da grandeza e da novidade: o Amor."}, {"n": 490, "chapter": "Trabalho", "text": "Está-te ajudando muito - dizes-me - este pensamento: desde os primeiros cristãos, quantos comerciantes não se terão feito santos? E queres demonstrar que também agora é possível... - O Senhor não te abandonará neste empenho."}, {"n": 491, "chapter": "Trabalho", "text": "Tu também tens uma vocação profissional que te “aguilhoa”. - Pois bem, esse “aguilhão” é o anzol para pescar homens. Retifica, portanto, a intenção, e não deixes de adquirir todo o prestígio profissional possível, a serviço de Deus e das almas. O Senhor conta também com “isso”."}, {"n": 492, "chapter": "Trabalho", "text": "Para acabar as coisas, é preciso começar a fazê-las. - Parece óbvio, mas falta - te tantas vezes esta simples decisão! E... como satanás se alegra com a tua ineficácia!"}, {"n": 493, "chapter": "Trabalho", "text": "Não se pode santificar um trabalho que humanamente seja um “lixo”, porque não devemos oferecer a Deus tarefas mal feitas."}, {"n": 494, "chapter": "Trabalho", "text": "À força de descuidar detalhes, podem tornar-se compatíveis trabalhar sem descanso e viver como um perfeito comodista."}, {"n": 495, "chapter": "Trabalho", "text": "Perguntaste o que é podias oferecer ao Senhor. - Não preciso pensar a minha resposta: as coisas de sempre, mas melhor acabadas, com um arremate de amor, que te leve a pensar mais nEle e menos em ti."}, {"n": 496, "chapter": "Trabalho", "text": "Uma missão sempre atual e heróica para um cristão comum: realizar de maneira santa os mais diversos afazeres, mesmo aqueles que parecem mais indiferentes."}, {"n": 497, "chapter": "Trabalho", "text": "Trabalhemos, e trabalhemos muito e bem, sem esquecer que a nossa melhor arma é a oração. Por isso, não me canso de repetir que temos que ser almas contemplativas no meio do mundo, que procuram converter o seu trabalho em oração."}, {"n": 498, "chapter": "Trabalho", "text": "Escreves-me na cozinha, junto ao fogão, Está começando a tarde. Faz frio. A teu lado, a tua irmãzinha - a última que descobriu a loucura divina de viver a fundo a sua vocação cristã - descasca batatas. Aparentemente - pensas - o seu trabalho é igual ao de antes. Contudo, há tanta diferença! - É verdade: antes “só” descascava batatas; agora, santifica-se descascando batatas."}, {"n": 499, "chapter": "Trabalho", "text": "Afirmas que vais compreendendo pouco a pouco o que quer dizer “alma sacerdotal”... Não te zangues se te respondo que os fatos demonstram que só o entendes em teoria. - Cada dia te acontece o mesmo: ao anoitecer, no exame, tudo são desejos e propósitos; de manhã e à tarde, no trabalho, tudo são objeções e desculpas. É assim que vives o “sacerdócio santo, para oferecer vítimas espirituais, agradáveis a Deus por Jesus Cristo”?"}, {"n": 500, "chapter": "Trabalho", "text": "Ao retomares a tua ocupação habitual, escapou-te como que um grito de protesto: sempre a mesma coisa! E eu te disse: - Sim, sempre a mesma coisa. Mas essa tarefa vulgar - igual à que realizam os teus colegas de trabalho - deve ser para ti uma contínua oração, com as mesmas palavras entranháveis, mas cada dia com música diferente. É missão muito nossa transformar a prosa desta vida em decassílabos, em poesia heróica."}, {"n": 501, "chapter": "Trabalho", "text": "Aquele “stultorum infinitus est numerus” - é infinito o número de néscios -, que se lê na Escritura, parece crescer de dia para dia. Nas funções mais diversas, nas situações mais inesperadas, encobertos sob a capa do prestígio dado pelos cargos - e até pelas “virtudes” -, quanto avoamento e quanta falta de discernimento terás de suportar! Mas não compreendo que percas por esse motivo o sentido sobrenatural da vida, e permaneças indiferente: muito baixa é a tua condição interior, se agflentas essas situações - e não há outro jeito senão agflentá-las! - por motivos humanos... Se não os ajudas a descortinar o caminho, com um trabalho responsável e bem acabado - santificado! -, fazes-te como eles - néscio -, ou és cúmplice."}, {"n": 502, "chapter": "Trabalho", "text": "Interessa que labutes, que metas ombros... Em todo o caso, coloca os afazeres profissionais no seu lugar: constituem exclusivamente meios para chegar ao fim; nunca se podem toma, nem de longe, como o fundamental. Quantas “profissionalites” impedem a união com Deus!"}, {"n": 503, "chapter": "Trabalho", "text": "Perdoa a minha insistência: o instrumento, o meio, não deve converter-se em fim. - Se, em vez do seu peso normal, uma enxada pesasse cinqflenta quilos, o lavrador, não poderia cavar com essa ferramenta, empregaria toda a sua energia em arrastá-la, e a semente não pegaria, porque ficaria sem ser usada."}, {"n": 504, "chapter": "Trabalho", "text": "Sempre aconteceu o mesmo: quem trabalha, por muito reta e limpa que seja a sua atuação, facilmente desperta ciúmes, suspicácias, invejas. - Se ocupas um posto de direção, lembra-te de que essas apreensões de alguns, a respeito de um colega concreto, não são motivo suficiente para prescindir do “visado”; mostram antes que pode ser útil em tarefas maiores."}, {"n": 505, "chapter": "Trabalho", "text": "Obstáculos?... À vezes, existem. - Mas, em algumas ocasiões, és tu que os inventas por comodismo ou por covardia. - Com que habilidade formula o diabo a aparência desses pretextos para que não trabalhes...!, porque sabe muito bem que a preguiça é a mãe de todos os vícios."}, {"n": 506, "chapter": "Trabalho", "text": "Desenvolves uma atividade incansável. Mas não procedes com ordem e, portanto, falta-te eficácia. - Fazes-me lembrar o que ouvi, certa vez, de lábios muito autorizados. Quis louvar um subordinado diante do seu superior, e comentei: Quanto trabalha! - Deram-me esta resposta: Diga antes: quanto se mexe!... - Desenvolves uma incansável atividade estéril... Quando te mexes!"}, {"n": 507, "chapter": "Trabalho", "text": "Para tirar importância ao trabalho de outro, cochichaste: não fez mais do que cumprir o seu dever. E eu acrescentei: - Parece-te pouco?... Por cumprirmos o nosso dever, o Senhor nos dá a felicidade do Céu: “Euge serve bone et fidelis... intra in gaudium Domini tui” - muito bem, servo bom e fiel, entra no gozo eterno!"}, {"n": 508, "chapter": "Trabalho", "text": "O Senhor tem o direito - e cada um de nós a obrigação - de que O glorifiquemos “em todos os instantes”. Portanto, se desperdiçamos o tampo, roubamos glória a Deus."}, {"n": 509, "chapter": "Trabalho", "text": "Bem sabes que o trabalho é urgente, e que um minuto concedido à comodidade representa um tempo subtraído à glória de Deus. - Que esperas, pois, para aproveitar conscientemente todos os instantes? Além disso, aconselho-te que consideres se esses minutos que te sobram ao longo do dia - bem somados, perfazem horas! - não obedecem à tua desordem ou à tua poltronice."}, {"n": 510, "chapter": "Trabalho", "text": "A tristeza e a intranqflilidade são proporcionais ao tempo perdido. - Quando sentires uma santa impaciência por aproveitar todos os minutos, hão de invadir - te a alegria e a paz, porque não pensarás em ti."}, {"n": 511, "chapter": "Trabalho", "text": "Preocupações?... - Eu não tenho preocupações - disse-te -, porque tenho muitas ocupações."}, {"n": 512, "chapter": "Trabalho", "text": "Passas por uma fase crítica: um certo temor vago; dificuldade em adaptar o plano de vida; um trabalho sufocante, porque não te chegam as vinte e quatro horas do dia para cumprires todas as tuas obrigações... - Experimentaste seguir o conselho do Apóstolo: “Faça-se tud
